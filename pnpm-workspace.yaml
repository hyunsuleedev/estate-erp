packages:
  - 'apps/*'
  - 'packages/*'
nodeLinker: hoisted
blockExoticSubdeps: false
allowBuilds:
  '@clerk/shared': false
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  electron: true
  electron-winstaller: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: false
