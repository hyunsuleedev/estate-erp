# 운영 서버(EC2 한 대)에서 도는 구성: Caddy(HTTPS · 리버스 프록시) + NestJS 서버.
# DB는 RDS, Redis는 ElastiCache라 여기에 없다. 배포는 scripts/deploy-server.sh가 한다(순서: docs/DEPLOY.md).
#
# EC2의 같은 폴더에 있어야 하는 것:
#   .env        배포 스크립트가 쓴다 — SERVER_IMAGE(이번에 올린 이미지), API_DOMAIN
#   .env.prod   서버의 비밀값. 사람이 한 번 올려 두고 저장소에는 올리지 않는다(틀: .env.prod.example)
#   Caddyfile
services:
  caddy:
    image: caddy:2-alpine
    container_name: estaitflow-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN이 .env에 없습니다}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서와 계정 키. 이 볼륨이 없으면 컨테이너를 다시 만들 때마다 인증서를 새로 받고,
      # Let's Encrypt의 발급 한도(같은 도메인 주 5회)에 걸리면 한동안 HTTPS가 안 된다.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

  server:
    image: ${SERVER_IMAGE:?SERVER_IMAGE가 .env에 없습니다}
    container_name: estaitflow-server
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      PORT: "3000"
      # 앞에 Caddy 한 대 — X-Forwarded-For를 한 단계만 믿는다(IP당 요청 제한이 사용자마다 따로 세어지게)
      TRUST_PROXY_HOPS: "1"
    # 바깥으로 포트를 열지 않는다. Caddy만 compose 네트워크 안에서 server:3000으로 붙는다.
    expose:
      - "3000"
    # 2GB 서버에서 Node가 메모리를 다 쓰기 전에 정리하도록 한도를 둔다
    mem_limit: 1400m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
