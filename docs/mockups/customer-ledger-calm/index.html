function dateLabel(c){if(!c.date)return '일정 미정';if(c.done)return '연락 완료';const label=c.date===TODAY?'오늘':c.date==='2026-09-16'?'내일':`${Number(c.date.slice(5,7))}월 ${Number(c.date.slice(8,10))}일`;return `${label} ${c.time||''}`.trim()}
function filtered(){const query=$('#search').value.trim().toLowerCase(),agent=$('#agent').value;let arr=customers.filter(c=>(filter==='all'||filter==='today'&&c.date===TODAY&&!c.done||c.intents.some(i=>i.type===filter))&&(agent==='all'||c.agent===agent)&&(!query||[c.name,c.phone,c.agent,c.phone.replace(/\D/g,''),...c.intents.flatMap(i=>[i.title,i.price,i.desc])].join(' ').toLowerCase().includes(query)));const sort=$('#sort').value;return arr.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name,'ko'):sort==='recent'?b.created.localeCompare(a.created)||b.id-a.id:Number(a.done)-Number(b.done)||(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'').localeCompare(b.time||''))}
function renderList(){['all','today','sell','buy'].forEach(type=>{$('#count-'+type).textContent=customers.filter(c=>type==='all'||type==='today'&&c.date===TODAY&&!c.done||c.intents.some(i=>i.type===type)).length});document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.filter===filter);b.setAttribute('aria-selected',String(b.dataset.filter===filter))});const visible=filtered();$('#visible-count').textContent=`고객 ${visible.length}명${visible.length!==customers.length?' / 전체 '+customers.length+'명':''}`;$('#customer-list').innerHTML=visible.length?visible.map(c=>`<button class="customer-row ${c.id===selected?'selected':''}" data-customer="${c.id}" aria-label="${esc(c.name)} 고객 상세 보기" aria-pressed="${c.id===selected}"><span class="person"><span class="avatar tone${c.tone}">${esc(c.name.slice(0,1))}</span><span><span class="customer-name">${esc(c.name)}</span><span class="person-meta">${esc(c.phone||'연락처 미등록')}</span></span></span><span class="intents">${c.intents.map(i=>`<span class="intent-line"><span class="intent-label ${i.type==='buy'?'buy':''}">${i.type==='buy'?'구함':'내놓음'}</span><span class="intent-summary" title="${esc(i.title+' · '+i.price)}"><span class="intent-title">${esc(i.short||i.title)}</span><b>${esc(i.price)}</b></span></span>`).join('')}</span><span class="task-summary"><span class="task-title">${esc(c.task||'다음 연락을 잡아보세요')}</span><span class="task-time ${c.done?'done':c.date===TODAY?'today':''}">${icon(c.done?'check':'clock')}${esc(dateLabel(c))}</span></span>${icon('chevron','row-arrow')}</button>`).join(''):`<div class="empty">${icon('search')}<strong>조건에 맞는 고객이 없어요</strong><p>다른 이름으로 검색하거나 필터를 초기화해 보세요.</p><button class="button" id="reset-filters">필터 초기화</button></div>`;document.querySelectorAll('[data-customer]').forEach(b=>b.addEventListener('click',()=>selectCustomer(Number(b.dataset.customer),b)));$('#reset-filters')?.addEventListener('click',()=>{$('#search').value='';$('#agent').value='all';filter='all';renderList()})}
function selectCustomer(id,trigger){selected=id;detailTab='overview';returnFocus=trigger;renderList();renderDetail();if(matchMedia('(max-width:1160px)').matches){$('#detail').classList.add('mobile-open');$('#detail').setAttribute('role','dialog');$('#detail').setAttribute('aria-modal','true');$('#backdrop').hidden=false;$('.main').inert=true;$('.sidebar').inert=true;/* detail is inside main; isolate its siblings instead */$('.main').inert=false;[...$('.main').children].filter(x=>!x.classList.contains('workspace-grid')).forEach(x=>x.inert=true);$('.ledger').inert=true;$('#detail-close').focus()}}
function closeDetail(){const wasOpen=$('#detail').classList.contains('mobile-open');$('#detail').classList.remove('mobile-open');$('#detail').removeAttribute('role');$('#detail').removeAttribute('aria-modal');$('#backdrop').hidden=true;$('.sidebar').inert=false;[...$('.main').children].forEach(x=>x.inert=false);$('.ledger').inert=false;if(wasOpen)document.querySelector(`[data-customer="${selected}"]`)?.focus()}
function renderDetail(){const c=current();if(!c)return;$('#detail').innerHTML=`<div class="detail-top"><div class="detail-eyebrow"><span>고객 상세</span><div class="detail-tools"><button class="icon-button ${c.favorite?'favorite':''}" id="favorite" aria-label="${c.favorite?'관심 고객 해제':'관심 고객 지정'}" aria-pressed="${!!c.favorite}" title="관심 고객">${icon('star')}</button><button class="icon-button detail-close" id="detail-close" aria-label="고객 상세 닫기">${icon('close')}</button></div></div><div class="detail-name"><span class="avatar tone${c.tone}">${esc(c.name.slice(0,1))}</span><div><h2>${esc(c.name)}</h2><p>${esc(c.relation||'새로운 고객')}</p></div></div><div class="contact-number">${icon('phone')}<span>${esc(c.phone||'연락처 미등록')}</span>${c.phone?`<button class="icon-button" id="copy-phone" aria-label="전화번호 복사">${icon('copy')}</button>`:''}</div><div class="contact-actions"><button class="button primary" id="write-note">${icon('note')}상담 기록</button><button class="button" id="schedule">${icon('calendar')}연락 일정</button></div></div><div class="detail-tabs" role="tablist" aria-label="고객 상세 보기"><button role="tab" data-detail-tab="overview" aria-selected="${detailTab==='overview'}" class="${detailTab==='overview'?'active':''}">의뢰</button><button role="tab" data-detail-tab="history" aria-selected="${detailTab==='history'}" class="${detailTab==='history'?'active':''}">상담 기록 <span style="color:#8fa295;margin-left:3px">${c.notes.length}</span></button></div><div class="detail-body">${detailTab==='overview'?`<div class="next-box ${c.done?'completed':''}"><div class="next-top"><span>다음 할 일</span><button id="edit-schedule">변경</button></div><div class="next-task"><button class="check-button" id="complete-task" ${!c.task?'disabled':''} aria-label="${c.done?'연락 완료 취소':'다음 할 일 완료'}" aria-pressed="${c.done}">${c.done?icon('check'):''}</button><div><strong>${esc(c.task||'연락 일정을 잡아보세요')}</strong><small>${esc(dateLabel(c))}</small></div></div></div><div class="section-title">진행 중인 의뢰 <small>${c.intents.length}건</small></div>${c.intents.map(i=>`<article class="deal-card"><div class="deal-card-heading"><span class="intent-label ${i.type==='buy'?'buy':''}">${i.type==='buy'?'구함':'내놓음'}</span><span class="deal-status">${esc(i.stage)}</span></div><h3>${esc(i.title)}</h3><p>${esc(i.desc)}</p><p class="deal-price">${esc(i.price||'가격 협의')}</p><div class="deal-meta">${icon('person')}담당 ${esc(c.agent)}<span class="visit-count">매칭 ${i.matches||0}건</span></div></article>`).join('')}${c.notes.length?`<section class="record-preview"><div class="section-title">최근 상담 <small>${esc(c.notes[0].date)}</small></div><p>${esc(c.notes[0].text)}</p></section>`:''}`:`<div class="timeline">${c.notes.length?c.notes.map(n=>`<article class="timeline-item"><span class="record-date">${esc(n.date)} ${esc(n.time)}</span><span class="timeline-type">${esc(n.type)}</span><p>${esc(n.text)}</p></article>`).join(''):'<p class="no-record">첫 상담 내용을 남겨보세요.</p>'}</div>`}<form class="note-form" id="note-form" ${detailTab!=='history'?'hidden':''}><label for="note">상담 메모</label><textarea id="note" maxlength="1500" placeholder="고객과 나눈 이야기, 기억할 내용을 적어보세요." required></textarea><div class="note-actions"><span>⌘ Enter로 기록</span><button type="submit" class="button" id="save-note" disabled>기록하기</button></div></form></div><div class="detail-footer"><span>담당 ${esc(c.agent)}</span><span>${esc(c.created.replaceAll('-','.'))} 등록</span></div>`;$('#favorite').onclick=()=>{c.favorite=!c.favorite;save();renderDetail();$('#favorite').focus();notify(c.favorite?'관심 고객으로 지정했어요.':'관심 고객 지정을 해제했어요.')};$('#detail-close').onclick=closeDetail;$('#copy-phone')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(c.phone);notify('전화번호를 복사했어요.')}catch{notify('복사가 제한되어 있어요. 표시된 번호를 선택해 복사하세요.')}});$('#write-note').onclick=()=>{detailTab='history';renderDetail();$('#note').focus();$('#note').scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'})};$('#schedule').onclick=openSchedule;$('#edit-schedule')?.addEventListener('click',openSchedule);$('#complete-task')?.addEventListener('click',()=>{c.done=!c.done;save();renderList();renderDetail();$('#complete-task')?.focus();notify(c.done?'다음 할 일을 완료했어요.':'연락할 일로 다시 열었어요.')});document.querySelectorAll('[data-detail-tab]').forEach(b=>b.onclick=()=>{detailTab=b.dataset.detailTab;renderDetail();document.querySelector(`[data-detail-tab="${detailTab}"]`).focus()});$('#note').oninput=()=>$('#save-note').disabled=!$('#note').value.trim();$('#note').onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&$('#note').value.trim()){e.preventDefault();$('#note-form').requestSubmit()}};$('#note-form').onsubmit=e=>{e.preventDefault();const text=$('#note').value.trim();if(!text)return;const now=new Date();c.notes.unshift({date:'9월 15일',time:now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}),text,type:'상담 메모'});const persisted=save();detailTab='history';renderDetail();$('#note').focus();if(persisted)notify('상담 기록을 저장했어요.')}}
function openSchedule(){const c=current();$('#schedule-person').textContent=`${c.name} 님에게 연락할 일을 기록하세요.`;$('#schedule-task').value=c.task||'';$('#schedule-date').value=c.date||TODAY;$('#schedule-time').value=c.time||'14:00';$('#schedule-dialog').showModal()}
$('#schedule-form').onsubmit=e=>{e.preventDefault();const c=current();c.task=$('#schedule-task').value.trim();if(!c.task){$('#schedule-task').setCustomValidity('할 일을 입력해 주세요.');$('#schedule-task').reportValidity();return}c.date=$('#schedule-date').value;c.time=$('#schedule-time').value;c.done=false;save();$('#schedule-dialog').close();renderList();renderDetail();notify('다음 연락 일정을 저장했어요.')};$('#schedule-task').oninput=()=>$('#schedule-task').setCustomValidity('');
$('#add-customer').onclick=()=>{$('#customer-form').reset();$('#customer-dialog').showModal()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).close());document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{const r=d.getBoundingClientRect();if(e.target===d&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))d.close()}));
$('#customer-form').onsubmit=e=>{e.preventDefault();const name=$('#new-name').value.trim(),title=$('#new-interest').value.trim();if(!name||!title){notify('이름과 의뢰 내용을 입력해 주세요.');return}const c={id:Date.now(),name,phone:$('#new-phone').value.trim(),agent:$('#new-agent').value,created:TODAY,tone:customers.length%5,relation:'새로 등록한 고객',task:'',date:'',time:'',done:false,intents:[{type:$('#new-type').value,title,short:title,price:$('#new-budget').value.trim()||'가격 협의',desc:'상담하며 조건을 구체화해 보세요.',stage:'새 의뢰',matches:0}],notes:[]};customers.unshift(c);save();$('#customer-dialog').close();filter='all';$('#search').value='';$('#agent').value='all';$('#sort').value='recent';selected=c.id;renderList();selectCustomer(c.id);notify(`${name} 님을 고객원장에 추가했어요.`)};
$('#search').oninput=renderList;$('#agent').onchange=renderList;$('#sort').onchange=renderList;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderList()});$('#backdrop').onclick=closeDetail;
document.addEventListener('keydown',e=>{const typing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);if(e.key==='/'&&!typing&&!document.querySelector('dialog[open]')&&!$('#detail').classList.contains('mobile-open')){e.preventDefault();$('#search').focus()}if(e.key==='Escape'&&!document.querySelector('dialog[open]'))closeDetail();if(e.key==='Tab'&&$('#detail').classList.contains('mobile-open')&&!document.querySelector('dialog[open]')){const items=[...$('#detail').querySelectorAll('button:not([disabled]),textarea,input,select')].filter(el=>el.getClientRects().length);const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
matchMedia('(max-width:1160px)').addEventListener('change',()=>closeDetail());
document.addEventListener('keydown',e=>{const tab=e.target.closest('[role=tab]');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const list=[...tab.closest('[role=tablist]').querySelectorAll('[role=tab]')];let index=list.indexOf(tab);index=e.key==='Home'?0:e.key==='End'?list.length-1:(index+(e.key==='ArrowRight'?1:-1)+list.length)%list.length;list[index].click();if(list[index].isConnected)list[index].focus()});
renderList();renderDetail();
</script>
</body>
