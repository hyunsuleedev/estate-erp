<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대시보드 리디자인 4종 비교 — Estait Flow</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./shared-shell.css">
<style>
  body {
    overflow: auto;
    background: var(--muted);
  }
  .hub-wrap {
    max-width: 1480px;
    margin: 0 auto;
    padding: 20px 22px 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .hub-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .hub-title {
    font-size: 20px;
    line-height: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--fg);
  }
  .hub-sub {
    font-size: 13px;
    color: var(--fg2);
    margin-top: 2px;
  }
  .hub-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--fg3);
  }

  .cards-4 {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
  }
  .v-card {
    background: var(--bg);
    border-radius: 12px;
    box-shadow: var(--shadow-card);
    padding: 13px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: box-shadow 180ms ease, transform 180ms var(--ease-out);
  }
  .v-card:hover {
    box-shadow: var(--shadow-card-hover);
    transform: translateY(-1px);
  }
  .v-card.active {
    box-shadow: 0 0 0 1.8px var(--fg), 0 8px 20px -10px rgba(42, 28, 0, 0.2);
  }
  .v-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .v-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
  }
  .v-wf {
    width: 100%;
    height: auto;
    border-radius: 7px;
    background: var(--muted);
    border: 1px solid var(--border);
    display: block;
  }
  .v-desc {
    font-size: 12px;
    line-height: 17px;
    color: var(--fg2);
    flex: 1;
  }
  .v-fit {
    font-size: 11px;
    color: var(--fg3);
  }
  .v-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-top: 2px;
  }

  .viewer-box {
    background: var(--bg);
    border-radius: 14px;
    box-shadow: var(--shadow-card);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .viewer-bar {
    height: 44px;
    padding: 0 14px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .viewer-tabs {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--muted);
    padding: 3px;
    border-radius: 8px;
  }
  .v-tab {
    height: 26px;
    padding: 0 10px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--fg2);
    transition: background-color 140ms ease, color 140ms ease;
  }
  .v-tab[aria-selected='true'] {
    background: var(--bg);
    color: var(--fg);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }
  .viewer-controls {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .viewer-stage {
    background: #eceae6;
    padding: 12px;
    display: flex;
    justify-content: center;
    overflow-x: auto;
  }
  .frame-shell {
    width: 100%;
    height: 820px;
    background: var(--bg);
    border-radius: 10px;
    box-shadow: var(--shadow-pop);
    overflow: hidden;
    transition: width 220ms var(--ease-out);
  }
  .frame-shell iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  @media (max-width: 1120px) {
    .cards-4 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
  @media (max-width: 680px) {
    .cards-4 {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<div class="hub-wrap">
  <header class="hub-head">
    <div>
      <h1 class="hub-title">대시보드 리디자인 4종 비교</h1>
      <p class="hub-sub">상단 애니메이션 날씨판(Briefing + DashboardScene)은 그대로 유지하고, 아래 작업 영역의 정보 구조·밀도·처리 흐름만 4가지 방향으로 재설계했습니다.</p>
    </div>
    <div class="hub-meta">
      <span class="badge" data-tone="info">상단 히어로 공통 유지</span>
      <span class="badge" data-tone="gray">준비 중 문구 제거</span>
      <span class="badge" data-tone="success">동일 ERP 데이터 연동</span>
    </div>
  </header>

  <section class="cards-4" id="cardsGrid" aria-label="4가지 시안 비교 카드"></section>

  <section class="viewer-box" aria-label="라이브 전환 프리뷰어">
    <div class="viewer-bar">
      <div class="viewer-tabs" id="viewerTabs" role="tablist"></div>
      <div class="viewer-controls">
        <span style="font-size:12px;color:var(--fg3);margin-right:2px">미리보기 폭</span>
        <button type="button" class="btn btn-xs btn-primary" data-width="full">전체 폭</button>
        <button type="button" class="btn btn-xs btn-outline" data-width="1440">1440px</button>
        <button type="button" class="btn btn-xs btn-outline" data-width="1200">1200px</button>
        <a id="openDirectLink" href="./v1-bento-desk.html" target="_blank" rel="noopener" class="btn btn-xs btn-outline" style="margin-left:6px">새 탭으로 열기 ↗</a>
      </div>
    </div>
    <div class="viewer-stage">
      <div class="frame-shell" id="frameShell">
        <iframe id="previewFrame" title="대시보드 시안 미리보기" src="./v1-bento-desk.html?embed=1"></iframe>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
  'use strict';

  const VARIANTS = [
    {
      id: 'v1',
      file: './v1-bento-desk.html',
      short: 'V1 벤토 데스크',
      title: 'V1 · 모듈러 벤토 데스크',
      tag: '균형 · 카드형',
      tone: 'info',
      desc: '4열 KPI 펄스 바 아래로 일정·할 일(7)과 진행 거래(5), 하단 3열 오피스 레이더(매물확인·통화·공지)를 정돈된 카드로 배치.',
      fit: '추천: 하루 전체 지표와 할 일을 고르게 살피는 표준 데스크',
      wf: `
        <rect x="6" y="6" width="228" height="26" rx="4" fill="#d3e5ef" stroke="#2383e2" stroke-opacity=".35"/>
        <rect x="6" y="37" width="53" height="18" rx="3" fill="#fff" stroke="#e6e5e3"/>
        <rect x="64" y="37" width="53" height="18" rx="3" fill="#fff" stroke="#e6e5e3"/>
        <rect x="122" y="37" width="54" height="18" rx="3" fill="#fff" stroke="#e6e5e3"/>
        <rect x="181" y="37" width="53" height="18" rx="3" fill="#fff" stroke="#e6e5e3"/>
        <rect x="6" y="60" width="128" height="44" rx="4" fill="#fff" stroke="#e6e5e3"/>
        <rect x="139" y="60" width="95" height="44" rx="4" fill="#fff" stroke="#e6e5e3"/>
        <rect x="6" y="109" width="73" height="25" rx="3" fill="#fff" stroke="#e6e5e3"/>
        <rect x="83" y="109" width="74" height="25" rx="3" fill="#fff" stroke="#e6e5e3"/>
        <rect x="161" y="109" width="73" height="25" rx="3" fill="#fff" stroke="#e6e5e3"/>
      `,
    },
    {
      id: 'v2',
      file: './v2-command-split.html',
      short: 'V2 커맨드 워크벤치',
      title: 'V2 · 커맨드 워크벤치',
      tag: '처리 속도 · 3분할',
      tone: 'violet',
      desc: '좌측 통합 액션 큐(할일+확인+통화), 중앙 주간·거래 타임라인, 우측 상시 라이브 인스펙터로 페이지 이동 없이 즉시 처리.',
      fit: '추천: 아침마다 밀린 업무와 확인 요청을 빠르게 쳐내는 실무자',
      wf: `
        <rect x="6" y="6" width="228" height="26" rx="4" fill="#d3e5ef" stroke="#2383e2" stroke-opacity=".35"/>
        <rect x="6" y="37" width="228" height="8" rx="2" fill="#ffe2dd"/>
        <rect x="6" y="50" width="66" height="84" rx="4" fill="#fff" stroke="#e6e5e3"/>
        <rect x="77" y="50" width="88" height="84" rx="4" fill="#fff" stroke="#e6e5e3"/>
        <rect x="170" y="50" width="64" height="84" rx="4" fill="#fff" stroke="#2383e2" stroke-opacity=".45"/>
      `,
    },
    {
      id: 'v3',
      file: './v3-brokerage-rail.html',
      short: 'V3 에디토리얼 레일',
      title: 'V3 · 에디토리얼 타임라인 & 브리핑',
      tag: '가독성 · 여백과 선',
      tone: 'orange',
      desc: '상단 09~19시 시간축 리본 아래, 테두리를 걷어낸 좌측 실행 리스트·거래 원장과 우측 따뜻한 브리핑 레일을 대비시킨 에디토리얼 톤.',
      fit: '추천: Estait Flow의 차분한 Notion 결을 유지하면서 답답함을 깨고 싶을 때',
      wf: `
        <rect x="6" y="6" width="228" height="26" rx="4" fill="#d3e5ef" stroke="#2383e2" stroke-opacity=".35"/>
        <rect x="6" y="37" width="228" height="14" rx="3" fill="#fff" stroke="#e6e5e3"/>
        <rect x="6" y="56" width="140" height="36" rx="2" fill="#fff" stroke="#e6e5e3"/>
        <rect x="6" y="96" width="140" height="38" rx="2" fill="#fff" stroke="#e6e5e3"/>
        <rect x="152" y="56" width="82" height="78" rx="5" fill="#f1f1ef" stroke="#e6e5e3"/>
      `,
    },
    {
      id: 'v4',
      file: './v4-studio-board.html',
      short: 'V4 중개 관제 보드',
      title: 'V4 · 중개 파이프라인 관제 보드',
      tag: '파이프라인 · 팀 관제',
      tone: 'success',
      desc: '좌측 데일리 도크(일정·할 일)를 고정하고, 우측에 매물→매칭→거래→수금 4단계 퍼널과 3컬럼 거래 칸반 보드, 광고 레이더를 배치.',
      fit: '추천: 대표/팀장 관점에서 계약 파이프라인과 사무소 흐름을 관제할 때',
      wf: `
        <rect x="6" y="6" width="228" height="26" rx="4" fill="#d3e5ef" stroke="#2383e2" stroke-opacity=".35"/>
        <rect x="6" y="37" width="58" height="97" rx="4" fill="#f1f1ef" stroke="#e6e5e3"/>
        <rect x="69" y="37" width="165" height="20" rx="3" fill="#fff" stroke="#e6e5e3"/>
        <rect x="69" y="61" width="52" height="44" rx="3" fill="#fff" stroke="#e6e5e3"/>
        <rect x="125" y="61" width="53" height="44" rx="3" fill="#fff" stroke="#e6e5e3"/>
        <rect x="182" y="61" width="52" height="44" rx="3" fill="#fff" stroke="#e6e5e3"/>
        <rect x="69" y="109" width="80" height="25" rx="3" fill="#fff" stroke="#e6e5e3"/>
        <rect x="154" y="109" width="80" height="25" rx="3" fill="#fff" stroke="#e6e5e3"/>
      `,
    },
  ];

  let activeId = 'v1';
  let previewWidth = 'full';

  const cardsGrid = document.getElementById('cardsGrid');
  const viewerTabs = document.getElementById('viewerTabs');
  const previewFrame = document.getElementById('previewFrame');
  const frameShell = document.getElementById('frameShell');
  const openDirectLink = document.getElementById('openDirectLink');

  function render() {
    cardsGrid.innerHTML = VARIANTS.map(
      (v) => `
      <article class="v-card${v.id === activeId ? ' active' : ''}">
        <div class="v-top">
          <span class="v-name">${v.title}</span>
          <span class="badge sm" data-tone="${v.tone}">${v.tag}</span>
        </div>
        <svg class="v-wf" viewBox="0 0 240 140" aria-hidden="true">${v.wf}</svg>
        <p class="v-desc">${v.desc}</p>
        <div class="v-fit">${v.fit}</div>
        <div class="v-actions">
          <button type="button" class="btn btn-xs ${v.id === activeId ? 'btn-primary' : 'btn-outline'}" data-select-v="${v.id}" style="flex:1">
            ${v.id === activeId ? '아래에서 보는 중' : '아래에서 바로 보기'}
          </button>
          <a href="${v.file}" target="_blank" rel="noopener" class="btn btn-xs btn-outline">새 탭 ↗</a>
        </div>
      </article>`,
    ).join('');

    viewerTabs.innerHTML = VARIANTS.map(
      (v) => `
      <button type="button" class="v-tab" role="tab" aria-selected="${v.id === activeId}" data-select-v="${v.id}">${v.short}</button>`,
    ).join('');

    const current = VARIANTS.find((v) => v.id === activeId) || VARIANTS[0];
    const targetSrc = `${current.file}?embed=1`;
    if (previewFrame.getAttribute('src') !== targetSrc) {
      previewFrame.setAttribute('src', targetSrc);
    }
    openDirectLink.setAttribute('href', current.file);

    document.querySelectorAll('[data-select-v]').forEach((btn) =>
      btn.addEventListener('click', () => {
        activeId = btn.dataset.selectV;
        render();
      }),
    );
  }

  document.querySelectorAll('[data-width]').forEach((btn) =>
    btn.addEventListener('click', () => {
      previewWidth = btn.dataset.width;
      document.querySelectorAll('[data-width]').forEach((b) => {
        b.className = `btn btn-xs ${b.dataset.width === previewWidth ? 'btn-primary' : 'btn-outline'}`;
      });
      frameShell.style.width = previewWidth === 'full' ? '100%' : `${previewWidth}px`;
    }),
  );

  render();
})();
</script>
</body>
</html>
