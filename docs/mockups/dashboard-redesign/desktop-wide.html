<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estait Flow · 3단 풀화면 대시보드</title>
<link rel="stylesheet" href="./shared-hero.css">
<link rel="stylesheet" href="./shared-desktop-chrome.css">
<style>
  /* Container query watches workspace inline width: hides right rail when sidebar
     expands at desktop widths or viewport drops below 1260px */
  #ntHomeView {
    container-type: inline-size;
    container-name: nt-canvas;
  }

  .wd-wrap {
    width: 100%;
    max-width: 1560px;
    margin: 0 auto;
    padding: 16px 24px 52px;
  }
  .wd-hero-gap {
    width: 100%;
    min-width: 0;
    margin-bottom: 16px;
  }
  .wd-wrap .dash-hero {
    border-radius: 14px;
  }

  .wd-grid {
    display: grid;
    grid-template-columns: 308px minmax(0, 1fr) 276px;
    column-gap: 18px;
    align-items: start;
  }

  .wd-card {
    background: var(--bg);
    border-radius: 14px;
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(15, 15, 15, 0.03);
  }

  /* =========================================================
     Left Column: Monthly Mini Calendar + Connected Schedule Cards
     ========================================================= */
  .wd-left {
    position: sticky;
    top: 18px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .wd-cal-card {
    padding: 15px 15px 13px;
  }
  .wd-sched-card {
    padding: 15px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .wd-upcoming-sec {
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .wd-cal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .wd-cal-month {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--fg);
    letter-spacing: -0.015em;
  }
  .wd-cal-nav {
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }
  .wd-cal-btn {
    height: 22px;
    min-width: 22px;
    padding: 0 5px;
    border-radius: 5px;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--fg2);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background-color 110ms ease, color 110ms ease;
  }
  .wd-cal-btn:hover {
    background: rgba(55, 53, 47, 0.08);
    color: var(--fg);
  }

  .wd-cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 2px;
    margin-bottom: 4px;
    text-align: center;
    font-size: 11px;
    font-weight: 500;
    color: var(--fg3);
  }
  .wd-cal-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 2px;
  }
  .wd-cal-day {
    height: 32px;
    border-radius: 7px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 12px;
    color: var(--fg);
    position: relative;
    transition: background-color 110ms ease, color 110ms ease;
  }
  .wd-cal-day:hover {
    background: rgba(55, 53, 47, 0.065);
  }
  .wd-cal-day.is-out {
    opacity: 0.32;
  }
  .wd-cal-num {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: inline-grid;
    place-items: center;
    line-height: 1;
  }
  .wd-cal-day.is-today:not(.is-selected) .wd-cal-num {
    background: rgba(235, 87, 87, 0.14);
    color: var(--notion-today);
    font-weight: 700;
  }
  .wd-cal-day.is-selected .wd-cal-num {
    background: var(--fg);
    color: #ffffff;
    font-weight: 700;
  }
  .wd-cal-day.is-today.is-selected .wd-cal-num {
    background: var(--notion-today);
    color: #ffffff;
    font-weight: 700;
  }
  .wd-cal-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: transparent;
  }
  .wd-cal-dot.has {
    background: rgba(55, 53, 47, 0.42);
  }
  .wd-cal-day.is-today .wd-cal-dot.has {
    background: var(--notion-today);
  }

  .wd-subhead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    padding-bottom: 6px;
    margin: 0 0 8px;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--fg);
  }
  .wd-subhead-count {
    font-size: 11.5px;
    font-weight: 400;
    color: var(--fg3);
  }

  /* Paper Vertical Timeline */
  .wd-timeline {
    position: relative;
    padding-left: 15px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .wd-timeline::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 8px;
    bottom: 8px;
    width: 1px;
    background: var(--border-strong);
  }
  .wd-tl-item {
    position: relative;
    width: 100%;
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 5px 7px;
    border-radius: 7px;
    text-align: left;
    transition: background-color 110ms ease;
  }
  .wd-tl-item:hover {
    background: var(--hover);
  }
  .wd-tl-dot {
    position: absolute;
    left: -14px;
    top: 10px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--orange);
    box-shadow: 0 0 0 3px var(--bg);
  }
  .wd-tl-dot.meeting { background: var(--blue); }
  .wd-tl-dot.contract { background: var(--violet); }

  .wd-upcoming-row {
    width: 100%;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 6px 6px;
    margin: 0 -6px;
    border-radius: 7px;
    text-align: left;
    transition: background-color 110ms ease;
  }
  .wd-upcoming-row:hover {
    background: var(--hover);
  }
  .wd-upcoming-date {
    width: 44px;
    flex: none;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--fg3);
    padding-top: 1px;
  }
  .wd-upcoming-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-top: 6px;
    flex: none;
    background: var(--orange);
  }
  .wd-upcoming-dot.meeting { background: var(--blue); }
  .wd-upcoming-dot.contract { background: var(--violet); }

  /* =========================================================
     Center Column: Bento Card Stacks (Tasks + Deals + Signals)
     ========================================================= */
  .wd-center {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .wd-center-card {
    padding: 16px 18px 10px;
  }
  .wd-center-card.compact {
    padding: 10px 14px;
  }

  .wd-h2 {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    margin: 0 0 10px;
  }
  .wd-h2-left {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
  }
  .wd-h2-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--fg);
  }
  .wd-h2-meta {
    font-size: 12px;
    font-weight: 400;
    color: var(--fg3);
  }
  .wd-scope-caption {
    font-size: 12px;
    color: var(--fg3);
  }
  .wd-link-btn {
    height: 24px;
    padding: 0 6px;
    margin-right: -4px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--fg3);
    transition: background-color 120ms ease, color 120ms ease;
  }
  .wd-link-btn:hover {
    background: var(--hover);
    color: var(--fg);
  }

  /* Compact triggers shown ONLY when right margin rail hides */
  .wd-compact-actions {
    display: none;
    align-items: center;
    gap: 6px;
    flex: none;
  }
  .n2-compact-pill {
    height: 26px;
    padding: 0 9px;
    border-radius: 6px;
    background: var(--bg-soft);
    color: var(--fg2);
    font-size: 12px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    transition: background-color 120ms ease, color 120ms ease;
  }
  .n2-compact-pill:hover {
    background: rgba(55, 53, 47, 0.08);
    color: var(--fg);
  }

  .wd-group-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 4px;
    margin-top: 4px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--fg2);
  }
  .wd-group-btn:hover {
    background: var(--hover);
  }

  /* Paper To-Do Checklists */
  .n2-todo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    border-radius: 7px;
    cursor: pointer;
    transition: background-color 110ms ease;
  }
  .n2-todo:hover {
    background: var(--hover);
  }
  .n2-todo-act {
    opacity: 0;
    transition: opacity 110ms ease;
  }
  .n2-todo:hover .n2-todo-act {
    opacity: 1;
  }

  /* Notion Inline Database List View for Deals */
  .n2-db-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 86px 120px 126px;
    align-items: center;
    gap: 10px;
    padding: 8px 8px;
    border-radius: 7px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background-color 110ms ease;
  }
  .n2-db-row:last-child {
    border-bottom: 0;
  }
  .n2-db-row:hover {
    background: var(--hover);
  }

  /* Consultation Rows inside Center Bento Card */
  .wd-consult-row {
    width: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 8px;
    border-radius: 8px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    transition: background-color 110ms ease;
  }
  .wd-consult-row:last-child {
    border-bottom: 0;
  }
  .wd-consult-row:hover {
    background: var(--hover);
  }
  .wd-consult-main {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .wd-consult-top {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .wd-consult-summary {
    font-size: 12.5px;
    color: var(--fg2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .wd-consult-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
    flex: none;
  }

  /* =========================================================
     Right Sticky Margin Rail (White Bento Cards + Guide Banner)
     ========================================================= */
  .wd-rail {
    position: sticky;
    top: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
  }

  .n2-side-card {
    padding: 13px 15px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .n2-cash-card {
    width: 100%;
    flex-direction: row;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    text-align: left;
    transition: border-color 140ms ease, background-color 140ms ease;
  }
  .n2-cash-card:hover {
    border-color: var(--border-strong);
    background: var(--bg-card-hover);
  }

  .n2-rail-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--fg3);
  }

  .n2-tl-feed {
    border-left: 1px solid rgba(55, 53, 47, 0.11);
    margin-left: 4px;
    padding-left: 12px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .n2-tl-entry {
    position: relative;
    width: 100%;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-radius: 5px;
    transition: color 120ms ease;
  }
  .n2-tl-entry::before {
    content: "";
    position: absolute;
    left: -16px;
    top: 5px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #c8c6c1;
    box-shadow: 0 0 0 3px #ffffff;
  }
  .n2-tl-entry.unread::before {
    background: var(--blue);
  }

  .n2-rail-row {
    width: 100%;
    padding: 4px 7px;
    margin: 0 -7px;
    border-radius: 7px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    text-align: left;
    transition: background-color 120ms ease;
  }
  .n2-rail-row:hover {
    background: rgba(55, 53, 47, 0.05);
  }
  .n2-rail-title {
    font-size: 12.5px;
    line-height: 1.38;
    color: #5f5e59;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    transition: color 120ms ease;
  }
  .n2-tl-entry:hover .n2-rail-title,
  .n2-rail-row:hover .n2-rail-title {
    color: var(--fg);
  }
  .n2-rail-meta {
    font-size: 11px;
    color: var(--fg3);
  }
  .n2-rail-more {
    align-self: flex-start;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--fg3);
    padding: 2px 4px;
    margin: -2px -4px 0;
    border-radius: 5px;
  }
  .n2-rail-more:hover {
    color: var(--fg);
    background: rgba(55, 53, 47, 0.055);
  }

  /* Editorial Community-Board Style App Guide Spotlight Banner */
  .wd-guide-banner {
    border-radius: 14px;
    padding: 13px 15px 12px;
    color: #ffffff;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 5px;
    user-select: none;
    box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
    transition: transform 150ms var(--ease-out), box-shadow 150ms ease;
  }
  .wd-guide-banner.is-slate {
    background: linear-gradient(135deg, #1e293b 0%, #2c3e5e 60%, #3a4f75 100%);
  }
  .wd-guide-banner.is-forest {
    background: linear-gradient(135deg, #133830 0%, #1c5447 62%, #246858 100%);
  }
  .wd-guide-banner.is-stone {
    background: linear-gradient(135deg, #2d2926 0%, #443e37 62%, #574f46 100%);
  }
  @media (hover: hover) and (pointer: fine) {
    .wd-guide-banner:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.14);
    }
  }
  .wd-banner-svg {
    position: absolute;
    right: -6px;
    bottom: -10px;
    width: 78px;
    height: 78px;
    pointer-events: none;
    opacity: 0.16;
  }
  .wd-banner-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    position: relative;
    z-index: 1;
  }
  .wd-banner-badge {
    display: inline-flex;
    align-items: center;
    height: 18px;
    padding: 0 6px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.16);
    color: rgba(255, 255, 255, 0.94);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .wd-banner-dots {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .wd-banner-dot {
    width: 5px;
    height: 5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.36);
    transition: width 160ms var(--ease-out), background-color 140ms ease;
  }
  .wd-banner-dot:hover {
    background: rgba(255, 255, 255, 0.72);
  }
  .wd-banner-dot.active {
    width: 14px;
    background: rgba(255, 255, 255, 0.94);
  }
  .wd-banner-title {
    font-size: 13.5px;
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: -0.015em;
    color: #ffffff;
    position: relative;
    z-index: 1;
  }
  .wd-banner-sub {
    font-size: 11.5px;
    line-height: 1.4;
    color: rgba(255, 255, 255, 0.78);
    position: relative;
    z-index: 1;
  }
  .wd-banner-cta {
    margin-top: 2px;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.92);
    position: relative;
    z-index: 1;
  }

  /* =========================================================
     Lightweight Side Peek Drawer (News Articles & Digest)
     ========================================================= */
  .hy-side-peek {
    position: fixed;
    top: 44px;
    right: 12px;
    bottom: 12px;
    width: 440px;
    max-width: calc(100vw - 24px);
    background: var(--bg);
    border-radius: 14px;
    box-shadow: var(--shadow-float);
    z-index: 55;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transform: translateX(24px);
    transition: opacity 180ms var(--ease-out), transform 200ms var(--ease-out);
  }
  .hy-side-peek.open {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(0);
  }
  .hy-peek-head {
    height: 44px;
    flex: none;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .hy-peek-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px 20px 28px;
  }

  @container nt-canvas (max-width: 1259px) {
    .wd-grid {
      grid-template-columns: 296px minmax(0, 1fr);
      column-gap: 18px;
    }
    .wd-rail {
      display: none;
    }
    .wd-scope-caption {
      display: none;
    }
    .wd-compact-actions {
      display: inline-flex;
    }
  }
  @container nt-canvas (max-width: 959px) {
    .wd-wrap {
      padding: 14px 16px 40px;
    }
    .wd-grid {
      grid-template-columns: minmax(0, 1fr);
      row-gap: 14px;
    }
    .wd-left {
      position: static;
    }
  }
  @container nt-canvas (max-width: 640px) {
    .n2-db-row {
      grid-template-columns: minmax(0, 1fr) auto;
    }
    .n2-db-hide {
      display: none;
    }
  }
</style>
</head>
<body>
<script src="./shared-data.js"></script>
<script src="./shared-hero.js"></script>
<script src="./shared-desktop-chrome.js"></script>
<script>
(() => {
  'use strict';

  const Data = window.DashMockData;
  const WEEKDAYS_MON = ['월', '화', '수', '목', '금', '토', '일'];
  const WEEKDAYS_SUN = Data.WEEKDAYS;

  function dateKeyFromDate(dt) {
    const y = dt.getFullYear();
    const m = String(dt.getMonth() + 1).padStart(2, '0');
    const day = String(dt.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function parseDateKey(key) {
    const [y, m, d] = String(key || '').split('-').map(Number);
    return new Date(y, (m || 1) - 1, d || 1);
  }

  function offsetDateKey(baseDate, offsetDays) {
    return dateKeyFromDate(new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate() + offsetDays));
  }

  const baseToday = new Date(Data.getScopedData().today);

  // Additional upcoming events anchored relative to today so calendar dots &
  // "다가오는 일정" always stay rich regardless of day-of-week.
  const UPCOMING_EXTRA_EVENTS = [
    {
      id: 'up-ext-1',
      dayKey: offsetDateKey(baseToday, 1),
      hour: 10.5,
      title: '가계약금 정산 및 본계약 일정 확정',
      type: 'contract',
      propertyLabel: '고덕아르테온 301동 604호',
      contactName: '송유진',
      dealId: null,
      assignee: '현수',
      mine: true,
      memo: '인감증명서·등기권리증 지참 및 특약 문구 사전 안내',
    },
    {
      id: 'up-ext-2',
      dayKey: offsetDateKey(baseToday, 2),
      hour: 14.0,
      title: '잠실엘스 118동 중도금 2억 입금 확인',
      type: 'contract',
      propertyLabel: '잠실엘스 118동 1502호',
      contactName: '최민준 · 정하은',
      dealId: 'deal-2',
      assignee: '현수',
      mine: true,
      memo: '공동중개(잠실중앙공인) 중도금 2억 이체 영수증 확인',
    },
    {
      id: 'up-ext-3',
      dayKey: offsetDateKey(baseToday, 3),
      hour: 15.5,
      title: '고덕그라시움 112동 전세 잔금 서류 점검',
      type: 'viewing',
      propertyLabel: '고덕그라시움 112동 703호',
      contactName: '강서진 · 서지우',
      dealId: 'deal-5',

  function buildCombinedEvents(d) {
    const extras = UPCOMING_EXTRA_EVENTS.filter((e) => (d.scope === 'mine' ? e.mine : true)).map((e) => ({
      ...e,
      isExtra: true,
    }));
    const core = d.events.map((e) => ({ ...e, isExtra: false }));
    const combined = [...core, ...extras].sort((a, b) => a.dayKey.localeCompare(b.dayKey) || a.hour - b.hour);
    const byDay = new Map();
    for (const ev of combined) {
      if (!byDay.has(ev.dayKey)) byDay.set(ev.dayKey, []);
      byDay.get(ev.dayKey).push(ev);
    }
    return { combined, byDay };
  }

  function renderCalendarCells(d, byDay) {
    const first = new Date(ui.calYear, ui.calMonth, 1);
    const startOffset = (first.getDay() + 6) % 7; // Monday = 0
    const daysInMonth = new Date(ui.calYear, ui.calMonth + 1, 0).getDate();
    const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
    const gridStart = new Date(ui.calYear, ui.calMonth, 1 - startOffset);

    let html = '';
    for (let i = 0; i < totalCells; i += 1) {
      const dt = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
      const key = dateKeyFromDate(dt);
      const isOut = dt.getMonth() !== ui.calMonth;
      const isToday = key === d.todayKey;
      const isSelected = key === d.selectedDayKey;
      const hasEv = (byDay.get(key) || []).length > 0;
      const cls = ['wd-cal-day', isOut ? 'is-out' : '', isToday ? 'is-today' : '', isSelected ? 'is-selected' : '']
        .filter(Boolean)
        .join(' ');
      html += `
        <button type="button" class="${cls}" data-wd-cal-day="${key}" aria-label="${dt.getMonth() + 1}월 ${dt.getDate()}일">
          <span class="wd-cal-num num">${dt.getDate()}</span>
          <span class="wd-cal-dot${hasEv ? ' has' : ''}"></span>
        </button>`;
    }
    return html;
  }

              <span class="num" style="color:${d.unreadNotices.length > 0 ? 'var(--blue)' : 'var(--fg3)'}">안 읽음 ${d.unreadNotices.length}</span>
            </div>
            <div class="n2-tl-feed">
              ${d.notices
                .slice(0, 3)
                .map(
                  (n) => `
                <button type="button" class="n2-tl-entry${n.readAt ? '' : ' unread'}" data-wd-notice="${n.id}">
                  <div style="display:flex;align-items:center;gap:6px">
                    <span class="n2-rail-meta num">${n.publishedAt}</span>
                    ${n.isRequired ? '<span style="font-size:10.5px;font-weight:600;color:var(--red)">필독</span>' : ''}
                  </div>
                  <div class="n2-rail-title" style="font-weight:${n.readAt ? 400 : 500}">${chrome.escapeHtml(n.title)}</div>
                </button>`,
                )
                .join('')}
            </div>
            <button type="button" class="n2-rail-more" data-wd-digest>전체 보기 →</button>
          </div>

          <!-- Community-board style App Guide Spotlight Banner -->
          <div class="wd-guide-banner ${activeGuide.theme}" role="button" tabindex="0" data-wd-guide="${activeGuide.id}" aria-label="${chrome.escapeHtml(activeGuide.title)}">
            <svg class="wd-banner-svg" viewBox="0 0 80 80" fill="none" aria-hidden="true">
              <rect x="14" y="28" width="22" height="44" rx="2" stroke="white" stroke-width="2"/>
              <rect x="42" y="14" width="26" height="58" rx="2" stroke="white" stroke-width="2"/>
              <path d="M21 38h8M21 47h8M21 56h8M50 24h10M50 33h10M50 42h10M50 51h10" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <div class="wd-banner-top">
              <span class="wd-banner-badge">${chrome.escapeHtml(activeGuide.badge)}</span>
              <div class="wd-banner-dots" role="tablist" aria-label="가이드 슬라이드 전환">
                ${APP_GUIDES.map(
                  (g, idx) => `<button type="button" class="wd-banner-dot${idx === ui.bannerIdx ? ' active' : ''}" data-wd-banner-dot="${idx}" aria-label="${chrome.escapeHtml(g.badge)}" aria-selected="${idx === ui.bannerIdx}"></button>`,
                ).join('')}
              </div>
            </div>
            <div class="wd-banner-title">${chrome.escapeHtml(activeGuide.title)}</div>
            <div class="wd-banner-sub">${chrome.escapeHtml(activeGuide.sub)}</div>
            <div class="wd-banner-cta">가이드 보기 →</div>
          </div>

          <div class="wd-card n2-side-card">
            <div class="n2-rail-head">
              <span>부동산 · 시장 뉴스</span>
              <span style="font-weight:400">오늘 브리핑</span>
            </div>
            <div>
              ${BROKERAGE_NEWS.slice(0, 3)
                .map(
                  (nw) => `
                <button type="button" class="n2-rail-row" data-wd-news="${nw.id}">
                  <div class="n2-rail-title" style="font-weight:500">${chrome.escapeHtml(nw.title)}</div>
                  <div class="n2-rail-meta">${chrome.escapeHtml(nw.source)} · ${chrome.escapeHtml(nw.time)}</div>
                </button>`,
                )
                .join('')}
            </div>
            <button type="button" class="n2-rail-more" data-wd-digest>뉴스 더 보기 →</button>
          </div>
        </aside>
      </div>
    `;

    const root = chrome.contentHost;

    root.querySelectorAll('[data-wd-cal-day]').forEach((b) =>
      b.addEventListener('click', () => {
        const key = b.dataset.wdCalDay;
        const dt = parseDateKey(key);
        ui.calYear = dt.getFullYear();
        ui.calMonth = dt.getMonth();
        Data.selectDay(key);
      }),
    );
    root.querySelectorAll('[data-wd-month]').forEach((b) =>
      b.addEventListener('click', () => {
        const delta = Number(b.dataset.wdMonth);
        const next = new Date(ui.calYear, ui.calMonth + delta, 1);
        ui.calYear = next.getFullYear();
        ui.calMonth = next.getMonth();
        render();
      }),
    );
    root.querySelectorAll('[data-wd-today]').forEach((b) =>
      b.addEventListener('click', () => {
        ui.calYear = d.today.getFullYear();
        ui.calMonth = d.today.getMonth();
        Data.selectDay(d.todayKey);
      }),
    );

    root.querySelectorAll('[data-wd-ev-id]').forEach((b) =>
      b.addEventListener('click', (e) => {
        const id = b.dataset.wdEvId;
        const isExtra = b.dataset.wdEvExtra === '1';
        const dealId = b.dataset.wdEvDeal;
        if (!isExtra) {
          const ev = Data.state.events.find((x) => x.id === id);
          if (ev) chrome.openTab({ key: `event:${ev.id}`, title: ev.title, kind: 'event', payload: { eventId: ev.id }, dotColor: 'var(--orange)' }, { background: e.metaKey || e.ctrlKey });
          return;
        }
        if (dealId) {
          const deal = Data.state.deals.find((x) => x.id === dealId);
          if (deal) chrome.openTab({ key: `deal:${deal.id}`, title: `${deal.siteName} ${deal.dongHo}`, kind: 'deal', payload: { dealId: deal.id }, dotColor: 'var(--green)' }, { background: e.metaKey || e.ctrlKey });
          return;
        }
        openPeek('extraEvent', id);
      }),
    );

    root.querySelectorAll('[data-wd-group]').forEach((b) =>
      b.addEventListener('click', () => {
        ui.collapsedGroups[b.dataset.wdGroup] = !ui.collapsedGroups[b.dataset.wdGroup];
        render();
      }),
    );
    root.querySelectorAll('[data-wd-done]').forEach((b) =>
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        b.setAttribute('aria-checked', 'true');
        const res = Data.completeTask(b.dataset.wdDone);
        if (res) {
          chrome.hero.cheer();
          chrome.showToast('할 일을 완료했습니다', res.task.title, () => Data.restoreTaskStatus(res.task.id, res.previousStatus));
        }
      }),
    );
    root.querySelectorAll('[data-wd-snooze]').forEach((b) =>
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        const res = Data.snoozeTask(b.dataset.wdSnooze, 1, '내일');
        if (res) chrome.showToast('내일로 미뤘습니다', res.task.title, () => Data.snoozeTask(res.task.id, res.prevOffset, '원래 기한'));
      }),
    );
    root.querySelectorAll('[data-wd-task]').forEach((row) => {
      const t = Data.state.tasks.find((x) => x.id === row.dataset.wdTask);
      if (!t) return;
      row.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        chrome.openTab({ key: `task:${t.id}`, title: t.title, kind: 'task', payload: { id: t.id }, dotColor: 'var(--blue)' }, { background: e.metaKey || e.ctrlKey });
      });
    });
    root.querySelector('#wdAddForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const inp = root.querySelector('#wdAddInput');
      const created = Data.addTask(inp.value);
      if (created) {
        inp.value = '';
        chrome.showToast('할 일을 추가했습니다', created.title);
      }
    });

    root.querySelectorAll('[data-wd-deal]').forEach((el) => {
      const deal = Data.state.deals.find((x) => x.id === el.dataset.wdDeal);
      if (!deal) return;
      el.addEventListener('click', (e) =>
        chrome.openTab({ key: `deal:${deal.id}`, title: `${deal.siteName} ${deal.dongHo}`, kind: 'deal', payload: { dealId: deal.id }, dotColor: 'var(--green)' }, { background: e.metaKey || e.ctrlKey }),
      );
    });
    root.querySelectorAll('[data-wd-route]').forEach((b) =>
      b.addEventListener('click', () => {
        const route = b.dataset.wdRoute;
        const meta = route === '/consultations'
          ? { title: '상담분석', dotColor: 'var(--violet)' }
          : { title: '거래 관리', dotColor: 'var(--green)' };
        chrome.openTab({ key: `route:${route}`, title: meta.title, kind: 'route', payload: { route }, dotColor: meta.dotColor });
      }),
    );
    root.querySelectorAll('[data-wd-consult]').forEach((b) =>
      b.addEventListener('click', () => openPeek('consultation', b.dataset.wdConsult)),
    );
    root.querySelectorAll('[data-wd-notice]').forEach((b) => {
      const n = Data.state.notices.find((x) => x.id === b.dataset.wdNotice);
      if (!n) return;
      b.addEventListener('click', (e) =>
        chrome.openTab({ key: `notice:${n.id}`, title: n.title, kind: 'notice', payload: { noticeId: n.id }, dotColor: 'var(--blue)' }, { background: e.metaKey || e.ctrlKey }),
      );
    });
    root.querySelectorAll('[data-wd-cashflow]').forEach((b) =>
      b.addEventListener('click', () =>
        chrome.openTab({ key: 'route:/cashflow', title: '수수료/정산', kind: 'route', payload: { route: '/cashflow' }, dotColor: 'var(--green)' }),
      ),
    );
    root.querySelectorAll('[data-wd-news]').forEach((b) =>
      b.addEventListener('click', () => openPeek('news', b.dataset.wdNews)),
    );
    root.querySelectorAll('[data-wd-digest]').forEach((b) =>
      b.addEventListener('click', () => openPeek('marginDigest', 'digest')),
    );
    root.querySelectorAll('[data-wd-banner-dot]').forEach((b) =>
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        ui.bannerIdx = Number(b.dataset.wdBannerDot) || 0;
        render();
      }),
    );
    root.querySelectorAll('[data-wd-guide]').forEach((el) => {
      const openIt = () => openPeek('guide', el.dataset.wdGuide);
      el.addEventListener('click', (e) => {
        if (e.target.closest('[data-wd-banner-dot]')) return;
        openIt();
      });
      el.addEventListener('keydown', (e) => {
        if (e.target.closest('[data-wd-banner-dot]')) return;
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openIt();
        }
      });
    });

    if (ui.peek) renderPeek();
  }

  Data.subscribe(render);
  render();
})();
</script>
</body>
</html>
