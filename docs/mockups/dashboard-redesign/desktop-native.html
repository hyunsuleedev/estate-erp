<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estait Flow · 데스크톱 앱 대시보드 시안</title>
<link rel="stylesheet" href="./shared-hero.css">
<style>
  :root {
    --bg: #ffffff;
    --bg-sub: #faf9f7;
    --sidebar-bg: #f9f8f7;
    --muted: #f0efed;
    --hover: rgba(44, 44, 43, 0.045);
    --row-sel: #f2f6fc;
    --fg: #2c2c2b;
    --fg2: #5f5e59;
    --fg3: #79766f;
    --icon: #8e8b86;
    --border: #e6e5e3;
    --border-strong: #d5d3cf;
    --primary: #2c2c2b;
    --primary-fg: #ffffff;

    --info: #2383e2;
    --info-soft: #e7f2fc;
    --info-strong: #1b6dc0;
    --success: #0f7b6c;
    --success-soft: #dff2ec;
    --success-strong: #0c6256;
    --warning: #b37300;
    --warning-soft: #f9efd9;
    --orange: #d9730d;
    --orange-soft: #faebdd;
    --destructive: #bb3430;
    --destructive-soft: #fdebe9;
    --destructive-strong: #9f2926;
    --violet: #6940a5;
    --violet-soft: #f0eaf8;

    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --sidebar-w: 220px;
    --titlebar-h: 36px;
    --statusbar-h: 26px;
    --shadow-float: 0 10px 28px rgba(24, 24, 23, 0.12), 0 0 0 1px rgba(44, 44, 43, 0.08);
    --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  button,
  input,
  textarea {
    font: inherit;
    color: inherit;
  }

  button {
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    text-align: inherit;
  }

  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--info);
    outline-offset: -2px;
  }

  .num {
    font-variant-numeric: tabular-nums;
  }

  .ic {
    width: 14px;
    height: 14px;
    flex: none;
    stroke: currentColor;
    stroke-width: 1.75;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .app-root {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    background: var(--bg);
  }

  /* =========================================================
     1. Electron 36px Native Titlebar + TabBar
     ========================================================= */
  .titlebar {
    height: var(--titlebar-h);
    flex: none;
    display: flex;
    align-items: stretch;
    background: var(--sidebar-bg);
    border-bottom: 1px solid var(--border);
    padding-right: 8px;
    position: relative;
    z-index: 40;
  }

  .brand-zone {
    width: var(--sidebar-w);
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px 0 12px;
    border-right: 1px solid var(--border);
    overflow: hidden;
    position: relative;
    z-index: 2;
    transition: width 180ms var(--ease-out);
  }
  .app-root.sidebar-collapsed .brand-zone {
    width: 158px;
    border-right-color: transparent;
  }

  .traffic-lights {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-right: 4px;
    flex: none;
  }
  .tl {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.14);
  }
  .tl.red { background: #ff5f57; }
  .tl.yel { background: #febc2e; }
  .tl.grn { background: #28c840; }

  .brand-name {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--fg);
    white-space: nowrap;
  }
  .brand-spacer {
    flex: 1;
    min-width: 0;
  }

  .icon-btn {
    width: 24px;
    height: 24px;
    border-radius: 5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--fg2);
    flex: none;
    transition: background-color 140ms ease, color 140ms ease, transform 120ms var(--ease-out);
  }
  .icon-btn:active {
    transform: scale(0.95);
  }
  .icon-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }
  @media (hover: hover) and (pointer: fine) {
    .icon-btn:not(:disabled):hover {
      background: var(--hover);
      color: var(--fg);
    }
  }

  .nav-arrows {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 6px;
    flex: none;
  }

  /* Connected Notion-style native tab strip */
  .tab-strip {
    display: flex;
    align-items: flex-end;
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    gap: 0;
    padding-top: 4px;
  }
  .tab-strip::-webkit-scrollbar {
    display: none;
  }

  .ntab {
    height: 32px;
    min-width: 96px;
    max-width: 204px;
    flex: 0 1 168px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px 0 10px;
    border-right: 1px solid var(--border);
    border-top: 1px solid transparent;
    border-left: 1px solid transparent;
    border-top-left-radius: 6px;
    border-top-right-radius: 6px;
    color: var(--fg3);
    font-size: 12px;
    font-weight: 500;
    position: relative;
    transition: background-color 140ms ease, color 140ms ease;
  }
  .ntab.pinned {
    flex: 0 0 auto;
    min-width: 0;
    padding-right: 11px;
  }
  .ntab:first-child {
    border-left: 1px solid var(--border);
  }
  @media (hover: hover) and (pointer: fine) {
    .ntab:not(.active):hover {
      background: rgba(44, 44, 43, 0.04);
      color: var(--fg);
    }
  }
  .ntab.active {
    background: var(--bg);
    color: var(--fg);
    font-weight: 600;
    height: 33px;
    margin-bottom: -1px;
    border-top-color: var(--border);
    border-left-color: var(--border);
    border-right-color: var(--border);
    z-index: 2;
  }
  .ntab-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ntab-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex: none;
  }
  .ntab-close {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--fg3);
    opacity: 0;
    flex: none;
    transition: opacity 120ms ease, background-color 120ms ease, color 120ms ease;
  }
  .ntab.active .ntab-close,
  .ntab:hover .ntab-close {
    opacity: 1;
  }
  .ntab-close:hover {
    background: rgba(44, 44, 43, 0.1);
    color: var(--fg);
  }

  .tab-add-btn {
    width: 28px;
    height: 28px;
    margin: 2px 4px;
    border-radius: 5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--fg3);
    flex: none;
    transition: background-color 140ms ease, color 140ms ease;
  }
  .tab-add-btn:hover {
    background: var(--hover);
    color: var(--fg);
  }

  .title-utils {
    display: flex;
    align-items: center;
    gap: 4px;
    padding-left: 8px;
    margin-left: 6px;
    border-left: 1px solid var(--border);
    flex: none;
  }
  .util-btn {
    height: 24px;
    padding: 0 8px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg2);
    font-size: 11.5px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease, transform 120ms var(--ease-out);
  }
  .util-btn:active {
    transform: scale(0.97);
  }
  .util-btn.is-on {
    background: var(--info-soft);
    border-color: rgba(35, 131, 226, 0.35);
    color: var(--info-strong);
  }
  .util-btn.is-ringing {
    background: var(--success-soft);
    border-color: rgba(15, 123, 108, 0.35);
    color: var(--success-strong);
  }
  @media (hover: hover) and (pointer: fine) {
    .util-btn:not(.is-on):not(.is-ringing):hover {
      background: var(--muted);
      color: var(--fg);
    }
  }
  .kbd {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    min-width: 17px;
    height: 16px;
    border-radius: 3px;
    background: var(--muted);
    border: 1px solid var(--border);
    font-size: 10px;
    font-weight: 500;
    color: var(--fg3);
    line-height: 1;
  }

  /* =========================================================
     2. Desktop Shell Body (Sidebar + Viewport-Locked Main)
     ========================================================= */
  .app-body {
    flex: 1;
    min-height: 0;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  .app-sidebar {
    width: var(--sidebar-w);
    flex: none;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 180ms var(--ease-out), border-color 180ms var(--ease-out);
  }
  .app-root.sidebar-collapsed .app-sidebar {
    width: 0;
    border-right: 0;
  }

  .sb-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 10px 8px;
  }
  .sb-group {
    margin-bottom: 12px;
  }
  .sb-group-lbl {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--fg3);
    padding: 2px 8px 4px;
    letter-spacing: 0.01em;
  }
  .sb-item {
    width: 100%;
    height: 28px;
    padding: 0 8px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--fg2);
    white-space: nowrap;
    transition: background-color 120ms ease, color 120ms ease;
  }
  .sb-item.active {
    background: var(--muted);
    color: var(--fg);
    font-weight: 600;
  }
  @media (hover: hover) and (pointer: fine) {
    .sb-item:not(.active):hover {
      background: var(--hover);
      color: var(--fg);
    }
  }
  .sb-footer {
    border-top: 1px solid var(--border);
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex: none;
  }
  .sb-avatar {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: var(--primary);
    color: var(--primary-fg);
    font-size: 11px;
    font-weight: 600;
    display: grid;
    place-items: center;
    flex: none;
  }

  /* Collapsed Sidebar Hover Edge Sensor & Floating Preview */
  .sidebar-edge-sensor {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 8px;
    z-index: 30;
    display: none;
  }
  .app-root.sidebar-collapsed .sidebar-edge-sensor {
    display: block;
  }
  .sidebar-preview {
    position: absolute;
    left: 8px;
    top: 8px;
    bottom: 8px;
    width: var(--sidebar-w);
    background: var(--sidebar-bg);
    border-radius: 10px;
    box-shadow: var(--shadow-float);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 45;
    opacity: 0;
    pointer-events: none;
    transform: translateX(-10px);
    transition: opacity 160ms var(--ease-out), transform 180ms var(--ease-out);
  }
  .sidebar-preview.open {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(0);
  }
  .sb-preview-head {
    height: 34px;
    padding: 0 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--fg2);
  }

  /* Main Tab Viewport */
  .workspace {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    position: relative;
  }

  .tab-view {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .tab-view[hidden] {
    display: none !important;
  }

  /* =========================================================
     3. Preserved Animated Hero Frame (Strict 100vh budget)
     ========================================================= */
  .hero-frame {
    flex: none;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  /* Narrow detached pane toggle (only visible <=1020px) */
  .compact-pane-bar {
    display: none;
    flex: none;
    height: 32px;
    padding: 0 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-sub);
    align-items: center;
    gap: 6px;
  }
  .compact-pane-btn {
    height: 22px;
    padding: 0 10px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 500;
    color: var(--fg2);
  }
  .compact-pane-btn.active {
    background: var(--bg);
    color: var(--fg);
    font-weight: 600;
    box-shadow: 0 0 0 1px var(--border);
  }

  /* =========================================================
     4. Resizable Hairline 2-Pane Split (Zero Outer Scroll)
     ========================================================= */
  .split-root {
    --split-left: 56%;
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(360px, var(--split-left)) 1px minmax(340px, 1fr);
    overflow: hidden;
  }

  .split-divider {
    background: var(--border);
    position: relative;
    z-index: 5;
  }
  .split-divider::after {
    content: "";
    position: absolute;
    inset: 0 -4px;
    cursor: col-resize;
  }
  .split-divider:hover,
  .split-divider.dragging {
    background: var(--info);
  }

  .pane {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: var(--bg);
  }

  /* Left Pane: Schedule Strip + Queue Filter + Scrollable Queue + Quick Add */
  .sched-strip {
    flex: none;
    background: var(--bg-sub);
    border-bottom: 1px solid var(--border);
    padding: 7px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .sched-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .week-pills {
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .day-pill {
    height: 23px;
    padding: 0 7px;
    border-radius: 5px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    color: var(--fg2);
    border: 1px solid transparent;
    transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease;
  }
  .day-pill:hover {
    background: var(--hover);
    color: var(--fg);
  }
  .day-pill.is-today:not(.selected) {
    color: var(--info-strong);
    font-weight: 600;
  }
  .day-pill.selected {
    background: var(--bg);
    border-color: var(--border-strong);
    color: var(--fg);
    font-weight: 600;
  }
  .day-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--orange);
  }
  .day-dot.none {
    background: transparent;
  }

  .ev-chips {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .ev-chip {
    height: 24px;
    padding: 0 8px;
    border-radius: 5px;
    background: var(--bg);
    border: 1px solid var(--border);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--fg);
    max-width: 280px;
    transition: border-color 130ms ease, background-color 130ms ease, transform 120ms var(--ease-out);
  }
  .ev-chip:active {
    transform: scale(0.98);
  }
  @media (hover: hover) and (pointer: fine) {
    .ev-chip:hover {
      border-color: var(--border-strong);
      background: #fffdf9;
    }
  }
  .ev-chip span.ev-lbl {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ev-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--orange);
    flex: none;
  }

  .pane-toolbar {
    height: 34px;
    flex: none;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--bg);
  }

  .seg-group {
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }
  .seg-btn {
    height: 23px;
    padding: 0 8px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 500;
    color: var(--fg2);
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    transition: background-color 120ms ease, color 120ms ease;
  }
  .seg-btn:hover {
    background: var(--hover);
    color: var(--fg);
  }
  .seg-btn.active {
    background: var(--muted);
    color: var(--fg);
    font-weight: 600;
  }
  .seg-btn .cnt {
    font-size: 11px;
    color: var(--fg3);
  }
  .seg-btn.active .cnt {
    color: var(--fg2);
  }

  .pane-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }

  /* Dense Keyboard-Navigable Action Queue Rows */
  .q-row {
    display: grid;
    grid-template-columns: 20px minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    border-left: 2px solid transparent;
    cursor: pointer;
    transition: background-color 100ms ease, border-left-color 100ms ease;
  }
  @media (hover: hover) and (pointer: fine) {
    .q-row:hover {
      background: var(--hover);
    }
  }
  .q-row.is-selected {
    background: var(--row-sel);
    border-left-color: var(--info);
  }

  .chk {
    width: 15px;
    height: 15px;
    border-radius: 4px;
    border: 1.4px solid var(--border-strong);
    background: var(--bg);
    display: inline-grid;
    place-items: center;
    flex: none;
    transition: background-color 130ms ease, border-color 130ms ease, transform 120ms var(--ease-out);
  }
  .chk:hover {
    border-color: var(--info);
  }
  .chk:active {
    transform: scale(0.9);
  }
  .chk[aria-checked="true"] {
    background: var(--info);
    border-color: var(--info);
  }
  .chk svg {
    width: 10px;
    height: 10px;
    stroke: #fff;
    stroke-width: 2.2;
    fill: none;
    opacity: 0;
  }
  .chk[aria-checked="true"] svg {
    opacity: 1;
  }

  .sig-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin: 0 auto;
  }

  .q-main {
    min-width: 0;
  }
  .q-title-line {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .q-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .q-sub {
    font-size: 11.5px;
    color: var(--fg3);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .q-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: none;
  }
  .row-actions {
    display: none;
    align-items: center;
    gap: 4px;
  }
  .q-row:hover .row-actions,
  .q-row.is-selected .row-actions {
    display: inline-flex;
  }

  .micro-btn {
    height: 22px;
    padding: 0 7px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 11px;
    font-weight: 500;
    color: var(--fg2);
    white-space: nowrap;
    transition: background-color 120ms ease, color 120ms ease, transform 100ms var(--ease-out);
  }
  .micro-btn:hover {
    background: var(--muted);
    color: var(--fg);
  }
  .micro-btn:active {
    transform: scale(0.96);
  }
  .micro-btn.primary {
    border-color: rgba(35, 131, 226, 0.35);
    color: var(--info-strong);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    height: 18px;
    padding: 0 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge[data-tone="gray"] { background: var(--muted); color: var(--fg2); }
  .badge[data-tone="info"] { background: var(--info-soft); color: var(--info-strong); }
  .badge[data-tone="success"] { background: var(--success-soft); color: var(--success-strong); }
  .badge[data-tone="warning"] { background: var(--warning-soft); color: var(--warning); }
  .badge[data-tone="orange"] { background: var(--orange-soft); color: var(--orange); }
  .badge[data-tone="destructive"] { background: var(--destructive-soft); color: var(--destructive-strong); }
  .badge[data-tone="violet"] { background: var(--violet-soft); color: var(--violet); }

  .quick-add-bar {
    height: 38px;
    flex: none;
    border-top: 1px solid var(--border);
    background: var(--bg-sub);
    padding: 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .quick-add-input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    outline: none;
    font-size: 12.5px;
    color: var(--fg);
  }
  .quick-add-input::placeholder {
    color: var(--fg3);
  }

  /* Right Pane: KPI Strip + Scrollable Deal Ledger + Bottom Notice Box (CTI safe zone) */
  .kpi-strip {
    flex: none;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    background: var(--bg-sub);
    border-bottom: 1px solid var(--border);
  }
  .kpi-cell {
    padding: 9px 12px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 2px;
    text-align: left;
    transition: background-color 120ms ease;
  }
  .kpi-cell:last-child {
    border-right: 0;
  }
  @media (hover: hover) and (pointer: fine) {
    .kpi-cell:hover {
      background: var(--hover);
    }
  }
  .kpi-lbl {
    font-size: 11px;
    color: var(--fg3);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }
  .kpi-val {
    font-size: 15px;
    font-weight: 600;
    color: var(--fg);
    letter-spacing: -0.02em;
  }
  .kpi-sub {
    font-size: 11px;
    color: var(--fg3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .deal-section {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .deal-row {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    transition: background-color 100ms ease;
  }
  @media (hover: hover) and (pointer: fine) {
    .deal-row:hover {
      background: var(--hover);
    }
  }
  .deal-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .deal-name {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
  }
  .deal-sub {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 11.5px;
    color: var(--fg2);
  }
  .deal-steps {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 3px;
  }
  .deal-steps span {
    height: 3px;
    border-radius: 2px;
    background: var(--muted);
  }
  .deal-steps span.done {
    background: var(--success);
  }
  .deal-steps span.curr {
    background: var(--info);
  }

  .notice-dock {
    flex: none;
    max-height: 148px;
    border-top: 1px solid var(--border);
    background: var(--bg-sub);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .notice-head {
    height: 30px;
    flex: none;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--fg2);
  }
  .notice-list {
    overflow-y: auto;
    min-height: 0;
  }
  .notice-item {
    width: 100%;
    height: 30px;
    padding: 0 14px;
    border-bottom: 1px solid rgba(230, 229, 227, 0.7);
    display: flex;
    align-items: center;
    gap: 7px;
    text-align: left;
    transition: background-color 110ms ease;
  }
  .notice-item:last-child {
    border-bottom: 0;
  }
  @media (hover: hover) and (pointer: fine) {
    .notice-item:hover {
      background: var(--hover);
    }
  }

  /* =========================================================
     5. Dynamic Detail Tab View (Full-height Desktop Subpage)
     ========================================================= */
  .detail-shell {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 22px 28px 36px;
    background: var(--bg);
  }
  .detail-inner {
    max-width: 920px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .detail-crumb {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .detail-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(240px, 0.85fr);
    gap: 18px;
  }
  .detail-box {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    background: var(--bg);
  }
  .pay-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-sub);
  }

  /* =========================================================
     6. Bottom Native Statusbar (26px)
     ========================================================= */
  .statusbar {
    height: var(--statusbar-h);
    flex: none;
    background: var(--sidebar-bg);
    border-top: 1px solid var(--border);
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 11px;
    color: var(--fg3);
  }
  .sb-left,
  .sb-right {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
  }
  .scope-seg {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    background: var(--bg);
  }
  .scope-opt {
    height: 18px;
    padding: 0 7px;
    font-size: 10.5px;
    color: var(--fg3);
  }
  .scope-opt.active {
    background: var(--primary);
    color: var(--primary-fg);
    font-weight: 600;
  }

  /* =========================================================
     7. Desktop Native Overlays: CTI Call, Cmd+K, Context Menu, Popover, Toast
     ========================================================= */
  .cti-overlay {
    position: fixed;
    right: 14px;
    bottom: 36px;
    width: 380px;
    max-width: calc(100vw - 28px);
    background: var(--bg);
    border-radius: 12px;
    box-shadow: var(--shadow-float);
    z-index: 60;
    overflow: hidden;
    display: none;
  }
  .cti-overlay.open {
    display: block;
    animation: popUp 180ms var(--ease-out);
  }
  @keyframes popUp {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .cti-head {
    padding: 10px 14px;
    background: #f5fbf9;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .cti-pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 0 3px rgba(15, 123, 108, 0.18);
  }

  .ctx-menu {
    position: fixed;
    min-width: 196px;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(12px);
    border-radius: 8px;
    box-shadow: var(--shadow-float);
    padding: 4px;
    z-index: 90;
    display: none;
  }
  .ctx-menu.open {
    display: block;
  }
  .ctx-item {
    width: 100%;
    height: 28px;
    padding: 0 9px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 12px;
    color: var(--fg);
  }
  .ctx-item:hover {
    background: var(--info);
    color: #fff;
  }
  .ctx-item:hover .ctx-hint {
    color: rgba(255, 255, 255, 0.85);
  }
  .ctx-hint {
    font-size: 10.5px;
    color: var(--fg3);
  }
  .ctx-sep {
    height: 1px;
    background: var(--border);
    margin: 4px 2px;
  }

  .palette-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 19, 0.28);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding-top: 12vh;
    z-index: 95;
  }
  .palette-backdrop.open {
    display: flex;
  }
  .palette-box {
    width: min(560px, calc(100vw - 24px));
    background: var(--bg);
    border-radius: 10px;
    box-shadow: var(--shadow-float);
    overflow: hidden;
  }
  .palette-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  .palette-input {
    flex: 1;
    border: 0;
    outline: none;
    background: transparent;
    font-size: 13.5px;
  }
  .palette-list {
    max-height: 320px;
    overflow-y: auto;
    padding: 6px;
  }
  .pal-item {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    text-align: left;
  }
  .pal-item.active,
  .pal-item:hover {
    background: var(--row-sel);
  }

  .weather-popover {
    position: fixed;
    top: 42px;
    right: 12px;
    width: 280px;
    background: var(--bg);
    border-radius: 10px;
    box-shadow: var(--shadow-float);
    padding: 12px 14px;
    z-index: 80;
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  .weather-popover.open {
    display: flex;
  }
  .wp-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .wp-chip {
    height: 24px;
    padding: 0 8px;
    border-radius: 5px;
    border: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--fg2);
  }
  .wp-chip.active {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-fg);
  }

  /* Bottom-left undo toast so bottom-right CTI overlay stays clear */
  .toast-wrap {
    position: fixed;
    left: 14px;
    bottom: 36px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 70;
    pointer-events: none;
  }
  .toast {
    pointer-events: auto;
    min-width: 260px;
    max-width: 360px;
    background: var(--primary);
    color: var(--primary-fg);
    border-radius: 8px;
    padding: 9px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
    font-size: 12px;
  }

  /* =========================================================
     8. Compact / Detached Window Responsive Mode (<=1020px)
     ========================================================= */
  @media (max-width: 1020px) {
    .brand-zone {
      width: 158px !important;
      border-right-color: transparent !important;
    }
    .app-sidebar {
      width: 0 !important;
      border-right: 0 !important;
    }
    .sidebar-edge-sensor {
      display: block !important;
    }
    .compact-pane-bar {
      display: flex;
    }
    .split-root {
      grid-template-columns: 1fr;
    }
    .split-divider {
      display: none;
    }
    .split-root[data-compact-pane="left"] #rightPane {
      display: none;
    }
    .split-root[data-compact-pane="right"] #leftPane {
      display: none;
    }
    .statusbar .sb-shortcuts {
      display: none;
    }
    .detail-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }
</style>
</head>

  <!-- Main Shell Body -->
  <div class="app-body">

    <!-- Edge Hover Sensor + Floating Preview Sidebar when Collapsed -->
    <div class="sidebar-edge-sensor" id="sidebarEdgeSensor" aria-hidden="true"></div>
    <aside class="sidebar-preview" id="sidebarPreview" aria-label="사이드바 미리보기"></aside>

    <!-- Viewport-Locked Tab Surface -->

<!-- CTI Call Overlay (bottom-right safe zone above notice dock) -->

(() => {
  'use strict';

  const Data = window.DashMockData;

  const NAV_GROUPS = [
    {
      label: '시작',
      items: [{ key: '/dashboard', label: '대시보드', icon: 'dashboard' }],
    },
    {
      label: '매물·공간',

  function showToast(title, sub, onUndo) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `
      <div style="min-width:0">
        <div style="font-weight:600">${esc(title)}</div>
        ${sub ? `<div style="font-size:11px;opacity:0.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(sub)}</div>` : ''}
      </div>
      ${onUndo ? '<button type="button" data-undo style="font-weight:600;color:#8cc4ff;padding:2px 6px;border-radius:4px">되돌리기</button>' : ''}
    `;
    toastWrap.appendChild(el);
    let closed = false;
    const dismiss = () => {
      if (closed) return;
      closed = true;
      el.remove();
    };
    const timer = window.setTimeout(dismiss, 4200);
    el.querySelector('[data-undo]')?.addEventListener('click', () => {
      window.clearTimeout(timer);
      onUndo();
      dismiss();
    });
  }

  function activeTab() {
    return appState.tabs.find((t) => t.id === appState.activeTabId) || appState.tabs[0];
  }

  function pushHistory(tabId) {
    if (appState.history[appState.historyIdx] === tabId) return;
    appState.history = appState.history.slice(0, appState.historyIdx + 1);
    appState.history.push(tabId);
    appState.historyIdx = appState.history.length - 1;
  }

  function activateTab(tabId, { recordHistory = true } = {}) {
    const exists = appState.tabs.find((t) => t.id === tabId);
    if (!exists) return;
    appState.activeTabId = tabId;
    if (recordHistory) pushHistory(tabId);
    renderChrome();
    renderWorkspaceSurface();
  }

  function openTab(spec, { background = false } = {}) {
    let tab = appState.tabs.find((t) => t.key === spec.key);
    if (!tab) {
      tab = {
        id: `tab-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
        key: spec.key,
        title: spec.title,
        kind: spec.kind,
        payload: spec.payload || {},
        dotColor: spec.dotColor || 'var(--info)',
        pinned: false,
      };
      appState.tabs.push(tab);
    }
    if (spec.kind === 'notice' && spec.payload?.noticeId) {
      Data.markNoticeRead(spec.payload.noticeId);
    }
    if (background) {
      renderChrome();
      showToast('백그라운드 탭으로 열었습니다', tab.title);
    } else {
      activateTab(tab.id);
    }
  }

  function closeTab(tabId) {
    const idx = appState.tabs.findIndex((t) => t.id === tabId);
    if (idx === -1) return;
    const tab = appState.tabs[idx];
    if (tab.pinned) return;
    appState.tabs.splice(idx, 1);
    appState.history = appState.history.filter((id) => id !== tabId);
    if (appState.history.length === 0) appState.history = ['tab-dashboard'];
    appState.historyIdx = Math.min(appState.historyIdx, appState.history.length - 1);
    if (appState.activeTabId === tabId) {
      const next = appState.tabs[Math.max(0, idx - 1)] || appState.tabs[0];
      appState.activeTabId = next.id;
    }
    renderChrome();
    renderWorkspaceSurface();
  }

  function buildQueueItems(d) {
    const overdue = d.overdueTasks.map((t) => ({
      kind: 'task',
      bucket: 'overdue',
      id: t.id,
      key: `task:${t.id}`,
      title: t.title,
      sub: [t.propertyLabel, t.contactName, Data.dDayLabel(t.dueOffsetDays)].filter(Boolean).join(' · '),
      badge: Data.dDayLabel(t.dueOffsetDays),
      tone: 'destructive',
      dotColor: 'var(--destructive)',
      task: t,
    }));

    const calls = d.pendingSuggestions.map((c) => ({
      kind: 'call',
      bucket: 'signal',
      id: c.id,
      key: `call:${c.id}`,
      title: `${c.contactName} — ${c.suggestionAction}`,
      sub: c.summary,
      badge: c.badge,
      tone: c.tone,
      dotColor: 'var(--violet)',
      call: c,
    }));

    const today = d.todayTasks.map((t) => ({
      kind: 'task',
      bucket: 'today',
      id: t.id,
      key: `task:${t.id}`,
      title: t.title,
      sub: [t.dueTime, t.propertyLabel, t.contactName, d.scope === 'all' ? t.assignee : null].filter(Boolean).join(' · '),
      badge: t.categoryLabel || '오늘',
      tone: 'info',
      dotColor: 'var(--info)',
      task: t,
    }));

    const sigs = d.activeSignals.map((s) => ({
      kind: 'signal',
      bucket: 'signal',
      id: s.id,
      key: `signal:${s.id}`,
      title: s.title,
      sub: s.sub,
      badge: s.badge,
      tone: s.tone,
      dotColor: s.tone === 'destructive' ? 'var(--destructive)' : 'var(--orange)',
      signal: s,
    }));

    const upcoming = d.upcomingTasks.map((t) => ({
      kind: 'task',
      bucket: 'upcoming',
      id: t.id,
      key: `task:${t.id}`,
      title: t.title,
      sub: [Data.relativeDateLabel(t.dueOffsetDays), t.dueTime, t.propertyLabel, t.contactName].filter(Boolean).join(' · '),
      badge: Data.dDayLabel(t.dueOffsetDays),
      tone: 'gray',
      dotColor: 'var(--fg3)',
      task: t,
    }));

    if (appState.queueFilter === 'overdue') return overdue;
    if (appState.queueFilter === 'today') return today;
    if (appState.queueFilter === 'signal') return [...calls, ...sigs];
    return [...overdue, ...calls, ...today, ...sigs, ...upcoming];
  }

  function completeOrResolveQueueItem(item) {
    if (!item) return;
    if (item.kind === 'task') {
      const res = Data.completeTask(item.id);
      if (!res) return;
      hero.cheer();
      showToast('할 일을 완료했습니다', res.task.title, () => Data.restoreTaskStatus(res.task.id, res.previousStatus));
    } else if (item.kind === 'call') {
      Data.resolveCallSuggestion(item.id, 'accepted');
      hero.cheer();
      showToast('통화 제안을 반영했습니다', item.call.suggestionAction);
    } else if (item.kind === 'signal') {
      Data.resolveSignal(item.id, '확인 완료');
      hero.cheer();
      showToast('신호를 처리했습니다', item.signal.title, () => Data.reopenSignal(item.id));
    }
  }

  function renderChrome() {
    appRoot.classList.toggle('sidebar-collapsed', !appState.sidebarOpen);

    // 2. Left Queue Toolbar
    const allCount = d.openTasks.length + d.pendingSuggestions.length + d.activeSignals.length;

    const filters = [
      { id: 'all', label: '전체 실행', count: allCount },
      { id: 'overdue', label: '기한 지남', count: d.overdueTasks.length },
      { id: 'today', label: '오늘 할 일', count: d.todayTasks.length },

    queueToolbar.innerHTML = `
      <div class="seg-group" role="tablist">

    // 3. Left Queue List

    queueScroll.querySelectorAll('[data-qidx]').forEach((row) => {

  function triggerCtiOverlay(override) {
    if (override) {
      appState.cti = { ...appState.cti, ...override, phase: 'connected', elapsedSec: 12, open: true };
    } else {
      appState.cti.open = !appState.cti.open;
      if (appState.cti.open) appState.cti.phase = 'ringing';
    }
    window.clearInterval(ctiTimer);
    if (appState.cti.open) {
      ctiTimer = window.setInterval(() => {
        if (!appState.cti.open) return;
        appState.cti.elapsedSec += 1;
        const tEl = ctiOverlay.querySelector('[data-cti-sec]');
        if (tEl) tEl.textContent = `${String(Math.floor(appState.cti.elapsedSec / 60)).padStart(2, '0')}:${String(appState.cti.elapsedSec % 60).padStart(2, '0')}`;
      }, 1000);
    }
    renderCtiOverlay();
    renderChrome();
  }

    if (!appState.cti.open) {
      ctiOverlay.classList.remove('open');
      return;
    }
    ctiOverlay.classList.add('open');
    const c = appState.cti;
    const mm = String(Math.floor(c.elapsedSec / 60)).padStart(2, '0');
    const ss = String(c.elapsedSec % 60).padStart(2, '0');
    ctiOverlay.innerHTML = `
      <div class="cti-head">
        <div style="display:flex;align-items:center;gap:7px">
          <span class="cti-pulse"></span>
          <span style="font-size:12px;font-weight:600;color:var(--success-strong)">${c.phase === 'ringing' ? '전화 수신 중 (CTI 브리지)' : '통화 연결됨'}</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="num" data-cti-sec style="font-size:11.5px;color:var(--fg3)">${mm}:${ss}</span>
          <button type="button" class="icon-btn" id="ctiCloseBtn" aria-label="전화 팝업 닫기">
            <svg viewBox="0 0 12 12" style="width:11px;height:11px;stroke:currentColor;stroke-width:1.8;fill:none"><path d="M2 2l8 8M10 2l-8 8"/></svg>
          </button>
        </div>
      </div>
      <div style="padding:12px 14px;display:flex;flex-direction:column;gap:10px">
        <div>
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:15px;font-weight:600">${esc(c.callerName)}</span>
            <span class="badge" data-tone="info">기존 고객</span>
          </div>
          <div style="font-size:12px;color:var(--fg2);margin-top:2px">${esc(c.callerRole)}</div>
          <div class="num" style="font-size:12px;color:var(--fg3);margin-top:1px">${esc(c.phone)}</div>
        </div>
        <div style="background:var(--bg-sub);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--fg2)">

        <div style="display:flex;gap:6px">
          <button type="button" class="micro-btn primary" id="ctiOpenDealTab" style="flex:1;height:28px">연결 거래 탭으로 열기</button>

        </div>
      </div>

    $('#ctiCloseBtn')?.addEventListener('click', () => triggerCtiOverlay(null));
    $('#ctiEndBtn')?.addEventListener('click', () => {

      window.clearInterval(ctiTimer);
      renderCtiOverlay();

      const it = target.item;
      entries.push({ label: '새 탭으로 열기', hint: '↵', action: () => openTab({ key: it.key, title: it.title, kind: it.kind, payload: { id: it.id }, dotColor: it.dotColor }) });
      entries.push({ label: '백그라운드 탭으로 열기', hint: '⌘↵', action: () => openTab({ key: it.key, title: it.title, kind: it.kind, payload: { id: it.id }, dotColor: it.dotColor }, { background: true }) });
      entries.push({ sep: true });
      entries.push({ label: it.kind === 'task' ? '완료 처리' : '확인·반영 처리', hint: 'Space', action: () => completeOrResolveQueueItem(it) });
      if (it.kind === 'task') {
        entries.push({ label: '내일로 미루기', hint: 'T', action: () => Data.snoozeTask(it.id, 1, '내일') });
      }
      entries.push({ sep: true });
      entries.push({ label: '전화 걸기 (CTI)', hint: '', action: () => triggerCtiOverlay({ callerName: it.task?.contactName || it.call?.contactName || '고객', callerRole: it.sub, phone: it.task?.contactPhone || '010-2847-1903', memo: it.title }) });
    } else if (target.type === 'deal') {
      const deal = target.deal;
      entries.push({ label: '거래 상세 탭 열기', hint: '↵', action: () => openTab({ key: `deal:${deal.id}`, title: `${deal.siteName} ${deal.dongHo}`, kind: 'deal', payload: { dealId: deal.id }, dotColor: 'var(--success)' }) });
      entries.push({ label: '백그라운드 탭으로 열기', hint: '⌘클릭', action: () => openTab({ key: `deal:${deal.id}`, title: `${deal.siteName} ${deal.dongHo}`, kind: 'deal', payload: { dealId: deal.id }, dotColor: 'var(--success)' }, { background: true }) });
      entries.push({ sep: true });
      entries.push({ label: '매수·임차인에게 전화 (CTI)', hint: '', action: () => triggerCtiOverlay({ callerName: deal.buyerName, callerRole: `${deal.siteName} ${deal.dongHo} 매수·임차인`, phone: deal.buyerPhone, memo: deal.specialTerms }) });

      .join('');

    const mw = ctxMenu.offsetWidth || 200;
    const mh = ctxMenu.offsetHeight || 160;
    ctxMenu.style.left = `${Math.min(x, window.innerWidth - mw - 8)}px`;
    ctxMenu.style.top = `${Math.min(y, window.innerHeight - mh - 8)}px`;

    ctxMenu.querySelectorAll('[data-ctx-idx]').forEach((btn) =>
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.ctxIdx);
        ctxMenu.classList.remove('open');
        entries[idx]?.action?.();
      }),
    );

  function renderCmdPalette() {
    if (!appState.cmdOpen) {
      cmdPalette.classList.remove('open');
      cmdPalette.setAttribute('aria-hidden', 'true');
      return;
    }
    cmdPalette.classList.add('open');
    cmdPalette.setAttribute('aria-hidden', 'false');

    const d = Data.getScopedData();
    const q = appState.cmdQuery.trim().toLowerCase();
    const entries = [
      ...d.deals.map((deal) => ({
        tag: '거래',
        label: `${deal.siteName} ${deal.dongHo}`,
        sub: `${deal.amountText} · ${deal.healthText}`,
        run: () => openTab({ key: `deal:${deal.id}`, title: `${deal.siteName} ${deal.dongHo}`, kind: 'deal', payload: { dealId: deal.id }, dotColor: 'var(--success)' }),
      })),
      ...d.openTasks.map((t) => ({
        tag: '할 일',
        label: t.title,
        sub: [t.propertyLabel, t.contactName].filter(Boolean).join(' · '),
        run: () => openTab({ key: `task:${t.id}`, title: t.title, kind: 'task', payload: { id: t.id }, dotColor: 'var(--info)' }),
      })),
      ...d.notices.map((n) => ({
        tag: '공지',
        label: n.title,
        sub: n.publishedAt,

      })),
      {

        sub: '상태바 범위 토글',
        run: () => Data.setScope(d.scope === 'mine' ? 'all' : 'mine'),
      },
      {
        tag: '명령',
        label: '사이드바 열기/접기',
        sub: '⌘\\',
        run: () => {
          appState.sidebarOpen = !appState.sidebarOpen;
          renderChrome();
        },
      },
      {
        tag: '명령',
        label: '수신 전화 오버레이 열기/닫기',
        sub: 'CTI 테스트',
        run: () => triggerCtiOverlay(null),
      },
    ].filter((e) => !q || `${e.tag} ${e.label} ${e.sub}`.toLowerCase().includes(q));

    if (appState.cmdIdx >= entries.length) appState.cmdIdx = Math.max(0, entries.length - 1);
    cmdList.innerHTML =
      entries.length === 0
        ? '<div style="padding:20px;text-align:center;color:var(--fg3)">일치하는 항목이 없습니다.</div>'
        : entries
            .slice(0, 12)
            .map(
              (e, idx) => `
            <button type="button" class="pal-item${idx === appState.cmdIdx ? ' active' : ''}" data-pal-idx="${idx}">
              <div style="display:flex;align-items:center;gap:8px;min-width:0">
                <span class="badge" data-tone="gray">${esc(e.tag)}</span>
                <span style="font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.label)}</span>
              </div>
              <span style="font-size:11px;color:var(--fg3);white-space:nowrap">${esc(e.sub)}</span>
            </button>`,
            )
            .join('');

    cmdList.querySelectorAll('[data-pal-idx]').forEach((btn) =>
      btn.addEventListener('click', () => {
        const chosen = entries[Number(btn.dataset.palIdx)];
        appState.cmdOpen = false;
        renderCmdPalette();
        chosen?.run();
      }),
    );
    appState._cmdEntries = entries;
  }

    ];
    const hours = [

      { h: 18, label: '18시 노을' },
      { h: 22, label: '22시 밤' },
    ];
    weatherPopover.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:12.5px;font-weight:600">히어로 날씨·시각 테스트</span>
        <span class="num" style="font-size:11.5px;color:var(--fg3)">${esc(st.clockLabel)}</span>

      <div class="wp-grid">
        ${presets.map((p) => `<button type="button" class="wp-chip${st.preset === p.id ? ' active' : ''}" data-wp-w="${p.id}">${esc(p.label)}</button>`).join('')}
      </div>
      <div class="wp-grid">
        ${hours.map((it) => `<button type="button" class="wp-chip${Math.abs(st.hour - it.h) < 1.5 ? ' active' : ''}" data-wp-h="${it.h}">${esc(it.label)}</button>`).join('')}
      </div>
      <div style="display:flex;gap:6px">
        <button type="button" class="micro-btn primary" id="wpSweepBtn" style="flex:1;height:26px">${st.sweeping ? '하루 흐름 정지' : '하루 흐름 재생'}</button>
        <button type="button" class="micro-btn" id="wpReplayBtn" style="height:26px">일출 재생</button>
      </div>

    $('#wpSweepBtn')?.addEventListener('click', () => {

  // Titlebar / Statusbar / Compact controls
  $('#sidebarToggleBtn').addEventListener('click', () => {
    appState.sidebarOpen = !appState.sidebarOpen;
    appState.sidebarPreviewOpen = false;
    renderChrome();
  });

  // Edge hover preview when sidebar collapsed
  let previewTimer = 0;
  const openPreview = () => {
    if (appState.sidebarOpen) return;
    appState.sidebarPreviewOpen = true;
    sidebarPreview.classList.add('open');
  };
  const closePreviewSoon = () => {
    window.clearTimeout(previewTimer);
    previewTimer = window.setTimeout(() => {
      if (!sidebarPreview.matches(':hover') && !$('#sidebarEdgeSensor').matches(':hover') && !$('#sidebarToggleBtn').matches(':hover')) {
        appState.sidebarPreviewOpen = false;
        sidebarPreview.classList.remove('open');
      }
    }, 180);
  };
  $('#sidebarEdgeSensor').addEventListener('pointerenter', openPreview);
  $('#sidebarToggleBtn').addEventListener('pointerenter', () => {
    if (!appState.sidebarOpen) {
      window.clearTimeout(previewTimer);
      previewTimer = window.setTimeout(openPreview, 240);
    }
  });
  $('#sidebarToggleBtn').addEventListener('pointerleave', closePreviewSoon);
  sidebarPreview.addEventListener('pointerenter', () => window.clearTimeout(previewTimer));
  sidebarPreview.addEventListener('pointerleave', closePreviewSoon);

  $('#navBackBtn').addEventListener('click', () => {
    if (appState.historyIdx > 0) {
      appState.historyIdx -= 1;
      activateTab(appState.history[appState.historyIdx], { recordHistory: false });
    }
  });
  $('#navFwdBtn').addEventListener('click', () => {
    if (appState.historyIdx < appState.history.length - 1) {
      appState.historyIdx += 1;
      activateTab(appState.history[appState.historyIdx], { recordHistory: false });
    }
  });

  const openCmd = () => {
    appState.cmdOpen = true;
    appState.cmdQuery = '';
    appState.cmdIdx = 0;
    cmdInput.value = '';
    renderCmdPalette();
    window.setTimeout(() => cmdInput.focus(), 10);
  };
  $('#cmdOpenBtn').addEventListener('click', openCmd);
  $('#tabAddBtn').addEventListener('click', openCmd);

  cmdInput.addEventListener('input', () => {
    appState.cmdQuery = cmdInput.value;
    appState.cmdIdx = 0;
    renderCmdPalette();
  });
  cmdPalette.addEventListener('click', (e) => {
    if (e.target === cmdPalette) {
      appState.cmdOpen = false;
      renderCmdPalette();
    }
  });

  $('#ctiToggleBtn').addEventListener('click', () => triggerCtiOverlay(null));
  $('#weatherBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    appState.weatherOpen = !appState.weatherOpen;
    renderWeatherPopover();
    renderChrome();
  });

  document.querySelectorAll('[data-sb-scope]').forEach((btn) =>
    btn.addEventListener('click', () => Data.setScope(btn.dataset.sbScope)),
  );

  $('#compactPaneBar').querySelectorAll('[data-compact-target]').forEach((btn) =>
    btn.addEventListener('click', () => {
      appState.compactPane = btn.dataset.compactTarget;
      splitRoot.dataset.compactPane = appState.compactPane;
      $('#compactPaneBar').querySelectorAll('[data-compact-target]').forEach((b) =>
        b.classList.toggle('active', b === btn),
      );
    }),
  );

  $('#quickAddForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const inp = $('#quickAddInput');
    const created = Data.addTask(inp.value);
    if (!created) return;
    inp.value = '';
    appState.activeQueueIdx = 0;
    showToast('새 할 일을 추가했습니다', created.title);
  });

  // Resizable 2-Pane Hairline Splitter
  const resizer = $('#paneResizer');
  resizer.addEventListener('dblclick', () => splitRoot.style.setProperty('--split-left', '56%'));
  resizer.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    resizer.classList.add('dragging');
    const rect = splitRoot.getBoundingClientRect();
    const onMove = (mv) => {
      const pct = ((mv.clientX - rect.left) / rect.width) * 100;
      const clamped = Math.min(66, Math.max(38, pct));
      splitRoot.style.setProperty('--split-left', `${clamped.toFixed(1)}%`);
    };
    const onUp = () => {
      resizer.classList.remove('dragging');
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  });

  // Dismiss menus on outside pointerdown
  document.addEventListener('pointerdown', (e) => {
    if (ctxMenu.classList.contains('open') && !e.target.closest('#ctxMenu')) {
      ctxMenu.classList.remove('open');
    }
    if (appState.weatherOpen && !e.target.closest('#weatherPopover') && !e.target.closest('#weatherBtn')) {
      appState.weatherOpen = false;
      renderWeatherPopover();
      renderChrome();
    }
  });

  // Desktop-native Keyboard Navigation
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      if (appState.cmdOpen) {
        appState.cmdOpen = false;
        renderCmdPalette();
      } else {
        openCmd();
      }
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key === '\\') {
      e.preventDefault();
      appState.sidebarOpen = !appState.sidebarOpen;
      appState.sidebarPreviewOpen = false;
      renderChrome();
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'w') {
      if (appState.activeTabId !== 'tab-dashboard') {
        e.preventDefault();
        closeTab(appState.activeTabId);
      }
      return;
    }

    if (e.key === 'Escape') {
      if (appState.cmdOpen) {
        appState.cmdOpen = false;
        renderCmdPalette();
        return;
      }
      if (ctxMenu.classList.contains('open')) {
        ctxMenu.classList.remove('open');
        return;
      }
      if (appState.weatherOpen) {
        appState.weatherOpen = false;
        renderWeatherPopover();
        renderChrome();
        return;
      }
      if (appState.cti.open) {
        appState.cti.open = false;
        window.clearInterval(ctiTimer);
        renderCtiOverlay();
        renderChrome();
      }
      return;
    }

    if (appState.cmdOpen) {
      const len = (appState._cmdEntries || []).length;
      if (e.key === 'ArrowDown' && len > 0) {
        e.preventDefault();
        appState.cmdIdx = Math.min(len - 1, appState.cmdIdx + 1);
        renderCmdPalette();
      } else if (e.key === 'ArrowUp' && len > 0) {
        e.preventDefault();
        appState.cmdIdx = Math.max(0, appState.cmdIdx - 1);
        renderCmdPalette();
      } else if (e.key === 'Enter' && len > 0) {
        e.preventDefault();
        const chosen = appState._cmdEntries[appState.cmdIdx];
        appState.cmdOpen = false;
        renderCmdPalette();
        chosen?.run();
      }
      return;
    }

    const tag = document.activeElement?.tagName;
    const isEditable = tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement?.isContentEditable;
    if (isEditable || activeTab().id !== 'tab-dashboard') return;

    const d = Data.getScopedData();
    const items = buildQueueItems(d);
    if (items.length === 0) return;

    if (e.key === 'ArrowDown' || e.key === 'j' || e.key === 'J') {
      e.preventDefault();
      appState.activeQueueIdx = Math.min(items.length - 1, appState.activeQueueIdx + 1);
      queueScroll.querySelectorAll('.q-row').forEach((r) => {
        const isSel = Number(r.dataset.qidx) === appState.activeQueueIdx;
        r.classList.toggle('is-selected', isSel);
        if (isSel) r.scrollIntoView({ block: 'nearest' });
      });
    } else if (e.key === 'ArrowUp' || e.key === 'k' || e.key === 'K') {
      e.preventDefault();
      appState.activeQueueIdx = Math.max(0, appState.activeQueueIdx - 1);
      queueScroll.querySelectorAll('.q-row').forEach((r) => {
        const isSel = Number(r.dataset.qidx) === appState.activeQueueIdx;
        r.classList.toggle('is-selected', isSel);
        if (isSel) r.scrollIntoView({ block: 'nearest' });
      });
    } else if (e.key === ' ') {
      if (e.target.closest('button, a')) return;
      e.preventDefault();
      completeOrResolveQueueItem(items[appState.activeQueueIdx]);
    } else if (e.key === 'Enter') {
      if (e.target.closest('button, a')) return;
      e.preventDefault();
      const it = items[appState.activeQueueIdx];
      if (it) openTab({ key: it.key, title: it.title, kind: it.kind, payload: { id: it.id }, dotColor: it.dotColor }, { background: e.metaKey || e.ctrlKey });
    } else if (e.key === 't' || e.key === 'T') {
      const it = items[appState.activeQueueIdx];
      if (it && it.kind === 'task') {
        const res = Data.snoozeTask(it.id, 1, '내일');
        if (res) showToast('내일로 미뤘습니다', res.task.title, () => Data.snoozeTask(it.id, res.prevOffset, '원래 기한'));
      }
    } else if (e.key === 'n' || e.key === 'N') {
      e.preventDefault();
      $('#quickAddInput').focus();
    }
  });

  Data.subscribe(() => {
    renderChrome();
    renderWorkspaceSurface();
  });

  renderChrome();
  renderWorkspaceSurface();
})();
</script>
</body>
</html>
