<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V1 · 모듈러 벤토 데스크 — Estait Flow 대시보드</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./shared-shell.css">
<link rel="stylesheet" href="./shared-hero.css">
<style>
  .bento-kpi {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
  }
  .kpi-card {
    background: var(--bg);
    border-radius: 12px;
    padding: 13px 15px 12px;
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: box-shadow 180ms ease, transform 180ms var(--ease-out);
  }
  @media (hover: hover) and (pointer: fine) {
    .kpi-card:hover {
      box-shadow: var(--shadow-card-hover);
      transform: translateY(-1px);
    }
  }
  .kpi-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 500;
    color: var(--fg3);
  }
  .kpi-val {
    font-size: 21px;
    line-height: 26px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--fg);
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .kpi-val small {
    font-size: 12px;
    font-weight: 500;
    color: var(--fg3);
  }
  .kpi-sub {
    font-size: 11.5px;
    color: var(--fg2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .prog-track {
    height: 5px;
    border-radius: 999px;
    background: var(--secondary);
    overflow: hidden;
    margin-top: 2px;
  }
  .prog-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--success);
    transition: width 320ms var(--ease-out);
  }

  .bento-main {
    display: grid;
    grid-template-columns: minmax(0, 1.32fr) minmax(0, 1fr);
    gap: 14px;
    align-items: stretch;
  }
  .bento-bottom {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    padding-bottom: 12px;
  }

  .card {
    background: var(--bg);
    border-radius: 12px;
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 15px 10px;
    border-bottom: 1px solid var(--border);
  }
  .card-title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
  }
  .card-title svg {
    color: var(--icon);
  }
  .card-count {
    font-size: 12px;
    font-weight: 500;
    color: var(--fg3);
  }
  .card-body {
    padding: 12px 15px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    min-height: 0;
  }

  /* 주간 7일 스트립 */
  .week-strip {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 4px;
  }
  .day-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 4px;
    border-radius: 8px;
    font-size: 11.5px;
    color: var(--fg3);
    transition: background-color 140ms ease, transform 140ms var(--ease-out);
  }
  .day-btn:hover {
    background: var(--hover);
  }
  .day-btn:active {
    transform: scale(0.96);
  }
  .day-btn[aria-pressed='true'] {
    background: var(--sel);
    color: var(--fg);
  }
  .day-num {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
  }
  .day-btn.is-today .day-num {
    background: var(--destructive);
    color: #ffffff;
  }
  .day-btn.is-past:not(.is-today) .day-num {
    color: var(--fg3);
  }
  .day-dots {
    display: flex;
    gap: 2.5px;
    height: 5px;
    align-items: center;
  }
  .day-dots i {
    width: 4.5px;
    height: 4.5px;
    border-radius: 50%;
    background: var(--orange);
  }
  .day-task-hint {
    font-size: 10.5px;
    color: var(--fg3);
    height: 14px;
    line-height: 14px;
  }

  .event-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .event-row {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) auto;
    align-items: center;
    gap: 8px;
    padding: 5px 7px;
    border-radius: 6px;
    font-size: 13px;
    transition: background-color 120ms ease;
    cursor: pointer;
  }
  .event-row:hover {
    background: var(--hover);
  }
  .event-time {
    font-weight: 600;
    font-size: 12.5px;
    color: var(--fg);
  }
  .event-title {
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .event-meta {
    font-size: 11.5px;
    color: var(--fg3);
    white-space: nowrap;
  }
  .now-line {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 7px;
    font-size: 11px;
    font-weight: 600;
    color: var(--destructive);
  }
  .now-line::after {
    content: '';
    flex: 1;
    border-top: 1px solid rgba(224, 62, 62, 0.5);
  }

  /* 할 일 탭 & 목록 */
  .sub-divider {
    border-top: 1px solid var(--border);
    padding-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .seg-tabs {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: var(--muted);
    padding: 2.5px;
    border-radius: 7px;
    align-self: flex-start;
  }
  .seg-tab {
    height: 24px;
    padding: 0 9px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 500;
    color: var(--fg2);
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background-color 140ms ease, color 140ms ease;
  }
  .seg-tab[aria-selected='true'] {
    background: var(--bg);
    color: var(--fg);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }
  .task-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 5px 7px;
    border-radius: 6px;
    transition: background-color 120ms ease;
  }
  .task-row:hover {
    background: var(--hover);
  }
  .task-main {
    flex: 1;
    min-width: 0;
  }
  .task-title {
    font-size: 13px;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .task-sub {
    font-size: 11.5px;
    color: var(--fg3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .task-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    opacity: 0;
    transition: opacity 120ms ease;
  }
  .task-row:hover .task-actions,
  .task-row:focus-within .task-actions {
    opacity: 1;
  }
  .inline-add {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px dashed var(--input);
    background: var(--muted);
  }
  .inline-add input {
    border: 0;
    background: transparent;
    outline: none;
    flex: 1;
    font-size: 13px;
    min-width: 0;
  }

  /* 거래 리스트 */
  .deal-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .deal-item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 4px 10px;
    padding: 8px 9px;
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: background-color 140ms ease, border-color 140ms ease;
  }
  .deal-item:hover {
    background: var(--muted);
    border-color: var(--input);
  }
  .deal-top {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .deal-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .deal-meta {
    font-size: 11.5px;
    color: var(--fg3);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .deal-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    gap: 4px;
  }

  /* 레이더 피드 아이템 */
  .feed-item {
    padding: 8px 9px;
    border-radius: 8px;
    background: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .feed-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .feed-title {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .feed-sub {
    font-size: 11.5px;
    color: var(--fg2);
    line-height: 16px;
  }
  .feed-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-top: 1px;
  }

  .notice-row {
    display: grid;
    grid-template-columns: 8px minmax(0, 1fr) auto;
    align-items: center;
    gap: 7px;
    width: 100%;
    padding: 6px 6px;
    border-radius: 6px;
    text-align: left;
    transition: background-color 120ms ease;
  }
  .notice-row:hover {
    background: var(--hover);
  }
  .unread-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--info);
  }

  @media (max-width: 1220px) {
    .bento-kpi {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .bento-main {
      grid-template-columns: 1fr;
    }
    .bento-bottom {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<script src="./shared-data.js"></script>
<script src="./shared-hero.js"></script>
<script src="./shared-shell.js"></script>
<script>
(() => {
  'use strict';

  const Data = window.DashMockData;
  const shell = window.mountDashShell({ activeId: 'v1' });

  const initial = Data.getScopedData();
  const hero = window.mountDashHero(shell.heroHostEl, {
    officeName: Data.state.officeName,
    userName: Data.state.userName,
    scope: initial.scope,
    counts: initial.heroCounts,
    flags: initial.heroFlags,
    onScopeChange: (nextScope) => Data.setScope(nextScope),
    onPin: (pin) => {
      if (pin === 'schedule') {
        Data.selectDay(Data.getScopedData().todayKey);
        shell.contentHostEl.querySelector('#v1WeekCard')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else {
        uiState.taskBucket = pin === 'overdue' ? 'overdue' : 'today';
        render();
        shell.contentHostEl.querySelector('#v1TaskBlock')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    },
    onQuickCreate: (btn) => shell.openQuickCreate(btn),
  });
  shell.bindHero(hero);

  const uiState = {
    taskBucket: 'today', // 'overdue' | 'today' | 'upcoming'
    dealFilter: 'all', // 'all' | 'preContract' | 'contracted' | 'settling'
    taskDraft: '',
  };

  function openDealDrawer(dealId) {
    const deal = Data.state.deals.find((d) => d.id === dealId);
    if (!deal) return;
    const stMeta = Data.STAGE_META[deal.stage] || { label: deal.stage, tone: 'gray', step: 1 };
    const renderBody = (bodyEl) => {
      const d = Data.state.deals.find((x) => x.id === dealId);
      bodyEl.innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--muted);padding:12px;border-radius:9px">
          <div><div style="font-size:11px;color:var(--fg3)">거래 금액</div><div style="font-size:15px;font-weight:600;margin-top:2px">${d.amountText}</div></div>
          <div><div style="font-size:11px;color:var(--fg3)">예상 중개보수</div><div style="font-size:15px;font-weight:600;margin-top:2px" class="num">${d.commissionExpectedManwon.toLocaleString('ko-KR')}만</div></div>
          <div><div style="font-size:11px;color:var(--fg3)">매도·임대인</div><div style="font-size:13px;font-weight:500;margin-top:2px">${d.sellerName} <span style="color:var(--fg3)">${d.sellerPhone}</span></div></div>
          <div><div style="font-size:11px;color:var(--fg3)">매수·임차인</div><div style="font-size:13px;font-weight:500;margin-top:2px">${d.buyerName} <span style="color:var(--fg3)">${d.buyerPhone}</span></div></div>
        </div>
        <div>
          <div style="font-size:12px;font-weight:600;color:var(--fg2);margin-bottom:8px">대금 스케줄 (클릭해 수령 상태 전환)</div>
          <div style="display:flex;flex-direction:column;gap:6px">
            ${d.payments
              .map(
                (p, idx) => `
              <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:8px">
                <button type="button" class="chk" data-pay-idx="${idx}" aria-checked="${p.paid}" aria-label="${p.kind} 완료">
                  <svg viewBox="0 0 12 12"><path pathLength="1" d="M2.5 6.4l2.4 2.4 4.6-5.3"/></svg>
                </button>
                <div style="flex:1">
                  <div style="font-size:13px;font-weight:500">${p.kind} · <span class="num">${p.amount}</span></div>
                  <div style="font-size:11.5px;color:var(--fg3)" class="num">${Data.relativeDateLabel(p.dateOffset)} (${Data.dDayLabel(p.dateOffset)})</div>
                </div>
                <span class="badge sm" data-tone="${p.paid ? 'success' : 'warning'}">${p.paid ? '입금완료' : '예정'}</span>
              </div>`,
              )
              .join('')}
          </div>
        </div>
        <div>
          <div style="font-size:12px;font-weight:600;color:var(--fg2);margin-bottom:6px">특약 및 메모</div>
          <div style="padding:10px 12px;border-radius:8px;background:var(--muted);font-size:13px;line-height:19px">${shell.escapeHtml(d.specialTerms)}</div>
        </div>
      `;
      bodyEl.querySelectorAll('[data-pay-idx]').forEach((btn) => {
        btn.addEventListener('click', () => {
          Data.toggleDealPaymentPaid(dealId, Number(btn.dataset.payIdx));
          renderBody(bodyEl);
          shell.showToast('대금 입금 상태를 반영했습니다', `${d.siteName} ${d.dongHo}`);
        });
      });
    };

    shell.openPeekDrawer({
      title: `${deal.siteName} ${deal.dongHo}`,
      subtitle: `담당 ${deal.assignee}${deal.isJointBrokerage ? ` · 공동중개 (${deal.partnerName})` : ' · 단독중개'}`,
      badgeHtml: `<span class="badge" data-tone="${stMeta.tone}">${stMeta.label}</span><span class="badge" data-tone="${deal.health === 'overdue' ? 'destructive' : deal.health === 'urgent' ? 'orange' : 'gray'}">${deal.healthText}</span>`,
      onMount: renderBody,
    });
  }

  function stepDotsHtml(step) {
    return `<span class="step-dots" title="${step}/5단계">${[1, 2, 3, 4, 5]
      .map((i) => `<span class="${i < step ? 'done' : i === step ? 'curr' : ''}"></span>`)
      .join('')}</span>`;
  }

  function render() {
    const d = Data.getScopedData();
    hero.setScope(d.scope);
    hero.updateCounts(d.heroCounts);
    hero.setFlags(d.heroFlags);

    const urgentDeal = d.scopedDeals
      .slice()
      .sort((a, b) => a.nextPaymentOffsetDays - b.nextPaymentOffsetDays)[0];

    const verifyAndAdCount = d.activeSignals.filter((s) => s.kind !== 'tenant_expiring').length;
    const adAndTenantCount = d.activeSignals.filter((s) => s.kind !== 'verify_overdue').length;

    const bucketMap = {
      overdue: d.overdueTasks,
      today: d.todayTasks,
      upcoming: d.upcomingTasks,
    };
    const activeTasks = bucketMap[uiState.taskBucket] || [];

    const filteredDeals = d.deals.filter((deal) => {
      if (uiState.dealFilter === 'all') return true;
      return deal.stage === uiState.dealFilter;
    });

    const isTodaySelected = d.selectedDayKey === d.todayKey;
    const nowHourNum = d.now.getHours() + d.now.getMinutes() / 60;
    let nowInserted = false;

    const eventsMarkup = d.selectedDayEvents.length
      ? d.selectedDayEvents
          .map((ev) => {
            let line = '';
            if (isTodaySelected && !nowInserted && ev.hour > nowHourNum) {
              nowInserted = true;
              line = `<div class="now-line num">${Data.formatHour(nowHourNum)} 지금</div>`;
            }
            return `${line}<div class="event-row" data-event-id="${ev.id}">
              <span class="event-time num">${Data.formatHour(ev.hour)}</span>
              <span class="event-title">${shell.escapeHtml(ev.title)}</span>
              <span class="event-meta">${shell.escapeHtml(ev.propertyLabel)}${d.scope === 'all' ? ` · ${ev.assignee}` : ''}</span>
            </div>`;
          })
          .join('') +
        (isTodaySelected && !nowInserted ? `<div class="now-line num">${Data.formatHour(nowHourNum)} 지금</div>` : '')
      : '<div style="padding:8px 6px;font-size:12.5px;color:var(--fg3)">선택한 날에 잡힌 일정이 없습니다.</div>';

    const verifySignals = d.activeSignals.filter((s) => s.kind === 'verify_overdue' || s.kind === 'ad_alert');

    shell.contentHostEl.innerHTML = `
      <section class="bento-kpi" aria-label="핵심 업무 현황">
        <article class="kpi-card">
          <div class="kpi-head"><span>이번 달 수금</span><span class="badge sm" data-tone="success">${d.summary.collectionPct}%</span></div>
          <div class="kpi-val num">${Data.formatMoneyManwon(d.summary.collectedManwon)}<small>/ ${Data.formatMoneyManwon(d.summary.expectedManwon)}</small></div>
          <div class="prog-track"><div class="prog-fill" style="width:${d.summary.collectionPct}%"></div></div>
          <div class="kpi-sub"><span>이번 달 계약 ${d.summary.contractCount}건</span><span style="color:var(--fg3)">예정 기준</span></div>
        </article>
        <article class="kpi-card" style="cursor:pointer" data-jump="deals">
          <div class="kpi-head"><span>진행 중 거래</span><span class="badge sm" data-tone="${urgentDeal?.health === 'overdue' ? 'destructive' : 'orange'}">${urgentDeal ? urgentDeal.healthText : '안정'}</span></div>
          <div class="kpi-val num">${d.summary.activeDeals}<small>건</small></div>
          <div class="kpi-sub"><span>다음 임박: ${urgentDeal ? `${urgentDeal.siteName} ${urgentDeal.nextPaymentLabel}` : '없음'}</span></div>
        </article>
        <article class="kpi-card" style="cursor:pointer" data-jump="signals">
          <div class="kpi-head"><span>매물·광고 확인 필요</span><span class="badge sm" data-tone="${verifyAndAdCount > 0 ? 'destructive' : 'success'}">${verifyAndAdCount > 0 ? '조치 필요' : '양호'}</span></div>
          <div class="kpi-val num">${d.summary.unverifiedListings}<small>건</small></div>
          <div class="kpi-sub"><span>전체 활성 매물 ${d.summary.activeListings}건</span><span>경보 ${verifyAndAdCount}건</span></div>
        </article>
        <article class="kpi-card" style="cursor:pointer" data-jump="calls">
          <div class="kpi-head"><span>임박·후속 알림</span><span class="badge sm" data-tone="violet">통화 제안 ${d.pendingSuggestions.length}</span></div>
          <div class="kpi-val num">${adAndTenantCount + d.pendingSuggestions.length}<small>건</small></div>
          <div class="kpi-sub"><span>만기 60일 세입자 ${d.summary.expiringTenants}명</span><span>진행 매칭 ${d.summary.activeMatches}건</span></div>
        </article>
      </section>

      <section class="bento-main">
        <article class="card" id="v1WeekCard">
          <div class="card-head">
            <div class="card-title">
              <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              <span>이번 주 일정 & 할 일</span>
              <span class="card-count num">일정 ${d.selectedDayEvents.length} · 할 일 ${d.openTasks.length}</span>
            </div>
            <button type="button" class="btn btn-outline btn-xs" data-role="resetToday">오늘로</button>
          </div>
          <div class="card-body">
            <div class="week-strip" role="group" aria-label="주간 요일 선택">
              ${d.weekDays
                .map((wd) => {
                  const evCnt = d.eventCountByDay[wd.key] || 0;
                  const tkCnt = d.taskCountByDay[wd.key] || 0;
                  return `<button type="button" class="day-btn${wd.isToday ? ' is-today' : ''}${wd.isPast ? ' is-past' : ''}" data-day="${wd.key}" aria-pressed="${wd.key === d.selectedDayKey}">
                    <span>${wd.weekday}</span>
                    <span class="day-num num">${wd.dayNum}</span>
                    <span class="day-dots">${Array.from({ length: Math.min(evCnt, 3) }, () => '<i></i>').join('')}</span>
                    <span class="day-task-hint num">${tkCnt > 0 ? `할일 ${tkCnt}` : ''}</span>
                  </button>`;
                })
                .join('')}
            </div>

            <div class="event-list">${eventsMarkup}</div>

            <div class="sub-divider" id="v1TaskBlock">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
                <div class="seg-tabs" role="tablist" aria-label="할 일 구분">
                  <button type="button" class="seg-tab" data-bucket="overdue" aria-selected="${uiState.taskBucket === 'overdue'}">지남 <span class="num" style="color:${d.overdueTasks.length > 0 ? 'var(--destructive-strong)' : 'var(--fg3)'}">${d.overdueTasks.length}</span></button>
                  <button type="button" class="seg-tab" data-bucket="today" aria-selected="${uiState.taskBucket === 'today'}">오늘 <span class="num">${d.todayTasks.length}</span></button>
                  <button type="button" class="seg-tab" data-bucket="upcoming" aria-selected="${uiState.taskBucket === 'upcoming'}">다가옴 <span class="num">${d.upcomingTasks.length}</span></button>
                </div>
                <span style="font-size:11.5px;color:var(--fg3)">체크 시 즉시 완료 처리</span>
              </div>

              <div>
                ${
                  activeTasks.length === 0
                    ? '<div style="padding:10px 6px;font-size:12.5px;color:var(--fg3)">해당 구간에 남은 할 일이 없습니다.</div>'
                    : activeTasks
                        .map(
                          (t) => `
                  <div class="task-row">
                    <button type="button" class="chk" data-complete-task="${t.id}" aria-checked="false" aria-label="${shell.escapeHtml(t.title)} 완료">
                      <svg viewBox="0 0 12 12"><path pathLength="1" d="M2.5 6.4l2.4 2.4 4.6-5.3"/></svg>
                    </button>
                    <div class="task-main">
                      <div class="task-title">${shell.escapeHtml(t.title)}</div>
                      <div class="task-sub">${[t.propertyLabel, t.contactName, d.scope === 'all' ? t.assignee : null].filter(Boolean).join(' · ')}</div>
                    </div>
                    <div class="task-actions">
                      <button type="button" class="btn btn-outline btn-xs" data-snooze-task="${t.id}">내일로</button>
                    </div>
                    <span class="badge sm" data-tone="${t.dueOffsetDays < 0 ? 'destructive' : t.dueOffsetDays === 0 ? 'info' : 'gray'}">${Data.dDayLabel(t.dueOffsetDays)}</span>
                  </div>`,
                        )
                        .join('')
                }
              </div>

              <form class="inline-add" data-role="addTaskForm">
                <span style="color:var(--fg3);font-weight:600">+</span>
                <input type="text" data-role="taskInput" value="${shell.escapeHtml(uiState.taskDraft)}" placeholder="오늘 할 일 빠르게 적고 Enter..." aria-label="오늘 할 일 추가">
              </form>
            </div>
          </div>
        </article>

        <article class="card" id="v1DealCard">
          <div class="card-head">
            <div class="card-title">
              <svg class="ic" viewBox="0 0 24 24"><path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="M3 4h8"/><path d="M14 14l2.5 2.5a1 1 0 1 0 3-3"/></svg>
              <span>진행 거래 현황</span>
              <span class="card-count num">${d.deals.length}건</span>
            </div>
            <div class="seg-tabs" role="group" aria-label="거래 단계 필터">
              <button type="button" class="seg-tab" data-deal-filter="all" aria-selected="${uiState.dealFilter === 'all'}">전체</button>
              <button type="button" class="seg-tab" data-deal-filter="preContract" aria-selected="${uiState.dealFilter === 'preContract'}">가계약</button>
              <button type="button" class="seg-tab" data-deal-filter="contracted" aria-selected="${uiState.dealFilter === 'contracted'}">본계약</button>
              <button type="button" class="seg-tab" data-deal-filter="settling" aria-selected="${uiState.dealFilter === 'settling'}">잔금</button>
            </div>
          </div>
          <div class="card-body">
            <div class="deal-list">
              ${filteredDeals
                .map((deal) => {
                  const st = Data.STAGE_META[deal.stage] || { label: deal.stage, tone: 'gray', step: 1 };
                  const healthTone = deal.health === 'overdue' ? 'destructive' : deal.health === 'urgent' ? 'orange' : 'gray';
                  return `
                  <div class="deal-item" data-deal-id="${deal.id}" tabindex="0" role="button">
                    <div style="min-width:0;display:flex;flex-direction:column;gap:4px">
                      <div class="deal-top">
                        <span class="deal-name">${deal.siteName} ${deal.dongHo}</span>
                        ${deal.isJointBrokerage ? '<span class="badge sm" data-tone="gray">공동</span>' : ''}
                      </div>
                      <div class="deal-meta">
                        <span class="num" style="font-weight:500;color:var(--fg2)">${deal.amountText}</span>
                        <span>${deal.sellerName} ↔ ${deal.buyerName}</span>
                        <span>· ${deal.assignee}</span>
                      </div>
                    </div>
                    <div class="deal-right">
                      <div style="display:flex;align-items:center;gap:6px">
                        ${stepDotsHtml(st.step)}
                        <span class="badge sm" data-tone="${st.tone}">${st.label}</span>
                      </div>
                      <span class="num" style="font-size:11.5px;font-weight:600;color:var(--${healthTone === 'gray' ? 'fg3' : healthTone === 'orange' ? 'orange' : 'destructive-strong'})">${deal.healthText}</span>
                    </div>
                  </div>`;
                })
                .join('')}
            </div>
          </div>
        </article>
      </section>

      <section class="bento-bottom">
        <article class="card" id="v1SignalCard">
          <div class="card-head">
            <div class="card-title">
              <svg class="ic" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              <span>매물·광고 경보</span>
              <span class="card-count num">${verifySignals.length}</span>
            </div>
          </div>
          <div class="card-body">
            ${
              verifySignals.length === 0
                ? '<div style="padding:18px 8px;text-align:center;font-size:12.5px;color:var(--fg3)">모든 매물 확인과 광고 경보를 처리했습니다.</div>'
                : verifySignals
                    .map(
                      (s) => `
              <div class="feed-item">
                <div class="feed-top">
                  <span class="badge sm" data-tone="${s.tone}">${s.badge}</span>
                  <span style="font-size:11px;color:var(--fg3)">${s.assignee}</span>
                </div>
                <div class="feed-title">${shell.escapeHtml(s.title)}</div>
                <div class="feed-sub">${shell.escapeHtml(s.sub)}</div>
                <div class="feed-actions">
                  <span style="font-size:11px;color:var(--fg3)">${shell.escapeHtml(s.owner)}</span>
                  <button type="button" class="btn btn-outline btn-xs" data-resolve-signal="${s.id}">
                    ${s.kind === 'verify_overdue' ? '확인완료' : '반영확인'}
                  </button>
                </div>
              </div>`,
                    )
                    .join('')
            }
          </div>
        </article>

        <article class="card" id="v1CallCard">
          <div class="card-head">
            <div class="card-title">
              <svg class="ic" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <span>통화·상담 후속</span>
              <span class="card-count num">${d.pendingSuggestions.length}</span>
            </div>
          </div>
          <div class="card-body">
            ${
              d.pendingSuggestions.length === 0
                ? '<div style="padding:18px 8px;text-align:center;font-size:12.5px;color:var(--fg3)">대기 중인 통화 분석 제안이 없습니다.</div>'
                : d.pendingSuggestions
                    .map(
                      (c) => `
              <div class="feed-item">
                <div class="feed-top">
                  <span class="badge sm" data-tone="${c.tone}">${c.badge}</span>
                  <span style="font-size:11px;color:var(--fg3)">${c.timeAgo}</span>
                </div>
                <div class="feed-title">${shell.escapeHtml(c.contactName)}</div>
                <div class="feed-sub">${shell.escapeHtml(c.summary)}</div>
                <div class="feed-actions">
                  <span style="font-size:11px;font-weight:600;color:var(--info-strong)">${shell.escapeHtml(c.suggestionAction)}</span>
                  <div style="display:flex;gap:4px">
                    <button type="button" class="btn btn-info btn-xs" data-call-accept="${c.id}">반영</button>
                    <button type="button" class="btn btn-ghost btn-xs" data-call-dismiss="${c.id}">무시</button>
                  </div>
                </div>
              </div>`,
                    )
                    .join('')
            }
          </div>
        </article>

        <article class="card">
          <div class="card-head">
            <div class="card-title">
              <svg class="ic" viewBox="0 0 24 24"><path d="m3 11 18-5v12L3 14v-3z"/></svg>
              <span>공지사항</span>
            </div>
            <span class="num" style="font-size:11.5px;color:var(--info-strong)">안 읽음 ${d.unreadNotices.length}</span>
          </div>
          <div class="card-body">
            ${d.notices
              .map(
                (n) => `
                <button type="button" class="notice-row" data-notice-id="${n.id}">
                  <span class="${n.readAt ? '' : 'unread-dot'}"></span>
                  <span style="min-width:0;display:flex;align-items:center;gap:5px">
                    ${n.isRequired ? '<span class="badge sm" data-tone="destructive">필독</span>' : ''}
                    <span style="font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:${n.readAt ? 400 : 600};color:${n.readAt ? 'var(--fg2)' : 'var(--fg)'}">${shell.escapeHtml(n.title)}</span>
                  </span>
                  <span class="num" style="font-size:11px;color:var(--fg3)">${n.publishedAt}</span>
                </button>`,
              )
              .join('')}
          </div>
        </article>
      </section>
    `;

    // Bind events
    const root = shell.contentHostEl;
    root.querySelectorAll('[data-day]').forEach((btn) =>
      btn.addEventListener('click', () => Data.selectDay(btn.dataset.day)),
    );
    root.querySelector('[data-role="resetToday"]')?.addEventListener('click', () => Data.selectDay(d.todayKey));

    root.querySelectorAll('[data-bucket]').forEach((btn) =>
      btn.addEventListener('click', () => {
        uiState.taskBucket = btn.dataset.bucket;
        render();
      }),
    );

    root.querySelectorAll('[data-deal-filter]').forEach((btn) =>
      btn.addEventListener('click', () => {
        uiState.dealFilter = btn.dataset.dealFilter;
        render();
      }),
    );

    root.querySelectorAll('[data-complete-task]').forEach((btn) =>
      btn.addEventListener('click', () => {
        btn.setAttribute('aria-checked', 'true');
        const res = Data.completeTask(btn.dataset.completeTask);
        if (!res) return;
        hero.cheer();
        shell.showToast('업무를 완료했습니다', res.task.title, () => Data.restoreTaskStatus(res.task.id, res.previousStatus));
      }),
    );

    root.querySelectorAll('[data-snooze-task]').forEach((btn) =>
      btn.addEventListener('click', () => {
        const res = Data.snoozeTask(btn.dataset.snoozeTask, 1, '내일');
        if (res) {
          shell.showToast('내일로 미뤘습니다', res.task.title, () => Data.snoozeTask(res.task.id, res.prevOffset, '원래 기한'));
        }
      }),
    );

    const taskInput = root.querySelector('[data-role="taskInput"]');
    taskInput?.addEventListener('input', (e) => {
      uiState.taskDraft = e.target.value;
    });
    root.querySelector('[data-role="addTaskForm"]')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = uiState.taskDraft.trim();
      if (!val) return;
      uiState.taskDraft = '';
      uiState.taskBucket = 'today';
      Data.addTask(val);
      shell.showToast('오늘 할 일에 추가했습니다', val);
    });

    root.querySelectorAll('[data-deal-id]').forEach((el) =>
      el.addEventListener('click', () => openDealDrawer(el.dataset.dealId)),
    );

    root.querySelectorAll('[data-event-id]').forEach((el) =>
      el.addEventListener('click', () => {
        const ev = Data.state.events.find((x) => x.id === el.dataset.eventId);
        if (!ev) return;
        shell.openPeekDrawer({
          title: ev.title,
          subtitle: `${Data.formatHour(ev.hour)} · 담당 ${ev.assignee}`,
          badgeHtml: `<span class="badge" data-tone="orange">일정</span>`,
          bodyHtml: `<div style="display:grid;gap:10px;background:var(--muted);padding:12px;border-radius:9px">
            <div><div style="font-size:11px;color:var(--fg3)">매물/단지</div><div style="font-size:13.5px;font-weight:500;margin-top:2px">${shell.escapeHtml(ev.propertyLabel)}</div></div>
            <div><div style="font-size:11px;color:var(--fg3)">고객</div><div style="font-size:13.5px;font-weight:500;margin-top:2px">${shell.escapeHtml(ev.contactName)}</div></div>
            <div><div style="font-size:11px;color:var(--fg3)">메모</div><div style="font-size:13px;margin-top:2px">${shell.escapeHtml(ev.memo)}</div></div>
          </div>`,
        });
      }),
    );

    root.querySelectorAll('[data-resolve-signal]').forEach((btn) =>
      btn.addEventListener('click', () => {
        const sig = Data.resolveSignal(btn.dataset.resolveSignal, '확인 완료');
        if (sig) {
          if (sig.kind === 'verify_overdue') hero.cheer();
          shell.showToast('경보를 처리했습니다', sig.title, () => Data.reopenSignal(sig.id));
        }
      }),
    );

    root.querySelectorAll('[data-call-accept]').forEach((btn) =>
      btn.addEventListener('click', () => {
        const item = Data.resolveCallSuggestion(btn.dataset.callAccept, 'accepted');
        if (item) {
          hero.cheer();
          shell.showToast('통화 제안을 반영했습니다', item.suggestionAction);
        }
      }),
    );

    root.querySelectorAll('[data-call-dismiss]').forEach((btn) =>
      btn.addEventListener('click', () => {
        const item = Data.resolveCallSuggestion(btn.dataset.callDismiss, 'dismissed');
        if (item) shell.showToast('제안을 건너뛰었습니다', item.contactName);
      }),
    );

    root.querySelectorAll('[data-notice-id]').forEach((btn) =>
      btn.addEventListener('click', () => {
        const notice = Data.state.notices.find((n) => n.id === btn.dataset.noticeId);
        if (notice) shell.openNoticeModal(notice);
      }),
    );

    root.querySelectorAll('[data-jump]').forEach((card) =>
      card.addEventListener('click', () => {
        const target = card.dataset.jump;
        const map = { deals: '#v1DealCard', signals: '#v1SignalCard', calls: '#v1CallCard' };
        root.querySelector(map[target])?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }),
    );
  }

  Data.subscribe(render);
  render();
})();
</script>
</body>
</html>
