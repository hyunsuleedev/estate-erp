<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>직원 정산 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="shared.css" />
<style>
  #tbl { --min: 980px; }
  .pin-1 { left: 0; }
  .pin-2 { left: 36px; border-right: 1px solid var(--head-line) !important; }
  .sub-name { padding-left: 18px; }
  .settle-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .settle-tbl th { height: 30px; border-bottom: 1px solid var(--head-line); color: var(--muted-fg); font-weight: 500; text-align: left; }
  .settle-tbl td { height: 32px; border-bottom: 1px solid var(--hair); }
  .settle-tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<script src="icons.js"></script>
<script src="data.js"></script>
<script src="shared.js"></script>
<script>
(function () {
  const { esc, icon, money, ymd, md, badge, loc, participantState, TODAY } = CF;
  const main = CF.shell({ page: 'employee', title: '직원 정산', restricted: true });
  if (!main) return;

  const state = { tab: 'all', search: '', selected: new Set(), expanded: new Set() };
  const THIS_MONTH = TODAY.slice(0, 7);

  main.innerHTML = `<div class="page">
    <div class="tb line" id="tb"></div>
    <div class="strip" id="strip"></div>
    <div class="band" id="band"></div>
    <div class="scroll" id="body"></div>
    ${CF.statusbar('')}
  </div>`;
  CF.wireReset(main);
  const $ = (id) => document.getElementById(id);

  function rowsAll() {
    return CF.SEED.users.map((u) => {
      const parts = CF.db.deals.flatMap((deal) => deal.participants.filter((w) => w.userId === u.id).map((w) => ({ deal, w, st: participantState(deal, w), amt: CF.partAmount(deal, w) })));
      const sumOf = (fn) => parts.filter(fn).reduce((a, x) => a + x.amt, 0);
      return {
        user: u, parts,
        ready: sumOf((x) => x.st.key === 'ready'),
        readyN: parts.filter((x) => x.st.key === 'ready').length,
        wait: sumOf((x) => x.st.key === 'waiting' || x.st.key === 'partial'),
        settled: sumOf((x) => x.st.key === 'settled'),
        settledMonth: sumOf((x) => x.st.key === 'settled' && (x.w.settlementDate || '').startsWith(THIS_MONTH)),
        withheldMonth: parts.filter((x) => x.st.key === 'settled' && (x.w.settlementDate || '').startsWith(THIS_MONTH)).reduce((a, x) => a + (x.w.withheld || 0), 0),
        total: sumOf(() => true),
        unsettledN: parts.filter((x) => x.st.key !== 'settled').length,
      };
    }).filter((r) => r.user.isActive || r.parts.length);
  }
  function visible() {
    const q = state.search.trim().toLowerCase();
    return rowsAll().filter((r) => {
      if (state.tab === 'ready' && !r.ready) return false;
      if (state.tab === 'unsettled' && !r.unsettledN) return false;
      if (q && ![r.user.name, r.user.phone, ...r.parts.map((x) => loc(x.deal))].join(' ').toLowerCase().includes(q)) return false;
      return true;
    }).sort((a, b) => b.ready - a.ready || b.wait - a.wait || b.total - a.total);
  }

  function renderTb() {
    const all = rowsAll();
    const tabs = [['all', '전체', all.length], ['ready', '정산 가능', all.filter((r) => r.ready).length], ['unsettled', '미정산', all.filter((r) => r.unsettledN).length]];
    const tb = $('tb');
    const q = state.search;
    tb.innerHTML = `<div class="pills" role="tablist" aria-label="직원 범위">${tabs.map(([k, l, n]) => `<button type="button" role="tab" aria-selected="${state.tab === k}" class="${state.tab === k ? 'on' : ''}" data-tab="${k}">${l}<span class="n">${n}</span></button>`).join('')}</div>
      <label class="search">${icon('search')}<span class="sr">검색</span><input id="q" type="search" placeholder="직원, 전화번호, 호수" value="${esc(q)}" /></label>
      <span class="spacer"></span>
      <button type="button" class="ghost" id="csv">${icon('download')} 내보내기</button>`;
    tb.querySelector('#q').addEventListener('input', (e) => { state.search = e.target.value; renderBand(); renderBody(); });
    tb.querySelector('#csv').addEventListener('click', () => {
      const rows = visible().flatMap((r) => r.parts.map((x) => [r.user.name, CF.TAX_TYPE[r.user.taxType], loc(x.deal), CF.PART_ROLE[x.w.role], x.w.commissionRate, x.amt, x.w.withheld || '', x.st.key === 'settled' ? CF.round1(x.amt - (x.w.withheld || 0)) : '', x.st.key === 'settled' ? '정산 완료' : x.st.key === 'ready' ? '정산 가능' : '수금 대기', x.w.settlementDate || '']));
      CF.downloadCsv('직원정산.csv', [['직원', '소득 구분', '거래', '역할', '배분률(%)', '배분액(만원)', '원천징수(만원)', '실지급(만원)', '상태', '정산일'], ...rows]);
      CF.toast(`${rows.length}건을 CSV로 내보냈습니다.`);
    });
    tb.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => { state.tab = b.dataset.tab; state.selected.clear(); renderTb(); renderBand(); renderBody(); }));
  }

  function renderStrip() {
    const all = rowsAll();
    const t = all.reduce((a, r) => { a.ready += r.ready; a.readyN += r.readyN; a.wait += r.wait; a.month += r.settledMonth; a.wh += r.withheldMonth; a.total += r.total; a.settled += r.settled; return a; }, { ready: 0, readyN: 0, wait: 0, month: 0, wh: 0, total: 0, settled: 0 });
    const waitN = all.reduce((a, r) => a + r.unsettledN - r.readyN, 0);
    $('strip').innerHTML = `
      <div class="stat"><div class="l">정산 가능</div><div class="v">${money(t.ready)}</div><div class="h">고객 수금 끝난 ${t.readyN}건</div></div>
      <div class="stat"><div class="l">고객 수금 대기</div><div class="v">${money(t.wait)}</div><div class="h">${waitN}건</div></div>
      <div class="stat"><div class="l">이번 달 정산 완료</div><div class="v">${money(t.month)}</div><div class="h">${t.wh ? `원천징수 ${money(CF.round1(t.wh))} · 12월 10일까지 신고` : '11월 기준'}</div></div>
      <div class="stat"><div class="l">누적 배분</div><div class="v">${money(t.total)}</div><div class="h">정산 완료 ${money(t.settled)}</div></div>`;
  }

  function allParts() { return rowsAll().flatMap((r) => r.parts); }

  function renderBand() {
    const band = $('band');
    if (state.selected.size) {
      const picked = allParts().filter((x) => state.selected.has(x.w.id));
      const sum = picked.reduce((a, x) => a + x.amt, 0);
      band.innerHTML = `<span class="item"><b>${picked.length}건 선택</b></span><span class="item">합계 <b>${money(sum)}</b></span><span class="spacer"></span>
        <button type="button" class="btn dark" id="do-settle">정산 처리</button><button type="button" class="ghost" id="clear">선택 해제</button>`;
      band.querySelector('#do-settle').addEventListener('click', settleDialog);
      band.querySelector('#clear').addEventListener('click', () => { state.selected.clear(); renderBand(); renderBody(); });
      return;
    }
    const list = visible();
    const active = list.filter((r) => r.user.isActive).length;
    const unsettled = list.reduce((a, r) => a + r.unsettledN, 0);
    const readyN = list.reduce((a, r) => a + r.readyN, 0);
    band.innerHTML = `<span class="item">활성 직원 <b>${active}명</b></span><span class="item">미정산 <b>${unsettled}건</b></span><span class="spacer"></span>${readyN ? `<button type="button" class="item" id="pick-ready">정산 가능 ${readyN}건 모두 선택</button>` : ''}`;
    const pick = band.querySelector('#pick-ready');
    if (pick) pick.addEventListener('click', () => {
      list.forEach((r) => {
        r.parts.forEach((x) => { if (x.st.key === 'ready') state.selected.add(x.w.id); });
        if (r.ready) state.expanded.add(r.user.id);
      });
      renderBand(); renderBody();
    });
  }

  function renderBody() {
    const list = visible();
    $('status-text').textContent = `직원 ${list.length}명 · 거래 참여 ${list.reduce((a, r) => a + r.parts.length, 0)}건 표시`;
    if (!list.length) {
      $('body').innerHTML = `<div class="empty">${icon('users')}<b>조건에 맞는 직원이 없습니다</b><p>범위나 검색어를 바꿔 보세요.</p></div>`;
      return;
    }
    const rows = list.map((r) => {
      const u = r.user;
      const isOpen = state.expanded.has(u.id) || !!state.search;
      const pay = `${CF.PAY_TYPE[u.payType]}${u.baseSalary ? ` · 기본급 ${money(u.baseSalary)}` : ''} · ${CF.TAX_TYPE[u.taxType]}`;
      const selectable = r.parts.filter((x) => x.st.key !== 'settled');
      const on = selectable.filter((x) => state.selected.has(x.w.id)).length;
      const head = `<tr class="grp" data-fold="${u.id}" style="cursor:pointer">
        <td class="pin-l pin-1" style="padding:0">${selectable.length ? `<input class="cb" type="checkbox" data-user="${u.id}" aria-label="${esc(u.name)} 미정산 전체 선택" ${on && on === selectable.length ? 'checked' : ''} data-ind="${on > 0 && on < selectable.length ? 1 : 0}">` : ''}</td>
        <td class="pin-l pin-2"><div class="name-cell"><button type="button" class="chev-btn" aria-expanded="${isOpen}" aria-label="${isOpen ? '접기' : '펼치기'}">${icon(isOpen ? 'chevron-down' : 'chevron-right')}</button><span class="nm">${esc(u.name)}</span><span class="muted" style="font-size:12px">${CF.ROLE[u.role]}</span>${u.isActive ? '' : '<span class="badge t-gray">비활성</span>'}</div></td>
        <td style="font-weight:400" title="${esc(pay)}">${esc(pay)}</td>
        <td class="num" style="font-weight:400">${u.commissionRate != null ? `${u.commissionRate}%` : '—'}</td>
        <td class="num">${money(r.ready)}</td><td class="num">${money(r.wait)}</td><td class="num">${money(r.settled)}</td><td class="num">${money(r.total)}</td>
      </tr>`;
      if (!isOpen) return head;
      const order = { ready: 0, partial: 1, waiting: 2, settled: 3 };
      const subs = [...r.parts].sort((a, b) => order[a.st.key] - order[b.st.key]).map((x) => {
        const { deal, w, st, amt } = x;
        const canPick = st.key !== 'settled';
        const sel = state.selected.has(w.id);
        const waitTitle = st.billed ? `고객 수금 ${money(st.got)} / ${money(st.billed)}` : '';
        return `<tr class="sub click ${sel ? 'sel' : ''}" data-open="${deal.id}">
          <td class="pin-l pin-1" style="padding:0">${canPick ? `<input class="cb" type="checkbox" data-part="${w.id}" aria-label="${esc(loc(deal))} 선택" ${sel ? 'checked' : ''}>` : ''}</td>
          <td class="pin-l pin-2"><div class="name-cell sub-name"><span class="nm" title="${esc(loc(deal))}">${esc(loc(deal))}</span>${badge('tx', deal.transactionType)}</div></td>
          <td class="muted">${CF.PART_ROLE[w.role] || w.role} · ${CF.statusLabel('stage', deal.stage)}</td>
          <td class="num muted">${w.commissionRate}%</td>
          <td class="num">${st.key === 'ready' ? money(amt) : ''}</td>
          <td class="num" title="${esc(waitTitle)}">${st.key === 'waiting' || st.key === 'partial' ? money(amt) : ''}</td>
          <td class="num" title="${w.settlementDate ? `${ymd(w.settlementDate)} 정산${w.withheld ? ` · 원천징수 ${money(w.withheld)} · 실지급 ${money(CF.round1(amt - w.withheld))}` : ''}` : ''}">${st.key === 'settled' ? money(amt) : ''}</td>
          <td class="num muted">${st.key === 'settled' ? `${md(w.settlementDate)} 정산` : st.billed ? `수금 ${st.pct}%` : ''}</td>
        </tr>`;
      }).join('');
      return head + subs;
    }).join('');
    $('body').innerHTML = `<table class="tbl" id="tbl"><colgroup><col style="width:36px"><col style="min-width:290px"><col style="width:178px"><col style="width:68px"><col style="width:96px"><col style="width:96px"><col style="width:96px"><col style="width:96px"></colgroup>
      <thead><tr><th class="pin-l pin-1" style="padding:0"><span class="sr">선택</span></th><th class="pin-l pin-2">직원 · 거래</th><th>급여 · 역할</th><th class="num">배분률</th><th class="num">정산 가능</th><th class="num">수금 대기</th><th class="num">정산 완료</th><th class="num">누적 · 상태</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
    $('body').querySelectorAll('[data-ind="1"]').forEach((i) => { i.indeterminate = true; });
  }

  /** 정산 처리: 직원별 지급액, 원천징수, 실지급액을 보여 주고 지급한 금액으로 고정한다 */
  function settleDialog() {
    const picked = allParts().filter((x) => state.selected.has(x.w.id));
    const notReady = picked.filter((x) => x.st.key !== 'ready');
    // 원천징수는 저장과 같게 건마다 계산해 더한다.
    const byUser = new Map();
    picked.forEach((x) => {
      const v = byUser.get(x.w.userId) || { gross: 0, wh: 0 };
      byUser.set(x.w.userId, { gross: v.gross + x.amt, wh: v.wh + CF.withholdingOf(x.w.userId, x.amt) });
    });
    const lines = [...byUser.entries()].map(([id, v]) => {
      const wh = CF.round1(v.wh);
      return { u: CF.userById(id), gross: v.gross, wh, net: CF.round1(v.gross - wh) };
    });
    const totalWh = CF.round1(lines.reduce((a, l) => a + l.wh, 0));
    CF.dialog({
      title: `${picked.length}건 정산 처리`,
      desc: '직원에게 실제로 지급한 뒤 기록하세요. 처리한 건은 지급한 금액으로 고정되고 내 수수료 화면에도 정산 완료로 보입니다.',
      submit: '정산 완료 처리',
      width: 500,
      body: `<table class="settle-tbl"><thead><tr><th>직원</th><th>소득 구분</th><th class="num">배분액</th><th class="num">원천징수</th><th class="num">실지급</th></tr></thead>
        <tbody>${lines.map((l) => `<tr><td>${esc(l.u.name)}</td><td class="muted">${CF.TAX_TYPE[l.u.taxType]}</td><td class="num">${money(l.gross)}</td><td class="num">${l.wh ? money(l.wh) : '—'}</td><td class="num strong">${l.u.taxType === 'none' ? '—' : money(l.net)}</td></tr>`).join('')}</tbody></table>
        <small class="muted" style="font-size:12px;line-height:1.5">사업소득은 3.3%(소득세 3% + 지방소득세 0.3%)를 떼고 지급한 달의 다음 달 10일까지 원천세를 신고합니다${totalWh ? ` (이번 ${money(totalWh)})` : ''}. 근로소득 직원의 수당은 급여와 함께 처리하므로 여기서 떼지 않습니다. 대표 몫은 지급 대상이 아닙니다.</small>
        ${notReady.length ? `<small class="amber" style="font-size:12.5px;line-height:1.5">고객 수금이 끝나지 않은 ${notReady.length}건이 포함되어 있습니다. 먼저 지급하는 경우에만 진행하세요.</small>` : ''}
        <div class="field"><label for="e-d">정산일</label><input id="e-d" class="input tnum" name="date" type="date" value="${TODAY}"></div>`,
      onSubmit: (fd) => {
        const date = fd.get('date') || TODAY;
        picked.forEach((x) => {
          x.w.settledGross = x.amt;
          x.w.withheld = CF.withholdingOf(x.w.userId, x.amt);
          x.w.settlementStatus = 'settled';
          x.w.settlementDate = date;
          CF.log(x.deal, `${x.w.userName} 정산 ${money(x.amt)}${x.w.withheld ? ` · 원천징수 ${money(x.w.withheld)}` : ''}`);
        });
        state.selected.clear();
        CF.commit();
        CF.toast(`${picked.length}건을 정산 완료로 기록했습니다.${totalWh ? ` 원천징수 ${money(totalWh)}` : ''}`);
        return undefined;
      },
    });
  }

  main.addEventListener('click', (e) => {
    const t = e.target;
    if (t.closest('input.cb')) return;
    if (t.closest('.pin-1')) return;
    if (t.closest('.band')) return;
    const row = t.closest('[data-open]');
    if (row) { CF.openDeal(row.dataset.open); return; }
    const fold = t.closest('[data-fold]');
    if (fold) {
      const id = fold.dataset.fold;
      if (state.expanded.has(id)) state.expanded.delete(id); else state.expanded.add(id);
      renderBody();
    }
  });
  main.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.part) {
      if (t.checked) state.selected.add(t.dataset.part); else state.selected.delete(t.dataset.part);
    } else if (t.dataset.user) {
      const r = rowsAll().find((x) => x.user.id === t.dataset.user);
      r.parts.filter((x) => x.st.key !== 'settled').forEach((x) => { if (t.checked) state.selected.add(x.w.id); else state.selected.delete(x.w.id); });
      state.expanded.add(t.dataset.user);
    } else return;
    renderBand(); renderBody();
  });

  /* 정산 가능한 건이 있는 직원은 펼쳐서 시작한다 */
  rowsAll().forEach((r) => { if (r.ready) state.expanded.add(r.user.id); });
  CF.onChange(() => { renderTb(); renderStrip(); renderBand(); renderBody(); });
  renderTb(); renderStrip(); renderBand(); renderBody();
})();
</script>
</body>
</html>
