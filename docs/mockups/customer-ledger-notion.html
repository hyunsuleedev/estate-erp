<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고객 원장 — Notion형 시안</title>
<!--
  고객 원장(/customers-table, /customers) Notion형 시안. 2026-11-19.
  이 파일 하나로 열린다(file://). 외부 글꼴·스크립트·이미지를 불러오지 않는다. 데이터는 모두 가상이고 기준일은 2026-11-19(목)로 고정했다.

  전제: 고객은 의뢰 없이도 원장에 있다. 의뢰가 정해지기 전의 문의 손님도 접수·검색·상담·다음 연락·소개 기록을 할 수 있어야 한다.
  - 상담, 다음 연락, 의뢰 없이 소개한 매물은 고객에게 붙는다. 의뢰가 없다고 가짜 의뢰를 만들지 않는다(의뢰 0건으로 센다).
  - 의뢰가 생기면 같은 고객 줄에 의뢰만 더해지고, 그동안의 상담·다음 연락·소개 기록은 그대로 남는다.
    구함 의뢰를 등록할 때는 의뢰 없이 소개한 매물을 그 의뢰 아래로 옮길지 고른다(고른 대로만 옮긴다).
  - 담당은 의뢰가 없는 동안 고객 줄에서(접수한 사람), 의뢰가 생기면 의뢰마다 정한다.

  구성
  - 접힌 줄: 고객 · 최근 상담 · 의뢰 건수 · 담당 · 다음 연락. 의뢰별 조건과 소개 기록은 펼친 하위 표에서 본다. 제목·지표 타일은 두지 않는다.
  - 펼친 자리(왼쪽 고객 칸 아래는 고객 메모, 오른쪽은 아래 순서):
      최근 상담 한 줄 → 다음 연락 한 줄 → (의뢰 없이) 소개한 매물 → 중개 건(사용자가 직접 묶은 것)과 의뢰 → 의뢰 등록
      구함 의뢰 아래에는 소개한 매물(소개일 · 당시 가격 → 지금 가격 · 반응 · 메모), 내놓음 의뢰 아래에는 소개한 손님.
  - 중개 건은 서버가 묶지 않는다. 순서 번호는 사람이 정한 진행 계획의 순서이고, 의뢰를 가리키지 않는 단계("잔금·이사")도 있다.
  - 보기 탭: 전체 · 문의(의뢰 없는 고객) · 구함 · 내놓음. 담당 필터는 의뢰가 없으면 고객의 담당을, 있으면 의뢰의 담당을 본다.
    의뢰 상태 필터를 켜면 의뢰 없는 고객은 빠진다. 다음 연락 필터와 검색은 모든 고객에게 같다.

  되는 것: 고객 추가(이름 또는 구별되는 별칭 필수, 연락처·첫 상담·다음 연락 선택), 검색, 보기 탭, 필터, 정렬, 펼침,
          상담 추가(유형·내용·다음 연락 함께 정하기), 다음 연락 정하기·지우기·연락함, 소개 기록 추가·반응·메모,
          이름·연락처 나중에 넣기·고치기, 의뢰 등록(첫 의뢰 포함), 의뢰 담당·상태 바꾸기, 직전 변경 되돌리기.
  안 되는 것: 중개 건 묶기·풀기, 저장(새로 고치면 처음 상태). 소개 기록은 시안에 넣어 둔 후보에서만 고른다.

  색은 apps/desktop/src/renderer/app.css 토큰 값, 글자는 12·14 두 크기다.
-->
<style>
  :root {
    --fg: #2c2c2b;
    --fg-sub: #5f5e59;
    --muted: #79766f;
    --icon: #8e8b86;
    --faint: #a3a09a;
    --line: #f0efed;
    --line-strong: #e6e5e3;
    --side: #f9f8f7;
    --hover: rgba(33, 27, 23, 0.05);
    --row-hover: #fbfaf9;
    --info: #2383e2; --info-strong: #1b64b1;
    --success: #0f7b6c;
    --red: #e03e3e; --red-strong: #bb3430;
    --warning-strong: #8a5a13;
    --pop: 0 20px 24px rgba(25, 25, 25, 0.05), 0 5px 8px rgba(25, 25, 25, 0.027), 0 0 0 1px rgba(42, 28, 0, 0.07);
    --w-tog: 32px; --w-name: 218px; --w-asg: 102px; --w-next: 140px; --w-act: 44px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
      "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--fg); background: #fff;
    font-size: 14px; line-height: 21px;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
  input, textarea, select { font: inherit; color: inherit; }
  p { margin: 0; }
  :focus-visible { outline: 2px solid rgba(35, 131, 226, 0.55); outline-offset: -2px; }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  svg.i.sm { width: 14px; height: 14px; }
  svg.i.xs { width: 12px; height: 12px; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
  .tr { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .f12 { font-size: 12px; line-height: 18px; color: var(--muted); }
  .grow { flex: 1; }

  /* 앱 틀: 사이드바는 자리만 보여 주는 그림이다 */
  .app { height: 100%; display: flex; }
  .side { width: 240px; flex: none; background: var(--side); border-right: 1px solid var(--line); padding: 10px 8px; overflow: hidden; user-select: none; }
  .side .office { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; margin-bottom: 4px; font-weight: 600; }
  .side .office i { width: 22px; height: 22px; border-radius: 5px; background: var(--fg); color: #fff; display: grid; place-items: center; font-style: normal; font-size: 12px; }
  .side .grp { margin: 14px 8px 4px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .side .nav { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 6px; color: var(--fg-sub); }
  .side .nav svg { color: var(--icon); }
  .side .nav.on { background: #eeedec; color: var(--fg); font-weight: 500; }
  .side .nav.on svg { color: var(--fg-sub); }
  @media (max-width: 1199px) { .side { display: none; } :root { --w-name: 224px; } }

  .page { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #fff; }

  /* 보기 탭 + 도구 줄 */
  .viewbar { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 4px 16px 0; }
  .tabs { display: flex; align-items: center; gap: 2px; margin-left: -4px; flex: none; }
  .vtab { height: 32px; padding: 0 12px; border-radius: 16px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; transition: background-color .12s, color .12s; }
  .vtab:hover, .vtab[aria-selected="true"] { background: var(--hover); color: var(--fg); }
  .tools { margin-left: auto; display: flex; align-items: center; gap: 2px; min-width: 0; }
  .tool { height: 28px; min-width: 28px; padding: 0 6px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; color: var(--muted); flex: none; transition: background-color .12s, color .12s; }
  .tool:hover, .tool[aria-pressed="true"] { background: var(--hover); color: var(--fg); }
  .tool.has { color: var(--info); font-weight: 500; }
  .search { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 6px; border-radius: 6px; min-width: 0; }
  .search:focus-within { background: rgba(33, 27, 23, 0.04); }
  .search > svg { color: var(--muted); }
  .search input { width: 200px; min-width: 60px; height: 28px; border: 0; outline: 0; background: transparent; }
  .search input::placeholder { color: var(--muted); }
  .search .clr { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; visibility: hidden; }
  .search.has .clr { visibility: visible; }
  .search .clr:hover { background: rgba(33, 27, 23, 0.08); color: var(--fg); }
  .btn-primary { height: 30px; padding: 0 12px 0 10px; border-radius: 8px; background: var(--fg); color: #fff; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; flex: none; white-space: nowrap; }
  .btn-primary:hover { background: #000; }
  .btn-primary.sm { height: 28px; padding: 0 12px; border-radius: 6px; }
  .viewbar .btn-primary { margin-left: 8px; }
  .btn-text { height: 28px; padding: 0 8px; border-radius: 6px; color: var(--fg-sub); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; flex: none; transition: background-color .12s, color .12s; }
  .btn-text:hover { background: var(--hover); color: var(--fg); }
  .btn-text.f12 { height: 24px; padding: 0 6px; color: var(--muted); }
  .btn-text.f12:hover { color: var(--fg); }

  /* 필터 줄 */
  .filters { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 0 14px 6px; }
  .chip { display: inline-flex; align-items: center; height: 28px; max-width: 260px; border-radius: 14px; color: #6f6c66; transition: background-color .12s, color .12s; }
  .chip:hover, .chip.open { background: rgba(60, 52, 40, 0.06); color: var(--fg); }
  .chip .main { display: inline-flex; align-items: center; gap: 6px; height: 100%; min-width: 0; padding: 0 10px; border-radius: 14px; white-space: nowrap; }
  .chip .main svg.sm { color: var(--faint); }
  .chip .main svg.xs { color: #a5a39f; }
  .chip.on { background: rgba(35, 131, 226, 0.1); color: var(--info); }
  .chip.on:hover { background: rgba(35, 131, 226, 0.15); }
  .chip.on .main { padding: 0 4px 0 10px; }
  .chip.on .main svg { color: currentColor; }
  .chip.on b { font-weight: 600; }
  .chip .x { width: 22px; height: 22px; margin-right: 3px; border-radius: 50%; display: grid; place-items: center; color: var(--info); flex: none; }
  .chip .x:hover { background: rgba(35, 131, 226, 0.18); }

  /* 표 */
  .scroller { flex: 1; min-height: 0; overflow: auto; scroll-padding: 40px 0 8px; }
  .sheet { min-width: 880px; padding: 0 16px; }
  .row { display: grid; grid-template-columns: var(--w-tog) var(--w-name) minmax(0, 1fr) 60px var(--w-asg) var(--w-next) var(--w-act); align-items: center; }
  .head { position: sticky; top: 0; z-index: 5; height: 34px; background: #fff; border-bottom: 1px solid var(--line-strong); font-size: 12px; color: var(--muted); }
  .head .hc { display: flex; align-items: center; gap: 6px; height: 100%; padding: 0 8px; min-width: 0; white-space: nowrap; }
  .head .hc svg { color: var(--faint); }
  .head button.hc { width: 100%; border-radius: 4px; }
  .head button.hc:hover { background: var(--hover); color: var(--fg); }
  .head .hc .dir { color: var(--fg-sub); transition: transform .12s; }
  .head .hc .dir.desc { transform: rotate(180deg); }

  .cust { border-bottom: 1px solid var(--line); }
  .crow { height: 38px; cursor: pointer; transition: background-color .1s; }
  .crow:hover { background: var(--row-hover); }
  .cell { min-width: 0; padding: 0 8px; display: flex; align-items: center; gap: 8px; height: 100%; }
  .tog { width: 24px; height: 24px; margin-left: 4px; border-radius: 4px; display: grid; place-items: center; color: var(--icon); }
  .tog:hover { background: var(--hover); color: var(--fg); }
  .tog svg { transition: transform .12s; }
  .tog[aria-expanded="true"] svg { transform: rotate(90deg); }
  .c-name .nm { font-weight: 600; white-space: nowrap; flex: 0 1 auto; }
  .c-name .ph { font-size: 12px; color: var(--muted); white-space: nowrap; flex: 0 1000 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .intake-panel { grid-column:2 / -1; margin:8px 8px 0; min-width:0; }
  .intake-heading { display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line-strong); padding:5px 0; }
  .intake-heading strong { font-size:14px; }
  .intake-heading button { margin-left:auto; }
  .intake-columns, .irow { display:grid; grid-template-columns: minmax(0,1fr) 84px 102px; align-items:center; }
  .intake-columns { color:var(--muted); font-size:12px; padding:6px 0; }
  .intake-columns span { padding-left:8px; }
  .intake-columns span:first-child { padding-left:36px; }
  .crow .summary { display:block; color:var(--fg-sub); }
  .kind { font-size: 12px; font-weight: 500; margin-right: 6px; }
  .kind.demand { color: var(--info-strong); }
  .kind.listing { color: var(--success); }
  .off .kind { color: var(--muted); }
  .c-asg { color: var(--fg-sub); white-space: nowrap; }
  .c-act .tool { opacity: 0; transition: opacity .1s, background-color .12s; }
  .crow:hover .c-act .tool, .c-act .tool:focus-visible { opacity: 1; }

  /* 다음 연락·담당 칸 단추 */
  .cellbtn { display: inline-flex; align-items: baseline; gap: 6px; height: 26px; line-height: 26px; margin-left: -6px; padding: 0 6px; border-radius: 4px; max-width: calc(100% + 6px); white-space: nowrap; transition: background-color .1s; }
  .cellbtn:hover, .cellbtn[aria-expanded="true"] { background: var(--hover); }
  .cellbtn .rel { font-size: 12px; color: var(--muted); }
  .cellbtn .over { color: var(--red-strong); }
  .cellbtn .today { font-weight: 600; }
  .cellbtn .none { color: var(--faint); }
  .dash { color: var(--faint); }

  /* 알약 */
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 4px; font-size: 12px; line-height: 20px; white-space: nowrap; flex: none; }
  button.pill:hover { filter: brightness(0.96); }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.open { background: #eef3ed; color: #44745a; }
  .pill.hold { background: #fbf3db; color: #9f6b00; }
  .pill.closed { background: #f1f1ef; color: #6f6d6a; }
  .pill.like { background: #eef3ed; color: #44745a; }
  .pill.think { background: #fbf3db; color: #9f6b00; }
  .pill.no { background: #f1f1ef; color: #6f6d6a; }
  .pill.wait { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); }

  /* 펼친 자리 */
  .exp { display: grid; grid-template-columns: var(--w-tog) var(--w-name) minmax(0, 1fr); padding: 0 0 18px; }
  .exp.just { animation: reveal .16s ease-out; }
  @keyframes reveal { from { opacity: 0; transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .exp.just, .newcust.just { animation: none; } * { transition: none !important; } }
  .exp-side { grid-column: 2; padding: 2px 8px 0; }
  .exp-side p + p { margin-top: 2px; }
  .exp-main { grid-column: 3; min-width: 0; }
  .kv { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; align-items: baseline; column-gap: 8px; min-height: 30px; padding: 0 8px; line-height: 30px; }
  .kv .k { font-size: 12px; color: var(--muted); }
  .kv .v { min-width: 0; display: flex; align-items: baseline; gap: 10px; }
  .kv .v .when { font-size: 12px; color: var(--muted); white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 5px; align-self: center; }
  .kv .v .when svg { color: var(--icon); }
  .kv .v .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kv.full .v .txt { white-space: normal; line-height: 21px; padding: 4px 0 5px; }
  .kv .acts { display: inline-flex; align-items: center; gap: 2px; align-self: center; }
  .kv .note { color: var(--fg); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kv .for { font-size: 12px; color: var(--muted); white-space: nowrap; flex: none; }
  .kv .empty { color: var(--muted); }
  .kv.old .k { visibility: hidden; }
  .kv.old .v .txt { color: var(--fg-sub); }

  /* 상담 추가 */
  .composer { margin: 4px 8px 8px 80px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px 8px; }
  .composer:focus-within { border-color: #cfcdc8; }
  .composer textarea { display: block; width: 100%; min-height: 42px; max-height: 168px; margin: 6px 0 4px; padding: 0; border: 0; outline: 0; resize: none; background: transparent; line-height: 21px; }
  .composer textarea::placeholder { color: var(--faint); }
  .cmp-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
  .cmp-foot .k { font-size: 12px; color: var(--muted); margin-right: 2px; }
  .cmp-btns { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; flex: none; }
  .typeseg { display: inline-flex; gap: 1px; }
  .typeseg button, .preset { height: 24px; padding: 0 8px; border-radius: 12px; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; transition: background-color .1s, color .1s; }
  .typeseg button:hover, .preset:hover { background: var(--hover); color: var(--fg); }
  .typeseg button[aria-pressed="true"], .preset[aria-pressed="true"] { background: #eeedec; color: var(--fg); font-weight: 500; }
  .field { height: 26px; padding: 0 6px; border: 1px solid var(--line-strong); border-radius: 6px; background: #fff; outline: 0; font-size: 12px; }
  .field:focus { border-color: var(--info); box-shadow: 0 0 0 2px rgba(35, 131, 226, 0.18); }
  .field.on { border-color: #cfcdc8; color: var(--fg); }
  select.field { padding-right: 2px; max-width: 220px; }
  .err { font-size: 12px; line-height: 18px; color: var(--red-strong); min-height: 18px; }
  .composer .err { min-height: 0; padding-top: 4px; }
  .composer .err:empty { display: none; }

  /* 의뢰 없는 고객, 새 고객, 의뢰 등록 */
  .kind.none { color: var(--muted); }
  .c-req .seg.inq { color: var(--fg-sub); }
  .exp-side .nophone { color: var(--faint); }
  .id-open { margin: 4px 0 0 -6px; }
  .id-edit { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .id-edit .field { width: 100%; height: 30px; font-size: 14px; }
  .id-edit .err:empty { display: none; }
  .id-edit .err { min-height: 0; }
  .id-btns { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
  .cintros { padding: 0 8px 4px 80px; }
  .tree-add { padding: 4px 8px 0 32px; }
  .newcust { display: grid; grid-template-columns: var(--w-tog) var(--w-name) minmax(0, 1fr); padding: 10px 0 12px; border-bottom: 1px solid var(--line); }
  .newcust.just { animation: reveal .16s ease-out; }
  .nc-id { grid-column: 2; display: flex; flex-direction: column; gap: 6px; padding: 0 8px; min-width: 0; }
  .nc-id .field { width: 100%; height: 30px; font-size: 14px; }
  .nc-id .field::placeholder, .line-input::placeholder { color: var(--faint); }
  .nc-main { grid-column: 3; min-width: 0; }
  .newcust .composer { margin: 0 8px; }
  .line-input { display: block; width: 100%; height: 30px; margin: 6px 0 4px; padding: 0; border: 0; outline: 0; background: transparent; }
  .frow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .vsep { width: 1px; height: 14px; background: var(--line-strong); }
  .pricerow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 0 0 8px; font-size: 12px; color: var(--muted); }
  .pricerow .field { height: 28px; font-size: 14px; }
  .pricerow .pv { color: var(--fg-sub); }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-sub); cursor: pointer; margin-left: 6px; }

// 만원 단위 숫자. 쉼표와 빈칸은 봐준다. 숫자가 아니면 null.
function parseMan(s) {
  const t = String(s).replace(/[,\s]/g, '');
  return /^\d{1,7}$/.test(t) ? Number(t) : null;
}
const phoneDigits = (s) => String(s).replace(/\D/g, '');
function formatPhone(digits) {
  if (digits.startsWith('02')) return digits.replace(/^(02)(\d{3,4})(\d{4})$/, '$1-$2-$3');
  return digits.replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3');
}
const normName = (s) => s.replace(/\s+/g, ' ').trim().toLowerCase();

function findCustomer(cid) { return state.customers.find((c) => c.id === cid); }
function findIntake(id) {
  for (const c of state.customers) { const it = c.intakes.find((i) => i.id === id); if (it) return { c, it }; }
  return null;
}
// 소개 기록의 주인: 의뢰(id) 또는 고객('@' + 고객 id, 의뢰 없이 소개한 것)
function introOwner(oid) {
  if (oid[0] === '@') { const c = findCustomer(oid.slice(1)); return c ? { c, it: null, list: c.intros } : null; }
  const f = findIntake(oid);
  return f ? { c: f.c, it: f.it, list: f.it.intros } : null;
}
function findIntro(id) {
  for (const c of state.customers) {
    const own = c.intros.find((x) => x.id === id);
    if (own) return { c, it: null, m: own };
    for (const it of c.intakes) { const m = it.intros.find((x) => x.id === id); if (m) return { c, it, m }; }
  }
  return null;
}
// 소개 기록·후보에 보일 이름: 원장 고객을 가리키면 그 고객의 지금 이름
const shownName = (m) => (m.cid && findCustomer(m.cid)?.name) || m.name;
const refKey = (m) => (m.cid ? '#' + m.cid : m.name);
const activeIntakes = (c) => c.intakes.filter((i) => i.status !== 'closed');
const intakeLabel = (it) => `${KIND[it.kind]} ${TX[it.tx]}`;
// 고객 줄의 담당: 의뢰가 없으면 접수한 사람, 있으면 진행 중인 의뢰의 담당
function custAssignees(c) {
  if (!c.intakes.length) return c.assignee ? [c.assignee] : [];
  const act = activeIntakes(c);
  return [...new Set((act.length ? act : c.intakes).map((i) => i.assignee))];
}
// 다음 연락은 고객에게 붙는다. 의뢰가 모두 종료된 고객은 '미정'으로 치지 않는다.
function nextBucket(c) {
  if (!c.next) return c.intakes.length && !activeIntakes(c).length ? null : 'none';
  const d = diff(c.next.d);
  if (d < 0) return 'over';
  if (d === 0) return 'today';
  return d <= 7 ? 'week' : 'later';
}
// 소개 기록에 고를 후보. 같은 목록(그 의뢰, 또는 의뢰 없이 소개한 목록)에 이미 있는 것만 뺀다.
// 같은 손님을 이 고객의 다른 매물 의뢰에, 같은 매물을 다른 구함 의뢰에 다시 소개하는 것은 따로 남길 기록이다.
function buyerCandidates(c, it) {
  const used = new Set((it ? it.intros : c.intros).map(refKey));
  const seen = new Set();
  return [...it.pool, ...BUYER_POOL].filter((p) => {
    if (p.cid ? p.cid === c.id || !findCustomer(p.cid) : p.name === c.name) return false;   // 자기 자신, 원장에서 사라진 고객
    const key = refKey(p);
    if (used.has(key) || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

// 사무소 매물장 예시. 구함 의뢰에 준비한 후보를 먼저 제시하고 다른 의뢰의 매물도 검색할 수 있다.
const officeProperties = [
  ...INITIAL.flatMap(customer => [
    ...customer.pool.map(p => ({ ...p, tx: Array.isArray(p.now) ? 'monthly' : 'sale' })),
    ...customer.intakes.filter(it => it.kind === 'demand').flatMap(it =>
      it.pool.map(p => ({ ...p, tx: it.tx }))),
  ]),
  ...PROPERTY_POOL.map(p => ({ ...p, tx: 'sale' })),
];
const picker = $('#property-picker');
const propertyForm = $('#property-form');
let picking = null;
function openPropertyPicker(oid, owner) {
  const preferred = new Set(owner.it?.pool.map(refKey) || []);
  const seen = new Set(owner.list.map(refKey));
  const rows = officeProperties.filter(p => {
    const key = refKey(p);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  picking = { oid, rows, preferred, selected: null };
  propertyForm.reset();
  propertyForm.elements.day.max = TODAY;
  propertyForm.elements.day.value = TODAY;
  $('#property-context').textContent = [owner.c.name, owner.it?.short || '의뢰 없이 소개'].join(' · ');
  showPickedProperty(null);
  renderPropertyResults();
  picker.showModal();
  $('#property-search').focus();
}
function renderPropertyResults() {
  const query = $('#property-search').value.trim().toLowerCase().split(/\s+/);
  const { rows, preferred } = picking;
  const parts = [];
  for (const group of [true, false]) {
    const choices = [];
    rows.forEach((p, index) => {
      if (preferred.has(refKey(p)) !== group) return;
      const words = (p.name + ' ' + p.spec + ' ' + TX[p.tx]).toLowerCase();
      if (!query.every(word => words.includes(word))) return;
      choices.push(`<label><input type="radio" name="property" value="${index}" ${p === picking.selected ? 'checked' : ''}><span>${esc(p.name)}<small>${TX[p.tx]} · ${esc(p.spec)} · ${won(p.now)}</small></span></label>`);
    });
    if (choices.length) parts.push(`<h3>${group ? '이 의뢰의 후보' : '사무소 매물'}</h3>` + choices.join(''));
  }
  $('#property-results').innerHTML = parts.join('') || '<p class="empty">검색 조건에 맞는 매물이 없습니다.</p>';
}
function showPickedProperty(p) {
  picking.selected = p;
  const monthly = Array.isArray(p?.now);
  $('#property-price-label').textContent = monthly ? '당시 보증금' : '소개 당시 가격';
  for (const [key, visible, value] of [['price', !!p, monthly ? p.now[0] : p?.now], ['rent', monthly, monthly ? p.now[1] : null]]) {
    const field = propertyForm.elements[key];
    field.disabled = !visible;
    field.parentElement.hidden = !visible;
    field.value = value ?? '';
  }
  $('#property-save').disabled = !p;
}
$('#property-search').addEventListener('input', () => {
  showPickedProperty(null);
  renderPropertyResults();
});
propertyForm.addEventListener('change', e => {
  if (e.target.name === 'property') showPickedProperty(picking.rows[Number(e.target.value)]);
});
picker.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !e.isComposing) { e.preventDefault(); picker.close(); }
});
$('#property-cancel').onclick = () => picker.close();
propertyForm.addEventListener('submit', e => {
  e.preventDefault();
  const { selected: p, oid } = picking;
  if (!p) return;
  const { day, via, price, rent } = propertyForm.elements;
  const then = Array.isArray(p.now) ? [price.valueAsNumber, rent.valueAsNumber] : price.valueAsNumber;
  picker.close();
  state.focusAfter = 'addintro:' + oid;
  state.introsClosed.delete(oid);
  commit('매물 소개 기록을 추가했습니다', () => {
    introOwner(oid).list.unshift({ id: newId('m'), name: p.name, spec: p.spec, now: clone(p.now), then,
      d: day.value, via: via.value, rx: 'wait', memo: '' });
  });
});

/* ───────── 필터와 검색 ───────── */
const chipCount = () => ['assignee', 'next', 'status'].filter((k) => state.f[k].size).length;
// 의뢰를 가르는 필터가 켜져 있나(펼친 자리에서 맞지 않는 의뢰를 흐리게 하는 기준)
const intakeFiltersOn = () => state.mode === 'demand' || state.mode === 'listing' || state.f.assignee.size || state.f.status.size;
function intakeMatch(it) {
  if ((state.mode === 'demand' || state.mode === 'listing') && it.kind !== state.mode) return false;
  if (state.f.assignee.size && !state.f.assignee.has(it.assignee)) return false;
  if (state.f.status.size && !state.f.status.has(it.status)) return false;
  return true;
}
function customerMatch(c) {
  if (state.f.next.size && !state.f.next.has(nextBucket(c))) return false;
  if (!c.intakes.length) {                         // 의뢰 없는 고객: 의뢰 종류·상태로는 걸리지 않는다
    if (state.mode === 'demand' || state.mode === 'listing') return false;
    if (state.f.status.size) return false;
    return !state.f.assignee.size || state.f.assignee.has(c.assignee);
  }
  if (state.mode === 'inquiry') return false;
  return c.intakes.some(intakeMatch);
}
function searchMatch(c) {
  const tokens = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if (!tokens.length) return true;
  const introText = (m) => [shownName(m), m.spec, m.memo];
  const hay = [c.name, c.phone, phoneDigits(c.phone), c.next?.note, ...c.notes, ...c.cases.map((k) => k.title),
    ...(c.intakes.length ? [] : ['의뢰 없음', '문의', c.assignee]), ...c.intros.flatMap(introText),
    ...c.intakes.flatMap((i) => [i.desc, intakeLabel(i), i.assignee, ...i.intros.flatMap(introText)]),
    ...c.consultations.map((s) => s.text)].filter(Boolean).join(' ').toLowerCase();
  return tokens.every((t) => hay.includes(t));
}
function visibleCustomers() {
  const list = state.customers.filter((c) => customerMatch(c) && searchMatch(c));
  if (!state.sort) return list;
  const dir = state.sort.dir === 'asc' ? 1 : -1;
  if (state.sort.key === 'name') return [...list].sort((a, b) => dir * a.name.localeCompare(b.name, 'ko'));
  return [...list].sort((a, b) => {
    const x = a.next?.d, y = b.next?.d;
    if (!x && !y) return 0;
    if (!x) return 1;            // 미정은 방향과 관계없이 아래
    if (!y) return -1;
    return dir * x.localeCompare(y);
  });
}
// 방금 만들거나 바꾼 고객이 지금 조건에서 안 보이면 조건을 풀어 준다. 풀었으면 true.
function ensureVisible(cid) {
  if (visibleCustomers().some((c) => c.id === cid)) return false;
  Object.values(state.f).forEach((s) => s.clear());
  state.q = ''; $('#q').value = '';
  state.mode = 'all';
  return true;
}

/* ───────── 그리기: 위쪽 ───────── */
function renderBar() {
  $('#tabs').innerHTML = [['all', '전체'], ['inquiry', '문의'], ['demand', '구함'], ['listing', '내놓음']].map(([v, l]) =>
    `<button class="vtab" role="tab" aria-selected="${state.mode === v}" data-act="tab" data-v="${v}" data-fid="tab:${v}"${v === 'inquiry' ? ' title="의뢰가 아직 없는 고객"' : ''}>${l}</button>`).join('');
  const n = chipCount();
  const ft = $('#ftoggle');
  ft.className = 'tool' + (n ? ' has' : '');
  ft.setAttribute('aria-pressed', String(state.filtersOpen));
  ft.innerHTML = ico('filter') + (n ? `<span class="num">${n}</span>` : '');
  $('#searchbox').classList.toggle('has', !!state.q);

  const chips = $('#chips');
  chips.hidden = !state.filtersOpen;
  const defs = [
    ['assignee', '담당', 'badge', (v) => v, '명'],
    ['next', '다음 연락', 'cal', (v) => NEXT_BUCKETS[v], '개'],
    ['status', '의뢰 상태', 'flag', (v) => STATUS[v], '개'],
  ];
  chips.innerHTML = defs.map(([key, label, icon, name, unit]) => {
    const set = state.f[key];
    const open = state.menu?.kind === 'filter' && state.menu.key === key;
    if (!set.size) {
      return `<span class="chip${open ? ' open' : ''}"><button class="main" data-act="chip" data-key="${key}" data-fid="chip:${key}" aria-haspopup="menu" aria-expanded="${open}">${ico(icon, 'sm')}${label}${ico('down', 'xs')}</button></span>`;
    }
    const value = set.size === 1 ? name([...set][0]) : `${set.size}${unit}`;
    return `<span class="chip on${open ? ' open' : ''}"><button class="main" data-act="chip" data-key="${key}" data-fid="chip:${key}" aria-haspopup="menu" aria-expanded="${open}">${ico(icon, 'sm')}${label} <b>${esc(value)}</b></button><button class="x" data-act="chipx" data-key="${key}" data-fid="chipx:${key}" aria-label="${label} 필터 지우기">${ico('x', 'xs')}</button></span>`;
  }).join('') + (n ? `<button class="btn-text f12" data-act="freset" data-fid="freset">필터 지우기</button>` : '');

  const sortBtn = (key, label, icon) => {
    const on = state.sort?.key === key;
    const say = on ? (state.sort.dir === 'asc' ? '오름차순' : '내림차순') : '정렬 안 함';
    return `<button class="hc" data-act="sort" data-key="${key}" data-fid="sort:${key}" aria-label="${label} 정렬, 지금 ${say}">${ico(icon, 'sm')}${label}${on ? ico('sort', 'xs dir ' + state.sort.dir) : ''}</button>`;
  };
  $('#head').innerHTML = `<span></span>${sortBtn('name', '고객', 'user')}<span class="hc">${ico('note', 'sm')}최근 상담</span><span class="hc">의뢰</span><span class="hc">${ico('badge', 'sm')}담당</span>${sortBtn('next', '다음 연락', 'cal')}<span></span>`;
}

/* ───────── 그리기: 줄 ───────── */
function nextInner(next) {
  if (!next) return `<span class="none">미정</span>`;
  const d = diff(next.d);
  if (d < 0) return `<span class="num over">${md(next.d)}</span><span class="rel over">${-d}일 지남</span>`;
  if (d === 0) return `<span class="today">오늘</span><span class="rel num">${md(next.d)}</span>`;
  if (d === 1) return `<span>내일</span><span class="rel num">${md(next.d)}</span>`;
  return `<span class="num">${md(next.d)}</span><span class="rel">${d}일 뒤</span>`;
}
function nextSay(next) {
  if (!next) return '미정';
  const d = diff(next.d);
  return `${md(next.d)}${d < 0 ? `, ${-d}일 지남` : d === 0 ? ', 오늘' : `, ${d}일 뒤`}`;
}
function nextButton(fid, c) {
  const open = state.menu?.kind === 'next' && state.menu.anchor === fid;
  return `<button class="cellbtn" data-act="next" data-cid="${c.id}" data-fid="${fid}" aria-haspopup="dialog" aria-expanded="${open}" aria-label="${esc(c.name)} 다음 연락 ${nextSay(c.next)}. 바꾸기">${nextInner(c.next)}</button>`;
}

function custHTML(c) {
  const open = state.open.has(c.id);
  const inquiry = !c.intakes.length;
  const names = custAssignees(c);
  const latest = c.consultations[0]?.text;
  // 의뢰가 없는 동안에는 접수한 사람을 고객 줄에서 바로 바꾼다. 의뢰가 생기면 담당은 의뢰마다 정한다.
  const asgOn = state.menu?.kind === 'choice' && state.menu.anchor === `casg:${c.id}`;
  const asg = inquiry
    ? `<button class="cellbtn" data-act="casg" data-cid="${c.id}" data-fid="casg:${c.id}" aria-haspopup="menu" aria-expanded="${asgOn}" aria-label="${esc(c.name)} 담당 ${esc(c.assignee || '없음')}. 바꾸기">${c.assignee ? esc(c.assignee) : '<span class="none">미정</span>'}</button>`
    : esc(names.join(', '));

  return `<div class="cust" data-cid="${c.id}">
    <div class="row crow" data-cid="${c.id}">
      <button class="tog" data-act="toggle" data-id="${c.id}" data-fid="tog:${c.id}" aria-expanded="${open}" aria-label="${esc(c.name)} ${open ? '접기' : '펼치기'}">${ico('chev', 'sm')}</button>
      <div class="cell c-name"><span class="nm tr" title="${esc(c.name)}">${esc(c.name)}</span>${c.phone ? `<span class="ph num">${esc(c.phone)}</span>` : ''}</div>
      <div class="cell"><span class="summary tr" title="${esc(latest || '')}">${latest ? esc(latest) : '<span class="dash">—</span>'}</span></div>
      <div class="cell num">${inquiry ? '<span class="dash">—</span>' : c.intakes.length + '건'}</div>
      <div class="cell c-asg tr">${asg}</div>
      <div class="cell c-next">${nextButton(`next:c:${c.id}`, c)}</div>
      <div class="cell c-act"><button class="tool" data-act="compose" data-cid="${c.id}" data-fid="cq:${c.id}" title="상담 추가" aria-label="${esc(c.name)} 상담 추가">${ico('note')}</button></div>
    </div>
    ${open ? expHTML(c) : ''}
  </div>`;
}

function consultLine(c, s, idx, full) {
  const [label, icon] = CTYPE[s.type];
  const when = s.d === TODAY ? '오늘' : md(s.d);
  const older = c.consultations.length - 1;
  let acts = '';
  if (idx === 0) {
    acts = `<span class="acts">${older > 0 ? `<button class="btn-text f12" data-act="hist" data-cid="${c.id}" data-fid="hist:${c.id}" aria-expanded="${full}">${full ? '접기' : `이전 ${older}건`}</button>` : ''}${composeButton(c)}</span>`;
  }
  return `<div class="kv${full ? ' full' : ''}${idx ? ' old' : ''}">
    <span class="k">최근 상담</span>
    <div class="v"><span class="when num">${ico(icon, 'sm')}${label} · ${when} · ${esc(s.by)}</span><span class="txt" ${full ? '' : `title="${esc(s.text)}"`}>${esc(s.text)}</span></div>
    ${acts}
  </div>`;
}
function composeButton(c) {
  const draft = state.composer[c.id];
  if (draft?.open) return '';
  const resume = draft && draft.text.trim();
  return `<button class="btn-text f12" data-act="compose" data-cid="${c.id}" data-fid="cadd:${c.id}">${ico('plus', 'xs')}${resume ? '이어서 쓰기' : '상담 추가'}</button>`;

// 상담 입력과 새 고객 입력이 함께 쓰는 조각. cid가 'new'면 새 고객 초안이다.
const draftOf = (cid) => (cid === 'new' ? state.adding : state.composer[cid]);
function typesHTML(cid, d) {
  return `<div class="typeseg" role="group" aria-label="상담 유형">${Object.entries(CTYPE).map(([v, [l, icon]]) =>
    `<button data-act="ctype" data-cid="${cid}" data-v="${v}" data-fid="ct:${cid}:${v}" aria-pressed="${d.type === v}">${ico(icon, 'xs')}${l}</button>`).join('')}</div>`;
}
function followHTML(cid, d, options) {
  const dated = d.follow !== 'keep' && d.follow !== 'none';
  return `<span class="k">다음 연락</span>${options.map(([v, l]) =>
    `<button class="preset" data-act="follow" data-cid="${cid}" data-v="${v}" data-fid="cf:${cid}:${v}" aria-pressed="${d.follow === v}">${l}</button>`).join('')}
    <input type="date" class="field num${d.follow === 'date' ? ' on' : ''}" data-fdate="${cid}" data-fid="cd:${cid}" value="${esc(d.date)}" min="${TODAY}" aria-label="다음 연락 날짜 직접 고르기">
    <input type="text" class="field" data-fnote="${cid}" data-fid="cn:${cid}" value="${esc(d.note)}" maxlength="60" placeholder="연락해서 확인할 것" aria-label="다음 연락 때 확인할 것" style="flex:1 1 150px;min-width:120px"${dated ? '' : ' hidden'}>`;
}
// 고른 다음 연락을 날짜로. date: undefined = 그대로, null = 없음
function readFollow(d) {
  if (d.follow === 'keep') return { date: undefined };
  if (d.follow === 'none') return { date: null };
  if (d.follow === 'date') {
    if (!validISO(d.date)) return { err: '다음 연락 날짜를 골라 주세요.' };
    if (d.date < TODAY) return { err: '다음 연락은 오늘 이후 날짜로 정해 주세요.' };
    return { date: d.date };
  }
  return { date: addDays(TODAY, Number(d.follow)) };
}

function composerHTML(c) {
  const d = state.composer[c.id];
  if (!d?.open) return '';
  return `<div class="composer" data-cid="${c.id}">
    ${typesHTML(c.id, d)}
    <textarea rows="2" data-cmp="${c.id}" data-fid="cmp:${c.id}" placeholder="상담 내용을 적습니다" aria-label="${esc(c.name)} 상담 내용">${esc(d.text)}</textarea>
    <div class="cmp-foot">${followHTML(c.id, d, [['keep', '그대로'], ['none', '없음'], ['1', '내일'], ['3', '3일 뒤'], ['7', '다음 주']])}
      <span class="cmp-btns"><button class="btn-text" data-act="ccancel" data-cid="${c.id}" data-fid="cx:${c.id}">닫기</button>

      <span class="acts"><button class="btn-text f12" data-act="next" data-cid="${c.id}" data-fid="next:kv:${c.id}" aria-haspopup="dialog">${ico('plus', 'xs')}정하기</button></span></div>`;

function introHTML(it, m) {
  const name = shownName(m);
  const listing = it?.kind === 'listing';
  const now = listing ? it.price : m.now;
  let price = `<span class="lb">${listing ? '당시 호가' : '당시'}</span><span class="num then" title="${Array.isArray(m.then) ? '보증금/월세 (만원)' : ''}">${wonShort(m.then)}</span>`;
  if (m.gone) price += `<span class="gone">· ${esc(m.gone)}</span>`;
  else if (!sameMoney(now, m.then)) price += `${ico('arrow', 'xs')}<span class="lb">지금</span><span class="num now">${wonShort(now)}</span>`;
  const editing = state.editMemo?.id === m.id;
  const memo = editing
    ? `<input class="memo-in" type="text" data-memoedit="${m.id}" data-fid="memoedit:${m.id}" value="${esc(state.editMemo.value)}" maxlength="80" aria-label="${esc(name)} 반응 메모">`
    : `<button class="memo-btn${m.memo ? '' : ' ph'}" data-act="memo" data-id="${m.id}" data-fid="memo:${m.id}" title="${esc(m.memo || '')}" aria-label="${esc(name)} 반응 메모${m.memo ? ': ' + esc(m.memo) : ' 없음'}. 고치기">${m.memo ? esc(m.memo) : '메모'}</button>`;
  const rxOn = state.menu?.kind === 'choice' && state.menu.anchor === `rx:${m.id}`;
  return `<div class="intro">
    <div class="in-name"><span class="nm" title="${esc(name)}">${esc(name)}</span><span class="sp">${esc(m.spec)}</span></div>
    <div class="in-date num">${mdShort(m.d)} ${esc(m.via)}</div>
    <div class="in-price">${price}</div>
    <div><button class="pill ${m.rx}" data-act="rx" data-id="${m.id}" data-fid="rx:${m.id}" aria-haspopup="menu" aria-expanded="${rxOn}" aria-label="${esc(name)} 반응 ${RX[m.rx]}. 바꾸기">${RX[m.rx]}</button></div>
    <div class="in-memo">${memo}</div>
  </div>`;
}
const tallyOf = (list) => ['like', 'think', 'no', 'wait'].map((k) => [k, list.filter((m) => m.rx === k).length]).filter(([, v]) => v).map(([k, v]) => `${RX[k]} ${v}`).join(' · ');
function addIntroButton(oid, label) {
  const on = state.menu?.kind === 'choice' && state.menu.anchor === `addintro:${oid}`;
  return `<button class="btn-text f12" data-act="addintro" data-oid="${oid}" data-fid="addintro:${oid}" aria-haspopup="${label === '매물 소개 기록' ? 'dialog' : 'menu'}" ${label === '매물 소개 기록' ? '' : 'aria-expanded="' + on + '"'}>${ico('plus', 'xs')}${label}</button>`;
}

// 의뢰 없이 고객에게 소개한 매물. 의뢰가 없는 고객에게는 늘 보이고, 의뢰가 생긴 뒤에는 기록이 남아 있을 때만 보인다.
function customerIntrosHTML(c) {
  const n = c.intros.length;
  if (c.intakes.length && !n) return '';
  const oid = '@' + c.id;
  return `<div class="kv"><span class="k">${c.intakes.length ? '의뢰 전 소개' : '소개한 매물'}</span>
    <div class="v">${n ? `<span class="num">${n}건</span><span class="for">${tallyOf(c.intros)}</span>` : '<span class="empty">아직 없습니다.</span>'}</div>

  </div>${n ? `<div class="cintros"><div class="intro-list">${c.intros.map((m) => introHTML(null, m)).join('')}</div></div>` : ''}`;
}

function intakeHTML(c, it, stepNo) {
  const dim = intakeFiltersOn() && !intakeMatch(it);
  const closed = it.status === 'closed';
  const who = `${c.name} ${intakeLabel(it)}`;
  const menuOn = (kind) => state.menu?.kind === 'choice' && state.menu.anchor === `${kind}:${it.id}`;
  return `<div class="irow${dim ? ' dim' : ''}${closed ? ' is-closed' : ''}">
    <div class="i-main">
      <span class="step num${stepNo ? '' : ' none'}" ${stepNo ? `title="진행 계획 ${stepNo}번째"` : 'aria-hidden="true"'}>${stepNo || ''}</span>
      <span class="kind ${it.kind}">${KIND[it.kind]}</span><span class="tx">${TX[it.tx]}</span>
      <span class="desc tr" title="${esc(it.desc)}">${esc(it.desc)}${it.kind === 'listing' ? ` · <span class="num">${won(it.price)}</span>` : ''}</span>
    </div>
    <div class="cell"><button class="pill ${it.status}" data-act="status" data-id="${it.id}" data-fid="status:${it.id}" aria-haspopup="menu" aria-expanded="${menuOn('status')}" aria-label="${esc(who)} 상태 ${STATUS[it.status]}. 바꾸기"><span class="dot"></span>${STATUS[it.status]}</button>
    </div>
    <div class="cell"><button class="cellbtn" data-act="asg" data-id="${it.id}" data-fid="asg:${it.id}" aria-haspopup="menu" aria-expanded="${menuOn('asg')}" aria-label="${esc(who)} 담당 ${esc(it.assignee)}. 바꾸기">${esc(it.assignee)}</button></div>
  </div>${intakeIntrosHTML(it)}`;
}

function intakeIntrosHTML(it) {
  const label = it.kind === 'demand' ? '소개한 매물' : '소개한 손님';
  const n = it.intros.length;
  const add = it.status === 'closed' ? '' : addIntroButton(it.id, it.kind === 'demand' ? '매물 소개 기록' : '손님 소개 기록');
  if (!n) return `<div class="intros"><div class="intros-h"><span class="f12" style="padding-left:2px">${label} 없음</span>${add}</div></div>`;
  const open = !state.introsClosed.has(it.id);
  const head = `<div class="intros-h"><button class="intros-tog" data-act="intros" data-id="${it.id}" data-fid="intros:${it.id}" aria-expanded="${open}">${ico('chev', 'xs')}${label} <b class="num">${n}</b></button>${open ? '' : `<span class="f12">${tallyOf(it.intros)}</span>${add}`}</div>`;
  if (!open) return `<div class="intros">${head}</div>`;
  return `<div class="intros">${head}<div class="intro-list">${it.intros.map((m) => introHTML(it, m)).join('')}</div><div class="intros-add">${add}</div></div>`;

function intakeFormHTML(c) {
  const f = state.iform[c.id];
  if (!f?.open) return '';
  const seg = (field, map, label) => `<div class="typeseg" role="group" aria-label="${label}">${Object.entries(map).map(([v, l]) =>
    `<button data-act="iset" data-cid="${c.id}" data-k="${field}" data-v="${v}" data-fid="if:${c.id}:${field}:${v}" aria-pressed="${f[field] === v}">${l}</button>`).join('')}</div>`;
  const inp = (field, ph, label, w) => `<input type="text" class="field num" data-if="${c.id}:${field}" data-fid="if:${c.id}:${field}" value="${esc(f[field])}" inputmode="numeric" maxlength="9" placeholder="${ph}" aria-label="${label}" style="width:${w}px">`;
  let price = '';
  if (f.kind === 'listing') {
    price = f.tx === 'monthly'
      ? `<div class="pricerow"><span>보증금</span>${inp('dep', '3000', '보증금, 만원', 96)}<span>월세</span>${inp('rent', '180', '월세, 만원', 80)}<span>만원</span><span class="pv num" data-ipv="${c.id}">${esc(pricePreview(f))}</span></div>`
      : `<div class="pricerow"><span>호가</span>${inp('price', '165000', '호가, 만원', 110)}<span>만원</span><span class="pv num" data-ipv="${c.id}">${esc(pricePreview(f))}</span></div>`;
  }
  const canMove = f.kind === 'demand' && c.intros.length > 0;
  return `<div class="composer iform" data-cid="${c.id}">
    <div class="frow">${seg('kind', KIND, '구분')}<span class="vsep"></span>${seg('tx', TX, '거래')}</div>
    <input type="text" class="line-input" data-if="${c.id}:desc" data-fid="if:${c.id}:desc" value="${esc(f.desc)}" maxlength="60" placeholder="${f.kind === 'demand' ? '찾는 조건 한 줄 · 예: 고덕동 · 34평 · 15억~16억 · 내년 봄 입주' : '내놓는 곳 한 줄 · 예: 고덕그라시움 118동 904호 · 25평'}" aria-label="의뢰 조건">
    ${price}
    <div class="cmp-foot"><span class="k">담당</span>
      <select class="field" data-iasg="${c.id}" data-fid="if:${c.id}:asg" aria-label="의뢰 담당">${STAFF.map((s) => `<option${s === f.assignee ? ' selected' : ''}>${s}</option>`).join('')}</select>
      ${canMove ? `<label class="chk"><input type="checkbox" data-imove="${c.id}" data-fid="if:${c.id}:move"${f.move ? ' checked' : ''}>의뢰 없이 소개한 매물 ${c.intros.length}건을 이 의뢰 아래로 옮기기</label>` : ''}
      <span class="cmp-btns"><button class="btn-text" data-act="iclose" data-cid="${c.id}" data-fid="if:${c.id}:close">닫기</button>
      <button class="btn-primary sm" data-act="isave" data-cid="${c.id}" data-fid="if:${c.id}:save">의뢰 등록</button></span>
    </div>
    <p class="err" role="alert">${esc(f.err || '')}</p>
  </div>`;
}
function pricePreview(f) {
  if (f.tx === 'monthly') { const d = parseMan(f.dep), r = parseMan(f.rent); return d !== null && r ? `= 보증금 ${n4(d)} / 월 ${n4(r)}` : ''; }
  const p = parseMan(f.price);
  return p ? `= ${won(p)}` : '';
}

function expHTML(c) {
  const full = state.history.has(c.id);
  const cons = c.consultations;
  let consult;
  if (!cons.length) {
    consult = `<div class="kv"><span class="k">최근 상담</span><div class="v"><span class="empty">기록 없음</span></div><span class="acts">${composeButton(c)}</span></div>`;
  } else {
    consult = (full ? cons : cons.slice(0, 1)).map((s, i) => consultLine(c, s, i, full)).join('');
  }
  const inCase = new Set();
  c.cases.forEach((k) => k.steps.forEach((s) => s.intake && inCase.add(s.intake)));
  const cases = c.cases.map((k) => {
    const steps = k.steps.map((s, i) => {
      if (s.intake) { const it = c.intakes.find((x) => x.id === s.intake); return it ? intakeHTML(c, it, i + 1) : ''; }
      return `<div class="irow"><div class="i-main"><span class="step num" title="진행 계획 ${i + 1}번째">${i + 1}</span><span class="desc" style="color:var(--fg-sub)">${esc(s.title)}</span>${s.target ? `<span class="f12 num">${ymd(s.target)} 목표</span>` : ''}</div><div></div><div></div></div>`;
    }).join('');
    return `<div class="case"><div class="case-head">${ico('link', 'sm')}<b>${esc(k.title)}</b><span class="f12">중개 건 · 순서는 직접 정함</span></div><div class="case-body">${steps}</div></div>`;
  }).join('');
  const loose = c.intakes.filter((i) => !inCase.has(i.id));
  const looseHTML = loose.length ? `${c.cases.length ? `<div class="f12 loose-label">묶지 않은 의뢰</div>` : ''}${loose.map((i) => intakeHTML(c, i, 0)).join('')}` : '';

  const formOpen = state.iform[c.id]?.open;
  const resume = state.iform[c.id] && !formOpen && state.iform[c.id].desc.trim();
  const addBtn = formOpen ? '' : `<button class="btn-text f12" data-act="iopen" data-cid="${c.id}" data-fid="iadd:${c.id}">${ico('plus', 'xs')}${resume ? '의뢰 등록 이어서' : '의뢰 등록'}</button>`;
  // 의뢰가 없으면 그 사실을 한 줄로 보여 주고(가짜 의뢰를 만들지 않는다) 여기서 첫 의뢰를 등록한다.
  const intakes = c.intakes.length
    ? `<div class="intake-heading"><strong>의뢰 ${c.intakes.length}건</strong>${addBtn}</div><div class="intake-columns"><span>거래 조건 · 소재지</span><span>상태</span><span>담당</span></div><div class="tree">${cases}${looseHTML}</div>`
    : `<div class="kv"><span class="k">의뢰</span><div class="v"><span class="empty">아직 없습니다. 조건이 정해지면 등록합니다.</span></div><span class="acts">${addBtn}</span></div>`;

  return `<div class="exp${state.just === c.id ? ' just' : ''}" role="region" aria-label="${esc(c.name)} 상세">
    <div class="exp-side">${c.notes.map((n) => `<p class="f12">${esc(n)}</p>`).join('')}${c.phone ? '' : '<p class="f12 nophone">연락처 없음</p>'}${identityHTML(c)}</div>
    <div class="exp-main">
      ${consult}
      ${composerHTML(c)}
      ${nextLineHTML(c)}
      ${customerIntrosHTML(c)}
    </div>
    <div class="intake-panel">
      ${intakes}
      ${intakeFormHTML(c)}
    </div>
  </div>`;
}

function identityHTML(c) {
  const e = state.idEdit[c.id];
  if (!e) return `<button class="btn-text f12 id-open" data-act="ieopen" data-cid="${c.id}" data-fid="ieopen:${c.id}">${ico('note', 'xs')}${c.phone ? '이름·연락처 고치기' : '이름·연락처 넣기'}</button>`;
  return `<div class="id-edit" role="group" aria-label="${esc(c.name)} 이름과 연락처 고치기">
    <input type="text" class="field" data-ie="${c.id}:name" data-fid="ie:${c.id}:name" value="${esc(e.name)}" maxlength="30" placeholder="이름 또는 별칭" aria-label="이름 또는 별칭" autocomplete="off">
    <input type="text" class="field num" data-ie="${c.id}:phone" data-fid="ie:${c.id}:phone" value="${esc(e.phone)}" maxlength="20" inputmode="tel" placeholder="연락처 (선택)" aria-label="연락처, 선택" autocomplete="off">
    <p class="err" role="alert">${esc(e.err || '')}</p>

function renderRows() {

  const blank = `<div class="blank"><p>조건에 맞는 고객이 없습니다.</p><button class="btn-text" data-act="clearall" data-fid="clearall">검색어와 필터 지우기</button></div>`;

  rows.querySelectorAll('textarea[data-cmp]').forEach(autosize);
}
function autosize(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 168) + 'px'; }

  } else if (m.kind === 'choice') {
    host.innerHTML = `<div class="pop" role="menu" aria-label="${esc(m.title)}">${m.title ? `<div class="mh">${esc(m.title)}</div>` : ''}${m.options.map((o, i) =>
      o.disabled
        ? `<button class="mi" role="menuitem" disabled>${esc(o.label)}</button>`

  } else if (m.kind === 'next') {

      `<button class="preset" data-act="npreset" data-n="${n}" data-fid="np:${n}" aria-pressed="${m.draft.date === addDays(TODAY, n)}">${l}</button>`).join('');
    host.innerHTML = `<div class="pop next" role="dialog" aria-label="${esc(c.name)} 다음 연락">
      <div class="ph-row"><b>다음 연락</b><span class="f12 tr">${esc(c.name)}</span></div>

      <label>확인할 것<input type="text" class="field" data-nnote data-fid="nn" value="${esc(m.draft.note)}" maxlength="60" placeholder="예: 재방문 일정 확정"></label>
      <p class="err" role="alert" id="nerr">${esc(m.err || '')}</p>
      <div class="pf">${c.next ? `<button class="btn-text" data-act="nclear" data-fid="nclear">지우기</button><button class="btn-text" data-act="ndone" data-fid="ndone">연락함</button>` : ''}<span class="grow"></span><button class="btn-text" data-act="ncancel" data-fid="ncancel">취소</button><button class="btn-primary sm" data-act="nsave" data-fid="nsave">저장</button></div>
    </div>`;
  }
  placeMenu();
}
function placeMenu() {
  const pop = $('#pop .pop');
  const a = anchorEl();
  if (!pop || !a) return;
  const r = a.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  const left = Math.max(8, Math.min(r.left, innerWidth - w - 8));
  let top = r.bottom + 4;
  if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 4);
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
}
function openMenu(menu) {
  state.menu = menu;
  state.focusAfter = '@menu';
  render();
}
function closeMenu(refocus) {
  if (!state.menu) return;
  if (refocus) state.focusAfter = state.menu.anchor;
  state.menu = null;
  render();
}

/* ───────── 그리기 본체: 누르는 동안에는 DOM을 갈지 않는다 ───────── */
let pointerDown = false, pendingRender = false, rendering = false, swallowClick = false;
const afterPointer = [];
function render() {
  if (pointerDown) { pendingRender = true; return; }
  doRender();
}
function doRender() {
  rendering = true;
  const ae = document.activeElement;
  const fid = ae?.dataset?.fid;
  let sel = null;
  if (fid && (ae.tagName === 'TEXTAREA' || (ae.tagName === 'INPUT' && ae.type === 'text'))) sel = [ae.selectionStart, ae.selectionEnd];
  const sc = $('#scroller');
  const top = sc.scrollTop, left = sc.scrollLeft;
  renderBar();
  renderRows();
  renderMenu();
  sc.scrollTop = top; sc.scrollLeft = left;
  state.just = null;

  const want = state.focusAfter;
  state.focusAfter = null;
  let target = null;
  if (want === '@menu') {
    target = $('#pop [aria-checked="true"]') || $('#pop .mi:not([disabled]), #pop input');
  } else if (want) {
    target = document.querySelector(`[data-fid="${CSS.escape(want)}"]`);
    if (target) target.scrollIntoView({ block: 'nearest' });
  } else if (fid) {
    target = document.querySelector(`[data-fid="${CSS.escape(fid)}"]`);
  }
  if (target && target !== document.activeElement) {
    target.focus({ preventScroll: true });
    if (sel && !want) { try { target.setSelectionRange(sel[0], sel[1]); } catch (_) {} }
    else if (want && (target.tagName === 'TEXTAREA' || target.type === 'text')) { const n = target.value.length; try { target.setSelectionRange(n, n); } catch (_) {} }
  }
  if (state.menu) placeMenu();
  rendering = false;
}
function releasePointer() {
  if (!pointerDown) return;
  pointerDown = false;
  setTimeout(() => {           // click이 끝난 뒤에 갈아 끼운다
    if (pointerDown) return;
    if (pendingRender) { pendingRender = false; doRender(); }
    while (afterPointer.length) afterPointer.shift()();
  }, 0);
}

/* ───────── 알림과 되돌리기 ───────── */
function toast(msg, undoId) {
  const paint = () => {
    clearTimeout(toastTimer);
    $('#toast').innerHTML = `<div class="toast"><span>${esc(msg)}</span>${undoId ? `<button data-act="undo" data-uid="${undoId}" data-fid="undo">되돌리기</button>` : ''}</div>`;
    toastTimer = setTimeout(() => { $('#toast').innerHTML = ''; undo = null; }, 7000);
  };
  if (pointerDown) afterPointer.push(paint); else paint();
}
// 변경은 여기로만. 직전 한 번만 되돌린다. label이 함수면 바꾼 뒤에 문구를 만든다.
function commit(label, mutate, restore) {
  const snap = JSON.stringify(state.customers);
  mutate();
  undo = { id: ++undoSeq, snap, restore };
  toast(typeof label === 'function' ? label() : label, undo.id);
  render();
}

/* ───────── 동작 ───────── */
function toggleCust(cid) {
  if (state.open.has(cid)) state.open.delete(cid);
  else { state.open.add(cid); state.just = cid; }
  render();
}
function expand(cid) {
  if (!state.open.has(cid)) { state.open.add(cid); state.just = cid; }
}
function openComposer(cid) {
  const c = findCustomer(cid);
  if (!c) return;
  const d = state.composer[cid] || { type: 'call', text: '', follow: 'keep', date: '', note: '', err: '' };
  d.open = true;
  state.composer[cid] = d;
  expand(cid);
  state.focusAfter = `cmp:${cid}`;
  render();
}
function saveComposer(cid) {
  const c = findCustomer(cid), d = state.composer[cid];
  if (!c || !d) return;
  const fail = (msg, fid) => { d.err = msg; state.focusAfter = fid; render(); };
  const text = d.text.trim();
  if (!text) return fail('상담 내용을 적어 주세요.', `cmp:${cid}`);
  const fw = readFollow(d);
  if (fw.err) return fail(fw.err, `cd:${cid}`);
  const saved = { ...d, err: '' };
  const say = fw.date === undefined ? '' : fw.date === null ? ' · 다음 연락 없음' : ` · 다음 연락 ${md(fw.date)}`;
  delete state.composer[cid];
  state.focusAfter = `cadd:${cid}`;
  commit(`상담을 기록했습니다${say}`, () => {
    c.consultations.unshift({ d: TODAY, type: saved.type, by: ME, text });
    if (fw.date === null) c.next = null;
    else if (fw.date) c.next = { d: fw.date, note: saved.note.trim() };
  }, () => { state.composer[cid] = saved; });   // 되돌리면 쓰던 글도 돌아온다
}

// 이름(또는 별칭)과 연락처가 다른 고객과 구별되는지 본다. selfId는 고치는 중인 고객(자기 자신은 건너뛴다).
function checkIdentity(rawName, rawPhone, selfId) {
  const others = state.customers.filter((c) => c.id !== selfId);
  const name = rawName.replace(/\s+/g, ' ').trim();
  if (!name) return { err: '이름이나 구별되는 별칭을 적어 주세요.', field: 'name' };
  if (!rawPhone.trim()) {
    // 연락처가 없으면 이름만으로 구별해야 한다
    if (others.some((c) => normName(c.name) === normName(name))) return { err: '같은 이름의 고객이 있습니다. 연락처를 적거나 ‘○○ 문의 김 사장님’처럼 구별되는 별칭으로 적어 주세요.', field: 'name' };
    return { name, phone: '' };
  }
  const digits = phoneDigits(rawPhone);
  if (!/^0\d{8,10}$/.test(digits)) return { err: '연락처는 0으로 시작하는 숫자 9~11자리로 적어 주세요. 모르면 비워 둡니다.', field: 'phone' };
  const dup = others.find((c) => c.phone && phoneDigits(c.phone) === digits);
  if (dup) return { err: `같은 연락처의 고객이 이미 있습니다: ${dup.name}. 그 고객 줄에 상담을 적어 주세요.`, field: 'phone' };
  return { name, phone: formatPhone(digits) };
}
// 별칭으로 받은 손님의 이름·연락처를 나중에 고친다. 같은 고객 줄 그대로다.
function saveIdentity(cid) {
  const c = findCustomer(cid), e = state.idEdit[cid];
  if (!c || !e) return;
  const who = checkIdentity(e.name, e.phone, cid);
  if (who.err) { e.err = who.err; state.focusAfter = `ie:${cid}:${who.field}`; render(); return; }
  const saved = { ...e, err: '' };
  delete state.idEdit[cid];
  state.focusAfter = `ieopen:${cid}`;
  if (who.name === c.name && who.phone === c.phone) return render();
  commit(() => `고객 정보를 고쳤습니다 · ${who.name}${who.phone ? ' · ' + who.phone : ''}${ensureVisible(cid) ? ' · 검색어와 필터를 풀었습니다' : ''}`,
    () => { c.name = who.name; c.phone = who.phone; }, () => { state.idEdit[cid] = saved; });
}

function openNewCustomer() {
  if (!state.adding) state.adding = { name: '', phone: '', type: 'call', text: '', follow: 'none', date: '', note: '', assignee: ME, err: '' };
  if (!state.adding.open) state.just = 'new';
  state.adding.open = true;
  $('#scroller').scrollTop = 0;
  state.focusAfter = 'nf:name';
  render();
}
function saveNewCustomer() {
  const d = state.adding;
  if (!d) return;
  const fail = (msg, fid) => { d.err = msg; state.focusAfter = fid; render(); };
  const who = checkIdentity(d.name, d.phone, null);
  if (who.err) return fail(who.err, `nf:${who.field}`);
  const { name, phone } = who;
  const fw = readFollow(d);
  if (fw.err) return fail(fw.err, 'cd:new');
  const text = d.text.trim();
  const id = newId('q');
  const saved = { ...d, err: '', open: true };
  state.adding = null;
  state.open.add(id); state.just = id;
  state.focusAfter = `tog:${id}`;
  commit(() => `고객을 추가했습니다 · ${name} · 의뢰 없음${ensureVisible(id) ? ' · 검색어와 필터를 풀었습니다' : ''}`, () => {
    state.customers.unshift({
      id, name, phone, assignee: saved.assignee, notes: [],
      next: fw.date ? { d: fw.date, note: saved.note.trim() } : null,
      intros: [], pool: [], cases: [], intakes: [],            // 의뢰는 만들지 않는다
      consultations: text ? [{ d: TODAY, type: saved.type, by: ME, text }] : [],
    });
  }, () => { state.adding = saved; });
}

function openIntakeForm(cid) {
  const c = findCustomer(cid);
  if (!c) return;
  const f = state.iform[cid] || { kind: 'demand', tx: 'sale', desc: '', price: '', dep: '', rent: '', assignee: custAssignees(c)[0] || ME, move: true, err: '' };
  f.open = true;
  state.iform[cid] = f;
  expand(cid);
  state.focusAfter = `if:${cid}:desc`;
  render();
}
function saveIntake(cid) {
  const c = findCustomer(cid), f = state.iform[cid];
  if (!c || !f) return;
  const fail = (msg, field) => { f.err = msg; state.focusAfter = `if:${cid}:${field}`; render(); };
  const desc = f.desc.replace(/\s+/g, ' ').trim();
  if (!desc) return fail(f.kind === 'demand' ? '찾는 조건을 한 줄로 적어 주세요.' : '내놓는 곳을 한 줄로 적어 주세요.', 'desc');
  let price;
  if (f.kind === 'listing') {
    if (f.tx === 'monthly') {
      const dep = parseMan(f.dep), rent = parseMan(f.rent);
      if (dep === null) return fail('보증금을 만원 단위 숫자로 적어 주세요. 예: 3000', 'dep');
      if (!rent) return fail('월세를 만원 단위 숫자로 적어 주세요. 예: 180', 'rent');
      price = [dep, rent];
    } else {
      price = parseMan(f.price);
      if (!price) return fail('호가를 만원 단위 숫자로 적어 주세요. 예: 16억 5,000이면 165000', 'price');
    }
  }
  const first = !c.intakes.length;
  const moveN = f.kind === 'demand' && f.move ? c.intros.length : 0;
  const saved = { ...f, err: '', open: true };
  const id = newId('i');
  delete state.iform[cid];
  state.focusAfter = `status:${id}`;
  commit(() => `${first ? '첫 의뢰' : '의뢰'}를 등록했습니다 · ${KIND[saved.kind]} ${TX[saved.tx]}${moveN ? ` · 소개 기록 ${moveN}건을 이 의뢰로 옮겼습니다` : ''}${ensureVisible(cid) ? ' · 전체 보기로 바꿨습니다' : ''}`, () => {
    // 같은 고객에 의뢰만 더한다. 상담·다음 연락·소개 기록은 그대로 남는다.
    const intake = { id, kind: saved.kind, tx: saved.tx, desc, short: desc, status: 'open', assignee: saved.assignee, intros: moveN ? c.intros.splice(0) : [], pool: [] };
    if (price !== undefined) intake.price = price;
    c.intakes.push(intake);
  }, () => { state.iform[cid] = saved; });
}

function openNext(el, cid) {
  const c = findCustomer(cid);
  if (!c) return;
  const fid = el.dataset.fid;
  if (state.menu?.kind === 'next' && state.menu.anchor === fid) {
    if (tryCommitNext()) closeMenu(true);
    return;
  }
  openMenu({ kind: 'next', anchor: fid, cid, draft: { date: c.next?.d || '', note: c.next?.note || '' }, err: '' });
}
// 판을 닫아도 되면 true. 바뀐 것이 있으면 저장한다.
function tryCommitNext() {
  const m = state.menu;
  const c = findCustomer(m.cid);
  if (!c) return true;
  const date = m.draft.date, note = m.draft.note.trim(), before = c.next;
  const fail = (msg) => { m.err = msg; render(); return false; };
  if (!date) {
    if (note) return fail('날짜를 정해 주세요.');
    if (before) commit('다음 연락을 지웠습니다', () => { c.next = null; });
    return true;
  }
  if (!validISO(date)) return fail('날짜를 다시 확인해 주세요.');
  if (date < TODAY && date !== before?.d) return fail('오늘 이후 날짜로 정해 주세요.');
  if (before && before.d === date && (before.note || '') === note) return true;
  commit(`다음 연락을 정했습니다 · ${md(date)}`, () => { c.next = { d: date, note }; });
  return true;
}
function markContacted(cid) {
  const c = findCustomer(cid);
  if (!c || !c.next) return;
  state.menu = null;
  commit('연락한 것으로 표시했습니다. 상담 내용을 적어 두세요', () => { c.next = null; });
  openComposer(cid);
}
function choice(el, title, options, current, pick) {
  const fid = el.dataset.fid;
  if (state.menu?.anchor === fid) return closeMenu(true);
  openMenu({ kind: 'choice', anchor: fid, title, options, current, pick });
}
function saveMemo() {
  const e = state.editMemo;
  if (!e) return;
  state.editMemo = null;
  const found = findIntro(e.id);
  const value = e.value.trim();
  if (!found || found.m.memo === value) return render();
  commit(value ? '반응 메모를 고쳤습니다' : '반응 메모를 지웠습니다', () => { found.m.memo = value; });
}
function clearFilters(withSearch) {
  Object.values(state.f).forEach((s) => s.clear());
  if (withSearch) { state.q = ''; $('#q').value = ''; state.mode = 'all'; }
  if (state.menu?.kind === 'filter') state.menu = null;
  render();
}

const ACT = {
  toggle: (d) => toggleCust(d.id),
  tab: (d) => { state.mode = d.v; render(); },
  ftoggle: () => { state.filtersOpen = !state.filtersOpen; if (state.menu?.kind === 'filter') state.menu = null; render(); },
  chip: (d, el) => {
    if (state.menu?.kind === 'filter' && state.menu.key === d.key) return closeMenu(true);
    openMenu({ kind: 'filter', key: d.key, anchor: el.dataset.fid });
  },
  chipx: (d) => { state.f[d.key].clear(); if (state.menu?.kind === 'filter') state.menu = null; state.focusAfter = `chip:${d.key}`; render(); },
  fopt: (d) => { const s = state.f[state.menu.key]; s.has(d.v) ? s.delete(d.v) : s.add(d.v); render(); },
  freset: () => clearFilters(false),
  clearall: () => { clearFilters(true); $('#q').focus(); },
  qclear: () => { state.q = ''; $('#q').value = ''; $('#q').focus(); render(); },
  sort: (d) => {
    const s = state.sort;
    state.sort = !s || s.key !== d.key ? { key: d.key, dir: 'asc' } : s.dir === 'asc' ? { key: d.key, dir: 'desc' } : null;
    render();
  },
  // 상담 입력(고객별)과 새 고객 입력이 함께 쓰는 단추
  ctype: (d) => { draftOf(d.cid).type = d.v; render(); },
  follow: (d) => { const x = draftOf(d.cid); x.follow = d.v; x.err = ''; render(); },
  compose: (d) => openComposer(d.cid),
  ccancel: (d) => { state.composer[d.cid].open = false; state.composer[d.cid].err = ''; state.focusAfter = `cadd:${d.cid}`; render(); },
  csave: (d) => saveComposer(d.cid),

  isave: (d) => saveIntake(d.cid),

  iecancel: (d) => { delete state.idEdit[d.cid]; state.focusAfter = `ieopen:${d.cid}`; render(); },
  iesave: (d) => saveIdentity(d.cid),
  next: (d, el) => openNext(el, d.cid),
  done: (d) => markContacted(d.cid),
  npreset: (d) => { const m = state.menu; m.draft.date = addDays(TODAY, Number(d.n)); m.err = ''; render(); },
  nsave: () => { if (tryCommitNext()) closeMenu(true); },
  ncancel: () => closeMenu(true),
  nclear: () => { const m = state.menu; const c = findCustomer(m.cid); state.focusAfter = m.anchor; state.menu = null; commit('다음 연락을 지웠습니다', () => { c.next = null; }); },
  ndone: () => markContacted(state.menu.cid),
  casg: (d, el) => {
    const c = findCustomer(d.cid);
    choice(el, '담당', STAFF.map((s) => ({ v: s, label: s })), c.assignee, (v) => {

    });
  },
  asg: (d, el) => {
    const { it } = findIntake(d.id);
    choice(el, '의뢰 담당', STAFF.map((s) => ({ v: s, label: s })), it.assignee, (v) => {
      if (v !== it.assignee) commit(`담당을 바꿨습니다 · ${v}`, () => { findIntake(d.id).it.assignee = v; });
    });
  },
  status: (d, el) => {
    const { it } = findIntake(d.id);
    choice(el, '의뢰 상태', Object.entries(STATUS).map(([v, label]) => ({ v, label, pill: v, dot: true })), it.status, (v) => {
      if (v !== it.status) commit(`의뢰 상태를 바꿨습니다 · ${STATUS[v]}`, () => { findIntake(d.id).it.status = v; });
    });
  },
  rx: (d, el) => {
    const { m } = findIntro(d.id);
    choice(el, '반응', Object.entries(RX).map(([v, label]) => ({ v, label, pill: v })), m.rx, (v) => {
      if (v !== m.rx) commit(`반응을 바꿨습니다 · ${RX[v]}`, () => { findIntro(d.id).m.rx = v; });
    });
  },
  addintro: (d, el) => {
    const owner = introOwner(d.oid);
    if (!owner) return;
    const listing = owner.it?.kind === 'listing';
    if (!listing) { openPropertyPicker(d.oid, owner); return; }
    const list = buyerCandidates(owner.c, owner.it);
    const options = list.length
      ? list.map((p, i) => ({ v: i, label: shownName(p), sub: p.spec }))
      : [{ disabled: true, label: '이 시안에는 더 고를 후보가 없습니다' }];
    choice(el, '오늘 소개한 손님', options, null, (v) => {
      const p = list[v];
      commit('소개 기록을 추가했습니다. 가격은 오늘 기준으로 남깁니다', () => {
        const o = introOwner(d.oid);
        const id = newId('m');
        const who = p.cid ? { cid: p.cid, name: shownName(p) } : { name: p.name };
        o.list.unshift({ id, ...who, spec: p.spec, d: TODAY, via: '문자', then: clone(o.it.price), rx: 'wait', memo: '' });
      });
      state.introsClosed.delete(d.oid);
    });
  },
  pick: (d) => {
    const m = state.menu;
    const o = m.options[Number(d.i)];
    state.focusAfter = m.anchor;
    state.menu = null;
    m.pick(o.v);
    render();
  },
  memo: (d) => { const f = findIntro(d.id); state.editMemo = { id: d.id, value: f.m.memo }; state.focusAfter = `memoedit:${d.id}`; render(); },
  intros: (d) => { state.introsClosed.has(d.id) ? state.introsClosed.delete(d.id) : state.introsClosed.add(d.id); render(); },
  undo: (d) => {
    if (!undo || String(undo.id) !== d.uid) return;   // 누르는 사이 다른 변경이 저장됐으면 옛 단추는 버린다
    state.customers = JSON.parse(undo.snap);
    undo.restore?.();
    undo = null;
    state.menu = null; state.editMemo = null;
    toast('되돌렸습니다', 0);
    render();
  },
  reset: () => {
    state.menu = null; state.editMemo = null;
    commit('가상 데이터를 처음 상태로 돌렸습니다', () => { state.customers = clone(INITIAL); });
  },
};

/* ───────── 이벤트 ───────── */
document.addEventListener('pointerdown', (e) => {
  pointerDown = true;
  swallowClick = false;
  const m = state.menu;
  if (!m || e.target.closest('#pop')) return;
  const a = anchorEl();
  if (a && a.contains(e.target)) return;          // 같은 단추는 click에서 여닫는다
  if (m.kind === 'next' && !tryCommitNext()) { swallowClick = true; return; }   // 잘못된 값이면 닫지 않는다
  state.menu = null;
  render();
}, true);
document.addEventListener('pointerup', releasePointer, true);
document.addEventListener('pointercancel', releasePointer, true);
window.addEventListener('blur', releasePointer);

document.addEventListener('click', (e) => {
  if (swallowClick) { swallowClick = false; e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest('[data-act]');
  if (el) { if (!el.disabled) ACT[el.dataset.act]?.(el.dataset, el, e); return; }
  const row = e.target.closest('.crow');
  if (row && !e.target.closest('button, input, select, textarea')) toggleCust(row.dataset.cid);
});

// 글자를 치는 동안에는 다시 그리지 않고 초안만 고친다. 오류 문구는 그 자리에서 지운다.
function clearErr(draft, box) {
  if (!draft.err) return;
  draft.err = '';
  const p = box?.querySelector('.err');
  if (p) p.textContent = '';
}
document.addEventListener('input', (e) => {
  const t = e.target, d = t.dataset;
  if (t.id === 'q') { state.q = t.value; render(); return; }
  if (d.cmp) { const x = draftOf(d.cmp); x.text = t.value; clearErr(x, t.closest('.composer')); autosize(t); return; }
  if (d.fnote) { draftOf(d.fnote).note = t.value; return; }
  if (d.fdate) {                                    // 날짜 칸은 치는 중에 갈지 않고 제자리에서 맞춘다
    const x = draftOf(d.fdate);
    const off = d.fdate === 'new' ? 'none' : 'keep';
    x.date = t.value;
    x.follow = t.value ? 'date' : off;
    const box = t.closest('.composer');
    box.querySelectorAll('[data-act="follow"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === x.follow)));
    t.classList.toggle('on', x.follow === 'date');
    const note = box.querySelector('[data-fnote]'); if (note) note.hidden = x.follow !== 'date';
    clearErr(x, box);
    return;
  }
  if (d.nf) { state.adding[d.nf] = t.value; clearErr(state.adding, t.closest('.newcust')); return; }
  if (d.ie) { const [cid, field] = d.ie.split(':'); const x = state.idEdit[cid]; x[field] = t.value; clearErr(x, t.closest('.id-edit')); return; }
  if (d.if) {
    const [cid, field] = d.if.split(':');
    const f = state.iform[cid];
    f[field] = t.value;
    const box = t.closest('.iform');
    const pv = box.querySelector('[data-ipv]'); if (pv) pv.textContent = pricePreview(f);
    clearErr(f, box);
    return;
  }
  if (t.matches('[data-ndate]')) {
    const m = state.menu; m.draft.date = t.value; m.err = '';
    $('#nerr').textContent = '';
    document.querySelectorAll('#pop [data-act="npreset"]').forEach((b) => b.setAttribute('aria-pressed', String(t.value === addDays(TODAY, Number(b.dataset.n)))));
    return;
  }
  if (t.matches('[data-nnote]')) { state.menu.draft.note = t.value; return; }
  if (d.memoedit && state.editMemo) { state.editMemo.value = t.value; }
});
document.addEventListener('change', (e) => {
  const t = e.target, d = t.dataset;
  if ('nasg' in d) { state.adding.assignee = t.value; return; }
  if (d.iasg) { state.iform[d.iasg].assignee = t.value; return; }
  if (d.imove) { state.iform[d.imove].move = t.checked; }
});
document.addEventListener('focusout', (e) => {
  if (rendering) return;
  if (e.target.dataset?.memoedit && state.editMemo?.id === e.target.dataset.memoedit) saveMemo();
});

document.addEventListener('keydown', (e) => {
  if (e.isComposing || e.keyCode === 229) return;
  const t = e.target, d = t.dataset || {};
  if (d.memoedit) {
    if (e.key === 'Enter') { e.preventDefault(); state.focusAfter = `memo:${d.memoedit}`; saveMemo(); }
    else if (e.key === 'Escape') { e.preventDefault(); state.editMemo = null; state.focusAfter = `memo:${d.memoedit}`; render(); }
    return;
  }
  if (d.cmp && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); d.cmp === 'new' ? saveNewCustomer() : saveComposer(d.cmp); return; }
  if (d.nf && e.key === 'Enter') { e.preventDefault(); saveNewCustomer(); return; }
  if (d.ie) {
    const cid = d.ie.split(':')[0];
    if (e.key === 'Enter') { e.preventDefault(); saveIdentity(cid); return; }
    if (e.key === 'Escape') { e.preventDefault(); ACT.iecancel({ cid }); return; }
  }
  if (d.if && e.key === 'Enter') { e.preventDefault(); saveIntake(d.if.split(':')[0]); return; }
  if (t.id === 'q' && e.key === 'Escape' && state.q) { e.preventDefault(); ACT.qclear(); return; }

  const pop = $('#pop .pop');
  if (!pop || !state.menu) return;
  if (e.key === 'Escape') { e.preventDefault(); closeMenu(true); return; }
  if (!pop.contains(t)) return;
  if (state.menu.kind === 'next') {
    if (e.key === 'Enter' && t.tagName === 'INPUT') { e.preventDefault(); ACT.nsave(); return; }
    if (e.key === 'Tab') {                          // 판 안에서 돈다
      const items = [...pop.querySelectorAll('button, input')];
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey && t === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && t === last) { e.preventDefault(); first.focus(); }
    }
    return;
  }
  const items = [...pop.querySelectorAll('.mi:not([disabled])')];
  const i = items.indexOf(t);
  if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length]?.focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length]?.focus(); }
  else if (e.key === 'Home') { e.preventDefault(); items[0]?.focus(); }
  else if (e.key === 'End') { e.preventDefault(); items[items.length - 1]?.focus(); }
  else if (e.key === 'Tab') { e.preventDefault(); closeMenu(true); }
});

$('#scroller').addEventListener('scroll', () => {
  if (!state.menu) return;
  const a = anchorEl(), box = $('#scroller').getBoundingClientRect();
  const r = a?.getBoundingClientRect();
  if (!r || (a.closest('#scroller') && (r.bottom < box.top + 34 || r.top > box.bottom))) { if (state.menu.kind !== 'next' || tryCommitNext()) closeMenu(false); return; }
  placeMenu();
}, { passive: true });
window.addEventListener('resize', placeMenu);

doRender();
})();
</script>
</body>
</html>
