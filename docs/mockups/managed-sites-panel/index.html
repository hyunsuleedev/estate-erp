<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리단지 사이드바 시안</title>
<style>
:root{
  --bg:#ffffff;--fg:#37352f;--muted:#f7f6f3;--muted-fg:#787774;--muted-fg-strong:#5f5e5b;--faint:#a5a4a0;
  --border:#e9e9e7;--secondary:#f1f1ef;--hover:#f7f6f3;--sidebar:#f7f6f3;--nav-active:#ebebea;
  --success:#0f7b6c;--warning:#cb912f;--warning-strong:#8a5a13;--ring:#2383e2;
  --shadow:0 10px 28px rgba(15,15,15,.09),0 2px 6px rgba(15,15,15,.05);
  --panel-w:280px;--panel-bg:#f9f9f8;--panel-hover:#f0efec;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid color-mix(in srgb,var(--ring) 70%,transparent);outline-offset:1px}
svg.i{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.defs{position:absolute;width:0;height:0;overflow:hidden}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.spacer{flex:1}

/* ── 시안 조작 띠 ── */
.demo-bar{height:38px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#2f2e2b;color:#e9e8e4;font-size:12px;white-space:nowrap;overflow-x:auto}
.demo-bar strong{font-weight:600;color:#fff}
.demo-bar .sep{width:1px;height:14px;background:#55534e;flex-shrink:0}
.demo-seg{display:flex;background:#45433f;border-radius:6px;padding:2px;flex-shrink:0}
.demo-seg button{padding:3px 9px;border-radius:4px;color:#cfcdc7;font-size:11.5px}
.demo-seg button[aria-pressed="true"]{background:#f7f6f3;color:#2f2e2b;font-weight:600}
.demo-check{display:flex;align-items:center;gap:6px;color:#cfcdc7;cursor:pointer}
.demo-check input{accent-color:#7fc4b5}
.demo-bar .note{margin-left:auto;color:#a8a6a0;font-size:11px}

/* ── 앱 셸 ── */
.app{display:flex;height:calc(100vh - 38px);min-width:1180px}
.gnav{width:256px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:10px 8px;overflow-y:auto}
.brand{display:flex;align-items:center;justify-content:space-between;height:32px;padding:0 4px 0 8px;margin-bottom:6px;font-weight:600;font-size:13.5px}
.gnav .group{font-size:11.5px;color:var(--muted-fg);padding:10px 8px 4px}
.nav-item{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:7px;font-size:13.5px}
.nav-item svg{width:15px;height:15px;color:#5f5e5b}
.nav-item.on{background:var(--nav-active);font-weight:500}
.nav-item .caret{margin-left:auto;color:var(--muted-fg)}
.me{margin-top:auto;display:flex;align-items:center;gap:9px;padding:8px}
.me .av{width:26px;height:26px;border-radius:50%;background:#e3e2de;display:grid;place-items:center;font-size:11px;color:#5f5e5b}
.me small{display:block;color:var(--muted-fg);font-size:11px}
.work{flex:1;min-width:0;display:flex;flex-direction:column}
.tabstrip{height:40px;flex-shrink:0;display:flex;align-items:flex-end;gap:4px;padding:0 6px;border-bottom:1px solid var(--border);background:#fbfbfa}
.tab{display:flex;align-items:center;gap:7px;height:34px;padding:0 14px;min-width:126px;border:1px solid var(--border);border-bottom-color:#fff;border-radius:8px 8px 0 0;background:#fff;margin-bottom:-1px;font-size:12.5px;white-space:nowrap}
.tab svg{width:13px;height:13px;color:#5f5e5b}
.tabplus{height:34px;width:30px;display:grid;place-items:center;color:var(--muted-fg)}
.page{flex:1;min-height:0;display:flex;position:relative}

/* ── 공통 조각 ── */
.icon-btn{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--muted-fg);flex-shrink:0;position:relative}
.icon-btn:hover,.icon-btn[aria-expanded="true"]{background:rgba(55,53,47,.07);color:var(--fg)}
.icon-btn .dot{position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--success)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:32px;padding:0 9px;border-radius:8px;background:#fff;border:1px solid var(--border);color:var(--muted-fg)}
.search:focus-within{border-color:#c9c8c4;box-shadow:0 0 0 3px rgba(35,131,226,.12)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:12.5px;color:var(--fg)}
.search input::placeholder{color:#9b9a97}
.search input:disabled{cursor:not-allowed}
.search kbd{font-family:inherit;font-size:10.5px;color:var(--faint);border:1px solid var(--border);border-radius:4px;padding:0 4px;background:#fff}
.kind{flex-shrink:0;font-size:10.5px;font-weight:400;color:var(--muted-fg);border:1px solid var(--border);border-radius:4px;padding:0 4px;line-height:15px;background:#fff}
.menu{position:fixed;width:200px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:30}
.menu .mlabel{font-size:11px;color:var(--muted-fg);padding:4px 8px}
.menu button{width:100%;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:12.5px;text-align:left}
.menu button:hover{background:var(--hover)}
.menu button .ck{width:14px;color:var(--success)}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 2px}

/* ══ 단지 사이드바 — 버튼으로 열고 닫는다 ══ */
.dock{position:relative;flex-shrink:0;width:0;overflow:hidden;transition:width .24s var(--ease)}
.dock.open{width:var(--panel-w);overflow:visible}
.page.resizing .dock{transition:none}
.sites{position:absolute;top:0;bottom:0;left:0;width:var(--panel-w);display:flex;flex-direction:column;background:var(--panel-bg);border-right:1px solid var(--border);opacity:0;transform:translateX(-14px);transition:opacity .2s var(--ease),transform .24s var(--ease)}
.dock.open .sites{opacity:1;transform:none}
.sites-head{height:49px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 8px 0 14px;border-bottom:1px solid var(--border)}
.sites-head .title{display:flex;align-items:baseline;gap:6px;font-size:14px;font-weight:600;white-space:nowrap}
.sites-head .title .n{font-size:12px;font-weight:500;color:var(--muted-fg)}
.sites-tools{height:49px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--border)}
.list{flex:1;min-height:0;overflow:auto;padding:4px 8px 12px;scrollbar-width:thin;scrollbar-color:#dcdbd8 transparent}
.slabel{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:#8f8e8a;padding:12px 8px 5px;user-select:none}
.slabel.toggle{cursor:pointer}
.slabel.toggle:hover{color:var(--fg)}
.slabel .n{color:var(--faint);font-weight:400}
.slabel svg{width:11px;height:11px}
.sites-foot{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--border)}
.sites-foot .sum{font-size:11.5px;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sites-foot .sum b{font-weight:500;color:var(--muted-fg-strong)}
.add-btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:500;color:#4b4a46;border:1px solid var(--border);background:#fff;white-space:nowrap;flex-shrink:0;margin-left:auto}
.add-btn:hover{background:var(--hover)}

/* 단지 한 줄 */
.site{position:relative;display:flex;align-items:center;gap:6px;padding:7px 6px 7px 10px;margin-bottom:1px;border-radius:7px;cursor:pointer;outline:none;border:1px solid transparent}
.site:hover{background:var(--panel-hover)}
.site:focus-visible{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ring) 55%,transparent)}
.site-main{flex:1;min-width:0}
.site-name{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;min-width:0}
.site-name span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site-sub{margin-top:1px;font-size:11.5px;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site-sub b{font-weight:500;color:var(--muted-fg-strong)}
.site.idle .site-name{color:#a19f9a}
.site.idle .site-sub{color:#b4b2ad}
.site.on{background:#fff;border-color:var(--border);box-shadow:0 1px 2px rgba(15,15,15,.06)}
.site.on .site-name{font-weight:600}
.signals{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted-fg);white-space:nowrap}
.sig-exp{display:inline-flex;align-items:center;gap:4px;color:var(--warning-strong)}
.sig-exp::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--warning)}
.acts{display:none;align-items:center;gap:1px}
.site:hover .acts,.site:focus-within .acts{display:flex}
.site:hover .signals,.site:focus-within .signals{display:none}
.act{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;color:var(--muted-fg)}
.act:hover{background:rgba(55,53,47,.08);color:var(--fg)}
.act.pinned svg{fill:currentColor}
.empty-list{padding:28px 10px;text-align:center;color:var(--muted-fg);font-size:12px}
.empty-list button{margin-top:8px;color:var(--fg);text-decoration:underline;text-underline-offset:3px;font-size:12px}

/* 크기 조절 손잡이 */
.resize{position:absolute;top:0;bottom:0;right:-4px;width:8px;cursor:col-resize;z-index:6;touch-action:none}
.resize::before{content:"";position:absolute;top:0;bottom:0;left:3px;width:2px;background:transparent;transition:background .12s}
.resize::after{content:"";position:absolute;top:50%;left:2px;width:4px;height:32px;margin-top:-16px;border-radius:3px;background:#c9c8c4;opacity:0;transition:opacity .12s}
.resize:hover::before,.page.resizing .resize::before{background:#d6d5d1}
.resize:hover::after,.page.resizing .resize::after{opacity:1}
.page.resizing{cursor:col-resize;user-select:none}

/* ── 단지 정보 말풍선 ── */
.tip{position:fixed;z-index:40;width:236px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:11px 13px;font-size:12px;opacity:0;transform:translateX(-4px);transition:opacity .12s,transform .12s;pointer-events:none}
.tip.show{opacity:1;transform:none}
.tip h4{margin:0 0 2px;font-size:13px;font-weight:600}
.tip .addr{color:var(--muted-fg);font-size:11.5px}
.tip dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:9px 0 0;padding-top:9px;border-top:1px solid var(--border)}
.tip dt{color:var(--muted-fg)}
.tip dd{margin:0;text-align:right}

/* ══ 본문 ══ */
.units{flex:1;min-width:0;display:flex;flex-direction:column;container-type:inline-size}
/* 사이드바를 열어 본문이 좁아지면 첫 줄을 줄인다 */
.tb .seg .short{display:none} /* 좁을 때만 짧은 이름 — 아래 컨테이너 규칙보다 앞에 둬야 덮어쓰지 않는다 */
@container (max-width:880px){.btn-out .lbl{display:none}.btn-out{padding:0 9px}.usearch{min-width:110px}.site-btn{max-width:200px}.tb .seg button{padding:4px 8px}}
@container (max-width:780px){.tb .seg .long{display:none}.tb .seg .short{display:inline}.usearch kbd{display:none}.usearch{min-width:90px}.site-btn{max-width:170px}.sel{gap:6px;padding:0 8px}.sel svg{margin-left:4px}}
/* 마지막 안전장치: 도구줄이 넘쳐도 화면 전체를 밀지 않는다 */
.tb,.tb2{overflow-x:auto;scrollbar-width:none}
.tb::-webkit-scrollbar,.tb2::-webkit-scrollbar{display:none}
.tb{height:49px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 18px 0 12px;border-bottom:1px solid var(--border);min-width:0}
.tb2{height:49px;flex-shrink:0;background:#faf9f6;padding:0 18px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border)}
.vdiv{width:1px;height:20px;background:var(--border);margin:0 3px;flex-shrink:0}
/* 단지 버튼 — 누르면 사이드바가 열린다 */
/* 공간이 모자라면 단지 이름이 먼저 줄어 말줄임된다 (도구를 밀어내지 않음) */
.site-btn{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 8px;border-radius:8px;flex:0 1 auto;min-width:120px;max-width:280px;border:1px solid transparent;transition:background .12s,border-color .12s}
.site-btn .ic,.site-btn .hint{flex-shrink:0}
.site-btn .t{min-width:0}
.site-btn:hover{background:var(--secondary)}
.site-btn[aria-expanded="true"]{background:var(--secondary);border-color:var(--border)}
.site-btn .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:#fff;border:1px solid var(--border);color:var(--muted-fg-strong)}
.site-btn .ic svg{width:13px;height:13px}
.site-btn .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site-btn .hint{font-size:11.5px;color:var(--muted-fg);white-space:nowrap}
.pill{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:7px;background:var(--muted);font-size:12.5px;white-space:nowrap;flex-shrink:0}
.pill .k{color:var(--muted-fg)}
.usearch{flex:1 1 240px;min-width:140px;max-width:300px;background:var(--muted);border-color:transparent}
.seg{display:flex;background:var(--secondary);border-radius:8px;padding:3px;flex-shrink:0}
.seg button{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500;color:var(--muted-fg);white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(15,15,15,.08)}
.seg button .c{margin-left:4px;color:var(--muted-fg);font-weight:400}
.btn-out{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:7px;font-size:12px;background:#fff;white-space:nowrap;flex-shrink:0}
.sel{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:7px;background:#fff;font-size:12.5px;white-space:nowrap}
.sel .k{color:var(--muted-fg)}
.sel svg{width:12px;height:12px;color:var(--muted-fg);margin-left:10px}
.tablewrap{flex:1;min-height:0;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
thead th{position:sticky;top:0;background:#fff;z-index:1;text-align:left;font-weight:400;font-size:12px;color:var(--muted-fg);height:36px;padding:0 10px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap}
tbody td{height:33px;padding:0 10px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
tbody tr:hover td{background:#fafaf9}
td.ho{font-weight:600}
td.ph{color:var(--muted-fg-strong)}
td.cs{color:var(--muted-fg)}
td.cs b{font-weight:500;color:var(--fg);margin-right:6px}
.status{height:30px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 12px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted-fg);background:#fbfbfa}
.uempty{display:grid;place-items:center;text-align:center;color:var(--muted-fg);font-size:12.5px;padding:40px;height:100%}
.uempty strong{display:block;color:var(--fg);font-weight:500;font-size:13.5px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,10px);opacity:0;background:#37352f;color:#fff;padding:9px 14px;border-radius:8px;font-size:12px;transition:opacity .15s,transform .15s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<symbol id="i-panel-close" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 10l-2 2 2 2"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 5 3 3v2H7v-2l3-3zM12 14v6"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>

    ['고덕자이','apartment','강동구','상일동'],['미사강변센트리버','apartment','하남시','망월동'],['미사강변푸르지오','apartment','하남시','풍산동'],
    ['위례센트럴자이','apartment','송파구','장지동'],['문정래미안','apartment','송파구','문정동'],['잠실엘스','apartment','송파구','잠실동'],
    ['리센츠','apartment','송파구','잠실동'],['파크리오','apartment','송파구','신천동'],['가락쌍용1차','apartment','송파구','가락동'],
    ['천호역 한강밤섬자이','officetel','강동구','천호동'],['길동 우성오피스텔','officetel','강동구','길동'],['암사동 그린빌라','villa','강동구','암사동'],
    ['성내동 대림빌라','villa','강동구','성내동'],['천호 이스트센트럴타워 상가','commercial','강동구','천호동'],['둔촌역 상가','commercial','강동구','둔촌동'],
    ['고덕비즈밸리 지식산업센터','commercial','강동구','고덕동'],['강일 첨단업무단지','commercial','강동구','강일동'],['하남 스타필드 오피스텔','officetel','하남시','신장동'],
    ['미사역 파라곤','apartment','하남시','망월동'],

  const MANAGED_PATTERN = [4,0,7,0,0,2,1,0,3,0,0,9,0,1,0,0,2,0,1,0,0,0,1,0,2,0,0,5];
  const EXTRA_SITES = EXTRA.map(([name, type, district, ward], i) => ({

    dongs: type === 'apartment' ? 8 + (i * 7) % 60 : 1, units: type === 'apartment' ? 600 + (i * 389) % 6000 : 40 + i * 9,
    built: 1985 + (i * 3) % 38, managed: MANAGED_PATTERN[i], listings: Math.floor(MANAGED_PATTERN[i] / 2), expiring: MANAGED_PATTERN[i] > 3 ? 1 : 0,
  }));
  const DATASETS = { few: BASE.slice(0, 3), many: BASE, lots: [...BASE, ...EXTRA_SITES] };
  const ALL_SITES = DATASETS.lots;
  const TYPE_LABEL = { apartment:'아파트', officetel:'오피스텔', villa:'빌라', commercial:'상가' };
  const SEARCH_MIN_SITES = 6;
  const PANEL_W = { min:220, max:380, def:280 };
  const NAV_W = 256;       // 앱 메뉴 폭
  const MAIN_MIN = 700;    // 사이드바를 열어도 본문에 남겨 둘 최소 폭
  // 저장된 너비를 쓰되, 창이 좁으면 본문 최소 폭을 지키도록 줄인다
  const panelMaxNow = () => Math.max(PANEL_W.min, Math.min(PANEL_W.max, window.innerWidth - NAV_W - MAIN_MIN));
  const effectivePanelW = () => Math.min(state.panelW, panelMaxNow());

  const GRACIUM_RECORDS = {
    '3401':['정유진','010-2001-0004','카톡 — 계약금 입금 확인. 19.8억 매매.'],
    '3402':['오은정','010-2001-0005','세입자 만기 관련 상담 — 재계약 여부 확인 필요.'],
    '3403':['문지훈','010-2001-0006',''],
    '3404':['김민준','010-2001-0001',''],
    '3501':['김민준','010-2001-0001','매물확인 — 살아있음'],
    '3503':['이서현','010-2001-0002',''],
  };
  const LINE_SPEC = { 1:['46.7평','34.3평','154C'], 2:['52.3평','38.6평','172'], 3:['47.0평','34.2평','155B'], 4:['46.6평','34.2평','153A'] };
  const TOP_SPEC = { '3501':['73.5평','53.2평','242B'], '3503':['73.7평','53.0평','243A'] };

  const NOTES = ['가격 조정 문의 — 다음 주 재연락','전세 재계약 의사 확인','매도 시점 상담 — 내년 봄 희망','',''];

  function unitsFor(site) {
    if (site.id === 's1') {
      const rows = [];
      for (let f = 1; f <= 35; f++) for (let l = 1; l <= 4; l++) {
        const ho = `${f}${String(l).padStart(2,'0')}`;
        if (f === 35 && (l === 2 || l === 4)) continue;
        const spec = f === 1 ? ['','',''] : (TOP_SPEC[ho] ?? LINE_SPEC[l]);
        const rec = GRACIUM_RECORDS[ho];
        rows.push({ dong:'101', ho, sup:spec[0], exc:spec[1], kind:spec[2], owner:rec?.[0] ?? '', phone:rec?.[1] ?? '', note:rec?.[2] ?? '' });
      }
      return rows;
    }
    const floors = site.units < 100 ? 4 : 20;
    const rows = [];
    let seed = site.id.length + site.name.length;
    const pick = new Set();
    while (pick.size < Math.min(site.managed, floors * 4)) { seed = (seed * 37 + 11) % (floors * 4); pick.add(seed); }
    let idx = 0;
    for (let f = 1; f <= floors; f++) for (let l = 1; l <= 4; l++) {
      const ho = `${f}${String(l).padStart(2,'0')}`;
      const on = pick.has(idx);
      const name = NAMES[(idx + site.name.length) % NAMES.length];
      rows.push({ dong: site.dongs > 1 ? '101' : '', ho, sup:`${(33 + l * 1.7).toFixed(1)}평`, exc:`${(25 + l * 1.3).toFixed(1)}평`, kind:`${84 - l * 5}A`,
        owner: on ? name : '', phone: on ? `010-3${String(idx).padStart(3,'0')}-${String(1000 + idx * 7).slice(-4)}` : '', note: on ? NOTES[idx % NOTES.length] : '' });
      idx++;
    }
    return rows;
  }

  // ── 상태 ──────────────────────────────────────────────────
  const KEY = 'mock.managedSitesDock.';
  const load = (k, d) => { try { const v = localStorage.getItem(KEY + k); return v == null ? d : JSON.parse(v); } catch { return d; } };

    return q.toLowerCase().split(/\s+/).filter(Boolean).every(t => hay.includes(t));
  }

  // ── 사이드바 열고 닫기 ────────────────────────────────────
  function renderDock() {
    document.documentElement.style.setProperty('--panel-w', `${effectivePanelW()}px`);
    $('dock').classList.toggle('open', state.open);
    $('sitePanel').inert = !state.open;
    $('siteBtn').setAttribute('aria-expanded', state.open);
    // 이름이 말줄임될 수 있으니 전체 이름을 툴팁에 함께 둔다
    $('siteBtn').title = `${selected().name} — ${state.open ? '단지 목록 닫기' : '단지 목록 열기'} ( [ )`;
    $('siteBtnIcon').querySelector('use').setAttribute('href', state.open ? '#i-panel-close' : '#i-panel-open');
    const s = selected();
    $('siteBtnName').textContent = s.name;
    // 닫혀 있을 때만 '다른 단지 n'을 덧붙여, 버튼이 목록으로 이어진다는 걸 알려 준다
    $('siteBtnHint').textContent = state.open ? '' : `단지 ${sites().length}`;
  }
  function setOpen(open, { focus = true } = {}) {
    state.open = open; save('open', open); hideTip(); setMenu(false);
    renderDock();
    if (open && focus) {
      setTimeout(() => ($('siteTools').hidden ? $('siteList').querySelector('.site.on') : $('siteSearch'))?.focus({ preventScroll: true }), 160);
    }
  }

  // ── 단지 한 줄 ────────────────────────────────────────────
  function siteRow(site) {
    const isOn = site.id === selected().id;
    const isPinned = state.pinned.has(site.id);
    const showKind = site.type !== 'apartment' && state.groupBy !== 'type';
    const showWard = state.groupBy !== 'region';
    const managed = site.managed > 0 ? `관리호수 <b class="num">${site.managed}</b>` : '관리호수 없음';
    const sub = [showWard ? esc(site.ward) : null, managed].filter(Boolean).join(' · ');
    const signals = state.signals
      ? `<span class="signals">${site.listings ? `<span class="num">매물 ${site.listings}</span>` : ''}${site.expiring ? `<span class="sig-exp num">만기 ${site.expiring}</span>` : ''}</span>`
      : '';
    return `<div class="site ${isOn ? 'on' : ''} ${site.managed ? '' : 'idle'}" role="option" tabindex="0" aria-selected="${isOn}" data-site="${site.id}">
      <div class="site-main">
        <div class="site-name"><span class="t">${esc(site.name)}</span>${showKind ? `<span class="kind">${TYPE_LABEL[site.type]}</span>` : ''}</div>
        <div class="site-sub">${sub}</div>
      </div>${signals}
      <span class="acts">
        <button type="button" class="act ${isPinned ? 'pinned' : ''}" data-pin="${site.id}" aria-label="${esc(site.name)} ${isPinned ? '고정 해제' : '고정'}" title="${isPinned ? '고정 해제' : '위에 고정'}"><svg class="i" style="width:13px;height:13px"><use href="#i-pin"/></svg></button>
        <button type="button" class="act" data-more="${site.id}" aria-label="${esc(site.name)} 메뉴" title="관리단지에서 제거 등"><svg class="i"><use href="#i-more"/></svg></button>
      </span>
    </div>`;
  }
  const sectionLabel = (text, count) => `<div class="slabel">${esc(text)} <span class="n num">${count}</span></div>`;
  const toggleLabel = (text, count, open, attrs) =>
    `<div class="slabel toggle" ${attrs} role="button" tabindex="0" aria-expanded="${open}"><svg class="i"><use href="#i-${open ? 'down' : 'chev'}"/></svg>${esc(text)} <span class="n num">${count}</span></div>`;

  // ── 단지 목록 ─────────────────────────────────────────────
  function renderList() {
    const all = sites();
    const showTools = all.length > SEARCH_MIN_SITES;
    $('siteTools').hidden = !showTools;
    if (!showTools) state.query = '';
    const visible = all.filter(s => matches(s, state.query));
    const pinnedVisible = visible.filter(s => state.pinned.has(s.id));
    $('siteCount').textContent = state.query || state.pinnedOnly
      ? `${state.pinnedOnly ? pinnedVisible.length : visible.length}/${all.length}` : all.length;
    const totalManaged = all.reduce((sum, s) => sum + s.managed, 0);
    const idleCount = all.filter(s => !s.managed).length;
    $('siteSum').innerHTML = `관리호수 <b class="num">${totalManaged}</b>${idleCount ? ` · 기록 없음 <span class="num">${idleCount}</span>` : ''}`;
    $('viewDot').hidden = state.groupBy === 'none' && !state.pinnedOnly;
    document.querySelectorAll('#viewMenu [data-group]').forEach(b => {
      const on = b.dataset.group === state.groupBy;
      b.setAttribute('aria-checked', on); b.querySelector('.ck').innerHTML = on ? '<svg class="i"><use href="#i-check"/></svg>' : '';
    });
    $('pinnedOnlyBtn').setAttribute('aria-checked', state.pinnedOnly);
    $('pinnedOnlyBtn').querySelector('.ck').innerHTML = state.pinnedOnly ? '<svg class="i"><use href="#i-check"/></svg>' : '';
    $('siteSearchClear').hidden = !state.query;

    const rest = state.pinnedOnly ? [] : visible.filter(s => !state.pinned.has(s.id));
    let html = '';
    if (pinnedVisible.length) html += sectionLabel('고정', pinnedVisible.length) + pinnedVisible.map(siteRow).join('');
    if (rest.length) {
      if (state.groupBy === 'none') {
        const active = state.query ? rest : rest.filter(s => s.managed > 0);
        const idle = state.query ? [] : rest.filter(s => !s.managed);
        if (active.length) html += (pinnedVisible.length ? sectionLabel('전체', active.length) : '') + active.map(siteRow).join('');
        if (idle.length) {
          const open = state.idleOpen || idle.some(s => s.id === selected().id);
          html += toggleLabel('기록 없는 단지', idle.length, open, 'data-idle-toggle');
          if (open) html += idle.map(siteRow).join('');
        }
      } else {
        const keyOf = s => state.groupBy === 'region' ? `${s.district} ${s.ward}` : TYPE_LABEL[s.type];
        const groups = new Map();
        rest.forEach(s => { const k = keyOf(s); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(s); });
        [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0], 'ko')).forEach(([k, items]) => {
          const open = !state.collapsedGroups.has(k);
          html += toggleLabel(k, items.length, open, `data-group-key="${esc(k)}"`);
          if (open) html += items.map(siteRow).join('');
        });
      }
    }
    if (!pinnedVisible.length && !rest.length) {
      html = state.query
        ? `<div class="empty-list">‘${esc(state.query)}’에 맞는 단지가 없습니다<br><button type="button" id="clearFromEmpty">검색어 지우기</button></div>`
        : `<div class="empty-list">고정한 단지가 없습니다<br><button type="button" id="showAllFromEmpty">전체 보기</button></div>`;
    }
    $('siteList').innerHTML = html;
  }

  // ── 본문 표 ───────────────────────────────────────────────
  function renderMain() {
    const site = selected();
    const rows = unitsFor(site);
    const managedRows = rows.filter(r => r.owner);
    $('cManaged').textContent = managedRows.length;
    $('cAll').textContent = rows.length;
    $('dongLabel').textContent = site.dongs > 1 ? '101' : '전체';
    document.querySelectorAll('#scopeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state.scope));
    const shown = state.scope === 'managed' ? managedRows : rows;
    if (!shown.length) {
      $('tableWrap').innerHTML = `<div class="uempty"><div><strong>이 범위에 관리호수가 없습니다</strong>‘전체’에서 호수를 골라 관리호수로 등록하세요.</div></div>`;
    } else {
      $('tableWrap').innerHTML = `<table><thead><tr><th style="width:64px">동</th><th style="width:72px">호</th><th style="width:78px">공급</th><th style="width:78px">전용</th><th style="width:72px">타입</th><th style="width:140px">소유자명</th><th style="width:132px">소유자 전화번호</th><th>최근 상담</th></tr></thead><tbody>${
        shown.map(r => `<tr><td>${esc(r.dong || '-')}</td><td class="ho num">${esc(r.ho)}</td><td class="num">${esc(r.sup)}</td><td class="num">${esc(r.exc)}</td><td>${esc(r.kind)}</td><td>${esc(r.owner)}</td><td class="ph num">${esc(r.phone)}</td><td class="cs">${r.note ? `<b>${esc(r.owner)}</b>${esc(r.note)}` : ''}</td></tr>`).join('')
      }</tbody></table>`;
    }
    $('status').innerHTML = `<span class="num">호수 ${shown.length}건 표시</span><span style="color:var(--border)">|</span><span>${esc(site.name)}</span>`;
  }

  function render() { renderDock(); renderList(); renderMain(); }

  // ── 단지 정보 말풍선 ──────────────────────────────────────
  let tipTimer = null;
  function showTip(row) {
    const site = ALL_SITES.find(s => s.id === row.dataset.site);
    if (!site) return;
    const r = row.getBoundingClientRect();
    const tip = $('tip');
    tip.innerHTML = `<h4>${esc(site.name)}</h4><div class="addr">${esc(site.addr)}</div>
      <dl><dt>유형</dt><dd>${TYPE_LABEL[site.type]}</dd><dt>규모</dt><dd class="num">${site.dongs > 1 ? `${site.dongs}개동 · ` : ''}${site.units.toLocaleString()}호</dd><dt>준공</dt><dd class="num">${site.built}년</dd>
      <dt>우리 관리호수</dt><dd class="num">${site.managed ? site.managed + '호' : '없음'}</dd></dl>`;
    tip.style.left = `${r.right + 12}px`;
    tip.style.top = `${Math.min(r.top - 4, window.innerHeight - 190)}px`;
    tip.classList.add('show');
  }
  function hideTip() { clearTimeout(tipTimer); $('tip').classList.remove('show'); }

  // ── 이벤트 ────────────────────────────────────────────────
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1700); }
  function setMenu(open) {
    $('viewMenu').hidden = !open; $('viewBtn').setAttribute('aria-expanded', open);
    if (open) { const b = $('viewBtn').getBoundingClientRect(); $('viewMenu').style.top = `${b.bottom + 4}px`; $('viewMenu').style.left = `${Math.max(8, b.right - 200)}px`; }
  }
  function openSite(id) {
    state.selectedId = id; state.scope = 'managed'; hideTip();
    if (state.autoClose) { state.open = false; save('open', false); $('siteBtn').focus(); }
    render();
  }
  function togglePin(id) { state.pinned.has(id) ? state.pinned.delete(id) : state.pinned.add(id); save('pinned', [...state.pinned]); hideTip(); renderList(); }

  $('siteBtn').addEventListener('click', () => setOpen(!state.open));
  $('closePanel').addEventListener('click', () => { setOpen(false); $('siteBtn').focus(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === '[' && !e.target.closest('input')) { e.preventDefault(); setOpen(!state.open); }
    if (e.key === 'Escape' && state.open && e.target.closest('#sitePanel') && !e.target.closest('input')) { setOpen(false); $('siteBtn').focus(); }
  });

  $('siteList').addEventListener('click', (e) => {
    const pin = e.target.closest('[data-pin]');
    if (pin) { togglePin(pin.dataset.pin); return; }
    if (e.target.closest('[data-more]')) { toast('관리단지에서 제거 · 메모 — 시안에서는 동작하지 않습니다'); return; }
    if (e.target.closest('[data-idle-toggle]')) { state.idleOpen = !state.idleOpen; renderList(); return; }
    const g = e.target.closest('[data-group-key]');
    if (g) { const k = g.dataset.groupKey; state.collapsedGroups.has(k) ? state.collapsedGroups.delete(k) : state.collapsedGroups.add(k); renderList(); return; }
    const row = e.target.closest('[data-site]');
    if (row) { openSite(row.dataset.site); return; }
    if (e.target.id === 'clearFromEmpty') { state.query = ''; $('siteSearch').value = ''; renderList(); }
    if (e.target.id === 'showAllFromEmpty') { state.pinnedOnly = false; renderList(); }
  });
  $('siteList').addEventListener('keydown', (e) => {
    const row = e.target.closest('[data-site],[data-group-key],[data-idle-toggle]');
    if (!row) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); row.click(); }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const rows = [...$('siteList').querySelectorAll('[data-site]')];
      const i = rows.indexOf(row);
      rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))]?.focus();
    }
  });
  $('siteList').addEventListener('mouseover', (e) => {
    const row = e.target.closest('[data-site]');
    if (!row || row.contains(e.relatedTarget)) return;
    clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(row), 450);
  });
  $('siteList').addEventListener('mouseout', (e) => { const row = e.target.closest('[data-site]'); if (row && !row.contains(e.relatedTarget)) hideTip(); });
  $('siteList').addEventListener('scroll', hideTip);

  $('siteSearch').addEventListener('input', (e) => { state.query = e.target.value.trim(); renderList(); });
  $('siteSearch').addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (e.target.value) { e.target.value = ''; state.query = ''; renderList(); } else { setOpen(false); $('siteBtn').focus(); } }
    if (e.key === 'ArrowDown') { e.preventDefault(); $('siteList').querySelector('[data-site]')?.focus(); }
    if (e.key === 'Enter') { const first = $('siteList').querySelector('[data-site]'); if (first) openSite(first.dataset.site); }
  });
  $('siteSearchClear').addEventListener('click', () => { $('siteSearch').value = ''; state.query = ''; renderList(); $('siteSearch').focus(); });

  $('viewBtn').addEventListener('click', (e) => { e.stopPropagation(); setMenu($('viewMenu').hidden); });
  $('viewMenu').addEventListener('click', (e) => {
    e.stopPropagation();
    const g = e.target.closest('[data-group]');
    if (g) { state.groupBy = g.dataset.group; state.collapsedGroups.clear(); save('groupBy', state.groupBy); }
    if (e.target.closest('#pinnedOnlyBtn')) state.pinnedOnly = !state.pinnedOnly;
    renderList();
  });
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-add-site]')) toast('단지 검색 창 — 시안에서는 동작하지 않습니다');
    setMenu(false);
  });

  // 너비 조절
  const resize = $('resize');
  resize.addEventListener('pointerdown', (e) => {
    e.preventDefault(); resize.setPointerCapture(e.pointerId);
    const startX = e.clientX, startW = effectivePanelW();
    $('page').classList.add('resizing'); hideTip();
    const move = (ev) => {
      state.panelW = Math.round(Math.min(panelMaxNow(), Math.max(PANEL_W.min, startW + ev.clientX - startX)));
      document.documentElement.style.setProperty('--panel-w', `${state.panelW}px`);
    };
    const up = () => { $('page').classList.remove('resizing'); save('panelW', state.panelW); resize.removeEventListener('pointermove', move); resize.removeEventListener('pointerup', up); };
    resize.addEventListener('pointermove', move); resize.addEventListener('pointerup', up);
  });
  resize.addEventListener('dblclick', () => { state.panelW = PANEL_W.def; save('panelW', state.panelW); renderDock(); });
  resize.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    state.panelW = Math.min(panelMaxNow(), Math.max(PANEL_W.min, effectivePanelW() + (e.key === 'ArrowRight' ? 16 : -16)));
    save('panelW', state.panelW); renderDock();
  });
  window.addEventListener('resize', renderDock);

  $('scopeSeg').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (b) { state.scope = b.dataset.v; renderMain(); } });

  $('demoCount').addEventListener('click', (e) => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    state.dataset = b.dataset.v;
    document.querySelectorAll('#demoCount button').forEach(x => x.setAttribute('aria-pressed', x === b));
    if (!sites().some(s => s.id === state.selectedId)) state.selectedId = sites()[0].id;
    render();
  });
  $('demoAutoClose').checked = state.autoClose;
  $('demoAutoClose').addEventListener('change', (e) => { state.autoClose = e.target.checked; save('autoClose', state.autoClose); });
  $('demoSignals').addEventListener('change', (e) => { state.signals = e.target.checked; renderList(); });

  render();
})();
</script>
</body>
</html>
