<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5 · 오늘의 브리핑 — 스플래시 시안</title>
<link rel="stylesheet" href="stage.css">
<style>
  .d5b { transition: opacity 0.4s ease-out; }
  .d5b .top { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: rgb(42 51 35 / 0.08); }
  .d5b .top i { display: block; height: 100%; background: var(--ink); transform-origin: 0 50%; transform: scaleX(var(--p)); }
  .d5b .col { width: min(640px, 88vw); margin-top: -24px; transition: transform 0.45s var(--out), opacity 0.3s; }
  .d5b .brand { font-size: 15px; animation: b-up 0.5s var(--out) both; }
  .d5b .brand svg { width: 18px; height: 18px; }
  .d5b h1 { margin: 34px 0 0; font-size: 30px; font-weight: 650; letter-spacing: -1px; animation: b-up 0.6s var(--out) 0.08s both; }
  .d5b .sub { margin-top: 10px; font-size: 14.5px; color: var(--muted); animation: b-up 0.6s var(--out) 0.16s both; }
  @keyframes b-up { from { opacity: 0; transform: translateY(10px); } }
  .d5b .cards { margin-top: 34px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .d5b .card { background: #fff; border: 1px solid #e6e5e3; border-radius: 12px; padding: 16px 18px 18px; box-shadow: 0 1px 2px rgb(42 51 35 / 0.04); animation: b-up 0.6s var(--out) calc(0.24s + var(--i) * 70ms) both; }
  .d5b .card small { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .d5b .card small::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c, var(--moss)); }
  .d5b .val { margin-top: 12px; height: 34px; display: flex; align-items: baseline; gap: 4px; font-size: 30px; font-weight: 650; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .d5b .val em { font-style: normal; font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: -0.2px; }
  .d5b .note { margin-top: 6px; height: 16px; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 값이 도착하기 전에는 자리만 잡아 둔다 */
  .d5b .card:not(.in) .val > *, .d5b .card:not(.in) .note span { visibility: hidden; }
  .d5b .card:not(.in) .val, .d5b .card:not(.in) .note { border-radius: 6px; background: linear-gradient(90deg, #f1f0ee 25%, #f9f8f7 45%, #f1f0ee 65%) 0 0 / 300% 100%; animation: b-shimmer 1.3s linear infinite; }
  .d5b .card:not(.in) .val { width: 62%; }
  .d5b .card:not(.in) .note { width: 84%; }
  @keyframes b-shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .d5b .card.in .val > *, .d5b .card.in .note span { animation: b-val 0.4s var(--out) both; }
  @keyframes b-val { from { opacity: 0; transform: translateY(5px); } }
  .d5b[data-state="exit"] { opacity: 0; }
  .d5b[data-state="exit"] .col { transform: translateY(-12px) scale(0.99); opacity: 0; }
  .win[data-state="exit"] .dest-in { animation: b-rise 0.5s var(--out) both; }
  @keyframes b-rise { from { transform: translateY(12px); } }
  @media (max-width: 620px) { .d5b .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<template id="tpl">
  <main class="splash d5b">
    <div class="top"><i></i></div>
    <div class="col">
      <div class="brand"><span data-logo></span>에스테잇플로우</div>
      <h1 data-hello></h1>
      <div class="sub" data-sub></div>
      <div class="cards">
        <div class="card" style="--i:0" data-at="0.36" data-n="3"><small>오늘 일정</small><div class="val"><b>0</b><em>건</em></div><div class="note"><span>10:30 고덕그라시움 103동 임장</span></div></div>
        <div class="card" style="--i:1;--c:#d9892b" data-at="0.56" data-n="4"><small>확인 필요 매물</small><div class="val"><b>0</b><em>건</em></div><div class="note"><span>가장 오래된 확인 21일 전</span></div></div>
        <div class="card" style="--i:2;--c:#3f7fd9" data-at="0.76" data-n="1"><small>이번 주 잔금</small><div class="val"><b>0</b><em>건 · 12억 4,000</em></div><div class="note"><span>11월 14일 고덕아르테온 312동</span></div></div>
      </div>
    </div>
  </main>
</template>
<script>
  let cards = [];
  window.Demo = {
    min: 1700, readyMs: 420, exitMs: 480,
    mount(root) {
      const now = new Date();
      const h = now.getHours();
      root.querySelector("[data-hello]").textContent = h < 11 ? "좋은 아침입니다." : h < 18 ? "오늘도 수고 많으십니다." : "늦게까지 수고 많으십니다.";
      root.querySelector("[data-sub]").textContent =
        "고덕 에스테잇 공인중개 · " + now.toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "long" });
      cards = [...root.querySelectorAll(".card")].map((el) => ({ el, at: +el.dataset.at, n: +el.dataset.n, on: -1, b: el.querySelector("b") }));
    },
    progress(p, root, t) {
      cards.forEach((c) => {
        if (c.on < 0 && p >= c.at) { c.on = t; c.el.classList.add("in"); }
        if (c.on >= 0) {
          const k = Math.min((t - c.on) / 450, 1);
          c.b.textContent = Math.round(c.n * (1 - Math.pow(1 - k, 3)));
        }
      });
    },
  };
</script>
<script src="stage.js"></script>
</body>
</html>
