<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고객 원장 — 연락 순 표와 옆 패널</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /*
   * 고객 원장 시안 (2026-11-19)
   * 이 화면이 답할 질문: "오늘 누구에게 연락해야 하고, 그 손님 일이 어디까지 왔나."
   *  - 표를 다음 연락 시점으로 묶는다: 지남 / 오늘 / 이번 주 / 나중 / 미정.
   *  - 줄만 봐도 무슨 손님인지 알게, 의뢰를 건수가 아니라 내용으로 요약한다. 갈아타기는 → 로 잇는다.
   *  - 상세는 옆 패널로 연다. 목록은 그대로 보인다 (매물관리·연락처와 같은 방식).
   *  - 다음 연락은 줄에서 바로 미루거나 '연락함'으로 넘긴다.
   * 색은 app.css 토큰: 글자는 먹색 하나, 색은 상태(지남 = 빨강, 오늘 = 파랑)에만 쓴다.
   * 알림은 줄을 가리지 않게 아래 상태 줄에 띄운다.
   */
  :root {
    --bg: #fff; --fg: #2c2c2b; --fg2: #5f5e59; --fg3: #79766f; --fg4: #a3a09a; --icon: #8e8b86;
    --line: #f0efed; --line2: #e6e5e3; --side: #f9f8f7; --band: #fbfaf9;
    --hover: rgba(33, 27, 23, 0.045); --sel: rgba(33, 27, 23, 0.07);
    --blue: #2383e2; --blue-soft: #e7f1fb; --red: #e03e3e; --red-strong: #bb3430; --red-soft: #fdebec;
    --green: #0f7b6c; --green-soft: #dbeddb; --amber: #8a5a13; --amber-soft: #fbf3db;
    --pop: 0 14px 28px rgba(25, 25, 25, 0.08), 0 4px 8px rgba(25, 25, 25, 0.04), 0 0 0 1px rgba(42, 28, 0, 0.08);
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { overflow: hidden; background: var(--bg); color: var(--fg); font: 14px/20px "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { padding: 0; border: 0; background: none; cursor: pointer; text-align: inherit; }
  h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  svg { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; border-radius: 6px; }
  .num { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* 앱 틀 */
  .win { display: grid; grid-template-rows: 36px minmax(0, 1fr); height: 100vh; }
  .titlebar { display: flex; align-items: stretch; border-bottom: 1px solid var(--line2); background: var(--side); font-size: 14px; }
  .titlebar b { display: flex; align-items: center; width: 232px; padding-left: 16px; font-weight: 600; letter-spacing: -0.02em; }
  .titlebar span { display: flex; align-items: center; gap: 8px; width: 180px; padding: 0 12px; background: var(--bg); border: 1px solid var(--line2); border-bottom: 0; margin-top: 3px; border-radius: 6px 6px 0 0; }
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 0; }
  .nav { background: var(--side); border-right: 1px solid var(--line2); padding: 8px; overflow: auto; }
  .nav p { padding: 10px 8px 4px; font-size: 12px; color: var(--fg3); }
  .nav a { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 6px; color: var(--fg2); text-decoration: none; }
  .nav a svg { color: var(--icon); width: 16px; height: 16px; }
  .nav a[aria-current] { background: var(--sel); color: var(--fg); font-weight: 500; }
  .main { position: relative; display: flex; min-width: 0; min-height: 0; }
  .list { display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; }

  /* 도구 줄 */
  .tb { display: flex; flex: none; align-items: center; gap: 8px; height: 50px; padding: 0 12px; }
  .tabs { display: inline-flex; gap: 2px; }
  .tab { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 15px; color: var(--fg3); font-weight: 500; white-space: nowrap; transition: background-color 120ms; }
  .tab:hover { background: var(--hover); }
  .tab[aria-selected="true"] { background: var(--sel); color: var(--fg); }
  .tab i { font-style: normal; font-weight: 400; color: var(--fg4); }
  .search { display: flex; align-items: center; gap: 7px; width: 250px; height: 30px; margin-left: auto; padding: 0 10px; border-radius: 15px; background: #f4f3f1; color: var(--fg3); }
  .search:focus-within { box-shadow: 0 0 0 2px rgba(35, 131, 226, 0.35); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; }
  .search input::placeholder { color: var(--fg3); }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line2); color: var(--fg2); white-space: nowrap; transition: background-color 120ms; }
  .chip:hover { background: var(--hover); }
  .chip.on { background: var(--sel); box-shadow: none; color: var(--fg); font-weight: 500; }
  .chip svg { color: var(--icon); }
  .primary { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 12px 0 9px; border-radius: 6px; background: var(--fg); color: #fff; font-weight: 500; white-space: nowrap; transition: opacity 120ms, transform 160ms var(--ease); }
  .primary:hover { opacity: 0.88; }
  .primary:active { transform: scale(0.97); }

  /* 표: 줄은 subgrid (display: contents 로 풀면 줄에 포커스를 줄 수 없다) */
  .scroll { flex: 1; min-height: 0; overflow: auto; border-top: 1px solid var(--line2); }
  .tbl { display: grid; grid-template-columns: 184px minmax(240px, 1.5fr) 140px minmax(170px, 1fr) 204px 80px; min-width: 1018px; }
  /* 좁은 창에서는 최근 상담 칸을 접는다 (옆 패널에서 본다) */
  @media (max-width: 1239px) {
    .tbl { grid-template-columns: 184px minmax(240px, 1fr) 140px 0 204px 80px; min-width: 848px; }
    .c-log { visibility: hidden; padding: 0 !important; border: 0 !important; }
  }
  /* 옆 패널이 열리면: 넓은 창은 표를 줄이고 전화번호와 최근 상담을 접는다 */
  @media (min-width: 1420px) {
    .peek-open .tbl { grid-template-columns: 150px minmax(200px, 1fr) 128px 0 204px 76px; min-width: 758px; }
    .peek-open .c-log { visibility: hidden; padding: 0; border: 0; }
    .peek-open .who span, .peek-open .sum .more { display: none; }
  }
  .tr { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; }
  .th, .td { display: flex; align-items: center; min-width: 0; padding: 0 10px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
  .th:first-child, .td:first-child { border-left: 0; padding-left: 12px; }
  .th { position: sticky; top: 0; z-index: 3; gap: 6px; height: 34px; background: var(--bg); border-bottom-color: var(--line2); font-size: 12px; color: var(--fg3); }
  .th svg { width: 13px; height: 13px; color: var(--icon); }
  .td { height: 40px; }
  .row { position: relative; cursor: pointer; }
  .row:hover .td, .row:focus-within .td { background: var(--band); }
  .row.sel .td { background: #f1f6fc; }
  .row.flash .td { animation: flash 1.4s ease-out; }
  @keyframes flash { from { background: #fdf3dc; } }
  @media (prefers-reduced-motion: reduce) { .row.flash .td { animation: none; } }

  /* 묶음 머리 */
  .gh { grid-column: 1 / -1; position: sticky; top: 34px; z-index: 2; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 8px; background: var(--band); border-bottom: 1px solid var(--line); font-weight: 600; }
  .gh svg { color: var(--fg3); transition: transform 160ms var(--ease); }
  .gh[aria-expanded="true"] svg { transform: rotate(90deg); }
  .gh i { font-style: normal; font-weight: 400; color: var(--fg4); }
  .gh small { margin-left: 4px; font-size: 12px; font-weight: 400; color: var(--fg3); }
  .gh.late { color: var(--red-strong); }
  .gh.late i { color: var(--red-strong); opacity: 0.7; }
  .gh.today { color: var(--blue); }

  /* 칸 안 */
  .who { display: flex; align-items: baseline; gap: 8px; min-width: 0; max-width: 100%; border-radius: 4px; }
  .who b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .who span { font-size: 12px; color: var(--fg4); }
  .sum { display: flex; align-items: center; gap: 7px; min-width: 0; overflow: hidden; }
  .it { display: inline-flex; flex: 0 1 auto; align-items: center; gap: 5px; min-width: 56px; overflow: hidden; }
  .it > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .sd { flex: none; padding: 0 5px; border-radius: 4px; background: #f1f1ef; font-size: 12px; line-height: 18px; color: var(--fg2); font-style: normal; }
  .arrow { flex: none; color: var(--fg4); }
  .more { flex: none; font-size: 12px; color: var(--fg4); }
  .none { color: var(--fg4); }
  .stage { display: inline-flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--fg2); }
  .stage.deal { color: var(--green); font-weight: 500; }
  .stage.hold { color: var(--fg4); }
  .log { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--fg2); }
  .log i { margin-right: 6px; font-style: normal; font-size: 12px; color: var(--fg4); }
  .c-next { position: relative; }
  .when { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px; margin-left: -6px; border-radius: 6px; transition: background-color 120ms; }
  .when:hover { background: var(--hover); }
  .when b { font-weight: 500; }
  .when span { font-size: 12px; color: var(--fg3); }
  .when.late b, .when.late span { color: var(--red-strong); }
  .when.today b { color: var(--blue); }
  .when.unset b { font-weight: 400; color: var(--fg4); }
  /* 안 보일 때도 Tab으로 닿는다. 닿으면 드러난다. */
  .done { position: absolute; right: 8px; top: 8px; display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 7px; border-radius: 6px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line2); font-size: 12px; font-weight: 500; color: var(--fg2); opacity: 0; transition: opacity 120ms, background-color 120ms; }
  .row:hover .done, .row:focus-within .done, .done[aria-expanded="true"] { opacity: 1; }
  .done:hover { background: #f4f3f1; color: var(--fg); }
  .done svg { width: 13px; height: 13px; }
  @media (hover: none) { .done { opacity: 1; } }
  .owner { color: var(--fg2); overflow: hidden; text-overflow: ellipsis; }
  .empty { grid-column: 1 / -1; padding: 56px 16px; text-align: center; color: var(--fg3); }
  .empty button { margin-top: 10px; height: 28px; padding: 0 10px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line2); }

  /* 아래 상태 줄: 알림과 되돌리기가 여기에 뜬다 (줄을 가리지 않는다) */
  .status { display: flex; flex: none; align-items: center; gap: 12px; height: 32px; padding: 0 12px; border-top: 1px solid var(--line2); background: var(--band); font-size: 12px; color: var(--fg3); }
  .status .msg { display: inline-flex; align-items: center; gap: 8px; color: var(--fg); }
  .status .msg button { height: 22px; padding: 0 8px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line2); background: var(--bg); font-weight: 500; }
  .status .msg button:hover { background: #f4f3f1; }
  .status .right { margin-left: auto; }

  /* 옆 패널 */
  .peek { display: none; flex: none; flex-direction: column; width: 448px; min-height: 0; border-left: 1px solid var(--line2); background: var(--bg); }
  .peek-open .peek { display: flex; animation: slide 220ms var(--ease); }
  /* 좁은 창에서는 표를 줄이지 않고 표 위에 덮는다 */
  @media (max-width: 1419px) { .peek { position: absolute; top: 0; right: 0; bottom: 0; z-index: 5; width: min(448px, 100%); box-shadow: -12px 0 28px rgba(25, 25, 25, 0.07); } }
  @keyframes slide { from { opacity: 0; transform: translateX(12px); } }
  @media (prefers-reduced-motion: reduce) { .peek-open .peek { animation: none; } }
  .pk-bar { display: flex; flex: none; align-items: center; gap: 4px; height: 44px; padding: 0 8px 0 12px; font-size: 12px; color: var(--fg4); }
  .ib { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; color: var(--fg3); }
  .ib:hover { background: var(--hover); color: var(--fg); }
  .ib:disabled { opacity: 0.35; cursor: default; background: none; }
  .pk-body { flex: 1; min-height: 0; overflow: auto; padding: 4px 24px 28px; }
  .pk-body h2 { font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: -0.02em; }
  .pk-meta { margin-top: 2px; color: var(--fg3); }
  .pk-note { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: var(--side); color: var(--fg2); font-size: 12px; line-height: 18px; }
  .nextbox { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; margin-top: 16px; padding: 12px 14px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line2); }
  .nextbox.late { background: var(--red-soft); box-shadow: none; }
  .nextbox.today { background: var(--blue-soft); box-shadow: none; }
  .nextbox .lab { font-size: 12px; color: var(--fg3); }
  .nextbox .big { grid-column: 1; display: flex; align-items: baseline; gap: 8px; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .nextbox .big span { font-size: 12px; font-weight: 400; color: var(--fg3); }
  .nextbox.late .big, .nextbox.late .big span { color: var(--red-strong); }
  .nextbox .acts { grid-row: 1 / 3; grid-column: 2; display: flex; gap: 6px; }
  .btn { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 6px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line2); font-weight: 500; white-space: nowrap; transition: background-color 120ms, transform 160ms var(--ease); }
  .btn:hover { background: #f4f3f1; }
  .btn:active { transform: scale(0.97); }
  .btn.dark { background: var(--fg); color: #fff; box-shadow: none; }
  .btn.dark:hover { opacity: 0.88; background: var(--fg); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .sec { margin-top: 24px; }
  .sec h3 { display: flex; align-items: baseline; gap: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 600; }
  .sec h3 i { font-style: normal; font-weight: 400; color: var(--fg4); }
  .case { margin-top: 10px; }
  .case-h { display: flex; align-items: center; gap: 6px; font-weight: 500; }
  .case-h span { font-size: 12px; font-weight: 400; color: var(--fg4); }
  .steps { position: relative; margin: 6px 0 0 6px; padding-left: 20px; }
  .steps::before { content: ""; position: absolute; left: 6px; top: 12px; bottom: 12px; border-left: 1px solid var(--line2); }
  .step { position: relative; padding: 6px 0; }
  .step::before { content: attr(data-n); position: absolute; left: -20px; top: 8px; display: grid; place-items: center; width: 14px; height: 14px; margin-left: -1px; border-radius: 50%; background: var(--bg); box-shadow: 0 0 0 1px var(--line2); font-size: 10px; line-height: 1; color: var(--fg3); }
  .intent { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; }
  .intent .tx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .intent .sub { grid-column: 2 / 4; font-size: 12px; color: var(--fg3); }
  .loose { padding: 8px 0; border-top: 1px solid var(--line); }
  .loose:first-of-type { border-top: 0; }
  .badge { padding: 0 6px; border-radius: 4px; font-size: 12px; line-height: 18px; font-weight: 500; white-space: nowrap; background: #f1f1ef; color: var(--fg2); }
  .badge.go { background: var(--green-soft); color: var(--green); }
  .badge.hold { background: var(--amber-soft); color: var(--amber); }
  .logs li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .logs time { font-size: 12px; line-height: 20px; color: var(--fg3); }
  .logs p { color: var(--fg); overflow-wrap: anywhere; }
  .logs small { display: block; font-size: 12px; color: var(--fg4); }
  .write { margin-top: 10px; padding: 8px 10px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line2); }
  .write:focus-within { box-shadow: inset 0 0 0 1.5px var(--blue); }
  .write textarea { display: block; width: 100%; min-height: 44px; border: 0; outline: 0; resize: vertical; background: none; }
  .write-foot { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .seg { display: inline-flex; padding: 2px; border-radius: 7px; background: #f4f3f1; }
  .seg button { height: 22px; padding: 0 8px; border-radius: 5px; font-size: 12px; color: var(--fg3); }
  .seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); font-weight: 500; box-shadow: 0 1px 2px rgba(15, 15, 15, 0.1); }
  .hint { font-size: 12px; color: var(--fg4); }

  /* 떠 있는 판 (다음 연락 미루기 / 연락함) */
  .pop { position: fixed; z-index: 40; width: 300px; padding: 10px; border-radius: 10px; background: var(--bg); box-shadow: var(--pop); animation: pop 140ms var(--ease); }
  @keyframes pop { from { opacity: 0; transform: translateY(-3px) scale(0.985); } }
  @media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
  .pop h4 { margin: 2px 4px 8px; font-size: 12px; font-weight: 500; color: var(--fg3); }
  .opt { display: flex; align-items: center; width: 100%; height: 30px; padding: 0 8px; border-radius: 6px; }
  .opt:hover, .opt:focus-visible { background: var(--hover); }
  .opt span { margin-left: auto; font-size: 12px; color: var(--fg4); }
  .opt[aria-checked="true"] { font-weight: 500; }
  .opt[aria-checked="true"]::after { content: "✓"; margin-left: 8px; color: var(--blue); }
  .pop hr { height: 1px; margin: 6px 0; border: 0; background: var(--line); }
  .field { display: grid; gap: 4px; margin: 0 4px 8px; }
  .field label, .field .lab { font-size: 12px; color: var(--fg3); }
  .input { width: 100%; height: 30px; padding: 0 8px; border: 0; border-radius: 6px; outline: 0; box-shadow: inset 0 0 0 1px var(--line2); background: var(--bg); }
  .input:focus { box-shadow: inset 0 0 0 1.5px var(--blue); }
  .pick { display: flex; flex-wrap: wrap; gap: 4px; }
  .pick button { height: 26px; padding: 0 9px; border-radius: 13px; box-shadow: inset 0 0 0 1px var(--line2); font-size: 12px; color: var(--fg2); }
  .pick button[aria-pressed="true"] { background: var(--fg); color: #fff; box-shadow: none; }
  .pop-foot { display: flex; justify-content: flex-end; gap: 6px; margin: 10px 4px 2px; }
</style>
</head>
<body>
<div class="win">
  <div class="titlebar" aria-hidden="true"><b>Estaitt</b><span><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>고객 원장</span></div>
  <div class="shell">
    <nav class="nav" aria-label="메뉴 (시안에서는 눌리지 않습니다)" inert>

  function drawStatus() {

          <div style="margin-top:10px;display:flex;gap:6px"><button class="btn" data-a="say" data-k="구함 의뢰 등록 창이 열립니다 (시안)" data-fid="pk-addbuy">${ICON.plus}구함 등록</button><button class="btn" data-a="say" data-k="내놓음 의뢰 등록 창이 열립니다 (시안)" data-fid="pk-addsell">${ICON.plus}내놓음 등록</button></div>

          <ul class="logs">${c.logs.map((l) => `<li><time class="num">${md(l.date).replace(/ \(.\)/, '')}</time><div><p>${esc(l.text)}</p><small>${esc(l.kind)} · ${esc(l.by)}</small></div></li>`).join('') || '<li><span></span><p class="hint">상담 기록이 없습니다.</p></li>'}</ul>
        </section></div>`;
  }
  const NEXT_OPTS = [['today', '오늘', TODAY], ['d1', '내일', addDays(TODAY, 1)], ['d3', '3일 뒤', addDays(TODAY, 3)], ['mon', '다음 주 월요일', addDays(TODAY, ((8 - toDate(TODAY).getDay()) % 7) || 7)], ['w2', '2주 뒤', addDays(TODAY, 14)]];
  function drawPop() {
    const root = $('pop-root'); const p = S.pop;
    if (!p) { root.innerHTML = ''; return; }
    const c = p.id ? byId(p.id) : null;
    let html = '';
    if (p.type === 'owner') html = `<div class="pop" role="dialog" aria-label="담당으로 거르기"><h4>담당</h4>${[['', '모두'], ...OWNERS.map((o) => [o, o])].map(([v, l]) => `<button class="opt" role="menuitemradio" aria-checked="${S.owner === v}" data-a="setowner" data-k="${esc(v)}" data-fid="own:${esc(v)}">${esc(l)}</button>`).join('')}</div>`;
    else if (p.type === 'when') html = `<div class="pop" role="dialog" aria-label="${esc(c.name)} 다음 연락 바꾸기"><h4>${esc(c.name)} · 다음 연락</h4>

      html = `<div class="pop" role="dialog" aria-label="${esc(c.name)} 연락함으로 기록"><h4>${esc(c.name)} · 연락함</h4>

    root.innerHTML = html;

  /** 판을 누른 단추 아래에 둔다. 아래가 모자라면 위로, 오른쪽이 모자라면 왼쪽으로 붙인다. */
  function place() {
    const pop = document.querySelector('.pop'), anchor = S.pop && document.querySelector(`[data-fid="${CSS.escape(S.pop.anchorFid)}"]`);
    if (!pop) return;
    if (!anchor) { pop.style.left = '50%'; pop.style.top = '120px'; return; }
    const a = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
    const left = Math.max(8, Math.min(a.left, innerWidth - w - 8));
    const top = a.bottom + 6 + h > innerHeight - 8 ? Math.max(8, a.top - h - 6) : a.bottom + 6;
    pop.style.left = `${left}px`; pop.style.top = `${top}px`;
  }
  /** 다시 그린다. 포커스와 커서는 data-fid 로 되찾는다. */
  function render(focusFid) {

  }

  /* ───────── 바꾸기 ───────── */
  function change(id, text, fn) { // 직전 변경 하나만 되돌릴 수 있다
    const c = byId(id); S.undo = { id, before: JSON.parse(JSON.stringify(c)) }; fn(c); S.msg = text; S.flash = id;
    S.closed.delete(bucket(c)); // 옮겨 간 묶음이 접혀 있으면 편다 (줄이 사라져 보이지 않게)
  }
  const closePop = (focus = true) => { const fid = S.pop?.anchorFid; S.pop = null; return focus ? fid : undefined; };
  /** 판을 닫은 뒤 포커스를 둘 곳: 누른 단추가 아직 있으면 거기, 없으면 그 손님의 줄 */
  const backTo = (fid, id) => (fid && document.querySelector(`[data-fid="${CSS.escape(fid)}"]`) ? fid : `row:${id}`);
  const ACT = {
    tab: (k) => { S.tab = k; },
    fold: (k) => { S.closed.has(k) ? S.closed.delete(k) : S.closed.add(k); },
    reset: () => { S.tab = 'all'; S.q = ''; S.owner = ''; return 'q'; },
    say: (k) => { S.msg = k; S.undo = null; },
    owner: () => { S.pop = S.pop?.type === 'owner' ? null : { type: 'owner', anchorFid: 'owner' }; return S.pop ? `own:${S.owner}` : 'owner'; },
    setowner: (k) => { S.owner = k; S.pop = null; return 'owner'; },
    peek: (k) => { S.peekId = S.peekId === k ? null : k; },
    close: () => { const id = S.peekId; S.peekId = null; return `row:${id}`; },
    step: (k, el) => { const order = ordered(visible()); const next = order[order.findIndex((c) => c.id === S.peekId) + Number(k)]; if (next) S.peekId = next.id; return el.dataset.fid; },
    when: (k, el) => { const fid = el.dataset.fid; S.pop = S.pop?.type === 'when' && S.pop.anchorFid === fid ? null : { type: 'when', id: k, anchorFid: fid }; return S.pop ? (byId(k).next ? undefined : 'next:d1') : fid; },
    done: (k, el) => { const fid = el.dataset.fid; S.pop = S.pop?.type === 'done' && S.pop.anchorFid === fid ? null : { type: 'done', id: k, anchorFid: fid }; return S.pop ? 'dtext' : fid; },
    popclose: () => { const id = S.pop?.id; const fid = closePop(); return backTo(fid, id); },
    setnext: (k) => { const { id, anchorFid } = S.pop; const c = byId(id); if ((c.next ?? '') !== k) change(id, `${c.name} 님의 다음 연락을 ${k ? md(k) : '미정'}(으)로 바꿨습니다`, (x) => { x.next = k || null; }); S.pop = null; return `after:${anchorFid}:${id}`; },
    dkind: (k) => { const id = S.pop.id; S.doneDraft[id] = { ...(S.doneDraft[id] ?? { text: '', next: 'd3' }), kind: k }; },
    dnext: (k) => { const id = S.pop.id; S.doneDraft[id] = { ...(S.doneDraft[id] ?? { kind: '전화', text: '' }), next: k }; },
    dsave: () => {
      const { id, anchorFid } = S.pop; const d = S.doneDraft[id] ?? { kind: '전화', text: '', next: 'd3' };
      const next = d.next === 'none' ? null : NEXT_OPTS.find((o) => o[0] === d.next)[2];
      change(id, `${byId(id).name} 님께 연락한 것으로 적고 다음 연락을 ${next ? md(next) : '미정'}(으)로 잡았습니다`, (c) => { c.logs.unshift({ date: TODAY, kind: d.kind, by: ME, text: d.text.trim() || `${d.kind}로 연락함` }); c.next = next; c.nextNote = ''; });
      delete S.doneDraft[id]; S.pop = null; return `after:${anchorFid}:${id}`;
    },
    wkind: (k) => { const id = S.peekId; S.writeDraft[id] = { ...(S.writeDraft[id] ?? { text: '' }), kind: k }; },
    wsave: () => { const id = S.peekId; const w = S.writeDraft[id]; if (!w?.text.trim()) return;
      change(id, `${byId(id).name} 님 상담을 적었습니다`, (c) => { c.logs.unshift({ date: TODAY, kind: w.kind ?? '전화', by: ME, text: w.text.trim() }); });
      delete S.writeDraft[id]; return 'write'; },
    undo: () => { const u = S.undo; if (!u) return; customers = customers.map((c) => (c.id === u.id ? u.before : c)); S.msg = '되돌렸습니다'; S.undo = null; S.flash = u.id; S.closed.delete(bucket(u.before)); return `row:${u.id}`; },
  };
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-a]');
