<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대시보드 9판 · 앱 부품 값 적용</title>
<link rel="icon" href="data:,">
<style>
  /*
   * 9판 스타일 — 앱의 실제 부품 값을 그대로 옮겼다. 옆의 주석은 어느 파일의 어느 클래스인지다.
   *   틀      routes/_authenticated.tsx (제목 줄 h-9 bg-sidebar, 본문 p-4), features/tabs/TabBar/Tab.tsx, components/ui/sidebar.tsx (폭 16rem, 메뉴 h-8 rounded-md p-2 text-sm)
   *   단추    components/ui/button.tsx (기본 = 먹색 bg-primary, outline = border + shadow-xs, sm h-8, xs h-6, 누르면 scale .98, 포커스 ring 3px)
   *   카드    components/ui/card.tsx (rounded-xl border shadow-sm)
   *   탭      components/ui/tabs.tsx (목록 bg-muted rounded-lg p-[3px], 고른 탭 bg-background shadow-sm)
   *   배지    components/ui/badge.tsx (rounded-full px-2 py-0.5 text-xs), components/domain/status-badge.tsx (rounded-md, 연한 바탕 + 진한 글자, 점 없음)
   *   글자    현재 dashboard.tsx (날짜 12.5px, 인사 text-2xl, 구획 제목 15px semibold, 줄 제목 text-sm medium, 보조 text-xs muted, 시간 13px semibold)
   * 본문 바탕은 앱과 같은 흰색이다. 흰 바탕에서 카드가 묻히지 않게 카드 테두리만 border(#f0efed) 대신 input(#e6e5e3) 색을 썼다.
   */
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");
  :root {
    --background: #ffffff; --foreground: #2c2c2b; --muted: #f9f8f7; --muted-foreground: #79766f; --muted-foreground-strong: #5f5e59;
    --border: #f0efed; --input: #e6e5e3; --ring: #2383e2; --primary: #2c2c2b; --secondary: #f1f1ef; --accent: #f1f1ef;
    --destructive: #e03e3e; --destructive-soft: #ffe2dd; --destructive-strong: #bb3430;
    --success: #0f7b6c; --success-soft: #dbeddb; --warning: #cb912f; --warning-soft: #fdecc8; --warning-strong: #8a5a13;
    --info: #2383e2; --info-soft: #d3e5ef; --violet: #6940a5; --violet-soft: #e8deee; --orange: #d9730d; --orange-soft: #fadec9; --neutral-soft: #f1f1ef;
    --sidebar: #f9f8f7; --sidebar-foreground: #5f5e59; --sidebar-icon: #8e8b86; --sidebar-accent: #eeedec; --sidebar-border: #f0efed;
    --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.05); --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --fg: var(--foreground); --fg4: #a4a19b; --danger: var(--destructive-strong); --text-3: var(--fg4);
  }
  * { box-sizing: border-box; border-color: var(--border); }
  html, body { height: 100%; }
  body { margin: 0; background: var(--background); color: var(--foreground); font: 400 14px/20px "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
  a { color: inherit; text-decoration: none; }
  .num { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: none; box-shadow: 0 0 0 3px rgb(35 131 226 / 0.5); border-radius: 6px; }
  svg.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: transparent; border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
  :hover::-webkit-scrollbar-thumb { background-color: rgb(44 44 43 / 0.16); }

  /* ── 창 틀: 제목 줄(탭) + 사이드바 + 본문 ── */
  .shell { display: flex; flex-direction: column; height: 100vh; }
  .titlebar { display: flex; align-items: center; height: 36px; flex: none; padding-right: 8px; background: var(--sidebar); border-bottom: 1px solid var(--border); }
  .tb-brand { display: flex; align-items: center; gap: 4px; width: 256px; height: 100%; padding-left: 16px; flex: none; }
  .tb-brand b { margin-right: 8px; font-size: 14px; font-weight: 600; letter-spacing: -0.02em; color: var(--sidebar-foreground); }
  .tb-brand .sp { flex: 1; }
  .tb-brand .sep { align-self: stretch; width: 1px; margin-left: 4px; background: var(--border); }
  .tb-ic { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--sidebar-icon); transition: background-color 100ms, color 100ms; }
  .tb-ic:hover { background: var(--sidebar-accent); color: var(--foreground); }
  .tb-nav { display: flex; align-items: center; gap: 4px; padding: 0 8px; flex: none; }
  .tb-nav .tb-ic { width: 24px; height: 24px; }
  .tb-nav .tb-ic svg { width: 20px; height: 20px; stroke-width: 1.5; }
  .tb-nav .tb-ic:disabled { opacity: 0.35; cursor: default; background: none; }
  .tabstrip { display: flex; align-items: flex-end; align-self: flex-start; height: 37px; min-width: 0; flex: 1; }
  .app-tab { position: relative; display: flex; align-items: center; gap: 8px; width: 188px; min-width: 96px; height: 36px; padding: 0 10px 0 12px; background: var(--sidebar); color: var(--muted-foreground); border-right: 1px solid var(--border); font-size: 13px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; transition: background-color 100ms; }
  .app-tab:hover { background: var(--sidebar-accent); }
  .app-tab.on { background: var(--background); color: var(--foreground); height: 37px; border-left: 1px solid var(--border); margin-left: -1px; }
  .app-tab svg { opacity: 0.75; }
  .app-tab.on svg { opacity: 1; }
  .app-tab span { overflow: hidden; text-overflow: ellipsis; }
  .tabstrip .tb-ic { width: 24px; height: 24px; margin: 0 6px 6px; }
  .tabstrip .tb-ic svg { width: 20px; height: 20px; stroke-width: 1.5; }
  .frame { flex: 1; min-height: 0; display: flex; }
  .side { display: flex; flex-direction: column; width: 256px; flex: none; background: var(--sidebar); color: var(--sidebar-foreground); border-right: 1px solid var(--sidebar-border); }
  .side .scroll { flex: 1; min-height: 0; overflow: auto; padding: 4px 0; }
  .side .group { padding: 4px 8px; }
  .side .label { display: flex; align-items: center; height: 28px; padding: 0 8px; font-size: 12px; font-weight: 500; color: rgb(95 94 89 / 0.7); }
  .side a { display: flex; align-items: center; gap: 8px; height: 32px; padding: 8px; border-radius: 6px; font-size: 14px; }
  .side a svg { color: var(--sidebar-icon); }
  .side a:hover { background: var(--sidebar-accent); color: var(--foreground); }
  .side a.on { background: var(--sidebar-accent); color: var(--foreground); font-weight: 500; }
  .side a.on svg { color: var(--foreground); }
  .side a .chev { margin-left: auto; width: 14px; height: 14px; color: var(--sidebar-icon); }
  .side .foot { padding: 8px; flex: none; }
  .nav-user { display: flex; align-items: center; gap: 8px; width: 100%; height: 48px; padding: 8px; border-radius: 6px; text-align: left; }
  .nav-user:hover { background: var(--sidebar-accent); }
  .nav-user .av { width: 32px; height: 32px; border-radius: 8px; background: var(--secondary); display: grid; place-items: center; font-size: 13px; font-weight: 500; color: var(--foreground); flex: none; }
  .nav-user .nm { min-width: 0; flex: 1; line-height: 1.25; }
  .nav-user .nm b { display: block; font-weight: 500; color: var(--foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-user .nm small { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 본문: 앱과 같이 흰 바탕(bg-background p-4) */
  .body { flex: 1; min-width: 0; min-height: 0; overflow: auto; padding: 16px; background: var(--background); }
  .page { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 1280px; padding: 0 4px; }

  /* ── 인사 (현재 Briefing과 같은 글자) ── */
  .hero { display: flex; align-items: flex-end; gap: 8px; }
  .hero .date { margin: 0; font-size: 12.5px; line-height: 20px; font-weight: 500; color: var(--muted-foreground); }
  .hero h1 { margin: 2px 0 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em; }
  .hero .sum { margin: 4px 0 0; min-height: 24px; font-size: 14px; line-height: 24px; color: var(--muted-foreground); }
  .hero .sum b { font-weight: 600; color: var(--foreground); }
  .hero .sum b.bad { color: var(--destructive-strong); }
  .hero .tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  /* ── 단추 (button.tsx) ── */
  .btn { display: inline-flex; flex: none; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 6px; font-size: 14px; font-weight: 500; white-space: nowrap; background: var(--primary); color: #fff; transition: color 160ms, background-color 160ms, box-shadow 160ms, transform 160ms; }
  .btn:hover { background: rgb(44 44 43 / 0.9); }
  .btn:active { transform: scale(0.98); }
  .btn.sm { height: 32px; padding: 0 12px; gap: 6px; }
  .btn.sm:has(> svg) { padding: 0 10px; }
  .btn.xs { height: 24px; padding: 0 8px; gap: 4px; font-size: 12px; }
  .btn.outline { border: 1px solid var(--border); background: var(--background); color: var(--foreground); box-shadow: var(--shadow-xs); }
  .btn.outline:hover { background: var(--accent); }
  .btn.ghost { background: none; color: var(--foreground); }
  .btn.ghost:hover { background: var(--accent); }
  .btn.icon-sm { width: 32px; height: 32px; padding: 0; position: relative; }
  .btn.icon-xs { width: 24px; height: 24px; padding: 0; }
  .btn.xs svg, .btn.icon-xs svg { width: 12px; height: 12px; }
  .btn .dotbadge { position: absolute; right: -5px; top: -5px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9999px; background: var(--destructive); color: #fff; font-size: 10px; line-height: 16px; font-weight: 600; text-align: center; box-shadow: 0 0 0 2px var(--background); }
  .ib { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--border); background: var(--background); box-shadow: var(--shadow-xs); color: var(--muted-foreground-strong); transition: background-color 160ms, transform 160ms; }
  .ib:hover { background: var(--accent); color: var(--foreground); }
  .ib:active { transform: scale(0.98); }
  .ib svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  kbd { font: 500 11px/1 ui-monospace, "SF Mono", Menlo, monospace; padding: 3px 5px; border-radius: 4px; background: var(--secondary); color: var(--muted-foreground); }

  /* ── 탭 (tabs.tsx) ── */
  .seg, .tabs { display: inline-flex; align-items: center; height: 32px; padding: 3px; border-radius: 8px; background: var(--secondary); color: var(--muted-foreground); flex: none; }
  .tabs { height: 28px; }
  .seg button, .tab { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 100%; padding: 0 10px; border-radius: 6px; border: 1px solid transparent; font-size: 14px; font-weight: 500; white-space: nowrap; color: rgb(44 44 43 / 0.6); transition: color 150ms, background-color 150ms, box-shadow 150ms; }
  .tab { padding: 0 8px; font-size: 12px; }
  .seg button:hover, .tab:hover { color: var(--foreground); }
  .seg button.on, .tab.on { background: var(--background); color: var(--foreground); box-shadow: var(--shadow-sm); }
  .tab i { font-style: normal; font-weight: 400; color: var(--muted-foreground); }
  .tab.bad i { color: var(--destructive-strong); font-weight: 500; }

  /* ── 배지 (badge.tsx secondary, status-badge.tsx) ── */
  .cnt { display: inline-flex; align-items: center; justify-content: center; padding: 2px 8px; border-radius: 9999px; background: var(--secondary); font-size: 12px; line-height: 16px; font-weight: 500; color: var(--foreground); flex: none; }
  .cnt.hot { background: var(--destructive-soft); color: var(--destructive); }
  .sb { display: inline-flex; align-items: center; width: fit-content; padding: 2px 8px; border-radius: 6px; font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; flex: none; background: var(--neutral-soft); color: var(--muted-foreground); }
  .sb.st2 { background: var(--violet-soft); color: var(--violet); }
  .sb.st3 { background: var(--info-soft); color: var(--info); }
  .sb.st4 { background: var(--orange-soft); color: var(--orange); }
  .sb.pin { background: var(--destructive-soft); color: var(--destructive); }
  .sb.t1 { background: var(--info-soft); color: var(--info); } .sb.t2 { background: var(--success-soft); color: var(--success); } .sb.t3 { background: var(--violet-soft); color: var(--violet); }
  .sb.xs { padding: 1px 6px; font-size: 11px; }

  /* ── 카드 (card.tsx: rounded-xl border shadow-sm) ── */
  .cards { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
  .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c6 { grid-column: span 6; }
  .tall { height: 396px; } .mid { height: 304px; }
  .card { display: flex; flex-direction: column; min-width: 0; background: var(--background); border: 1px solid var(--input); border-radius: 12px; box-shadow: var(--shadow-sm); }
  .ch { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 12px 8px 16px; flex: none; }
  .ch h2 { margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; letter-spacing: -0.015em; flex: none; white-space: nowrap; }
  .ch .sub { min-width: 0; font-size: 12px; line-height: 16px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch .act { margin-left: auto; display: flex; align-items: center; gap: 4px; flex: none; }
  /* 현재 대시보드의 MoreLink: text-xs muted, 화살표가 올리면 살짝 간다 */
  .lnk { display: inline-flex; align-items: center; gap: 4px; padding: 4px 4px; font-size: 12px; line-height: 16px; color: var(--muted-foreground); transition: color 150ms; }
  .lnk:hover { color: var(--foreground); }
  .lnk svg { width: 12px; height: 12px; transition: transform 150ms; }
  .lnk:hover svg { transform: translateX(2px); }
  .cbd { flex: 1; min-height: 0; overflow: auto; padding: 0 16px 12px; }
  .cbd.flush { padding-left: 8px; padding-right: 8px; }
  .tabrow { padding: 0 16px 8px; flex: none; }
  .cf { display: flex; align-items: center; gap: 2px; min-height: 40px; padding: 0 8px; border-top: 1px solid var(--border); flex: none; font-size: 12px; color: var(--muted-foreground); }
  .cf .sp { flex: 1; }
  .cue { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; transition: background-color 160ms, color 160ms; }
  .cue:hover, .cue.on { background: var(--accent); color: var(--foreground); }
  .cue b { font-weight: 600; color: var(--foreground); }
  .cue svg { width: 12px; height: 12px; }

  /* ── 항목 줄 ── */
  .r { position: relative; display: grid; grid-template-columns: 16px minmax(0, 1fr); column-gap: 8px; align-items: start; padding: 6px 8px; border-radius: 6px; outline: none; transition: background-color 100ms; }
  .r:hover, .r.sel { background: var(--muted); }
  .r.sel { background: var(--accent); }
  .r:focus-visible { box-shadow: inset 0 0 0 2px var(--ring); }
  .ki { width: 16px; height: 20px; display: grid; place-items: center; color: var(--sidebar-icon); }
  .ki svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .rt { display: flex; gap: 4px; min-width: 0; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; }
  .rt .site { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .rt .unit { flex: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .rt time { margin-left: 2px; font-size: 12px; font-weight: 400; color: var(--muted-foreground); }
  .r2 { display: flex; align-items: baseline; gap: 8px; }
  .r2 .rs { flex: 1; min-width: 0; }
  .rs { font-size: 12px; line-height: 16px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rl { margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--fg4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rd { display: flex; align-items: center; gap: 6px; flex: none; font-size: 12px; line-height: 16px; color: var(--muted-foreground); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rd.late { color: var(--destructive-strong); font-weight: 500; }
  .rd.today { color: var(--warning-strong); font-weight: 500; }
  .ra { position: absolute; right: 4px; top: 4px; display: flex; align-items: center; gap: 4px; padding: 2px 2px 2px 28px; background: linear-gradient(90deg, transparent, var(--accent) 24px); border-radius: 0 6px 6px 0; opacity: 0; pointer-events: none; }
  /* 단추는 제목 줄 높이 안에 들어간다. 둘째 줄의 날짜를 가리지 않게. */
  .ra .btn.xs, .ra .ib { height: 22px; }
  .ra .ib { width: 22px; }
  .r:hover .ra { background: linear-gradient(90deg, transparent, var(--muted) 24px); }
  .r.sel .ra { background: linear-gradient(90deg, transparent, var(--accent) 24px); }
  .r:hover .ra, .r.sel .ra, .r.menu-open .ra, .r:focus-within .ra { opacity: 1; pointer-events: auto; }
  .who { width: 20px; height: 20px; border-radius: 9999px; background: var(--secondary); color: var(--muted-foreground-strong); font-size: 11px; line-height: 1; font-weight: 500; display: inline-grid; place-items: center; flex: none; }
  .more { margin: 2px 8px; padding: 4px 0; font-size: 12px; color: var(--muted-foreground); }
  .more:hover { color: var(--foreground); text-decoration: underline; text-underline-offset: 4px; }
  .empty { padding: 20px 8px; text-align: center; font-size: 14px; color: var(--muted-foreground); }
  .filt { display: flex; align-items: center; gap: 8px; min-height: 32px; margin: 0 16px 6px; padding: 0 4px 0 10px; border-radius: 6px; background: var(--info-soft); font-size: 12px; font-weight: 500; color: #1b64b1; flex: none; }
  .filt .btn { margin-left: auto; color: #1b64b1; }

  /* ── 일정 (현재 TodayCard의 줄: 시간 44px, 점과 세로선, 제목과 보조) ── */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 0 12px 8px; flex: none; }
  .wd { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; border-radius: 6px; font-size: 12px; line-height: 16px; color: var(--muted-foreground); transition: background-color 150ms; }
  .wd:hover { background: var(--muted); }
  .wd.on { background: var(--accent); }
  .wd b { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9999px; font-size: 14px; font-weight: 500; color: var(--foreground); }
  .wd.now b { background: var(--primary); color: #fff; }
  .wd i { display: flex; gap: 2px; height: 4px; }
  .wd em { width: 4px; height: 4px; border-radius: 50%; background: var(--fg4); }
  .agenda { border-top: 1px solid var(--border); padding-top: 8px; }
  .ag { display: grid; grid-template-columns: 44px 14px minmax(0, 1fr); column-gap: 8px; align-items: start; min-height: 48px; padding-left: 8px; }
  .ag .tm { padding-top: 6px; font-size: 13px; line-height: 20px; font-weight: 600; }
  .ag .ln { position: relative; display: flex; justify-content: center; align-self: stretch; }
  .ag .ln::before { content: ""; position: relative; z-index: 1; margin-top: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 4px var(--background); }
  .ag .ln::after { content: ""; position: absolute; top: 20px; bottom: -12px; width: 1px; background: rgb(44 44 43 / 0.15); }
  .ag:last-child .ln::after { display: none; }
  .ag.fixed .ln::before { background: var(--fg4); }
  .ag.fixed .fx { padding: 6px 8px; min-width: 0; }
  .ag.fixed .rt { font-weight: 400; color: var(--muted-foreground-strong); }
  .nowrow { display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 8px; align-items: center; height: 16px; padding-left: 8px; }
  .nowrow span { font-size: 11px; line-height: 16px; font-weight: 600; color: var(--destructive); }
  .nowrow i { display: block; margin-right: 8px; border-top: 1px solid var(--destructive); opacity: 0.7; }

  /* ── 공지, 뉴스 ── */
  .nt, .nw { display: grid; grid-template-columns: 8px minmax(0, 1fr); column-gap: 8px; align-items: start; width: 100%; padding: 8px; border-radius: 6px; text-align: left; transition: background-color 100ms; }
  .nt:hover, .nw:hover { background: var(--muted); }

  // 다시 그리기 전에 포커스가 있던 곳을 적어 두었다가, 같은 것을 찾아 되돌린다. 없어졌으면 고른 줄로 간다.
  const FOCUS_KEYS = ['a', 'id', 'type', 'kind', 'off', 'key', 'scope', 'group', 'o', 'label'];
  function focusKey(scope) {

    // 고른 줄은 지금 화면에 그려진 줄이어야 한다 (탭이나 거름으로 가려졌으면 푼다).

    document.querySelectorAll('[data-group]').forEach((b) => { b.classList.toggle('on', b.dataset.group === ui.group); if (b.dataset.group === 'who') { b.disabled = ui.scope === 'mine'; b.title = ui.scope === 'mine' ? '사무소 전체에서 쓸 수 있습니다' : ''; } });

  function renderLayers(doneList = items.filter(isDoneInScope), fromRender = false) {

      (ui.bell ? `<div class="popbox bellbox" style="top:${ui.bell.top}px;right:${ui.bell.right}px" role="dialog" aria-label="새로 들어온 것"><header>새로 들어온 것<button class="btn ghost xs" data-a="bell">닫기</button></header><div class="list">${FEED.map(([t, k, title, sub, act]) => `<div class="fr"><span class="ki">${ICON[k]}</span><div style="min-width:0"><div class="rt"><span class="unit">${esc(title)}</span><time class="num">${t}</time></div><div class="rs">${esc(sub)}</div></div><button class="btn outline xs" data-a="feed" data-label="${esc(act)}" data-to="${KIND[k][1]}">${esc(act)}</button></div>`).join('')}</div></div>` : '') +
      (ui.notice ? (() => { const n = NOTICES.find((x) => x.id === ui.notice); return `<div class="veil" data-a="notice-close"><div class="dlg wide" role="dialog" aria-modal="true" aria-label="공지" data-stop><header><h3>${n.pin ? '<span class="sb pin xs">필독</span>' : ''}${esc(n.t)}</h3><p>${esc(n.by)} · ${esc(n.at)}</p></header><div class="in text">${esc(n.body)}</div><footer><button class="btn" data-a="notice-close">확인</button></footer></div></div>`; })() : '') +

  /* ── 누르기 ── */

  document.addEventListener('click', (e) => {
    if (e.target.closest('a[href="#"]')) e.preventDefault(); // 시안의 이동 링크는 주소를 바꾸지 않는다

      case 'more': ui.open.has(d.key) ? ui.open.delete(d.key) : ui.open.add(d.key); return render();
      case 'done': return complete(it);
      case 'menu': { if (ui.menu?.id === it.id) { ui.menu = null; return render(); } const r = b.getBoundingClientRect(); ui.sel = it.id; ui.menu = { id: it.id, x: Math.min(r.right - 188, innerWidth - 200), y: Math.min(r.bottom + 4, innerHeight - 110) }; render(); return document.querySelector('.menu button')?.focus(); }
      case 'snooze': return mutate(`${SNOOZE.find(([, o]) => o === +d.off)[0]}(으)로 미룸 · ${it.t}`, () => snoozeTo(it, +d.off));
      case 'bulk': { const late = items.filter((x) => onBoard(x) && x.off < 0); return mutate(`지난 일 ${late.length}건을 내일로 미뤘습니다`, () => late.forEach((x) => snoozeTo(x, 1))); }
      case 'act': if (it.call) { ui.sel = it.id; ui.call = { id: it.id, outcome: null, memo: '', err: '', asking: false }; render(); document.querySelector('.opt')?.focus(); } else toast(`${it.act} → ${KIND[it.kind][1]} 화면에서 엽니다`); return;
      case 'undo': if (ui.undo) { restore(ui.undo.snap); ui.undo = null; hideToast(); render(); } return;
      case 'donebox': ui.doneOpen = !ui.doneOpen; render(); return (ui.doneOpen ? document.querySelector('.donebox header button') : document.querySelector('.cf [data-a=donebox]'))?.focus();
      case 'reopen': return mutate(`다시 올림 · ${it.t}`, () => { delete it.done; });
      case 'call-opt': ui.call.outcome = d.o; ui.call.err = ''; ui.call.asking = false; return keepMemoFocus(() => renderLayers());
      case 'call-save': return saveCall();
      case 'call-close': return closeCall(false);
      case 'call-keep': ui.call.asking = false; renderLayers(); return document.getElementById('memo')?.focus();
      case 'call-drop': return closeCall(true);
    }
  });
  // 다시 그려도 메모 칸의 커서 자리를 잃지 않는다.
  function keepMemoFocus(fn) {
    const el = document.getElementById('memo'); const had = document.activeElement === el; const pos = el?.selectionStart;
    fn();
    if (had) { const n = document.getElementById('memo'); n.focus(); n.setSelectionRange(pos, pos); }
  }
  function complete(it) {
    if (!it || it.done) return;
    const el = document.querySelector(`.r[data-id="${it.id}"]`);
    const order = [...document.querySelectorAll('.r')].map((r) => r.dataset.id); const i = order.indexOf(it.id);
    if (ui.sel === it.id) ui.sel = order[i + 1] ?? order[i - 1] ?? null;
    mutate(`완료 · ${it.t}`, () => { it.done = true; });
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (ui.notice) return closeNotice();
      if (ui.call) return closeCall(false);
      if (ui.qc) { ui.qc = null; render(); return document.querySelector('[data-a=qc]')?.focus(); }
      if (ui.bell) { ui.bell = false; render(); return document.querySelector('.tools [data-a=bell]')?.focus(); }
      if (ui.menu) { const id = ui.menu.id; ui.menu = null; render(); return document.querySelector(`[data-a="menu"][data-id="${id}"]`)?.focus(); }
      if (ui.doneOpen) { ui.doneOpen = false; render(); return document.querySelector('.cf [data-a=donebox]')?.focus(); }
      return;
    }
    // 창이 떠 있으면 Tab이 창 밖으로 나가지 않는다.
    if ((ui.call || ui.notice) && e.key === 'Tab') {
      const f = [...document.querySelectorAll('.dlg button, .dlg textarea')]; const i = f.indexOf(document.activeElement);
      if (i === -1 || (e.shiftKey && i === 0) || (!e.shiftKey && i === f.length - 1)) { e.preventDefault(); f[e.shiftKey ? f.length - 1 : 0].focus(); }
      return;
    }
    // 미루기 메뉴: 위아래 화살표로 고르고, Tab을 누르면 닫고 원래 단추로 돌아간다.
    if (ui.menu || ui.qc) {
      const f = [...document.querySelectorAll('.menu button:not(:disabled)')]; const i = f.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); f[(i + (e.key === 'ArrowDown' ? 1 : f.length - 1) + (i === -1 && e.key === 'ArrowUp' ? 1 : 0)) % f.length]?.focus(); }
      else if (e.key === 'Tab') { e.preventDefault(); const back = ui.menu ? `[data-a="menu"][data-id="${ui.menu.id}"]` : '[data-a=qc]'; ui.menu = null; ui.qc = null; render(); document.querySelector(back)?.focus(); }
      return;
    }
    // 줄에 포커스를 두고 Enter를 누르면 주 행동이다.
    if (e.key === 'Enter' && e.target.classList?.contains('r')) { e.preventDefault(); return e.target.querySelector('[data-a=act]').click(); }
    if (ui.call || ui.notice || e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    const order = [...document.querySelectorAll('.r')].map((r) => r.dataset.id); if (!order.length) return;
    const i = order.indexOf(ui.sel); const k = e.key.toLowerCase();
    if (k === 'j' || e.key === 'ArrowDown') ui.sel = order[Math.min(i + 1, order.length - 1)];
    else if (k === 'k' || e.key === 'ArrowUp') ui.sel = order[Math.max(i - 1, 0)];
    else if (k === 'e' && ui.sel) return complete(items.find((x) => x.id === ui.sel));
    else if (k === 'h' && ui.sel) { const it = items.find((x) => x.id === ui.sel); if (it.off >= 1) return toast('이미 내일 이후입니다. 미루기 단추에서 날짜를 고르세요'); return mutate(`내일로 미룸 · ${it.t}`, () => snoozeTo(it, 1)); }
    else return;
    e.preventDefault(); ui.menu = null; render(false);
    const selEl = document.querySelector('.r.sel'); selEl?.focus({ preventScroll: true }); selEl?.scrollIntoView({ block: 'nearest' });
  });
  // Tab으로 줄에 들어오면 그 줄이 고른 줄이 된다 (다시 그리지 않고 표시만 옮긴다).
  document.addEventListener('focusin', (e) => {
    const r = e.target.closest?.('.r'); if (!r || ui.sel === r.dataset.id) return;
    ui.sel = r.dataset.id;
    document.querySelectorAll('.r.sel').forEach((x) => x.classList.remove('sel')); r.classList.add('sel');
  });
  window.addEventListener('resize', () => { if (ui.menu || ui.qc || ui.bell) { ui.menu = null; ui.qc = null; ui.bell = false; render(); } });
  document.addEventListener('scroll', (e) => { if (e.target.closest?.('.popbox')) return; if (ui.menu || ui.qc) { ui.menu = null; ui.qc = null; render(); } }, true);

  /* ── 틀 ── */
  // 메뉴 이름·순서·아이콘은 components/layout/nav-config.ts. 꺾쇠는 하위 메뉴가 있는 항목이다.
  const NAV = [['시작', [['대시보드', 'dash']]], ['매물·공간', [['매물관리', 'house'], ['관리단지', 'map'], ['광고관리', 'mega', 1]]], ['고객·상담', [['고객 원장', 'users'], ['연락처', 'book'], ['상담분석', 'msg']]], ['거래·계약', [['희망매물', 'usearch'], ['거래관리', 'shake'], ['계약서 관리', 'doc'], ['수수료/정산', 'wallet', 1]]], ['업무·운영', [['업무', 'todo'], ['캘린더', 'cal'], ['직원관리', 'users']]]];
  const TABS = [['대시보드', 'dash'], ['매물관리', 'house'], ['거래관리', 'shake']];
  // 제목 줄과 사이드바는 이 시안의 범위 밖이라 모양만 있다 (누를 수 없게 inert).
  document.body.insertAdjacentHTML('afterbegin', `<div class="shell">
    <header class="titlebar" inert>
      <div class="tb-brand"><b>Estaitt</b><span class="sp"></span><button class="tb-ic" aria-label="사이드바">${ic('panel')}</button><span class="sep"></span></div>
      <div class="tb-nav"><button class="tb-ic" disabled aria-label="뒤로">${ic('left')}</button><button class="tb-ic" disabled aria-label="앞으로">${ic('right')}</button></div>
      <div class="tabstrip">${TABS.map(([t, i], n) => `<div class="app-tab${n === 0 ? ' on' : ''}">${ic(i)}<span>${t}</span></div>`).join('')}<button class="tb-ic" aria-label="새 탭">${ic('plus')}</button></div>
    </header>
    <div class="frame">
      <nav class="side" inert><div class="scroll">${NAV.map(([g, links]) => `<div class="group"><div class="label">${g}</div>${links.map(([l, i, sub]) => `<a href="#" class="${l === '대시보드' ? 'on' : ''}">${ic(i)}<span>${l}</span>${sub ? `<svg class="ic chev" viewBox="0 0 24 24">${LU.go}</svg>` : ''}</a>`).join('')}</div>`).join('')}</div>
        <div class="foot"><button class="nav-user"><span class="av">김</span><span class="nm"><b>김서연</b><small>seoyeon@example.com</small></span>${ic('updown')}</button></div></nav>
      <main class="body"><div class="page" id="body"></div></main>
    </div></div><div id="layers"></div>`);
  document.body.classList.add('first'); setTimeout(() => document.body.classList.remove('first'), 700);
  render();
})();
</script>
</body>
</html>
