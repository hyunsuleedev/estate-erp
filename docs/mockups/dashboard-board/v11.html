<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대시보드 11판 · 귀여움을 올린 인사 줄</title>
<link rel="icon" href="data:,">
<style>
  /*
   * 10판 — 실제 앱 화면(2026-11-18 캡처)에서 출발한다.
   * 1) 카드: Notion 문법으로 가볍게. 가는 테두리와 아주 옅은 그림자, 머리에 회색 아이콘 + 제목 + 회색 건수,
   *    보기 탭은 둥근 알약(고른 것만 옅은 바탕), 할 일은 네모 체크 상자, 거래는 세로선이 있는 표, 꼬리표는 모서리 4px.
   *    준비 중 카드는 점선 테두리로 물러나 있다.
   * 2) 인사 줄: 점 격자가 깔린 '오늘의 보드'. 오른쪽에 가는 선으로 그린 단지가 있고, 땅이 곧 오늘의 시간 축이다.
   *    해(밤에는 달)가 지금 시각 위에 떠 있고, 오늘 일정이 시간 축에 점으로 찍힌다. 장식이 아니라 오늘이 보이는 그림이다.
   *    움직임은 처음 한 번 그려지는 것과, 아주 느린 구름·해의 숨쉬기뿐이다. 색은 먹색과 주황 하나.
   * 색은 app.css 토큰 값 그대로.
   *
   * 11판 — 10판에서 귀여움의 수위를 올렸다. 선 그림과 두 색(먹·주황)은 그대로 두고 등장인물을 넣었다:
   * 웃는 해(가끔 눈을 깜빡인다)와 자는 달, 지붕 위 고양이, 지나가는 새와 서류 가방을 든 사람, 굴뚝 연기, 흔들리는 나무, 일정 자리에 꽂힌 깃발.
   * 업무를 완료하면 해가 폴짝 뛰고 숫자 옆에 반짝이가 튄다. 해를 눌러도 뛴다.
   */
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");
  :root {
    --bg: #ffffff; --fg: #2c2c2b; --fg2: #5f5e59; --fg3: #79766f; --fg4: #a4a19b; --icon: #8e8b86;
    --muted: #f9f8f7; --line: rgba(42, 28, 0, 0.08); --line2: #e6e5e3; --hover: rgba(33, 27, 23, 0.045); --sel: rgba(33, 27, 23, 0.07);
    --blue: #2383e2; --red: #bb3430; --red-strong: #e03e3e; --amber: #8a5a13; --accent: #d9730d; --accent-soft: #fadec9;
    --card: 0 0 0 1px var(--line), 0 1px 2px rgba(42, 28, 0, 0.04);
    --card-hover: 0 0 0 1px rgba(42, 28, 0, 0.13), 0 6px 16px -8px rgba(42, 28, 0, 0.16);
    --pop: 0 0 0 1px rgba(15, 15, 15, 0.05), 0 3px 6px rgba(15, 15, 15, 0.1), 0 9px 24px rgba(15, 15, 15, 0.2);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/20px "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
  svg.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ── 창 틀 (모양만) ── */
  .win { display: flex; flex-direction: column; height: 100vh; }
  .titlebar { display: flex; align-items: center; height: 36px; flex: none; background: var(--muted); border-bottom: 1px solid #f0efed; color: var(--fg2); }
  .titlebar b { width: 216px; padding-left: 16px; font-size: 14px; font-weight: 600; letter-spacing: -0.02em; }
  .titlebar .t-ic { display: grid; place-items: center; width: 28px; height: 28px; color: var(--icon); }
  .titlebar .tab { display: flex; align-items: center; gap: 8px; width: 190px; height: 37px; margin: 0 0 -1px 12px; padding: 0 12px; background: var(--bg); border: 1px solid #f0efed; border-bottom: 0; font-size: 13px; font-weight: 500; color: var(--fg); }
  .scroll { flex: 1; min-height: 0; overflow: auto; padding: 16px 20px 20px; }
  .page { display: flex; flex-direction: column; gap: 16px; max-width: 1280px; min-height: 100%; }

  /* ── 인사 줄: 오늘의 보드 ── */
  .hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 16px; min-height: 176px; padding: 18px 20px 16px 22px; border-radius: 14px; background: var(--muted); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; flex: none; }
  /* 점 격자: 왼쪽 글자 쪽으로 갈수록 옅어진다 */
  .hero::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(44, 44, 43, 0.16) 1px, transparent 1.2px); background-size: 14px 14px; -webkit-mask-image: linear-gradient(100deg, transparent 30%, #000 78%); mask-image: linear-gradient(100deg, transparent 30%, #000 78%); pointer-events: none; }
  .hero > * { position: relative; }
  .hero .date { margin: 0; font-size: 12px; line-height: 18px; font-weight: 500; color: var(--fg3); }
  .hero h1 { margin: 2px 0 12px; font-size: 26px; line-height: 34px; font-weight: 600; letter-spacing: -0.02em; }
  .hero h1 .w { display: inline-block; }
  .pins { display: flex; flex-wrap: wrap; gap: 6px; }
  .pin { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px 0 9px; border-radius: 15px; background: var(--bg); box-shadow: var(--card); font-size: 13px; color: var(--fg2); white-space: nowrap; transition: box-shadow 200ms ease, transform 200ms var(--ease-out); }
  .pin b { font-weight: 600; color: var(--fg); }
  .pin.bad b { color: var(--red); }
  .pin svg { width: 15px; height: 15px; fill: none; stroke: var(--icon); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
  .pin:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) { .pin:hover { box-shadow: var(--card-hover); transform: translateY(-1px); } .pin:hover svg { stroke: var(--fg); } }
  .hero .tools { position: absolute; right: 16px; top: 14px; display: flex; align-items: center; gap: 8px; z-index: 2; }
  .scene { width: 372px; height: 118px; margin: 0 -6px -10px 0; align-self: end; overflow: visible; }
  .scene .ink { fill: none; stroke: var(--fg); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.5; }
  .scene .wn { fill: var(--fg); opacity: 0.16; }
  .scene .wn.lit { fill: var(--accent); opacity: 0.85; }
  .scene .tick { stroke: var(--fg); stroke-width: 1; opacity: 0.3; }
  .scene text { font: 500 9px/1 "Pretendard Variable", sans-serif; fill: var(--fg4); font-variant-numeric: tabular-nums; }
  .scene .ev { fill: var(--accent); stroke: var(--muted); stroke-width: 2; }
  .scene .nowline { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 2 3; opacity: 0.7; }
  .scene .nowtxt { fill: var(--accent); font-weight: 600; }
  .scene .sunc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.3; }
  .scene .moonc { fill: var(--muted); stroke: var(--fg); stroke-width: 1.2; opacity: 0.7; }
  .scene .star { fill: var(--fg); opacity: 0.5; }
  .scene .cloud { fill: var(--muted); stroke: var(--fg); stroke-width: 1.1; stroke-linejoin: round; opacity: 0.45; }

  /* 움직임 ① 처음 한 번: 글자가 올라오고, 선이 그려지고, 창과 일정 점이 차례로 찍힌다 */
  @keyframes up { from { opacity: 0; transform: translateY(8px); } }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(0.4); } }
  @keyframes fade { from { opacity: 0; } }
  .play .hero .date, .play .hero h1 .w, .play .pin, .play .hero .tools { animation: up 520ms var(--ease-out) both; animation-delay: calc(var(--d, 0) * 60ms); }
  .scene .draw { stroke-dasharray: 1; }
  .play .scene .draw { animation: draw 800ms var(--ease-out) both; animation-delay: calc(120ms + var(--d, 0) * 70ms); }
  .play .scene .wn, .play .scene .ev, .play .scene .star { transform-box: fill-box; transform-origin: center; animation: pop 320ms var(--ease-out) both; animation-delay: calc(620ms + var(--d, 0) * 22ms); }
  .play .scene text, .play .scene .tick, .play .scene .nowline, .play .scene .cloud { animation: fade 500ms ease both; animation-delay: 700ms; }
  /* 움직임 ② 계속: 해는 6초에 2px 오르내리고, 구름은 80초에 한 번 지나간다. 별은 드물게 깜빡인다. */
  @keyframes bob { 50% { transform: translateY(-2px); } }
  @keyframes drift { from { transform: translateX(-40px); } to { transform: translateX(380px); } }
  @keyframes twinkle { 0%, 88%, 100% { opacity: 0.5; } 94% { opacity: 0.1; } }
  .scene .bobber { animation: bob 6s ease-in-out infinite; }
  .scene .drifter { animation: drift 80s linear infinite; animation-delay: -22s; }
  .scene .drifter.b { animation-duration: 110s; animation-delay: -70s; }
  .scene .star { animation: twinkle 7s ease-in-out infinite; animation-delay: calc(var(--d, 0) * 900ms); }
  /* 움직임 ③ 올렸을 때: 알약의 아이콘이 한 번 까딱인다 */
  @keyframes tickmark { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes wiggle { 25% { transform: rotate(-12deg); } 60% { transform: rotate(9deg); } }
  @keyframes flip { 40% { transform: translateY(-2px); } }
  .pin svg .a-check { stroke-dasharray: 1; }
  .play .pin svg .a-check { animation: tickmark 420ms var(--ease-out) 900ms both; }
  @media (hover: hover) and (pointer: fine) {
    .pin:hover svg .a-check { animation: tickmark 420ms var(--ease-out) both; }
    .pin:hover svg.a-wiggle { transform-origin: 50% 20%; animation: wiggle 420ms ease-out; }
    .pin:hover svg .a-flip { animation: flip 360ms ease-out; }
  }

  /* 11판: 등장인물과 반응 */
  :root { --spring: cubic-bezier(0.34, 1.56, 0.64, 1); }
  .scene .face { fill: var(--accent); stroke: none; }
  .scene .smile { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-linecap: round; }
  .scene .cheek { fill: #f3b48a; opacity: 0.7; }
  .scene .ray { stroke: var(--accent); stroke-width: 1.3; stroke-linecap: round; opacity: 0.75; }
  .scene .skin { fill: var(--muted); stroke: var(--fg); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.75; }
  .scene .dot { fill: var(--fg); opacity: 0.75; }
  .scene .zz { fill: var(--fg3); font-weight: 600; font-size: 8px; }
  .scene .flag { fill: var(--accent); }
  .scene .pole { stroke: var(--accent); stroke-width: 1.3; stroke-linecap: round; }
  .scene .puff { fill: none; stroke: var(--fg); stroke-width: 1; opacity: 0; }
  .scene .lampglow { fill: var(--accent); opacity: 0.22; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
  @keyframes wag { 0%, 60%, 100% { transform: rotate(0); } 70% { transform: rotate(16deg); } 85% { transform: rotate(-8deg); } }
  @keyframes sway { 50% { transform: rotate(2.4deg); } }
  @keyframes flap { 50% { transform: scaleY(0.35); } }
  @keyframes fly { from { transform: translate(-30px, 0); } 50% { transform: translate(190px, -10px); } to { transform: translate(400px, 2px); } }
  @keyframes walk { from { transform: translateX(-16px); } to { transform: translateX(376px); } }
  @keyframes step { 50% { transform: rotate(var(--r)); } }
  @keyframes hopbody { 50% { transform: translateY(-1.2px); } }
  @keyframes puff { 0% { opacity: 0; transform: translate(0, 0) scale(0.5); } 25% { opacity: 0.45; } 100% { opacity: 0; transform: translate(5px, -18px) scale(1.5); } }
  @keyframes wave { 50% { transform: skewY(-10deg) scaleX(0.9); } }
  @keyframes zfloat { 0% { opacity: 0; transform: translate(0, 0); } 30% { opacity: 0.8; } 100% { opacity: 0; transform: translate(7px, -14px); } }
  @keyframes hop { 30% { transform: translateY(-9px) scale(1.08, 0.94); } 55% { transform: translateY(0) scale(0.94, 1.06); } 75% { transform: translateY(-3px); } }
  @keyframes sparkle { from { opacity: 1; transform: rotate(var(--a)) translateY(-4px) scaleY(1); } to { opacity: 0; transform: rotate(var(--a)) translateY(-15px) scaleY(0.3); } }
  @keyframes numpop { 40% { transform: scale(1.35); } }
  @keyframes dots { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-3px); opacity: 1; } }
  @keyframes floaty { 50% { transform: translateY(-3px); } }
  .scene .rays { animation: spin 26s linear infinite; }
  .scene .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.5s ease-in-out infinite; }
  .scene .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: wag 4.5s ease-in-out infinite; }
  .scene .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 5s ease-in-out infinite; }
  .scene .sway.b { animation-duration: 6.5s; animation-delay: -2s; }
  .scene .bird { animation: fly 24s linear infinite; animation-delay: -6s; }
  .scene .bird path { transform-box: fill-box; transform-origin: center; animation: flap 0.5s ease-in-out infinite; }
  .scene .walker { animation: walk 48s linear infinite; animation-delay: -14s; }
  .scene .walker .body { animation: hopbody 0.6s ease-in-out infinite; }
  .scene .walker .leg { transform-box: fill-box; transform-origin: 50% 0%; animation: step 0.6s ease-in-out infinite; }
  .scene .walker .leg.b { animation-delay: -0.3s; }
  .scene .puff { transform-box: fill-box; transform-origin: center; animation: puff 4.2s ease-out infinite; animation-delay: calc(var(--d) * 1.4s); }
  .scene .flagwave { transform-box: fill-box; transform-origin: 0% 50%; animation: wave 1.8s ease-in-out infinite; }
  .scene .zz { animation: zfloat 3.6s ease-out infinite; animation-delay: calc(var(--d) * 1.2s); }
  .scene .hopper { transform-box: fill-box; transform-origin: 50% 100%; }
  .scene .hopper.hop { animation: hop 620ms var(--spring); }
  .scene #sun { cursor: pointer; }
  .play .scene .cast { animation: fade 600ms ease both; animation-delay: 1100ms; }
  .pin { position: relative; }
  .pin b.pop { display: inline-block; animation: numpop 360ms var(--spring); }
  .spark { position: absolute; left: 50%; top: 50%; width: 2px; height: 7px; margin: -3px 0 0 -1px; border-radius: 1px; background: var(--accent); pointer-events: none; animation: sparkle 560ms var(--ease-out) both; }
  .chk { position: relative; }
  .chk .spark { height: 5px; background: var(--blue); }
  .soon-b svg { animation: floaty 3.6s ease-in-out infinite; }
  .soon-b b i { display: inline-block; font-style: normal; animation: dots 1.4s ease-in-out infinite; animation-delay: calc(var(--d) * 0.16s); }

  /* ── 단추, 탭 ── */
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 6px; font-weight: 500; white-space: nowrap; background: var(--fg); color: #fff; transition: background-color 160ms, transform 160ms var(--ease-out); }
  .btn:hover { background: #3f3f3d; }
  .btn:active { transform: scale(0.97); }
  .btn svg { width: 14px; height: 14px; }
  .seg { display: inline-flex; height: 32px; padding: 3px; border-radius: 8px; background: rgba(33, 27, 23, 0.06); }
  .seg button { height: 100%; padding: 0 10px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--fg3); transition: color 150ms, background-color 150ms, box-shadow 150ms; }
  .seg button:hover { color: var(--fg); }
  .seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(42, 28, 0, 0.08); }
  /* Notion 보기 탭: 둥근 끝, 고른 것만 옅은 바탕 */
  .views { display: inline-flex; gap: 2px; }
  .view { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 13px; font-size: 13px; font-weight: 500; color: var(--fg3); white-space: nowrap; transition: background-color 120ms, color 120ms, transform 160ms var(--ease-out); }
  .view:hover { background: var(--hover); }
  .view:active { transform: scale(0.97); }
  .view[aria-selected="true"] { background: var(--sel); color: var(--fg); }
  .view i { font-style: normal; font-weight: 400; color: var(--fg4); }
  .view.bad i { color: var(--red); font-weight: 500; }

  /* ── 카드 ── */
  /* 최소 높이를 숫자로 준다(280 + 14 + 212). 자동으로 두면 목록 길이만큼 늘어나 한 화면에 들어가지 않는다. */
  .cards { flex: 1 1 0; min-height: 506px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: minmax(280px, 1.25fr) minmax(212px, 1fr); gap: 14px; }
  .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c6 { grid-column: span 6; }
  .card { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); border-radius: 10px; box-shadow: var(--card); transition: box-shadow 220ms ease; }
  @media (hover: hover) and (pointer: fine) { .card:hover { box-shadow: var(--card-hover); } }
  .play .card { animation: up 520ms var(--ease-out) both; animation-delay: calc(260ms + var(--d, 0) * 60ms); }
  .ch { display: flex; align-items: center; gap: 7px; min-height: 44px; padding: 10px 10px 4px 14px; flex: none; }
  .ch > svg { color: var(--icon); }
  .ch h2 { margin: 0; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .ch .n { color: var(--fg4); }
  .ch .sub { min-width: 0; font-size: 12px; color: var(--fg4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch .act { margin-left: auto; display: flex; align-items: center; gap: 2px; flex: none; }
  .go { display: inline-flex; align-items: center; gap: 3px; height: 26px; padding: 0 7px; border-radius: 6px; font-size: 12px; color: var(--fg3); transition: background-color 120ms, color 120ms; }
  .go:hover { background: var(--hover); color: var(--fg); }
  .go svg { width: 12px; height: 12px; }
  .cb { flex: 1; min-height: 0; overflow: auto; padding: 2px 6px 8px; }
  .cf { display: flex; align-items: center; min-height: 36px; padding: 0 6px; border-top: 1px solid var(--line); flex: none; }
  .add { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 8px; border-radius: 6px; font-size: 13px; color: var(--fg4); transition: background-color 120ms, color 120ms; }
  .add:hover { background: var(--hover); color: var(--fg2); }
  .add svg { width: 14px; height: 14px; }
  .empty { padding: 22px 8px; text-align: center; font-size: 13px; color: var(--fg4); }
  /* 준비 중 카드: 점선으로 물러난다 */
  .card.soon { background: none; box-shadow: none; border: 1px dashed #dddbd7; }
  .card.soon:hover { box-shadow: none; }
  .card.soon .ch h2 { color: var(--fg3); }
  .soon-b { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0 20px 20px; text-align: center; }
  .soon-b svg { width: 36px; height: 36px; fill: none; stroke: var(--fg4); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
  .soon-b b { font-size: 13px; font-weight: 500; color: var(--fg3); }
  .soon-b span { font-size: 12px; line-height: 18px; color: var(--fg4); word-break: keep-all; }
  @media (hover: hover) and (pointer: fine) { .card.soon:hover .soon-b svg { transform-origin: 50% 80%; animation: wiggle 520ms ease-out; } }

  /* ── 일정 ── */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 2px 10px 8px; flex: none; }
  .wd { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 0 5px; border-radius: 8px; font-size: 12px; line-height: 16px; color: var(--fg4); transition: background-color 120ms, transform 160ms var(--ease-out); }
  .wd:hover { background: var(--hover); }
  .wd:active { transform: scale(0.96); }
  .wd[aria-pressed="true"] { background: var(--sel); }
  .wd b { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-size: 14px; font-weight: 500; color: var(--fg); }
  .wd.today b { background: var(--red-strong); color: #fff; }
  .wd i { display: flex; gap: 2px; height: 4px; }
  .wd em { width: 4px; height: 4px; border-radius: 50%; background: var(--fg4); }

  const I = {

  const inScope = (x) => ui.scope === 'all' || x.who === '나';

  const bucket = (t) => (t.off == null ? 'soon' : t.off < 0 ? 'late' : t.off === 0 ? 'today' : 'soon');
  const dueText = (t) => (t.off == null ? '기한 없음' : t.off < 0 ? `${-t.off}일 지남` : t.off === 0 ? '오늘' : t.off === 1 ? '내일' : `11.${DATES[TODAY] + t.off > 30 ? DATES[TODAY] + t.off - 30 : DATES[TODAY] + t.off} (${DAYS[(TODAY + t.off) % 7]})`);
  const hhmm = (h) => `${String(Math.floor(h)).padStart(2, '0')}:${String(Math.round((h % 1) * 60)).padStart(2, '0')}`;
  const greeting = (h) => (h < 5 ? '늦은 시간까지 수고 많으세요' : h < 12 ? '좋은 아침이에요' : h < 18 ? '좋은 오후예요' : '오늘도 수고 많으셨어요');

  /* ── 인사 줄의 그림: 땅이 오늘의 시간 축(06~20시)이고, 해가 지금 시각 위에 있다 ── */

  function scene(hour) {

    const B = [[40, 26, 36], [70, 22, 54], [98, 32, 28], [176, 34, 60], [214, 24, 38], [270, 30, 46], [304, 22, 30]];

    const cat = `<g class="cast" transform="translate(183 36)"><path class="skin tail" d="M10.5 -0.6c3.4 0.2 4.4 -3 2.6 -5.4"/><path class="skin" d="M0.5 0c-0.6 -4.6 1.6 -6.4 4.8 -6.4s5.4 1.8 4.8 6.4z"/><path class="skin" d="M1.9 -8.6l-0.5 -3.2 2.7 1.5M8.7 -8.6l0.5 -3.2 -2.7 1.5"/><circle class="skin" cx="5.3" cy="-8.4" r="3.5"/>${night ? '<path class="smile" style="stroke:var(--fg);opacity:.7" d="M3.4 -8.6q0.8 0.8 1.5 0M5.9 -8.6q0.8 0.8 1.5 0"/>' : '<g class="eyes"><circle class="dot" cx="4.1" cy="-8.7" r="0.6"/><circle class="dot" cx="6.6" cy="-8.7" r="0.6"/></g>'}</g>`;

    const smoke = `<g class="cast"><path class="ink" d="M84 42v-5h4v5"/>${[0, 1, 2].map((i) => `<circle class="puff" style="--d:${i}" cx="86" cy="33" r="2.4"/>`).join('')}</g>`;

    const pins = todays.map((e, i) => { const [h, m] = e.time.split(':').map(Number), x = xAt(h + m / 60).toFixed(1);

    const sy = Math.max(sy0, 22); // 햇살이 그림 위로 잘리지 않게
    const sky = night
      ? `<g id="sun" data-x="${sx}" data-y="${sy}"><g class="hopper"><g class="bobber"><path class="moonc" d="M4 -7a8 8 0 1 0 5 13a6.5 6.5 0 0 1 -5 -13z"/><path class="smile" style="stroke:var(--fg);opacity:.6" d="M-3 -1q1.3 1.3 2.6 0M-2.2 3q1.2 1 2.4 0"/></g></g>${[0, 1, 2].map((i) => `<text class="zz" style="--d:${i}" x="${9 + i * 3}" y="${-6 - i * 2}">z</text>`).join('')}</g>${[[60, 20], [118, 8], [150, 30], [300, 16], [330, 38]].map(([x, y], i) => `<circle class="star" style="--d:${i}" cx="${x}" cy="${y}" r="1.1"/>`).join('')}`
      : `<path class="nowline" d="M${sx.toFixed(1)} ${(sy + 17).toFixed(1)}V${GY}"/><text class="nowtxt" x="${sx.toFixed(1)}" y="${GY + 14}" text-anchor="middle">${hhmm(hour)}</text><g id="sun" data-x="${sx}" data-y="${sy}"><title>안녕하세요!</title><g class="hopper"><g class="bobber"><g class="rays">${Array.from({ length: 8 }, (_, i) => `<path class="ray" transform="rotate(${i * 45})" d="M0 -11.5v-3"/>`).join('')}</g><circle class="sunc" r="8.2"/><g class="eyes"><circle class="face" cx="-2.8" cy="-1.2" r="1"/><circle class="face" cx="2.8" cy="-1.2" r="1"/></g><circle class="cheek" cx="-4.6" cy="1.6" r="1.2"/><circle class="cheek" cx="4.6" cy="1.6" r="1.2"/><path class="smile" d="M-2.4 2q2.4 2.4 4.8 0"/></g></g></g>`;
    const cloud = (y, cls) => `<g class="drifter ${cls}"><path class="cloud" transform="translate(0 ${y})" d="M0 9a5 5 0 0 1 5-5 7 7 0 0 1 13 1 4.5 4.5 0 0 1 2 8.6H3A4.6 4.6 0 0 1 0 9z"/></g>`;
    return `<svg class="scene" viewBox="0 0 360 118" role="img" aria-label="오늘의 시간 축. 지금 ${hhmm(hour)}, 오늘 일정 ${todays.length}건${todays.map((e) => ` ${e.time} ${e.t}`).join(',')}">
      ${cloud(14, '')}${cloud(34, 'b')}
      ${sky}
      ${blocks}${tree(146)}${tree(252, 'b')}${smoke}${cat}${night ? lamp : bird + walker}
      <path class="ink draw" pathLength="1" style="--d:0;opacity:.7" d="M${X0 - 12} ${GY}H${X0 + XW + 12}"/>
      ${ticks}${pins}</svg>`;
  }
  // 해는 지평선에서 떠올라 지금 자리까지 간다 (처음 한 번). 밤에는 달이 제자리에서 나타난다.
  function launchSun(animate) {
    const sun = document.getElementById('sun'); if (!sun) return;
    const x = +sun.dataset.x, y = +sun.dataset.y, t1 = (x - X0) / XW;
    sun.setAttribute('transform', `translate(${x} ${y})`);
    if (!animate || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const night = ui.hour < 6 || ui.hour >= 20;
    const frames = night ? [{ opacity: 0, transform: `translate(${x}px, ${y + 10}px)` }, { opacity: 1, transform: `translate(${x}px, ${y}px)` }]
      : Array.from({ length: 13 }, (_, i) => { const [ax, ay] = arc((t1 * i) / 12); return { transform: `translate(${ax}px, ${i === 12 ? y : Math.max(ay, Math.min(y, 22))}px)`, opacity: i === 0 ? 0 : 1 }; });
    sun.removeAttribute('transform');
    sun.animate(frames, { duration: night ? 700 : 1500, delay: 350, easing: 'cubic-bezier(0.23, 1, 0.32, 1)', fill: 'both' });
  }

  function renderHero(animate) {
    const o = open(), late = o.filter((t) => bucket(t) === 'late').length, ev = events.filter((e) => e.day === TODAY && inScope(e)).length;
    const words = `${greeting(ui.hour)}, ${ME}님`.split(' ');
    document.getElementById('hero').innerHTML = `
      <div>
        <p class="date" style="--d:0">11월 18일 수요일 · ${OFFICE}</p>
        <h1>${words.map((w, i) => `<span class="w" style="--d:${1 + i}">${esc(w)}</span>`).join(' ')}</h1>
        <div class="pins">
          <button class="pin" style="--d:5" data-a="jump" data-to="sched">${ic('cal')}오늘 일정 <b class="num" data-count="${ev}">${ev}</b></button>
          <button class="pin" style="--d:6" data-a="tab" data-key="today">${ic('todo')}남은 업무 <b class="num" data-count="${o.length}" id="pin-open">${o.length}</b></button>
          <button class="pin${late ? ' bad' : ''}" style="--d:7" data-a="tab" data-key="late"><svg class="ic a-wiggle" viewBox="0 0 24 24" aria-hidden="true">${I.alarm}</svg>기한 지남 <b class="num" data-count="${late}" id="pin-late">${late}</b></button>
        </div>
      </div>
      ${scene(ui.hour)}
      <div class="tools" style="--d:3">
        <div class="seg" role="group" aria-label="표시 범위"><button data-a="scope" data-key="mine" aria-pressed="${ui.scope === 'mine'}">내 담당</button><button data-a="scope" data-key="all" aria-pressed="${ui.scope === 'all'}">사무소 전체</button></div>
        <button class="btn" data-a="say" data-msg="빠른 등록 메뉴를 엽니다">${ic('plus')}빠른 등록</button>
      </div>`;
    launchSun(animate);
    if (animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.querySelectorAll('#hero [data-count]').forEach(countUp);
  }
  // 숫자는 0에서 세어 올라간다 (처음 한 번, 0.7초)
  function countUp(el) {
    const to = +el.dataset.count, t0 = performance.now() + 500;
    el.textContent = '0';
    const step = (now) => { const p = Math.min(Math.max((now - t0) / 700, 0), 1); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  // 할 일을 처리했을 때는 그림을 다시 재생하지 않고 숫자만 바꾼다.
  function syncPins() {
    const o = open(), late = o.filter((t) => bucket(t) === 'late').length;
    document.getElementById('pin-open').textContent = o.length; const l = document.getElementById('pin-late'); l.textContent = late; l.closest('.pin').classList.toggle('bad', late > 0);
  }

  /* ── 카드 ── */
  function schedCard() {
    const list = events.filter((e) => e.day === ui.day && inScope(e)).sort((a, b) => a.time.localeCompare(b.time));
    const now = hhmm(ui.hour); let put = ui.day !== TODAY;
    const nowRow = `<div class="nowrow" aria-hidden="true"><span class="num">${now}</span><i></i></div>`;
    const rows = list.map((e, i) => { let pre = ''; if (!put && e.time > now) { pre = nowRow; put = true; }
      return `${pre}<div class="ag${i === list.length - 1 ? ' last' : ''}"><span class="tm num">${e.time}</span><span class="ln" style="--c:${e.c ?? ''}"></span><div class="tx"><div class="t1">${esc(e.t)}</div><div class="t2">${esc(e.m)}${ui.scope === 'all' ? ' · ' + esc(e.who) : ''}</div></div></div>`; }).join('') + (put ? '' : nowRow);
    return `<section class="card c4" style="--d:0" id="sched">
      <div class="ch">${ic('cal')}<h2>${ui.scope === 'mine' ? '내 일정' : '사무소 일정'}</h2><span class="sub num">11.${DATES[ui.day]} (${DAYS[ui.day]})${ui.day === TODAY ? ' · 오늘' : ''}</span><span class="act"><button class="go" data-a="say" data-msg="캘린더 화면으로 갑니다">캘린더${ic('arrow')}</button></span></div>
      <div class="week" role="group" aria-label="이번 주">${DAYS.map((dn, i) => { const n = events.filter((e) => e.day === i && inScope(e)).length;
        return `<button class="wd${i === TODAY ? ' today' : ''}" data-a="day" data-key="${i}" aria-pressed="${i === ui.day}" aria-label="11월 ${DATES[i]}일 ${dn}요일, 일정 ${n}건"><span>${dn}</span><b class="num">${DATES[i]}</b><i>${'<em></em>'.repeat(Math.min(n, 4))}</i></button>`; }).join('')}</div>
      <div class="cb agenda">${list.length ? rows : `<div class="empty">${ui.day === TODAY ? '오늘' : '이 날'} 잡힌 일정이 없습니다.</div>`}</div>
      <div class="cf"><button class="add" data-a="say" data-msg="일정 추가 창을 엽니다">${ic('plus')}일정 추가</button></div></section>`;
  }
  function taskCard() {
    // 방금 체크한 줄은 되돌릴 수 있는 동안 흐리게 남아 있다가, 알림이 사라질 때 목록에서 빠진다.
    const all = tasks.filter((t) => inScope(t) && (!ui.done.has(t.id) || ui.undo?.id === t.id));
    const g = { late: [], today: [], soon: [] }; all.forEach((t) => g[bucket(t)].push(t));
    const live = (k) => g[k].filter((t) => !ui.done.has(t.id)).length;
    const tab = ui.tab ?? (live('late') ? 'late' : 'today');
    const empty = { late: '기한이 지난 업무가 없습니다.', today: '오늘 안에 할 업무가 없습니다.', soon: '다가오는 업무가 없습니다.' }[tab];
    return `<section class="card c4" style="--d:1" id="todo">
      <div class="ch">${ic('todo')}<h2>할 일</h2><span class="n num">${open().length}</span><span class="act"><span class="views" role="tablist" aria-label="할 일 구분">${[['late', '지남'], ['today', '오늘'], ['soon', '다가옴']].map(([k, l]) => `<button class="view${k === 'late' && live(k) ? ' bad' : ''}" role="tab" aria-selected="${tab === k}" data-a="tab" data-key="${k}">${l}<i class="num">${live(k)}</i></button>`).join('')}</span></span></div>
      <div class="cb" role="tabpanel">${g[tab].map((t) => { const done = ui.done.has(t.id);
        return `<div class="task${done ? ' done' : ''}"><button class="chk" role="checkbox" aria-checked="${done}" aria-label="${esc(t.t)} ${done ? '완료 취소' : '완료 처리'}" data-a="check" data-key="${t.id}"><svg viewBox="0 0 12 12"><path pathLength="1" d="M2.5 6.4l2.4 2.4 4.6-5.3"/></svg></button><div style="min-width:0"><div class="t1">${esc(t.t)}</div><div class="t2">${esc(t.m)}${ui.scope === 'all' ? ' · ' + esc(t.who) : ''}</div></div><span class="due ${bucket(t) === 'soon' ? '' : bucket(t)}">${dueText(t)}</span></div>`; }).join('') || `<div class="empty">${empty}</div>`}</div>
      <div class="cf"><button class="add" data-a="say" data-msg="업무 추가 창을 엽니다">${ic('plus')}업무 추가</button><span style="flex:1"></span><button class="go" data-a="say" data-msg="업무 화면으로 갑니다">업무 화면으로${ic('arrow')}</button></div></section>`;
  }
  const soonCard = (cls, d, icon, title, desc) => `<section class="card soon ${cls}" style="--d:${d}"><div class="ch"><h2>${title}</h2></div><div class="soon-b"><svg viewBox="0 0 24 24" aria-hidden="true">${I[icon]}</svg><b>준비 중이에요<i style="--d:0">.</i><i style="--d:1">.</i><i style="--d:2">.</i></b><span>${desc}</span></div></section>`;
  function dealsCard() {
    return `<section class="card c6" style="--d:3">
      <div class="ch">${ic('deal')}<h2>진행 거래</h2><span class="n num">${deals.length}</span><span class="act"><button class="go" data-a="say" data-msg="거래관리 화면으로 갑니다">거래관리${ic('arrow')}</button></span></div>
      <div class="cb" style="padding:0 0 8px"><div class="tbl" role="table" aria-label="진행 거래">
        <div role="row"><span class="th" role="columnheader">${ic('aa')}거래</span><span class="th" role="columnheader">${ic('tagi')}단계</span><span class="th" role="columnheader">${ic('cal')}다음 일정</span></div>
        ${deals.map((x) => `<div class="row" role="row" tabindex="0" data-a="say" data-msg="${esc(x.t)} 거래를 엽니다"><span class="td" role="cell"><span style="min-width:0"><div class="t1">${esc(x.t)}</div><div class="t2 num">${esc(x.a)}</div></span></span><span class="td" role="cell"><span class="tag s${x.st}">${x.stl}</span></span><span class="td" role="cell"><span class="nx num ${x.cls ?? ''}">${esc(x.nx)}${x.d ? `<b>${x.d}</b>` : ''}</span></span></div>`).join('')}
      </div></div></section>`;
  }
  function renderCards() {
    const el = document.activeElement, key = el?.dataset?.a ? `[data-a="${el.dataset.a}"]${el.dataset.key != null ? `[data-key="${el.dataset.key}"]` : ''}${el.dataset.msg ? `[data-msg="${CSS.escape(el.dataset.msg)}"]` : ''}` : null;
    const inCards = el && document.getElementById('cards').contains(el);
    document.getElementById('cards').innerHTML = schedCard() + taskCard() + soonCard('c4', 2, 'mega', '공지사항', '사무소 공지와 필독 표시, 읽음 확인이 여기에 나옵니다.') + dealsCard() + soonCard('c3', 4, 'site', '관리단지', '관리하는 단지의 매물 수와 시세 변동이 여기에 나옵니다.') + soonCard('c3', 5, 'news', '부동산 뉴스', '정책, 시장, 우리 지역 소식이 여기에 나옵니다.');
    if (inCards && key) document.querySelector(`#cards ${key}`)?.focus({ preventScroll: true });
  }

  /* ── 반응 ── */
  const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  function hop() { const h = document.querySelector('.scene .hopper'); if (!h || calm()) return; h.classList.remove('hop'); void h.getBoundingClientRect(); h.classList.add('hop'); }
  function sparkle(host, n = 7) {
    if (!host || calm()) return;
    const made = Array.from({ length: n }, (_, i) => { const s = document.createElement('i'); s.className = 'spark'; s.style.setProperty('--a', `${(360 / n) * i}deg`); host.append(s); return s; });
    setTimeout(() => made.forEach((s) => s.remove()), 620);
  }
  function cheer(taskId) {
    hop();
    const num = document.getElementById('pin-open'); num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop'); sparkle(num.closest('.pin'));
    sparkle(document.querySelector(`.chk[data-key="${taskId}"]`), 6);
  }
  document.addEventListener('click', (e) => { if (e.target.closest?.('#sun')) hop(); });

  /* ── 알림: 되돌릴 수 있는 것은 직전 하나 ── */
  let timer;
  function toast(title, sub, undoable) {
    const el = document.getElementById('toast');
    el.innerHTML = `<span><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</span>${undoable ? '<button data-a="undo">되돌리기</button>' : ''}`;
    el.classList.add('on'); clearTimeout(timer);
    timer = setTimeout(() => { el.classList.remove('on'); if (ui.undo) { ui.undo = null; renderCards(); } }, 5000);
  }
  function settle() { // 앞서 체크한 줄을 목록에서 내보낸다 (되돌리기 대상이 바뀌거나 끝날 때)
    if (ui.undo) { ui.undo = null; }
  }

  /* ── 누르기 ── */
  function act(b) {
    const d = b.dataset;
    switch (d.a) {
      case 'scope': if (ui.scope === d.key) return; settle(); ui.scope = d.key; renderHero(false); renderCards(); return document.querySelector(`[data-a="scope"][data-key="${d.key}"]`)?.focus();
      case 'tab': settle(); ui.tab = d.key; renderCards(); if (!b.closest('#cards')) document.querySelector(`#cards [data-a="tab"][data-key="${d.key}"]`)?.focus(); return;
      case 'day': ui.day = +d.key; return renderCards();
      case 'jump': return document.querySelector('#sched .wd[aria-pressed="true"]')?.focus();
      case 'check': { const t = tasks.find((x) => x.id === d.key);
        if (ui.done.has(t.id)) { ui.done.delete(t.id); if (ui.undo?.id === t.id) ui.undo = null; renderCards(); syncPins(); return toast('완료를 취소했습니다', t.t); }
        settle(); ui.done.add(t.id); ui.undo = { id: t.id }; renderCards(); syncPins(); cheer(t.id); return toast('업무를 완료했습니다', t.t, true); }
      case 'undo': if (ui.undo) { ui.done.delete(ui.undo.id); ui.undo = null; renderCards(); syncPins(); } return document.getElementById('toast').classList.remove('on');
      case 'say': return toast(d.msg);
      case 'hour': ui.hour = +d.key; document.querySelectorAll('[data-a="hour"]').forEach((x) => x.setAttribute('aria-pressed', x === b)); return replay();
      case 'replay': return replay();
    }
  }
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-a]'); if (b) act(b); });
  document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row[data-a]')) { e.preventDefault(); act(e.target); } });

  function replay() {
    const page = document.getElementById('page');
    page.classList.remove('play'); void page.offsetWidth; // 다시 재생하려면 클래스를 뗐다 붙인다
    renderHero(true); renderCards(); page.classList.add('play');
    // 등장 움직임은 한 번뿐이다. 끝나면 표식을 떼어, 그 뒤에 카드를 다시 그려도 다시 재생되지 않게 한다.
    clearTimeout(replay.t); replay.t = setTimeout(() => page.classList.remove('play'), 2600);
  }
  document.getElementById('hours').innerHTML = [['아침', 8.5], ['낮', 14.33], ['저녁', 18.5], ['밤', 21.5]].map(([l, h]) => `<button data-a="hour" data-key="${h}" aria-pressed="${h === ui.hour}">${l}</button>`).join('');
  replay();
})();
</script>
</body>
</html>
