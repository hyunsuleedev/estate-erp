<!doctype html>

<style>
  /* 3판: 2판(단계 띠 + 세 열 + 줄 행동)에 단계별 막대, 이번 주 띠, 받을 돈, 새로 들어온 것, 진행 거래 표를 더했다. */
  .body { gap: 14px; }

  /* ── 단계 띠 ── */
  .flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border-radius: var(--r-panel); box-shadow: 0 0 0 1px var(--line), var(--shadow-1); flex: none; }
  .stage { position: relative; display: block; width: 100%; text-align: left; padding: 12px 18px 11px 22px; border-left: 1px solid var(--line); transition: background 0.15s; }
  .stage:first-child { border-left: 0; border-radius: var(--r-panel) 0 0 var(--r-panel); padding-left: 18px; }
  .stage:last-child { border-radius: 0 var(--r-panel) var(--r-panel) 0; }
  .stage:hover { background: #fafbfc; }
  .stage.on { background: var(--accent-soft); box-shadow: inset 0 -2px 0 var(--accent); }
  /* 칸 사이의 화살 모양: 왼쪽 경계선 가운데에 흰 꺾쇠 */
  .stage + .stage::before { content: ""; position: absolute; left: -6px; top: 50%; width: 10px; height: 10px; margin-top: -5px; background: var(--surface); border-top: 1px solid var(--line-2); border-right: 1px solid var(--line-2); transform: rotate(45deg); }
  .stage .l { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-2); }
  .stage .v { margin-top: 1px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .stage .v small { font-size: 13px; font-weight: 500; color: var(--text-3); margin-left: 3px; }
  .stage .x { margin-top: 1px; font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stage .x .d { color: var(--danger); font-weight: 500; }
  .stage .x .w { color: var(--warn); font-weight: 500; }
  .stage .todo { position: absolute; right: 14px; top: 12px; font-size: 12px; color: var(--text-2); }
  .stage .todo b { color: var(--text); font-weight: 600; }

  /* ── 세 열 ── */
  .work { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-panel); box-shadow: 0 0 0 1px var(--line), var(--shadow-1); overflow: hidden; }
  .cols { flex: 1; min-height: 0; display: grid; }
  .cols.by-date { grid-template-columns: 1fr 1.1fr 1fr; }
  .cols.by-who { grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
  .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-left: 1px solid var(--line); }
  .col:first-child { border-left: 0; }
  .col > header { display: flex; align-items: baseline; gap: 7px; padding: 13px 16px 9px; flex: none; }
  .col h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .col h2.late { color: var(--danger); }
  .col header .n { color: var(--text-3); font-size: 13px; }
  .col header .sub { color: var(--text-3); font-size: 12.5px; }
  .col header .link { margin-left: auto; font-size: 12.5px; color: var(--text-2); }
  .col header .link:hover { color: var(--text); text-decoration: underline; }
  .col .list { flex: 1; min-height: 0; overflow: auto; padding: 0 6px 8px; }
  .day { padding: 9px 10px 3px; font-size: 12px; color: var(--text-3); }
  .more { margin: 2px 10px; font-size: 12.5px; color: var(--text-2); padding: 5px 0; }
  .more:hover { color: var(--text); text-decoration: underline; }

  .by-who .rt { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: keep-all; line-height: 1.35; }
  .pwho { display: flex; align-items: center; gap: 8px; }
  .pwho small { color: var(--text-3); font-size: 12px; font-weight: 400; }

  /* ── 항목 줄: 제목, 이유, 오른쪽 끝 날짜(글자색만). 올리면 행동 단추가 날짜 자리를 덮는다 ── */
  .r { position: relative; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; column-gap: 10px; align-items: start; padding: 8px 10px; border-radius: var(--r-ctl); outline: none; transition: background 0.1s, opacity 0.2s var(--ease); }
  .r > .dot { margin-top: 7px; }
  .r:hover, .r.sel { background: #f5f6f8; }
  .r.sel { box-shadow: inset 2px 0 0 var(--accent); }
  .r.leaving { opacity: 0; }
  .rt { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rs { font-size: 12.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rl { margin-top: 2px; font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rd { font-size: 12.5px; color: var(--text-3); white-space: nowrap; padding-top: 2px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
  .rd.late { color: var(--danger); font-weight: 500; }
  .rd.today { color: #b4540a; font-weight: 500; }
  .ra { position: absolute; right: 6px; top: 5px; display: flex; opacity: 0; pointer-events: none; align-items: center; gap: 4px; padding-left: 28px; background: linear-gradient(90deg, transparent, #f5f6f8 24px); }
  /* 안 보일 때도 Tab으로 닿는다. 닿으면 focus-within으로 드러난다. */
  .r:hover .ra, .r.sel .ra, .r.menu-open .ra, .r:focus-within .ra { opacity: 1; pointer-events: auto; }
  .r:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
  .toast .prev { color: #aab4c4; max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ib { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--text-2); background: var(--surface); box-shadow: 0 0 0 1px var(--line-2); }
  .ib:hover { color: var(--text); background: #fff; box-shadow: 0 0 0 1px var(--text-3); }

  .cue.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

  .filt { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--accent); background: var(--accent-soft); flex: none; }

  /* ── 미루기 메뉴 (알림보다 위 층, 크기 고정) ── */

  .dlg { width: 420px; max-width: calc(100vw - 32px); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-2); overflow: hidden; }
  .dlg header { padding: 16px 18px 4px; }

  .opt { height: 52px; border-radius: 8px; box-shadow: 0 0 0 1px var(--line-2); font-size: 13px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }

  .dr.hd:hover { background: none; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }

  .nx { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .nx.d { color: var(--danger); }

  .rail > section { padding-bottom: 8px; border-top: 1px solid var(--line); }

  .rail > section:last-child { flex: 1; min-height: 0; overflow: auto; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 0 10px 4px; }
  .wd { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 5px; border-radius: 8px; font-size: 11.5px; color: var(--text-3); }

  .mr, .fr { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; align-items: center; padding: 6px 16px; }

  .fr { position: relative; grid-template-columns: 22px minmax(0, 1fr); align-items: start; padding: 7px 12px 7px 14px; border-radius: var(--r-ctl); margin: 0 4px; }

  .fr:hover .btn, .fr:focus-within .btn { opacity: 1; pointer-events: auto; }
  .fr time { font-size: 12px; color: var(--text-3); }
</style>
</head>

      <section><div class="ph"><h2>이번 주</h2><span class="sub num">11.16 ~ 11.22</span></div><div class="week">${week}</div></section>
      <section><div class="ph"><h2>받을 돈</h2><span class="sub num">${moneySub}</span><a href="#" data-a="deal" data-label="받을 돈" data-to="수금 원장">수금 원장 →</a></div>
        ${money.map((it) => `<div class="mr"><div style="min-width:0"><div class="rt">${esc(it.t.replace(' 수수료', ''))}</div><div class="rs${it.off < 0 ? ' d' : ''}">${esc(it.why)} · ${it.snoozedFrom != null ? `${esc(when(it))}로 미룸` : esc(when(it))}</div></div><b class="num">${esc(it.amt)}</b></div>`).join('') || '<div class="empty">밀린 돈이 없습니다.</div>'}</section>
      <section><div class="ph"><h2>새로 들어온 것</h2><span class="sub">사무소</span></div>
        ${FEED.map(([t, k, title, sub, act]) => `<div class="fr"><span class="ki k-${k}">${ICON[k]}</span><div style="min-width:0"><div class="rt">${esc(title)} <time class="num">${t}</time></div><div class="rs">${esc(sub)}</div></div><button class="btn sm" data-a="feed" data-label="${esc(act)}" data-to="${KIND[k][1]}">${esc(act)}</button></div>`).join('')}</section>
    </aside>`;
  }

  // 다시 그리기 전에 포커스가 있던 곳을 적어 두었다가, 같은 것을 찾아 되돌린다. 없어졌으면 고른 줄로 간다.
  const FOCUS_KEYS = ['a', 'id', 'type', 'kind', 'off', 'key', 'scope', 'group', 'o', 'label'];
  function focusKey(scope) {
    const el = document.activeElement;
    if (!el || el === document.body || !scope.contains(el)) return null;
    if (el.id) return '#' + el.id;
    if (el.classList.contains('r')) return `.r[data-id="${el.dataset.id}"]`;
    const parts = FOCUS_KEYS.filter((k) => el.dataset[k] != null).map((k) => `[data-${k}="${CSS.escape(el.dataset[k])}"]`);
    return parts.length ? el.tagName.toLowerCase() + parts.join('') : '';
  }
  function refocus(key, scope) {
    if (key == null) return;
    const el = (key && scope.querySelector(key)) || document.querySelector('.dlg .opt') || document.querySelector('.r.sel') || document.querySelector('.r');
    el?.focus({ preventScroll: true });
  }

  // keepFocus=false: 부른 쪽이 포커스를 직접 옮길 때(줄 이동). 이때 옛 자리로 되돌리면 그 줄이 다시 고른 줄이 되어 이동이 취소된다.
  function render(keepFocus = true) {
    const fk = keepFocus ? focusKey(document.body) : null;
    // 범위가 '내 것'이면 담당자별 묶기는 뜻이 없다. 날짜별로 되돌린다.
    if (ui.scope === 'mine') ui.group = 'date';
    const scoped = items.filter(inScope);
    const v = items.filter(onBoard);
    if (ui.sel && !v.some((it) => it.id === ui.sel)) ui.sel = null;
    const late = scoped.filter((it) => it.off < 0).length, today = scoped.filter((it) => it.off === 0).length;
    const expiry = scoped.filter((it) => it.kind === 'expiry').length, ads = scoped.filter((it) => it.ad).length;
    const doneList = items.filter((it) => it.done);

    document.getElementById('body').innerHTML = `
      <p class="brief">${ui.scope === 'all' ? '사무소에' : '서연 님,'} 오늘 챙길 일 <b class="num">${today}건</b>${late ? `<span> · </span><b class="d num">지난 일 ${late}건</b>` : ''}<span>이 있어요.</span></p>
      <div class="flow">${STAGES.map((st) => { const n = scoped.filter((it) => it.kind === st.kind && it.off <= 7).length; return `<button class="stage k-${st.kind}${isF({ type: 'kind', kind: st.kind }) ? ' on' : ''}" data-a="filter" data-type="kind" data-kind="${st.kind}">
        <div class="l">${KIND[st.kind][0]} <span style="color:var(--text-3)">· ${st.cap}</span></div>
        <div class="v num">${st.v}</div><div class="x num">${st.x}</div><div class="bar">${st.viz.map(([n, c]) => `<i style="flex:${n};background:${c}"></i>`).join('')}</div>
        <span class="todo num">챙길 일 <b>${n}</b></span></button>`; }).join('')}</div>
      <div class="grid"><div class="left"><div class="work">
        ${ui.filter ? `<div class="filt"><span>${filterLabel()}</span><button data-a="clear">전체 보기</button></div>` : ''}
        ${ui.group === 'who' ? whoCols(v) : dateCols(v)}
        <div class="foot num">
          <button class="cue${isF({ type: 'expiry' }) ? ' on' : ''}" data-a="filter" data-type="expiry">60일 안 계약 만기 <b>${expiry}건</b></button>
          <button class="cue${isF({ type: 'ad' }) ? ' on' : ''}" data-a="filter" data-type="ad">광고 만료 임박 <b>${ads}건</b></button>
          <span class="sp"></span>
          <span class="keys"><span><kbd>J</kbd> <kbd>K</kbd> 이동</span><span><kbd>E</kbd> 완료</span><span><kbd>H</kbd> 내일로</span></span>
          <button class="cue${ui.doneOpen ? ' on' : ''}" data-a="donebox">오늘 처리한 일 <b>${doneList.length}건</b></button>
        </div>
      </div>${dealsPanel()}</div>${rail(scoped)}</div>`;

    document.querySelectorAll('[data-scope]').forEach((b) => b.classList.toggle('on', b.dataset.scope === ui.scope));
    document.querySelectorAll('[data-group]').forEach((b) => { b.classList.toggle('on', b.dataset.group === ui.group); if (b.dataset.group === 'who') { b.disabled = ui.scope === 'mine'; b.title = ui.scope === 'mine' ? '사무소 전체에서 쓸 수 있습니다' : ''; } });
    renderLayers(doneList, true);
    refocus(fk, document.body);
  }

  function renderLayers(doneList = items.filter((it) => it.done), fromRender = false) {
    const host = document.getElementById('layers');
    const lk = fromRender ? null : focusKey(host);
    const m = ui.menu, c = ui.call;
    const it = m && items.find((x) => x.id === m.id);
    const ci = c && items.find((x) => x.id === c.id);
    host.innerHTML =
      (ui.doneOpen ? `<div class="donebox"><header>오늘 처리한 일<button data-a="donebox">닫기</button></header><div class="list">${doneList.map((d) => `<div class="dn"><div style="min-width:0"><div class="rt">${esc(d.t)}</div><div class="rs">${esc(d.why)}${d.log ? ` · 통화 ${esc(d.log.outcome)}${d.log.memo ? ' · ' + esc(d.log.memo) : ''}` : ''}</div></div><button class="btn sm" data-a="reopen" data-id="${d.id}">다시 올리기</button></div>`).join('') || '<div class="empty">아직 처리한 일이 없습니다.</div>'}</div></div>` : '') +
      (it ? `<div class="menu" style="left:${m.x}px;top:${m.y}px">${SNOOZE.filter(([, off]) => off > it.off).map(([label, off]) => `<button data-a="snooze" data-id="${it.id}" data-off="${off}">${label}<span class="num">${dayLabel(off)}</span></button>`).join('') || '<button disabled style="color:var(--text-3)">더 미룰 날짜가 없습니다</button>'}</div>` : '') +
      (ci ? `<div class="veil" data-a="call-close"><div class="dlg" role="dialog" aria-modal="true" aria-label="통화 결과" data-stop>
        <header><h3>통화 결과</h3><p>${esc(ci.t)} · ${esc(ci.why)}</p></header>
        <div class="in">
          <div class="lb">어떻게 됐나요</div>
          <div class="opts">${[['통화됨', '완료로 옮김'], ['부재중', '내일 다시'], ['다시 걸기로 함', '금요일에 다시']].map(([o, sub]) => `<button class="opt${c.outcome === o ? ' on' : ''}" data-a="call-opt" data-o="${o}">${o}<small>${sub}</small></button>`).join('')}</div>
          <div class="lb">메모 (선택)</div>
          <textarea id="memo" maxlength="200" placeholder="예: 12월 초에 다시 보자고 함">${esc(c.memo)}</textarea>
          <div class="err" role="alert">${esc(c.err)}</div>
        </div>
        <footer>${c.asking ? `<span class="q">적은 내용을 버릴까요?</span><button class="btn" data-a="call-keep">계속 쓰기</button><button class="btn pri" data-a="call-drop">버리기</button>` : `<button class="btn" data-a="call-close">취소</button><button class="btn pri" data-a="call-save">저장</button>`}</footer>
      </div></div>` : '');
    refocus(lk, host);
  }

  /* ── 통화 결과 창 ── */
  function closeCall(force) {
    const c = ui.call; if (!c) return;
    if (!force && (c.outcome || c.memo.trim())) { c.asking = true; renderLayers(); return; }
    const id = c.id; ui.call = null; renderLayers();
    (document.querySelector(`.r[data-id="${id}"]`) ?? document.querySelector('.r'))?.focus({ preventScroll: true });
  }
  function saveCall() {
    const c = ui.call; const it = items.find((x) => x.id === c.id);
    if (!c.outcome) { c.err = '통화 결과를 골라 주세요.'; c.asking = false; renderLayers(); document.getElementById('memo')?.focus(); return; }
    const memo = c.memo.trim();
    ui.call = null;
    mutate(`통화 기록 · ${it.t} · ${c.outcome}`, () => {
      it.log = { outcome: c.outcome, memo };
      if (c.outcome === '통화됨') it.done = true;
      else snoozeTo(it, c.outcome === '부재중' ? 1 : 4); // 창에 적힌 그대로: 부재중은 내일, 다시 걸기로 했으면 금요일
    });
  }

  /* ── 누르기 ── */
  document.addEventListener('input', (e) => { if (e.target.id === 'memo' && ui.call) { ui.call.memo = e.target.value; ui.call.err = ''; } });
  document.addEventListener('click', (e) => {
    if (e.target.closest('a[href="#"]')) e.preventDefault(); // 시안의 이동 링크는 주소를 바꾸지 않는다
    const b = e.target.closest('[data-a], [data-scope], [data-group]');
    // 창 안의 빈 곳을 누른 것은 바깥 누르기가 아니다.
    if (b?.dataset.a === 'call-close' && b.classList.contains('veil') && e.target.closest('[data-stop]')) return;
    if (ui.menu && !(b && ['menu', 'snooze'].includes(b.dataset.a))) { ui.menu = null; render(); if (!b) return; }
    if (!b) return;
    const d = b.dataset; const it = d.id && items.find((x) => x.id === d.id);
    if (d.scope) { ui.scope = d.scope; ui.open.clear(); return render(); }
    if (d.group) { if (b.disabled) return; ui.group = d.group; ui.open.clear(); return render(); }
    switch (d.a) {
      case 'filter': { const f = { type: d.type, kind: d.kind, off: d.off == null ? undefined : +d.off }; ui.filter = isF(f) ? null : f; ui.open.clear(); return render(); }
      case 'clear': ui.filter = null; return render();
      case 'feed': case 'deal': return toast(`${d.label} → ${d.to} 화면에서 엽니다`);
      case 'more': ui.open.has(d.key) ? ui.open.delete(d.key) : ui.open.add(d.key); return render();
      case 'done': return complete(it);
      case 'menu': { if (ui.menu?.id === it.id) { ui.menu = null; return render(); } const r = b.getBoundingClientRect(); ui.sel = it.id; ui.menu = { id: it.id, x: Math.min(r.right - 188, innerWidth - 200), y: Math.min(r.bottom + 4, innerHeight - 110) }; render(); return document.querySelector('.menu button')?.focus(); }
      case 'snooze': return mutate(`${SNOOZE.find(([, o]) => o === +d.off)[0]}(으)로 미룸 · ${it.t}`, () => snoozeTo(it, +d.off));
      case 'bulk': { const late = items.filter((x) => onBoard(x) && x.off < 0); return mutate(`지난 일 ${late.length}건을 내일로 미뤘습니다`, () => late.forEach((x) => snoozeTo(x, 1))); }
      case 'act': if (it.call) { ui.sel = it.id; ui.call = { id: it.id, outcome: null, memo: '', err: '', asking: false }; render(); document.querySelector('.opt')?.focus(); } else toast(`${it.act} → ${KIND[it.kind][1]} 화면에서 엽니다`); return;
      case 'undo': if (ui.undo) { restore(ui.undo.snap); ui.undo = null; hideToast(); render(); } return;
      case 'donebox': ui.doneOpen = !ui.doneOpen; render(); return (ui.doneOpen ? document.querySelector('.donebox header button') : document.querySelector('.foot [data-a=donebox]'))?.focus();
      case 'reopen': return mutate(`다시 올림 · ${it.t}`, () => { delete it.done; });
      case 'call-opt': ui.call.outcome = d.o; ui.call.err = ''; ui.call.asking = false; return keepMemoFocus(() => renderLayers());
      case 'call-save': return saveCall();
      case 'call-close': return closeCall(false);
      case 'call-keep': ui.call.asking = false; renderLayers(); return document.getElementById('memo')?.focus();
      case 'call-drop': return closeCall(true);
    }
  });
  // 다시 그려도 메모 칸의 커서 자리를 잃지 않는다.
  function keepMemoFocus(fn) {
    const el = document.getElementById('memo'); const had = document.activeElement === el; const pos = el?.selectionStart;
    fn();
    if (had) { const n = document.getElementById('memo'); n.focus(); n.setSelectionRange(pos, pos); }
  }
  function complete(it) {
    if (!it || it.done) return;
    const el = document.querySelector(`.r[data-id="${it.id}"]`);
    const order = [...document.querySelectorAll('.r')].map((r) => r.dataset.id); const i = order.indexOf(it.id);
    if (ui.sel === it.id) ui.sel = order[i + 1] ?? order[i - 1] ?? null;
    el?.classList.add('leaving');
    mutate(`완료 · ${it.t}`, () => { it.done = true; });
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (ui.call) return closeCall(false);
      if (ui.menu) { const id = ui.menu.id; ui.menu = null; render(); return document.querySelector(`[data-a="menu"][data-id="${id}"]`)?.focus(); }
      if (ui.doneOpen) { ui.doneOpen = false; render(); return document.querySelector('.foot [data-a=donebox]')?.focus(); }
      return;
    }
    // 창이 떠 있으면 Tab이 창 밖으로 나가지 않는다.
    if (ui.call && e.key === 'Tab') {
      const f = [...document.querySelectorAll('.dlg button, .dlg textarea')]; const i = f.indexOf(document.activeElement);
      if (i === -1 || (e.shiftKey && i === 0) || (!e.shiftKey && i === f.length - 1)) { e.preventDefault(); f[e.shiftKey ? f.length - 1 : 0].focus(); }
      return;
    }
    // 미루기 메뉴: 위아래 화살표로 고르고, Tab을 누르면 닫고 원래 단추로 돌아간다.
    if (ui.menu) {
      const f = [...document.querySelectorAll('.menu button:not(:disabled)')]; const i = f.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); f[(i + (e.key === 'ArrowDown' ? 1 : f.length - 1) + (i === -1 && e.key === 'ArrowUp' ? 1 : 0)) % f.length]?.focus(); }
      else if (e.key === 'Tab') { e.preventDefault(); const id = ui.menu.id; ui.menu = null; render(); document.querySelector(`[data-a="menu"][data-id="${id}"]`)?.focus(); }
      return;
    }
    // 줄에 포커스를 두고 Enter를 누르면 주 행동이다.
    if (e.key === 'Enter' && e.target.classList?.contains('r')) { e.preventDefault(); return e.target.querySelector('[data-a=act]').click(); }
    if (ui.call || e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    const order = [...document.querySelectorAll('.r')].map((r) => r.dataset.id); if (!order.length) return;
    const i = order.indexOf(ui.sel); const k = e.key.toLowerCase();
    if (k === 'j' || e.key === 'ArrowDown') ui.sel = order[Math.min(i + 1, order.length - 1)];
    else if (k === 'k' || e.key === 'ArrowUp') ui.sel = order[Math.max(i - 1, 0)];
    else if (k === 'e' && ui.sel) return complete(items.find((x) => x.id === ui.sel));
    else if (k === 'h' && ui.sel) { const it = items.find((x) => x.id === ui.sel); if (it.off >= 1) return toast('이미 내일 이후입니다. 미루기 단추에서 날짜를 고르세요'); return mutate(`내일로 미룸 · ${it.t}`, () => snoozeTo(it, 1)); }
    else return;
    e.preventDefault(); ui.menu = null; render(false);
    const selEl = document.querySelector('.r.sel'); selEl?.focus({ preventScroll: true }); selEl?.scrollIntoView({ block: 'nearest' });
  });
  // Tab으로 줄에 들어오면 그 줄이 고른 줄이 된다 (다시 그리지 않고 표시만 옮긴다).
  document.addEventListener('focusin', (e) => {
    const r = e.target.closest?.('.r'); if (!r || ui.sel === r.dataset.id) return;
    ui.sel = r.dataset.id;
    document.querySelectorAll('.r.sel').forEach((x) => x.classList.remove('sel')); r.classList.add('sel');
  });
  window.addEventListener('resize', () => { if (ui.menu) { ui.menu = null; render(); } });
  document.addEventListener('scroll', () => { if (ui.menu) { ui.menu = null; render(); } }, true);

  /* ── 틀 ── */
  const NAV = [['시작', [['대시보드', '']]], ['매물·공간', [['매물관리', '48'], ['관리단지', ''], ['광고관리', '']]], ['고객·상담', [['고객 원장', ''], ['연락처', ''], ['상담분석', '']]], ['거래·계약', [['희망매물', '12'], ['거래관리', '7'], ['계약서 관리', ''], ['수수료/정산', '']]], ['업무·운영', [['업무', ''], ['캘린더', ''], ['직원관리', '']]]];
  document.body.insertAdjacentHTML('afterbegin', `<div class="app">
    <nav class="side"><div class="office"><span class="mark">E</span>고덕 에스테잇 부동산</div>${NAV.map(([g, links]) => `<div class="grp">${g}</div>${links.map(([l, c]) => `<a href="#" class="${l === '대시보드' ? 'on' : ''}">${l}${c ? `<span class="cnt num">${c}</span>` : ''}</a>`).join('')}`).join('')}</nav>
    <div class="main">
      <header class="top"><h1>대시보드</h1><span class="date num">11월 16일 월요일</span><span class="sp"></span>
        <div class="seg" aria-label="묶기"><button data-group="date" class="on">날짜별</button><button data-group="who">담당자별</button></div>
        <div class="seg" aria-label="범위"><button data-scope="mine" class="on">내 것</button><button data-scope="all">사무소 전체</button></div>
      </header>
      <div class="body" id="body"></div>
    </div></div><div id="layers"></div>`);
  render();
})();
</script>
</body>
</html>
