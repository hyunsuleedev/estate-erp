<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방향 ④ 다음 한 가지 · 대시보드</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="shared.css">
<style>
  /*
   * 방향 ④ 다음 한 가지 + 노선도 — 목록을 나열하지 않는다.
   * 왼쪽에는 지금 가장 급한 일 하나만 크게 있다(뒤에 카드가 겹쳐 쌓여 있다). 완료하거나 건너뛰면 다음 장이 올라온다.
   * 거래는 표가 아니라 노선도다. 역이 단계이고, 거래는 지금 서 있는 역 아래에 걸려 있다.
   */
  .g4 { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); grid-template-rows: auto minmax(0, 1fr); gap: 16px 18px; }
  /* 겹쳐 쌓인 카드 */
  .stack { position: relative; grid-row: 1 / 3; min-height: 0; padding: 0 0 14px; }
  .stack::before, .stack::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 7px; height: 30px; border-radius: 12px; background: var(--bg); box-shadow: var(--card); }
  .stack::after { left: 28px; right: 28px; bottom: 0; opacity: 0.7; }
  .stack.two::after, .stack.one::before, .stack.one::after { display: none; }
  .focus { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; padding: 20px 22px 16px; border-radius: 14px; background: var(--bg); box-shadow: 0 0 0 1px rgba(42, 28, 0, 0.1), 0 10px 26px -14px rgba(42, 28, 0, 0.28); }
  .swap { animation: swap 320ms var(--ease-out); }
  @keyframes swap { from { opacity: 0; transform: translateY(10px) scale(0.985); } }
  .kick { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg3); }
  .kick .bar { flex: 1; height: 4px; border-radius: 2px; background: #f1f1ef; overflow: hidden; }
  .kick .bar i { display: block; height: 100%; border-radius: 2px; background: var(--fg); transition: width 320ms var(--ease-out); }
  .why { display: inline-flex; align-items: center; gap: 6px; height: 24px; margin-top: 18px; padding: 0 9px; border-radius: 12px; font-size: 12px; font-weight: 600; background: #f1f1ef; color: var(--fg2); align-self: flex-start; }
  .why.late { background: #ffe2dd; color: var(--red); }
  .why.today { background: #fadec9; color: #a4560a; }
  .focus h3 { margin: 10px 0 6px; font-size: 26px; line-height: 34px; font-weight: 600; letter-spacing: -0.02em; word-break: keep-all; }
  .focus .m { color: var(--fg3); }
  .acts { margin-top: auto; padding-top: 16px; display: flex; align-items: center; gap: 8px; }
  .big { height: 40px; padding: 0 18px; font-size: 15px; }
  .ghost { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 6px; font-weight: 500; color: var(--fg2); box-shadow: inset 0 0 0 1px var(--line2); transition: background-color 120ms, transform 160ms var(--ease-out); }
  .ghost:hover { background: var(--hover); }
  .ghost:active { transform: scale(0.97); }
  .acts kbd { margin-left: 2px; font: 500 11px/1 ui-monospace, Menlo, monospace; padding: 3px 5px; border-radius: 4px; background: rgba(255, 255, 255, 0.18); }
  .ghost kbd { background: #f1f1ef; color: var(--fg3); }
  .nexts { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
  .nexts p { margin: 0 0 4px; font-size: 12px; color: var(--fg4); }
  .nx1 { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; width: 100%; padding: 5px 8px; margin: 0 -8px; width: calc(100% + 16px); border-radius: 6px; text-align: left; transition: background-color 100ms; }
  .nx1:hover { background: var(--hover); }
  .nx1 span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .allclear { margin: auto; text-align: center; color: var(--fg3); }
  .allclear b { display: block; margin-bottom: 4px; font-size: 20px; color: var(--fg); }
  /* 오늘 일정: 표 한 장씩 */
  .tix { display: flex; flex-direction: column; min-height: 0; }
  .tix .list { height: 132px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); gap: 10px; overflow: auto; padding: 2px 2px 6px; }
  .tk { position: relative; display: flex; flex-direction: column; padding: 12px 12px 10px 16px; border-radius: 10px; background: var(--bg); box-shadow: var(--card); text-align: left; transition: box-shadow 200ms, transform 200ms var(--ease-out); }
  .tk::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 2px 2px 0; background: var(--c, var(--fg4)); }
  @media (hover: hover) and (pointer: fine) { .tk:hover { box-shadow: var(--card-hover); transform: translateY(-1px); } }
  .tk b { font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tk.past { opacity: 0.5; }
  .tk .rel { font-size: 12px; color: var(--fg4); }
  .tk .dy { font-size: 12px; line-height: 16px; color: var(--fg3); }
  .tk.now .dy { color: var(--red-strong); font-weight: 600; }
  .tk .rel.soon { color: #a4560a; font-weight: 500; }
  .sh { display: flex; align-items: baseline; gap: 7px; height: 30px; flex: none; font-size: 14px; font-weight: 600; }
  .sh .n { font-weight: 400; color: var(--fg4); }
  .sh .go { margin-left: auto; }
  /* 거래 노선도 */
  .linecard { display: flex; flex-direction: column; min-height: 0; }
  .rail { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); padding: 26px 6px 0; }
  .rail::before { content: ""; position: absolute; left: 10%; right: 10%; top: 33px; height: 4px; border-radius: 2px; background: #e6e5e3; }
  .rail::after { content: ""; position: absolute; left: 10%; top: 33px; height: 4px; border-radius: 2px; background: var(--fg); width: calc(80% * var(--p)); transition: width 500ms var(--ease-out); }
  .st { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; min-height: 0; }
  .st .cars { flex: 1; min-height: 0; }
  .g4 .feed2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 84px; }
  .g4 .feed2 .nrow .mm { display: none; }
  .g4 .feed2 .nrow { grid-template-columns: 8px minmax(0, 1fr); }
  .g4 .feed2 .nrow.nw { grid-template-columns: auto minmax(0, 1fr); }
  .st .dot { position: relative; z-index: 1; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 4px #c9c6c1; }
  .st.has .dot { box-shadow: inset 0 0 0 4px var(--fg); }
  .st .nm { font-size: 12px; color: var(--fg3); white-space: nowrap; }
  .st.has .nm { color: var(--fg); font-weight: 600; }
  .st .cars { display: flex; flex-direction: column; align-items: stretch; gap: 5px; width: 100%; padding: 4px 5px 8px; overflow: auto; }
  .car { position: relative; padding: 6px 8px; border-radius: 8px; background: var(--bg); box-shadow: var(--card); text-align: left; transition: box-shadow 200ms, transform 200ms var(--ease-out); }
  .car::before { content: ""; position: absolute; left: 50%; top: -6px; width: 2px; height: 6px; margin-left: -1px; background: #c9c6c1; }
  .car + .car::before { display: none; }
  @media (hover: hover) and (pointer: fine) { .car:hover { box-shadow: var(--card-hover); transform: translateY(-1px); } }
  .car b { display: block; font-weight: 600; white-space: nowrap; }
  .car span { display: block; font-size: 12px; line-height: 16px; color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .car span.w { color: var(--amber); font-weight: 500; }
  .soon4 { display: flex; gap: 8px; margin-top: 8px; flex: none; }
  .soon4 span { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 30px; border-radius: 8px; border: 1px dashed #dddbd7; font-size: 12px; color: var(--fg3); white-space: nowrap; }
  .soon4 svg { width: 14px; height: 14px; color: var(--fg4); }
</style>
</head>
<body>
<script src="shared.js"></script>
<script>
(() => {
  const { DAYS, DATES, TODAY, events, deals, ui, ic, esc, inScope, bucket, dueText, open, hhmm, keepFocus } = DX;
  let skip = 0;      // 건너뛴 수 (맨 앞에서 몇 번째 장을 보고 있는지)
  let lastId = null; // 장이 바뀌었을 때만 올라오는 움직임을 준다
  const order = () => open().slice().sort((a, b) => (a.off ?? 99) - (b.off ?? 99));
  const STAGES = [[1, '계약 준비'], [2, '가계약'], [3, '본계약'], [4, '중도금/잔금'], [5, '잔금완료']];
  const unit = (t) => t.replace('고덕그라시움 101동 ', '');
  const mins = (hm) => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };

  function paint() {
    const area = document.getElementById('area');
    keepFocus(area, () => {
      const list = order(), total = list.length + ui.done.size;
      if (skip >= list.length) skip = 0;
      const t = list[skip], rest = list.filter((_, i) => i !== skip).slice(0, 3);
      const b = t ? bucket(t) : null;
      const changed = t?.id !== lastId; lastId = t?.id ?? null;
      const ev = events.filter((e) => e.day >= TODAY && inScope(e)).sort((a, b2) => a.day - b2.day || a.time.localeCompare(b2.time));
      const nowM = Math.round(ui.hour * 60);
      const far = Math.max(...deals.map((x) => x.st));
      area.innerHTML = `<div class="g4">
        <div class="stack${list.length <= 1 ? ' one' : list.length === 2 ? ' two' : ''}"><section class="focus${changed ? ' swap' : ''}" aria-live="polite">
          ${t ? `<div class="kick"><span class="num">남은 ${list.length}건 중 ${skip + 1}번째</span><span class="bar" title="오늘 처리한 일 ${ui.done.size}건"><i style="width:${total ? (ui.done.size / total) * 100 : 0}%"></i></span><span class="num">처리 ${ui.done.size}</span></div>
            <span class="why ${b}">${b === 'late' ? `기한 ${dueText(t)}` : b === 'today' ? '오늘까지' : dueText(t)}</span>
            <h3>${esc(t.t)}</h3><div class="m">${esc(t.m)} · 담당 ${esc(t.who)}</div>
            <div class="acts"><button class="btn big" data-a="check" data-key="${t.id}">완료<kbd>Enter</kbd></button><button class="ghost" data-a="skip">건너뛰기<kbd>→</kbd></button><span style="flex:1"></span><button class="go" data-a="say" data-msg="업무 화면으로 갑니다">전체 보기${ic('arrow')}</button></div>
            ${rest.length ? `<div class="nexts"><p>그다음</p>${rest.map((r) => `<button class="nx1" data-a="pick" data-key="${r.id}"><span>${esc(r.t)}</span><span class="due ${bucket(r) === 'late' ? 'late' : ''}">${dueText(r)}</span></button>`).join('')}</div>` : ''}`
          : `<div class="allclear"><b>다 했어요</b>남은 업무가 없습니다. 수고하셨어요.</div>`}
        </section></div>
        <section class="tix"><div class="sh">${ic('cal')}이번 주 남은 일정<span class="n num">${ev.length}</span><button class="go" data-a="say" data-msg="캘린더 화면으로 갑니다">캘린더${ic('arrow')}</button></div>
          <div class="list">${ev.map((e) => { const td = e.day === TODAY, d = mins(e.time) - nowM;
            const rel = !td ? (e.day === TODAY + 1 ? '내일' : `${e.day - TODAY}일 뒤`) : d < 0 ? '지났어요' : d < 60 ? `${d}분 뒤` : `${Math.floor(d / 60)}시간 ${d % 60 ? (d % 60) + '분 ' : ''}뒤`;
            return `<button class="tk${td ? ' now' : ''}${td && d < 0 ? ' past' : ''}" style="--c:${e.c ?? ''}" data-a="say" data-msg="${esc(e.t)} 일정을 엽니다"><span class="dy num">${td ? '오늘' : `${DAYS[e.day]} ${DATES[e.day]}일`}</span><b>${e.time}</b><span class="t1">${esc(e.t)}</span><span class="t2">${esc(e.m)}</span><span class="rel${td && d >= 0 && d < 120 ? ' soon' : ''}" style="margin-top:auto;padding-top:4px">${rel}</span></button>`; }).join('') || '<div class="empty">이번 주에 남은 일정이 없어요</div>'}</div>
        </section>
        <section class="linecard"><div class="sh">${ic('deal')}거래 노선도<span class="n num">${deals.length}</span><button class="go" data-a="say" data-msg="거래관리 화면으로 갑니다">거래관리${ic('arrow')}</button></div>
          <div class="rail" style="--p:${(far - 1) / 4}">${STAGES.map(([s, label]) => { const here = deals.filter((x) => x.st === s);
            return `<div class="st${here.length ? ' has' : ''}"><span class="dot"></span><span class="nm">${label}</span><div class="cars">${here.map((x) => `<button class="car" data-a="say" data-msg="${esc(x.t)} 거래를 엽니다"><b>${esc(unit(x.t))}</b><span class="num">${esc(x.a)}</span><span class="num ${x.cls === 'warn' ? 'w' : ''}">${esc(x.nx)}${x.d ? ' · ' + x.d : ''}</span></button>`).join('')}</div></div>`; }).join('')}</div>
          <div class="feed2"><section><div class="fh">${ic('mega')}공지사항<span class="n num">${DX.unread() ? `안 읽음 ${DX.unread()}` : '모두 읽음'}</span></div>${DX.noticeRows(3)}</section><section><div class="fh">${ic('news')}부동산 뉴스</div>${DX.newsRows(3)}</section><div class="soonchip">${ic('site')}관리단지<i>준비 중</i></div></div>
        </section></div>`;
    });
  }
  DX.onRender(paint);
  document.addEventListener('dx:act', (e) => {
    const { a, key } = e.detail;
    if (a === 'skip') skip += 1;
    else if (a === 'pick') skip = Math.max(0, order().findIndex((t) => t.id === key));
    // 알약: 기한 지남 → 가장 오래 밀린 것, 남은 업무 → 오늘 것(없으면 맨 앞)
    else if (a === 'tab') { const i = order().findIndex((t) => bucket(t) === (key === 'late' ? 'late' : 'today')); skip = Math.max(0, i); }
    else if (a === 'jump') return document.querySelector('.tix [data-a]')?.focus();
    else return;
    paint();
    document.querySelector('.focus [data-a="check"]')?.focus();
  });
  // 가장 급한 일 카드에 포커스가 있을 때: Enter는 완료(단추의 기본 동작), →는 건너뛰기
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' && e.target.closest?.('.focus') && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); document.querySelector('[data-a="skip"]')?.click(); }
  });
  DX.start();
})();
</script>
</body>
</html>
