<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방향 ① 주간 격자 · 대시보드</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="shared.css">
<style>
  /*
   * 방향 ① 주간 격자 — 카드 여섯 장을 없애고, 일정·할 일·거래 기일을 하나의 요일 격자에 올린다.
   * 세로줄은 시간(밀린 것 → 월~일 → 그 뒤), 가로줄은 종류(일정 / 할 일 / 거래)다.
   * "수요일에 뭐가 몰려 있지?"를 세 카드를 오가지 않고 한 줄로 내려 읽는다. 요일 머리를 누르면 그 줄이 넓어진다.
   */
  .wk { flex: 1; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 0.75fr) minmax(0, 1.25fr) auto; background: var(--bg); border-radius: 10px; box-shadow: var(--card); overflow: hidden; transition: grid-template-columns 260ms var(--ease-out); }
  .wk > * { min-width: 0; border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
  .wk > .lab, .wk > .hd.lab0 { border-left: 0; }
  .wk > .hd { border-top: 0; }
  .hd { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 10px; font-size: 13px; font-weight: 500; color: var(--fg3); text-align: left; transition: background-color 120ms; }
  button.hd:hover { background: var(--hover); }
  .hd b { display: grid; place-items: center; min-width: 24px; height: 24px; border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--fg); }
  .hd.today b { background: var(--red-strong); color: #fff; }
  .hd.late { color: var(--red); }
  .hd .n { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--fg4); }
  .hd[aria-pressed="true"] { background: var(--sel); }
  .lab { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 10px; font-size: 12px; color: var(--fg3); }
  .lab svg { color: var(--icon); }
  .cell { padding: 6px; overflow: auto; }
  .cell.today { background: #fdfcfa; }
  .cell.past { background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(42, 28, 0, 0.022) 6px 7px); }
  .cell.past > * { opacity: 0.55; }
  .cell.sel { box-shadow: inset 0 0 0 9999px rgba(33, 27, 23, 0.025); }
  .it { display: block; width: 100%; padding: 5px 7px; border-radius: 6px; text-align: left; transition: background-color 100ms; }
  .it + .it { margin-top: 2px; }
  .it:hover, .it:focus-within { background: var(--hover); }
  .it .tm { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .it .tt { font-size: 13px; line-height: 18px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: keep-all; }
  .it .mm { font-size: 12px; line-height: 16px; color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it.ev { box-shadow: inset 2px 0 0 var(--c, var(--fg4)); border-radius: 0 6px 6px 0; background: rgba(33, 27, 23, 0.03); }
  .it.tk { display: grid; grid-template-columns: 16px minmax(0, 1fr); column-gap: 7px; align-items: start; }
  .it.tk.done { opacity: 0.45; }
  .it.tk.done .tt { text-decoration: line-through; }
  .it .late { color: var(--red); font-weight: 500; }
  .it.dl .tag { margin-top: 3px; }
  .it .warn { color: var(--amber); font-weight: 500; }
  .none { padding: 6px 7px; font-size: 12px; color: var(--fg4); }
  .soonline { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex: none; font-size: 12px; color: var(--fg4); }
  .soonline span { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; border: 1px dashed #dddbd7; color: var(--fg3); }
  .soonline svg { width: 14px; height: 14px; }
</style>
</head>
<body>
<script src="shared.js"></script>
<script>
(() => {
  const { DAYS, DATES, TODAY, events, deals, ui, ic, esc, inScope, bucket, dueText, shown, isDone, keepFocus } = DX;
  const COLS = ['late', 0, 1, 2, 3, 4, 5, 6, 'later'];
  // 거래가 놓일 세로줄: 정체된 것은 '밀린 것', 날짜가 이번 주면 그 요일, 그 밖은 '그 뒤'
  const DEAL_COL = ['late', 'late', 'later', 'later', 5];
  let focus = TODAY; // 넓혀 볼 세로줄
  const colOf = (t) => (t.off == null ? 'later' : t.off < 0 ? 'late' : TODAY + t.off <= 6 ? TODAY + t.off : 'later');
  const cls = (c) => `${c === TODAY ? ' today' : ''}${typeof c === 'number' && c < TODAY ? ' past' : ''}${c === focus ? ' sel' : ''}`;

  function paint() {
    const area = document.getElementById('area');
    keepFocus(area, () => {
      const tasks = shown();
      const head = COLS.map((c) => { const n = tasks.filter((t) => colOf(t) === c && !isDone(t)).length;
        const label = c === 'late' ? '밀린 것' : c === 'later' ? '그 뒤' : `${DAYS[c]}`;
        return `<button class="hd${c === 'late' && n ? ' late' : ''}${c === TODAY ? ' today' : ''}" data-a="col" data-key="${c}" aria-pressed="${c === focus}" title="이 줄을 넓혀 보기">${typeof c === 'number' ? `<b class="num">${DATES[c]}</b>` : ''}${label}${c === TODAY ? ' · 오늘' : ''}<span class="n num">${n || ''}</span></button>`; }).join('');
      const evRow = COLS.map((c) => { const list = typeof c === 'number' ? events.filter((e) => e.day === c && inScope(e)) : [];
        return `<div class="cell${cls(c)}">${list.map((e) => `<button class="it ev" style="--c:${e.c ?? ''}" data-a="say" data-msg="${esc(e.t)} 일정을 엽니다"><div class="tm">${e.time}</div><div class="tt">${esc(e.t)}</div><div class="mm">${esc(e.m)}</div></button>`).join('')}</div>`; }).join('');
      const tkRow = COLS.map((c) => { const list = tasks.filter((t) => colOf(t) === c);
        return `<div class="cell${cls(c)}">${list.map((t) => `<div class="it tk${isDone(t) ? ' done' : ''}"><button class="chk" role="checkbox" aria-checked="${isDone(t)}" aria-label="${esc(t.t)} ${isDone(t) ? '완료 취소' : '완료 처리'}" data-a="check" data-key="${t.id}"><svg viewBox="0 0 12 12"><path pathLength="1" d="M2.5 6.4l2.4 2.4 4.6-5.3"/></svg></button><div style="min-width:0"><div class="tt">${esc(t.t)}</div><div class="mm">${c === 'late' ? `<span class="late">${dueText(t)}</span> · ` : c === 'later' ? `${dueText(t)} · ` : ''}${esc(t.m)}</div></div></div>`).join('') || (c === 'late' ? '<div class="none">밀린 일이 없어요</div>' : '')}</div>`; }).join('');
      const dlRow = COLS.map((c) => { const list = deals.filter((_, i) => DEAL_COL[i] === c);
        return `<div class="cell${cls(c)}">${list.map((x) => `<button class="it dl" data-a="say" data-msg="${esc(x.t)} 거래를 엽니다"><div class="tt">${esc(x.t.replace('고덕그라시움 ', ''))}</div><div class="mm num">${x.cls === 'warn' ? `<span class="warn">${x.nx}</span>` : `${esc(x.nx)}${x.d ? ' · ' + x.d : ''}`}</div><span class="tag s${x.st}">${x.stl}</span></button>`).join('')}</div>`; }).join('');
      const widths = COLS.map((c) => (c === focus ? '1.9fr' : c === 'late' || c === 'later' ? '1.25fr' : '1fr')).join(' ');
      area.innerHTML = `<div class="wk" style="grid-template-columns:52px ${widths}">
          <div class="hd lab0"></div>${head}
          <div class="lab">${ic('cal')}일정</div>${evRow}
          <div class="lab">${ic('todo')}할 일</div>${tkRow}
          <div class="lab">${ic('deal')}거래</div>${dlRow}
        </div>
        <div class="feed2"><section><div class="fh">${ic('mega')}공지사항<span class="n num">${DX.unread() ? `안 읽음 ${DX.unread()}` : '모두 읽음'}</span></div>${DX.noticeRows(3)}</section><section><div class="fh">${ic('news')}부동산 뉴스</div>${DX.newsRows(3)}</section><div class="soonchip">${ic('site')}관리단지<i>준비 중</i></div></div>`;
    });
  }
  DX.onRender(paint);
  document.addEventListener('dx:act', (e) => {
    const { a, key } = e.detail;
    if (a === 'col') focus = key === 'late' || key === 'later' ? key : +key;
    else if (a === 'jump' || (a === 'tab' && key === 'today')) focus = TODAY; // 알약: 오늘 일정, 남은 업무 → 오늘 줄
    else if (a === 'tab' && key === 'late') focus = 'late';                    // 알약: 기한 지남 → 밀린 것 줄
    else return;
    paint();
    if (a !== 'col') document.querySelector(`[data-a="col"][data-key="${focus}"]`)?.focus();
  });
  DX.start();
})();
</script>
</body>
</html>
