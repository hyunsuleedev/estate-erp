<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B 오늘 처리함</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="shared/base.css">
<style>
.split { flex: 1; min-height: 0; display: grid; grid-template-columns: 336px minmax(0, 1fr); }

/* 왼쪽 처리 목록 */
.queue { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); background: var(--surface-3); }
.q-top { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 9px; }
.progress-line { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.progress-line strong { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
.progress-line span { font-size: 12px; color: var(--muted-strong); }
.progress { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--success); border-radius: 2px; transition: width 0.3s var(--ease); }
.q-tools { display: flex; gap: 8px; align-items: center; }
.q-top .search { flex: none; max-width: none; min-width: 0; }
.q-list { flex: 1; min-height: 0; overflow: auto; padding-bottom: 8px; }
.q-bucket { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; padding: 9px 14px 4px; font-size: 11.5px; font-weight: 700; background: linear-gradient(var(--surface-3) 85%, rgba(251, 250, 248, 0.6)); color: var(--muted-strong); }
.q-bucket.overdue { color: var(--danger-strong); }
.q-bucket.today { color: var(--warning-strong); }
.q-bucket span { font-weight: 400; }
.task { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; width: calc(100% - 12px); margin: 0 6px; padding: 7px 8px; border-radius: 6px; text-align: left; position: relative; }
.task:hover { background: var(--surface-2); }
.task[aria-current="true"] { background: #fff; box-shadow: 0 0 0 1px var(--border-strong), 0 1px 3px rgba(55, 53, 47, 0.08); }
.task-name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-when { font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted-strong); }
.task-when.overdue { color: var(--danger-strong); font-weight: 600; }
.task-when.today { color: var(--warning-strong); font-weight: 600; }
.task-sub { grid-column: 1 / -1; font-size: 12px; color: var(--muted-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-sub b { font-weight: 500; }
.task-sub .k-listing { color: var(--success); }
.task-sub .k-demand { color: var(--info-strong); }
.task-note { grid-column: 1 / -1; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task.done { opacity: 0.5; }
.q-foot { padding: 6px 14px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.q-foot kbd { font: inherit; border: 1px solid var(--border-strong); border-radius: 3px; padding: 0 4px; background: #fff; }

/* 오른쪽 고객 작업 공간 */
.work { min-height: 0; overflow: auto; }
.w-head { display: flex; align-items: flex-start; gap: 12px; padding: 16px 22px 12px; position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid var(--border); }
.w-name { font-size: 21px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.25; }
.w-sub { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 3px; color: var(--muted-strong); }
.w-actions { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
.w-body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; padding: 16px 22px 28px; align-items: start; }
.focus-card { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 7px; margin-bottom: 16px; background: var(--surface); }
.focus-card.overdue { background: var(--danger-soft); color: var(--danger-strong); }
.focus-card.today { background: var(--warning-soft); color: var(--warning-strong); }
.focus-when { font-weight: 700; white-space: nowrap; }
.focus-text { color: var(--fg); min-width: 0; }
.focus-text small { display: block; color: var(--muted-strong); font-size: 12px; }
.w-title { font-size: 12px; font-weight: 600; color: var(--muted-strong); margin: 0 0 8px; }
.icard { border: 1px solid var(--border); border-radius: 8px; padding: 11px 13px; margin-bottom: 8px; background: #fff; }
.icard.focus { border-color: var(--border-strong); box-shadow: 0 1px 4px rgba(55, 53, 47, 0.09); }
.i-top { display: flex; align-items: center; gap: 5px; min-width: 0; }
.i-title { font-weight: 600; font-size: 13.5px; letter-spacing: -0.15px; min-width: 0; }
.i-money { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; align-items: baseline; }
.i-money b { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; font-variant-numeric: tabular-nums; }
.i-money .paused { color: var(--faint); font-weight: 400; }
.i-money span { color: var(--muted-strong); font-size: 12px; }
.i-sub { font-size: 12px; color: var(--muted-strong); margin-top: 2px; }
.icard .stagebar { margin-top: 10px; }
.i-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 12px; color: var(--muted-strong); }
.i-foot .left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tl-wrap { margin-top: 20px; }
.composer-card { position: sticky; top: 84px; border: 1px solid var(--border-strong); border-radius: 8px; padding: 12px; background: #fff; }
.composer-card .w-title { margin-bottom: 8px; }
.unknown-card { max-width: 520px; margin: 40px auto; text-align: center; padding: 0 22px; }
.unknown-card h2 { margin: 10px 0 4px; font-size: 18px; letter-spacing: -0.3px; }
.unknown-card p { color: var(--muted-strong); margin: 0 0 14px; }
.done-all { display: grid; place-items: center; text-align: center; height: 100%; color: var(--muted-strong); padding: 40px; }
.done-all b { display: block; font-size: 17px; color: var(--fg); margin-bottom: 4px; }

@media (max-width: 1240px) {
  .w-body { grid-template-columns: minmax(0, 1fr); }
  .composer-card { position: static; order: -1; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="shared/data.js"></script>
<script src="shared/app.js"></script>
<script>
(function () {
  const D = Demo;
  const { esc, icon } = D;
  const MOD = /Mac/i.test(navigator.platform) ? "⌘" : "Ctrl";
  const view = D.mount({ active: "b", crumb: "오늘 처리함" });
  const S = { scope: D.ME, q: "", sel: null, pin: null, composerFor: null, processed: new Set() };

  view.innerHTML = `<div class="split">
    <aside class="queue" aria-label="처리 목록">
      <div class="q-top">
        <div class="progress-line"><strong id="p-title"></strong><span id="p-sub"></span></div>
        <div class="progress"><i id="p-bar"></i></div>
        <div class="q-tools">
          <div class="seg" id="scope"></div>
        </div>
        <label class="search">${icon("search")}<input id="q" placeholder="고객, 전화번호, 단지명" aria-label="검색"><kbd>/</kbd></label>
      </div>
      <div class="q-list" id="list"></div>
      <div class="q-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> 이동</span><span><kbd>C</kbd> 상담 입력</span><span><kbd>${MOD}</kbd> <kbd>↵</kbd> 저장</span></div>
    </aside>
    <section class="work" id="work" aria-live="polite"></section>
  </div>`;
  const $ = (id) => document.getElementById(id);

  const digits = (s) => s.replace(/\D/g, "");
  function matchQ(it) {
    if (!S.q) return true;
    if (it.title.includes(S.q) || it.sub.includes(S.q)) return true;
    const qd = digits(S.q);
    return it.people.some((p) => { const c = D.contact(p.c); return c.name.includes(S.q) || (qd.length >= 3 && digits(c.phone).includes(qd)); });
  }
  const inScope = (it) => S.scope === "all" || (S.scope === "none" ? !it.assignee : it.assignee === S.scope);
  /* 관계 칩이나 연계 링크로 고른 일은 범위·검색·보류 조건과 상관없이 목록에 남긴다 */
  const queue = () => D.items().filter((i) => i.id === S.pin || (inScope(i) && matchQ(i) && i.status !== "hold")).sort(D.compareItems);

  function renderTop() {
    const scoped = D.items().filter(inScope);
    const urgent = scoped.filter((i) => ["overdue", "today"].includes(D.bucketOf(i))).length;
    const doneN = [...S.processed].filter((id) => inScope(D.item(id))).length;
    const total = urgent + doneN;
    $("p-title").textContent = total ? `오늘 ${total}건 중 ${doneN}건 처리` : "오늘 할 일 없음";
    $("p-sub").textContent = urgent ? `${urgent}건 남음` : "모두 처리";
    $("p-bar").style.width = `${total ? (doneN / total) * 100 : 100}%`;
    const c = (fn) => D.items().filter((i) => fn(i) && i.status !== "hold").length;
    $("scope").innerHTML = [
      [D.ME, "내 담당", c((i) => i.assignee === D.ME)],
      ["all", "전체", c(() => true)],
      ["none", "미배정", c((i) => !i.assignee)],
    ].map(([k, l, n]) => `<button type="button" data-scope="${k}" aria-pressed="${S.scope === k}">${l} <span class="num" style="font-weight:400;color:var(--muted)">${n}</span></button>`).join("");
  }

  function taskHTML(it) {
    const b = D.bucketOf(it);
    const name = it.primary ? D.contact(it.primary).name : "고객 미확인";
    const when = it.next ? `${D.whenText(it.next.at)} ${D.VERB[it.kind]}` : "일정 없음";
    return `<button type="button" class="task${S.processed.has(it.id) ? " done" : ""}" data-sel="${it.id}" aria-current="${S.sel === it.id}">
      <span class="task-name"${it.primary ? "" : ' style="color:var(--warning-strong)"'}>${esc(name)}</span>
      <span class="task-when ${b}">${esc(when)}</span>
      <span class="task-sub"><b class="k-${it.kind}">${D.KIND[it.kind]}</b> ${esc(it.title)}</span>
      ${it.next && it.next.note ? `<span class="task-note">${esc(it.next.note)}</span>` : ""}
    </button>`;
  }
  function renderList() {
    const list = $("list");
    const top = list.scrollTop;
    const q = queue();
    const known = q.filter((i) => i.primary || i.next);
    const unknownOnly = q.filter((i) => !i.primary && !i.next);
    const dates = { today: "11월 3일 화", tomorrow: "11월 4일 수" };
    let html = "";
    D.BUCKET_ORDER.forEach((b) => {
      const part = known.filter((i) => D.bucketOf(i) === b);
      if (part.length) html += `<div class="q-bucket ${b}">${D.BUCKETS[b].label}${dates[b] ? ` · ${dates[b]}` : ""}<span class="num">${part.length}</span></div>${part.map(taskHTML).join("")}`;
    });
    if (unknownOnly.length) html += `<div class="q-bucket">고객 미확인<span class="num">${unknownOnly.length}</span></div>${unknownOnly.map(taskHTML).join("")}`;
    list.innerHTML = html || `<div style="padding:24px 14px;color:var(--muted)">조건에 맞는 일이 없습니다.</div>`;
    list.scrollTop = top;
    const cur = list.querySelector('[aria-current="true"]');
    if (cur) cur.scrollIntoView({ block: "nearest" });
  }

  function itemCard(it, focusId) {
    const lines = D.priceLines(it);
    const people = D.peopleText(it);
    return `<article class="icard${it.id === focusId ? " focus" : ""}">
      <div class="i-top"><span class="badge b-${it.kind}">${D.KIND[it.kind]}</span>${lines.map((l) => `<span class="tx">${D.TX[l.tx]}</span>`).join("")}<span class="i-title trunc">${esc(it.title)}</span>${it.status === "hold" ? `<span class="badge b-hold">보류</span>` : ""}${it.urgent ? `<span class="badge b-urgent">급함</span>` : ""}</div>
      <div class="i-money">${lines.map((l) => `<div><b class="${l.paused ? "paused" : ""}">${esc(l.price)}${l.rent ? ` / ${esc(l.rent)}` : ""}</b>${l.paused ? ` <span>중단</span>` : ""}</div>`).join("")}<span>${esc(D.areaText(it))}</span></div>
      <div class="i-sub">${esc(it.sub)}${people ? ` · ${esc(people)}` : ""}</div>
      ${D.linkHTML(it)}
      ${D.stageBarHTML(it)}
      <div class="i-foot">
        <div class="left">${it.matches.total ? `<span class="num">매칭 ${it.matches.total}건</span>` : `<span>매칭 없음</span>`}${it.memo ? `<span class="trunc" title="${esc(it.memo)}">메모: ${esc(it.memo)}</span>` : ""}</div>
        <div>${D.assignHTML(it)}</div>
      </div>
    </article>`;
  }
  function renderWork() {
    const work = $("work");
    const it = S.sel ? D.item(S.sel) : null;
    /* 선택한 일이 그대로일 때만 입력값을 이어 간다. 다른 일로 옮기면 이전 입력은 그 의뢰에 보관한다. */
    const oldForm = work.querySelector("form");
    const sameTarget = !!oldForm && !!it && S.composerFor === S.sel && oldForm.dataset.composer === it.primary &&
      D.customer(it.primary).items.some((x) => x.id === oldForm.elements.itemId.value);
    const kept = D.beginComposer(oldForm, sameTarget);
    if (!it) {
      work.innerHTML = `<div class="done-all"><div><b>처리할 일이 없습니다</b>왼쪽 목록의 범위를 바꿔 보세요.</div></div>`;
      return;
    }
    if (!it.primary) {
      const lines = D.priceLines(it);
      work.innerHTML = `<div class="unknown-card">
        <span class="badge b-hold">고객 미확인</span>
        <h2>${esc(it.title)}</h2>
        <p>${lines.map((l) => `${D.TX[l.tx]} ${esc(l.price)}${l.rent ? " / " + esc(l.rent) : ""}`).join(", ")} · ${esc(it.sub)}</p>
        <button type="button" class="btn primary" data-connect="${it.id}">${icon("plus")}소유자 연결</button>
        <p style="margin-top:12px;font-size:12px">소유자를 연결해야 상담 기록을 남길 수 있고, 이 의뢰가 그 고객 아래로 옮겨집니다.</p>
      </div>`;
      return;
    }
    const cust = D.customer(it.primary);
    const known = D.knownCustomerIds();
    const b = D.bucketOf(it);
    const scrollTop = work.scrollTop;
    work.innerHTML = `
      <div class="w-head">
        <div style="min-width:0">
          <div class="w-name">${esc(cust.contact.name)}</div>
          <div class="w-sub"><span class="num">${esc(cust.contact.phone)}</span>${D.relChips(cust, known)}</div>
        </div>
        <div class="w-actions">
          <button type="button" class="btn" data-fake="문자 발송은 시안에서 동작하지 않습니다">문자</button>
          <button type="button" class="btn primary" data-fake="전화 연결은 시안에서 동작하지 않습니다">${icon("phone")}전화</button>
        </div>
      </div>
      <div class="w-body">
        <div>
          <div class="focus-card ${b}">
            <span class="focus-when">${it.next ? esc(`${D.whenText(it.next.at)} ${D.VERB[it.kind]}`) : "일정 없음"}</span>
            <div class="focus-text">${it.next && it.next.note ? esc(it.next.note) : "다음 일정을 잡아 주세요"}<small>${D.KIND[it.kind]} · ${esc(it.title)}</small></div>
          </div>
          <h3 class="w-title">진행 의뢰 ${cust.items.length}건</h3>
          ${cust.items.map((x) => itemCard(x, it.id)).join("")}
          <div class="tl-wrap">
            <h3 class="w-title">상담 기록</h3>
            ${D.timelineHTML(cust.id)}
          </div>
        </div>
        <div class="composer-card">
          <h3 class="w-title">상담 남기고 다음으로</h3>
          ${D.composerHTML(cust, kept ? kept.itemId : it.id, { saveLabel: "저장하고 다음으로", hint: `${MOD}+↵ 로 저장하면 바로 다음 일로 넘어갑니다` })}
        </div>
      </div>`;
    D.finishComposer(work.querySelector("form"), kept);
    S.composerFor = S.sel;
    work.scrollTop = scrollTop;
  }
  function render() {
    const q = queue();
    if (!S.sel || !q.some((i) => i.id === S.sel)) S.sel = q[0] ? q[0].id : null;
    renderTop();
    renderList();
    renderWork();
  }
  function select(id) {
    S.sel = id;
    S.composerFor = null; /* 목록에서 고르면 폼도 그 일을 대상으로 다시 연다 */
    $("work").scrollTop = 0;
    render();
  }
  function move(delta) {
    const ids = [...$("list").querySelectorAll("[data-sel]")].map((b) => b.dataset.sel);
    const i = ids.indexOf(S.sel);
    const n = ids[Math.max(0, Math.min(ids.length - 1, i + delta))];
    if (n) select(n);
  }

  view.addEventListener("click", (e) => {
    const sel = e.target.closest("[data-sel]");
    if (sel) { select(sel.dataset.sel); return; }
    const sc = e.target.closest("[data-scope]");
    if (sc) { S.scope = sc.dataset.scope; S.sel = null; S.pin = null; render(); }
  });
  $("q").addEventListener("input", (e) => { S.q = e.target.value.trim(); S.pin = null; render(); });
  document.addEventListener("keydown", (e) => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (typing) {
      if (e.key === "Escape") document.activeElement.blur();
      return;
    }
    if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); move(1); }
    else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); move(-1); }
    else if (e.key === "/") { e.preventDefault(); $("q").focus(); }
    else if (e.key === "c" || e.key === "C") { const ta = $("work").querySelector("textarea"); if (ta) { e.preventDefault(); ta.focus(); } }
  });

  /* 이 화면은 시트를 쓰지 않고 오른쪽 공간을 그대로 바꾼다 */
  const firstOf = (cid) => { const c = D.customer(cid); return (c.items.find((i) => i.status !== "hold") || c.items[0]).id; };
  function goTo(id) {
    S.scope = "all";
    S.q = "";
    $("q").value = "";
    S.pin = id;
    select(id);
  }
  D.handlers.openCustomer = (cid) => goTo(firstOf(cid));
  D.handlers.work = (it) => goTo(it.id);
  D.handlers.jump = (cid, itemId) => goTo(itemId || firstOf(cid));
  D.handlers.saved = (it) => {
    S.processed.add(it.id);
    /* 방금 처리한 일은 아래로 내려갔으니, 아직 처리하지 않은 일 중 가장 급한 것으로 넘어간다 */
    const next = queue().find((x) => !S.processed.has(x.id));
    if (next) S.sel = next.id;
    S.composerFor = null;
    $("work").scrollTop = 0;
    render();
  };
  D.on(render);
  render();
})();
</script>
</body>
</html>
