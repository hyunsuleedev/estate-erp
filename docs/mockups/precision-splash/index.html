<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eef0f2"><title>에스테잇플로우 · 미니멀 3D</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<main aria-label="에스테잇플로우 10초 3D 스플래시">
  <div id="scene" role="img" aria-label="새틴 실버 로고의 두 조각이 정밀하게 정렬되는 애니메이션"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="identity" id="identity"><h1>에스테잇플로우</h1><p>부동산 관리 프로그램</p></div>
  <div class="loading"><span id="status" role="status">시작하는 중</span><span class="track"><i id="progress"></i></span></div>
  <div id="fallback" hidden><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M19.142 32.872 25.370 77.037 65.571 81 63.306 65.995 41.224 63.164 36.977 35.420Z M35.845 19 38.110 34.005 60.758 37.402 64.721 64.580 80.858 66.562 74.347 24.096Z"/></svg><p>3D 화면을 표시할 수 없습니다.</p></div>
</main>
<aside class="controls" aria-label="시안 재생 도구">
 <button id="replay" aria-label="처음부터 다시 재생">↺</button>
 <button id="play" aria-label="일시정지">Ⅱ</button>
 <input id="timeline" type="range" min="0" max="10" step="0.01" value="0" aria-label="애니메이션 구간">
 <output id="time">0.0 / 10.0</output>
 <button data-time="2">시작</button><button data-time="5">스캔</button><button data-time="7.6">결합</button><button data-time="10">완성</button>
</aside>
<script type="module" src="./scene.js"></script>
</body></html>
