<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매물관리 · UI 개선 데모</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="ui.css">
<style>
  .tbl td.prim { padding-right: 44px; }
  #tbl th, #tbl td { padding-left: 10px; padding-right: 10px; }
  #tbl td.prim { padding-right: 44px; }
  #tbl th:last-child, #tbl td.act { padding: 0 12px 0 0; width: 38px; }
  #selbar { bottom: 56px; }
  /* 한 호실에 거래 조건이 여럿: 칸 안에 한 줄씩 */
  .stk { display: flex; flex-direction: column; padding: 5px 0; }
  .stk > div { height: 26px; display: flex; align-items: center; }
  td.r .stk > div { justify-content: flex-end; }
  /* 매칭·광고 펼침 버튼 */
  .ptog {
    height: 24px; display: inline-flex; align-items: center; gap: 4px; padding: 0 5px 0 7px;
    border: 0; border-radius: 6px; background: var(--paper);
    box-shadow: inset 0 0 0 1px var(--line-2); color: var(--text-2);
    font: inherit; font-size: 12px; cursor: pointer; transition: box-shadow 0.12s, background-color 0.12s, color 0.12s;
  }
  .ptog .i { width: 13px; height: 13px; }
  .ptog b { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .ptog .pc { width: 11px; height: 11px; color: var(--text-3); transition: transform 0.16s; }
  .ptog:hover { box-shadow: inset 0 0 0 1px var(--line-3); background: var(--soft); }
  .ptog.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent-ink); }
  .ptog.on b { color: var(--accent-ink); }
  .ptog.on .pc { transform: rotate(180deg); color: var(--accent-ink); }
  .ptog.warn::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--danger); margin-left: 1px; }
  /* 펼친 패널: 행에 붙은 카드 하나. 탭으로 매칭·광고를 오간다 */
  #tbl tr.row-open td { background: color-mix(in srgb, var(--accent) 4%, var(--paper)); border-bottom-color: transparent; }
  #tbl tr.row-open td.gcol { background: color-mix(in srgb, var(--accent) 6%, var(--paper)); }
  #tbl tr.exp > td { padding: 0 !important; height: auto; background: color-mix(in srgb, var(--accent) 4%, var(--paper)) !important; border-right: 0; white-space: normal; }
  .exp-in { position: sticky; left: 0; width: min(1120px, calc(100vw - 268px)); padding: 6px var(--gutter) 18px 46px; }
  .xcard {
    position: relative; border-radius: 14px; background: var(--paper);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 22%, var(--line-2)), 0 14px 32px -14px rgba(16, 24, 40, 0.22), 0 2px 6px rgba(16, 24, 40, 0.04);
  }
  .xcard.anim { animation: xin 0.28s cubic-bezier(0.2, 0.8, 0.2, 1); transform-origin: var(--cx, 40%) top; }
  @keyframes xin { from { opacity: 0; transform: translateY(-8px) scale(0.985); } }
  /* 누른 버튼을 가리키는 꼬리 */
  .xcard::before {
    content: ""; position: absolute; top: -6px; left: calc(var(--cx, 120px) - 6px);
    width: 12px; height: 12px; transform: rotate(45deg); border-radius: 3px 0 0 0;
    background: var(--paper); box-shadow: -1px -1px 0 color-mix(in srgb, var(--accent) 22%, var(--line-2));
    transition: left 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .xhead { display: flex; align-items: center; gap: 4px; height: 46px; padding: 0 10px 0 8px; border-bottom: 1px solid var(--line); }
  .xtab {
    position: relative; height: 30px; display: inline-flex; align-items: center; gap: 7px; padding: 0 10px;
    border: 0; border-radius: 8px; background: transparent; color: var(--text-2);
    font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: background-color 0.12s, color 0.12s;
  }
  .xtab .i { width: 14px; height: 14px; }
  .xtab em { font-style: normal; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 600; background: var(--soft); color: var(--text-2); }
  .xtab:hover { background: var(--hover); color: var(--text); }
  .xtab.on { color: var(--accent-ink); background: var(--accent-soft); }
  .xtab.on em { background: var(--accent); color: #fff; }
  .xtab[disabled] { opacity: 0.4; pointer-events: none; }
  .xhead .sp { flex: 1; }
  .xbody { display: grid; grid-template-columns: repeat(auto-fill, minmax(256px, 1fr)); gap: 10px; padding: 12px; }
  .xbody.anim > * { animation: xitem 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
  .xbody.anim > *:nth-child(2) { animation-delay: 0.04s; }
  .xbody.anim > *:nth-child(3) { animation-delay: 0.08s; }
  .xbody.anim > *:nth-child(4) { animation-delay: 0.12s; }
  @keyframes xitem { from { opacity: 0; transform: translateY(6px); } }
  .xi {
    position: relative; display: flex; flex-direction: column; gap: 10px; padding: 12px 12px 10px;
    border-radius: 11px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2);
    cursor: pointer; transition: box-shadow 0.16s, transform 0.16s;
  }
  .xi:hover { transform: translateY(-2px); box-shadow: inset 0 0 0 1px var(--line-3), 0 10px 22px -10px rgba(16, 24, 40, 0.2); }
  .xi-top { display: flex; align-items: center; gap: 10px; }
  .xi-av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; flex: none; }
  .xi-logo { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; flex: none; }
  .xi-nm { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .xi-sub { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .xi-top > div { min-width: 0; flex: 1; }
  .xi-quick { display: flex; gap: 2px; opacity: 0; transition: opacity 0.14s; }
  .xi:hover .xi-quick, .xi:focus-within .xi-quick { opacity: 1; }
  .xi:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .xi-quick .ib { width: 26px; height: 26px; }
  /* 패널 본문: 한눈에 훑는 촘촘한 줄 */
  .xsum { display: flex; align-items: center; gap: 16px; height: 34px; padding: 0 16px; font-size: 12px; color: var(--text-2); border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--soft) 60%, var(--paper)); }
  .xsum b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; margin-left: 2px; }
  .xsum .t3 { margin-left: auto; }
  .mlist { max-height: 318px; overflow: auto; }
  .mrow { display: grid; grid-template-columns: minmax(170px, 1.1fr) minmax(130px, 0.8fr) 236px minmax(150px, 1.3fr) auto; align-items: center; gap: 14px; min-height: 52px; padding: 6px 10px 6px 16px; border-bottom: 1px solid var(--line); font-size: 13px; transition: background-color 0.1s; }
  .mrow:last-child { border-bottom: 0; }
  .mrow:hover, .mrow:focus-within { background: var(--row-hover); }
  .mrow.closed .mc { opacity: 0.5; }
  .mc { min-width: 0; }
  .mc .l1 { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
  .mc .l1 .nm { font-weight: 600; cursor: pointer; }
  .mc .l1 .ur { font-size: 12px; font-weight: 500; }
  .mc .l2 { display: flex; align-items: center; gap: 5px; margin-top: 1px; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 18px; }
  .mc .l2 .i { width: 12px; height: 12px; color: var(--text-3); }
  .mmemo { display: block; min-width: 60px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; outline: 0; border-radius: 5px; padding: 2px 5px; margin: 0 -5px; cursor: text; }
  .mmemo:hover { background: var(--hover); }
  .mmemo:focus { background: var(--paper); box-shadow: 0 0 0 1.5px var(--accent); text-overflow: clip; }
  .mmemo:empty::before { content: attr(data-ph); color: var(--text-3); }
  .mact { display: flex; align-items: center; gap: 2px; }
  .mact .btn { opacity: 0; transition: opacity 0.12s, background-color 0.12s; }
  .mrow:hover .mact .btn, .mrow:focus-within .mact .btn, .mrow.closed .mact .btn { opacity: 1; }
  /* 단계 트랙: 점 여섯 개를 선으로 잇는다 */
  .trk { display: flex; align-items: center; }
  .nd { position: relative; width: 22px; height: 22px; padding: 0; border: 0; background: transparent; cursor: pointer; flex: none; }
  .nd::after { content: ""; position: absolute; left: 6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--line-3); transition: transform 0.12s, box-shadow 0.12s, background-color 0.12s; }
  .nd::before { content: ""; position: absolute; right: 16px; top: 10px; width: 12px; height: 2px; background: var(--line-2); }
  .nd:first-child::before { display: none; }
  .nd.done::after, .nd.cur::after { background: var(--accent); box-shadow: none; }
  .nd.done::before, .nd.cur::before { background: var(--accent); }
  .nd.cur::after { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .nd:hover::after { transform: scale(1.35); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .nd:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 50%; }
  .trk .lbl { margin-left: 8px; font-size: 12px; font-weight: 600; color: var(--accent-ink); white-space: nowrap; }
  /* 광고 표 */
  .xt { width: 100%; border-collapse: collapse; font-size: 13px; }
  .xt th { height: 30px; padding: 0 12px; text-align: left; font-size: 12px; font-weight: 500; color: var(--text-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
  .xt td { height: 40px; padding: 0 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .xt th:first-child, .xt td:first-child { padding-left: 16px; }
  .xt tr:last-child td { border-bottom: 0; }
  .xt tbody tr:hover td { background: var(--row-hover); }
  .xt .r { text-align: right; }
  .xt .nm { font-weight: 500; }
  .xt .df { font-size: 12px; }
  .xt .xa { text-align: right; width: 1%; padding-right: 8px; }
  /* 바깥 표(#tbl)의 고정 머리·세로선·여백이 안쪽 광고 표에 번지지 않게 되돌린다 */
  #tbl .xt th { position: static; top: auto; height: 30px; padding: 0 12px; background: transparent; border: 0; border-bottom: 1px solid var(--line); cursor: default; }
  #tbl .xt th:hover { background: transparent; }
  #tbl .xt td { height: 40px; padding: 0 12px; background: transparent !important; border: 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  #tbl .xt tbody tr:hover td { background: var(--row-hover) !important; }
  #tbl .xt tr:last-child td { border-bottom: 0; }
  #tbl .xt th:first-child, #tbl .xt td:first-child { padding-left: 16px; }
  #tbl .xt .xa { width: 1%; padding-right: 8px; white-space: nowrap; text-align: right; }
  #tbl .xt .xa .btn { display: inline-flex; vertical-align: middle; }
  .rk { display: inline-flex; align-items: center; gap: 7px; }
  .rkbar { width: 64px; height: 5px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
  .rkbar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  /* 매칭 단계: 네 칸 막대 */
  .steps { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .steps .bar { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
  .steps .bar i { height: 4px; border-radius: 2px; background: var(--line-2); }
  .steps .bar i.on { background: var(--accent); }
  .steps b { font-weight: 600; color: var(--accent-ink); white-space: nowrap; }
  .xi-foot { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); }
  .xi-foot .sp { flex: 1; }
  /* 광고: 가격과 네이버 순위 눈금 */
  .xi-price { display: flex; align-items: baseline; gap: 8px; }
  .xi-price b { font-size: 17px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .rank { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); }
  .rank .track { flex: 1; display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; }
  .rank .track i { height: 14px; border-radius: 2px; background: var(--line-2); }
  .rank .track i.me { background: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent); }
  .rank b { color: var(--text); font-weight: 600; white-space: nowrap; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--ok); }
  .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dot-ok); box-shadow: 0 0 0 0 color-mix(in srgb, var(--dot-ok) 60%, transparent); animation: pulse 1.8s ease-out infinite; }
  .live.off { color: var(--danger); }
  .live.off::before { background: var(--danger); animation: none; }
  @keyframes pulse { to { box-shadow: 0 0 0 7px transparent; } }
  @media (prefers-reduced-motion: reduce) { .xcard.anim, .xbody.anim > *, .live::before { animation: none; } }
  /* 상세 열 묶음: 구글 시트처럼 표 머리 위 얇은 줄에 묶음 선과 +/− 상자를 둔다 */
  #tbl.g-closed .gcol { display: none; }
  #tbl:not(.g-closed) .gtype { display: none; }
  /* 접기 상자: 띠 없이 표 머리 윗선에 걸쳐 놓는다. 위 여백 11px만 쓴다 */
  #tbl thead tr.gs th { top: 0; height: 11px; padding: 0; border: 0; background: var(--paper); cursor: default; z-index: 5; }
  #tbl thead tr.gs th:hover { background: var(--paper); }
  #tbl thead tr:not(.gs) th { top: 11px; border-top: 1px solid var(--line-2); }
  /* 펼치면 묶음 열의 윗선이 굵어져 묶음 범위를 보여 준다 */
  .gline i { position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; background: var(--text-3); z-index: 6; }
  .gbox {
    position: absolute; left: -9px; top: 2px; z-index: 7;
    width: 17px; height: 17px; padding: 0; display: grid; place-items: center;
    border: 0; border-radius: 4px; background: var(--paper);
    box-shadow: inset 0 0 0 1px var(--text-3), 0 1px 2px rgba(16, 24, 40, 0.08);
    color: var(--text-2); cursor: pointer;
    transition: box-shadow 0.12s, color 0.12s;
  }
  .gbox svg { width: 11px; height: 11px; stroke-width: 2.4; }
  .gbox:hover { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent-ink); }
  #tbl th.gcol { background: var(--soft); }
  #tbl td.gcol { background: color-mix(in srgb, var(--soft) 55%, var(--paper)); }
  #tbl tbody tr:hover td.gcol { background: var(--soft); }
  #tbl tbody tr.picked td.gcol { background: var(--picked); }
  #tbl .gend { border-right-color: var(--line-2); }
  #tbl:not(.g-closed) .ganchor { border-right-color: var(--line-2); }

  /* 툴바 두 줄: 실제 앱의 구조 그대로, 모양만 새 부품으로 */
  .tb1, .tb2 { display: flex; align-items: center; gap: 8px; flex: none; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--paper); }
  .tb2 { padding: 8px 12px; border-bottom-color: var(--line-2); }
  .tb1-right, .tb2-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
  .tb2-right { gap: 2px; }
  .tb2-chips { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; overflow-x: auto; scrollbar-width: none; padding: 3px; margin: -3px; }
  .tb2-chips::-webkit-scrollbar { display: none; }
  .ktabs { height: 30px; align-items: center; }
  .ktabs button { height: 26px; padding: 0 12px; cursor: pointer; }
  /* 위치 칸: 검색칸과 같은 흰 입력칸 하나를 가는 세로선으로 단지 │ 동 │ 호 셋으로 나눈다. 테두리·높이·모서리는 검색칸과 같다 */
  .ubar { display: inline-flex; align-items: stretch; height: 30px; border-radius: 8px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2); flex: none; min-width: 0; transition: box-shadow 0.12s; }
  .ubar:hover { box-shadow: inset 0 0 0 1px var(--line-3, #cfccc6); }
  .uloc { display: inline-flex; align-items: center; gap: 7px; width: 208px; padding: 0 9px 0 10px; border: 0; border-radius: 8px 0 0 8px; background: transparent; font: inherit; font-size: 13px; color: var(--text-3); cursor: pointer; transition: background 0.12s; }
  .uloc:hover, .uloc[aria-expanded="true"] { background: var(--hover); }
  .uloc .i { width: 14px; height: 14px; color: var(--text-3); flex: none; }
  .uloc .i:last-child { width: 12px; height: 12px; }
  .uloc .t { flex: 1; text-align: left; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .uloc.on { color: var(--text); font-weight: 600; }
  .uloc.on .i:first-child { color: var(--accent); }
  .uloc:focus-visible { outline: 0; box-shadow: inset 0 0 0 1.5px var(--accent); }
  /* 동·호는 고르는 칸이 아니라 치는 칸이다: 숫자는 굵게, 단위는 옅게 오른쪽에 붙는다 */
  .useg { position: relative; display: inline-flex; align-items: center; gap: 4px; padding: 0 10px; font-size: 13px; color: var(--text-3); cursor: text; flex: none; transition: background 0.12s; }
  .useg::before { content: ''; position: absolute; left: 0; top: 7px; bottom: 7px; width: 1px; background: var(--line-2); }
  .useg.dong { width: 72px; } .useg.ho { width: 80px; border-radius: 0 8px 8px 0; }
  .useg.ho:has(+ .uclr:not([hidden])) { border-radius: 0; }
  .useg:hover { background: var(--hover); }
  .useg input { flex: 1; min-width: 0; width: 0; padding: 0; border: 0; outline: 0; background: transparent; font: inherit; font-weight: 600; color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
  .useg:focus-within { background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .useg:focus-within::before, .useg:focus-within + .useg::before { opacity: 0; }
  .useg:has(input.on) span { color: var(--text-2); }
  .uclr { align-self: center; width: 20px; height: 20px; margin: 0 5px 0 1px; display: inline-grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--text-3); cursor: pointer; flex: none; }
  .uclr:hover { background: var(--press); color: var(--text); }
  .uclr .i { width: 11px; height: 11px; }
  /* 글자 검색은 위치와 떨어진 제 칸을 갖는다 */
  .usearch { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 180px; max-width: 380px; height: 30px; padding: 0 8px 0 10px; border-radius: 8px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2); cursor: text; transition: box-shadow 0.12s; }
  .usearch:hover { box-shadow: inset 0 0 0 1px var(--line-3, #cfccc6); }
  .usearch:focus-within { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .usearch .i { width: 14px; height: 14px; color: var(--text-3); flex: none; }
  .usearch input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 13px; color: var(--text); }
  .usearch input::placeholder { color: var(--text-3); }
  .usearch:focus-within kbd, .usearch:has(input:not(:placeholder-shown)) kbd { display: none; }

  /* 위치 패널: 지역 → 단지 → 동 → 호를 한 면에서 좁혀 간다. 건수는 지금 거래 탭 기준 */
  .locpop { position: fixed; z-index: 60; width: 600px; max-width: calc(100vw - 32px); background: var(--paper); border-radius: 12px; box-shadow: 0 0 0 1px var(--line-2), 0 12px 32px rgba(16, 24, 40, 0.14), 0 2px 6px rgba(16, 24, 40, 0.06); overflow: hidden; animation: lpIn 0.14s ease-out; }
  @keyframes lpIn { from { opacity: 0; transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .locpop { animation: none; } }
  .locpop { width: 736px; }
  .lp-top { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-bottom: 1px solid var(--line-2); }
  .lp-top .i { width: 14px; height: 14px; color: var(--text-3); flex: none; }
  .lp-top input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 13px; color: var(--text); }
  .lp-top input::placeholder { color: var(--text-3); }
  .lp-cols { display: grid; grid-template-columns: 148px 120px 124px 1fr; height: 304px; }

function render() {
  // 단지는 여러 개 고를 수 있다. 하나일 때만 state.f.site(검색어 해석·칩이 쓰는 값)와 같게 맞춘다.
  if (state.f.site) { if (!(state.sites.length === 1 && state.sites[0] === state.f.site)) state.sites = [state.f.site]; }
  else if (state.sites.length === 1) state.sites = [];
  // 법정동이 지금 고른 시도·시군구에 속하지 않으면(검색어가 채웠거나 윗단계가 비어 있으면) 그 법정동의 윗단계로 맞춘다
  if (state.f.ward && !(REGION[state.sido] && (REGION[state.sido][state.gu] || []).includes(state.f.ward))) {
    const p = wardPath(state.f.ward);
    if (p) { state.sido = p[0]; state.gu = p[1]; }
  }
  // 고른 단지가 지역 범위 밖이면(다른 지역을 둔 채 검색어로 단지를 찾은 경우) 지역을 푼다. 범위 안이면 지역은 건드리지 않는다
  if (state.sites.length && (state.sido && state.sido !== HOME[0] || state.gu && state.gu !== HOME[1])) { state.sido = state.gu = ''; delete state.f.ward; }
  // 월세 칩은 전체·월세 탭에서만 보인다. 보이지 않는 조건이 몰래 걸려 있지 않도록,
  // 매매·전세 탭으로 가면 월세 조건을 지운다(어느 경로로 탭이 바뀌든 여기서 한 번에 처리).
  if ((state.view === 'sale' || state.view === 'jeonse') && state.f.rent) delete state.f.rent;
  counts();
  document.getElementById('tbl').classList.toggle('g-closed', !state.detail);
  const gh = document.getElementById('gh');
  gh.title = state.detail ? '타입·매칭·광고·확인 접기' : '타입·매칭·광고·확인 펼치기';
  gh.innerHTML = `<button class="gbox" aria-label="${gh.title}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M5 12h14"/>${state.detail ? '' : '<path d="M12 5v14"/>'}</svg></button>`;
  let rows = DATA.filter(viewTest);
  // 거래 탭·가격·월세는 '같은 조건 하나'가 모두 만족해야 한다.
  // (전세 7억 8,000 + 매매 15억 9,000인 호실이 '매매 + 5억~10억'에 걸리면 안 된다)
  const offerTests = KIND[state.view] ? [(o) => o.kind === state.view] : [];
  for (const d of FDEFS) {
    const v = state.f[d.id];
    if (!v) continue;
    // 고른 값의 매물이 모두 지워져 선택지에서 사라져도 조건은 그대로 건다
    const opt = d.opts().find((o) => o[0] === v);
    if (d.offer) { offerTests.push(opt ? opt[1] : () => false); continue; }
    rows = rows.filter(opt ? opt[1] : (r) => (d.eq ? r[d.eq] === v : false));
  }
  if (offerTests.length) rows = rows.filter((r) => anyOffer(r, (o) => offerTests.every((t) => t(o))));
  rows = rows.filter(regionOk);
  if (state.sites.length > 1) rows = rows.filter((r) => state.sites.includes(r.site));
  if (state.dong) rows = rows.filter((r) => String(r.dong).startsWith(state.dong));
  if (state.ho) rows = rows.filter((r) => String(r.ho).startsWith(state.ho));
  const q = (state.q || '').trim();
  if (q) rows = rows.filter((r) => `${r.site} ${r.dong}동 ${r.ho}호 ${r.memo} ${r.agent} ${r.ads}`.includes(q));
  const visible = new Set(rows.map((r) => r.id));
  for (const id of [...state.picked]) if (!visible.has(id)) state.picked.delete(id);
  if (state.sort) {
    const { key, dir } = state.sort;
    rows = [...rows].sort((a, b) => (key === 'site' ? a.site.localeCompare(b.site, 'ko') || a.dong - b.dong || a.ho - b.ho : a[key] - b[key]) * dir);
  }
  document.getElementById('rows').innerHTML = rows.map(row).join('');
  state.visible = rows.map((r) => r.id);
  const avg = (k) => {
    const v = rows.filter((r) => r.status !== 'done').flatMap((r) => r.offers.filter((o) => o.kind === k).map((o) => o.price));
    return v.length ? won(Math.round(v.reduce((a, b) => a + b, 0) / v.length / 100) * 100) : '–';
  };
  document.getElementById('foot').innerHTML = rows.length

const locQ = document.getElementById('locQ');
const locBase = () => DATA.filter((r) => !KIND[state.view] || anyOffer(r, (o) => o.kind === state.view));
const uniq = (a) => [...new Set(a)];
const SITE_WARD = Object.fromEntries(DATA.map((r) => [r.site, r.ward]));
const ALL_SITES = Object.keys(SITE_WARD).sort((a, b) => a.localeCompare(b, 'ko'));
const setSites = (arr) => { state.sites = arr; if (arr.length === 1) state.f.site = arr[0]; else delete state.f.site; };
const pruneSites = () => setSites(state.sites.filter((x) => regionOk({ ward: SITE_WARD[x] })));
function drawLoc() {

  const it = (attr, v, label, n, on) => `<button class="lp-it${on ? ' on' : ''}${n ? '' : ' zero'}" data-${attr}="${esc(v)}" aria-pressed="${on}"><span class="n">${esc(label)}</span>${cnt(n)}${attr !== 'lward' && v && on ? icon('chevRight') : ''}</button>`;
  const pick = (x) => { const on = state.sites.includes(x); return `<button class="lp-it pick${on ? ' on' : ''}" data-lsite="${esc(x)}" role="checkbox" aria-checked="${on}"><span class="lp-box">${icon('check')}</span><span class="n">${esc(x)}<small>${esc(SITE_WARD[x])}</small></span>${cnt(base.filter((r) => r.site === x).length)}</button>`; };
  const nSido = (a) => (a === HOME[0] ? base.length : 0);
  const nGu = (a, b) => (a === HOME[0] && b === HOME[1] ? base.length : 0);
  const nWard = (a, b, w) => (nGu(a, b) ? base.filter((r) => r.ward === w).length : 0);
  const siteHead = `<h6>단지${state.sites.length ? ` <b>${state.sites.length}개 선택</b>` : ''}</h6>`;
  let html;
  if (q) {
    // 찾기: 지역은 "서울특별시 강동구 고덕동"처럼 전체 경로로, 단지는 이름·법정동으로 맞춘다
    const paths = [];
    for (const [a, gus] of Object.entries(REGION)) {
      if (a.includes(q)) paths.push([a, '', '']);
      for (const [b, ws] of Object.entries(gus)) {
        if (b.includes(q)) paths.push([a, b, '']);
        ws.forEach((w) => { if (w.includes(q)) paths.push([a, b, w]); });
      }
    }
    const sites = ALL_SITES.filter((x) => x.includes(q) || SITE_WARD[x].includes(q));
    html = `<div class="lp-cols find">
      <div class="lp-col"><h6>지역</h6>${paths.map(([a, b, w]) => `<button class="lp-it" data-lpath="${esc([a, b, w].join('|'))}">${icon('pin')}<span class="n">${esc([a, b, w].filter(Boolean).join(' '))}</span>${cnt(w ? nWard(a, b, w) : b ? nGu(a, b) : nSido(a))}</button>`).join('') || '<div class="lp-hint">맞는 지역이 없습니다</div>'}</div>
      <div class="lp-col">${siteHead}${sites.map(pick).join('') || '<div class="lp-hint">일치하는 단지가 없습니다</div>'}</div></div>`;
  } else {
    const gus = state.sido ? Object.keys(REGION[state.sido]) : [];
    const wards = state.gu ? REGION[state.sido][state.gu] : [];
    const sites = ALL_SITES.filter((x) => regionOk({ ward: SITE_WARD[x] }));
    html = `<div class="lp-cols">
      <div class="lp-col"><h6>시도</h6>${it('lsido', '', '전체', base.length, !state.sido)}${Object.keys(REGION).map((a) => it('lsido', a, a, nSido(a), state.sido === a)).join('')}</div>
      <div class="lp-col"><h6>시군구</h6>${state.sido ? it('lgu', '', '전체', nSido(state.sido), !state.gu) + gus.map((b) => it('lgu', b, b, nGu(state.sido, b), state.gu === b)).join('') : '<div class="lp-hint">시도를<br>먼저 고르세요</div>'}</div>
      <div class="lp-col"><h6>법정동</h6>${state.gu ? it('lward', '', '전체', nGu(state.sido, state.gu), !state.f.ward) + wards.map((w) => it('lward', w, w, nWard(state.sido, state.gu, w), state.f.ward === w)).join('') : '<div class="lp-hint">시군구를<br>먼저 고르세요</div>'}</div>
      <div class="lp-col">${siteHead}${sites.map(pick).join('') || '<div class="lp-hint">이 지역에 등록된 단지가 없습니다</div>'}</div></div>`;
  }
  document.getElementById('locBody').innerHTML = html;
  locPop.querySelector('[data-lreset]').hidden = !state.sido;
  const b = document.getElementById('ubar').getBoundingClientRect();
  locPop.style.left = `${Math.max(16, Math.min(b.left, window.innerWidth - locPop.offsetWidth - 16))}px`;
  locPop.style.top = `${b.bottom + 6}px`;
}
function openLoc() { if (!locPop.hidden) return; locQ.value = ''; locPop.hidden = false; render(); locQ.focus({ preventScroll: true }); }
// 닫을 때 화면을 다시 그리지 않는다. 바깥을 누르는 순간(mousedown) 표를 새로 만들면
// 누르던 버튼·행이 바뀌어 그 클릭이 사라지기 때문이다.
function closeLoc(refocus) { if (locPop.hidden) return; locPop.hidden = true; document.getElementById('locBtn').setAttribute('aria-expanded', 'false'); if (refocus) document.getElementById('locBtn').focus(); }
function toggleLoc() { if (locPop.hidden) openLoc(); else closeLoc(); }
locQ.addEventListener('input', drawLoc);
locPop.addEventListener('click', (e) => {
  e.stopPropagation();
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  if ('ldone' in d) { closeLoc(true); return; }
  const key = Object.keys(d)[0], val = d[key];
  if ('lreset' in d) { state.sido = state.gu = ''; delete state.f.ward; }
  // 이미 고른 단계를 다시 눌러도 아랫단계 선택은 그대로 둔다
  else if ('lsido' in d) { if (d.lsido !== state.sido) { state.sido = d.lsido; state.gu = ''; delete state.f.ward; pruneSites(); } }
  else if ('lgu' in d) { if (d.lgu !== state.gu) { state.gu = d.lgu; delete state.f.ward; pruneSites(); } }
  else if ('lward' in d) { if (d.lward) state.f.ward = d.lward; else delete state.f.ward; pruneSites(); }
  else if ('lpath' in d) { const [a, g, w] = d.lpath.split('|'); state.sido = a; state.gu = g; if (w) state.f.ward = w; else delete state.f.ward; pruneSites(); locQ.value = ''; }
  else if ('lsite' in d) setSites(state.sites.includes(d.lsite) ? state.sites.filter((x) => x !== d.lsite) : [...state.sites, d.lsite]);
  manualFilter(true);
  render();
  // 다시 그리면 버튼이 새로 만들어지므로, 키보드로 고르던 자리를 되찾아 준다
  const again = [...locPop.querySelectorAll('button')].find((x) => key in x.dataset && x.dataset[key] === val && !x.hidden);
  if (again) again.focus({ preventScroll: true }); else locQ.focus({ preventScroll: true });
});
document.addEventListener('mousedown', (e) => {
  if (locPop.hidden || locPop.contains(e.target)) return;
  if (e.target.closest('#locBtn')) return; // 버튼은 스스로 여닫는다
  closeLoc();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !locPop.hidden) { e.stopPropagation(); closeLoc(locPop.contains(document.activeElement)); } }, true);
window.addEventListener('resize', () => { if (!locPop.hidden) drawLoc(); });
// '/' 로 검색칸에 바로 들어간다(입력 중이거나 대화상자가 열려 있으면 제외)
document.addEventListener('keydown', (e) => {
  if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
  if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
  // 다른 전역 단축키와 같은 기준: 보이는 대화창·메뉴·서랍·안내창이 하나라도 있으면 쉰다(위치 패널만 예외로 닫고 넘어간다)
  const layer = [...document.querySelectorAll('[role="dialog"], [aria-modal="true"], dialog[open], .cmdk-back, .drawer-back, .keys-back, .menu, .modal, .dlg, .dlg-back, .insp-back, .pop')]
    .some((x) => x !== locPop && !x.hidden && x.getClientRects().length > 0);
  if (layer) return;
  e.preventDefault(); closeLoc(); document.getElementById('qInput').focus();
});
// "그라시움 103 3401", "103-3401", "아르테온 312동" 같은 입력을 단지·동·호로 읽는다.
// 단지 이름은 하나로만 좁혀질 때, 숫자는 동 → 호 순서로 본다. 읽지 못하면 평소처럼 글자 검색이다.
function parseLoc(q) {
  const tokens = q.trim().replace(/(\d+)\s*(동|호)/g, '$1 ').replace(/(\d)-(\d)/g, '$1 $2').split(/\s+/).filter(Boolean);
  if (!tokens.length) return null;
  const sites = [...new Set(DATA.map((r) => r.site))];
  let site = null;
  const nums = [];
  for (const t of tokens) {
    if (/^\d+$/.test(t)) { nums.push(t); continue; }
    const hit = sites.filter((x) => x.includes(t));
    if (hit.length !== 1 || (site && site !== hit[0])) return null;
    site = hit[0];
  }
  if (nums.length > 2 || (!site && nums.length < 2)) return null;
  const noDong = site && DATA.filter((r) => r.site === site).every((r) => !r.dong);
  if (noDong) return nums.length > 1 ? null : { site, dong: '', ho: nums[0] || '' };
  return { site, dong: nums[0] || '', ho: nums[1] || '' };
}
function setLoc(site, dong, ho) {
  if (site) { state.f.site = site; delete state.f.ward; } else { delete state.f.site; state.sites = []; }
  state.dong = dong; state.ho = ho;
  document.getElementById('fDong').value = dong;
  document.getElementById('fHo').value = ho;
}
// 검색어로 위치를 채우기 직전의 위치(직접 고른 것). 검색어를 지우거나 바꾸면 이 상태로 돌아간다.
let locBeforeQ = null;
const locNow = () => ({ ward: state.f.ward, site: state.f.site, sites: [...state.sites], sido: state.sido, gu: state.gu, dong: state.dong, ho: state.ho });
function restoreLoc(v) {
  if (v.ward) state.f.ward = v.ward; else delete state.f.ward;
  if (v.site) state.f.site = v.site; else delete state.f.site;
  state.sites = [...(v.sites || [])]; state.sido = v.sido || ''; state.gu = v.gu || '';
  state.dong = v.dong; state.ho = v.ho;
  document.getElementById('fDong').value = v.dong;
  document.getElementById('fHo').value = v.ho;
}
// 사용자가 필터를 직접 바꿨다: 지금 위치를 사용자의 것으로 확정한다
function manualFilter(isLocation) {
  if (!isLocation) return;
  if (state.locFromQ) {
    // 검색어가 채운 위치를 직접 고쳤다: 검색칸의 글자는 더 이상 이 위치를 뜻하지 않으니 비운다
    document.getElementById('qInput').value = '';
  }
  state.locFromQ = false;
  locBeforeQ = null;
  const site = state.f.site;
  if (site && state.f.ward && !DATA.some((r) => r.site === site && r.ward === state.f.ward)) delete state.f.site;
}
document.getElementById('qInput').addEventListener('input', (e) => {
  const text = e.target.value;
  if (state.locFromQ && locBeforeQ) restoreLoc(locBeforeQ); // 이전 검색어가 채운 위치를 먼저 걷어낸다
  let loc = parseLoc(text);
  if (loc) {
    // 단지를 치지 않았으면 직접 골라 둔 단지 안에서 동·호를 찾는다
    const site = loc.site || state.f.site || null;
    const hit = DATA.some((r) => (!site || r.site === site) && String(r.dong).startsWith(loc.dong) && String(r.ho).startsWith(loc.ho));
    if (!hit) loc = null; // 그런 동·호가 없으면(전화번호 뒷자리 등) 글자 검색으로 넘긴다
    else loc.site = site;
  }
  if (loc) {
    if (!state.locFromQ) locBeforeQ = locNow();
    if (loc.site) { state.f.site = loc.site; if (state.f.ward && !DATA.some((r) => r.site === loc.site && r.ward === state.f.ward)) delete state.f.ward; }
    state.dong = loc.dong; state.ho = loc.ho;
    document.getElementById('fDong').value = loc.dong;
    document.getElementById('fHo').value = loc.ho;
    state.q = ''; state.locFromQ = true;
  } else {
    state.locFromQ = false; locBeforeQ = null;
    state.q = text;
  }
  render();
});
// 매칭 메모: 입력하는 대로 저장해 두고(다시 그려도 남음), 칸을 벗어나면 알린다
document.addEventListener('input', (e) => {
  const el = e.target.closest('.mmemo');
  if (!el) return;
  const r = DATA.find((x) => x.id === +el.closest('tr').dataset.exp);
  r.matches[+el.closest('.mrow').dataset.m].memo = el.textContent.replace(/\n/g, ' ').trim();
  el.dataset.dirty = '1';
});
document.addEventListener('focusout', (e) => {
  const el = e.target.closest && e.target.closest('.mmemo');
  if (!el) return;
  if (!el.textContent.trim()) el.textContent = '';
  if (el.dataset.dirty) { delete el.dataset.dirty; UI.toast('매칭 메모를 저장했습니다'); }
});
document.getElementById('fDong').addEventListener('input', (e) => { state.dong = e.target.value.trim(); manualFilter(true); render(); });
document.getElementById('fHo').addEventListener('input', (e) => { state.ho = e.target.value.trim(); manualFilter(true); render(); });
document.addEventListener('keydown', (e) => {
  if (e.isComposing || e.keyCode === 229) return; // 한글 조합 확정용 Enter는 저장으로 치지 않는다
  if (e.key === 'Enter' && e.target.matches('.mmemo')) { e.preventDefault(); e.target.blur(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); document.getElementById('qInput').focus(); }
  if (e.key === 'Escape') { document.getElementById('filterPop').hidden = true; state.picked.clear(); render(); }
});

render();

UI.notes(
  [
    '<b>툴바는 실제 앱과 같은 두 줄</b>입니다. 윗줄은 거래 탭 · 통합 검색(지역·단지 | 동 | 호 | 검색) · 목록/지도 · 새 매물 등록, 아랫줄은 매물상태 · 가격 · 월세 · 공급평형 · 방/욕실 · + 필터, 오른쪽에 초기화와 컬럼입니다. 제목 줄, 개수 표시, CP에서 가져오기는 뺐습니다.',
    '<b>가격 칩 이름</b>은 실제 앱처럼 거래 탭을 따라 가격/보증금 · 매매가 · 전세가 · 보증금으로 바뀌고, 월세 칩은 전체·월세 탭에서만 나옵니다. 입주일·광고는 "+ 필터"에서 고르면 칩으로 나타납니다.',
    '<b>검색칸에 "그라시움 103 3401"이나 "103-3401"</b>을 치면 단지·동·호 칸이 채워집니다. 실제 앱에 없는 추가 동작입니다.',
    '<b>표 머리</b>는 흰 바탕에 열 종류 아이콘, 접는 열 묶음은 머리 윗선 위의 작은 + / − 상자입니다.',
    '<b>한 호실에 거래 조건이 여럿</b>이면 거래·가격/보증금·월세가 칸 안에 한 줄씩 쌓입니다. 매칭·광고는 묶음을 펼친 뒤 숫자 버튼으로 행 아래에 엽니다.',
  ],
  '구조는 지금 매물관리 화면 그대로 두고, 부품의 모양과 반응만 바꿨습니다.',
);
</script>
