<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐시플로우 · UI 개선 데모</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="cashflow-shared.css">
<style>
  .vbar .note { align-self: center; margin-left: auto; font-size: 12px; color: var(--text-2); }
</style>
</head>
<body data-active="cashflow">
<main id="page">
  <div class="ph">
    <h1>캐시플로우</h1>
    <div class="meta" id="meta"></div>
    <div class="actions">
      <a class="btn quiet" href="cashflow-ledger.html?view=kanban" data-icon="board">칸반</a>
      <a class="btn quiet" href="cashflow-ledger.html?view=calendar" data-icon="cal">캘린더</a>
      <a class="btn primary" href="cashflow-ledger.html">수금 원장<span data-icon="chevRight" style="display:contents"></span></a>
    </div>
  </div>

  <div class="vbar" id="vbar"></div>
  <div class="kpis" id="kpis"></div>

  <div class="two">
    <section id="today" aria-label="오늘 처리할 것"></section>
    <div>
      <section id="trend" aria-label="월별 수금"></section>
      <section id="contracts"></section>
    </div>
  </div>
</main>

<script src="shell.js"></script>
<script src="cashflow-shared.js"></script>
<script>
const { icon } = UI;
const C = CF;
const { man, esc } = C;
const $ = (id) => document.getElementById(id);

const state = { month: { ...C.THIS }, shut: new Set(), mode: 'chart' };
const isThisMonth = () => state.month.year === C.THIS.year && state.month.month === C.THIS.month;

// ── 오늘 처리할 것: 고른 달과 상관없이 항상 지금 기준 ──
const nameCell = (d, p, sub) => `<div class="who2"><a class="tr-link" data-deal="${d.id}" data-payid="${p.id}" role="button" tabindex="0">${esc(C.loc(d))}</a><span title="${esc(sub)}">${esc(sub)}</span></div>`;
const who = (d, p) => [C.sideLabel(p.side), C.payer(d, p)].filter(Boolean).join(' · ');
const rb = (act, label, id, cls = '') => `<button class="btn sm ${cls}" data-q="${act}" data-id="${id}">${label}</button>`;
function section(key, ic, label, count, amount, rows, danger) {
  if (!count) return '';
  const shut = state.shut.has(key);
  return `<button class="q-h ${shut ? 'shut' : ''}" data-sec="${key}" aria-expanded="${!shut}">${icon('chevDown', 'chev')}${icon(ic, `qi ${danger ? 'danger-t' : ''}`)}<b>${label}</b><span class="n">${count}</span><span class="am">${man(amount)}</span></button>${shut ? '' : rows}`;
}
function todayHtml() {
  const q = C.todayQueue();
  const adj = C.pendingAdj();
  const total = q.overdue.length + adj.length + q.dueSoon.length + q.tax.length;
  const sum = (list) => list.reduce((a, x) => a + x.remaining, 0);
  const head = `<div class="pane-h">오늘 처리할 것 <span class="n">${total}</span></div>`;
  if (!total) return `${head}<div class="empty"><b>지금 처리할 일이 없습니다</b>연체, 승인 대기, 7일 내 수금 예정이 모두 없습니다.</div>`;
  return head
    + section('overdue', 'info', '연체', q.overdue.length, sum(q.overdue), q.overdue.map(({ d, p, due, remaining }) => `<div class="q-row">${nameCell(d, p, who(d, p))}<div class="when danger-t">${C.rel(due)}</div><div class="amt">${man(remaining)}</div><div class="acts">${rb('dun', '독촉', p.id)}${rb('collect', '수금 처리', p.id)}</div></div>`).join(''), true)
    + section('adj', 'sliders', '조정 승인 대기', adj.length, adj.reduce((a, x) => a + x.amount, 0), adj.map((a) => {
      const p = C.PAY[a.payId];
      const d = C.dealOf(p);
      // 바로 승인할 수 없는 조정(남은 금액보다 큰 할인 등)은 검토 창에서 이유를 보여 준다
      return `<div class="q-row"><div class="who2"><a class="tr-link" data-q="review" data-id="${a.id}" role="button" tabindex="0">${esc(C.loc(d))}</a><span title="${esc(a.reason)}">${C.ADJ_LABEL[a.type]} · ${esc(a.reason)}</span></div><div class="when"></div><div class="amt">${man(a.amount)}</div><div class="acts">${rb('reject', '반려', a.id)}${C.adjProblem(a, p) ? rb('review', '검토', a.id, 'primary') : rb('approve', '승인', a.id, 'primary')}</div></div>`;
    }).join(''))
    + section('soon', 'clock', '7일 내 수금 예정', q.dueSoon.length, sum(q.dueSoon), q.dueSoon.map(({ d, p, due, remaining }) => `<div class="q-row">${nameCell(d, p, who(d, p))}<div class="when">${C.rel(due)}</div><div class="amt">${man(remaining)}</div><div class="acts">${rb('collect', '수금 처리', p.id)}</div></div>`).join(''))
    + section('tax', 'file', '세금계산서 미기록', q.tax.length, q.tax.reduce((a, x) => a + C.received(x.p), 0), q.tax.map(({ d, p }) => `<div class="q-row">${nameCell(d, p, who(d, p))}<div class="when">${C.short(p.paid)} 수금</div><div class="amt">${man(C.received(p))}</div><div class="acts">${rb('tax', '계산서 기록', p.id)}</div></div>`).join(''));
}

// ── 월별 수금: 지난 달까지는 실제 수금, 이번 달부터는 예정을 함께 쌓는다 ──
const niceStep = (peak) => (peak <= 500 ? 100 : peak <= 1000 ? 250 : peak <= 6000 ? 1000 : peak <= 12000 ? 2000 : 5000);
const topPath = (x, top, w, h) => { const r = Math.min(4, h); return `M${x} ${top + h}V${top + r}Q${x} ${top} ${x + r} ${top}H${x + w - r}Q${x + w} ${top} ${x + w} ${top + r}V${top + h}Z`; };
let bars = [];
function chartHtml() {
  const width = Math.max(280, ($('trend').clientWidth || 420) - 32);
  const H = 172; const left = 40; const right = 4; const top = 18; const bottom = 24;
  const expense = bars[0] ? bars[0].expense : 0;
  const peak = Math.max(...bars.map((b) => b.collected + b.forecast), expense, 1);
  const step = niceStep(peak);
  const max = Math.ceil(peak / step) * step;
  const y = (v) => top + (H - top - bottom) * (1 - v / max);
  const band = (width - left - right) / Math.max(1, bars.length);
  const bw = Math.min(24, Math.round(band * 0.5));
  let g = '';
  for (let v = 0; v <= max; v += step) g += `<line x1="${left}" x2="${width - right}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(${v ? '--line' : '--line-3'})"/><text x="${left - 8}" y="${y(v) + 4}" text-anchor="end">${v.toLocaleString('ko-KR')}</text>`;
  bars.forEach((b, i) => {
    const x = left + band * i + (band - bw) / 2;
    const base = y(0);
    const dh = base - y(b.collected);
    const ph = base - y(b.forecast);
    const on = b.year === state.month.year && b.month === state.month.month;
    const total = b.collected + b.forecast;
    g += `<g class="bar" data-bar="${i}" role="button" tabindex="0" aria-label="${b.label} 수금 ${man(b.collected)}, 예정 ${man(b.forecast)}, 고정비 ${man(b.expense)}">
      <rect class="hit" x="${left + band * i + 1}" y="${top - 14}" width="${Math.max(0, band - 2)}" height="${H - top - bottom + 14}" rx="4"/>
      ${dh > 0 ? (b.forecast > 0 ? `<rect class="c-done" x="${x}" y="${base - dh}" width="${bw}" height="${dh}"/>` : `<path class="c-done" d="${topPath(x, base - dh, bw, dh)}"/>`) : ''}
      ${ph > 0 ? `<path class="c-plan" d="${topPath(x, base - dh - ph, bw, Math.max(1, ph - (dh > 0 ? 2 : 0)))}"/>` : ''}
      ${on && total > 0 ? `<text class="on" x="${x + bw / 2}" y="${y(total) - 5}" text-anchor="middle" style="paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round">${total.toLocaleString('ko-KR')}</text>` : ''}
      <text class="${on ? 'on' : ''}" x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${b.label}</text></g>`;
  });
  g += `<line x1="${left}" x2="${width - right}" y1="${y(expense)}" y2="${y(expense)}" style="stroke:var(--text-2);stroke-width:1.5;pointer-events:none"/>`;
  return `<div class="chart"><div class="lg"><span><i class="c-done"></i>수금</span><span><i class="c-plan"></i>예정</span><span><i class="ln"></i>월 고정비 ${man(expense)}</span><span class="u">단위 만원</span></div>
    <svg role="group" aria-label="월별 수금 막대 차트" viewBox="0 0 ${width} ${H}" height="${H}">${g}</svg><div class="tip" id="tip" hidden></div></div>`;
}
function trendHtml() {
  bars = C.trendBars();
  const seg = `<div class="seg" role="group" aria-label="보기 방식"><button data-mode="chart" class="${state.mode === 'chart' ? 'on' : ''}">차트</button><button data-mode="table" class="${state.mode === 'table' ? 'on' : ''}">표</button></div>`;
  const body = state.mode === 'chart' ? chartHtml() : `<table class="mini-t"><thead><tr><th>월</th><th>수금</th><th>예정</th><th>고정비</th><th>순이익</th></tr></thead><tbody>${bars.map((b, i) => `<tr data-bar="${i}" class="${b.year === state.month.year && b.month === state.month.month ? 'on' : ''}"><td>${b.label}</td><td>${man(b.collected)}</td><td>${man(b.forecast)}</td><td>${man(b.expense)}</td><td class="${b.net < 0 ? 'danger-t' : ''}">${man(b.net)}</td></tr>`).join('')}</tbody></table>`;
  return `<div class="pane-h">월별 수금${seg}</div>${body}`;
}

function contractsHtml() {
  const { year, month } = state.month;
  const list = C.monthContracts(year, month);
  const t = list.reduce((a, d) => { const r = C.rollup(d.pays); a.billed += r.billed; a.collected += r.collected; return a; }, { billed: 0, collected: 0 });
  return `<div class="pane-h">${month}월 계약 수수료 <span class="n">${list.length}</span>${list.length ? `<span class="r">${man(t.billed)} · 수금 ${C.percent(t.collected, t.billed)}%</span>` : ''}</div>`
    + (list.length ? list.map((d) => { const r = C.rollup(d.pays); const pc = C.percent(r.collected, r.billed); return `<button class="c-row" data-deal="${d.id}"><span class="cell"><span class="nm">${esc(C.loc(d))}</span>${C.typeTag(d.type)}</span><span class="a">${man(r.billed)}</span><span class="p">${pc}%<span class="meter"><i style="width:${pc}%"></i></span></span></button>`; }).join('') : '<p class="pane-empty">이 달에 새로 계약된 거래가 없습니다.</p>');
}

function render() {
  const { year, month } = state.month;
  const key = C.monthKey(year, month);
  const prev = C.stepMonth(state.month, -1);
  const collected = C.collectedIn(key);
  const expense = C.expenseTotal();
  const net = collected - expense;
  const owed = C.monthlyOwed(year, month);
  const contracts = C.monthContracts(year, month);
  const billed = contracts.reduce((a, d) => a + C.rollup(d.pays).billed, 0);

  $('vbar').innerHTML = `${C.mstep(state.month)}${isThisMonth() ? '' : '<button class="btn quiet sm" data-now>이번 달로</button>'}<span class="note">맨 위 숫자는 고른 달, 오늘 처리할 것은 항상 지금 기준입니다</span>`;
  $('kpis').innerHTML = C.kpi('수금', man(collected), `${prev.month}월 ${man(C.collectedIn(C.monthKey(prev.year, prev.month)))}`, 'eq')
    + '<div class="kpi-op" aria-hidden="true">−</div>'
    + C.kpi('고정비', man(expense), '<a href="cashflow-expenses.html">고정비 설정</a>', 'eq')
    + '<div class="kpi-op" aria-hidden="true">=</div>'
    + C.kpi('순이익', `<span class="${net < 0 ? 'danger-t' : ''}">${man(net)}</span>`, '직원·파트너 배분 전', 'eq')
    + '<span class="grow"></span>'
    + C.kpi('받을 돈', man(owed.pending + owed.overdue), `${owed.overdue > 0 ? `<span class="danger-t">연체 ${man(owed.overdue)}</span>` : '연체 없음'}${isThisMonth() && owed.dueSoon > 0 ? ` · 7일 내 ${man(owed.dueSoon)}` : ''}`)
    + C.kpi(`${month}월 계약 수수료`, man(billed), `계약 ${contracts.length}건`);
  const top = $('today').scrollTop;
  $('today').innerHTML = todayHtml();
  $('today').scrollTop = top;
  $('trend').innerHTML = trendHtml();
  $('contracts').setAttribute('aria-label', `${month}월 계약 수수료`);
  $('contracts').innerHTML = contractsHtml();
}
C.onChange = render;
C.fillIcons();

document.addEventListener('click', (e) => {
  const t = e.target;
  const ms = t.closest('[data-mstep]');
  if (ms) { state.month = C.stepMonth(state.month, +ms.dataset.mstep); render(); return; }
  if (t.closest('[data-now]')) { state.month = { ...C.THIS }; render(); return; }
  const sec = t.closest('[data-sec]');
  if (sec) { state.shut.has(sec.dataset.sec) ? state.shut.delete(sec.dataset.sec) : state.shut.add(sec.dataset.sec); render(); return; }
  const mode = t.closest('[data-mode]');
  if (mode) { state.mode = mode.dataset.mode; render(); return; }
  const bar = t.closest('[data-bar]');
  if (bar) { const b = bars[+bar.dataset.bar]; state.month = { year: b.year, month: b.month }; render(); return; }
  const qa = t.closest('[data-q]');
  if (qa) {
    const { q, id } = qa.dataset;
    if (q === 'review' || q === 'approve' || q === 'reject') {
      const a = C.ADJ.find((x) => x.id === id);
      ({ review: C.decideDlg, approve: C.approveAdj, reject: C.rejectAdj })[q](a);
    } else C.payAction(q, C.PAY[id]);
    return;
  }
  const dl = t.closest('[data-deal]');
  if (dl && !t.closest('#cfPeek')) C.openDeal(dl.dataset.deal, dl.dataset.payid);
});
// 막대에 올리면 그달의 수금·예정·고정비·순이익을 보여 준다
function showTip(barEl, x, yPos) {
  const tip = $('tip');
  if (!tip) return;
  if (!barEl) { tip.hidden = true; return; }
  const b = bars[+barEl.dataset.bar];
  tip.innerHTML = `<div>${b.year}년 ${b.month}월</div><div>수금<b>${man(b.collected)}</b></div>${b.forecast > 0 ? `<div>예정<b>${man(b.forecast)}</b></div>` : ''}<div>고정비<b>${man(b.expense)}</b></div><div>순이익<b>${man(b.net)}</b></div>`;
  tip.hidden = false;
  const box = tip.parentElement.getBoundingClientRect();
  tip.style.left = `${Math.max(0, Math.min(x - box.left + 12, box.width - 170))}px`;
  tip.style.top = `${Math.max(0, yPos - box.top - 20)}px`;
}
$('trend').addEventListener('mousemove', (e) => showTip(e.target.closest && e.target.closest('g.bar'), e.clientX, e.clientY));
$('trend').addEventListener('mouseleave', () => showTip(null));
$('trend').addEventListener('focusin', (e) => { const g = e.target.closest && e.target.closest('g.bar'); if (g) { const r = g.getBoundingClientRect(); showTip(g, r.right, r.top + 40); } });
$('trend').addEventListener('focusout', () => showTip(null));
document.addEventListener('keydown', (e) => {
  if (e.isComposing || e.keyCode === 229) return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 120); });

render();

UI.notes(
  [
    '<b>맨 위 줄은 식으로 읽습니다</b>: 수금 − 고정비 = 순이익. 카드 상자 없이 큰 숫자와 한 줄 설명만 두었고, 월 목표는 넣지 않았습니다. 오른쪽에 받을 돈(연체·7일 내)과 그달 계약 수수료가 있습니다.',
    '<b>오늘 처리할 것</b>은 연체 · 조정 승인 대기 · 7일 내 수금 예정 · 세금계산서 미기록 네 묶음의 촘촘한 줄입니다. 줄마다 독촉, 수금 처리, 승인·반려·검토, 계산서 기록 버튼이 그대로 있고, 처리하면 그 자리에서 건수와 합계가 다시 계산됩니다.',
    '<b>월별 수금</b>은 차트와 표를 바꿔 볼 수 있습니다. 막대를 누르면 그달로 옮겨 가고, 올리면 수금·예정·고정비·순이익이 뜹니다. 가로선은 월 고정비입니다.',
    '<b>달 이동</b>은 위쪽 화살표로 하고, 다른 달을 보고 있으면 "이번 달로"가 나타납니다.',
    '<b>이름을 누르면 거래 상세</b>가 오른쪽에서 열려 청구별 처리와 공동중개 분배를 바로 할 수 있습니다.',
    '수금 처리·승인 같은 변경은 <b>알림에서 실행 취소</b>할 수 있습니다. 그 뒤에 값이 다시 바뀌었으면 되돌리지 않습니다.',
  ],
  '이번 달 돈의 흐름과 오늘 할 일을 한 화면에서 봅니다.',
);
</script>
</body>
</html>
