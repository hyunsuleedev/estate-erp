<html lang="ko">

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

  #tbl th:last-child, #tbl td:last-child { padding-right: 14px; }
  #tbl td.site { max-width: 104px; overflow: hidden; text-overflow: ellipsis; }
  #tbl td.feat { max-width: 132px; min-width: 76px; overflow: hidden; text-overflow: ellipsis; }
  #tbl td.memo { width: 100%; max-width: 0; min-width: 96px; overflow: hidden; text-overflow: ellipsis; }
  #tbl td.hoc { min-width: 68px; }
  #tbl tr.gone td { color: var(--text-3); }
  #tbl tr.gone .pr { text-decoration: line-through; text-decoration-color: var(--line-3); }
  #tbl tr.row-open > td { background: color-mix(in srgb, var(--accent) 4%, var(--paper)); border-bottom-color: transparent; }
  /* 바로 고치는 칸 */
  .edit { display: inline-block; min-width: 44px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; outline: none; border-radius: 4px; padding: 2px 4px; margin: 0 -4px; cursor: text; }
  .edit:hover { background: var(--hover); }
  .edit:focus { background: var(--paper); box-shadow: 0 0 0 1.5px var(--accent); text-overflow: clip; }
  .edit:empty::before { content: attr(data-ph); color: var(--text-3); opacity: 0; }
  tr:hover .edit:empty::before, .edit:empty:focus::before { opacity: 1; }
  /* 변동: 하락 파랑, 상승 빨강 */
  .chg { display: inline-flex; flex-direction: column; margin-left: 6px; font-size: 12px; font-weight: 500; line-height: 1.25; font-variant-numeric: tabular-nums; vertical-align: middle; text-align: left; }
  .pcell { display: inline-flex; align-items: center; font-weight: 600; }
  .myad { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 6px; border-radius: 4px; background: var(--tg-blue-bg); color: var(--tg-blue); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .myad::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .own { font-size: 12px; font-weight: 500; color: var(--ok); }

  .rkb:hover { background: var(--hover); }
  .rkb b { font-weight: 600; color: var(--text); }
  .rkb.behind b { color: var(--warn); }
  .rkb.solo b { color: var(--text-2); }
  .rkb .i { width: 12px; height: 12px; color: var(--text-3); transition: transform 0.15s; }
  .rkb.on { background: var(--accent-soft); }
  .rkb.on .i { transform: rotate(180deg); }
  /* 묶음 열 접기 */
  .gtog { width: 18px; height: 18px; padding: 0; margin-left: 6px; border: 0; border-radius: 4px; display: inline-grid; place-items: center; vertical-align: -4px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-3); color: var(--text-2); cursor: pointer; }
  .gtog:hover { box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent-ink); }

  #tbl td.gcol { background: color-mix(in srgb, var(--soft) 55%, var(--paper)); }

  .fsel, .fin, .ftog {
    height: 30px; border: 0; border-radius: 8px; background: var(--paper);
    box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 2px rgba(16, 24, 40, 0.04);
    font: inherit; font-size: 13px; color: var(--text); letter-spacing: inherit;
    transition: box-shadow 0.12s, background-color 0.12s;
  }
  .fsel, .ftog { display: inline-flex; align-items: center; gap: 6px; padding: 0 8px 0 10px; cursor: pointer; white-space: nowrap; }
  .ftog { padding: 0 10px; color: var(--text-2); }
  .ftog .i { width: 12px; height: 12px; }
  .fsel:hover, .fin:hover, .ftog:hover { box-shadow: inset 0 0 0 1px var(--line-3), 0 1px 2px rgba(16, 24, 40, 0.04); }
  .fsel .k { color: var(--text-2); }
  .fsel .v { font-weight: 500; }
  .fsel > .i { width: 12px; height: 12px; color: var(--text-3); }
  .fsel.on, .fin.on, .ftog.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
  .fsel.on .k { color: var(--accent-ink); opacity: 0.75; }
  .fsel.on .v, .fin.on, .ftog.on { color: var(--accent-ink); font-weight: 500; }
  .fsel .clr { width: 16px; height: 16px; display: grid; place-items: center; border-radius: 4px; color: var(--accent-ink); }

  .fsel .clr .i { width: 11px; height: 11px; }
  .fin { width: 58px; padding: 0 10px; outline: 0; font-variant-numeric: tabular-nums; }
  .fin.wide { width: 150px; }
  .fin::placeholder { color: var(--text-2); }
  .fin:focus { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  #fbar [data-clear] { margin-left: auto; }
  .ph .meta .lnk.on { background: var(--accent-soft); color: var(--accent-ink); }
  .ph .meta .lnk.on b { color: var(--accent-ink); }

  .snapbar { flex: none; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px var(--gutter); background: color-mix(in srgb, var(--dot-warn) 9%, var(--paper)); border-top: 1px solid var(--line-2); font-size: 13px; white-space: nowrap; }

  .inp { height: 32px; border: 0; border-radius: 8px; padding: 0 10px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2); font: inherit; font-size: 13px; color: var(--text); outline: 0; min-width: 0; }

<main id="page">
  <div class="ph">
    <h1>광고노트</h1>
    <div class="meta" id="cmp"></div>
    <div class="actions" id="acts"></div>
  </div>

    <div class="vtab" data-kind="monthly">월세 <span class="n"></span></div>
    <div class="vtools">
      <label class="field" data-icon="search" style="width:240px"><input id="q" placeholder="단지, 특징, 메모, 부동산" aria-label="광고노트 통합 검색"><kbd>⌘F</kbd></label>
      <button class="btn quiet sm" id="sortBtn"></button>
    </div>
  </div>

  <div class="fbar show" id="fbar">
    <span id="fSite"></span>
    <input class="fin" id="fDong" placeholder="동" inputmode="numeric" aria-label="동">
    <input class="fin" id="fHo" placeholder="호" inputmode="numeric" aria-label="호">
    <span class="vsep"></span>
    <span id="fTog" style="display:contents"></span>
    <span id="fRange" style="display:contents"></span>
    <input class="fin wide" id="fFeat" placeholder="특징·메모 검색" aria-label="특징·메모 필터">
    <button class="btn quiet sm" data-clear hidden>초기화</button>
  </div>

  <div id="snap"></div>

  <div class="scroll" id="scroll">
    <table class="tbl" id="tbl"><thead id="head"></thead><tbody id="rows"></tbody></table>
    <div class="sumbar" id="foot"></div>
  </div>
</main>

function dlg({ title, desc = '', body = '', okLabel = '확인', cancelLabel = '취소', width = 440, ok }) {
  const back = document.createElement('div');

  back.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" style="--w:${width}px"><h3>${title}</h3>${desc ? `<p class="dd">${desc}</p>` : ''}${body ? `<div class="db">${body}</div>` : ''}<div class="df"><button class="btn" data-x>${cancelLabel}</button><button class="btn primary" data-ok>${okLabel}</button></div></div>`;
  document.body.append(back);
  const close = () => back.remove();
  const submit = () => {
    const v = {};
    back.querySelectorAll('[data-f]').forEach((el) => { v[el.dataset.f] = el.value.trim(); el.classList.remove('bad'); });
    const bad = ok ? ok(v) : null;
    if (bad) { const el = back.querySelector(`[data-f="${bad}"]`); if (el) { el.classList.add('bad'); el.focus(); } return; }
    close();
  };
  back.addEventListener('mousedown', (e) => { if (e.target === back) close(); });
  back.addEventListener('click', (e) => { if (e.target.closest('[data-x]')) close(); else if (e.target.closest('[data-ok]')) submit(); });
  back.addEventListener('keydown', (e) => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Escape') { e.stopPropagation(); close(); } else if (e.key === 'Enter' && e.target.matches('input')) { e.preventDefault(); submit(); }
  });
  (back.querySelector('[data-f]') || back.querySelector('[data-ok]')).focus();
}

  }
  if (t.closest('#cancelBtn')) {
    dlg({ title: '작업을 취소하시겠습니까?', desc: '세션 락이 해제됩니다. 세션 중 입력한 신규 매물은 그대로 유지됩니다.', okLabel: '세션 취소', cancelLabel: '계속 입력', ok: () => { sessGroups().forEach((g) => g.ads.forEach((a) => { a.entered = false; })); state.session = null; state.open.clear(); render(); UI.toast('스냅샷을 취소했습니다. 기존 광고는 내려가지 않습니다'); } });
    return;
  }
  if (t.closest('#doneBtn')) {
    const r = received(), p = pending();
    dlg({
      title: r === 0 ? '입력된 광고가 없습니다. 모두 내릴까요?' : '스냅샷을 완료하시겠습니까?',
      desc: r === 0
        ? `이 단지·거래유형의 광고 ${p}건이 모두 내려갑니다. 닫은 뒤에는 광고를 수정하거나 지울 수 없고, 호수와 메모는 유지됩니다.`
        : `${p === 0 ? `입력한 광고 ${r}건이 모두 남습니다.` : `입력한 광고 ${r}건이 남고, 입력되지 않은 광고 ${p}건은 입력 방식과 관계없이 내려갑니다.`} 닫은 뒤에는 광고를 수정하거나 지울 수 없고, 호수와 메모는 유지됩니다.`,
      okLabel: r === 0 ? '모두 내리기' : '완료', ok: () => { completeSession(); },
    });
    return;
  }
  if (t.closest('[data-keep]')) { keepGroups([groupOf(t)]); return; }
  if (t.closest('[data-rank]')) { const g = groupOf(t); state.open.has(g.id) ? state.open.delete(g.id) : state.open.add(g.id); render(); return; }
  if (t.closest('[data-src]')) { UI.toast('네이버 부동산 원문을 새 창으로 엽니다'); return; }
  if (t.closest('[data-addad]')) { adDialog(groupOf(t), null); return; }
  const adRow = t.closest('tr[data-ad]');
  if (adRow && t.closest('[data-adedit]')) { const g = groupOf(t); adDialog(g, g.ads.find((a) => a.id === +adRow.dataset.ad)); return; }
  if (adRow && t.closest('[data-addel]')) {
    const g = groupOf(t);
    const a = g.ads.find((x) => x.id === +adRow.dataset.ad);
    dlg({
      title: '이 광고를 이번 스냅샷에서 뺄까요?',
      desc: a.fresh ? `${esc(a.realtor)} 광고는 이번에 처음 입력한 광고라 바로 지워집니다.` : `${esc(a.realtor)} 광고는 기존 광고라 이번 입력에서만 빠지고, 스냅샷을 완료하면 내려갑니다.`,
      okLabel: '빼기', ok: () => {
        if (a.fresh) g.ads.splice(g.ads.indexOf(a), 1); else a.entered = false;
        if (!g.ads.length) GROUPS.splice(GROUPS.indexOf(g), 1);
        g.rev += 1; render(); UI.toast(`${a.realtor} 광고를 이번 스냅샷에서 뺐습니다`);
      },
    });
    return;
  }
  if (t.closest('#sortBtn')) {
    const cols = columns().filter((c) => c.sort);
    UI.menu(t.closest('#sortBtn'), [{ head: '정렬 기준' }, ...cols.map((c) => ({ label: c.l, on: state.sort && state.sort.key === c.id, hint: state.sort && state.sort.key === c.id ? (state.sort.dir > 0 ? '오름차순' : '내림차순') : '', run: () => { state.sort = state.sort && state.sort.key === c.id ? { key: c.id, dir: -state.sort.dir } : { key: c.id, dir: 1 }; render(); } })), ...(state.sort ? ['-', { label: '정렬 해제', icon: 'x', run: () => { state.sort = null; render(); } }] : [])], { right: true });
    return;
  }
  const th = t.closest('th[data-col]');
  if (th && !t.closest('.rz')) {
    const key = th.dataset.sort;
    if (!key) { UI.toast(`${th.textContent.trim()} 열은 정렬하지 않는 열입니다`); return; }
    const cur = state.sort && state.sort.key === key ? state.sort.dir : 0;
    UI.menu(th, [
      { label: '오름차순 정렬', icon: 'sort', on: cur === 1, run: () => { state.sort = { key, dir: 1 }; render(); } },
      { label: '내림차순 정렬', icon: 'sort', on: cur === -1, run: () => { state.sort = { key, dir: -1 }; render(); } },
      ...(cur ? [{ label: '정렬 해제', icon: 'x', run: () => { state.sort = null; render(); } }] : []),
      '-', { label: '열 숨기기', icon: 'x', run: () => UI.toast('열 숨기기는 데모에 들어 있지 않습니다') },
    ]);
  }
});
// 호수·메모: 입력하는 대로 저장해 두고(다시 그려도 남음), 칸을 벗어나면 알린다
document.addEventListener('input', (e) => {
  const el = e.target.closest && e.target.closest('.edit[data-field]');
  if (!el) return;
  groupOf(el)[el.dataset.field] = el.textContent.replace(/\n/g, ' ').trim();
  el.dataset.dirty = '1';
});
document.addEventListener('focusout', (e) => {
  const el = e.target.closest && e.target.closest('.edit[data-field]');
  if (!el) return;
  if (!el.textContent.trim()) el.textContent = '';
  if (el.dataset.dirty) { delete el.dataset.dirty; UI.toast(el.dataset.field === 'ho' ? '호수를 저장했습니다' : '메모를 저장했습니다'); }
});
document.addEventListener('keydown', (e) => {
  if (e.isComposing || e.keyCode === 229) return; // 한글 조합 확정용 Enter는 저장으로 치지 않는다
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('edit')) { e.preventDefault(); e.target.blur(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-only]')) { e.preventDefault(); e.target.click(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); document.getElementById('q').focus(); }
});
[['q', 'q'], ['fDong', 'dong'], ['fHo', 'ho'], ['fFeat', 'feat']].forEach(([id, k]) => document.getElementById(id).addEventListener('input', (e) => { state[k] = e.target.value.trim(); render(); }));

render();

UI.notes(
  [
    '<b>열은 원본과 같은 순서</b>입니다: (유지) · 상태 · 광고 · 주인 · 단지 · 동 · 호 · 층 · 타입 · 면적 · 랭킹 · 가격 · 최소가 · 최대가 · 방향 · 매물특징 · 내 메모. 평형별 묶음 제목 대신 타입·면적 열을 되살렸고, 표 머리를 누르면 정렬 메뉴가 열립니다.',
    '<b>필터는 늘 보입니다.</b> 단지(여러 개) · 동 · 호, 집주인 · 내광고만 · 세안고, 가격 범위(월세 탭에서는 보증금과 월세), 특징·메모가 표 위에 나와 있고 고른 값이 그 자리에 파랗게 남습니다.',
    '<b>스냅샷 진행 줄</b>을 되살렸습니다. 입력됨/미입력 전환, 행마다 유지, 전체 유지(필터를 걸면 표시된 N건 유지), 취소, 완료가 있고 완료 확인창이 남는 광고와 내려가는 광고 수를 알려 줍니다. 완료하면 <b>비교 결과 줄</b>이 나옵니다.',
    '<b>랭킹 숫자를 누르면</b> 행 아래로 동일주소 광고가 노출 순서대로 열립니다. 스냅샷이 열려 있으면 광고마다 수정 · 다시 입력 · 삭제와 동일 광고 추가를 할 수 있습니다.',
    '<b>지난 비교는 제목 옆 숫자</b>(신규 · 추가 · 가격 변경 · 내려감 · 내 광고)로 보여 주고, 누르면 그 행만 남습니다. 숫자는 지금 건 필터 범위에서 다시 셉니다.',
    '<b>변동은 가격 옆 글자색과 화살표만</b>: 하락 파랑, 상승 빨강. 월세는 보증금과 월세 변동을 따로 적습니다. 가격 범위·특징 묶음은 가격 열 머리의 작은 버튼으로 접습니다.',
    '<b>호수와 메모는 칸을 눌러 바로 입력</b>합니다. 한글 조합 중 Enter는 저장으로 치지 않습니다.',
  ],
  '숫자를 나란히 비교하는 화면이라 가장 촘촘한 36px 표를 씁니다. 열과 조작은 원본 그대로 두고 모양만 바꿨습니다.',
);
</script>
</body>
</html>
