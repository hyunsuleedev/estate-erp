<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>희망매물 · UI 개선 데모</title>

<link rel="stylesheet" href="ui.css">
<style>
  [hidden] { display: none !important; }
  #tbl th, #tbl td { padding-left: 10px; padding-right: 10px; }
  #tbl th:last-child, #tbl td.act { padding: 0 12px 0 0; width: 38px; }
  #tbl td.exp { width: 28px; padding: 0; }
  #tbl td.place { white-space: normal; min-width: 180px; line-height: 1.35; }
  .tw { width: 24px; height: 24px; display: inline-grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--text-3); cursor: pointer; }
  .tw:hover { background: var(--hover); color: var(--text); }
  .tw .i { width: 14px; height: 14px; transition: transform 0.15s; }
  .tw.on .i { transform: rotate(90deg); }
  .cb { display: inline-flex; align-items: center; height: 21px; padding: 0 6px; border-radius: 4px; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .cb + .cb { margin-left: 4px; }
  .cb.act { background: var(--accent-soft); color: var(--accent-ink); }
  .cb.deal { background: var(--tg-green-bg); color: var(--tg-green); }
  .cb.end { background: var(--tg-sale-bg); color: var(--tg-sale); }
  /* 펼친 줄: 조건에 묶인 매칭을 한 줄씩 */
  #tbl tr.lane-tr > td { padding: 0; height: auto; white-space: normal; border-right: 0; background: color-mix(in srgb, var(--soft) 55%, var(--paper)); }
  #tbl tbody tr.lane-tr:hover > td { background: color-mix(in srgb, var(--soft) 55%, var(--paper)); }
  .lanes { padding: 4px var(--gutter) 8px 74px; }
  .rmemo { display: flex; gap: 8px; align-items: baseline; padding: 6px 10px; font-size: 12px; color: var(--text-2); }
  .rmemo b { font-weight: 600; color: var(--text); flex: none; }
  .lane { position: relative; display: grid; grid-template-columns: minmax(190px, 240px) 500px minmax(120px, 1fr) 28px; align-items: center; gap: 14px; min-height: 48px; padding: 4px 4px 4px 12px; border-radius: 8px; font-size: 13px; transition: background-color 0.1s; }
  .lane::before { content: ""; position: absolute; left: -14px; top: -6px; width: 16px; height: 30px; border-left: 1.5px solid var(--line-3); border-bottom: 1.5px solid var(--line-3); border-radius: 0 0 0 8px; }
  .lane:hover, .lane:focus-within { background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2); }
  .lane.closed .lc { opacity: 0.55; }
  .lc { min-width: 0; }
  .l1 { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
  .l1 .nm { font-weight: 600; cursor: pointer; overflow: hidden; text-overflow: ellipsis; }
  .l2 { margin-top: 1px; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tbl tr.lane-tr .lane:not(:hover):not(:focus-within) .rowact { opacity: 0; }
  .lmeta { margin-top: 1px; min-height: 18px; font-size: 12px; color: var(--text-2); white-space: nowrap; display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
  .lmeta .i { width: 12px; height: 12px; color: var(--text-3); }
  .mmemo { display: block; min-width: 60px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; outline: 0; border-radius: 5px; padding: 2px 5px; margin: 0 -5px; cursor: text; }
  .mmemo:hover { background: var(--hover); }
  .mmemo:focus { background: var(--paper); box-shadow: 0 0 0 1.5px var(--accent); text-overflow: clip; }
  .mmemo:empty::before { content: attr(data-ph); color: var(--text-3); }
  /* 단계 트랙: 이름 붙은 단계를 선으로 잇는다. 누르면 그 단계에서 할 수 있는 일이 열린다 */
  .trk { display: flex; align-items: center; }
  .sc { height: 24px; display: inline-flex; align-items: center; gap: 5px; padding: 0 7px; border: 0; border-radius: 6px; background: transparent; font-size: 12px; color: var(--text-3); cursor: pointer; white-space: nowrap; transition: background-color 0.12s; }
  .sc::before { content: ""; width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-3); flex: none; }
  .sc:hover { background: var(--hover); }
  .sc.done { color: var(--ok); }
  .sc.done::before { background: var(--dot-ok); box-shadow: none; }
  .sc.cur { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .sc.cur::before { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  .sc.fail { color: var(--danger); }
  .sc.fail::before { background: var(--danger); box-shadow: none; }
  .sc .i { width: 11px; height: 11px; }
  .trk .ln { width: 8px; height: 1.5px; background: var(--line-2); flex: none; }
  .trk .ln.done { background: var(--dot-ok); }
  .trk .sep { margin: 0 4px; color: var(--text-3); display: inline-grid; }
  .trk .sep .i { width: 12px; height: 12px; }
  /* 단계별 보기 */
  #tbl tr.grp td { height: 36px; background: var(--paper); font-size: 13px; font-weight: 600; cursor: pointer; }
  #tbl tr.grp .chev { width: 14px; height: 14px; color: var(--text-3); vertical-align: -2px; margin-right: 6px; transition: transform 0.15s; }
  #tbl tr.grp.shut .chev { transform: rotate(-90deg); }
  #tbl tr.grp .n { font-weight: 500; color: var(--text-3); margin-left: 6px; }
  #tbl td.two { height: 48px; }
  #tbl td.memo { max-width: 220px; white-space: normal; color: var(--text-2); font-size: 13px; line-height: 1.4; }
  #tbl td.memo > div { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  /* 필터 줄 */
  .fbar { gap: 6px; padding: 10px var(--gutter) 10px; flex-wrap: wrap; }
  .fsel, .fin { height: 30px; border: 0; border-radius: 8px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 2px rgba(16, 24, 40, 0.04); font: inherit; font-size: 13px; color: var(--text); letter-spacing: inherit; transition: box-shadow 0.12s, background-color 0.12s; }
  .fsel { display: inline-flex; align-items: center; gap: 6px; padding: 0 8px 0 10px; cursor: pointer; white-space: nowrap; }
  .fsel:hover, .fin:hover { box-shadow: inset 0 0 0 1px var(--line-3), 0 1px 2px rgba(16, 24, 40, 0.04); }
  .fsel .k { color: var(--text-2); }
  .fsel .v { font-weight: 500; }
  .fsel > .i { width: 12px; height: 12px; color: var(--text-3); }
  .fsel.on, .fin.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
  .fsel.on .k { color: var(--accent-ink); opacity: 0.75; }
  .fsel.on .v, .fin.on { color: var(--accent-ink); }
  .fsel .clr { width: 16px; height: 16px; display: grid; place-items: center; border-radius: 4px; color: var(--accent-ink); }
  .fsel .clr:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .fsel .clr .i { width: 11px; height: 11px; }
  .fin { width: 54px; padding: 0 8px; outline: 0; font-variant-numeric: tabular-nums; }
  .fin::placeholder { color: var(--text-3); }
  .fin:focus { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .frange { display: inline-flex; align-items: center; gap: 3px; }
  .frange .t3 { font-size: 12px; }
  #fbar [data-clear] { margin-left: auto; }
  /* 옆 상세: 표 위에 겹쳐 연다 */
  .split { position: relative; }

  .peek .sec { margin-top: 20px; }

  .addrow { display: flex; gap: 6px; margin-top: 6px; }
  .addrow .inp { flex: 1; min-width: 0; }
  .alert { display: flex; gap: 8px; padding: 9px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; background: color-mix(in srgb, var(--dot-warn) 16%, transparent); color: var(--warn); }
  .alert.info { background: var(--accent-soft); color: var(--accent-ink); }
  .alert .i { margin-top: 2px; }
  .note-edit { min-height: 56px; padding: 8px 10px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line-2); font-size: 14px; line-height: 1.6; outline: 0; white-space: pre-wrap; }
  .note-edit:focus { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }

  .m-h { padding: 18px 20px 4px; }

  .m-f { display: flex; justify-content: flex-end; gap: 6px; padding: 12px 20px 16px; }
  .frm { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }

  .inp { height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2); font: inherit; font-size: 13px; color: var(--text); outline: 0; }

  textarea.inp { height: auto; padding: 8px 10px; resize: vertical; line-height: 1.5; }
  .btn.primary.dng { background: var(--danger); }
  .kv { display: grid; grid-template-columns: 84px 1fr; gap: 4px 10px; padding: 10px 12px; border-radius: 8px; background: var(--soft); font-size: 13px; margin-bottom: 12px; }

  .pick { max-height: 208px; overflow: auto; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line-2); }

  .pick .g small { display: block; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick .i { color: var(--accent); }
  .pick .none { justify-content: center; color: var(--text-3); cursor: default; }
</style>
</head>
<body data-active="wanted">
<main id="page">
  <div class="ph">
    <h1>희망매물</h1>
    <span class="count" id="total"></span>
    <div class="meta">
      <span class="lnk" data-jump="act"><span class="dot accent"></span>진행 매칭 <b id="nAct"></b></span>
      <span class="lnk" data-jump="deal"><span class="dot ok"></span>거래전환 <b id="nDeal"></b></span>

    <div class="actions">

      <button class="btn primary" id="newBtn"></button>
    </div>
  </div>

  <div class="vbar">
    <div class="vtab on" data-kind="all">전체 <span class="n"></span></div>
    <div class="vtab" data-kind="sale">매매 <span class="n"></span></div>
    <div class="vtab" data-kind="jeonse">전세 <span class="n"></span></div>
    <div class="vtab" data-kind="monthly">월세 <span class="n"></span></div>
    <div class="vtools">
      <label class="field" style="width:250px" data-icon="search"><input id="q" placeholder="고객, 연락처, 매물, 주소 검색" aria-label="검색"><kbd>⌘F</kbd></label>
      <button class="btn quiet sm" id="foldBtn"></button>
      <span class="vsep"></span>
      <div class="seg" id="viewSeg"><button data-view="buyer" data-icon="users">고객별<kbd class="k" style="margin-left:4px">1</kbd></button><button data-view="stage" data-icon="list">단계별<kbd class="k" style="margin-left:4px">2</kbd></button></div>
    </div>
  </div>

  <div class="fbar show" id="fbar">
    <span data-slot="stage" style="display:contents"></span>
    <span data-slot="place" style="display:contents"></span>
    <span data-slot="type" style="display:contents"></span>
    <span class="vsep"></span>
    <span class="frange"><span data-slot="budget" style="display:contents"></span><input class="fin" data-rng="budget" data-side="lo" inputmode="decimal" placeholder="최소 억" aria-label="예산 최소(억)"><span class="t3">~</span><input class="fin" data-rng="budget" data-side="hi" inputmode="decimal" placeholder="최대 억" aria-label="예산 최대(억)"></span>
    <span class="frange" id="rentRange" hidden><span data-slot="rent" style="display:contents"></span><input class="fin" data-rng="rent" data-side="lo" inputmode="numeric" placeholder="최소 만" aria-label="월세 최소(만원)"><span class="t3">~</span><input class="fin" data-rng="rent" data-side="hi" inputmode="numeric" placeholder="최대 만" aria-label="월세 최대(만원)"></span>
    <span class="frange"><span data-slot="area" style="display:contents"></span><input class="fin" data-rng="area" data-side="lo" inputmode="numeric" placeholder="최소 평" aria-label="희망 평형 최소"><span class="t3">~</span><input class="fin" data-rng="area" data-side="hi" inputmode="numeric" placeholder="최대 평" aria-label="희망 평형 최대"></span>
    <span class="vsep"></span>
    <span data-slot="status" style="display:contents"></span>
    <span data-slot="agent" style="display:contents"></span>
    <span data-slot="urgency" style="display:contents"></span>
    <span data-slot="move" style="display:contents"></span>
    <button class="btn quiet sm" data-clear hidden>초기화</button>
  </div>

  <div class="split">
    <div class="scroll" id="scroll">
      <table class="tbl" id="tbl"><thead id="thead"></thead><tbody id="rows"></tbody></table>
      <div class="sumbar" id="foot"></div>
    </div>
    <aside class="peek over" id="peek" hidden></aside>
  </div>

  <div class="selbar" id="selbar">
    <span class="cnt" id="selCnt"></span>
    <button id="selClear" data-icon="x">선택 해제</button>
  </div>
</main>
