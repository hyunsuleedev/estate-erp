<!doctype html>
<html lang="ko">

<title>직원관리 · UI 개선 데모</title>

  .fbar { gap: 6px; padding: 10px var(--gutter) 10px; flex-wrap: wrap; }

  .fsel .k { color: var(--text-2); }
  .fsel .v { font-weight: 500; }
  .fsel > .i { width: 12px; height: 12px; color: var(--text-3); }

  .fsel.on .v { color: var(--accent-ink); }
  .fsel .clr { width: 16px; height: 16px; display: grid; place-items: center; border-radius: 4px; color: var(--accent-ink); }
  .fsel .clr:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .fsel .clr .i { width: 11px; height: 11px; }
  .fbar .res { margin-left: auto; font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }

  /* 계정 슬롯 사용량 */
  .slots { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
  .slots b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .slotbar { width: 72px; height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
  .slotbar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.2s; }
  .slotbar.full i { background: var(--warn); }

  /* 직원 표 */

  #tbl tbody tr[data-id] { cursor: pointer; }
  #tbl td.nm { font-weight: 500; }

  .cellb { height: 26px; display: inline-flex; align-items: center; gap: 6px; padding: 0 4px; margin: 0 -4px; border: 0; border-radius: 6px; background: transparent; font: inherit; cursor: pointer; }
  .cellb:hover { background: var(--press); }
  .cellb > .i { width: 11px; height: 11px; color: var(--text-3); opacity: 0; }

  .split.peeking .opt { display: none; }

  .split.peeking #tbl th .hi { display: none; }
  .split.peeking .sumbar { height: auto; min-height: 38px; padding: 8px 20px; flex-wrap: wrap; gap: 4px 14px; }
  .split.peeking .sumbar > span:first-child, .split.peeking .sumbar .grow { display: none; }
  .split.peeking .note-line { padding-left: 20px; }
  .note-line { padding: 10px var(--gutter) 0; font-size: 12px; color: var(--text-3); }

  /* 옆 상세 */
  .peek { width: 548px; }
  .peek-bar .sp { flex: 1; }
  .peek-bar .btn + .btn { margin-left: 6px; }
  .peek-body { padding: 4px 28px 80px; }
  .peek h2 { font-size: 22px; display: flex; align-items: center; gap: 10px; }

  .stats div { padding: 9px 12px; border-left: 1px solid var(--line); font-size: 12px; color: var(--text-2); }

  .kv { display: grid; grid-template-columns: repeat(3, 1fr); border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line-2); }
  .kv div { padding: 8px 12px; font-size: 12px; color: var(--text-2); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }

  .kv div:nth-child(3n+1) { border-left: 0; }
  .kv b { display: block; font-size: 14px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .mini { text-decoration: none; color: inherit; height: 36px; cursor: pointer; }

  .mini > .i { width: 14px; height: 14px; color: var(--text-3); flex: none; }
  .mini b { font-weight: 500; }
  .none { font-size: 13px; color: var(--text-3); padding: 8px 0; }

  /* 입력 창 */
  .mback { position: fixed; inset: 0; z-index: 60; background: rgba(20, 18, 12, 0.32); display: grid; place-items: center; }
  .mdl { width: 520px; max-width: calc(100vw - 32px); max-height: calc(100vh - 48px); overflow: auto; border-radius: 14px; background: var(--paper); box-shadow: 0 24px 60px rgba(20, 18, 12, 0.3); }
  .mdl.sm { width: 420px; }
  .mdl h3 { margin: 0; padding: 18px 22px 4px; font-size: 16px; font-weight: 600; }

  .mdl .mb { padding: 12px 22px 6px; }
  .mdl .mf { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 22px 18px; }
  .btn.dangerb { color: var(--danger); }
  a.btn { text-decoration: none; }
</style>
</head>

</main>

<script src="shell.js"></script>
<script>

    buyers: [['김지현', '활성 · 다음 연락 2026.11.11'], ['박준호', '활성 · 다음 연락 2026.11.13'], ['윤태경', '보류']],
    deals: [['고덕아르테온 312동 1704호', 'dual_agent', 'both', false, 1090], ['래미안힐스테이트고덕 120동 801호', 'listing_agent', 'seller', false, 330], ['고덕그라시움 103동 3401호', 'manager', 'both', true, 150]],
    consults: [['김지현', '전화 · 2026.11.07 14:20', '토요일 오전 임장 희망, 84㎡ 남향 위주'], ['박준호', '방문 · 2026.11.06 11:00', '대출 한도 확인 후 재연락']],
    acts: [['Deal update', 'web · 2026.11.11 09:42'], ['Task create', 'web · 2026.11.11 09:15'], ['Listing update', 'mcp · 2026.11.10 18:03 · 광고 가격 동기화']], consultCount: 214 },

    tasks: [], buyers: [], deals: [['고덕자이 108동 1902호', 'buying_agent', 'buyer', false, 120]], consults: [], acts: [['User update', 'web · 2026.09.30 18:00 · 퇴사 처리']], consultCount: 54 },
].map((e) => ({ id: ++SEQ, ...e }));

const cntOf = (e) => ({ task: e.tasks.length, buyer: e.buyers.filter((b) => /^활성/.test(b[1])).length, deal: e.deals.length, unsettled: e.deals.filter((d) => !d[3]).length });
const F = { q: '', status: '', role: '', load: '' };
const state = { sel: null, tab: 'account', sort: null, shut: new Set() };
const drafts = new Map();
const FIELDS = ['name', 'phone', 'email', 'licenseType', 'licenseNo', 'payType', 'baseSalary', 'commissionRate'];
const toDraft = (e) => ({ name: e.name, phone: e.phone || '', email: e.email || '', licenseType: e.licenseType || '', licenseNo: e.licenseNo || '', payType: e.payType, baseSalary: e.baseSalary != null ? String(e.baseSalary) : '', commissionRate: e.commissionRate != null ? String(e.commissionRate) : '' });
const draftOf = (e) => drafts.get(e.id) || toDraft(e);
const isDirty = (e) => { const d = drafts.get(e.id); if (!d) return false; const b = toDraft(e); return FIELDS.some((k) => d[k] !== b[k]); };

const LOAD = { hasTasks: ['진행 업무 있음', (e) => cntOf(e).task > 0], hasDeals: ['진행 거래 있음', (e) => cntOf(e).deal > 0], hasUnsettled: ['미정산 있음', (e) => cntOf(e).unsettled > 0] };
function match(e) {
  if (F.status && (F.status === 'active') !== e.active) return false;
  if (F.role && e.role !== F.role) return false;
  if (F.load && !LOAD[F.load][1](e)) return false;
  const q = F.q.trim().toLowerCase();
  return !q || [e.name, e.loginId, e.phone, phone(e.phone), e.email].join(' ').toLowerCase().includes(q);
}
const SORT = { name: (e) => e.name, role: (e) => ROLE_RANK[e.role], task: (e) => cntOf(e).task, buyer: (e) => cntOf(e).buyer, deal: (e) => cntOf(e).deal, unsettled: (e) => cntOf(e).unsettled, last: (e) => (e.last == null ? Infinity : e.last) };
function sorted(list) {
  if (!state.sort) return list;
  const f = SORT[state.sort.key];
  return [...list].sort((a, b) => { const x = f(a), y = f(b); return (typeof x === 'string' ? x.localeCompare(y, 'ko') : x - y) * state.sort.dir; });
}
const activeCount = () => EMP.filter((e) => e.active).length;

const COLS = [
  ['user', '이름', 'name', ''], ['tag', '역할', 'role', ''], ['info', '계정 상태', '', ''], ['bookUser', '로그인 ID', '', 'opt'], ['file', '자격 구분', '', 'opt'], ['phone', '연락처', '', 'opt'],

];

  document.body.append(back);

  const onKey = (e) => { if (e.isComposing || e.keyCode === 229) return; if (e.key === 'Escape') { e.stopPropagation(); close(true); } };

  back.querySelector('form').addEventListener('submit', (e) => { e.preventDefault(); if (onSubmit(back) !== false) close(false); });
  const first = back.querySelector('input, select, button.primary');
  if (first) first.focus();
  return back;
}

    <div class="mb"><div class="fg">

      <div><label for="c-phone">휴대폰</label><input class="inp" id="c-phone" inputmode="numeric" placeholder="01012345678"></div><div><label for="c-email">이메일</label><input class="inp" id="c-email" type="email"></div>
      <div><label for="c-role">역할</label><select class="inp" id="c-role">${Object.entries(ROLE).map(([v, [l]]) => opt(v, l, 'agent')).join('')}</select></div><div><label for="c-pw">초기 비밀번호 *</label><input class="inp" id="c-pw" type="password" autocomplete="new-password"></div>
      <div><label for="c-lt">자격 구분</label><select class="inp" id="c-lt">${opt('', '미지정', '')}${Object.entries(LICENSE).map(([v, l]) => opt(v, l, '')).join('')}</select><p class="hint warn" id="c-warn" hidden>중개보조원은 계약서에 서명할 수 없습니다.</p></div><div><label for="c-ln">자격증/등록 번호</label><input class="inp" id="c-ln"></div>
    </div></div><div class="mf"><button type="button" class="btn" data-x>닫기</button><button class="btn primary" id="c-ok" disabled>생성</button></div>`, (b) => {
    const g = (id) => b.querySelector('#' + id).value.trim();
    if (EMP.some((x) => x.loginId === g('c-login'))) { UI.toast('이미 사용 중인 로그인 ID입니다.'); return false; }
    const e = { id: ++SEQ, name: g('c-name'), loginId: g('c-login'), phone: g('c-phone').replace(/\D/g, ''), email: g('c-email'), role: g('c-role'), active: true, licenseType: g('c-lt'), licenseNo: g('c-ln'), payType: 'mixed', baseSalary: null, commissionRate: null, created: '2026.11.11', last: null, tasks: [], buyers: [], deals: [], consults: [], acts: [], consultCount: 0 };
    EMP.push(e); state.sel = e.id; state.tab = 'account'; render();
    UI.toast(`${esc(e.name)}님 계정이 생성되었습니다.`);
  });
  const sync = () => { back.querySelector('#c-ok').disabled = full || !['c-name', 'c-login', 'c-pw'].every((id) => back.querySelector('#' + id).value.trim()); back.querySelector('#c-warn').hidden = back.querySelector('#c-lt').value !== 'assistant'; };
  back.addEventListener('input', sync);
  back.addEventListener('change', sync);
}

// ── 이벤트 ──
document.querySelectorAll('[data-icon]').forEach((el) => el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon)));
document.getElementById('newBtn').innerHTML = `${icon('plus')}직원 추가`;
document.getElementById('settleBtn').innerHTML = `${icon('wallet')}정산 현황`;
const qEl = document.getElementById('q');
qEl.addEventListener('input', () => { F.q = qEl.value; renderList(); });
const setF = (k, v) => { F[k] = v; renderList(); };
const empOf = (el) => { const r = el.closest('tr[data-id]'); return r && EMP.find((x) => x.id === +r.dataset.id); };
function roleMenu(btn, e) { UI.menu(btn, [{ head: '역할 변경' }, ...Object.entries(ROLE).map(([v, [l, c]]) => ({ label: l, icon: 'user', on: e.role === v, run: () => changeRole(e, v) }))]); }

document.addEventListener('click', (ev) => {
  const t = ev.target;
  if (t.closest('.mback')) return;
  if (t.closest('#newBtn')) return openCreate();
  if (t.closest('[data-reset]')) { Object.assign(F, { q: '', status: '', role: '', load: '' }); qEl.value = ''; return renderList(); }
  const clr = t.closest('[data-fclr]');
  if (clr) return setF(clr.dataset.fclr, '');
  const fs = t.closest('[data-fs]');
  if (fs) {
    const id = fs.dataset.fs;
    const opts = id === 'status' ? [['active', '활성'], ['inactive', '비활성']] : id === 'role' ? Object.entries(ROLE).map(([v, [l]]) => [v, l]) : Object.entries(LOAD).map(([v, [l]]) => [v, l]);
    const n = (v) => String(EMP.filter((e) => { const keep = F[id]; F[id] = v; const ok = match(e); F[id] = keep; return ok; }).length);
    return UI.menu(fs, [{ label: '전체', hint: n(''), on: !F[id], run: () => setF(id, '') }, '-', ...opts.map(([v, l]) => ({ label: l, hint: n(v), on: F[id] === v, run: () => setF(id, v) }))]);
  }
  const th = t.closest('th[data-sort]');
  if (th) {
    const k = th.dataset.sort, num = !['name', 'role'].includes(k);
    const set = (dir) => { state.sort = dir ? { key: k, dir } : null; renderList(); };
    const cur = state.sort && state.sort.key === k ? state.sort.dir : 0;
    return UI.menu(th, [{ label: k === 'last' ? '최근 활동순' : num ? '적은 순' : k === 'role' ? '대표 → 중개사' : '가나다순', icon: 'sort', on: cur === 1, run: () => set(1) }, { label: k === 'last' ? '오래된 활동순' : num ? '많은 순' : k === 'role' ? '중개사 → 대표' : '가나다 역순', icon: 'sort', on: cur === -1, run: () => set(-1) }, '-', { label: '정렬 해제', icon: 'x', run: () => set(0) }]);
  }
  const g = t.closest('tr.grp');
  if (g) { const k = g.dataset.g; state.shut.has(k) ? state.shut.delete(k) : state.shut.add(k); return renderList(); }
  // 옆 상세
  const peek = t.closest('#peek');
  if (peek) {
    const e = EMP.find((x) => x.id === state.sel);
    if (t.closest('[data-close]')) { state.sel = null; return render(); }
    const tab = t.closest('[data-tab]');
    if (tab) { state.tab = tab.dataset.tab; return renderPeek(); }
    if (t.closest('[data-toggle]')) return toggleActive(e);
    if (t.closest('[data-save]')) return saveDetail(e);
    if (t.closest('[data-pw]')) { document.getElementById('pw').value = ''; t.closest('[data-pw]').disabled = true; return UI.toast('비밀번호가 재설정되었습니다. 직원에게 전달하세요.'); }
    return;
  }
  const e = empOf(t);
  if (!e) return;
  const rb = t.closest('[data-role]');
  if (rb) return roleMenu(rb, e);
  if (t.closest('[data-act]')) return toggleActive(e);
  const more = t.closest('[data-more]');
  if (more) return UI.menu(more, [{ label: '상세 열기', icon: 'expand', run: () => { state.sel = e.id; render(); } }, { label: '역할 변경', icon: 'tag', run: () => roleMenu(document.querySelector(`tr[data-id="${e.id}"] [data-role]`), e) }, { label: '담당 업무 보기', icon: 'todo', run: () => { location.href = 'tasks.html'; } }, '-',
    { label: e.active ? '계정 비활성화' : '계정 재활성화', icon: e.active ? 'x' : 'check', danger: e.active, run: () => toggleActive(e) }], { right: true });
  state.sel = state.sel === e.id ? null : e.id;
  render();
});
// 상세 입력: 다시 그리지 않고 초안만 갱신한다 (입력 중 포커스 유지)
const peekEl = document.getElementById('peek');
function onDraft(ev) {
  const e = EMP.find((x) => x.id === state.sel);
  if (!e) return;
  const el = ev.target;
  if (el.id === 'pw') { peekEl.querySelector('[data-pw]').disabled = !el.value; return; }
  if (el.matches('[data-rolesel]')) { if (ev.type === 'change') changeRole(e, el.value); return; }
  if (!el.dataset.k) return;
  const d = { ...draftOf(e), [el.dataset.k]: el.value };
  drafts.set(e.id, d);
  if (el.hasAttribute('data-redraw') || el.dataset.k === 'licenseType') { if (ev.type === 'change') renderPeek(); return; }
  peekEl.querySelector('[data-save]').disabled = !isDirty(e);
}
peekEl.addEventListener('input', onDraft);
peekEl.addEventListener('change', onDraft);
document.addEventListener('keydown', (e) => {
  if (e.isComposing || e.keyCode === 229) return;
  const a = document.activeElement;
  if ((e.key === 'Enter' || e.key === ' ') && a && a.matches('.gh')) { e.preventDefault(); a.click(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey || document.querySelector('.mback, .cmdk-back')) return;
  if (a && a.matches('input, textarea, select')) { if (e.key === 'Escape' && a === qEl) { if (F.q) { qEl.value = ''; F.q = ''; renderList(); } else qEl.blur(); } return; }
  if (e.key === '/') { e.preventDefault(); qEl.focus(); }
  else if (e.key === 'Escape' && state.sel) { state.sel = null; render(); }
});

render();

UI.notes(
  [
    '<b>직원 명부를 표로</b> 바꿨습니다. 이름·역할·계정 상태·로그인 ID·자격·연락처·업무·고객·거래·미정산·최근 활동을 열로 나눠 한눈에 훑고, 머리를 눌러 정렬합니다. 원본은 직원마다 세 줄짜리 묶음이었습니다.',
    '<b>필터가 늘 보입니다.</b> 계정 상태·역할·담당(진행 업무·진행 거래·미정산 있음)을 선택 상자로 두었고, 항목마다 몇 명인지 함께 보여 줍니다.',
    '<b>표에서 바로 바꿉니다.</b> 역할 칸을 누르면 역할 메뉴가, 계정 상태 칸을 누르면 비활성화·재활성화 확인이 열립니다. 마지막 대표 계정과 계정 슬롯 한도는 원본처럼 막습니다.',
    '<b>상세는 옆에서</b> 엽니다. 원본은 명부가 통째로 상세 화면으로 바뀌었지만, 여기서는 명부를 둔 채 계정 정보·업무 현황·활동 기록을 오갑니다. 저장하지 않은 입력은 직원별로 남아 있습니다.',
    '<b>운영 요약</b>(활성·비활성 계정, 진행 업무·담당 고객·진행 거래 합계, 미정산 참여)은 표 아래 한 줄로 옮겼습니다. 오른쪽 상자 하나를 차지하던 내용입니다.',
    '<b>직원 추가 창</b>이 실제로 열리고, 필수 항목을 채워야 생성됩니다. 슬롯이 다 차면 원본처럼 안내하고 막습니다.',
  ],
  '원본의 검색·필터·계정 관리·급여와 배분·비밀번호 재설정·업무 현황·활동 기록을 모두 살렸습니다.',
);
</script>
</body>
</html>
