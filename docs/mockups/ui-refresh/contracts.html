<script>

const man = (v) => (!v ? '—' : v % 10000 || v < 10000 ? `${won(v)}만` : won(v));

const dnum = (s) => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };

const addMonths = (s, n) => { const [y, m, d] = s.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1 + n, d)); return t.toISOString().slice(0, 10); };

// 계약: [계약일, 공동중개 사무소, 거래, 단지, 동, 호, 총액, 월세, 중도금일, 잔금일, 메모, 매도, 매수, 상태, 신고, 문서, 필수 문서 수, 누락 자료, 수정, 파일, 임대만기]

function modal({ title: tt, desc, body, ok = '확인', cancel = '닫기', danger, wide, onOpen, onOk }) {

function saveEditor() {

    c.form = JSON.parse(JSON.stringify(f));

    Object.assign(c, { total: f.total, rent: f.rent || c.rent, mid: f.midDate || null, bal: f.balDate || null, leaseEnd: f.leaseTo || c.leaseEnd, seller: [p0.name, p0.phone], buyer: [p1.name, p1.phone], joint: f.office.joint ? f.office.jointName : '' });
  }
  delete d.isNew; if (d.status === 'draft') d.status = 'generated';
  c.updated = `${dot(TODAY)} 방금`; ed.dirty = false;

  UI.toast('문서를 저장했습니다.');
}

  if (t.closest('[data-addagent]')) { const p = f.parties[+t.closest('tr').dataset.p]; const n = f.parties.filter((x) => x.side === p.side && x.role).length; if (n >= 2) { UI.toast('대리인은 두 명까지 추가할 수 있습니다'); return; } f.parties.push({ side: p.side, role: n ? '공동대리인' : '대리인', name: '', idno: '', addr: '', phone: '', share: '' }); touch(); renderEditor(); return; }
  if (t.closest('[data-delparty]')) { const i = +t.closest('tr').dataset.p; const [p] = f.parties.splice(i, 1); touch(); renderEditor(); UI.toast(`${sideName(c, p.side)} ${p.role || ''} ${esc(p.name) || '(이름 없음)'} 줄을 지웠습니다`, () => { if (state.ed !== ed) return; f.parties.splice(Math.min(i, f.parties.length), 0, p); renderEditor(); }); return; }
  if (t.closest('[data-clauseload]')) return UI.menu(t.closest('[data-clauseload]'), CLAUSE_T.map(([l, body]) => ({ label: l, icon: 'file', run: () => { const prev = f.body3; f.body3 = body || defaultForm(c).body3; touch(); renderEditor(); UI.toast(`「${l}」 계약사항을 적용했습니다.`, () => { if (state.ed !== ed) return; f.body3 = prev; renderEditor(); }); } })), { wide: true });
  if (t.closest('[data-specload]')) return UI.menu(t.closest('[data-specload]'), SPECIAL_T.map(([l, body]) => ({ label: l, icon: 'note', hint: '끝에 덧붙임', run: () => { const prev = f.special; const n = f.special.split('\n').filter((x) => x.trim()).length + 1; f.special = `${f.special.trim()}\n${n}. ${body}`.trim(); touch(); renderEditor(); UI.toast(`「${l}」 특약을 넣었습니다`, () => { if (state.ed !== ed) return; f.special = prev; renderEditor(); }); } })), { wide: true });
  if (t.closest('[data-clausesave]') || t.closest('[data-specsave]')) { const isC = !!t.closest('[data-clausesave]'); const el = document.getElementById(isC ? 'clName' : 'spName'); const v = el.value.trim(); if (!v) { el.focus(); return; } (isC ? CLAUSE_T : SPECIAL_T).push([v, isC ? f.body3 : f.special]); el.value = ''; UI.toast(isC ? '계약사항 템플릿을 저장했습니다.' : '특약 템플릿을 등록했습니다.'); return; }
  const plus = t.closest('[data-plus]');
  if (plus) { document.getElementById('genDue').value = addMonths(TODAY, +plus.dataset.plus); touch(); refreshFoot(); return; }
}
const refreshFoot = () => { document.getElementById('edFoot').innerHTML = footHtml(); const t = document.querySelector('.dtab.on'); if (t && !t.querySelector('.unsaved')) t.insertAdjacentHTML('beforeend', '<span class="unsaved"></span>'); };
document.addEventListener('dblclick', (e) => { if (state.ed || e.target.closest('.ib, [data-st], .mback')) return; const tr = e.target.closest('tr[data-c]'); if (tr) openEditor(+tr.dataset.c); });
let qTimer = 0;
document.getElementById('q').addEventListener('input', (e) => { clearTimeout(qTimer); const v = e.target.value; qTimer = setTimeout(() => { state.q = v; render(); }, 150); });
for (const id of ['dFrom', 'dTo', 'aMin', 'aMax']) document.getElementById(id).addEventListener('input', (e) => { const v = e.target.value.trim(); state[id] = id[0] === 'a' && v !== '' && Number.isNaN(+v) ? '' : v; render(); });
function onField(el) {
  const ed = state.ed; if (!ed) return;
  if (el.dataset.gen != null) { ed.dirty = true; return refreshFoot(); }
  const key = el.dataset.f; if (!key) return;
  const f = ed.f; let structural = false;
  if (el.dataset.amt != null) {
    const raw = +el.value.replace(/[,\s]/g, '') || 0; const v = raw / UNIT[f.unit];
    const bad = !Number.isInteger(v);
    bad ? ed.bad.add(key) : ed.bad.delete(key);
    el.classList.toggle('bad', bad); el.title = bad ? '만원 단위 정수로 환산되는 금액을 입력해주세요.' : '';
    if (!bad) f[key] = v;
  } else if (el.dataset.ck != null) { setPath(f, key, el.checked); structural = ['showLease', 'direct2', 'office.joint'].includes(key); }
  else if (el.dataset.int != null) f[key] = +el.value;
  else if (el.dataset.num != null) { f[key] = el.value.trim() === '' ? '' : +el.value || 0; }
  else setPath(f, key, el.value);
  // 임대차 개월 ↔ 만기일은 서로 맞춘다
  if (key === 'months' && f.leaseFrom && f.months) { f.leaseTo = addMonths(f.leaseFrom, f.months); const to = document.querySelector('[data-f="leaseTo"]'); if (to) to.value = f.leaseTo; }
  if ((key === 'leaseTo' || key === 'leaseFrom') && f.leaseFrom && f.leaseTo) { const [y1, m1] = f.leaseFrom.split('-').map(Number); const [y2, m2] = f.leaseTo.split('-').map(Number); f.months = (y2 - y1) * 12 + (m2 - m1); const mo = document.querySelector('[data-f="months"]'); if (mo) mo.value = f.months; }
  ed.dirty = true;
  if (structural) renderEditor(); else refresh();
}
document.getElementById('edWrap').addEventListener('input', (e) => { if (e.target.matches('[data-f], [data-gen]') && !e.target.matches('[type="checkbox"], select')) onField(e.target); });
document.getElementById('edWrap').addEventListener('change', (e) => { if (e.target.matches('[data-f][type="checkbox"], select[data-f]')) onField(e.target); });
// 금액 칸을 벗어나면 천 단위 쉼표를 다시 넣는다
document.getElementById('edWrap').addEventListener('focusout', (e) => { const el = e.target; if (el.matches && el.matches('[data-amt]') && state.ed && !state.ed.bad.has(el.dataset.f)) { const v = state.ed.f[el.dataset.f]; el.value = v ? num(v * UNIT[state.ed.f.unit]) : ''; } });
document.addEventListener('keydown', (e) => {
  if (e.isComposing || e.keyCode === 229) return;
  if (document.querySelector('.mback')) return;
  const typing = e.target.matches('input, textarea, select');
  if (state.ed) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveEditor(); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'p') { e.preventDefault(); preview(); }
    if (e.key === 'Escape' && !typing) closeEditor();
    return;
  }
  if (e.key === '/' && !typing) { e.preventDefault(); document.getElementById('q').focus(); return; }
  if (e.key === 'Escape' && typing) { e.target.blur(); return; }
  const tr = e.target.closest && e.target.closest('tr[data-c]');
  if (tr && e.key === 'Enter' && !typing && !e.target.closest('button')) { openEditor(+tr.dataset.c); return; }
  if (tr && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { const n = e.key === 'ArrowDown' ? tr.nextElementSibling : tr.previousElementSibling; if (n && n.dataset.c) { e.preventDefault(); state.sel = +n.dataset.c; render(); document.querySelector(`tr[data-c="${state.sel}"]`).focus(); } }
});

// 원본처럼 주소의 ?editorContractId= 로 편집기를 바로 연다
render();
const want = new URLSearchParams(location.search).get('editorContractId');
if (want != null && CONTRACTS.some((c) => String(c.id) === want)) openEditor(+want);

UI.notes(
  [
    '<b>목록 열은 원본 그대로</b>입니다: 계약일, 중개, 거래, 소재지 / 매물, 금액(만원), 중도금일, 잔금일, 메모, 매도(임)인, 매수(임)인, 상태, 신고, 문서, 작업. 날짜 칩은 오늘·내일·지난 날을 색으로 구분하고, 잔금일 아래에 D-day가 붙습니다.',
    '<b>필터가 한 줄에 늘 보입니다.</b> 검색기준·서식·거래유형·상태·문서 준비, 날짜와 금액 범위(기준을 골라 시작~끝을 적음), 공동중개·보존기간 경과가 표 위에 있고 고른 값이 그 자리에 표시됩니다.',
    '<b>상태 배지를 누르면</b> 작성중 → 서명완료 → 계약금 완료 → 잔금 완료 → 등기 완료 → 취소를 그 자리에서 바꿉니다. 실행 취소가 붙은 알림이 뜹니다. 원본에는 상태를 바꾸는 곳이 없어 새로 넣은 조작입니다.',
    '<b>자료 중심 보기</b>는 카드 격자 대신 표입니다. 작성 문서·필수 문서 수와 빠진 자료 이름이 한 줄에 보여 여러 계약을 한눈에 훑습니다.',
    '행을 두 번 누르거나 Enter를 누르면 <b>편집기</b>가 열립니다. 위쪽은 문서 탭, 가운데는 부동산의 표시·제1조 금액·제2조·본문·특약·당사자·개업공인중개사, 오른쪽은 점검 칸입니다. ⌘S로 저장하고 ⌘P로 출력 미리보기를 엽니다.',
    '<b>대금 타임라인</b>이 오른쪽에 붙어 계약금·중도금·잔금의 비율, 지급일, D-day를 입력하는 대로 다시 그립니다. <b>작성 점검</b>은 합계가 총액과 다르거나 날짜 순서가 틀리면 바로 알려 주고, 금액 옆에는 한글 금액이 병기됩니다.',
    '<b>당사자</b>는 표에서 바로 고치고 공동 매도인·매수인, 대리인을 줄로 추가합니다. <b>계약서 등록</b>은 종별 → 거래유형 순으로, <b>서식 등록</b>은 분류 → 서식 순으로 고릅니다.',
  ],
  '계약 문서 목록을 촘촘하게 훑고, 편집기에서는 금액과 일정을 점검하며 작성합니다.',
);
