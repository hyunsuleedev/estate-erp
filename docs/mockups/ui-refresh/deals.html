<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>거래관리 · UI 개선 데모</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="ui.css">
<style>
  [hidden] { display: none !important; }
  /* 필터 줄 */
  .fbar { gap: 6px; padding: 10px var(--gutter) 10px; flex-wrap: wrap; }
  .fsel { height: 30px; border: 0; border-radius: 8px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 2px rgba(16, 24, 40, 0.04); font: inherit; font-size: 13px; color: var(--text); letter-spacing: inherit; transition: box-shadow 0.12s, background-color 0.12s; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px 0 10px; cursor: pointer; white-space: nowrap; }
  .fsel:hover { box-shadow: inset 0 0 0 1px var(--line-3), 0 1px 2px rgba(16, 24, 40, 0.04); }
  .fsel .k { color: var(--text-2); }
  .fsel .v { font-weight: 500; }
  .fsel > .i { width: 12px; height: 12px; color: var(--text-3); }
  .fsel.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
  .fsel.on .k { color: var(--accent-ink); opacity: 0.75; }
  .fsel.on .v { color: var(--accent-ink); }
  .fsel .clr { width: 16px; height: 16px; display: grid; place-items: center; border-radius: 4px; color: var(--accent-ink); }
  .fsel .clr:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .fsel .clr .i { width: 11px; height: 11px; }
  .fbar .res { margin-left: auto; font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .fbar .res b { color: var(--text); font-weight: 600; }
  /* 보드 */
  .board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; padding: 4px var(--gutter) 12px; align-items: start; }
  .col { border-radius: 12px; background: var(--soft); padding: 4px 6px 8px; min-height: 180px; transition: box-shadow 0.12s, background-color 0.12s; }
  .col.over { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 55%, transparent); }
  .col-h { display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 6px; font-size: 13px; font-weight: 600; }
  .col-h .n { color: var(--text-3); font-weight: 500; font-variant-numeric: tabular-nums; }
  .col-h .fee { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .col-e { padding: 26px 8px; text-align: center; font-size: 12px; color: var(--text-3); }
  .card { position: relative; padding: 9px 10px 9px 12px; border-radius: 10px; background: var(--paper); box-shadow: 0 0 0 1px var(--line-2), 0 1px 2px rgba(16, 24, 40, 0.05); cursor: grab; transition: box-shadow 0.14s, transform 0.14s, opacity 0.14s; }
  .card + .card { margin-top: 6px; }
  .card:hover { box-shadow: 0 0 0 1px var(--line-3), 0 6px 16px -8px rgba(16, 24, 40, 0.22); }
  .card.drag { opacity: 0.4; }
  .card.sel { box-shadow: 0 0 0 1.5px var(--accent), 0 6px 16px -8px rgba(16, 24, 40, 0.22); }
  .card.h-overdue { box-shadow: inset 3px 0 0 var(--danger), 0 0 0 1px color-mix(in srgb, var(--danger) 35%, var(--line-2)); }
  .card.h-stale { box-shadow: inset 3px 0 0 var(--dot-warn), 0 0 0 1px color-mix(in srgb, var(--dot-warn) 45%, var(--line-2)); }
  .c1 { display: flex; align-items: flex-start; gap: 4px; }
  .c1 .nm { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; line-height: 1.4; cursor: pointer; }
  .c1 .ib { width: 22px; height: 22px; margin: -2px -4px 0 0; flex: none; }
  .c2 { margin-top: 1px; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c3 { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .c3 b { font-size: 16px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-right: 2px; }
  .c3 .tag { height: 19px; font-size: 12px; margin: 0; }
  .c4 { display: flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
  .c4 .i { width: 12px; height: 12px; color: var(--text-3); }
  .c4 .st { height: 19px; margin-left: auto; }
  .board.compact .c2, .board.compact .c4 .stay { display: none; }
  .board.compact .c3 b { font-size: 14px; }
  /* 리스트 */
  #tbl th, #tbl td { padding-left: 10px; padding-right: 10px; }
  #tbl th:first-child, #tbl td:first-child { padding-left: var(--gutter); }
  #tbl th:last-child, #tbl td.act { padding: 0 12px 0 0; width: 38px; }
  #tbl td.two { height: 48px; }
  #tbl tr.grp td { height: 36px; font-size: 13px; font-weight: 600; cursor: pointer; background: var(--paper); }
  #tbl tr.grp .chev { width: 14px; height: 14px; color: var(--text-3); vertical-align: -2px; margin-right: 6px; transition: transform 0.15s; }
  #tbl tr.grp.shut .chev { transform: rotate(-90deg); }
  #tbl tr.grp .n { font-weight: 500; color: var(--text-3); margin-left: 6px; }
  #tbl tr.grp .sum { float: right; font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; }
  #tbl tr.gempty td { height: 34px; color: var(--text-3); font-size: 12px; }
  #tbl tr.urgent td:first-child { box-shadow: inset 3px 0 0 var(--danger); }
  #tbl tr.sel td { background: var(--picked); }
  #tbl tbody tr[data-d] { cursor: pointer; }
  .l1 { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .l1 .nm { font-weight: 600; }
  .l2 { margin-top: 1px; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dd { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 4px; margin-left: 6px; font-size: 12px; font-weight: 500; background: color-mix(in srgb, var(--text) 6%, transparent); color: var(--text-2); font-variant-numeric: tabular-nums; }
  .dd.hot { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
  .code { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; margin: 0 4px; }
  /* 보관 묶음 */
  .arch { margin: 0 var(--gutter) 6px; border-top: 1px solid var(--line-2); }
  .arch-h { display: flex; align-items: center; gap: 8px; height: 38px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .arch-h .chev { width: 14px; height: 14px; color: var(--text-3); transition: transform 0.15s; }
  .arch.shut .chev { transform: rotate(-90deg); }
  .arch.shut .arch-b { display: none; }
  .arch-h .n { font-weight: 500; color: var(--text-3); }
  .arow { display: grid; grid-template-columns: minmax(0, 1fr) 130px 130px 28px; gap: 12px; align-items: center; min-height: 46px; padding: 4px 4px 4px 22px; border-top: 1px solid var(--line); font-size: 13px; cursor: pointer; }
  .arow:hover { background: var(--row-hover); }
  .arow .r { text-align: right; font-variant-numeric: tabular-nums; }
  /* 단계 트랙 */
  .trk { display: flex; align-items: center; flex-wrap: wrap; row-gap: 4px; }
  .sc { height: 26px; display: inline-flex; align-items: center; gap: 5px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; font-size: 12px; color: var(--text-3); cursor: pointer; white-space: nowrap; transition: background-color 0.12s; }
  .sc::before { content: ""; width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-3); flex: none; }
  .sc:hover { background: var(--hover); }
  .sc.done { color: var(--ok); }
  .sc.done::before { background: var(--dot-ok); box-shadow: none; }
  .sc.cur { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .sc.cur::before { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  .trk .ln { width: 10px; height: 1.5px; background: var(--line-2); flex: none; }
  .trk .ln.done { background: var(--dot-ok); }
  .trk.dim { opacity: 0.45; pointer-events: none; }
  /* 옆 상세 */
  .split { position: relative; }
  .peek.over { position: absolute; right: 0; top: 0; bottom: 0; width: 780px; max-width: calc(100% - 40px); z-index: 8; box-shadow: -18px 0 40px -18px rgba(16, 24, 40, 0.24); }
  .peek .peek-body { padding: 0 24px 24px; }
  .peek h2 { font-size: 22px; margin: 8px 0 0; }
  .peek .amt { display: flex; align-items: baseline; gap: 12px; margin: 8px 0 10px; }
  .peek .amt b { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .hbar { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; margin-top: 10px; border-radius: 8px; background: var(--soft); font-size: 13px; color: var(--text-2); }
  .hbar b { color: var(--text); font-weight: 600; }
  .hbar.overdue { background: color-mix(in srgb, var(--danger) 9%, transparent); }
  .hbar.overdue b { color: var(--danger); }
  .hbar.stale, .hbar.unscheduled { background: color-mix(in srgb, var(--dot-warn) 16%, transparent); }
  .hbar.stale b, .hbar.unscheduled b { color: var(--warn); }
  .hbar .sp { margin-left: auto; font-variant-numeric: tabular-nums; }
  .dgrid { display: grid; grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.18fr); gap: 0 28px; margin-top: 4px; }
  .peek .sec { margin-top: 20px; }
  .peek .sec-h { margin-bottom: 6px; }
  .peek .sec-h small { font-weight: 400; color: var(--text-3); font-size: 12px; }
  .chk { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 6px; margin: 0 -6px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .chk:hover { background: var(--hover); }
  .chk i { width: 15px; height: 15px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px var(--line-3); display: grid; place-items: center; flex: none; }
  .chk i .i { width: 11px; height: 11px; color: #fff; stroke-width: 2.6; opacity: 0; }
  .chk.on i { background: var(--accent); box-shadow: none; }
  .chk.on i .i { opacity: 1; }
  .chk.on span { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--line-3); }
  .kvl { display: grid; grid-template-columns: 76px minmax(0, 1fr); font-size: 13px; }
  .kvl > span { color: var(--text-2); min-height: 28px; display: flex; align-items: center; }
  .kvl > div { min-height: 28px; display: flex; align-items: center; gap: 6px; min-width: 0; font-variant-numeric: tabular-nums; }
  .kvl .ib { width: 24px; height: 24px; }
  .prow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 24px; gap: 8px; align-items: center; min-height: 44px; padding: 4px 4px 4px 6px; border-bottom: 1px solid var(--line); font-size: 13px; border-radius: 6px; }
  .prow:hover, .prow:focus-within { background: var(--row-hover); }
  .prow.paid { background: color-mix(in srgb, var(--dot-ok) 7%, transparent); }
  .prow.hot { background: color-mix(in srgb, var(--dot-warn) 10%, transparent); }
  .pcheck { width: 20px; height: 20px; padding: 0; border: 0; border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-3); display: grid; place-items: center; cursor: pointer; }
  .pcheck .i { width: 12px; height: 12px; color: #fff; stroke-width: 2.6; opacity: 0; }
  .prow.paid .pcheck { background: var(--dot-ok); box-shadow: none; }
  .prow.paid .pcheck .i { opacity: 1; }
  .pcheck:hover { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .prow .a { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .prow .ib { width: 24px; height: 24px; opacity: 0; }
  .prow:hover .ib, .prow:focus-within .ib { opacity: 1; }
  .fee-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; background: var(--inverse); color: #fff; font-size: 13px; margin-top: 8px; }
  .fee-top b { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .fee-top small { display: block; font-size: 12px; opacity: 0.7; }
  .two-c { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  .tile { padding: 8px 12px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line-2); font-size: 12px; color: var(--text-2); }
  .tile b { display: block; font-size: 14px; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile.dimmed { opacity: 0.5; }
  .three-c { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
  .brow { display: flex; align-items: center; gap: 8px; min-height: 40px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .brow .g { flex: 1; min-width: 0; }
  .brow small { display: block; font-size: 12px; color: var(--text-2); }
  .alert { display: flex; gap: 8px; padding: 9px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; background: color-mix(in srgb, var(--dot-warn) 16%, transparent); color: var(--warn); }
  .alert.red { background: color-mix(in srgb, var(--danger) 9%, transparent); color: var(--danger); }
  .alert.info { background: var(--accent-soft); color: var(--accent-ink); }
  .alert .i { margin-top: 2px; }
  .pfoot { display: flex; align-items: center; gap: 6px; padding: 10px 16px; border-top: 1px solid var(--line-2); flex: none; }
  .btn.dl { color: var(--danger); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 40%, transparent); }
  /* 창 */
  .mback { position: fixed; inset: 0; z-index: 150; background: rgba(16, 24, 40, 0.28); display: grid; place-items: center; animation: fade 0.12s; }
  .modal { width: 520px; max-width: calc(100vw - 32px); max-height: calc(100vh - 64px); display: flex; flex-direction: column; border-radius: 14px; background: var(--paper); box-shadow: 0 24px 64px rgba(16, 24, 40, 0.3); animation: pop-in 0.15s ease-out; }
  .m-h { padding: 18px 20px 4px; }
  .m-h h3 { margin: 0; font-size: 16px; font-weight: 650; }
  .m-h p { margin: 4px 0 0; font-size: 13px; color: var(--text-2); }
  .m-b { padding: 12px 20px; overflow: auto; }
  .m-f { display: flex; justify-content: flex-end; gap: 6px; padding: 12px 20px 16px; }
  .frm { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .frm label, .frm .fl { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-2); min-width: 0; }
  .frm .full { grid-column: 1 / -1; }
  .frm .row { flex-direction: row; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
  .inp { height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2); font: inherit; font-size: 13px; color: var(--text); outline: 0; }
  .inp:focus { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  textarea.inp { height: auto; padding: 8px 10px; resize: vertical; line-height: 1.5; }
  .btn.primary.dng { background: var(--danger); }
  .echo { font-size: 12px; color: var(--text-2); min-height: 18px; }
  .pick { max-height: 168px; overflow: auto; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line-2); }
  .pick > div { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 2px 10px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .pick > div:last-child { border-bottom: 0; }
  .pick > div:hover { background: var(--row-hover); }
  .pick > div.on { background: var(--accent-soft); }
  .pick .g { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick .none { justify-content: center; color: var(--text-3); cursor: default; }
</style>
</head>
<body data-active="deals">
<main id="page">
  <div class="ph">
    <h1>거래관리</h1>
    <span class="count" id="total"></span>
    <div class="meta">
      <span class="lnk" data-jump="live"><span class="dot accent"></span>진행 <b id="nLive"></b></span>
      <span class="lnk" data-jump="risk"><span class="dot warn"></span>일정 주의 <b id="nRisk"></b></span>
    </div>
    <div class="actions">
      <button class="btn primary" id="newBtn"></button>
    </div>
  </div>

  <div class="vbar">
    <div class="vtab on" data-kind="all">전체 <span class="n"></span></div>
    <div class="vtab" data-kind="sale">매매 <span class="n"></span></div>
    <div class="vtab" data-kind="jeonse">전세 <span class="n"></span></div>
    <div class="vtab" data-kind="monthly">월세 <span class="n"></span></div>
    <div class="vtools">
      <label class="field" data-icon="search"><input id="q" placeholder="매물, 고객, 주소 검색" aria-label="검색"><kbd>⌘F</kbd></label>
      <span class="vsep"></span>
      <div class="seg" id="denSeg"><button data-den="full" data-icon="list" title="카드 자세히">자세히</button><button data-den="compact" data-icon="sliders" title="카드 간결하게">간결하게</button></div>
      <div class="seg" id="viewSeg"><button data-view="board" data-icon="board">보드</button><button data-view="list" data-icon="table">리스트</button></div>
    </div>
  </div>

  <div class="fbar show" id="fbar">
    <span id="fsels" style="display:contents"></span>
    <button class="btn quiet sm" data-clear hidden>초기화</button>
    <span class="res" id="res"></span>
  </div>

  <div class="split">
    <div class="scroll" id="scroll">
      <div id="main"></div>
      <div id="archive"></div>
      <div class="sumbar" id="foot"></div>
    </div>
    <aside class="peek over" id="peek" hidden></aside>
  </div>
</main>

<script src="shell.js"></script>
<script>
const { icon, av, won } = UI;
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
// 원본 formatMoney: 158000 → 15억 8,000만, 5000 → 5,000만, 없으면 —
const man = (v) => (!v ? '—' : v % 10000 || v < 10000 ? `${won(v)}만` : won(v));
const TODAY = '2026-11-11';
const dnum = (s) => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const diff = (a, b = TODAY) => dnum(a) - dnum(b);
const dot = (s) => (s ? s.replace(/-/g, '.') : '');
const md = (s) => { const [, m, d] = s.split('-').map(Number); return `${m}/${d}`; };
const dlabel = (due) => { if (!due) return '미정'; const n = diff(due); return n > 0 ? `D-${n}` : n === 0 ? 'D-Day' : `D+${-n}`; };
const KIND = { sale: '매매', jeonse: '전세', monthly: '월세' };
// 원본 DealStage: preparing → preContract(선택) → contracted → settling → completed → closed
const STG = ['계약 준비', '가계약', '본계약', '중도금/잔금', '잔금완료', '정산종료'];
const GRP = ['계약 준비', '가계약', '본계약', '중도금·잔금', '잔금 완료'];
const SDOT = ['', 'accent', 'accent', 'warn', 'ok', ''];
const TARGET = [7, 5, 14, 7, 10];
const CSTAT = { draft: ['작성중', ''], signed: ['서명완료', 'accent'], depositPaid: ['계약금 완료', 'accent'], balancePaid: ['잔금 완료', 'ok'], registered: ['등기 완료', 'done'], cancelled: ['취소', 'hold'] };
const SIDE = { seller: '매도측', buyer: '매수측', both: '양측' };
const PARTNERS = [['상일 한빛공인중개', '02-442-7781'], ['고덕 믿음부동산', '02-481-3360'], ['강일 새봄공인중개', '02-427-9054']];
const TODO = [
  ['최종 합의 조건 확인', '계약 당사자·필요 서류 확인', '가계약 여부와 본계약 일정 결정'],
  ['가계약금 입금 확인', '본계약 일정 확정', '계약 필요 서류 안내'],
  ['계약서 서명·날인', '계약금 입금 확인', '중도금 일정 캘린더 등록', '확인설명서 교부'],

  document.body.append(back);
  const close = () => back.remove();
  back.addEventListener('mousedown', (e) => { if (e.target === back) close(); });
  back.addEventListener('click', (e) => { if (e.target.closest('[data-mx]')) close(); else if (e.target.closest('[data-mok]') && onOk(back) !== false) close(); });

}

document.addEventListener('dragstart', (e) => { const c = e.target.closest && e.target.closest('.card'); if (!c) return; state.drag = +c.dataset.d; c.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', c.dataset.d); });
document.addEventListener('dragover', (e) => { const col = e.target.closest && e.target.closest('.col'); if (!col || state.drag == null) return; e.preventDefault(); document.querySelectorAll('.col.over').forEach((c) => c !== col && c.classList.remove('over')); col.classList.add('over'); });
document.addEventListener('dragend', () => { state.drag = null; document.querySelectorAll('.col.over, .card.drag').forEach((c) => c.classList.remove('over', 'drag')); });
document.addEventListener('drop', (e) => { const col = e.target.closest && e.target.closest('.col'); const d = DEALS.find((x) => x.id === state.drag); state.drag = null; if (!col || !d) return; e.preventDefault(); col.classList.remove('over'); moveStage(d, +col.dataset.col); });
document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
document.addEventListener('keydown', (e) => {
  if (e.isComposing || e.keyCode === 229) return;
  if (document.querySelector('.mback')) return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-open], [data-todo]')) { e.preventDefault(); e.target.click(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); document.getElementById('q').focus(); return; }
  if (e.key === 'Escape') { if (e.target.matches('input')) { e.target.blur(); return; } if (state.detail != null) { state.detail = null; render(); } }
});

// ?dealId= 로 들어오면 그 거래 상세를 연다(원본과 같음)
const want = new URLSearchParams(location.search).get('dealId');
if (want != null && DEALS.some((d) => String(d.id) === want)) state.detail = +want;
render();
