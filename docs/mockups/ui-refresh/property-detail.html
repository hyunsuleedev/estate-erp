<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매물 상세 · Notion 스타일 데모</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="ui.css">
<style>
  /*
   * 매물 상세 — Notion 데이터베이스 페이지 레이아웃(아이콘·제목 → 고정 속성 → 본문 / 접히는 속성 패널)
   * Notion 값: 글자 rgb(55,53,47), 보조 rgba(55,53,47,.65), 선 rgb(233,233,231), 모서리 4px,
   * 선택 태그 색은 Notion 밝은 테마의 select 색.
   */
  :root {
    --n-text: rgb(55, 53, 47);
    --n-text-2: rgba(55, 53, 47, 0.65);
    --n-text-3: rgba(55, 53, 47, 0.45);
    --n-line: rgb(233, 233, 231);
    --n-hover: rgba(55, 53, 47, 0.06);
    --n-press: rgba(55, 53, 47, 0.1);
    --n-callout: rgb(247, 246, 243);
    --n-blue: rgb(35, 131, 226);
    --n-r: 4px;
  }
  .pd { flex: 1; min-height: 0; display: flex; color: var(--n-text); }
  .pd .i { width: 16px; height: 16px; }

  /* 선택·상태 태그 (Notion select 색) */
  .nt { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 6px; border-radius: 3px; font-size: 13px; line-height: 20px; white-space: nowrap; background: rgba(227, 226, 224, 0.6); color: rgb(50, 48, 44); }
  .nt .d { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.6; }
  .nt.gray { background: rgba(227, 226, 224, 0.6); color: rgb(50, 48, 44); }
  .nt.brown { background: rgb(238, 224, 218); color: rgb(68, 42, 30); }
  .nt.orange { background: rgb(250, 222, 201); color: rgb(73, 41, 14); }
  .nt.yellow { background: rgb(253, 236, 200); color: rgb(64, 44, 27); }
  .nt.green { background: rgb(219, 237, 219); color: rgb(28, 56, 41); }
  .nt.blue { background: rgb(211, 229, 239); color: rgb(24, 51, 71); }
  .nt.purple { background: rgb(232, 222, 238); color: rgb(65, 36, 84); }
  .nt.pink { background: rgb(245, 224, 233); color: rgb(76, 35, 55); }
  .nt.red { background: rgb(255, 226, 221); color: rgb(93, 23, 21); }
  .nt.click { cursor: default; }
  .nt.click:hover { filter: brightness(0.96); }

  /* ── 본문 ── */
  .pd-main { flex: 1; min-width: 0; overflow: auto; position: relative; scroll-behavior: smooth; }
  .doc { max-width: 940px; margin: 0 auto; padding: 22px 40px 140px; }

  /* 고정 머리: 제목이 가려지면 나타난다 */
  .stick {
    position: sticky; top: 0; z-index: 6; height: 0; overflow: visible;
  }
  .stick-in {
    display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 20px 0 24px;
    background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(6px);
    box-shadow: 0 1px 0 var(--n-line);
    transform: translateY(-48px); opacity: 0; transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.14s;
  }
  .stick.show .stick-in { transform: none; opacity: 1; }
  .stick .t { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .stick .p { display: flex; gap: 12px; font-size: 13px; color: var(--n-text-2); white-space: nowrap; overflow: hidden; }
  .stick .p b { color: var(--n-text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .stick .sp { flex: 1; }

  /* 아이콘·제목 */
  .doc-head { position: relative; padding-top: 28px; }
  .doc-title { margin: 0; padding-right: 200px; font-size: 34px; line-height: 1.22; font-weight: 700; letter-spacing: -0.025em; }
  .doc-title .u { font-variant-numeric: tabular-nums; }
  .doc-sub { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 14px; color: var(--n-text-2); }
  .doc-sub .sep { color: rgba(55, 53, 47, 0.25); }
  .spec { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; }
  .spec span { display: inline-flex; align-items: center; gap: 6px; }
  .spec .i { width: 15px; height: 15px; color: var(--n-text-3); }
  .spec small { font-size: 13px; color: var(--n-text-3); }
  .head-actions { position: absolute; right: 0; top: 32px; display: flex; gap: 4px; }

  /* Notion 버튼(글자형) */
  .nb { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border: 0; border-radius: var(--n-r); background: transparent; color: var(--n-text-2); font-size: 14px; cursor: default; white-space: nowrap; transition: background-color 0.1s, color 0.1s; }
  .nb:hover { background: var(--n-hover); color: var(--n-text); }
  .nb:active { background: var(--n-press); }
  .nb.on { background: var(--n-hover); color: var(--n-text); }
  .nb .i { width: 15px; height: 15px; }
  .nb.solid { background: var(--n-blue); color: #fff; padding: 0 10px; font-weight: 500; }
  .nb.solid:hover { background: rgb(5, 112, 222); color: #fff; }
  .nb.line { box-shadow: inset 0 0 0 1px rgba(55, 53, 47, 0.16); color: var(--n-text); }
  .nb.line:hover { background: var(--n-hover); }
  .nb kbd { font: inherit; font-size: 11px; color: var(--n-text-3); margin-left: 2px; }
  .nb.solid kbd { color: rgba(255, 255, 255, 0.7); }

  /* 고정 속성(Notion Layouts의 pinned properties) */
  .pins { display: grid; grid-template-columns: repeat(4, minmax(0, auto)); justify-content: start; gap: 0 4px; margin: 20px 0 6px -8px; }
  .pin { min-width: 0; padding: 6px 8px 7px; border-radius: var(--n-r); cursor: default; }
  .pin:hover { background: var(--n-hover); }
  .pin .k { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--n-text-2); white-space: nowrap; }
  .pin .k .i { width: 14px; height: 14px; color: var(--n-text-3); }
  .pin .v { margin-top: 3px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 14px; min-height: 22px; }
  .pin .v b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .pin .v .t3 { color: var(--n-text-3); }
  .pin + .pin { margin-left: 12px; }

  /* 상담 입력칸 (Notion 댓글 상자 문법) */
  .cmp { margin: 12px 0 0; padding: 10px 0 14px; border-bottom: 1px solid var(--n-line); }
  .cmp-row { display: flex; align-items: flex-start; gap: 10px; }
  .cmp-row .av { margin-top: 3px; }
  .cmp-ph { flex: 1; height: 30px; display: flex; align-items: center; padding: 0 8px; margin-left: -8px; border-radius: var(--n-r); color: var(--n-text-3); font-size: 14px; cursor: text; }
  .cmp-ph:hover { background: var(--n-hover); }
  .cmp-ph kbd { margin-left: auto; font: inherit; font-size: 12px; color: var(--n-text-3); }
  .cmp-box { flex: 1; min-width: 0; }
  .cmp-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
  .who-pick { height: 26px; display: inline-flex; align-items: center; gap: 6px; padding: 0 6px 0 4px; border: 0; border-radius: var(--n-r); background: rgba(35, 131, 226, 0.08); color: rgb(29, 109, 191); font-size: 13px; cursor: default; }
  .who-pick:hover { background: rgba(35, 131, 226, 0.14); }
  .who-pick small { color: rgba(29, 109, 191, 0.7); }
  .who-pick .i { width: 13px; height: 13px; }
  .tseg { display: inline-flex; padding: 2px; border-radius: 6px; background: rgba(55, 53, 47, 0.06); }
  .tseg button { height: 22px; padding: 0 9px; border: 0; border-radius: 4px; background: transparent; color: var(--n-text-2); font-size: 13px; cursor: default; }
  .tseg button.on { background: #fff; color: var(--n-text); box-shadow: 0 1px 2px rgba(15, 15, 15, 0.1); }
  .cmp textarea { display: block; width: 100%; min-height: 64px; resize: none; border: 0; outline: 0; padding: 6px 0; font: inherit; font-size: 14px; line-height: 1.6; color: var(--n-text); background: transparent; field-sizing: content; }
  .cmp textarea::placeholder { color: var(--n-text-3); }
  .cmp-foot { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .cmp-foot .sp { flex: 1; }
  .ckl { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--n-text-2); cursor: default; user-select: none; }
  .ckl:hover { color: var(--n-text); }

  /* 체크 칸 (Notion to-do) */
  .cb { width: 16px; height: 16px; flex: none; display: inline-grid; place-items: center; border-radius: 3px; box-shadow: inset 0 0 0 1.5px rgba(55, 53, 47, 0.85); background: #fff; color: #fff; cursor: default; transition: background-color 0.12s, box-shadow 0.12s; }
  .cb .i { width: 12px; height: 12px; stroke-width: 3; opacity: 0; }
  .cb:hover { background: var(--n-hover); }
  .cb.on { background: var(--n-blue); box-shadow: none; }
  .cb.on .i { opacity: 1; }

  /* 구역 제목 (Notion 제목 2) */
  .h2 { display: flex; align-items: center; gap: 8px; margin: 40px 0 8px; font-size: 20px; line-height: 1.3; font-weight: 600; letter-spacing: -0.01em; }
  .h2 .n { font-size: 15px; font-weight: 500; color: var(--n-text-3); }
  .h2 .act { margin-left: auto; display: flex; gap: 2px; }

  /* 콜아웃 (지금 챙길 것) */
  .callout { display: flex; gap: 10px; margin-top: 18px; padding: 14px 16px 12px 12px; border-radius: var(--n-r); background: var(--n-callout); }
  .callout > .ic { width: 24px; height: 24px; display: grid; place-items: center; flex: none; color: rgb(203, 145, 47); }
  .callout > .ic .i { width: 20px; height: 20px; }
  .callout .ct { flex: 1; min-width: 0; }
  .callout .ttl { font-size: 14px; font-weight: 600; line-height: 24px; }
  .callout .ttl .n { color: var(--n-text-3); font-weight: 500; margin-left: 4px; }
  .todo { display: flex; align-items: flex-start; gap: 10px; padding: 5px 4px 5px 2px; margin: 0 -4px 0 -2px; border-radius: var(--n-r); }
  .todo:hover { background: rgba(55, 53, 47, 0.04); }
  .todo .cb { margin-top: 3px; }
  .todo .tx { flex: 1; min-width: 0; font-size: 14px; line-height: 22px; }
  .todo .tx small { display: block; font-size: 13px; line-height: 19px; color: var(--n-text-2); }
  .todo .tx b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .todo .go { flex: none; height: 26px; font-size: 13px; }
  .todo.done .tx { color: var(--n-text-3); text-decoration: line-through; text-decoration-color: rgba(55, 53, 47, 0.3); }
  .todo.done .tx small { color: var(--n-text-3); }
  .todo.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { background: rgba(35, 131, 226, 0.14); } 100% { background: transparent; } }
  .togg { display: inline-flex; align-items: center; gap: 4px; height: 26px; margin-top: 2px; padding: 0 6px 0 2px; border: 0; border-radius: var(--n-r); background: transparent; color: var(--n-text-2); font-size: 13px; cursor: default; }
  .togg:hover { background: var(--n-hover); }
  .togg .i { width: 14px; height: 14px; transition: transform 0.15s; }
  .togg.is-open .i { transform: rotate(90deg); }

  /* 인라인 데이터베이스 (Notion 표) */
  .db { margin-top: 8px; }
  .db-bar { display: flex; align-items: center; gap: 2px; height: 34px; border-bottom: 1px solid var(--n-line); }
  .vt { height: 34px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border: 0; background: transparent; font-size: 14px; color: var(--n-text-2); cursor: default; position: relative; }
  .vt .i { width: 15px; height: 15px; }
  .vt:hover { color: var(--n-text); }
  .vt.on { color: var(--n-text); font-weight: 500; }
  .vt.on::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--n-text); border-radius: 1px; }
  .db-bar .sp { flex: 1; }
  .ntbl-wrap { overflow-x: auto; }
  .ntbl { width: 100%; min-width: 780px; border-collapse: collapse; table-layout: fixed; font-size: 14px; }
  .ntbl th { height: 33px; padding: 0 8px; text-align: left; font-weight: 400; font-size: 14px; color: var(--n-text-2); border-bottom: 1px solid var(--n-line); border-right: 1px solid var(--n-line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; }
  .ntbl th:hover { background: var(--n-hover); }
  .ntbl th .i { width: 14px; height: 14px; color: var(--n-text-3); margin-right: 6px; vertical-align: -2px; }
  .ntbl td { padding: 6px 8px; vertical-align: top; border-bottom: 1px solid var(--n-line); border-right: 1px solid var(--n-line); line-height: 21px; }
  .ntbl th:last-child, .ntbl td:last-child { border-right: 0; }
  .ntbl tbody tr:hover td { background: rgba(55, 53, 47, 0.025); }
  .ntbl td.r, .ntbl th.r { text-align: right; }
  .ntbl .num { font-variant-numeric: tabular-nums; }
  .ntbl .muted { color: var(--n-text-3); }
  .ntbl .warn { color: rgb(203, 107, 31); }
  .cellbtn { display: block; width: calc(100% + 8px); margin: -3px -4px; padding: 3px 4px; border: 0; border-radius: var(--n-r); background: transparent; text-align: left; font: inherit; color: inherit; cursor: default; }
  .cellbtn:hover { background: var(--n-hover); }
  .price { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .delta { display: block; font-size: 12px; font-variant-numeric: tabular-nums; }
  .delta.down { color: rgb(68, 131, 97); }
  .delta.up { color: rgb(212, 76, 71); }
  .delta small { color: var(--n-text-3); font-size: 12px; }
  .ttl-cell { position: relative; display: flex; align-items: center; gap: 6px; min-height: 21px; }
  .ttl-cell .rowopen { position: absolute; right: -4px; top: 50%; transform: translateY(-50%); white-space: nowrap; height: 22px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border: 0; border-radius: var(--n-r); background: #fff; box-shadow: 0 0 0 1px rgba(15, 15, 15, 0.1), 0 2px 4px rgba(15, 15, 15, 0.1); font-size: 12px; color: var(--n-text-2); opacity: 0; cursor: default; }
  .ttl-cell .rowopen .i { width: 12px; height: 12px; }
  tr:hover .ttl-cell .rowopen { opacity: 1; }
  .newrow td { color: var(--n-text-3); border-right: 0; cursor: default; }
  .newrow td:hover { background: var(--n-hover) !important; color: var(--n-text-2); }
  .newrow .i { width: 14px; height: 14px; vertical-align: -2px; margin-right: 6px; }
  .nv { display: block; width: calc(100% + 8px); margin: -3px -4px; padding: 3px 4px; border: 0; border-radius: var(--n-r); background: transparent; text-align: left; font: inherit; font-size: 13px; color: var(--n-text-2); cursor: default; line-height: 19px; }
  .nv:hover { background: var(--n-hover); }
  .nv b { color: var(--n-text); font-weight: 500; font-variant-numeric: tabular-nums; }
  .nv .bad { color: rgb(212, 76, 71); }
  .adline { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .adline small { font-size: 12px; color: rgb(203, 107, 31); font-variant-numeric: tabular-nums; }

  /* 거래 블록 (Notion 하위 페이지 링크 + 단계) */
  .deal { margin-top: 14px; border-radius: var(--n-r); box-shadow: 0 0 0 1px var(--n-line); }
  .deal.flash { animation: flash 1.4s ease-out; }
  .deal-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--n-line); }
  .deal-h .pg { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; text-decoration: underline; text-decoration-color: rgba(55, 53, 47, 0.25); text-underline-offset: 3px; cursor: default; }
  .deal-h .pg:hover { background: var(--n-hover); border-radius: 3px; }
  .deal-h .pg .i { width: 15px; height: 15px; color: var(--n-text-3); }
  .deal-h .meta { font-size: 13px; color: var(--n-text-2); }
  .deal-h .sp { flex: 1; }
  .steps { display: flex; align-items: center; gap: 0; padding: 12px 12px 4px; overflow-x: auto; }
  .step { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--n-text-3); white-space: nowrap; }
  .step .m { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px rgba(55, 53, 47, 0.2); }
  .step .m .i { width: 10px; height: 10px; stroke-width: 3; }
  .step.done { color: var(--n-text-2); }
  .step.done .m { background: rgb(68, 131, 97); box-shadow: none; color: #fff; }
  .step.cur { color: var(--n-text); font-weight: 600; }
  .step.cur .m { box-shadow: inset 0 0 0 5px var(--n-text); }
  .steps .ln { width: 24px; height: 1px; flex: none; background: rgba(55, 53, 47, 0.16); margin: 0 10px; }
  .pays { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; padding: 8px 4px 10px; }
  .pay { padding: 6px 8px; border-radius: var(--n-r); }
  .pay .k { font-size: 12px; color: var(--n-text-2); display: flex; align-items: center; gap: 6px; }
  .pay .a { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pay .w { font-size: 12px; color: var(--n-text-2); font-variant-numeric: tabular-nums; }
  .pay .w.soon { color: rgb(203, 107, 31); font-weight: 500; }

  /* 기록 (Notion 댓글·변경 기록 문법) */
  .rtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--n-line); margin-top: 4px; }
  .pinned { margin-top: 12px; padding: 4px 0; }
  .pinned-h { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--n-text-2); padding: 4px 0; }
  .pinned-h .i { width: 13px; height: 13px; }
  .dgrp { margin-top: 14px; }
  .dgrp-h { font-size: 12px; font-weight: 600; color: var(--n-text-2); padding: 4px 0 2px; }
  .rec { position: relative; display: flex; gap: 10px; padding: 8px 6px; margin: 0 -6px; border-radius: var(--n-r); }
  .rec:hover { background: rgba(55, 53, 47, 0.03); }
  .rec.new { animation: flash 1.6s ease-out; }
  .rec .ri { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; background: rgb(241, 240, 236); color: rgb(120, 117, 110); }
  .rec .ri .i { width: 14px; height: 14px; }
  .rec .ri.call { background: rgb(231, 243, 248); color: rgb(51, 126, 169); }
  .rec .ri.visit { background: rgb(244, 240, 247); color: rgb(144, 101, 176); }
  .rec .ri.text { background: rgb(241, 240, 236); color: rgb(120, 117, 110); }
  .rec .ri.confirm { background: rgb(237, 243, 236); color: rgb(68, 131, 97); }
  .rec .ri.price { background: rgb(253, 235, 236); color: rgb(205, 60, 58); }
  .rec .ri.price.down { background: rgb(237, 243, 236); color: rgb(68, 131, 97); }
  .rec .ri.ad { background: rgb(251, 243, 219); color: rgb(203, 145, 47); }
  .rec .ri.deal { background: rgb(231, 243, 248); color: rgb(51, 126, 169); }
  .rec .ri.intake { background: rgb(241, 240, 236); color: rgb(120, 117, 110); }
  .rec .rb { flex: 1; min-width: 0; }
  .rec .l1 { display: flex; align-items: baseline; gap: 6px; font-size: 14px; line-height: 22px; min-width: 0; }
  .rec .l1 .tt { font-weight: 600; white-space: nowrap; }
  .rec .l1 .mt { color: var(--n-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rec .l1 .sm { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rec .l1 .tm { margin-left: auto; padding-left: 8px; font-size: 12px; color: var(--n-text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rec .by { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--n-text-3); }
  .rec .by .av { width: 16px; height: 16px; font-size: 9px; }
  .rec .body { margin: 2px 0 0; font-size: 14px; line-height: 1.65; color: rgba(55, 53, 47, 0.9); white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
  .rec .body.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .rec .more { border: 0; background: transparent; padding: 0; margin-top: 2px; font-size: 13px; color: var(--n-text-2); cursor: default; }
  .rec .more:hover { color: var(--n-text); text-decoration: underline; }
  .rec .tools { position: absolute; right: 6px; top: 6px; display: flex; gap: 2px; padding: 2px; border-radius: 6px; background: #fff; box-shadow: 0 0 0 1px rgba(15, 15, 15, 0.08), 0 3px 8px rgba(15, 15, 15, 0.08); opacity: 0; pointer-events: none; transition: opacity 0.1s; }
  .rec:hover .tools { opacity: 1; pointer-events: auto; }
  .rec:hover .l1 .tm { visibility: hidden; }
  .rec .tools .nb { height: 24px; padding: 0 6px; font-size: 12px; }
  .rec .tools .nb .i { width: 13px; height: 13px; }
  .rec.is-pinned .ri { box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px rgb(203, 145, 47); }

  const staleAd = (o) => o.ads.find((a) => a.price !== o.price) || null;
  const cheaper = (o) => o.naver.filter((n) => !n.ours && n.price < o.price);

  const ourRank = (o) => (o.naver.find((n) => n.ours) || {}).rank || null;
  const offerStatus = (o) => (o.contract ? ['거래중', 'blue'] : o.paused ? ['중단', 'yellow'] : ['활성', 'green']);
  const people = () => [...S.people, ...S.tenants.map((t) => ({ id: t.id, name: t.name, role: '세입자', phone: t.phone }))];
  const matchPeople = () => S.matches.map((m) => ({ id: m.id, name: m.name, role: '매수 고객' }));

  function todos() {

      if (c.length) list.push({ key: `naver-${o.id}`, text: `네이버에 같은 호실 ${o.label} 광고가 더 싸게 ${c.length}건 있습니다`, sub: `최저 ${money(naverMin(o))} · 우리 ${o.ads.length ? `${ourRank(o)}위` : '광고 없음'}`, act: '비교 보기', offer: o.id });

    const pay = S.deal.pays.find((p) => !p.paid);

    return list;
  }

  function recHtml(r, isNew, withDate) {
    const [icn] = KIND[r.kind];
    const iconName = r.kind === 'price' && r.dir === 'up' ? 'trendUp' : icn;
    const long = r.body && (r.body.length > 120 || r.body.split('\n').length > 3);
    const open = S.expanded.has(r.id);
    return `<div class="rec ${isNew ? 'new' : ''} ${r.pinned ? 'is-pinned' : ''}" data-rec="${r.id}">
      <span class="ri ${r.kind} ${r.dir || ''}">${ic(iconName)}</span>
      <div class="rb">

        ${r.body ? `<p class="body ${long && !open ? 'clamp' : ''}">${esc(r.body)}</p>${long ? `<button class="more" data-expand="${r.id}">${open ? '접기' : '더 보기'}</button>` : ''}` : ''}

  let lastNew = null;
  function renderRecords() {
    const counts = { all: S.records.length };
    S.records.forEach((r) => { const g = KIND[r.kind][1]; counts[g] = (counts[g] || 0) + 1; });
    const pinned = S.records.filter((r) => r.pinned);
    const list = S.records.filter((r) => S.filter === 'all' || KIND[r.kind][1] === S.filter);
    const groups = [];
    list.forEach((r) => {
      const key = day0(r.at);
      let g = groups[groups.length - 1];
      if (!g || g.key !== key) { g = { key, at: r.at, items: [] }; groups.push(g); }
      g.items.push(r);
    });
    $('#records').innerHTML = `
      <div class="h2">기록<span class="n">${S.records.length}</span><span class="act"><button class="nb" data-focus-composer>${I('plus')}상담 기록</button></span></div>
      <div class="rtabs" role="tablist" aria-label="기록 종류">${FILTERS.map(([k, l]) => `<button class="vt ${S.filter === k ? 'on' : ''}" role="tab" aria-selected="${S.filter === k}" data-filter="${k}">${l}<span style="color:var(--n-text-3);font-weight:400">${counts[k] || 0}</span></button>`).join('')}</div>
      ${pinned.length && S.filter === 'all' ? `<div class="pinned"><div class="pinned-h">${ic('pinOn')}고정한 기록 ${pinned.length}</div>${pinned.map((r) => recHtml(r, false, true)).join('')}</div>` : ''}
      ${groups.map((g) => `<div class="dgrp"><div class="dgrp-h">${dayLabel(g.at)}</div>${g.items.map((r) => recHtml(r, r.id === lastNew)).join('')}</div>`).join('') || '<p style="color:var(--n-text-3);font-size:14px;margin-top:16px">이 종류의 기록이 없습니다.</p>'}`;
    lastNew = null;
  }

  // ── 오른쪽 속성 패널 ──
  function grp(key, title, body, extra = '') {
    return `<div class="grp ${S.groups[key] ? 'is-open' : ''}"><button class="grp-h" data-grp="${key}" aria-expanded="${S.groups[key]}">${I('chevRight')}${title}${extra}</button><div class="grp-b">${body}</div></div>`;
  }
  const prop = (icon, k, v, cls = '') => `<div class="prop"><div class="k">${icon}${k}</div><div class="v ${cls}">${v}</div></div>`;
  function personRow(p, past) {
    return `<div class="person ${past ? 'past' : ''}">
      ${UI.av(p.name, 'md')}
      <div class="pb">
        <div class="pn"><b>${p.name}</b><span class="nt ${past ? 'gray' : p.role === '소유주' ? 'brown' : 'gray'}">${p.role}</span>${p.main ? '<span class="nt gray" style="font-size:12px">주 연락처</span>' : ''}</div>
        ${p.terms ? `<div class="terms">${p.terms}</div>` : ''}
        <div class="pd2"><span class="phn" data-copy="${p.phone}" title="눌러서 번호 복사">${tel(p.phone)}</span>${p.note ? ` · ${p.note}` : ''}</div>

    </div>`;
  }
  function memoField(key, label, value, priv) {
    return `<div class="prop" style="grid-template-columns:1fr"><div class="k">${I('note')}${label}</div>
      <div class="v ${value ? '' : 'is-empty'}" data-memo="${key}" style="margin-top:-4px">${value ? `<span class="memo-v">${esc(value)}</span>` : '메모 추가'}</div></div>
      ${priv ? `<div class="privnote">${ic('lock')}<span><b style="font-weight:600">비공개</b> ${esc(priv)}</span></div>` : ''}`;
  }
  function renderSide() {
    const t = S.tenants[0];
    const tTerms = (x) => `보증금 ${money(x.deposit)}${x.rent ? ` · 월 ${money(x.rent)}` : ''}`;
    const tLine = (x, past) => personRow({ ...x, role: past ? '지난 세입자' : `세입자 · ${x.status}`, terms: tTerms(x), note: `${sd(x.start)} ~ ${sd(x.end)}${past ? '' : ` · 만기 D-${diff(TODAY, x.end)}`}${x.note ? ` · ${x.note}` : ''}` }, past);
    $('#sideIn').innerHTML = `

      ${grp('unit', '호실', [
        prop(I('building'), '단지', '<span style="text-decoration:underline;text-decoration-color:rgba(55,53,47,.25);text-underline-offset:3px">고덕그라시움</span>'),
        prop(ic('door'), '동 · 호', '103동 3401호'),
        prop(I('tag'), '유형', '<span class="nt gray">아파트</span><span class="nt gray">84A</span>'),

        prop(I('ruler'), '전용', '84.97㎡ <small>25.7평</small>'),
        prop(ic('layers'), '층', '34층 <small>/ 35층</small>'),
        prop(ic('bed'), '방 · 욕실', '3 · 2'),

        prop(ic('hammer'), '준공', '2019년 <small>4,932세대 · 51개 동</small>'),
      ].join(''))}
      <div class="side-sep"></div>
      ${grp('people', '소유주 · 관련인', `${S.people.map((p) => personRow(p)).join('')}
        <button class="togg ${S.toggles.pastOwners ? 'is-open' : ''}" data-toggle="pastOwners">${I('chevRight')}이전 소유주 ${S.pastOwners.length}</button>
        ${S.toggles.pastOwners ? S.pastOwners.map((p) => personRow(p, true)).join('') : ''}`, `<span class="n">${S.people.length}</span><span class="add nb" data-soon="소유주·관련인 추가" style="height:24px;padding:0 4px">${I('plus')}</span>`)}
      <div class="side-sep"></div>
      ${grp('lease', '임대 현황', `${S.tenants.map((x) => tLine(x)).join('')}
        <button class="togg ${S.toggles.pastTenants ? 'is-open' : ''}" data-toggle="pastTenants">${I('chevRight')}지난 세입자 ${S.pastTenants.length}</button>
        ${S.toggles.pastTenants ? S.pastTenants.map((x) => tLine(x, true)).join('') : ''}`, `<span class="add nb" data-soon="세입자 추가" style="height:24px;padding:0 4px">${I('plus')}</span>`)}
      <div class="side-sep"></div>
      ${grp('intake', '의뢰', [
        prop(I('cal'), '접수', `${fd(S.intake.received)} <small>${diff(S.intake.received, TODAY)}일째</small>`),
        prop(ic('calCheck'), '다음 확인', `${md(S.confirm.next)} <small>${due(S.confirm.next)}</small>`),
        prop(I('users'), '공동중개', S.intake.joint ? '필수' : '<span style="color:var(--n-text-3)">없음</span>'),
        memoField('intake', '의뢰 메모', S.intake.memo),
        `<button class="togg ${S.toggles.pastIntakes ? 'is-open' : ''}" data-toggle="pastIntakes">${I('chevRight')}지난 의뢰 ${S.pastIntakes.length}</button>`,
        S.toggles.pastIntakes ? S.pastIntakes.map((x) => prop(I('clock'), '기간', `${x.period}<br><span class="nt gray">${x.status}</span> ${x.offers}`)).join('') : '',
      ].join(''))}
      <div class="side-sep"></div>
      ${grp('memo', '거래 조건 메모', S.offers.map((o) => memoField(o.id, `${o.label} 메모`, o.memo, o.priv)).join(''))}
      <div class="side-sep"></div>
      ${grp('meta', '기타', [
        prop(ic('hash'), '매물번호', 'P-2026-01842'),
        prop(I('user'), '만든 사람', `${UI.av('이현수')}이현수 <small>10.02</small>`),
        prop(I('clock'), '수정', `${UI.av('박서연')}박서연 <small>11.10 17:10</small>`),
      ].join(''))}`;
  }

  function renderAll() {
    renderHead(); renderMini(); renderPins(); renderComposer(); renderTodo(); renderOffers(); renderProgress(); renderRecords(); renderSide();
    $('#pd').classList.toggle('side-closed', !S.sideOpen);
  }

  // ── 실행 취소 판 번호 ──
  // 값을 바꿀 때마다 그 값의 판 번호를 올린다. 실행 취소는 자기가 만든 판이 아직 마지막일 때만
  // 되돌린다. 그 사이 같은 값이 또 바뀌었으면 나중 변경을 덮어쓰지 않는다.
  const REV = {};
  const bump = (key) => (REV[key] = (REV[key] || 0) + 1);
  const fresh = (key, v) => {
    if (REV[key] === v) return true;
    UI.toast('그 뒤에 다시 바뀌어서 되돌리지 않았습니다');
    return false;
  };

  // ── 동작 ──
  function addRecord(r) {
    const nr = rec(r);
    S.records.unshift(nr);
    lastNew = nr.id;
    return nr;
  }
  function removeRecord(id) { S.records = S.records.filter((r) => r.id !== id); }
  const nowTime = () => { const n = new Date(); return `${pad(n.getHours())}:${pad(n.getMinutes())}`; };

  function confirmNow(via) {
    const prev = { ...S.confirm };
    S.confirm = { last: new Date(TODAY), next: new Date(TODAY.getTime() + 14 * 864e5), result: 'alive' };
    const v = bump('confirm');
    const r = via ? null : addRecord({ kind: 'confirm', at: new Date(TODAY), time: nowTime(), who: '김정훈 · 소유주', by: S.me, title: '매물 확인', body: '가격·거래 가능 여부 변동 없음' });
    renderAll();
    if (!via) UI.toast(`매물 확인을 기록했습니다 · 다음 확인 ${md(S.confirm.next)}`, () => { if (!fresh('confirm', v)) return; S.confirm = prev; if (r) removeRecord(r.id); renderAll(); });
    return prev;
  }

  function saveComposer() {
    const c = S.composer;
    const text = ($('#cmpText')?.value || '').trim();
    if (!text) { UI.toast('내용을 적어야 기록할 수 있습니다'); $('#cmpText')?.focus(); return; }
    const all = [...people(), ...matchPeople()];
    const who = all.find((p) => p.id === c.who) || all[0];
    const ownerSide = ['소유주', '공동소유', '대리인'].includes(who.role);
    const asConfirm = ownerSide && c.confirm;
    const titles = { call: '전화 상담', visit: '방문 상담', text: '문자 상담' };
    const r = addRecord({ kind: asConfirm ? 'confirm' : c.type, at: new Date(TODAY), time: nowTime(), who: `${who.name} · ${who.role}`, by: S.me, title: asConfirm ? `매물 확인 · ${titles[c.type].replace(' 상담', '')}` : titles[c.type], body: text });
    const prevConfirm = asConfirm ? { ...S.confirm } : null;
    const cv = asConfirm ? bump('confirm') : null;
    if (asConfirm) S.confirm = { last: new Date(TODAY), next: new Date(TODAY.getTime() + 14 * 864e5), result: 'alive' };
    $('#cmpText').value = '';
    S.composer = { ...S.composer, open: false, text: '' };
    S.filter = 'all';
    renderAll();
    document.querySelector(`[data-rec="${r.id}"]`)?.scrollIntoView({ block: 'center' });
    UI.toast(asConfirm ? '상담을 기록하고 매물 확인도 남겼습니다' : '상담을 기록했습니다', () => {
      if (asConfirm && !fresh('confirm', cv)) return;
      removeRecord(r.id);
      if (prevConfirm) S.confirm = prevConfirm;
      renderAll();
    });
  }

  // 떠 있는 편집 창
  let pop = null;
  const closePop = () => { if (pop) { pop.remove(); pop = null; } };
  function openPop(anchor, html, wide) {
    closePop();
    pop = document.createElement('div');
    pop.className = `npop ${wide ? 'wide' : ''}`;
    pop.innerHTML = html;
    document.body.append(pop);
    const r = anchor.getBoundingClientRect();
    const x = Math.max(8, Math.min(r.left, innerWidth - pop.offsetWidth - 8));
    let y = r.bottom + 6;
    if (y + pop.offsetHeight > innerHeight - 8) y = Math.max(8, r.top - pop.offsetHeight - 6);
    pop.style.left = `${x}px`; pop.style.top = `${y}px`;
    return pop;
  }
  document.addEventListener('mousedown', (e) => { if (pop && !pop.contains(e.target)) closePop(); }, true);

  function editPrice(btn, id) {
    const o = S.offers.find((x) => x.id === id);
    const p = openPop(btn, `
      <h4>${o.label}가 · 만원 단위</h4>
      <div class="inp"><input id="pv" inputmode="numeric" value="${o.price}" aria-label="${o.label}가"><span class="unit">만원</span></div>
      <div class="hint" id="pvh">= ${money(o.price)}</div>
      <div class="inp"><input id="pr" placeholder="바꾼 이유 (기록에 남습니다)" aria-label="바꾼 이유"></div>
      <div class="row"><button class="nb" data-pop-cancel>취소</button><button class="nb solid" data-pop-save>저장 <kbd>↵</kbd></button></div>`);
    const input = $('#pv', p), reason = $('#pr', p);
    input.select();
    input.addEventListener('input', () => { const v = parseInt(input.value.replace(/\D/g, ''), 10); $('#pvh', p).textContent = v ? `= ${money(v)}${v !== o.price ? ` · ${v < o.price ? '↓' : '↑'} ${money(Math.abs(v - o.price))}` : ''}` : '숫자를 입력하세요'; });
    const save = () => {
      const v = parseInt(input.value.replace(/\D/g, ''), 10);
      if (!v) return input.focus();
      closePop();
      if (v === o.price) return;
      const prev = { price: o.price, hist: o.hist.slice() };
      const wasStale = !!staleAd(o);
      o.hist.unshift({ at: new Date(TODAY), from: o.price, to: v });
      const pv = bump(`price:${o.id}`);
      const r = addRecord({ kind: 'price', dir: v < o.price ? 'down' : 'up', at: new Date(TODAY), time: nowTime(), who: o.label, by: S.me, title: '가격 변경', sum: `${money(o.price)} → ${money(v)}`, body: reason.value.trim() || null });
      o.price = v;
      renderAll();
      const base = `${o.label}가 변경: ${money(prev.price)} → ${money(v)}`;
      const msg = staleAd(o) ? `${base} · 광고 가격과 다릅니다` : wasStale ? `${base} · 광고 가격과 같아졌습니다` : base;
      UI.toast(msg, () => { if (!fresh(`price:${o.id}`, pv)) return; o.price = prev.price; o.hist = prev.hist; removeRecord(r.id); renderAll(); });
    };
    p.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); save(); } if (e.key === 'Escape') { e.preventDefault(); closePop(); btn.focus(); } });
    $('[data-pop-save]', p).onclick = save;
    $('[data-pop-cancel]', p).onclick = closePop;
  }

  function naverPop(btn, id) {
    const o = S.offers.find((x) => x.id === id);
    const list = o.naver.slice().sort((a, b) => a.price - b.price);
    openPop(btn, `
      <h4>네이버 같은 호실 ${o.label} 광고 ${o.naver.length}건 · 11.13 08:00 수집</h4>
      <table class="cmp-tbl"><thead><tr><th>중개사</th><th class="r">가격</th><th>층 노출</th><th>확인</th><th class="r">순위</th></tr></thead>
      <tbody>${list.map((n) => `<tr class="${n.ours ? 'ours' : ''}"><td>${esc(n.ag)}</td><td class="r ${!n.ours && n.price < o.price ? 'cheap' : ''}">${money(n.price)}</td><td>${n.floor}</td><td>${n.v}</td><td class="r">${n.rank}위</td></tr>`).join('')}</tbody></table>
      <p class="hint" style="margin:10px 2px 0">우리 매물가 ${money(o.price)} 기준. ${o.ads.length ? '' : '우리 광고는 지금 올라가 있지 않습니다.'}</p>`, true);
  }

  function pageMenu(btn) {
    const open = S.sideOpen;
    UI.menu(btn, [
      { label: '거래 조건 추가', icon: 'plus', run: () => UI.toast('거래 조건 추가 창을 엽니다 (데모)') },
      { label: '소유주·관련인 추가', icon: 'user', run: () => UI.toast('관련인 추가 창을 엽니다 (데모)') },
      { label: '세입자 추가', icon: 'users', run: () => UI.toast('세입자 추가 창을 엽니다 (데모)') },
      { label: '거래 바로 만들기', icon: 'handshake', run: () => UI.toast('거래 만들기 창을 엽니다 (데모)') },
      '-', { head: '의뢰 · 접수 10.02' },
      { label: '확인 결과 기록…', icon: 'phone', run: () => confirmOther(btn) },
      { label: '의뢰 보류', icon: 'clock', run: () => UI.toast('의뢰를 보류했습니다 (데모)') },
      '-',
      { label: open ? '속성 패널 접기' : '속성 패널 펼치기', icon: 'board', run: toggleSide },
      { label: '새 창으로 열기', icon: 'arrowUpRight', run: () => UI.toast('새 창으로 엽니다 (데모)') },
      { label: '링크 복사', icon: 'copy', run: () => UI.toast('매물 링크를 복사했습니다') },
    ], { right: true });
  }

  function confirmOther(anchor) {
    UI.menu(anchor, [
      { head: '확인 결과' },
      { label: '이상 없음 (확인 완료)', icon: 'check', run: () => confirmNow() },
      { label: '가격이 바뀌었음', icon: 'won', run: () => { const b = document.querySelector('[data-edit-price="sale"]'); b.scrollIntoView({ block: 'center' }); setTimeout(() => editPrice(b, 'sale'), 250); } },
      { label: '부재중', icon: 'phone', run: () => { const prev = { ...S.confirm }; S.confirm = { ...S.confirm, result: 'noanswer', last: new Date(TODAY) }; const v = bump('confirm'); renderAll(); UI.toast('부재중으로 기록했습니다', () => { if (!fresh('confirm', v)) return; S.confirm = prev; renderAll(); }); } },
      { label: '의뢰 종료 (다른 곳에서 계약 등)…', icon: 'x', danger: true, run: () => UI.toast('의뢰 종료 사유를 고르는 창을 엽니다 (데모)') },
    ], { right: true });
  }

  function toggleSide() { S.sideOpen = !S.sideOpen; renderHead(); $('#pd').classList.toggle('side-closed', !S.sideOpen); }

  function setTodoDone(key, done) {
    if (done) S.doneTodos.add(key); else S.doneTodos.delete(key);
    renderTodo();
    return bump(`todo:${key}`);
  }
  const undoTodo = (key, v) => () => { if (fresh(`todo:${key}`, v)) setTodoDone(key, false); };

  function todoAction(key, btn) {
    if (key === 'confirm') return confirmNow();
    if (key === 'pay') {
      const b = $('#dealBlock'); b.scrollIntoView({ block: 'center' }); b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash'); return;
    }
    if (key.startsWith('naver-')) { const id = key.slice(6); const b = document.querySelector(`[data-naver="${id}"]`); b.scrollIntoView({ block: 'center' }); setTimeout(() => naverPop(b, id), 250); return; }
    if (key === 'ad') {
      UI.menu(btn, [
        { head: '이실장 광고 가격 맞추기' },
        { label: `광고 가격 수정 요청 (→ ${money(S.offers[0].price)})`, icon: 'megaphone', hint: '에이전트 업무', run: () => { const v = setTodoDone('ad', true); UI.toast('광고 수정 업무를 만들었습니다. 에이전트가 처리하면 기록에 남습니다', undoTodo('ad', v)); } },
        { label: '이실장에서 직접 고치기', icon: 'arrowUpRight', run: () => UI.toast('이실장 광고 관리 화면을 엽니다 (데모)') },
      ], { right: true });
    }
  }

  function memoEdit(el, key) {
    const target = key === 'intake' ? S.intake : S.offers.find((o) => o.id === key);
    const prev = target.memo;
    el.innerHTML = `<textarea class="memo-edit" aria-label="메모">${esc(prev)}</textarea>`;
    const ta = el.querySelector('textarea');
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    let done = false;
    const finish = (save) => {
      if (done) return; done = true;
      const next = ta.value.trim();
      if (save && next !== prev) {
        target.memo = next;
        const v = bump(`memo:${key}`);
        renderSide();
        UI.toast('메모를 저장했습니다', () => { if (!fresh(`memo:${key}`, v)) return; target.memo = prev; renderSide(); });
      } else renderSide();
    };
    ta.addEventListener('blur', () => finish(true));
    ta.addEventListener('keydown', (e) => {
      if (e.isComposing) return;
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); finish(true); }
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
    });
  }

  document.addEventListener('click', (e) => {
    const t = e.target;
    const q = (s) => t.closest(s);
    let el;
    if (q('[data-open-composer]') || q('[data-focus-composer]')) {
      S.composer.open = true; renderComposer(true); $('#composer').scrollIntoView({ block: 'center' }); return;
    }
    if (q('[data-close-composer]')) { $('#cmpText').value = ''; S.composer = { ...S.composer, open: false, text: '' }; renderComposer(); return; }
    if (q('[data-save-composer]')) return saveComposer();
    if ((el = q('[data-ctype]'))) { S.composer.type = el.dataset.ctype; renderComposer(true); return; }
    if (q('[data-cmp-confirm]')) { S.composer.confirm = !S.composer.confirm; renderComposer(true); return; }
    if ((el = q('[data-pick-who]'))) {
      const pick = (id) => { S.composer.who = id; renderComposer(true); };
      UI.menu(el, [
        { head: '이 매물의 사람' },
        ...people().map((p) => ({ label: `${p.name}`, hint: p.role, html: UI.av(p.name, 'md'), on: S.composer.who === p.id, run: () => pick(p.id) })),
        { head: '매칭된 고객' },
        ...matchPeople().map((p) => ({ label: p.name, hint: p.role, html: UI.av(p.name, 'md'), on: S.composer.who === p.id, run: () => pick(p.id) })),
        '-', { label: '새 연락처로 기록…', icon: 'plus', run: () => UI.toast('새 연락처 입력 창을 엽니다 (데모)') },
      ], { wide: true });
      return;
    }
    if ((el = q('[data-todo-check]'))) { const k = el.dataset.todoCheck; const was = S.doneTodos.has(k); const v = setTodoDone(k, !was); if (!was) UI.toast('완료로 표시했습니다', undoTodo(k, v)); return; }
    if ((el = q('[data-todo-act]'))) return todoAction(el.dataset.todoAct, el);
    if (q('[data-toggle-done]')) { S.showDone = !S.showDone; renderTodo(); return; }
    if (q('[data-confirm]')) return confirmNow();
    if ((el = q('[data-edit-price]'))) return editPrice(el, el.dataset.editPrice);
    if ((el = q('[data-naver]'))) return naverPop(el, el.dataset.naver);
    if ((el = q('[data-offer-status]'))) {
      const o = S.offers.find((x) => x.id === el.dataset.offerStatus);
      if (o.contract) { UI.menu(el, [{ note: '거래가 진행 중입니다', sub: '이 조건의 상태는 거래관리의 단계에 따라 바뀝니다' }, { label: '거래 보기', icon: 'arrowUpRight', run: () => todoAction('pay') }]); return; }
      const set = (paused) => { if (o.paused === paused) return; o.paused = paused; const v = bump(`paused:${o.id}`); renderAll(); UI.toast(paused ? `${o.label}만 중단했습니다` : `${o.label}를 다시 진행합니다`, () => { if (!fresh(`paused:${o.id}`, v)) return; o.paused = !paused; renderAll(); }); };
      UI.menu(el, [{ head: `${o.label} 상태` }, { label: '활성', html: '<span class="nt green" style="height:18px"><span class="d"></span>활성</span>', on: !o.paused, run: () => set(false) }, { label: '이 조건만 중단', html: '<span class="nt yellow" style="height:18px"><span class="d"></span>중단</span>', on: o.paused, run: () => set(true) }]);
      return;
    }
    if ((el = q('[data-stage]'))) {
      const m = S.matches.find((x) => x.id === el.dataset.stage);
      UI.menu(el, [{ head: `${m.name} · 단계` }, ...STAGES.map(([k, l, c]) => ({ label: l, html: `<span class="nt ${c}" style="height:18px;padding:0 4px"><span class="d"></span></span>`, on: m.stage === k, run: () => { if (m.stage === k) return; const prev = m.stage; const prevAt = m.at; m.stage = k; m.at = new Date(TODAY); const v = bump(`stage:${m.id}`); renderAll(); UI.toast(`${m.name} 매칭 단계: ${stageOf(prev)[1]} → ${l}`, () => { if (!fresh(`stage:${m.id}`, v)) return; m.stage = prev; m.at = prevAt; renderAll(); }); } }))]);
      return;
    }
    if ((el = q('[data-filter]'))) { S.filter = el.dataset.filter; renderRecords(); return; }
    if ((el = q('[data-expand]'))) { const id = el.dataset.expand; S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); renderRecords(); return; }
    if ((el = q('[data-pin-rec]'))) { const r = S.records.find((x) => x.id === el.dataset.pinRec); r.pinned = !r.pinned; const v = bump(`pin:${r.id}`); renderRecords(); UI.toast(r.pinned ? '기록을 맨 위에 고정했습니다' : '고정을 풀었습니다', () => { if (!fresh(`pin:${r.id}`, v)) return; r.pinned = !r.pinned; renderRecords(); }); return; }
    if ((el = q('[data-grp]'))) { const add = t.closest('.add'); if (add) { UI.toast(`${add.dataset.soon} 창을 엽니다 (데모)`); return; } const k = el.dataset.grp; S.groups[k] = !S.groups[k]; renderSide(); return; }
    if ((el = q('[data-toggle]'))) { const k = el.dataset.toggle; S.toggles[k] = !S.toggles[k]; renderSide(); return; }
    if ((el = q('[data-memo]')) && !t.closest('textarea')) return memoEdit(el, el.dataset.memo);
    if ((el = q('[data-copy]'))) { UI.toast(`${tel(el.dataset.copy)} 번호를 복사했습니다`); return; }
    if ((el = q('[data-call]'))) { const p = [...S.people, ...S.tenants].find((x) => x.id === el.dataset.call); UI.toast(`${p.name}님에게 전화를 겁니다 · 끝나면 상담 입력칸이 열립니다`); S.composer = { ...S.composer, open: true, who: p.id, type: 'call' }; setTimeout(() => { renderComposer(true); $('#composer').scrollIntoView({ block: 'center' }); }, 0); return; }
    if ((el = q('[data-side-toggle]'))) return toggleSide();
    if ((el = q('[data-page-menu]'))) return pageMenu(el);
    if ((el = q('[data-new-offer]'))) { UI.toast('거래 조건 추가 창을 엽니다 (데모)'); return; }
    if ((el = q('[data-open-offer]'))) { UI.toast('거래 조건을 옆에서 엽니다 (데모)'); return; }
    if ((el = q('[data-pin]'))) {
      const k = el.dataset.pin;
      if (k === 'confirm') return confirmOther(el);
      if (k === 'price') { const b = document.querySelector('[data-edit-price="sale"]'); b.scrollIntoView({ block: 'center' }); return; }
      if (k === 'status') { document.querySelector('[data-offer-status="sale"]').scrollIntoView({ block: 'center' }); return; }
      if (k === 'owner') { UI.menu(el, ['이현수', '박서연', '최민준', '정다은'].map((n) => ({ label: n, html: UI.av(n, 'md'), on: S.intake.owner === n, run: () => { const prev = S.intake.owner; S.intake.owner = n; const v = bump('owner'); renderPins(); UI.toast(`담당 변경: ${prev} → ${n}`, () => { if (!fresh('owner', v)) return; S.intake.owner = prev; renderPins(); }); } }))); return; }
    }
    if ((el = q('[data-soon]'))) { UI.toast(`${el.dataset.soon}는 데모에 들어 있지 않습니다`); }
  });

  document.addEventListener('keydown', (e) => {
    if (e.isComposing || e.keyCode === 229) return;
    const ta = e.target.closest && e.target.closest('#cmpText');
    if (ta) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveComposer(); }
      else if (e.key === 'Escape') { e.preventDefault(); S.composer.open = false; renderComposer(); }
      return;
    }
    if (e.target.matches && e.target.matches('[data-todo-check]') && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); e.target.click(); return; }
    const typing = e.target.matches && e.target.matches('input, textarea, [contenteditable]');
    if (typing || e.metaKey || e.ctrlKey || e.altKey || document.querySelector('.menu, .npop')) return;
    if (e.key.toLowerCase() === 'r') { e.preventDefault(); S.composer.open = true; renderComposer(true); $('#composer').scrollIntoView({ block: 'center' }); }
  });

  // 제목이 가려지면 고정 머리를 보여 준다
  renderAll();
  const io = new IntersectionObserver(([en]) => $('#mini').classList.toggle('show', !en.isIntersecting), { root: $('#main'), rootMargin: '-8px 0px 0px 0px' });
  const watchTitle = () => { const h = $('#docTitle'); if (h) io.observe(h); };
  watchTitle();
  // 머리를 다시 그리면 제목 요소가 바뀌므로 다시 지켜본다
  new MutationObserver(() => { io.disconnect(); watchTitle(); }).observe($('#head'), { childList: true });

  // 상단 경로: 매물관리 › 호실
  const crumbs = document.querySelector('.crumbs');
  if (crumbs) crumbs.innerHTML = `<a href="properties.html" style="color:inherit">매물관리</a>${I('chevRight')}<b>고덕그라시움 103동 3401호</b>`;

  UI.notes([
    '<b>Notion 데이터베이스 페이지 문법</b>: 아이콘·큰 제목 → 고정 속성 4개(매물상태·거래·가격·매물 확인·담당) → 본문, 오른쪽은 접히는 속성 패널(Notion Layouts의 details panel).',
    '<b>제목 아래 상담 입력칸</b>: 대화상자 없이 바로 기록합니다. 소유주와 통화하면 "매물 확인으로도 남기기"로 확인까지 한 번에 끝납니다. R 키로 엽니다. (HubSpot·Odoo·Copper)',
    '<b>지금 챙길 것</b>: 광고가 불일치·더 싼 경쟁 광고·입금 예정·재확인 기한을 체크리스트로 모았습니다. 오른쪽 버튼으로 그 자리에서 처리합니다. (Salesforce·HubSpot·Pipedrive)',
    '<b>고정 머리</b>: 스크롤하면 위에 제목·가격·확인 완료·상담 기록이 남습니다. (Salesforce·SAP)',
    '<b>네이버 비교</b>: 같은 호실 광고 수·우리 순위·최저가·더 싼 광고를 거래 조건 표에서 바로 봅니다. 눌러서 목록을 엽니다. (네이버 "중개사 N곳"·이실장)',
    '<b>가격 칸을 눌러 바로 수정</b>: 바꾼 이유가 기록에 남고, 광고가와 같아지면 할 일이 사라집니다. (Rex 가격 변경 사건)',
    '<b>기록</b>: 고정, 긴 상담 3줄 접기, 종류별 거르기, 날짜 묶음. (Alto·HubSpot·Linear)',
    '<b>이전 소유주·지난 세입자·지난 의뢰</b>는 속성 패널에 접어 둡니다. (Rex·VaultRE)',
  ], '조사 문서: docs/ui-reference-research/property-detail-benchmark.md');
})();
</script>
</body>
</html>
