  .dlg .seg { margin-top: 5px; display: inline-flex; }

  .dlg .pickf.has { color: var(--text); background: var(--accent-soft); }
</style>

<script>
const { icon, av, who } = UI;
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const TODAY = new Date(2026, 10, 11);
const dayOf = (n) => { const d = new Date(TODAY); d.setDate(d.getDate() + n); return d; };
const p2 = (n) => String(n).padStart(2, '0');
const md = (n) => { const d = dayOf(n); return `${d.getMonth() + 1}.${p2(d.getDate())}`; };
const dateLabel = (off) => { const d = dayOf(off); const s = `${d.getMonth() + 1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`; return off === 0 ? `오늘 · ${s}` : off === -1 ? `어제 · ${s}` : s; };
const ts = (x) => x.off * 1440 + +x.hm.slice(0, 2) * 60 + +x.hm.slice(3);
const digits = (s) => String(s || '').replace(/\D/g, '');
const mmss = (s) => `${Math.floor(s / 60)}:${p2(s % 60)}`;
const secOf = (t) => +t.split(':')[0] * 60 + +t.split(':')[1];

const STAFF = ['이현수', '박서연', '최민준', '정다은'];
const PEOPLE = [['김지현', '010-4821-3307'], ['박준호', '010-2290-1184'], ['정태훈', '010-6612-9043'], ['한서윤', '010-3377-5120'], ['오민석', '010-9120-4456'], ['윤재경', '010-5503-7782'], ['장하은', '010-3318-6642'], ['임채원', '010-7741-2059'], ['송현우', '010-4459-3310'], ['배유진', '010-7753-0921'], ['조성민', '010-9045-2276'], ['강도윤', '010-2864-7715'], ['최영숙', '010-3920-6671'], ['노상철', '010-7218-0394'], ['한미경', '010-2670-4418'], ['권태식', '010-9982-3105'], ['유민아', '010-6604-1873'], ['정명호', '02-441-9000']].map(([name, phone]) => ({ name, phone }));

const TYPE = { phone: ['전화', 'blue'], visit: ['방문', 'green'], online: ['온라인', 'purple'] };
const PURPOSE = { general: '일반 상담', listing_confirm: '매물 확인', buyer_consult: '매수 상담', deal_followup: '거래 후속' };
// 업무 신호·결과·후속 후보는 원본과 같은 규칙으로 내용에서 뽑는다
const SIG = { price: ['가격·조건', 'orange'], schedule: ['일정·방문', 'blue'], contract: ['계약·입금', 'purple'], requirement: ['요청·요건', 'yellow'], note: ['상담 메모', ''] };
const SIG_RX = [['contract', /계약|입금|잔금|중도금|가계약|서명|날인/], ['schedule', /일정|임장|방문|내방|예약|토요일|일요일|오전|오후|확정/], ['price', /가격|급매|인하|조정|수락|억|만원|조건/], ['requirement', /요청|필수|원함|희망|찾|추가|즉시입주|요건/]];
function signal(c) {
  if (c.purpose === 'listing_confirm') return { key: 'price', label: '매물 확인', cls: 'blue' };
  if (c.purpose === 'buyer_consult') return { key: 'requirement', label: '매수 상담', cls: 'yellow' };
  if (c.purpose === 'deal_followup') return { key: 'contract', label: '거래 후속', cls: 'purple' };
  const hit = SIG_RX.find(([, rx]) => rx.test(c.text));
  const key = hit ? hit[0] : 'note';
  return { key, label: SIG[key][0], cls: SIG[key][1] };
}
function outcome(c) {
  if (/확정|수락|입금 확인|완료|결정/.test(c.text)) return '확정 기록';
  if (/필요|요청|확인|문의|어떻게|여부/.test(c.text)) return '후속 필요';
  if (/거절|취소|보류|불가/.test(c.text)) return '보류';
  return '정보 기록';
}
const OUT_CLS = { '확정 기록': 'ok', '후속 필요': 'warn', 보류: 'hold', '정보 기록': '' };
function nextAction(c) {
  if (c.purpose === 'listing_confirm') return '매물 확인 상태 업데이트';
  if (c.purpose === 'buyer_consult') return '구매요건 업데이트';
  if (c.purpose === 'deal_followup') return '거래 단계·입금 상태 확인';
  const s = signal(c).key;
  if (outcome(c) === '후속 필요' && c.type === 'phone') return '후속 통화 업무 만들기';
  return { schedule: '캘린더 일정 확인', price: '매칭·거래 조건 업데이트', contract: '거래 단계·입금 상태 확인', requirement: '구매요건 업데이트' }[s] || '고객 타임라인 확인';
}
const linkLabels = (c) => [c.links.intake ? '의뢰 연결' : c.links.prop ? '매물 연결' : '', c.links.match ? '매칭 연결' : '', c.links.req ? '구매요건 연결' : ''].filter(Boolean);

// ── 녹음과 분석 ──
// 제안 종류는 원본 라벨 그대로
const SG = { task: ['할 일', 'blue'], calendar_event: ['일정', 'green'], buyer_requirement_create: ['고객 요청 추가', 'yellow'], buyer_requirement_update: ['고객 요청 변경', 'yellow'], match_create: ['매칭 추가', 'purple'], match_stage: ['매칭 진행', 'purple'], listing_confirm: ['매물 확인', 'orange'] };
let sgSeq = 0;
const R = (dir, dur, summary, needs, checks, next, keys, facts, msgs, sugg) => ({ dir, dur, summary, needs, checks, next, keys, facts: facts.map(([k, v, prev, t]) => ({ k, v, prev, t })), msgs: msgs.map(([t, sp, text]) => ({ t, sp, text })), sugg: sugg.map(([type, title, sub]) => ({ id: ++sgSeq, type, title, sub, state: 'open', rev: 0 })), swapped: false, busy: false });
const RECS = {
  r1: R('inbound', 402, '고덕그라시움 34평 고층 매매 두 곳을 소개했고, 103동 3401호에 관심을 보였습니다. 토요일 오후 2시에 배우자와 함께 임장하기로 했습니다.', '27년 2월 전 입주, 고층·남향, 예산 15억~17억 5,000만(대출 6억 예정)',

const CSTAT = { ended: ['통화 완료', 'ok'], missed: ['부재중', 'warn'], ringing: ['수신 중', 'accent'], answered: ['통화 중', 'accent'] };
let callSeq = 0;
const CL = (off, hm, dir, phone, status, dur, by, memo = '') => ({ id: ++callSeq, off, hm, dir, phone, status, dur, by, memo });
const CALLS = [
  CL(0, '11:32', 'inbound', '010-6604-1873', 'ringing', 0, ''), CL(0, '11:15', 'outbound', '010-2290-1184', 'ended', 214, '이현수', '자이 매도 잔금일 조율'), CL(0, '10:42', 'inbound', '010-5582-7719', 'ended', 196, '이현수'),
  CL(0, '10:05', 'inbound', '010-6604-1873', 'ended', 228, '이현수', '가계약금 입금'), CL(0, '09:48', 'inbound', '010-3377-5120', 'missed', 0, ''), CL(0, '09:12', 'outbound', '02-441-9000', 'ended', 95, '이현수', '등기 일정'),
  CL(-1, '17:40', 'inbound', '010-7741-2059', 'ended', 260, '정다은'), CL(-1, '17:20', 'inbound', '010-7730-4402', 'ended', 88, '최민준'), CL(-1, '15:12', 'outbound', '010-9120-4456', 'ended', 185, '정다은'),
  CL(-1, '13:05', 'inbound', '010-8112-0934', 'missed', 0, ''), CL(-1, '10:30', 'outbound', '010-6612-9043', 'missed', 0, '박서연', '회신 없음, 내일 다시'), CL(-2, '16:44', 'inbound', '010-2670-4418', 'ended', 142, '박서연'),
  CL(-2, '10:20', 'inbound', '010-3920-6671', 'ended', 310, '박서연', '전세가 조정'), CL(-3, '13:10', 'inbound', '010-4459-3310', 'ended', 174, '최민준'), CL(-4, '16:20', 'inbound', '010-4821-3307', 'ended', 402, '이현수'), CL(-4, '11:45', 'outbound', '010-3318-6642', 'ended', 156, '최민준'),
];
const callName = (c) => (personByPhone(c.phone) || {}).name || null;

const state = { tab: 'cons', view: 'date', quick: 'all', f: {}, dong: '', ho: '', q: '', order: -1, page: 1, shut: new Set(), peek: null, ptab: 'analysis', tq: '', tcur: -1, play: null, cq: '', cf: {}, csort: { key: 'ts', dir: -1 }, editSg: null };
const PAGE = 12;

// ── 대화 원장 필터 ──
const QUICK = [['all', '전체', () => true], ['follow', '후속 필요', (c) => outcome(c) === '후속 필요'], ['prop', '매물 연결', (c) => !!c.links.prop], ['intake', '의뢰 연결', (c) => !!c.links.intake], ['req', '구매요건', (c) => !!c.links.req], ['unlinked', '미연결', (c) => !linkLabels(c).length]];
const uniq = (a) => [...new Set(a)].sort((x, y) => x.localeCompare(y, 'ko'));
const FDEFS = [
  { id: 'contact', k: '고객', opts: () => uniq(CONS.map((c) => c.name)).map((v) => [v, (c) => c.name === v]), fallback: (v) => (c) => c.name === v },
  { id: 'site', k: '매물', opts: () => uniq(CONS.map((c) => c.links.site).filter(Boolean)).map((v) => [v, (c) => c.links.site === v]), fallback: (v) => (c) => c.links.site === v },
  { id: 'type', k: '상담유형', opts: () => Object.entries(TYPE).map(([k, [l]]) => [l, (c) => c.type === k]) },
  { id: 'range', k: '기간', opts: () => [['오늘', (c) => c.off === 0], ['최근 7일', (c) => c.off >= -6], ['최근 30일', (c) => c.off >= -29], ['11월', (c) => c.off >= -10], ['10월', (c) => c.off < -10 && c.off >= -41]] },
  { id: 'by', k: '기록자', opts: () => STAFF.map((s) => [s, (c) => c.by === s]) },
];
const CFDEFS = [
  { id: 'dir', k: '방향', opts: () => [['수신', (c) => c.dir === 'inbound'], ['발신', (c) => c.dir === 'outbound']] },
  { id: 'status', k: '상태', opts: () => [['통화 완료', (c) => c.status === 'ended'], ['부재중', (c) => c.status === 'missed'], ['수신 중', (c) => c.status === 'ringing']] },
];
const testOf = (defs, bag, id) => { const d = defs.find((x) => x.id === id); const v = bag[id]; if (!v) return null; const o = d.opts().find((x) => x[0] === v); return o ? o[1] : d.fallback ? d.fallback(v) : () => false; };
function consFiltered(skipQuick) {
  const q = state.q.trim();
  let rows = CONS.filter((c) => FDEFS.every((d) => { const t = testOf(FDEFS, state.f, d.id); return !t || t(c); }));
  if (state.f.site && state.dong) rows = rows.filter((c) => String(c.links.dong || '').startsWith(state.dong));
  if (state.f.site && state.ho) rows = rows.filter((c) => String(c.links.ho || '').startsWith(state.ho));
  if (q) rows = rows.filter((c) => c.text.includes(q) || c.name.includes(q));
  if (!skipQuick) rows = rows.filter(QUICK.find((x) => x[0] === state.quick)[2]);
  return rows.sort((a, b) => (ts(a) - ts(b)) * state.order);
}
function callsFiltered() {
  const q = digits(state.cq);
  let rows = CALLS.filter((c) => CFDEFS.every((d) => { const t = testOf(CFDEFS, state.cf, d.id); return !t || t(c); }));
  if (state.cq.trim()) rows = rows.filter((c) => (q && digits(c.phone).includes(q)) || (callName(c) || '').includes(state.cq.trim()));
  const { key, dir } = state.csort;
  return rows.sort((a, b) => (key === 'ts' ? ts(a) - ts(b) : key === 'dur' ? a.dur - b.dur : (callName(a) || a.phone).localeCompare(callName(b) || b.phone, 'ko')) * dir || b.id - a.id);
}
const fselHtml = (d, bag, attr) => { const v = bag[d.id]; return `<button class="fsel ${v ? 'on' : ''}" ${attr}="${d.id}"><span class="k">${d.k}</span><span class="v">${esc(v || '전체')}</span>${v ? `<span class="clr" data-fclr="${attr}:${d.id}" title="지우기">${icon('x')}</span>` : icon('chevDown')}</button>`; };
const th = (ic, label, sort, cls = '') => { const s = sort && state.tab === 'calls' && state.csort.key === sort ? state.csort : sort === 'ts' && state.tab === 'cons' ? { dir: state.order } : null; return `<th class="${cls} ${s ? 'sorted' : ''}" ${sort ? `data-sort="${sort}"` : ''}>${icon(ic, 'hi')}${label}${s ? `<svg class="i caret" style="${s.dir > 0 ? 'transform:rotate(180deg)' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>` : ''}<span class="rz"></span></th>`; };
const pstat = (p) => { const [l, cls, busy] = PSTAT[p.status]; return `<span class="st ${cls} ${busy ? 'busy' : ''}">${l}</span>`; };
const isPeek = (kind, id) => state.peek && state.peek.kind === kind && state.peek.id === id;

// 입력 중인 칸이 들어 있는 줄은 다시 그리지 않는다. 다시 그리면 한글 조합이 끊긴다
const setHtml = (id, html) => { const el = document.getElementById(id); const a = document.activeElement; if (a && a.tagName === 'INPUT' && el.contains(a)) return; el.innerHTML = html; };
function renderCons() {
  const all = consFiltered(false);
  const pages = Math.max(1, Math.ceil(all.length / PAGE));
  state.page = Math.min(state.page, pages);
  const rows = all.slice((state.page - 1) * PAGE, state.page * PAGE);
  const byDate = state.view === 'date';
  const groups = [];
  rows.forEach((c) => { const key = byDate ? `d${c.off}` : `n${c.name}`; let g = groups.find((x) => x.key === key); if (!g) groups.push((g = { key, label: byDate ? dateLabel(c.off) : c.name, items: [] })); g.items.push(c); });
  const head = `<thead><tr>${th('clock', '시간', 'ts')}${th('user', '고객')}${th('tag', '유형')}${th('tag', '목적')}${th('sparkle', '업무 신호')}${th('info', '결과')}${th('note', '상담 내용')}${th('building', '연결')}${th('user', '기록자')}</tr></thead>`;
  const body = groups.map((g) => {
    const shut = state.shut.has(g.key);
    return `<tr class="grp ${shut ? 'shut' : ''}" data-g="${esc(g.key)}"><td colspan="9"><span class="gh">${icon('chevDown')}${esc(g.label)}<span class="n num">${g.items.length}</span></span></td></tr>` + (shut ? '' : g.items.map((c) => {
      const s = signal(c), o = outcome(c);
      return `<tr data-c="${c.id}" class="${isPeek('cons', c.id) ? 'focus' : ''}">
        <td class="num t2">${byDate ? c.hm : `${md(c.off)} ${c.hm}`}</td><td><span class="nm">${esc(c.name)}</span></td>
        <td><span class="tag ${TYPE[c.type][1]}">${TYPE[c.type][0]}</span></td><td class="${c.purpose === 'general' ? 't3' : ''}">${PURPOSE[c.purpose]}</td>
        <td><span class="tag ${s.cls}">${s.label}</span></td><td><span class="st ${OUT_CLS[o]}">${o}</span></td>
        <td class="c-text" title="${esc(c.text)}">${c.rec ? `<span class="ai">${icon('sparkle')}통화 요약</span>` : ''}${esc(c.text)}</td>
        <td class="c-link">${linkLabels(c).join(' · ') || '<span class="t3">미연결</span>'}</td><td>${who(c.by)}</td></tr>`;
    }).join(''));
  }).join('');
  const dirty = Object.keys(state.f).length || state.q.trim() || state.quick !== 'all' || state.order !== -1;
  document.getElementById('tbl').innerHTML = head + `<tbody>${body || `<tr><td colspan="9" style="border:0;cursor:default"><div class="empty"><b>${dirty ? '조건에 맞는 상담 기록이 없습니다' : '상담 기록이 없습니다'}</b>${dirty ? '검색어나 필터를 바꿔 보세요' : '고객과 나눈 첫 상담을 기록해 보세요. 매물·구매조건과 연결하면 후속 업무로 이어집니다.'}</div></td></tr>`}</tbody>`;
  document.getElementById('foot').innerHTML = `<span>전체<b>${all.length}</b>건${all.length ? ` · ${(state.page - 1) * PAGE + 1}~${Math.min(all.length, state.page * PAGE)}번째 표시` : ''}</span><span>후속 필요<b>${all.filter((c) => outcome(c) === '후속 필요').length}</b></span><span>녹음 분석<b>${all.filter((c) => c.rec).length}</b></span><span class="grow"></span><span class="pager"><button class="btn quiet sm" data-page="-1" ${state.page <= 1 ? 'disabled' : ''}>${icon('chevLeft')}이전</button><span class="num">${state.page} / ${pages}</span><button class="btn quiet sm" data-page="1" ${state.page >= pages ? 'disabled' : ''}>다음${icon('chevRight')}</button></span>`;
  const base = consFiltered(true);

    + fselHtml(FDEFS[0], state.f, 'data-fs') + fselHtml(FDEFS[1], state.f, 'data-fs')
    + `<input class="fin ${state.dong ? 'on' : ''}" id="fDong" placeholder="동" inputmode="numeric" aria-label="동" value="${esc(state.dong)}" ${state.f.site ? '' : 'disabled title="매물(단지)을 먼저 고르세요"'}><input class="fin ${state.ho ? 'on' : ''}" id="fHo" placeholder="호" inputmode="numeric" aria-label="호" value="${esc(state.ho)}" ${state.f.site ? '' : 'disabled title="매물(단지)을 먼저 고르세요"'}>`
    + FDEFS.slice(2).map((d) => fselHtml(d, state.f, 'data-fs')).join('') + (dirty ? `<button class="btn quiet sm right" data-clear>${icon('refresh')}초기화</button>` : ''));
  setHtml('vtools', `<label class="field" data-icon="search">${icon('search')}<input id="q" placeholder="상담 내용 검색" aria-label="상담 내용 검색" value="${esc(state.q)}"><kbd>⌘F</kbd></label><button class="btn quiet sm" id="orderBtn">${icon('sort')}${state.order < 0 ? '최신순' : '오래된순'}</button><span class="vsep"></span><div class="seg"><button class="${byDate ? 'on' : ''}" data-view="date">${icon('cal')}날짜별</button><button class="${byDate ? '' : 'on'}" data-view="contact">${icon('users')}고객별</button></div>`);
  const wait = PEND.length;
  document.getElementById('bandWrap').innerHTML = wait ? `<div class="band" data-jump="pend" role="button" tabindex="0">${icon('info')}<span><b>연결 대기 녹음 ${wait}건</b></span><span class="it">${PEND.slice(0, 3).map((p) => `${esc(p.name || (p.phone || '방문 상담 녹음'))} ${PSTAT[p.status][0]}`).join(' · ')}</span><span class="sp"></span><span class="t2">아직 상담 기록이 되지 않은 녹음입니다</span><button class="btn quiet sm">모두 보기${icon('chevRight')}</button></div>` : '';

function renderPend() {

  document.getElementById('foot').innerHTML = `<span>연결 대기<b>${rows.length}</b>건</span><span>연락처 연결 필요<b>${rows.filter((p) => p.status === 'need').length}</b></span><span class="grow"></span><span>아직 상담 기록이 되지 않은 녹음입니다. 연락처를 연결하거나 분석이 끝나면 대화 원장으로 들어갑니다.</span>`;
  setHtml('fbar', '');
  setHtml('vtools', '');
  document.getElementById('bandWrap').innerHTML = '';
}
function renderCalls() {
  const rows = callsFiltered();
  document.getElementById('tbl').innerHTML = `<thead><tr>${th('clock', '시간', 'ts')}${th('phone', '방향')}${th('user', '상대방', 'name')}${th('info', '상태')}${th('clock', '통화시간', 'dur', 'r')}${th('user', '담당')}${th('note', '메모')}</tr></thead><tbody>${rows.map((c) => { const n = callName(c); return `<tr data-call="${c.id}" class="${isPeek('call', c.id) ? 'focus' : ''}">
    <td class="num t2">${md(c.off)} ${c.hm}</td><td><span class="tag ${c.dir === 'outbound' ? 'purple' : 'blue'}">${DIR[c.dir]}</span></td>

    <td><span class="st ${CSTAT[c.status][1]} ${c.status === 'ringing' ? 'busy' : ''}">${CSTAT[c.status][0]}</span></td><td class="r num t2">${c.dur ? mmss(c.dur) : '-'}</td><td>${c.by ? who(c.by) : '<span class="t3">-</span>'}</td><td class="c-text t2">${esc(c.memo)}</td></tr>`; }).join('') || '<tr><td colspan="7" style="border:0;cursor:default"><div class="empty"><b>통화 기록이 없습니다</b>검색어나 필터를 바꿔 보세요</div></td></tr>'}</tbody>`;

function render() {
  document.getElementById('total').textContent = CONS.length;
  document.getElementById('followN').textContent = CONS.filter((c) => outcome(c) === '후속 필요').length;
  document.getElementById('pendN').textContent = PEND.length;
  document.querySelectorAll('.vtab[data-tab]').forEach((t) => {
    const k = t.dataset.tab;
    t.classList.toggle('on', k === state.tab);
    const n = t.querySelector('.n');
    n.textContent = k === 'cons' ? CONS.length : k === 'pend' ? PEND.length : CALLS.length;
    n.classList.toggle('alert', k === 'pend' && PEND.some((p) => p.status === 'need' || p.status === 'sttfail'));
  });
  ({ cons: renderCons, pend: renderPend, calls: renderCalls })[state.tab]();
  renderPeek();
}

// ── 옆 상세 ──
function sgHtml(rec, linked) {
  const open = rec.sugg.filter((s) => s.state === 'open');
  const done = rec.sugg.filter((s) => s.state !== 'open');
  const one = (s) => {
    const [l, cls] = SG[s.type];
    if (s.state !== 'open') return `<div class="sg done" data-sg="${s.id}"><span class="tag ${cls}">${l}</span><div class="bd"><b>${esc(s.title)}</b></div><div class="ac"><span class="st ${s.state === 'accepted' ? 'ok' : ''}">${s.state === 'accepted' ? '반영함' : '무시함'}</span><button class="btn quiet sm" data-sga="undo">되돌리기</button></div></div>`;
    if (state.editSg === s.id) return `<div class="sg" data-sg="${s.id}"><span class="tag ${cls}">${l}</span><div class="bd"><input data-sgin="title" value="${esc(s.title)}" aria-label="제목"><input data-sgin="sub" value="${esc(s.sub)}" aria-label="세부 내용"></div><div class="ac"><button class="btn quiet sm" data-sga="cancel">취소</button><button class="btn sm primary" data-sga="save">이대로 반영</button></div></div>`;
    return `<div class="sg" data-sg="${s.id}"><span class="tag ${cls}">${l}</span><div class="bd"><b>${esc(s.title)}</b><span>${esc(s.sub)}</span></div><div class="ac">${linked ? `<button class="btn sm" data-sga="accept">${icon('check')}반영</button><button class="btn quiet sm" data-sga="edit">고쳐서 반영</button><button class="btn quiet sm" data-sga="ignore">무시</button>` : ''}</div></div>`;
  };
  return `<div class="sec"><div class="sec-h">${icon('sparkle')}AI 제안${open.length ? ` <span class="n">${open.length}건</span>` : ''}</div>
    <div class="hint">받아쓰기는 숫자·이름을 틀릴 수 있어요. 내용을 확인하고 반영하세요.${linked ? '' : ' <b class="warn-t" style="font-weight:500">통화 상대 연락처를 연결하면 반영할 수 있어요.</b>'}</div>
    ${open.length ? open.map(one).join('') : '<div class="none-t">처리할 제안이 없습니다.</div>'}

function pipeline(p, from = 'stt') {
  const step = (status, ms, next) => setTimeout(() => { if (!PEND.includes(p) || p.status !== status) return; next(); }, ms);
  const finish = () => {
    p.rec = p.rec || sampleRec(p.dir);
    const person = p.name ? { name: p.name } : personByPhone(p.phone);
    if (person) return toConsult(p, person.name, true);
    p.status = 'need'; render();
    UI.toast('분석이 끝났습니다. 연락처를 연결하면 상담 기록이 됩니다.');
  };
  if (from === 'stt') { p.status = 'stt'; render(); step('stt', 2600, () => { p.status = 'analysis'; render(); step('analysis', 2600, finish); }); }
  else step('analysis', 3200, finish);
}
function toConsult(p, name, auto) {

  const watching = isPeek('pend', p.id);
  if (watching || !auto) { state.tab = 'cons'; state.page = 1; state.peek = { kind: 'cons', id: c.id }; state.ptab = 'analysis'; }
  render();
  UI.toast(`${esc(name)} 님 ${p.dir === 'visit' ? '방문 상담' : '통화'} 분석이 끝나 상담 기록과 제안 ${rec.sugg.length}건이 생겼습니다.`);
