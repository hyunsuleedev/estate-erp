function render() {
  const cols = COLS.filter((c) => !(state.collapsed && GCOLS.includes(c.id)));
  if (state.sort && !cols.some((c) => c.id === state.sort.key)) state.sort = null;
  const base = filtered();
  let rows = base.filter(VIEWS[state.view]);
  state.searchCount = base.length;
  const visible = new Set(rows.map((r) => r.id));
  for (const id of [...state.picked]) if (!visible.has(id)) state.picked.delete(id);
  if (state.sort) {
    const { key, dir } = state.sort;
    const f = SORTV[key];
    rows = [...rows].sort((x, y) => { const a = f(x), b = f(y); return (typeof a === 'number' ? a - b : String(a).localeCompare(String(b), 'ko', { numeric: true })) * dir || x.id - y.id; });
  }
  state.rows = rows;

  document.getElementById('total').textContent = ADS.length;
  document.getElementById('nAtt').textContent = ADS.filter(needsReview).length;
  document.getElementById('nPend').textContent = ADS.filter(VIEWS.comparison_pending).length;
  document.querySelectorAll('.vtab[data-view]').forEach((t) => {
    t.classList.toggle('on', t.dataset.view === state.view);
    t.querySelector('.n').textContent = base.filter(VIEWS[t.dataset.view]).length;
  });
  const sbn = document.getElementById('sortBtn');
  sbn.classList.toggle('active', !!state.sort);
  sbn.innerHTML = `${icon('sort')}정렬${state.sort ? '<span class="cnt">1</span>' : ''}`;

  const fsel = (id, k, v) => `<button class="fsel ${v ? 'on' : ''}" data-fs="${id}"><span class="k">${k}</span><span class="v">${v || '전체'}</span>${v ? `<span class="clr" data-fclr="${id}" title="지우기">${icon('x')}</span>` : icon('chevDown')}</button>`;
  document.getElementById('fSite').innerHTML = fsel('site', '단지', state.sites.length > 1 ? `${state.sites[0]} 외 ${state.sites.length - 1}` : state.sites[0]);
  document.getElementById('fSel').innerHTML = FDEFS.map((d) => fsel(d.id, d.k, state.f[d.id])).join('');
  document.getElementById('fDong').classList.toggle('on', !!state.dong);
  document.getElementById('fHo').classList.toggle('on', !!state.ho);
  document.querySelector('#fbar [data-clear]').hidden = activeFilters() === 0;

  const nSel = rows.filter((r) => state.picked.has(r.id)).length;
  document.getElementById('head').innerHTML = `<tr><th class="selh"><span class="ck ${rows.length && nSel === rows.length ? 'on' : nSel ? 'some' : ''}" id="ckAll" role="checkbox" aria-label="모두 선택">${icon('check')}</span></th>${cols.map((c) => {
    const s = state.sort && state.sort.key === c.id ? state.sort : null;
    return `<th class="${c.r ? 'r' : ''} ${s ? 'sorted' : ''} ${GCOLS.includes(c.id) ? 'gcol' : ''}" data-sort="${c.id}">${icon(c.h, 'hi')}${c.l}${s ? `<svg class="i caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="${s.dir > 0 ? 'transform:rotate(180deg)' : ''}"><path d="m6 9 6 6 6-6"/></svg>` : ''}${c.anchor ? `<button class="gtog" data-gtog aria-label="광고 정보 ${state.collapsed ? '펼치기' : '접기'}" title="CP사·링크·검증방식·노출기간 ${state.collapsed ? '펼치기' : '접기'}">${icon(state.collapsed ? 'chevRight' : 'chevLeft')}</button>` : ''}<span class="rz"></span></th>`;
  }).join('')}</tr>`;
  document.getElementById('rows').innerHTML = rows.length ? rows.map((ad) => {
    const a = analyze(ad);
    const sg = signal(ad);
    const on = state.picked.has(ad.id);
    return `<tr data-id="${ad.id}" class="${on ? 'picked' : ''} ${draft(ad).dirty ? 'dirty' : ''} ${state.open.has(ad.id) ? 'row-open' : ''}"><td class="sel"><span class="ck ${on ? 'on' : ''}" role="checkbox" aria-label="${ad.site} ${ad.dong}동 ${ad.ho}호 선택">${icon('check')}</span></td>${cols.map((c) => cell(c, ad, a, sg)).join('')}</tr>${state.open.has(ad.id) ? panel(ad, a, sg, cols.length + 1) : ''}`;
  }).join('') : `<tr><td colspan="${cols.length + 1}" style="border:0"><div class="empty">${state.q.trim() || state.view !== 'all' || activeFilters() ? '<b>조건에 맞는 광고가 없습니다.</b>검색어나 필터를 바꿔 보세요' : '<b>저장된 내 광고가 없습니다.</b>로컬 CP 읽기 작업 후 목록을 새로고침해 주세요.'}</div></td></tr>`;
  bars();
}

// ── 광고업무 등록 ──
function registerTasks(items, note) {
  // items: [{ ad, price, rent, republish }]
  const before = items.map(({ ad }) => [ad, ad.req, state.edits[ad.id]]);
  items.forEach(({ ad, price, rent, republish }) => { ad.req = { price, rent, republish }; delete state.edits[ad.id]; ad.rev = (ad.rev || 0) + 1; });
  const stamp = items.map(({ ad }) => ad.rev);
  state.tasks += 1;
  state.picked.clear();
  render();
  UI.toast(`광고 작업을 업무에 등록했습니다 (광고 ${items.length}건${note ? ' · 요청사항 포함' : ''})`, () => {
    if (items.some(({ ad }, i) => ad.rev !== stamp[i])) { UI.toast('그 뒤에 다시 바뀌어서 되돌리지 않았습니다'); return; }
    before.forEach(([ad, req, edit]) => { ad.req = req; if (edit) state.edits[ad.id] = edit; ad.rev += 1; });
    state.tasks -= 1;
    render();
  });
}
function submitInline() {
  const list = dirtyPicked();
  if (!list.length) { UI.toast('변경된 광고가 없습니다.'); return; }
  if (list.some((ad) => !draft(ad).ok)) { UI.toast('가격과 월세는 0보다 큰 숫자(만원)로 입력해 주세요.'); return; }
  registerTasks(list.map((ad) => ({ ad, price: draft(ad).price, rent: draft(ad).rent, republish: true })), '');
}
function actionDialog(list) {
  if (!list.length) { UI.toast('광고를 선택해 주세요.'); return; }
  const back = document.createElement('div');
  back.className = 'dlg-back';
  back.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><h3>광고업무 만들기</h3>
    <p class="dd">네이버 비교 근거를 보면서 요청할 최종 조건을 편집합니다. 등록된 업무는 사용자가 실행한 외부 AI의 로컬 Skill이 처리합니다.</p>
    <div class="db"><div class="drow hd"><span>광고</span><span>요청할 최종 조건 · 만원</span><span style="text-align:right">저장 후 재광고</span></div>
    ${list.map((ad) => {
      const a = analyze(ad);
      const d = draft(ad);
      const own = (ad.rows || []).find((x) => x.mine);
      const p = d.dirty && d.ok ? d.price : ad.price;
      const r = d.dirty && d.ok ? d.rent : ad.rent;
      return `<div class="drow" data-ad="${ad.id}"><div style="min-width:0"><div class="l1"><span>${ad.site}</span><span class="tag ${ad.kind}">${KIND[ad.kind]}</span><span class="t2 num" style="font-weight:400">${ad.dong}동 · ${ad.floor}층 · ${ad.ho}호</span></div>
        <div class="l2 num">네이버 관측 ${own ? priceLabel(ad.kind, own.price, own.rent) : '없음'} · ${CP[ad.channel]} ${ad.cpId}</div></div>
        <div class="flds">${ad.kind === 'monthly'
          ? `<label class="f">보증금<input class="inp num" data-k="price" inputmode="numeric" value="${p}"></label><label class="f">월세<input class="inp num" style="width:70px" data-k="rent" inputmode="numeric" value="${r}"></label>`
          : `<label class="f">${ad.kind === 'jeonse' ? '전세가' : '매매가'}<input class="inp num" data-k="price" inputmode="numeric" value="${p}"></label>${a.lowest != null ? `<button class="apply" data-apply="${a.lowest}">비교 최저가 ${man(a.lowest)} 적용</button>` : ''}`}</div>
        <div class="rp"><input type="checkbox" class="sw" data-k="republish" checked aria-label="${ad.site} 저장 후 재광고" title="조건 저장 후 ${CP[ad.channel]} 바로 재광고 요청"></div></div>`;
    }).join('')}
    <label class="dlabel" for="rationale">요청사항</label><textarea class="inp" id="rationale" placeholder="예: 동일 호실 최저가와 맞추고 오늘자로 재광고"></textarea>
    <p class="dnote">선택한 광고는 하나의 일반 업무로 등록됩니다. 세부 실행 단계와 재시도는 로컬 Skill에만 남고, CP 저장값을 다시 읽어 일치할 때만 업무를 완료합니다.</p></div>
    <div class="df"><span class="sp"></span><button class="btn" data-x>취소</button><button class="btn primary" data-ok>${list.length}건 광고업무 등록</button></div></div>`;
  document.body.append(back);
  const close = () => back.remove();
  back.addEventListener('mousedown', (e) => { if (e.target === back) close(); });
  back.addEventListener('keydown', (e) => { if (e.isComposing || e.keyCode === 229) return; if (e.key === 'Escape') { e.stopPropagation(); close(); } });
  back.addEventListener('click', (e) => {
    const ap = e.target.closest('[data-apply]');
    if (ap) { const inp = ap.closest('.drow').querySelector('[data-k="price"]'); inp.value = ap.dataset.apply; inp.classList.remove('bad'); inp.focus(); return; }
    if (e.target.closest('[data-x]')) { close(); return; }
    if (!e.target.closest('[data-ok]')) return;
    let bad = null;
    const items = list.map((ad) => {
      const row = back.querySelector(`.drow[data-ad="${ad.id}"]`);
      const pi = row.querySelector('[data-k="price"]');
      const ri = row.querySelector('[data-k="rent"]');
      [pi, ri].forEach((el) => { if (!el) return; const okv = valid(el.value.trim()); el.classList.toggle('bad', !okv); if (!okv && !bad) bad = el; });
      return { ad, price: +pi.value.trim(), rent: ri ? +ri.value.trim() : 0, republish: row.querySelector('[data-k="republish"]').checked };
    });
    if (bad) { bad.focus(); UI.toast('가격과 월세는 0보다 큰 숫자(만원)로 입력해 주세요.'); return; }
    const note = back.querySelector('#rationale').value.trim();
    close();
    registerTasks(items, note);
  });
  back.querySelector('.inp').focus();
}
function openFsel(id) {
  const anchor = document.querySelector(`[data-fs="${id}"]`);

    const names = [...new Set([...ADS.map((r) => r.site), ...state.sites])].sort((a, b) => a.localeCompare(b, 'ko'));
    UI.menu(anchor, [
      { label: '단지 전체', on: !state.sites.length, run: () => { state.sites = []; render(); } }, '-',
      ...names.map((s) => ({ label: s, icon: 'building', hint: String(ADS.filter((r) => r.site === s).length), on: state.sites.includes(s), run: () => { state.sites = state.sites.includes(s) ? state.sites.filter((x) => x !== s) : [...state.sites, s]; render(); openFsel('site'); } })),
    ]);
    return;
  }
  const d = FDEFS.find((x) => x.id === id);
  const cur = state.f[id];
  UI.menu(anchor, [
    ...(d.head ? [{ head: d.head }] : []),
    { label: `${d.k} 전체`, on: !cur, run: () => { delete state.f[id]; render(); } }, '-',
    ...d.opts.map(([label, test]) => ({ label, hint: String(ADS.filter(test).length), on: cur === label, run: () => { state.f[id] = label; render(); } })),
  ]);
}

      { label: '내림차순 정렬', icon: 'sort', on: cur === -1, run: () => { state.sort = { key, dir: -1 }; render(); } },
      ...(cur ? [{ label: '정렬 해제', icon: 'x', run: () => { state.sort = null; render(); } }] : []),
      '-', { label: '열 숨기기', icon: 'x', run: () => UI.toast('열 숨기기는 데모에 들어 있지 않습니다') },
    ]);
    return;
  }
  const row = t.closest('tr[data-id], tr[data-exp]');
  if (!row) return;
  const ad = adOf(t);
  if (t.closest('[data-rank]')) { state.open.has(ad.id) ? state.open.delete(ad.id) : state.open.add(ad.id); render(); return; }
  if (t.closest('[data-pedit]')) { actionDialog([ad]); return; }
  const ext = t.closest('[data-ext]');
  if (ext) { UI.toast(`${ext.dataset.ext}을 새 창으로 엽니다`); return; }
  if (t.closest('[data-naver]')) { UI.toast(`네이버 광고 ${ad.naverNo}을 새 창으로 엽니다`); return; }
  if (t.closest('[data-rst]')) { delete state.edits[ad.id]; render(); UI.toast('이 행의 변경 초안을 취소했습니다'); return; }
  if (t.closest('.ck')) { state.picked.has(ad.id) ? state.picked.delete(ad.id) : state.picked.add(ad.id); render(); }
});
// 선택한 행의 광고가: 입력하는 대로 초안에 담는다
document.addEventListener('input', (e) => {
  const el = e.target.closest && e.target.closest('[data-edit]');
  if (!el) return;
  const ad = adOf(el);
  const k = el.dataset.edit;
  const v = el.value.trim();
  (state.edits[ad.id] = state.edits[ad.id] || {})[k] = v;
  el.classList.toggle('dirty', v !== String(ad[k]));
  el.classList.toggle('bad', !valid(v));
  el.closest('tr').classList.toggle('dirty', draft(ad).dirty);
  bars();
});
document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
document.getElementById('fDong').addEventListener('input', (e) => { state.dong = e.target.value.trim(); render(); });
document.getElementById('fHo').addEventListener('input', (e) => { state.ho = e.target.value.trim(); render(); });
document.addEventListener('keydown', (e) => {
  if (e.isComposing || e.keyCode === 229) return;
  if (document.querySelector('.dlg-back')) return;
  if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-edit]')) { e.preventDefault(); e.target.blur(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-jump]')) { e.preventDefault(); e.target.click(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); document.getElementById('q').focus(); }
  if (e.key === 'Escape' && state.picked.size && !(e.target.matches && e.target.matches('input'))) { state.picked.clear(); render(); }
});

render();

    '<b>경쟁 대비는 관측된 사실만</b> 글자색으로 보여 줍니다. 미노출은 빨강, 더 싼 광고 · 층 노출 불리 · 순위 불리는 주황, 문제가 없으면 회색입니다. 칸에 올리면 근거 문장이 나옵니다.',
    '<b>랭킹을 누르면</b> 행 아래로 네이버 비교 분석이 열립니다. 요약 네 칸, 노출 순서대로의 경쟁 광고 표, 오른쪽 판단 근거로 이루어져 있고 카드 격자를 쓰지 않았습니다.',

    '<b>상세 편집 창</b>에서는 광고마다 최종 조건, 비교 최저가 적용, 저장 후 재광고 여부, 요청사항을 한 번에 적어 업무 하나로 등록합니다.',

  ],
  '내 CP 광고와 네이버 노출을 한 줄에서 비교합니다. 가격을 내릴지는 사람이 정하고, 화면은 근거만 보여 줍니다.',
