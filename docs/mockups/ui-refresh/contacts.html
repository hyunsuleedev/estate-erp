// ── 그룹 ──
function groupError(name, except) {
  if (!name) return '그룹 이름을 입력하세요.';
  if (name.length > 30) return '그룹 이름은 30자까지 쓸 수 있습니다.';
  if (name.includes(',')) return '그룹 이름에는 쉼표를 쓸 수 없습니다.';
  if (name !== except && GROUPS.includes(name)) return '같은 이름의 그룹이 이미 있습니다.';
  return '';
}
function addToGroup(name, ids) {
  const changed = ids.map((id) => DATA.find((c) => c.id === id)).filter((c) => c && !c.tags.includes(name));
  changed.forEach((c) => c.tags.push(name));
  const v = gbump(name);
  state.picked.clear();
  render();
  UI.toast(`${changed.length}명을 '${esc(name)}' 그룹에 넣었습니다.`, changed.length ? () => {
    if (GREV[name] !== v || !GROUPS.includes(name)) { UI.toast('그 뒤에 그룹이 다시 바뀌어서 되돌리지 않았습니다'); return; }
    changed.forEach((c) => { c.tags = c.tags.filter((t) => t !== name); }); gbump(name); render();
  } : undefined);
}
function removeFromGroup(name, ids) {
  const changed = ids.map((id) => DATA.find((c) => c.id === id)).filter((c) => c && c.tags.includes(name));
  changed.forEach((c) => { c.tags = c.tags.filter((t) => t !== name); });
  const v = gbump(name);
  state.picked.clear();
  render();
  UI.toast(`${changed.length}명을 '${esc(name)}' 그룹에서 뺐습니다.`, () => {
    if (GREV[name] !== v || !GROUPS.includes(name)) { UI.toast('그 뒤에 그룹이 다시 바뀌어서 되돌리지 않았습니다'); return; }
    changed.forEach((c) => { if (!c.tags.includes(name)) c.tags.push(name); }); gbump(name); render();
  });
}
function commitGroup(input, cancel) {
  const mode = input.dataset.gin;
  if (cancel) { state.newGroup = null; state.renaming = null; state.gerr = ''; render(); return; }
  const name = input.value.trim();
  if (mode === 'new') {
    const err = groupError(name);
    if (err) { state.gerr = err; render(); document.querySelector('.gin').value = name; return; }
    const ids = state.newGroup.ids;
    GROUPS = [...GROUPS, name].sort((a, b) => a.localeCompare(b, 'ko'));
    state.newGroup = null; state.gerr = '';
    if (ids) { addToGroup(name, ids); return; }
    gbump(name); state.cat = `group:${name}`; render();
    UI.toast(`'${esc(name)}' 그룹을 만들었습니다. 연락처를 선택해 넣을 수 있습니다.`);
    return;
  }
  const old = input.dataset.old;
  if (name === old) { state.renaming = null; state.gerr = ''; render(); return; }
  const err = groupError(name, old);
  if (err) { state.gerr = err; render(); document.querySelector('.gin').value = name; return; }
  GROUPS = GROUPS.map((g) => (g === old ? name : g)).sort((a, b) => a.localeCompare(b, 'ko'));
  DATA.forEach((c) => { c.tags = c.tags.map((t) => (t === old ? name : t)); });
  if (state.cat === `group:${old}`) state.cat = `group:${name}`;
  state.renaming = null; state.gerr = ''; gbump(old); gbump(name);
  render();
  UI.toast(`그룹 이름을 '${esc(name)}'(으)로 바꿨습니다. 속한 연락처의 표시도 함께 바뀝니다.`);
}
function deleteGroup(name) {
  const members = DATA.filter((c) => c.tags.includes(name));
  GROUPS = GROUPS.filter((g) => g !== name);
  members.forEach((c) => { c.tags = c.tags.filter((t) => t !== name); });
  if (state.cat === `group:${name}`) state.cat = 'all';
  const v = gbump(name);
  render();
  UI.toast(`'${esc(name)}' 그룹을 삭제했습니다. 연락처는 지워지지 않고 그룹에서만 빠졌습니다.`, () => {
    if (GREV[name] !== v || GROUPS.includes(name)) { UI.toast('그 뒤에 그룹이 다시 바뀌어서 되돌리지 않았습니다'); return; }
    GROUPS = [...GROUPS, name].sort((a, b) => a.localeCompare(b, 'ko'));
    members.forEach((c) => { if (DATA.includes(c) && !c.tags.includes(name)) c.tags.push(name); });
    gbump(name); render();
  });
}
function groupMenu(anchor, ids, opts) {
  UI.menu(anchor, [{ head: '그룹에 넣기' }, ...GROUPS.map((g) => ({ label: g, icon: 'users', hint: String(DATA.filter((c) => c.tags.includes(g)).length), run: () => addToGroup(g, ids) })), '-', { label: '새 그룹 만들기', icon: 'plus', run: () => { state.catsOpen = true; state.newGroup = { ids }; state.gerr = ''; render(); } }], opts);
}
function copyPhones(ids) {
  const phones = ids.map((id) => DATA.find((c) => c.id === id)).filter((c) => c && c.phones.length).map((c) => c.phones[0].phone);
  if (!phones.length) { UI.toast('선택한 연락처에 전화번호가 없습니다.'); return; }
  UI.toast(`전화번호 ${phones.length}건을 복사했습니다.`);
}
function rowMenu(anchor, c) {
  UI.menu(anchor, [
    { label: '빠른 확인', icon: 'expand', run: () => { state.detail = null; state.peek = c.id; render(); } },
    { label: '상세 보기', icon: 'arrowUpRight', run: () => { state.detail = c.id; render(); } },
    { label: '전화번호 복사', icon: 'copy', run: () => copyPhones([c.id]) },
  ], { right: true });
}
function addConsult(c, text) {
  const entry = { off: 0, type: state.ctype || '전화', text, ai: false };
  const prevUpd = c.updated;
  c.log.unshift(entry); c.updated = 0;
  c._rev = (c._rev || 0) + 1;
  const v = c._rev;
  render();
  UI.toast('상담 기록이 저장되었습니다.', () => {
    if (c._rev !== v) { UI.toast('그 뒤에 다시 바뀌어서 되돌리지 않았습니다'); return; }
    c.log = c.log.filter((x) => x !== entry); c.updated = prevUpd; c._rev += 1; render();
  });
}

// ── 이벤트 ──
document.querySelectorAll('[data-icon]').forEach((el) => el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon)));
document.getElementById('newBtn').innerHTML = `${icon('plus')}연락처 추가`;

document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.closest('.gin, .memo-ed')) return;
  if (t.closest('[data-rel-edit]')) { UI.toast('관계 수정 창을 엽니다'); return; }
  const rd = t.closest('[data-rel-del]');
  if (rd) {
    const c = DATA.find((x) => x.id === state.detail);
    const i = c.rels.findIndex((r) => r.k === +rd.dataset.relDel);
    const [rel] = c.rels.splice(i, 1);
    render();
    UI.toast('관계가 삭제되었습니다.', () => { if (!DATA.includes(c) || c.rels.includes(rel)) return; c.rels.splice(Math.min(i, c.rels.length), 0, rel); render(); });
    return;
  }
  const tg = t.closest('[data-toast]');
  if (tg) { UI.toast(`${tg.dataset.toast} 창을 엽니다`); return; }
  const go = t.closest('[data-goto]');
  if (go) { location.href = go.dataset.goto; return; }
  const cp = t.closest('[data-copy]');
  if (cp) { UI.toast(`전화번호 ${cp.dataset.copy}을(를) 복사했습니다.`); return; }
  if (t.closest('[data-ctype]')) { const b = t.closest('[data-ctype]'); UI.menu(b, [{ head: '상담 유형' }, ...TYPES.map((ty) => ({ label: ty, on: (state.ctype || '전화') === ty, run: () => { state.ctype = ty; document.querySelectorAll('[data-ctype]').forEach((x) => (x.textContent = ty)); } }))]); e.preventDefault(); return; }
  if (t.closest('[data-focus-compose]')) { const root = state.detail != null ? document.getElementById('detail') : document.getElementById('peek'); root.querySelector('[data-compose]').focus(); return; }
  if (t.closest('[data-back]')) { state.peek = state.detail; state.detail = null; render(); return; }
  const dt = t.closest('[data-detail]');
  if (dt) { state.detail = +dt.dataset.detail; render(); return; }
  const oc = t.closest('[data-open-contact]');
  if (oc && !t.closest('[data-rel-del], [data-rel-edit]')) { const id = +oc.dataset.openContact; if (state.detail != null) state.detail = id; else state.peek = id; render(); return; }
  const del = t.closest('[data-del]');
  if (del) {
    const c = DATA.find((x) => x.id === +del.dataset.del);
    if (c.props.length || c.reqs.length || c.inDeal) { UI.toast('연결된 매물·매수요건이 있어 삭제할 수 없습니다. 연결을 먼저 정리해 주세요.'); return; }
    const i = DATA.indexOf(c);
    DATA.splice(i, 1); state.detail = null; state.peek = null;
    render();
    UI.toast('연락처가 삭제되었습니다.', () => { if (DATA.includes(c)) return; DATA.splice(Math.min(i, DATA.length), 0, c); render(); });
    return;
  }
  const gp = t.closest('[data-gpick]');
  if (gp) {
    const c = DATA.find((x) => x.id === +gp.dataset.gpick);
    UI.menu(gp, [{ head: '그룹' }, ...GROUPS.map((g) => ({ label: g, on: c.tags.includes(g), run: () => (c.tags.includes(g) ? removeFromGroup(g, [c.id]) : addToGroup(g, [c.id])) }))]);
    return;
  }
  const more = t.closest('[data-more]');
  if (more) { rowMenu(more, DATA.find((x) => x.id === +more.dataset.more)); return; }
  if (state.detail != null) return;

  // 목록 화면
  const gm = t.closest('[data-gmenu]');
  if (gm) {
    const name = gm.dataset.gmenu;
    UI.menu(gm, [{ label: '이름 바꾸기', icon: 'note', run: () => { state.renaming = name; state.newGroup = null; state.gerr = ''; render(); } }, { label: '삭제', icon: 'x', danger: true, run: () => deleteGroup(name) }]);
    return;
  }
  if (t.closest('[data-gnew]')) { state.catsOpen = true; state.newGroup = {}; state.renaming = null; state.gerr = ''; render(); return; }
  if (t.closest('[data-catclr]')) { state.cat = 'all'; render(); return; }
  const cs = t.closest('[data-catsel]');
  if (cs) {
    const n = (x) => String(DATA.filter(x).length);
    UI.menu(cs, [{ label: '전체 연락처', on: state.cat === 'all', hint: String(DATA.length), run: () => { state.cat = 'all'; render(); } },
      ...CATS.flatMap((s) => [{ head: s.sec }, ...s.items.map((x) => ({ label: x[1], hint: n(x[2]), on: state.cat === x[0], run: () => { state.cat = x[0]; render(); } }))]),
      ...(GROUPS.length ? [{ head: '그룹' }, ...GROUPS.map((g) => ({ label: g, hint: n((c) => c.tags.includes(g)), on: state.cat === `group:${g}`, run: () => { state.cat = `group:${g}`; render(); } }))] : [])]);
    return;
  }
  const cat = t.closest('[data-cat]');
  if (cat) { state.cat = cat.dataset.cat; state.picked.clear(); render(); return; }
  if (t.closest('#catBtn')) { state.catsOpen = !state.catsOpen; render(); return; }
  if (t.closest('[data-reset]')) { state.q = ''; state.cat = 'all'; state.sort = { key: 'updated', dir: -1 }; document.getElementById('q').value = ''; render(); return; }
  if (t.closest('#sortBtn')) {
    UI.menu(t.closest('#sortBtn'), [{ head: '정렬' }, ...SORTS.map(([key, l]) => { const on = state.sort.key === key; return { label: l, on, hint: on ? (state.sort.dir > 0 ? '오름차순' : '내림차순') : '', run: () => { state.sort = on ? { key, dir: -state.sort.dir } : { key, dir: key === 'name' ? 1 : -1 }; render(); } }; })], { right: true });
    return;
  }
  const th = t.closest('th[data-sort]');
  if (th && !t.closest('.rz')) {
    const key = th.dataset.sort;
    const cur = state.sort.key === key ? state.sort.dir : 0;
    UI.menu(th, [{ label: '오름차순 정렬', icon: 'sort', on: cur === 1, run: () => { state.sort = { key, dir: 1 }; render(); } }, { label: '내림차순 정렬', icon: 'sort', on: cur === -1, run: () => { state.sort = { key, dir: -1 }; render(); } }]);
    return;
  }
  if (t.closest('#newBtn')) { UI.toast('연락처 추가 창을 엽니다'); return; }
  if (t.closest('[data-pclose]')) { state.peek = null; render(); return; }
  if (t.closest('#ckAll')) {
    const ids = state.visible || [];
    const allOn = ids.length && ids.every((id) => state.picked.has(id));
    ids.forEach((id) => (allOn ? state.picked.delete(id) : state.picked.add(id)));
    render();
    return;
  }
  const bulk = t.closest('[data-bulk]');
  if (bulk) {
    const ids = [...state.picked];
    const k = bulk.dataset.bulk;
    if (k === 'clear') { state.picked.clear(); render(); }
    else if (k === 'add') groupMenu(bulk, ids);
    else if (k === 'remove') removeFromGroup(state.cat.slice(6), ids);
    else if (k === 'copy') copyPhones(ids);
    else if (k === 'quick') { state.peek = ids[0]; render(); }
    else if (k === 'detail') { state.detail = ids[0]; render(); }
    return;
  }
  if (t.closest('[data-xclose]')) { delete state.open[+t.closest('tr.exp').dataset.exp]; render(); return; }
  if (t.closest('tr.exp')) return;
  const tr = t.closest('#rows tr[data-id]');
  if (!tr) return;
  const c = DATA.find((x) => x.id === +tr.dataset.id);
  if (t.closest('.ck')) { state.picked.has(c.id) ? state.picked.delete(c.id) : state.picked.add(c.id); render(); return; }
  if (t.closest('.rowact')) { rowMenu(t.closest('.rowact'), c); return; }
  const pt = t.closest('[data-ptog]');
  if (pt) { const k = pt.dataset.ptog; if (state.open[c.id] === k) delete state.open[c.id]; else { state.open[c.id] = k; state.justOpened = c.id; } render(); return; }
  if (t.closest('[data-quick]')) { state.peek = state.peek === c.id ? null : c.id; render(); return; }
});
document.addEventListener('dblclick', (e) => {
  const tr = e.target.closest('#rows tr[data-id]');
  if (!tr || e.target.closest('.ck, .ptog, .ib, [data-quick]')) return;
  state.peek = +tr.dataset.id;
  render();
});
document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
document.addEventListener('input', (e) => { if (e.target.matches('.memo-ed')) e.target.dataset.dirty = '1'; });
document.addEventListener('focusout', (e) => {
  const el = e.target;
  if (!el.matches) return;
  if (el.matches('.gin')) { setTimeout(() => { if (document.activeElement !== el && document.body.contains(el)) commitGroup(el, !el.value.trim()); }, 0); return; }
  if (el.matches('.memo-ed') && el.dataset.dirty) {
    delete el.dataset.dirty;
    const c = DATA.find((x) => x.id === +el.dataset.memo);
    if (!c) return;
    const text = el.textContent.trim();
    if (text === c.memo) return;
    const prev = c.memo;
    c.memo = text; c._mrev = (c._mrev || 0) + 1;
    const v = c._mrev;
    if (!text) el.textContent = '';
    UI.toast('메모를 저장했습니다.', () => { if (c._mrev !== v) { UI.toast('그 뒤에 다시 바뀌어서 되돌리지 않았습니다'); return; } c.memo = prev; c._mrev += 1; render(); });
  }
});
document.addEventListener('keydown', (e) => {
  if (e.isComposing || e.keyCode === 229) return; // 한글 조합 확정용 Enter는 저장으로 치지 않는다
  const el = e.target;
  if (el.matches('.gin')) {
    if (e.key === 'Enter') { e.preventDefault(); commitGroup(el, false); }
    else if (e.key === 'Escape') { e.stopPropagation(); commitGroup(el, true); }
    return;
  }
  if (el.matches('[data-compose]')) {
    if (e.key !== 'Enter') return;
    const text = el.value.trim();
    if (!text) { UI.toast('상담 내용을 입력하세요.'); return; }
    el.value = '';
    addConsult(DATA.find((c) => c.id === +el.dataset.compose), text);
    return;
  }
  if (el.matches('.memo-ed')) { if (e.key === 'Escape') el.blur(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && el.matches('.cat, .ck, [data-quick], .dr') && el.tagName !== 'BUTTON') { e.preventDefault(); el.click(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f' && state.detail == null) { e.preventDefault(); document.getElementById('q').focus(); return; }
  if (e.key === 'Escape') {
    if (state.detail != null) { state.peek = state.detail; state.detail = null; render(); }
    else if (state.peek != null) { state.peek = null; render(); }
    else if (state.picked.size) { state.picked.clear(); render(); }
  }
});

render();

UI.notes(
  [
    '<b>원본의 열을 그대로 둡니다</b>: 선택, 연락처(이름·분류 / 최근 상담 한 줄), 전화, 희망, 매물, 수정, 작업. 희망·매물의 숫자 버튼을 누르면 행 아래로 매수 희망조건·연결 물건이 줄 목록으로 펼쳐집니다.',
    '<b>분류 패널이 곧 필터</b>입니다. 전체 / 고객 구분 / 진행 상황 / 정리 / 그룹과 건수가 왼쪽에 늘 보이고, 패널을 닫아도 지금 고른 분류가 도구 줄 선택 상자에 남습니다. 제목 옆 "연락할 사람·거래 중"을 누르면 그 분류로 바로 갑니다.',
    '<b>그룹은 그 자리에서</b> 만들고(+), 이름을 바꾸고, 지웁니다. 대화창 대신 패널 안 입력칸을 쓰고, 이름 규칙(30자, 쉼표 금지, 중복)은 원본과 같습니다. 여러 명을 골라 "그룹에 넣기 / 이 그룹에서 빼기 / 전화번호 복사"를 하고, 모두 실행 취소가 됩니다.',
    '<b>빠른 확인은 옆 상세</b>로 엽니다(이름을 누르거나 행을 두 번 누름). 지금 확인할 것, 전화번호, 연결 매물, 매수요건, 최근 상담, 관계, 메모가 카드 없이 촘촘한 줄로 이어지고, 아래 입력칸에서 상담을 바로 기록합니다.',
    '<b>상세 보기</b>(옆 상세의 넓히기 버튼, 행 메뉴)는 원본 상세 화면의 구성을 따릅니다: 머리(수정·삭제)와 후속 버튼 다섯 개, 왼쪽에 기본 정보·관계·연결 매물·매수요건, 오른쪽에 따로 스크롤되는 상담내역. 카드 상자를 걷어 내고 구분선과 줄 목록으로 바꿨습니다.',
    '<b>메모는 눌러서 바로 고치고</b>, 그룹/태그 칸을 누르면 그룹을 넣고 뺍니다. 연결이 남은 연락처는 원본처럼 삭제를 막습니다.',
  ],
  '표·분류·빠른 확인·상세의 기능은 그대로 두고, 상자와 대화창을 줄였습니다.',
);
</script>
</body>
</html>
