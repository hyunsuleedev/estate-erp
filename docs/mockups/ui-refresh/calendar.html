<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캘린더 · UI 개선 데모</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="ui.css">
<style>
  /* 일정 유형·재무 종류 색: 태그 색 변수 한 쌍(바탕·글자)을 그대로 쓴다 */
  .t-general { --c-bg: color-mix(in srgb, var(--text) 8%, var(--paper)); --c-fg: color-mix(in srgb, var(--text) 78%, var(--paper)); }
  .t-viewing { --c-bg: var(--tg-teal-bg); --c-fg: var(--tg-teal); }
  .t-contract { --c-bg: var(--tg-yellow-bg); --c-fg: var(--tg-yellow); }
  .t-meeting { --c-bg: var(--tg-blue-bg); --c-fg: var(--tg-blue); }
  .t-task { --c-bg: var(--tg-purple-bg); --c-fg: var(--tg-purple); }
  .t-all { --c-bg: var(--text); --c-fg: var(--paper); }
  .o-contractDate { --c-bg: var(--tg-blue-bg); --c-fg: var(--tg-blue); }
  .o-interimDate { --c-bg: var(--tg-purple-bg); --c-fg: var(--tg-purple); }
  .o-balanceDate { --c-bg: var(--tg-orange-bg); --c-fg: var(--tg-orange); }
  .o-commissionDue { --c-bg: var(--tg-green-bg); --c-fg: var(--tg-green); }
  .sw { width: 12px; height: 12px; border-radius: 3px; background: var(--c-bg); display: inline-grid; place-items: center; flex: none; }
  .sw::after { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--c-fg); }

  /* 머리 줄 */
  .ph .actions kbd.k { background: color-mix(in srgb, var(--on-primary) 16%, transparent); box-shadow: none; color: var(--on-primary); margin-left: 2px; }
  #panelBtn[hidden] { display: none; }
  .navg { display: inline-flex; align-items: center; gap: 2px; }
  .navg .btn { height: 28px; }
  .hint { font-size: 12px; color: var(--text-3); white-space: nowrap; }
  .hint b { font-weight: 500; color: var(--text-2); }

  /* 필터 줄: 늘 보이는 선택 상자 */
  .fbar { gap: 6px; padding: 10px var(--gutter) 10px; flex-wrap: wrap; border-bottom: 1px solid var(--line-2); }
  .fsel, .fty, .ftog {
    height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px;
    border: 0; border-radius: 8px; background: var(--paper);
    box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 2px rgba(16, 24, 40, 0.04);
    font: inherit; font-size: 13px; color: var(--text); letter-spacing: inherit; white-space: nowrap; cursor: pointer;
    transition: box-shadow 0.12s, background-color 0.12s, opacity 0.12s;
  }
  .fsel:hover, .fty:hover, .ftog:hover { box-shadow: inset 0 0 0 1px var(--line-3), 0 1px 2px rgba(16, 24, 40, 0.04); }
  .fsel { padding: 0 8px 0 10px; }
  .fsel .k { color: var(--text-2); }
  .fsel .v { font-weight: 500; }
  .fsel > .i { width: 12px; height: 12px; color: var(--text-3); }
  .fsel.on, .fty.on, .ftog.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent-ink); }
  .fsel.on .k { color: var(--accent-ink); opacity: 0.75; }
  .fsel .clr { width: 16px; height: 16px; display: grid; place-items: center; border-radius: 4px; color: var(--accent-ink); }
  .fsel .clr:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .fsel .clr .i { width: 11px; height: 11px; }
  .fsel[disabled] { opacity: 0.45; pointer-events: none; }
  .fty.on { font-weight: 500; }
  .fty .n { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .fty.on .n { color: var(--accent-ink); opacity: 0.75; }
  .ftog .bx { width: 14px; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px var(--line-3); display: grid; place-items: center; background: var(--paper); }
  .ftog .bx .i { width: 10px; height: 10px; stroke-width: 3; color: var(--on-primary); opacity: 0; }
  .ftog.on .bx { background: var(--accent); box-shadow: none; }
  .ftog.on .bx .i { opacity: 1; }
  .fbar .hint { margin-left: auto; }

  /* 본문: 달력 + 오른쪽 패널 */
  .cal { flex: 1; min-height: 0; display: flex; }
  .cal > .scroll { flex: 1; min-width: 0; }

  .pill {
    display: flex; align-items: center; gap: 5px; width: 100%; min-width: 0; height: 20px; padding: 0 6px;
    border: 0; border-radius: 4px; background: var(--c-bg); color: var(--c-fg);
    font: inherit; font-size: 12px; line-height: 1; text-align: left; white-space: nowrap; overflow: hidden; cursor: pointer; flex: none;
    transition: filter 0.1s, box-shadow 0.1s;
  }
  .pill:hover { filter: brightness(0.96) saturate(1.15); }
  .pill .tm { font-size: 11px; font-variant-numeric: tabular-nums; opacity: 0.72; flex: none; }
  .pill .tt { overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .pill .i { width: 11px; height: 11px; flex: none; }
  .pill.past { opacity: 0.6; }
  .pill.on { box-shadow: 0 0 0 2px var(--accent); opacity: 1; }
  .pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* 월 보기 */
  .mv { min-height: 100%; min-width: 700px; display: flex; flex-direction: column; }
  .mv-h { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--paper); border-bottom: 1px solid var(--line-2); flex: none; }
  .mv-h span { height: 30px; display: flex; align-items: center; padding: 0 10px; font-size: 12px; color: var(--text-2); }
  .sun { color: var(--danger) !important; }
  .sat { color: var(--down) !important; }
  .mv-g { flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: auto; align-content: stretch; }
  .mc {
    position: relative; min-width: 0; min-height: 108px; padding: 5px 6px 6px; display: flex; flex-direction: column; gap: 2px;
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer; transition: background-color 0.1s;
  }
  .mc:nth-child(7n) { border-right: 0; }
  .mc:hover { background: var(--row-hover); }
  .mc.out { background: color-mix(in srgb, var(--soft) 55%, var(--paper)); }
  .mc.sel { background: var(--picked); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 55%, transparent); }
  .mc:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .mc-top { display: flex; align-items: center; gap: 4px; height: 24px; flex: none; }
  .mc-top .dnum { min-width: 24px; height: 22px; padding: 0 5px; border-radius: 6px; display: inline-grid; place-items: center; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .mc.out .dnum { color: var(--text-3); font-weight: 400; }
  .mc.today .dnum { background: var(--primary); color: var(--on-primary) !important; font-weight: 600; }
  .mc-top .cnt { margin-left: auto; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .mc-add { width: 22px; height: 22px; margin-right: -2px; opacity: 0; }
  .mc-top .cnt + .mc-add { margin-left: 0; }
  .mc-top .dnum + .mc-add { margin-left: auto; }
  .mc:hover .mc-add, .mc:focus-within .mc-add, .mc-add:focus-visible { opacity: 1; }
  .mc-add .i { width: 13px; height: 13px; }
  .mc-more { display: flex; gap: 8px; height: 18px; align-items: center; flex: none; }
  .mc-more button { white-space: nowrap; border: 0; background: transparent; padding: 0 3px; height: 18px; border-radius: 4px; font: inherit; font-size: 11px; color: var(--text-2); cursor: pointer; }
  .mc-more button:hover { background: var(--press); color: var(--text); }

  /* 주·일 보기 */
  .tg { display: grid; min-width: 700px; }
  .tg.one { min-width: 420px; }
  .tg > * { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
  .tg-corner, .tg-dh { position: sticky; top: 0; z-index: 2; background: var(--paper); border-bottom-color: var(--line-2); }
  .tg-corner { display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 8px 8px; font-size: 11px; color: var(--text-3); }
  .tg-dh { border-top: 0; border-left: 0; padding: 7px 10px 8px; text-align: left; font: inherit; color: var(--text); cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 3px 6px; transition: background-color 0.1s; }
  .tg-dh:hover { background: var(--row-hover); }
  .tg-dh .wd { font-size: 12px; color: var(--text-2); white-space: nowrap; }
  .tg-dh .d { grid-column: 1 / -1; justify-self: start; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 7px; display: inline-grid; place-items: center; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tg-dh.today .d { background: var(--primary); color: var(--on-primary); }
  .tg-dh.sel { box-shadow: inset 0 -2px 0 var(--accent); }
  .tg-dh .n { grid-column: 2; grid-row: 1; font-size: 11px; white-space: nowrap; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .tg-lab { padding: 6px 8px; text-align: right; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .tg-all { padding: 4px; display: flex; flex-direction: column; gap: 2px; min-height: 30px; }
  .tg-slot { position: relative; min-height: 62px; padding: 3px 4px; display: flex; flex-direction: column; gap: 3px; }
  .tg-slot:hover { background: var(--row-hover); }
  .tg .tcol { background: color-mix(in srgb, var(--accent) 3.5%, var(--paper)); }
  .tg-now { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px solid var(--danger); z-index: 1; pointer-events: none; }
  .tg-now::before { content: ""; position: absolute; left: -3px; top: -4px; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
  .blk {
    width: 100%; min-width: 0; padding: 5px 7px; border: 0; border-radius: 6px; background: var(--c-bg); color: var(--c-fg);
    font: inherit; text-align: left; cursor: pointer; display: block; transition: filter 0.1s, box-shadow 0.1s;
  }
  .blk:hover { filter: brightness(0.96) saturate(1.15); }
  .blk.on { box-shadow: 0 0 0 2px var(--accent); }
  .blk.past { opacity: 0.55; }
  .blk b { display: block; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk span { display: block; font-size: 11px; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }

  /* 일정 목록 보기 */
  .ag-day { display: grid; grid-template-columns: 152px minmax(0, 1fr); border-bottom: 1px solid var(--line-2); }
  .ag-date { padding: 12px 12px 12px var(--gutter); display: flex; align-items: flex-start; gap: 10px; border-right: 1px solid var(--line); }
  .ag-date .d { min-width: 34px; height: 34px; padding: 0 6px; border-radius: 8px; display: inline-grid; place-items: center; font-size: 22px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .ag-day.today .ag-date .d { background: var(--primary); color: var(--on-primary); }
  .ag-date .wd { font-size: 13px; font-weight: 500; line-height: 18px; white-space: nowrap; }
  .ag-date .n { font-size: 12px; color: var(--text-3); line-height: 16px; }
  .ag-row {
    width: 100%; display: grid; grid-template-columns: 16px 104px minmax(0, 1fr) auto; align-items: center; gap: 12px;
    min-height: 46px; padding: 5px var(--gutter) 5px 16px; border: 0; border-bottom: 1px solid var(--line); background: transparent;
    font: inherit; color: var(--text); text-align: left; cursor: pointer; transition: background-color 0.1s;
  }
  .ag-row:last-child { border-bottom: 0; }
  .ag-row:hover { background: var(--row-hover); }
  .ag-row.act { background: color-mix(in srgb, var(--accent) 5%, var(--paper)); }
  .ag-row.on { background: var(--picked); box-shadow: inset 2px 0 0 var(--accent); }
  .ag-row .sq { width: 14px; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px var(--line-3); display: grid; place-items: center; }
  .ag-row .sq .i { width: 10px; height: 10px; stroke-width: 3; color: var(--on-primary); opacity: 0; }
  .ag-row.done .sq { background: var(--dot-ok); box-shadow: none; }
  .ag-row.done .sq .i { opacity: 1; }
  .ag-row .tm { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ag-row .mn { min-width: 0; }
  .ag-row .l1 { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; min-width: 0; }
  .ag-row .l1 span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ag-row.done .l1 span:last-child { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--line-3); }
  .ag-row .mn { display: block; overflow: hidden; }
  .ag-row .l2 { display: block; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 20px; }

  /* 오른쪽 패널 */
  .cpanel { width: 316px; flex: none; border-left: 1px solid var(--line-2); display: flex; flex-direction: column; min-height: 0; animation: peek-in 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .cpanel[hidden] { display: none; }
  .mcal { padding: 10px 14px 10px; border-bottom: 1px solid var(--line); }
  .mcal-h { display: flex; align-items: center; height: 28px; padding: 0 2px 0 6px; font-size: 13px; font-weight: 600; }
  .mcal-h .ib { width: 24px; height: 24px; }
  .mcal-h .ib:first-of-type { margin-left: auto; }
  .mcal-g { display: grid; grid-template-columns: repeat(7, 1fr); }
  .mcal-g span { height: 22px; display: grid; place-items: center; font-size: 11px; color: var(--text-3); }
  .mcal-g button { position: relative; height: 26px; border: 0; border-radius: 6px; background: transparent; font: inherit; font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; cursor: pointer; }
  .mcal-g button:hover { background: var(--hover); }
  .mcal-g button.out { color: var(--text-3); }
  .mcal-g button.has::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 3px; height: 3px; margin-left: -1.5px; border-radius: 50%; background: var(--text-3); }
  .mcal-g button.sel { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
  .mcal-g button.today { background: var(--primary); color: var(--on-primary); font-weight: 600; }
  .mcal-g button.today.sel { box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--accent); }
  .mcal-g button.today.has::after { background: var(--on-primary); }
  .ptabs { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 14px; flex: none; }
  .ptabs .seg { flex: 1; }
  .ptabs .seg button { flex: 1; justify-content: center; }
  .ptabs .seg button .n { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .pbody { flex: 1; min-height: 0; overflow: auto; }
  .pfoot { flex: none; padding: 10px 14px; border-top: 1px solid var(--line); }
  .pfoot .btn { width: 100%; justify-content: flex-start; }
  .phead { display: flex; align-items: center; gap: 8px; padding: 4px 14px 8px; font-size: 14px; font-weight: 600; }
  .phead .tag { font-size: 11px; height: 18px; }
  .phead .n { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .psub { padding: 12px 14px 4px; font-size: 12px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
  .prow {
    position: relative; width: calc(100% - 12px); margin: 0 6px; display: flex; align-items: center; gap: 9px; min-height: 44px; padding: 4px 8px;
    border: 0; border-radius: 8px; background: transparent; font: inherit; color: var(--text); text-align: left; cursor: pointer; transition: background-color 0.1s;
  }
  .prow:hover, .prow:focus-within { background: var(--hover); }
  .prow .tmc { width: 44px; flex: none; font-variant-numeric: tabular-nums; }
  .prow .tmc b { display: block; font-size: 13px; font-weight: 600; line-height: 18px; }
  .prow .tmc small { display: block; font-size: 11px; color: var(--text-3); line-height: 14px; }
  .prow .mn { flex: 1; min-width: 0; }
  .prow .l1 { display: block; font-size: 13px; line-height: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow .l2 { display: block; font-size: 12px; line-height: 16px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .prow.past .l1 { color: var(--text-2); }
  .prow .ract { flex: none; display: flex; opacity: 0; transition: opacity 0.12s; }
  .prow:hover .ract, .prow:focus-within .ract { opacity: 1; }
  .prow .ract .ib { width: 26px; height: 26px; }
  .prow .go { flex: none; font-size: 11px; color: var(--text-3); }
  .prow .i.fin { width: 15px; height: 15px; color: var(--c-fg); background: var(--c-bg); border-radius: 4px; padding: 2px; box-sizing: content-box; }
  .pempty { padding: 36px 28px; text-align: center; font-size: 12px; line-height: 1.6; color: var(--text-2); }
  .pempty b { display: block; font-size: 13px; color: var(--text); font-weight: 600; margin-bottom: 2px; }
  .pempty .btn { margin-top: 10px; }
  .pempty > .i { width: 18px; height: 18px; color: var(--text-3); margin-bottom: 8px; }
  .pempty > .i.okc { color: var(--ok); }

  /* 일정 상세 */
  .insp { padding: 2px 16px 16px; }
  .insp-back { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 8px 0 4px; margin-left: -6px; border: 0; border-radius: 6px; background: transparent; font: inherit; font-size: 12px; color: var(--text-2); cursor: pointer; }
  .insp-back:hover { background: var(--hover); color: var(--text); }
  .insp-back .i { width: 13px; height: 13px; }
  .insp h2 { margin: 10px 0 0; font-size: 16px; line-height: 1.45; font-weight: 650; letter-spacing: -0.015em; word-break: break-word; }
  .insp .bd { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .insp .bd .tag.evt { background: var(--c-bg); color: var(--c-fg); }
  .insp .bd .st::before { display: none; }
  .insp .bd .st { padding: 0 8px; }
  .insp .when { display: flex; gap: 8px; margin-top: 12px; font-size: 13px; line-height: 20px; }
  .insp .when .i { width: 14px; height: 14px; margin-top: 3px; color: var(--text-3); }
  .insp .when small { display: block; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .insp h3 { margin: 18px 0 8px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
  .insp h3 .i { width: 13px; height: 13px; }
  .insp .kv { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .insp .kv .k { width: 52px; font-size: 12px; color: var(--text-2); flex: none; }
  .insp .desc { margin: 10px 0 0; padding: 9px 11px; border-radius: 8px; background: var(--soft); font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .insp .none { margin: 10px 0 0; font-size: 12px; color: var(--text-3); line-height: 1.6; }
  .echip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 28px; padding: 0 9px 0 7px; border: 0; border-radius: 7px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2); font: inherit; font-size: 13px; color: var(--text); cursor: pointer; }
  .echip:hover { background: var(--soft); box-shadow: inset 0 0 0 1px var(--line-3); }
  .echip .i { width: 13px; height: 13px; color: var(--text-3); }
  .echip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .echip small { font-size: 12px; color: var(--text-2); white-space: nowrap; }

  /* 업무함 */
  .qseg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 0 14px 6px; }
  .qseg button { height: 28px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 7px; background: var(--soft); font: inherit; font-size: 12px; color: var(--text-2); cursor: pointer; transition: background-color 0.12s, color 0.12s; }
  .qseg button:hover { color: var(--text); background: var(--press); }
  .qseg button.on { background: var(--primary); color: var(--on-primary); font-weight: 500; }
  .qseg button b { font-weight: 500; font-variant-numeric: tabular-nums; opacity: 0.7; }
  .pdot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--line-3); }
  .pdot.urgent { background: var(--danger); }
  .pdot.high { background: var(--tg-orange); box-shadow: 0 0 0 3px var(--tg-orange-bg); width: 6px; height: 6px; margin: 1px; }
  .pdot.medium { background: var(--dot-warn); }
  .qmore { display: flex; justify-content: center; padding: 6px 14px 12px; }

      }).join('')}</div></section>`;
  }).join('');
}

function renderFilters(all) {
  const r = rangeOf(state.cur, state.view);
  const base = filtered(true).filter((e) => inRange(e, r)); // 유형별 개수: 담당 필터까지만 건 뒤 센다
  const cnt = (t) => base.filter((e) => e.type === t).length;
  const ty = (id, cls, label, n) => `<button class="fty ${state.typeF === id ? 'on' : ''}" data-type="${id}" aria-pressed="${state.typeF === id}"><span class="sw ${cls}"></span>${label}<span class="n">${n}</span></button>`;
  const user = state.userF;
  $('fbar').innerHTML = `${ty('', 't-all', '모든 유형', base.length)}${Object.keys(TYPES).map((k) => ty(k, `t-${k}`, TYPES[k].l, cnt(k))).join('')}
    <span class="vsep"></span>
    <button class="fsel ${user && !state.mine ? 'on' : ''}" id="userSel" ${state.mine ? 'disabled title="내 일정만 보는 중에는 담당자를 고를 수 없습니다"' : ''}><span class="k">담당자</span><span class="v">${state.mine ? ME : user || '전체'}</span>${user && !state.mine ? `<span class="clr" data-clear-user role="button" aria-label="담당자 필터 지우기">${icon('x')}</span>` : icon('chevDown')}</button>
    <button class="ftog ${state.mine ? 'on' : ''}" data-tog="mine" aria-pressed="${state.mine}"><span class="bx">${icon('check')}</span>내 일정만</button>
    <button class="ftog ${state.fin ? 'on' : ''}" data-tog="fin" aria-pressed="${state.fin}"><span class="bx">${icon('check')}</span>재무 일정</button>
    <span class="hint"><b>T</b> 오늘 · <b>J/K</b> 이전·다음 · <b>N</b> 새 일정</span>`;
}

function renderMini(byDateAll) {
  const cells = monthCells(state.cur);
  while (cells.length < 42) { const d = addDays(cells[cells.length - 1].date, 1); cells.push({ date: d, key: key(d), out: true }); }
  return `<div class="mcal"><div class="mcal-h">${monthTitle(state.cur)}<button class="ib" data-mini="-1" aria-label="이전 달">${icon('chevLeft')}</button><button class="ib" data-mini="1" aria-label="다음 달">${icon('chevRight')}</button></div>
    <div class="mcal-g">${WD.map((w, i) => `<span class="${wdCls(i)}">${w}</span>`).join('')}${cells.map((c) => `<button class="${c.out ? 'out' : ''} ${sameDay(c.date, state.sel) ? 'sel' : ''} ${sameDay(c.date, TODAY) ? 'today' : ''} ${byDateAll.has(c.key) ? 'has' : ''}" data-pick="${c.key}" aria-label="${dayTitle(c.date)}">${c.date.getDate()}</button>`).join('')}</div></div>`;
}

function renderDayList(byDate, ovs) {
  const k = key(state.sel);
  const evs = byDate.get(k) || [];
  const os = ovs.get(k) || [];
  let body;
  if (!evs.length && !os.length) {
    body = `<div class="pempty">${icon('cal')}<b>비어 있는 날입니다</b>일정을 추가하면 이곳에 시간순으로 표시됩니다.<br><button class="btn sm" data-add="${k}">${icon('plus')}일정 추가</button></div>`;
  } else {
    body = evs.map((e) => {
      const en = evEnd(e);
      const multi = isMulti(e);
      const sub = en && (multi || !e.allDay) ? (multi ? `→ ${en.getMonth() + 1}/${en.getDate()}` : `~${hm(en)}`) : '';
      return `<div class="prow ${evStatus(e).state === 'done' ? 'past' : ''}" data-ev="${e.id}" tabindex="0" role="button" title="${esc(`${timeRange(e)} · 상세 보기 · 두 번 누르면 수정`)}">
        <span class="tmc"><b>${e.allDay ? '종일' : hm(evStart(e))}</b>${sub ? `<small>${sub}</small>` : ''}</span><span class="sw ${ccls(e)}"${cstyle(e)}></span>
        <span class="mn"><span class="l1">${esc(e.title)}</span><span class="l2">${esc(evContext(e))}</span></span>
        <span class="ract"><button class="ib" data-edit="${e.id}" aria-label="일정 수정">${icon('note')}</button></span></div>`;
    }).join('');
    if (os.length) body += `<div class="psub">재무 <span class="t3 num">${os.length}</span></div>` + os.map((o) => `<button class="prow o-${o.kind}" data-ov="${o.id}">${icon('wallet', 'fin')}<span class="mn"><span class="l1">${esc(o.title)}</span>${o.sub ? `<span class="l2">${o.sub}</span>` : ''}</span><span class="go">상세 보기</span></button>`).join('');
  }
  return `<div class="pbody"><div class="phead">${dayTitle(state.sel)} ${WD[state.sel.getDay()]}요일${sameDay(state.sel, TODAY) ? '<span class="tag">오늘</span>' : ''}<span class="n">${evs.length + os.length}건</span></div>${body}</div>
    <div class="pfoot"><button class="btn" data-add="${k}">${icon('plus')}이 날짜에 일정 추가</button></div>`;
}

function renderInspector(e) {
  const st = evStatus(e);
  const s = evStart(e);
  const links = LINK_KINDS.filter((k) => e.links[k]);
  return `<div class="pbody"><div class="insp">
    <button class="insp-back" data-back>${icon('chevLeft')}${dayTitle(state.sel)} 일정</button>
    <div class="bd"><span class="tag evt ${ccls(e)}"${cstyle(e)}>${typeOf(e).l}</span><span class="st ${st.cls}">${st.label}</span></div>
    <h2>${esc(e.title)}</h2>
    <div class="when">${icon('clock')}<span>${dayTitle(s)} (${WD[s.getDay()]})<small>${timeRange(e)}</small></span></div>
    <h3>상세</h3>
    <div class="kv"><span class="k">담당자</span>${e.user ? UI.who(e.user) : '담당자 정보 없음'}</div>
    ${e.desc ? `<p class="desc">${esc(e.desc)}</p>` : '<p class="none">등록된 설명이 없습니다.</p>'}
    <h3>${icon('arrowUpRight')}CRM 연결</h3>
    ${links.length ? links.map((k) => `<div class="kv" style="margin-bottom:6px"><span class="k">${LINK_LABEL[k]}</span><button class="echip" data-go="${k}">${icon(LINK_ICON[k])}<span>${esc(e.links[k].label)}</span>${e.links[k].stage ? `<small>${esc(e.links[k].stage)}</small>` : ''}</button></div>`).join('') : '<p class="none" style="margin-top:0">연결된 연락처나 매물이 없습니다. 수정 화면에서 CRM 문맥을 연결할 수 있습니다.</p>'}
  </div></div>
  <div class="pfoot"><button class="btn primary" data-edit="${e.id}">${icon('note')}일정 수정</button></div>`;
}

function renderQueue() {
  const c = queueCounts(TASKS);
  const list = TASKS.filter((t) => inBucket(t, state.bucket)).sort(sortQueue);
  const LIMIT = 8;
  const shown = list.slice(0, LIMIT);
  const body = shown.length ? shown.map((t) => `<div class="prow" data-task="${t.id}" tabindex="0" role="button" title="${esc(t.title)} 업무 열기">
      <span class="pdot ${t.pri}" title="우선순위"></span>
      <span class="mn"><span class="l1">${esc(t.title)}</span><span class="l2">${CAT[t.cat] || '기타'} · ${dueText(t)}</span></span>
      <span class="ract"><button class="ib" data-done="${t.id}" aria-label="완료 처리">${icon('check')}</button></span></div>`).join('')
    : `<div class="pempty">${icon('check', 'okc')}<b>처리할 업무가 없습니다</b>${state.bucket === 'overdue' ? '밀린 업무 없이 깔끔합니다.' : '다른 업무함도 확인해 보세요.'}</div>`;
  return `<div class="pbody"><div class="phead">업무함<span class="n">${c.total}건</span><a class="btn quiet sm" href="tasks.html" style="margin:-4px -6px -4px 0">전체 보기</a></div>
    <div class="qseg">${BUCKETS.map(([id, l]) => `<button class="${state.bucket === id ? 'on' : ''}" data-bucket="${id}" aria-pressed="${state.bucket === id}">${l}<b>${c[id]}</b></button>`).join('')}</div>
    ${body}${list.length > shown.length ? `<div class="qmore"><a class="btn quiet sm" href="tasks.html">${icon('todo')}${list.length - shown.length}개 더 보기</a></div>` : ''}</div>`;
}

function render() {
  const r = rangeOf(state.cur, state.view);
  const list = filtered();
  const inR = list.filter((e) => inRange(e, r));
  const byDate = groupByDate(list);
  const ovs = overlaysByDate();
  if (state.selEv && !list.some((e) => e.id === state.selEv)) state.selEv = null; // 필터로 가려진 일정은 상세를 닫는다

  $('title').textContent = state.view === 'agenda' ? `${monthTitle(state.cur)} 일정` : state.view === 'day' ? `${state.cur.getFullYear()}년 ${dayTitle(state.cur)} ${WD[state.cur.getDay()]}요일` : monthTitle(state.cur);
  $('cnt').textContent = `${inR.length}건`;
  $('rng').textContent = state.view === 'agenda' ? `${monthTitle(state.cur)} 전체` : fmtRange(r.start, r.end);
  const ag = rangeOf(state.cur, 'agenda');
  $('agN').textContent = list.filter((e) => inRange(e, ag)).length;
  document.querySelectorAll('.vtab[data-view]').forEach((t) => { const on = t.dataset.view === state.view; t.classList.toggle('on', on); t.setAttribute('aria-selected', on); });
  renderFilters();

  $('view').innerHTML = state.view === 'month' ? renderMonth(byDate, ovs)
    : state.view === 'agenda' ? renderAgenda(byDate)
    : renderTimeGrid(state.view === 'day' ? [state.cur] : weekDates(state.cur), byDate);

  const panel = $('panel');
  panel.hidden = !state.panel;
  $('panelBtn').hidden = state.panel;
  if (state.panel) {
    const ev = state.selEv && EVENTS.find((e) => e.id === state.selEv);
    const k = key(state.sel);
    const dayN = (byDate.get(k) || []).length + (ovs.get(k) || []).length;
    panel.innerHTML = `${renderMini(byDate)}
      <div class="ptabs"><div class="seg"><button class="${state.ptab === 'day' ? 'on' : ''}" data-ptab="day">${icon('cal')}선택한 날 <span class="n">${dayN}</span></button><button class="${state.ptab === 'queue' ? 'on' : ''}" data-ptab="queue">${icon('todo')}업무함 <span class="n">${queueCounts(TASKS).total}</span></button></div>
      <button class="ib" data-close-panel aria-label="오른쪽 패널 접기">${icon('chevsRight')}</button></div>
      ${state.ptab === 'queue' ? renderQueue() : ev ? renderInspector(ev) : renderDayList(byDate, ovs)}`;
  }
}

/* ───── 조작 ───── */
function selectDate(d, openPanel) {
  state.sel = d; state.selEv = null;
  if (state.view === 'month' || state.view === 'agenda') { if (d.getMonth() !== state.cur.getMonth() || d.getFullYear() !== state.cur.getFullYear()) state.cur = new Date(d.getFullYear(), d.getMonth(), 1); }
  else state.cur = d;
  if (openPanel) { state.panel = true; state.ptab = 'day'; }
  render();
}
function selectEvent(e) { state.sel = sod(evStart(e)); state.selEv = e.id; state.panel = true; state.ptab = 'day'; render(); }
function navigate(dir) {
  const c = state.cur;
  let n;
  if (state.view === 'month' || state.view === 'agenda') { const dim = new Date(c.getFullYear(), c.getMonth() + dir + 1, 0).getDate(); n = new Date(c.getFullYear(), c.getMonth() + dir, Math.min(c.getDate(), dim)); }
  else n = addDays(c, dir * (state.view === 'week' ? 7 : 1));
  state.cur = n; state.sel = n; state.selEv = null; render();
}
function goToday() { state.cur = new Date(TODAY); state.sel = new Date(TODAY); state.selEv = null; render(); }
function setView(v) {
  state.view = v; state.selEv = null; if (v !== 'month') state.cur = state.sel; render();
  $('view').scrollTop = 0;
  const day = v === 'agenda' && document.querySelector(`.ag-day[data-agday="${key(state.sel)}"]`); // 일정 목록은 선택한 날부터 보여 준다
  if (day) $('view').scrollTop = day.offsetTop;
}

/* ───── 일정 입력 창 ───── */
let form = null;
function openDlg(ev, date) {
  if (ev) {
    form = { id: ev.id, title: ev.title, desc: ev.desc, type: ev.type, allDay: ev.allDay, start: ev.start, end: ev.end, color: ev.color || typeOf(ev).hex, links: { ...ev.links }, confirm: false };
    state.selEv = ev.id;
  } else {
    const s = new Date(date);
    if (s.getHours() === 0 && s.getMinutes() === 0) s.setHours(10, 0, 0, 0);
    const en = new Date(s); en.setHours(s.getHours() + 1);
    form = { id: null, title: '', desc: '', type: 'general', allDay: false, start: toLocal(s), end: toLocal(en), color: TYPES.general.hex, links: mkLinks(), confirm: false };
    state.sel = sod(s);
  }
  drawDlg();
  $('evDlg').hidden = false;
  $('fTitle').focus();
  render();
}
function closeDlg() { $('evDlg').hidden = true; form = null; }
function drawDlg() {
  const f = form;
  const ev = f.id && EVENTS.find((e) => e.id === f.id);
  const ty = f.allDay ? 'date' : 'datetime-local';
  $('evDlgIn').innerHTML = `
    <div class="dlg-h"><h2 id="evDlgT">${f.id ? '일정 수정' : '새 일정'}</h2><p>날짜와 시간, 유형, 설명을 입력하고 관련 CRM 항목을 연결할 수 있습니다.</p><button class="ib" data-dlg-close aria-label="닫기">${icon('x')}</button></div>
    <div class="dlg-b">
      <label class="fl full"><span class="lb"><span>제목<i>*</i></span></span><input class="inp big" id="fTitle" value="${esc(f.title)}" placeholder="예: 래미안고덕 101동 임장"></label>
      <label class="fl"><span class="lb">일정 유형</span><select class="inp" id="fType">${Object.keys(TYPES).map((k) => `<option value="${k}" ${f.type === k ? 'selected' : ''}>${TYPES[k].l}</option>`).join('')}</select></label>
      <div class="fl"><span class="lb">색상</span><div class="crow"><input type="color" class="inp" id="fColor" value="${esc(f.color)}" aria-label="색상"><button type="button" class="ftog ${f.allDay ? 'on' : ''}" id="fAllDay" aria-pressed="${f.allDay}">종일<span class="bx">${icon('check')}</span></button></div></div>
      <label class="fl"><span class="lb"><span>시작<i>*</i></span></span><input class="inp" type="${ty}" id="fStart" value="${esc(f.start)}"></label>
      <label class="fl"><span class="lb"><span>종료</span>${f.end ? '<button type="button" data-clear-end>지우기</button>' : ''}</span><input class="inp" type="${ty}" id="fEnd" value="${esc(f.end)}"></label>
      <label class="fl full"><span class="lb">설명</span><textarea class="inp" id="fDesc" rows="3" placeholder="메모, 준비할 내용, 상대방 요청사항을 적어두세요.">${esc(f.desc)}</textarea></label>
      <div class="lks"><h4>CRM 연결</h4><p>연결한 항목은 일정에서 바로 열 수 있습니다.</p>
        ${LINK_KINDS.map((k) => `<div class="lk"><span class="k">${LINK_LABEL[k]}</span>${f.links[k]
          ? `<span class="echip">${icon(LINK_ICON[k])}<span>${esc(f.links[k].label)}</span>${f.links[k].stage || f.links[k].sub ? `<small>${esc(f.links[k].stage || f.links[k].sub)}</small>` : ''}</span><button class="ib" data-unlink="${k}" aria-label="${LINK_LABEL[k]} 연결 해제">${icon('x')}</button>`
          : `<button class="btn quiet sm" data-link="${k}">${icon('plus')}${LINK_LABEL[k]} 연결</button>`}</div>`).join('')}
      </div>
    </div>
    <div class="dlg-f">${f.confirm
      ? `<span class="msg"><b>일정을 삭제할까요?</b> "${esc(ev ? ev.title : '')}" 일정이 삭제됩니다.</span><button class="btn" data-del-no>취소</button><button class="btn danger fill" data-del-yes>삭제</button>`
      : `${f.id ? '<button class="btn danger" data-del>삭제</button>' : ''}<span class="sp"></span><button class="btn" data-dlg-close>닫기</button><button class="btn primary" id="fSave">저장</button>`}</div>`;
  syncSave();
}
function syncSave() { const b = $('fSave'); if (b) b.disabled = !form.title.trim() || !form.start; }
function submitDlg() {
  const f = form;
  if (!f.title.trim() || !f.start) return;
  const s = D(f.start);
  const en = f.end ? (f.allDay ? eod(D(f.end)) : D(f.end)) : null;
  if (Number.isNaN(s.getTime())) return UI.toast('시작 일시가 올바르지 않습니다.');
  if (en && en < s) return UI.toast('종료 시간은 시작 시간 이후여야 합니다.');
  const color = HEX.test(f.color) && f.color.toLowerCase() !== (TYPES[f.type] || TYPES.general).hex ? f.color : null; // 유형 기본색 그대로면 테마 색을 따른다
  const data = { title: f.title.trim(), desc: f.desc.trim(), type: f.type, allDay: f.allDay, start: f.start, end: f.end, color, links: { ...f.links } };
  let ev;
  if (f.id) { ev = EVENTS.find((e) => e.id === f.id); Object.assign(ev, data); UI.toast('일정이 수정되었습니다.'); }
  else { ev = { id: `e${seq++}`, user: ME, ...data }; EVENTS.push(ev); UI.toast('일정이 추가되었습니다.'); }
  closeDlg();
  state.sel = sod(s); state.selEv = ev.id; state.panel = true; state.ptab = 'day';
  if (state.view !== 'month' && state.view !== 'agenda') state.cur = state.sel;
  else if (s.getMonth() !== state.cur.getMonth() || s.getFullYear() !== state.cur.getFullYear()) state.cur = new Date(s.getFullYear(), s.getMonth(), 1);
  render();
}
function deleteEv() {
  const i = EVENTS.findIndex((e) => e.id === form.id);
  if (i < 0) return closeDlg();
  const [ev] = EVENTS.splice(i, 1);
  closeDlg();
  if (state.selEv === ev.id) state.selEv = null;
  render();
  UI.toast('일정이 삭제되었습니다.', () => { if (!EVENTS.includes(ev)) { EVENTS.push(ev); render(); } });
}

/* ───── 재무 일정 상세 창 ───── */
function openOverlay(o) {
  const d = D(o.dateKey);
  if (!Number.isNaN(d.getTime())) { state.sel = d; state.selEv = null; }
  const fd = (s) => (s ? s.replace(/-/g, '.') : '—');
  const f = (l, v) => `<div><small>${l}</small>${esc(v)}</div>`;
  let body, badge;
  if (o.contract) {
    const c = o.contract;
    badge = `<span class="st ${c.stCls}">${c.status}</span>`;
    const row = (kind, date, amt) => `<div class="${o.kind === kind ? 'act' : ''}"><span class="sw o-${kind}"></span><span class="lb2">${OV_META[kind]}</span><span class="dt">${fd(date)}</span><span class="am">${man(amt)}</span></div>`;
    body = `<h3>계약 정보</h3><div class="dfs">${f('거래 유형', c.tx)}${f('거래 금액', man(c.total))}${f('매도인', c.seller || '—')}${f('매수인', c.buyer || '—')}</div>
      <h3>대금 일정</h3><div class="sch">${row('contractDate', c.contractDate, c.deposit)}${row('interimDate', c.interimDate, c.interim)}${row('balanceDate', c.balanceDate, c.balance)}</div>
      ${c.memo ? `<h3>메모</h3><p class="ov-note">${esc(c.memo)}</p>` : ''}`;
  } else {

    body = `<h3>수금 정보</h3><div class="dfs">${f('수금 예정일', fd(p.due))}${f('구분', p.side === 'seller' ? '매도측' : '매수측')}${f('납부자', p.payer || '—')}${f('연락처', p.phone || '—')}${f('예정 금액', man(p.expected))}${f('수금 금액', man(p.actual))}${f('수금 방법', p.method || '—')}${f('세금계산서', p.tax)}</div>
      ${p.note ? `<h3>메모</h3><p class="ov-note">${esc(p.note)}</p>` : ''}`;
  }
  $('ovDlgIn').innerHTML = `<div class="dlg-h"><div class="ov-h"><span class="ov-ic o-${o.kind}">${icon(o.contract ? 'file' : 'won')}</span><div><h2>${esc(o.title)}${badge}</h2><p>${OV_META[o.kind]}에 연결된 원본 정보를 확인합니다.</p></div></div><button class="ib" data-ov-close aria-label="닫기">${icon('x')}</button></div>
    <div class="ov-b">${body}</div>
    <div class="dlg-f"><span class="sp"></span><button class="btn" data-go-src="${o.contract ? '계약서 관리' : '수금 원장'}">${icon('arrowUpRight')}${o.contract ? '계약서 열기' : '수금 원장 열기'}</button><button class="btn" data-ov-close>닫기</button></div>`;
  $('ovDlg').hidden = false;
  render();
}

/* ───── 이벤트 ───── */
$('newBtn').innerHTML = `${icon('plus')}새 일정<kbd class="k">N</kbd>`;
$('panelBtn').innerHTML = icon('chevsRight');
$('panelBtn').querySelector('svg').style.transform = 'scaleX(-1)';
document.querySelector('[data-nav="-1"]').innerHTML = icon('chevLeft');
document.querySelector('[data-nav="1"]').innerHTML = icon('chevRight');

let lastClick = { id: null, t: 0 };
document.addEventListener('click', (ev) => {
  const t = ev.target;
  const q = (s) => t.closest(s);
  let el;

  // 대화 상자 안
  if (q('#evDlg')) {
    if (t === $('evDlg') || q('[data-dlg-close]')) return closeDlg();
    if (q('#fSave')) return submitDlg();
    if (q('#fAllDay')) {
      const on = !form.allDay;
      form.allDay = on;
      form.start = on ? form.start.slice(0, 10) : form.start ? `${form.start.slice(0, 10)}T10:00` : '';
      form.end = on ? form.end.slice(0, 10) : form.end ? `${form.end.slice(0, 10)}T11:00` : '';
      drawDlg(); $('fAllDay').focus(); return;
    }
    if (q('[data-clear-end]')) { form.end = ''; drawDlg(); $('fEnd').focus(); return; }
    if ((el = q('[data-unlink]'))) { form.links[el.dataset.unlink] = null; drawDlg(); return; }
    if ((el = q('[data-link]'))) {
      const k = el.dataset.link;
      return UI.menu(el, [{ head: `${LINK_LABEL[k]} 선택` }, ...LINKS[k].map((x) => ({ label: x.label, icon: LINK_ICON[k], hint: x.stage || x.sub || '', run: () => { if (form) { form.links[k] = x; drawDlg(); } } }))], { wide: true });
    }
    if (q('[data-del]')) { form.confirm = true; drawDlg(); return; }
    if (q('[data-del-no]')) { form.confirm = false; drawDlg(); return; }
    if (q('[data-del-yes]')) return deleteEv();
    return;
  }
  if (q('#ovDlg')) {
    if (t === $('ovDlg') || q('[data-ov-close]')) { $('ovDlg').hidden = true; return; }
    if ((el = q('[data-go-src]'))) return UI.toast(`${el.dataset.goSrc} 화면에서 원본을 엽니다`);
    return;
  }

  if (q('#newBtn')) return openDlg(null, state.sel);
  if (q('#panelBtn')) { state.panel = true; return render(); }
  if (q('[data-close-panel]')) { state.panel = false; return render(); }
  if (q('#todayBtn')) return goToday();
  if ((el = q('[data-nav]'))) return navigate(+el.dataset.nav);
  if ((el = q('.vtab[data-view]'))) return setView(el.dataset.view);

  // 필터
  if ((el = q('[data-type]'))) { const v = el.dataset.type; state.typeF = state.typeF === v ? '' : v; return render(); }
  if (q('[data-clear-user]')) { state.userF = ''; return render(); }
  if ((el = q('#userSel'))) return UI.menu(el, [{ head: '담당자' }, { label: '전체', on: !state.userF, run: () => { state.userF = ''; render(); } }, ...STAFF.map((n) => ({ label: n, html: av(n), on: state.userF === n, run: () => { state.userF = n; render(); } }))]);
  if ((el = q('[data-tog]'))) { state[el.dataset.tog] = !state[el.dataset.tog]; return render(); }

  // 패널
  if ((el = q('[data-ptab]'))) { state.ptab = el.dataset.ptab; return render(); }
  if ((el = q('[data-mini]'))) { const c = state.cur; state.cur = new Date(c.getFullYear(), c.getMonth() + +el.dataset.mini, 1); state.selEv = null; return render(); }
  if (q('[data-back]')) { state.selEv = null; return render(); }
  if ((el = q('[data-go]'))) return UI.toast(el.dataset.go === 'match' ? '희망매물 화면으로 이동합니다' : `${LINK_LABEL[el.dataset.go]} 상세를 엽니다`);
  if ((el = q('[data-bucket]'))) { state.bucket = el.dataset.bucket; return render(); }
  if ((el = q('[data-done]'))) {
    const task = TASKS.find((x) => x.id === el.dataset.done);
    task.status = 'completed'; task.rev += 1;
    const v = task.rev;
    render();
    return UI.toast(`'${esc(task.title)}' 완료`, () => {
      if (task.rev !== v) return UI.toast('그 뒤에 다시 바뀌어서 되돌리지 않았습니다');
      task.rev += 1; task.status = 'pending'; render();
    });
  }
  if ((el = q('[data-task]'))) return UI.toast(`'${esc(TASKS.find((x) => x.id === el.dataset.task).title)}' 업무 창을 엽니다`);

  // 달력
  if ((el = q('[data-edit]'))) return openDlg(EVENTS.find((e) => e.id === el.dataset.edit));
  if ((el = q('[data-add]'))) return openDlg(null, D(el.dataset.add));
  if ((el = q('[data-ov]'))) return openOverlay(OVERLAYS.find((o) => o.id === el.dataset.ov));
  if ((el = q('[data-ev]'))) {
    const e = EVENTS.find((x) => x.id === el.dataset.ev);
    const now = Date.now();
    if (lastClick.id === e.id && now - lastClick.t < 400) { lastClick = { id: null, t: 0 }; return openDlg(e); } // 두 번 누르면 수정
    lastClick = { id: e.id, t: now };
    return selectEvent(e);
  }
  if ((el = q('[data-pick]'))) { const d = D(el.dataset.pick); if (el.closest('.mcal')) { state.sel = d; state.cur = d; state.selEv = null; state.ptab = 'day'; return render(); } return selectDate(d, false); }
  if ((el = q('[data-day]'))) return selectDate(D(el.dataset.day), true);
});
document.addEventListener('dblclick', (ev) => {
  const slot = ev.target.closest('[data-slot]');
  if (slot && !ev.target.closest('[data-ev]')) openDlg(null, D(slot.dataset.slot));
});
document.addEventListener('input', (ev) => {
  if (!form) return;
  const id = ev.target.id;
  if (id === 'fTitle') form.title = ev.target.value;
  else if (id === 'fDesc') form.desc = ev.target.value;
  else if (id === 'fStart') form.start = ev.target.value;
  else if (id === 'fEnd') { const had = !!form.end; form.end = ev.target.value; if (had !== !!form.end) { drawDlg(); $('fEnd').focus(); } }
  else if (id === 'fColor') form.color = ev.target.value;
  else if (id === 'fType') { form.type = ev.target.value; form.color = (TYPES[form.type] || TYPES.general).hex; $('fColor').value = form.color; }
  syncSave();
});
document.addEventListener('keydown', (ev) => {
  if (ev.isComposing || ev.keyCode === 229) return;
  const tg = ev.target;
  if (ev.key === 'Escape') {
    if (document.querySelector('.cmdk-back') || document.querySelector('.menu')) return;
    if (!$('ovDlg').hidden) { $('ovDlg').hidden = true; return; }
    if (form) return closeDlg();
    return;
  }
  if (form && ev.key === 'Enter' && tg.id === 'fTitle') return submitDlg();
  if ((ev.key === 'Enter' || ev.key === ' ') && tg.matches && tg.matches('.mc, .vtab, .prow[role="button"]')) { ev.preventDefault(); tg.click(); return; }
  if (form || !$('ovDlg').hidden || document.querySelector('.cmdk-back')) return;
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (tg && (/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName) || tg.isContentEditable)) return;
  switch (ev.key.toLowerCase()) {
    case 't': goToday(); break;
    case 'n': ev.preventDefault(); openDlg(null, state.sel); break;
    case 'j': case 'arrowleft': navigate(-1); break;
    case 'k': case 'arrowright': navigate(1); break;
  }
});

render();

UI.notes(
  [
    '<b>월·주·일·일정 네 가지 보기</b>와 이전·오늘·다음, 단축키(T·J·K·N)는 그대로입니다. 보기 탭을 다른 화면과 같은 밑줄 탭으로 맞췄습니다.',
    '<b>필터가 늘 보입니다.</b> 일정 유형·담당자·내 일정만·재무 일정이 달력 위 한 줄에 있고, 유형마다 지금 기간의 건수가 붙습니다. 창이 좁아도 숨지 않습니다.',
    '<b>달력 칸</b>에는 시작 시각과 제목을 한 줄씩 넣었습니다. 지난 일정은 옅게, 고른 일정은 파란 테두리로 보입니다. 칸을 누르면 그 날이 선택되고, 칸 위 +로 바로 일정을 만듭니다.',
    '<b>재무 일정</b>(계약일·중도금일·잔금일·수금예정)은 지갑 아이콘이 붙은 줄로 구분하고, 누르면 계약·수금 원본 정보가 열립니다.',
    '<b>오른쪽 패널</b>에 작은 달력, 선택한 날의 일정, 업무함을 모았습니다. 일정을 누르면 같은 자리에서 상세(담당자·설명·CRM 연결)로 바뀌고, 두 번 누르면 수정 창이 열립니다.',
    '<b>업무함</b>은 지연·오늘·미배정·확인 네 묶음을 촘촘한 줄로 보여 주고, 줄에서 바로 완료 처리(실행 취소 가능)합니다.',
    '<b>일정 입력 창</b>은 제목·유형·색상·종일·시작·종료·설명·CRM 연결 다섯 가지를 모두 담았고, 저장·삭제가 달력에 바로 반영됩니다.',
  ],
  '달력은 넓게, 필터와 그날 할 일은 한눈에 보이게 다시 배치했습니다.',
);
</script>
</body>
</html>
