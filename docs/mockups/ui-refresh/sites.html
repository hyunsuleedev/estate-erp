<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리단지 · UI 개선 데모</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="ui.css">
<style>
  [hidden] { display: none !important; }
  #split { position: relative; border-top: 1px solid var(--line-2); }
  /* 관리단지 목록 */
  .spanel { width: 218px; flex: none; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line-2); background: color-mix(in srgb, var(--soft) 45%, var(--paper)); }
  .spanel[hidden] { display: none; }
  .sp-top { padding: 10px 10px 6px; display: flex; flex-direction: column; gap: 8px; }
  .sp-top .field { width: 100%; }
  .sp-top .seg { align-self: flex-start; }
  .sp-list { flex: 1; overflow: auto; padding: 0 6px 8px; }
  .sp-sec { display: flex; align-items: center; gap: 6px; padding: 10px 8px 4px; font-size: 11px; font-weight: 600; color: var(--text-3); }
  .sp-sec .n { font-weight: 500; font-variant-numeric: tabular-nums; }
  .srow { position: relative; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 8px; border-radius: 7px; font-size: 13px; cursor: pointer; outline: 0; }
  .srow:hover { background: var(--hover); }
  .srow:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .srow.on { background: var(--press); font-weight: 600; }
  .srow > .i { width: 15px; height: 15px; color: var(--text-3); flex: none; }
  .srow .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow.idle:not(.on) .nm { color: var(--text-2); }
  .srow .fv { width: 11px; height: 11px; color: var(--text-3); flex: none; }
  .srow .wd { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 400; color: var(--text-3); }
  .srow .n { flex: none; padding-right: 6px; font-size: 12px; font-weight: 400; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .srow .acts { display: none; flex: none; }
  .srow .acts .ib { width: 24px; height: 24px; }
  .srow .acts .ib .i { width: 13px; height: 13px; }
  .srow .acts .ib.pinned { color: var(--accent-ink); }
  .srow:hover .n, .srow:focus-within .n { display: none; }
  .srow:hover .acts, .srow:focus-within .acts { display: flex; }
  .sp-foot { padding: 8px 10px 10px; border-top: 1px solid var(--line); }
  .sp-foot .btn { width: 100%; justify-content: center; }
  /* 본문 */
  .main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .main .vbar { height: 48px; align-items: center; padding-left: 14px; padding-right: 20px; gap: 8px; }
  .main .vbar .vtools { flex: none; align-items: center; }
  #viewSeg button { white-space: nowrap; }
  .stog { height: 30px; display: inline-flex; align-items: center; gap: 7px; padding: 0 9px; border: 0; border-radius: 8px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 2px rgba(16, 24, 40, 0.04); font: inherit; font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; white-space: nowrap; }
  .stog:hover { box-shadow: inset 0 0 0 1px var(--line-3); }
  .stog.on { background: var(--soft); }
  .stog .i { width: 15px; height: 15px; color: var(--text-2); }
  .stog .c { font-size: 12px; font-weight: 500; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .ssum { flex: 1; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .fbar { gap: 6px; padding: 10px 20px 10px 14px; flex-wrap: wrap; }
  .fsel {
    height: 30px; border: 0; border-radius: 8px; background: var(--paper);
    box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 2px rgba(16, 24, 40, 0.04);
    font: inherit; font-size: 13px; color: var(--text); letter-spacing: inherit;
    display: inline-flex; align-items: center; gap: 6px; padding: 0 8px 0 10px; cursor: pointer; white-space: nowrap;
    transition: box-shadow 0.12s, background-color 0.12s;
  }
  .fsel:hover { box-shadow: inset 0 0 0 1px var(--line-3), 0 1px 2px rgba(16, 24, 40, 0.04); }
  .fsel .k { color: var(--text-2); }
  .fsel .v { font-weight: 500; }
  .fsel > .i { width: 12px; height: 12px; color: var(--text-3); }
  .fsel.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
  .fsel.on .k { color: var(--accent-ink); opacity: 0.75; }
  .fsel.on .v { color: var(--accent-ink); }
  .fsel .clr { width: 16px; height: 16px; display: grid; place-items: center; border-radius: 4px; color: var(--accent-ink); }
  .fsel .clr:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .fsel .clr .i { width: 11px; height: 11px; }
  #fbar .cnt-t { margin-left: auto; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  #fbar .cnt-t + [data-clear] { margin-left: 0; }
  /* 호수 목록 */
  #tbl { --row: 34px; font-size: 13px; }
  #tbl th, #tbl td { padding-left: 6px; padding-right: 6px; }
  #tbl th .hi { margin-right: 4px; }
  #tbl th.selh, #tbl td.sel { padding-left: 14px !important; width: 34px; }
  #tbl tbody tr { cursor: pointer; }
  #tbl tr.cur td { background: var(--picked); }
  #tbl td.cons { width: 100%; max-width: 0; min-width: 118px; overflow: hidden; text-overflow: ellipsis; }
  #tbl td.cons b { font-weight: 500; font-size: 12px; }
  #tbl td.nm { font-weight: 600; }
  #tbl td .more { margin-left: 5px; padding: 1px 5px; border-radius: 4px; background: var(--soft); font-size: 11px; color: var(--text-2); }
  .gtog { width: 18px; height: 18px; padding: 0; margin-left: 6px; border: 0; border-radius: 4px; display: inline-grid; place-items: center; vertical-align: -4px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-3); color: var(--text-2); cursor: pointer; }
  .gtog:hover { box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent-ink); }
  #tbl th .gtog .i { width: 12px; height: 12px; margin: 0; vertical-align: 0; color: inherit; }
  #tbl th.gcol { background: var(--soft); }
  #tbl td.gcol { background: color-mix(in srgb, var(--soft) 55%, var(--paper)); }
  #tbl tbody tr:hover td.gcol { background: var(--soft); }
  #selbar { bottom: 56px; }
  /* 배치표 · 점유상태 */
  .board { padding: 14px 20px 72px 14px; }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 14px; font-size: 12px; color: var(--text-2); }
  .legend .lg { height: 26px; display: inline-flex; align-items: center; gap: 6px; padding: 0 9px; border: 0; border-radius: 7px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2); font: inherit; font-size: 12px; color: var(--text); }
  .legend button.lg { cursor: pointer; }
  .legend button.lg:hover { box-shadow: inset 0 0 0 1px var(--line-3); }
  .legend button.lg.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); font-weight: 500; }
  .legend button.lg.dim { opacity: 0.5; }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--line-3); }
  .legend .lg b { font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .bsec + .bsec { margin-top: 22px; }
  .bsec h3 { margin: 0 0 8px; display: flex; align-items: baseline; gap: 8px; font-size: 14px; font-weight: 600; }
  .bsec h3 span { font-size: 12px; font-weight: 400; color: var(--text-3); }
  .bgrid { display: grid; gap: 3px; width: max-content; max-width: 100%; }
  .bgrid .hd, .bgrid .fl { display: grid; place-items: center; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .bgrid .fl { width: 40px; border-radius: 5px; background: var(--soft); color: var(--text-2); }
  .ucell { width: 84px; height: 38px; padding: 0; border: 0; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2); font: inherit; color: var(--text); cursor: pointer; transition: box-shadow 0.1s, opacity 0.1s; }
  .ucell b { font-size: 13px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .ucell small { font-size: 11px; line-height: 1.1; color: var(--text-2); }
  .ucell:hover { box-shadow: inset 0 0 0 1px var(--text-3); }
  .ucell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .ucell.cur { box-shadow: inset 0 0 0 2px var(--accent); }
  .ucell.dim { opacity: 0.25; }
  .ucell.c-listing, .sw.c-listing { background: var(--tg-purple-bg); }
  .ucell.c-consult, .sw.c-consult { background: var(--tg-blue-bg); }
  .ucell.o-owner, .sw.o-owner { background: var(--tg-green-bg); }
  .ucell.o-jeonse, .sw.o-jeonse { background: var(--tg-blue-bg); }
  .ucell.o-monthly, .sw.o-monthly { background: var(--tg-yellow-bg); }
  .ucell.c-listing small { color: var(--tg-purple); } .ucell.c-consult small, .ucell.o-jeonse small { color: var(--tg-blue); }
  .ucell.o-owner small { color: var(--tg-green); } .ucell.o-monthly small { color: var(--tg-yellow); }
  .ucell.pil { cursor: default; color: var(--text-3); font-size: 11px; box-shadow: inset 0 0 0 1px var(--line); background: repeating-linear-gradient(135deg, var(--soft) 0 5px, var(--paper) 5px 10px); }
  .ucell.none { box-shadow: none; background: transparent; cursor: default; }
  /* 만기/변동 */
  .xsec { padding: 14px 20px 0 14px; }
  .xsec:last-child { padding-bottom: 72px; }
  .xsec h3 { margin: 0; display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; }
  .xsec h3 .i { width: 15px; height: 15px; color: var(--text-3); }
  .xsec h3 .n { font-size: 12px; font-weight: 500; color: var(--text-3); }
  .xsec > p { margin: 3px 0 8px; font-size: 12px; color: var(--text-3); }
  .erow { display: grid; grid-template-columns: 96px 84px 150px 70px minmax(0, 1fr) 132px 58px; align-items: center; gap: 10px; height: 36px; padding: 0 8px; border-bottom: 1px solid var(--line); font-size: 13px; cursor: pointer; border-radius: 0; background: transparent; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; font-family: inherit; color: var(--text); }
  .erow:hover { background: var(--row-hover); }
  .erow.hd { height: 30px; font-size: 12px; color: var(--text-2); cursor: default; border-bottom-color: var(--line-2); }
  .erow.hd:hover { background: transparent; }
  .dd { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .soon { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--text-2); }
  /* 호실 상세: 본문 위로 뜨는 옆 패널 */
  #peek { position: absolute; right: 0; top: 0; bottom: 0; z-index: 8; width: 468px; box-shadow: -18px 0 36px -22px rgba(16, 24, 40, 0.28); }
  #peek .peek-body { padding: 0 24px 80px; }
  #peek h2 { font-size: 22px; display: flex; align-items: center; gap: 8px; }
  .pacts { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 8px; }
  .pstat { font-size: 12px; color: var(--text-3); margin-bottom: 12px; }
  .ptabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line-2); margin: 0 -24px; padding: 0 20px; position: sticky; top: 0; background: var(--paper); z-index: 2; }
  .ptab { position: relative; height: 36px; padding: 0 9px; border: 0; background: transparent; font: inherit; font-size: 13px; color: var(--text-2); cursor: pointer; }
  .ptab:hover { color: var(--text); }
  .ptab.on { color: var(--text); font-weight: 600; }
  .ptab.on::after { content: ""; position: absolute; left: 9px; right: 9px; bottom: -1px; height: 2px; border-radius: 1px; background: var(--tabline); }
  .ptab .n { margin-left: 4px; font-size: 12px; font-weight: 400; color: var(--text-3); }
  .prow { display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .prow .g { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow .sub { font-size: 12px; color: var(--text-2); }
  .none-t { padding: 14px 0; font-size: 13px; color: var(--text-3); }
  .cmp { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line-2); }
  .cmp textarea { width: 100%; height: 56px; border: 0; outline: 0; resize: none; background: transparent; font: inherit; font-size: 13px; line-height: 1.5; color: var(--text); }
  .cmp .r { display: flex; align-items: center; gap: 6px; }
  .cmp select { height: 28px; border: 0; border-radius: 7px; padding: 0 6px; background: var(--soft); font: inherit; font-size: 12px; color: var(--text); }
  .cmp .sp { flex: 1; }
  /* 창 */
  .dlg-back { position: fixed; inset: 0; z-index: 240; background: rgba(16, 24, 40, 0.28); display: grid; place-items: center; animation: fade 0.12s; }
  .dlg { width: min(var(--w, 440px), calc(100vw - 32px)); max-height: calc(100vh - 64px); display: flex; flex-direction: column; border-radius: 14px; background: var(--paper); box-shadow: 0 24px 64px rgba(16, 24, 40, 0.3); }
  .dlg h3 { margin: 0; padding: 18px 20px 6px; font-size: 16px; font-weight: 600; }
  .dlg .ddesc { margin: 0; padding: 0 20px; font-size: 13px; color: var(--text-2); line-height: 1.6; }
  .dlg .db { padding: 14px 20px 2px; overflow: auto; }
  .dlg .df { display: flex; justify-content: flex-end; gap: 6px; padding: 16px 20px 18px; }
  .frm { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
  .frm label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-2); }
  .frm .w2 { grid-column: 1 / -1; }
  .inp { height: 32px; border: 0; border-radius: 8px; padding: 0 10px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2); font: inherit; font-size: 13px; color: var(--text); outline: 0; min-width: 0; }
  .inp:focus { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .inp.bad { box-shadow: inset 0 0 0 1px var(--danger); }
  .cand { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 6px; border-radius: 8px; font-size: 13px; }
  .cand:hover { background: var(--hover); }
  .cand .g { flex: 1; min-width: 0; }
  .cand .sub { font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>

  <div class="ph">
    <h1>관리단지</h1>

      </div>

    <div class="main">

        <button class="stog" id="stog"></button>
        <span class="ssum" id="ssum"></span>

          <label class="field" data-icon="search" style="width:212px"><input id="q" placeholder="호수 · 이름 · 전화 · 상담 (/)" aria-label="호수, 이름, 전화번호, 상담 내용 검색"></label>
          <span class="vsep"></span>
          <div class="seg" id="viewSeg" aria-label="단지 보기 방식"><button data-view="table" data-icon="list">호수 목록</button><button data-view="layout" data-icon="table">배치표</button><button data-view="occupancy" data-icon="home">점유상태</button><button data-view="expiry" data-icon="cal">만기/변동</button></div>
        </div>

      <div class="fbar show" id="fbar"></div>
      <div class="scroll" id="scroll"></div>

  <div class="selbar" id="selbar"><span class="cnt" id="selCnt"></span><span class="sep"></span><button id="selClear" aria-label="선택 해제"></button></div>
</main>

<script>
const { icon, won } = UI;
const TODAY = new Date(2026, 10, 11);
const SITE_TYPE = { apartment: '아파트', officetel: '오피스텔', villa: '빌라', house: '단독/다가구', commercial: '상가', land: '토지' };
const TYPE_ICON = { apartment: 'building', officetel: 'table', villa: 'home', house: 'home', commercial: 'tag', land: 'map' };
const KIND = { sale: '매매', jeonse: '전세', monthly: '월세' };
const CTYPE = { phone: '전화', visit: '방문', online: '온라인' };
const TSTATUS = { residing: '거주중', moving_out: '퇴거예정', moved: '퇴거' };
const OCC = { owner: '자가', jeonse: '전세', monthly: '월세', unknown: '미확인' };
// 평형 타입: [전용㎡, 공급㎡, 방, 욕실]
const UT = { '84A': [84.97, 112.4, 3, 2], '84B': [84.94, 113.1, 3, 2], '84C': [84.92, 113.6, 3, 2], '59A': [59.78, 81.2, 3, 2], '59B': [59.91, 82.0, 3, 1], '99A': [99.86, 131.8, 4, 2], '29A': [29.52, 41.3, 1, 1], '39B': [39.8, 55.1, 2, 1] };

const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const man = (v) => (v == null ? '' : v % 10000 ? `${won(v)}만` : won(v));
const py = (m2) => `${(m2 * 0.3025).toFixed(1)}평`;
const toDate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const ymd = (s) => s.slice(2).replace(/-/g, '.');
const dday = (s) => Math.round((toDate(s) - TODAY) / 86400000);
const ddayLabel = (s) => { const n = dday(s); return n === 0 ? 'D-DAY' : n > 0 ? `D-${n}` : `D+${-n}`; };
const ddayCls = (s) => { const n = dday(s); return n <= 30 ? 'danger-t' : n <= 90 ? 'warn-t' : 't2'; };
const digits = (s) => String(s).replace(/\D/g, '');

// ── 단지 ──
const SITES = [
  { id: 'g', name: '고덕그라시움', type: 'apartment', ward: '고덕동', addr: '서울 강동구 고덕로 333', built: 2019, dongCount: 53, unitCount: 4932, fav: true, cfg: { dongs: ['101', '102', '103'], floors: 12, lines: 4, types: ['84A', '84B', '59A', '59B'], piloti: ['101:1:1', '101:1:2'] } },
  { id: 'a', name: '고덕아르테온', type: 'apartment', ward: '상일동', addr: '서울 강동구 고덕로 360', built: 2020, dongCount: 41, unitCount: 4066, fav: true, cfg: { dongs: ['301', '305'], floors: 10, lines: 4, types: ['84A', '84A', '59A', '59A'] } },
  { id: 'r', name: '래미안힐스테이트고덕', type: 'apartment', ward: '고덕동', addr: '서울 강동구 아리수로 420', built: 2016, dongCount: 51, unitCount: 3658, fav: false, cfg: { dongs: ['105', '112'], floors: 8, lines: 3, types: ['84C', '84B', '59A'] } },

      rows = [...rows].sort((x, y) => { const a = f(s, x), b = f(s, y); const ea = a === '' || a === -1, eb = b === '' || b === -1; if (ea !== eb) return ea ? 1 : -1; return (typeof a === 'number' ? a - b : String(a).localeCompare(String(b), 'ko', { numeric: true })) * dir; });
    }
    const vis = new Set(rows.map((u) => u.id));
    for (const id of [...state.picked]) if (!vis.has(id)) state.picked.delete(id);
    state.rows = rows.map((u) => u.id);
    scroll.innerHTML = tableHtml(s, rows);
  } else {
    state.picked.clear();
    scroll.innerHTML = state.view === 'expiry' ? expiryHtml(s, ok) : boardHtml(s, okIds);
  }

  document.getElementById('selCnt').textContent = `${state.picked.size}개 호실 선택`;
  const u = curUnit();

    if (state.keepScroll) peek.querySelector('.peek-body').scrollTop = top;
    state.keepScroll = false;
  }
}

function dlg({ title, desc = '', body = '', okLabel = '확인', cancelLabel = '취소', width = 440, ok, noOk }) {
  const back = document.createElement('div');
  back.className = 'dlg-back';
  back.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" style="--w:${width}px"><h3>${title}</h3>${desc ? `<p class="ddesc">${desc}</p>` : ''}${body ? `<div class="db">${body}</div>` : ''}<div class="df"><button class="btn" data-x>${cancelLabel}</button>${noOk ? '' : `<button class="btn primary" data-ok>${okLabel}</button>`}</div></div>`;
  document.body.append(back);
  const close = () => back.remove();
  const submit = () => {
    const v = {};
    back.querySelectorAll('[data-f]').forEach((el) => { v[el.dataset.f] = el.value.trim(); el.classList.remove('bad'); });
    const bad = ok ? ok(v) : null;
    if (bad) { const el = back.querySelector(`[data-f="${bad}"]`); if (el) { el.classList.add('bad'); el.focus(); } return; }
    close();
  };
  back.addEventListener('mousedown', (e) => { if (e.target === back) close(); });
  back.addEventListener('click', (e) => { if (e.target.closest('[data-x]')) close(); else if (e.target.closest('[data-ok]')) submit(); });
  back.addEventListener('keydown', (e) => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Escape') { e.stopPropagation(); close(); } else if (e.key === 'Enter' && e.target.matches('input[data-f]')) { e.preventDefault(); submit(); }
  });
  (back.querySelector('input') || back.querySelector('[data-ok]') || back.querySelector('[data-x]')).focus();
  return back;
}
