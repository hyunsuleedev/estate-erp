<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고객 원장 · UI 개선 데모</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="ui.css">
<style>
  /* 필터 줄: 늘 보이는 선택 상자 (properties.html과 같은 부품) */
  .fbar { gap: 6px; padding: 10px var(--gutter) 10px; flex-wrap: wrap; }
  .fsel {
    height: 30px; border: 0; border-radius: 8px; background: var(--paper);
    box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 2px rgba(16, 24, 40, 0.04);
    font: inherit; font-size: 13px; color: var(--text); letter-spacing: inherit;
    display: inline-flex; align-items: center; gap: 6px; padding: 0 8px 0 10px; cursor: pointer; white-space: nowrap;
    transition: box-shadow 0.12s, background-color 0.12s;
  }
  .fsel:hover { box-shadow: inset 0 0 0 1px var(--line-3), 0 1px 2px rgba(16, 24, 40, 0.04); }
  .fsel .k { color: var(--text-2); }
  .fsel .v { font-weight: 500; }
  .fsel > .i { width: 12px; height: 12px; color: var(--text-3); }
  .fsel.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
  .fsel.on .k { color: var(--accent-ink); opacity: 0.75; }
  .fsel.on .v { color: var(--accent-ink); }
  .fsel .clr { width: 16px; height: 16px; display: grid; place-items: center; border-radius: 4px; color: var(--accent-ink); }
  .fsel .clr:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .fsel .clr .i { width: 11px; height: 11px; }
  #fbar [data-clear] { margin-left: auto; }

  /* 원장 표: 고객(케이스)마다 tbody 하나. 왼쪽 다섯 칸은 가로로 밀어도 남는다 */
  #scroll { display: flex; flex-direction: column; }
  #foot { margin-top: auto; flex: none; left: 0; }
  #tbl { flex: none; --exp: 24px; font-size: 13px; width: 100%; }
  #tbl.h-consult { --exp: 0px; }
  #tbl th, #tbl td { padding: 0 7px; }
  #tbl th .hi { margin-right: 4px; }
  #tbl th:last-child .rz { display: none; }
  #tbl th.ganchor { padding-right: 14px; }
  #tbl td { height: 36px; border-bottom-color: var(--line); background: var(--paper); }
  #tbl tbody.case > tr:last-child > td, #tbl td.span { border-bottom-color: var(--line-2); }
  #tbl tbody.case:hover > tr > td { background: var(--row-hover); }
  #tbl tbody.case.picked > tr > td { background: var(--picked); }
  #tbl tbody.muted td { color: var(--text-3); }
  #tbl tbody.case.picked td.sel { box-shadow: inset 2px 0 0 var(--accent); }
  #tbl .pin { position: sticky; z-index: 2; }
  #tbl th.pin { z-index: 5; }
  #tbl .p-sel { left: 0; width: 36px; min-width: 36px; max-width: 36px; padding: 0 0 0 14px !important; }
  #tbl .p-exp { left: 36px; width: 24px; min-width: 24px; max-width: 24px; padding: 0 !important; text-align: center; border-right: 0; }
  #tbl .p-cust { left: calc(36px + var(--exp)); width: 88px; min-width: 88px; max-width: 88px; }
  #tbl .p-phone { left: calc(124px + var(--exp)); width: 108px; min-width: 108px; max-width: 108px; }
  #tbl .p-act { left: calc(232px + var(--exp)); width: 28px; min-width: 28px; max-width: 28px; padding: 0 !important; text-align: center; box-shadow: 1px 0 0 var(--line-2); border-right: 0; }
  #tbl td.span { vertical-align: top; }
  #tbl td.span > .in { height: 36px; display: flex; align-items: center; gap: 4px; min-width: 0; }
  #tbl td.p-exp > .in, #tbl td.p-act > .in { justify-content: center; }
  #tbl td.p-cust .nm { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; border-radius: 5px; padding: 2px 4px; margin: 0 -4px; cursor: text; }
  #tbl td.p-cust .nm:hover { background: var(--hover); }
  #tbl td.p-cust .plus { font-size: 11px; color: var(--text-3); flex: none; }
  #tbl .xb { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: var(--text-3); display: inline-grid; place-items: center; cursor: pointer; }
  #tbl .xb:hover { background: var(--hover); color: var(--text); }
  #tbl .xb .i { width: 14px; height: 14px; transition: transform 0.15s; }
  #tbl .xb.shut .i { transform: rotate(-90deg); }
  #tbl td.p-act .ib { width: 24px; height: 24px; opacity: 0.55; }
  #tbl tbody.case:hover td.p-act .ib, #tbl td.p-act .ib:focus-visible { opacity: 1; }
  #tbl th.c-memo, #tbl td.c-memo { width: 100%; min-width: 130px; max-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #tbl td.c-memo { color: var(--text-2); }
  #tbl td.c-intake { max-width: 176px; }
  .ik { display: flex; align-items: center; min-width: 0; }
  .ik .tr-link { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .ik .urg { flex: none; }
  /* 오른쪽으로 더 있다는 표시 */
  #split { position: relative; }
  .cue { position: absolute; top: 0; bottom: 50px; width: 28px; pointer-events: none; opacity: 0; transition: opacity 0.15s; background: linear-gradient(to right, transparent, color-mix(in srgb, var(--text) 9%, transparent)); z-index: 6; }
  .cue.show { opacity: 1; }
  #tbl td.c-created { color: var(--text-2); }
  #tbl th.r { text-align: right; }
  .urg { margin-left: 6px; font-size: 11px; font-weight: 600; color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); padding: 1px 5px; border-radius: 4px; }
  .kd { font-size: 12px; font-weight: 500; color: var(--text-2); border: 0; background: transparent; padding: 2px 5px; margin: 0 -5px; border-radius: 5px; font-family: inherit; }
  button.kd { cursor: pointer; }
  button.kd:hover { background: var(--hover); color: var(--text); }
  .kd.out { color: var(--tg-purple, var(--text-2)); }
  button.tag { border: 0; font-family: inherit; letter-spacing: inherit; cursor: pointer; transition: filter 0.1s; }
  button.tag:hover { filter: brightness(0.96) saturate(1.2); }
  /* 그 자리에서 고치는 칸 */
  .ed { display: inline-block; min-width: 22px; border-radius: 5px; padding: 2px 5px; margin: 0 -5px; cursor: text; }
  td.r .ed { text-align: right; }
  .ed:hover { background: var(--hover); }
  .ed.pickm { cursor: pointer; }
  .ed .add { display: none; color: var(--text-3); font-size: 12px; }
  .ed.none .dash { color: var(--text-3); }
  .ed.none:hover .dash, td:focus-within .ed.none .dash { display: none; }
  .ed.none:hover .add, td:focus-within .ed.none .add { display: inline; }
  .ed.off { cursor: default; color: var(--text-3); }
  .ed.off:hover { background: transparent; }
  .cin {
    width: 100%; min-width: 64px; height: 26px; border: 0; outline: 0; border-radius: 6px; padding: 0 6px; margin: 0 -6px;
    font: inherit; font-size: 13px; color: var(--text); background: var(--paper);
    box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
  }
  td.r .cin { text-align: right; }
  td.p-cust .cin { margin: 0; min-width: 0; }
  .nx { display: inline-flex; align-items: center; height: 21px; padding: 0 6px; border-radius: 4px; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; background: color-mix(in srgb, var(--text) 6%, transparent); color: var(--text-2); }
  .nx.today { background: color-mix(in srgb, var(--dot-warn) 20%, transparent); color: var(--warn); }
  .nx.late { background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--danger); }
  /* 한 매물 의뢰에 거래 조건이 여럿: 칸 안에 한 줄씩 */
  .stk { display: flex; flex-direction: column; padding: 4px 0; }
  .stk > div { height: 26px; display: flex; align-items: center; }
  td.r .stk > div { justify-content: flex-end; }
  .paused { margin-left: 5px; font-size: 11px; color: var(--text-3); }
  /* 최근 상담 줄 */
  #tbl tr.cons > td { height: 28px; padding: 0 9px 0 9px; background: color-mix(in srgb, var(--soft) 55%, var(--paper)); white-space: nowrap; }
  #tbl tbody.case:hover tr.cons > td { background: var(--soft); }
  .cline { position: sticky; left: calc(267px + var(--exp)); display: flex; align-items: center; gap: 7px; max-width: calc(var(--sw, 1100px) - 300px); font-size: 12px; color: var(--text-2); cursor: pointer; }
  .cline .i { width: 12px; height: 12px; color: var(--text-3); }
  .cline .d { color: var(--text-3); font-variant-numeric: tabular-nums; flex: none; }
  .cline .tx { overflow: hidden; text-overflow: ellipsis; }
  .cline:hover .tx { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--text-3); }
  .cline .ai { color: var(--accent-ink); display: inline-flex; align-items: center; gap: 3px; flex: none; }
  /* 매칭 펼침 버튼과 패널 */
  .ptog {
    height: 24px; display: inline-flex; align-items: center; gap: 4px; padding: 0 5px 0 7px;
    border: 0; border-radius: 6px; background: var(--paper);
    box-shadow: inset 0 0 0 1px var(--line-2); color: var(--text-2);
    font: inherit; font-size: 12px; cursor: pointer; transition: box-shadow 0.12s, background-color 0.12s, color 0.12s;
  }
  .ptog .i { width: 13px; height: 13px; }
  .ptog b { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .ptog .pc { width: 11px; height: 11px; color: var(--text-3); transition: transform 0.16s; }
  .ptog:hover { box-shadow: inset 0 0 0 1px var(--line-3); background: var(--soft); }
  .ptog.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent-ink); }
  .ptog.on b { color: var(--accent-ink); }
  .ptog.on .pc { transform: rotate(180deg); color: var(--accent-ink); }
  #tbl tr.exp > td { padding: 0 !important; height: auto; background: color-mix(in srgb, var(--accent) 4%, var(--paper)) !important; border-right: 0; white-space: normal; }
  .exp-in { position: sticky; left: 0; width: calc(var(--sw, 1100px) - 14px); max-width: 1120px; padding: 8px 24px 16px 46px; }
  .xcard { border-radius: 12px; background: var(--paper); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 22%, var(--line-2)), 0 14px 32px -14px rgba(16, 24, 40, 0.22), 0 2px 6px rgba(16, 24, 40, 0.04); animation: xin 0.24s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .xcard.still { animation: none; }
  @keyframes xin { from { opacity: 0; transform: translateY(-6px); } }
  .xhead { display: flex; align-items: center; gap: 14px; height: 42px; padding: 0 10px 0 16px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--text-2); }
  .xhead .ttl { font-size: 13px; font-weight: 600; color: var(--text); display: inline-flex; align-items: center; gap: 7px; }
  .xhead .ttl .i { width: 14px; height: 14px; color: var(--accent-ink); }
  .xhead b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; margin-left: 2px; }
  .xhead .sp { flex: 1; }
  .mlist { max-height: 280px; overflow: auto; }
  .mrow { display: grid; grid-template-columns: minmax(200px, 1.3fr) minmax(110px, 0.6fr) 236px minmax(140px, 1.2fr) auto; align-items: center; gap: 14px; min-height: 48px; padding: 5px 10px 5px 16px; border-bottom: 1px solid var(--line); font-size: 13px; transition: background-color 0.1s; }
  .mrow:last-child { border-bottom: 0; }
  .mrow:hover, .mrow:focus-within { background: var(--row-hover); }
  .mrow.closed .mc { opacity: 0.5; }
  .mc { min-width: 0; }
  .mc .l1 { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
  .mc .l1 .nm { font-weight: 600; cursor: pointer; overflow: hidden; text-overflow: ellipsis; }
  .mc .l2 { display: flex; align-items: center; gap: 5px; margin-top: 1px; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 18px; }
  .mc .l2 .i { width: 12px; height: 12px; color: var(--text-3); }
  .mmemo { display: block; min-width: 60px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; outline: 0; border-radius: 5px; padding: 2px 5px; margin: 0 -5px; cursor: text; }
  .mmemo:hover { background: var(--hover); }
  .mmemo:focus { background: var(--paper); box-shadow: 0 0 0 1.5px var(--accent); text-overflow: clip; }
  .mmemo:empty::before { content: attr(data-ph); color: var(--text-3); }
  .mact { display: flex; align-items: center; gap: 2px; }
  .mact .btn { opacity: 0; transition: opacity 0.12s, background-color 0.12s; }
  .mrow:hover .mact .btn, .mrow:focus-within .mact .btn, .mrow.closed .mact .btn { opacity: 1; }
  .trk { display: flex; align-items: center; }
  .nd { position: relative; width: 22px; height: 22px; padding: 0; border: 0; background: transparent; cursor: pointer; flex: none; }
  .nd::after { content: ""; position: absolute; left: 6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--line-3); transition: transform 0.12s, box-shadow 0.12s, background-color 0.12s; }
  .nd::before { content: ""; position: absolute; right: 16px; top: 10px; width: 12px; height: 2px; background: var(--line-2); }
  .nd:first-child::before { display: none; }
  .nd.done::after, .nd.cur::after { background: var(--accent); box-shadow: none; }
  .nd.done::before, .nd.cur::before { background: var(--accent); }
  .nd.cur::after { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .nd:hover::after { transform: scale(1.35); }
  .nd:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 50%; }
  .trk .lbl { margin-left: 8px; font-size: 12px; font-weight: 600; color: var(--accent-ink); white-space: nowrap; }
  /* 월세 열 묶음 접기 상자 */
  #tbl th.ganchor { z-index: 4; overflow: visible; }
  .gbox {
    position: absolute; right: -9px; top: 8px; z-index: 7;
    width: 17px; height: 17px; padding: 0; display: grid; place-items: center;
    border: 0; border-radius: 4px; background: var(--paper);
    box-shadow: inset 0 0 0 1px var(--text-3), 0 1px 2px rgba(16, 24, 40, 0.08);
    color: var(--text-2); cursor: pointer; transition: box-shadow 0.12s, color 0.12s;
  }
  .gbox svg { width: 11px; height: 11px; stroke-width: 2.4; }
  .gbox:hover { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent-ink); }
  #tbl th.gcol { background: var(--soft); box-shadow: inset 0 2px 0 var(--text-3); }
  #tbl td.gcol { background: color-mix(in srgb, var(--soft) 55%, var(--paper)); }
  /* 묶음 머리 줄 */
  #tbl tr.grp > td { height: 34px; background: var(--paper); border-bottom: 1px solid var(--line-2); font-weight: 600; padding: 0 !important; }
  #tbl tr.grp .gh { position: sticky; left: 0; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; height: 34px; }
  #tbl tr.grp .gh .i { width: 14px; height: 14px; color: var(--text-3); transition: transform 0.15s; }
  #tbl tr.grp.shut .gh .i { transform: rotate(-90deg); }
  #tbl tr.grp .n { font-weight: 500; color: var(--text-3); }
  /* 옆 상세 */
  .peek { width: 440px; }
  .peek .mini .price { font-variant-numeric: tabular-nums; }
  .peek .ai { color: var(--accent-ink); display: inline-flex; align-items: center; gap: 3px; }
  .peek .ai .i { width: 13px; height: 13px; }
  .composer input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: var(--text); }
  .composer input::placeholder { color: var(--text-3); }
  .composer:focus-within { box-shadow: 0 0 0 1.5px var(--accent), 0 8px 24px rgba(40, 35, 25, 0.08); }
  .sumbar .lk { text-decoration: underline; text-underline-offset: 3px; cursor: pointer; background: none; border: 0; padding: 0; color: inherit; font-size: 12px; }
</style>
</head>
<body data-active="customers">
<main id="page">
  <div class="ph">
    <h1>고객 원장</h1>
    <span class="count" id="total"></span>
    <div class="meta">
      <span class="lnk" data-jump="지난 일정"><span class="dot danger"></span>놓친 연락 <b id="missedN"></b></span>
      <span class="lnk" data-jump="오늘"><span class="dot warn"></span>오늘 연락 <b id="todayN"></b></span>
    </div>
    <div class="actions">
      <button class="btn primary" id="newBtn"></button>
    </div>
  </div>

  <div class="vbar">
    <div class="vtab on" data-mode="all">전체 <span class="n"></span></div>
    <div class="vtab" data-mode="demand">구함 <span class="n"></span></div>
    <div class="vtab" data-mode="listing">내놓음 <span class="n"></span></div>
    <div class="vtools">
      <label class="field" data-icon="search"><input id="q" placeholder="고객, 전화번호, 지역, 매물" aria-label="고객 원장 검색"><kbd>⌘F</kbd></label>
      <button class="btn quiet sm" id="sortBtn"></button>
      <button class="btn quiet sm" id="groupBtn"></button>
      <button class="btn quiet sm" id="colBtn"></button>
      <span class="vsep"></span>
      <div class="seg" aria-label="고객 원장 보기 방식"><button class="on" data-icon="table">표</button><button data-icon="users" id="caseView">고객 중심</button></div>
    </div>
  </div>

  <div class="fbar show" id="fbar"></div>

  <div class="split" id="split">
    <div class="scroll" id="scroll">
      <table class="tbl" id="tbl" aria-label="고객 중개 케이스 원장"><thead id="thead"></thead></table>
      <div class="sumbar" id="foot"></div>
    </div>
    <span class="cue" id="cue" aria-hidden="true"></span>
    <aside class="peek" id="peek" hidden></aside>
  </div>
</main>

<script src="shell.js"></script>
<script>
const { icon, av, who, won } = UI;
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const man = (v) => (v % 10000 ? `${won(v)}만` : won(v));

// 오늘은 2026년 11월 11일 (수). 날짜는 오늘에서 며칠 떨어졌는지로 둔다
const TODAY = new Date(2026, 10, 11);
const dayOf = (n) => { const d = new Date(TODAY); d.setDate(d.getDate() + n); return d; };
const p2 = (n) => String(n).padStart(2, '0');
const md = (n) => { const d = dayOf(n); return `${d.getMonth() + 1}.${p2(d.getDate())}`; };
const ymd = (n) => { const d = dayOf(n); return `${String(d.getFullYear()).slice(2)}.${p2(d.getMonth() + 1)}.${p2(d.getDate())}`; };
const dday = (n) => (n === 0 ? '오늘' : n > 0 ? `D-${n}` : `D+${-n}`);

const TX = { sale: '매매', jeonse: '전세', monthly: '월세' };
const LIFE = { open: ['ok', '진행중'], hold: ['hold', '보류'], closed: ['done', '종료'] };
const STAFF = ['이현수', '박서연', '최민준', '정다은'];
const URG = { urgent: '급함', normal: '보통', flexible: '여유' };

let seq = 0;
// 구함: 거래, 희망 지역, 희망 단지, 최소·최대 예산(만원), 최소·최대 평형, 담당, 다음 연락(일 뒤), 메모, 그 밖
const D = (tx, regions, sites, bMin, bMax, aMin, aMax, agent, next, memo, o = {}) => ({
  kind: 'demand', rid: ++seq, tx, regions, sites, bMin, bMax, aMin, aMax, agent, next, memo,
  rMin: o.rMin ?? null, rMax: o.rMax ?? null, urgency: o.urgency || 'normal', match: o.match || 0, moveIn: o.moveIn ?? null,
});
// 내놓음: 매물, 평형, 거래 조건 줄 [거래, 가격·보증금, 월세, 중단, 매칭], 메모
const L = (label, area, lines, memo, status = 'open') => ({
  kind: 'listing', gid: ++seq, label, area, memo, status,
  lines: lines.map(([tx, price, rent, paused, match]) => ({ tx, price, rent: rent || null, paused: !!paused, match: match || 0 })),
});

// 다음 연락으로 묶을 때: 케이스에서 가장 이른 일정
const nextOf = (c) => { const v = c.demands.map((d) => d.next).filter((n) => n != null); return v.length ? Math.min(...v) : null; };
const GROUPS = {
  next: [['late', '놓친 연락', (c) => nextOf(c) != null && nextOf(c) < 0], ['today', '오늘', (c) => nextOf(c) === 0], ['week', '이번 주', (c) => nextOf(c) > 0 && nextOf(c) <= 4], ['later', '다음 주 이후', (c) => nextOf(c) > 4], ['none', '다음 연락 없음', (c) => nextOf(c) == null]],
  agent: [...STAFF.map((s) => [s, s, (c) => (c.demands[0] || {}).agent === s]), ['-', '미배정', (c) => !(c.demands[0] || {}).agent]],
};

// ── 칸 ──
const edAttr = (o, f) => `data-ed="${f}" data-o="${o}"`;
const editing = (o, f) => state.edit && state.edit.o === o && state.edit.f === f;
const cin = (v, ph) => `<input class="cin" data-cin value="${esc(v ?? '')}" placeholder="${ph}" aria-label="${ph}">`;
function numCell(o, f, v, unit, extra = '') {
  if (editing(o, f)) return cin(v, unit === '평' ? '평' : '만원');
  const txt = v == null ? '<span class="dash">-</span><span class="add">+ 입력</span>' : unit === '평' ? `${v}평` : unit === 'rent' ? `${v.toLocaleString('ko-KR')}만` : man(v);
  return `<span class="ed ${v == null ? 'none' : ''}" ${edAttr(o, f)} tabindex="0" role="button">${txt}${extra}</span>`;
}
function memoCell(o, v) {
  if (editing(o, 'memo')) return cin(v, '의뢰 메모');
  return `<span class="ed ${v ? '' : 'none'}" ${edAttr(o, 'memo')} tabindex="0" role="button" title="${esc(v)}">${v ? esc(v) : '<span class="dash">-</span><span class="add">+ 노트</span>'}</span>`;
}
function nextPill(n) {
  if (n == null) return '<span class="dash">-</span><span class="add">+ 일정</span>';
  if (n === 0) return '<span class="nx today">오늘</span>';
  return `<span class="nx ${n < 0 ? 'late' : ''}">${md(n)} ${dday(n)}</span>`;
}
const ptog = (key, n, label, ic) => {
  if (!n) return '';
  const on = state.openMatch.has(key);
  return `<button class="ptog ${on ? 'on' : ''}" data-ptog="${key}" aria-expanded="${on}" aria-label="${n}건의 ${label} ${on ? '접기' : '펼치기'}" title="${label} ${on ? '접기' : '펼치기'}">${icon(ic)}<b>${n}</b>${icon('chevDown', 'pc')}</button>`;
};
const placeLabel = (d) => [d.regions.join('·'), d.sites.join('·')].filter(Boolean).join(' · ') || '선호 지역 미등록';

function demandCell(k, c, d) {
  const o = `d:${d.rid}`;
  const monthly = d.tx === 'monthly';
  const withRent = (f) => (!state.rent && monthly ? `<span class="t3"> / </span>${d[f] == null ? '-' : d[f]}` : '');
  switch (k) {
    case 'kind': return c.demands.length > 1 ? `<td><button class="kd" ${edAttr(o, 'rank')} title="우선순위 바꾸기">구함 ${d.rank}</button></td>` : `<td><span class="kd">구함 ${d.rank}</span></td>`;
    case 'tx': return `<td><button class="tag ${d.tx}" ${edAttr(o, 'tx')} aria-label="거래유형 편집">${TX[d.tx]}</button></td>`;
    case 'intake': return `<td class="c-intake" title="${esc(placeLabel(d))}"><div class="ik"><a class="tr-link" data-peek="${d.rid}" tabindex="0" role="button" aria-label="${esc(placeLabel(d))} 구함 상세 열기">${d.regions.length ? esc(d.regions.join('·')) : d.sites.length ? '' : '선호 지역 미등록'}${d.regions.length && d.sites.length ? '<span class="t3" style="font-weight:400"> · </span>' : ''}${esc(d.sites.join('·'))}</a>${d.urgency === 'urgent' ? '<span class="urg">급함</span>' : ''}</div></td>`;
    case 'status': return `<td><button class="st ${LIFE[c.status][0]}" data-ed="status" data-o="c:${c.id}" aria-label="구함 진행 상태 편집">${LIFE[c.status][1]}${icon('chevDown', 'stc')}</button></td>`;
    case 'bMin': return `<td class="r num">${numCell(o, 'bMin', d.bMin, 'won', d.bMin != null ? withRent('rMin') : '')}</td>`;
    case 'bMax': return `<td class="r num ${state.rent ? '' : 'ganchor'}">${numCell(o, 'bMax', d.bMax, 'won', d.bMax != null ? withRent('rMax') : '')}</td>`;
    case 'rMin': case 'rMax': return `<td class="r num gcol">${monthly ? numCell(o, k, d[k], 'rent') : '<span class="ed off">-</span>'}</td>`;
    case 'aMin': case 'aMax': return `<td class="r num">${numCell(o, k, d[k], '평')}</td>`;
    case 'match': return `<td>${ptog(o, d.match, '연결 매물', 'building')}</td>`;
    case 'agent': return `<td><span class="ed pickm ${d.agent ? '' : 'none'}" ${edAttr(o, 'agent')} tabindex="0" role="button" aria-label="담당 편집">${d.agent ? esc(d.agent) : '<span class="t3">미배정</span>'}</span></td>`;
    case 'next': return `<td><span class="ed pickm ${d.next == null ? 'none' : ''}" ${edAttr(o, 'next')} tabindex="0" role="button" aria-label="다음 연락일 편집">${nextPill(d.next)}</span></td>`;
    case 'memo': return `<td class="c-memo">${memoCell(o, d.memo)}</td>`;
  }
  return '';
}
function listingCell(k, c, g) {
  const o = `g:${g.gid}`;
  const allPaused = g.lines.every((l) => l.paused);
  const st = g.status === 'open' && allPaused ? 'hold' : g.status;
  const stack = (cell) => (g.lines.length > 1 ? `<div class="stk">${g.lines.map((l, i) => `<div>${cell(l, i)}</div>`).join('')}</div>` : cell(g.lines[0], 0));
  switch (k) {
    case 'kind': return '<td><span class="kd out">내놓음</span></td>';
    case 'tx': return `<td>${stack((l, i) => `<button class="tag ${l.tx}" ${edAttr(`l:${g.gid}:${i}`, 'tx')} aria-label="${esc(g.label)} 거래유형 편집">${TX[l.tx]}</button>`)}</td>`;
    case 'intake': return `<td class="c-intake" title="${esc(g.label)}"><div class="ik"><a class="tr-link" data-open="${esc(g.label)} 매물 상세" tabindex="0" role="button">${esc(g.label)}</a></div></td>`;
    case 'status': return `<td><span class="st ${LIFE[st][0]}">${LIFE[st][1]}</span></td>`;
    case 'bMin': return `<td class="r num ${state.rent ? '' : 'ganchor'}" colspan="2">${stack((l, i) => numCell(`l:${g.gid}:${i}`, 'price', l.price, 'won', (!state.rent && l.tx === 'monthly' ? `<span class="t3"> / </span>${l.rent == null ? '-' : l.rent}` : '') + (l.paused ? '<span class="paused">중단</span>' : '')))}</td>`;
    case 'rMin': return `<td class="r num gcol" colspan="2">${stack((l, i) => (l.tx === 'monthly' ? numCell(`l:${g.gid}:${i}`, 'rent', l.rent, 'rent') : '<span class="ed off">-</span>'))}</td>`;
    case 'aMin': return `<td class="r num" colspan="2">${g.area}평</td>`;
    case 'bMax': case 'rMax': case 'aMax': return '';
    case 'match': return `<td>${ptog(o, g.lines.reduce((s, l) => s + l.match, 0), '연결 구매고객', 'userSearch')}</td>`;
    case 'agent': case 'next': return '<td class="t3">-</td>';
    case 'memo': return `<td class="c-memo">${memoCell(o, g.memo)}</td>`;
  }
  return '';
}

function matchPanel(key, x, c, n) {
  const ms = matchesOf(x);
  const demand = x.kind === 'demand';
  const act = ms.filter((m) => !m.closed && m.stage < 5).length;
  return `<tr class="exp" data-exp="${key}"><td colspan="${n}"><div class="exp-in"><div class="xcard ${state.justOpened === key ? '' : 'still'}">
    <div class="xhead"><span class="ttl">${icon(demand ? 'building' : 'userSearch')}${esc(demand ? `${c.name} 구함 매칭` : `${x.label} 매물 매칭`)}</span>
      <span>진행 <b>${act}</b></span><span>거래 <b>${ms.filter((m) => !m.closed && m.stage === 5).length}</b></span><span>종료 <b>${ms.filter((m) => m.closed).length}</b></span>
      <span class="sp"></span><button class="btn sm" data-open="매칭 생성">${icon('plus')}매칭 생성</button><button class="ib" data-xclose aria-label="접기">${icon('x')}</button></div>
    <div class="mlist">${ms.map((m) => `<div class="mrow ${m.closed ? 'closed' : ''}" data-m="${m.i}">
      <div class="mc"><div class="l1"><a class="tr-link nm" data-open="${esc(m.title)} 상세">${esc(m.title)}</a><span class="tag ${m.tx}">${TX[m.tx]}</span></div><div class="l2 num">${esc(m.sub2)}</div></div>
      <div class="mc"><div class="l1 num">${esc(m.sub)}</div></div>
      <div class="mc">${m.closed ? '<span class="st hold">종료</span>' : `<div class="trk">${MST.map((l, k) => `<button class="nd ${k < m.stage ? 'done' : k === m.stage ? 'cur' : ''}" data-stage="${k}" aria-label="${l} 단계로 옮기기" title="${l}"></button>`).join('')}<span class="lbl">${MST[m.stage]}</span></div>`}</div>
      <div class="mc"><div class="l1"><span class="mmemo" contenteditable="plaintext-only" data-ph="메모 추가" aria-label="매칭 메모">${esc(m.memo)}</span></div><div class="l2">${m.visit ? `${icon('cal')}${m.visit}` : ''}</div></div>
      <div class="mact">${m.closed ? '<button class="btn quiet sm" data-mreopen>다시 열기</button>' : `<button class="btn quiet sm" data-open="방문 일정">방문 일정</button><button class="btn quiet sm" data-mclose>종료</button><button class="btn sm" data-mdeal ${m.stage === 5 ? 'disabled' : ''}>거래 전환</button>`}</div>
    </div>`).join('')}</div>
  </div></div></td></tr>`;
}

function caseHtml(c, vis, n) {
  const rows = rowsOf(c);
  const showCons = has('exp') && c.consultOpen && c.consult;
  const span = rows.length + (showCons ? 1 : 0);
  const picked = state.picked.has(c.id);
  const nameEd = editing(`c:${c.id}`, 'name');
  const pinned = (k) => {
    switch (k) {
      case 'sel': return `<td class="pin p-sel sel span" rowspan="${span}"><div class="in"><span class="ck ${picked ? 'on' : ''}" role="checkbox" aria-checked="${picked}" tabindex="0" aria-label="${esc(c.name)} 고객 케이스 선택">${icon('check')}</span></div></td>`;
      case 'exp': return `<td class="pin p-exp span" rowspan="${span}"><div class="in">${c.consult ? `<button class="xb ${c.consultOpen ? '' : 'shut'}" data-cons aria-expanded="${c.consultOpen}" aria-label="${esc(c.name)} 최근 상담 ${c.consultOpen ? '접기' : '펼치기'}">${icon('chevDown')}</button>` : ''}</div></td>`;
      case 'cust': return `<td class="pin p-cust span" rowspan="${span}"><div class="in">${nameEd ? cin(c.name, '고객명') : `<span class="nm" data-name title="두 번 눌러 이름 고치기">${esc(c.name)}</span>${c.extra ? `<span class="plus" title="연결 ${c.extra + 1}명">+${c.extra}</span>` : ''}`}</div></td>`;
      case 'phone': return `<td class="pin p-phone span num t2" rowspan="${span}"><div class="in">${c.phone}</div></td>`;
      case 'act': return `<td class="pin p-act span" rowspan="${span}"><div class="in"><button class="ib" data-more aria-label="${esc(c.name)} 작업 메뉴">${icon('more')}</button></div></td>`;
    }
    return '';
  };
  const body = rows.map((x, ri) => {
    const cell = x.kind === 'demand' ? demandCell : listingCell;
    const tds = vis.map((col) => {
      if (col.pin) return ri === 0 ? pinned(col.k) : '';
      if (col.k === 'created') return ri === 0 ? `<td class="c-created num span" rowspan="${rows.length}"><div class="in">${ymd(c.created)}</div></td>` : '';
      return cell(col.k, c, x);
    }).join('');
    return `<tr data-row="${x.kind === 'demand' ? `d:${x.rid}` : `g:${x.gid}`}">${tds}</tr>`;
  }).join('');
  const cons = showCons ? `<tr class="cons"><td colspan="${n - 5}"><div class="cline" data-consline tabindex="0" role="button" aria-label="${esc(c.name)} 최근 상담 열기" title="${esc(c.consult.text)}">${icon('msg')}<span class="d">${md(c.consult.off)} ${c.consult.type}</span>${c.consult.ai ? `<span class="ai">${icon('sparkle')}통화 요약</span>` : ''}<span class="tx">${esc(c.consult.text)}</span></div></td></tr>` : '';
  const panels = rows.map((x) => { const key = x.kind === 'demand' ? `d:${x.rid}` : `g:${x.gid}`; return state.openMatch.has(key) ? matchPanel(key, x, c, n) : ''; }).join('');
  return `<tbody class="case ${picked ? 'picked' : ''} ${c.status === 'closed' ? 'muted' : ''}" data-c="${c.id}">${body}${cons}${panels}</tbody>`;
}

function headHtml(vis) {
  return `<tr>${vis.map((col) => {
    if (col.k === 'sel') return `<th class="pin p-sel selh"><span class="ck" id="ckAll" role="checkbox" tabindex="0">${icon('check')}</span></th>`;
    if (col.k === 'exp') return '<th class="pin p-exp" aria-label="최근 상담 펼침"></th>';
    if (col.k === 'act') return '<th class="pin p-act" aria-label="작업"></th>';
    const s = state.sort && state.sort.key === col.sort ? state.sort : null;
    const anchor = col.k === 'bMax' || col.k === 'rMax';
    const box = (col.k === 'bMax' && !state.rent) || (col.k === 'rMax' && state.rent)
      ? `<button class="gbox" data-rent aria-label="${state.rent ? '월세 컬럼 접기' : '월세 컬럼 펼치기'}" title="${state.rent ? '월세 컬럼 접기' : '월세 컬럼 펼치기'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M5 12h14"/>${state.rent ? '' : '<path d="M12 5v14"/>'}</svg></button>` : '';
    return `<th class="${col.pin ? `pin ${col.pin}` : ''} ${col.r ? 'r' : ''} ${col.rent ? 'gcol' : ''} ${anchor ? 'ganchor' : ''} c-${col.k} ${s ? 'sorted' : ''}" ${col.sort ? `data-sort="${col.sort}"` : ''}>${icon(col.ic, 'hi')}${col.label}${s ? `<svg class="i caret" style="${s.dir > 0 ? 'transform:rotate(180deg)' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>` : ''}<span class="rz"></span>${box}</th>`;
  }).join('')}</tr>`;
}

function fselHtml(d) {
  const v = state.f[d.id] || [];
  const text = !v.length ? '전체' : v.length === 1 ? v[0] : `${v[0]} 외 ${v.length - 1}`;
  return `<button class="fsel ${v.length ? 'on' : ''}" data-fs="${d.id}"><span class="k">${d.k}</span><span class="v">${esc(text)}</span>${v.length ? `<span class="clr" data-fclr="${d.id}" title="지우기">${icon('x')}</span>` : icon('chevDown')}</button>`;
}

function render() {
  const vis = cols();
  const n = vis.length;
  const tbl = document.getElementById('tbl');
  const scroll = document.getElementById('scroll');
  tbl.classList.toggle('h-consult', !has('exp'));
  // 숫자는 그릴 때마다 다시 센다
  document.getElementById('total').textContent = CASES.length;
  const allD = CASES.flatMap((c) => c.demands);
  document.getElementById('missedN').textContent = allD.filter((d) => d.next != null && d.next < 0).length;
  document.getElementById('todayN').textContent = allD.filter((d) => d.next === 0).length;
  document.querySelectorAll('.vtab[data-mode]').forEach((t) => {
    const m = t.dataset.mode;
    t.classList.toggle('on', m === state.mode);
    t.querySelector('.n').textContent = CASES.filter((c) => (m === 'all' ? true : m === 'demand' ? c.demands.length : c.listings.length)).length;
  });
  const list = sorted(filtered());
  const visIds = new Set(list.map((c) => c.id));
  for (const id of [...state.picked]) if (!visIds.has(id)) state.picked.delete(id);
  state.visible = list.map((c) => c.id);

  let html = '';
  if (!list.length) {
    html = `<tbody><tr><td colspan="${n}" style="border:0"><div class="empty" style="position:sticky;left:0;width:var(--sw,100%)"><b>표시할 고객 케이스가 없습니다.</b>검색어나 필터 조건을 바꿔보세요<div style="margin-top:12px"><button class="btn sm" data-clear>필터 초기화</button></div></div></td></tr></tbody>`;
  } else if (state.group !== 'none') {
    for (const [gid, label, test] of GROUPS[state.group]) {
      const items = list.filter(test);
      if (!items.length) continue;
      const shut = state.shut.has(gid);
      html += `<tbody><tr class="grp ${shut ? 'shut' : ''}" data-g="${gid}"><td colspan="${n}"><span class="gh">${icon('chevDown')}<span class="${gid === 'late' ? 'danger-t' : ''}">${label}</span><span class="n num">${items.length}</span></span></td></tr></tbody>`;
      if (!shut) html += items.map((c) => caseHtml(c, vis, n)).join('');
    }
  } else html = list.map((c) => caseHtml(c, vis, n)).join('');
  tbl.innerHTML = `<thead id="thead">${headHtml(vis)}</thead>${html}`;

  const all = document.getElementById('ckAll');
  const nSel = list.filter((c) => state.picked.has(c.id)).length;
  all.className = 'ck' + (list.length && nSel === list.length ? ' on' : nSel ? ' some' : '');
  all.setAttribute('aria-label', `현재 불러온 ${list.length}개 고객 케이스 전체 선택`);

  const nReq = list.reduce((s, c) => s + rowsOf(c).length, 0);
  document.getElementById('foot').innerHTML = `<span>고객<b>${list.length}</b> / <b style="margin-left:0">${CASES.length}</b>명 · 의뢰<b>${nReq}</b>건 표시</span>${state.picked.size ? `<span><b style="margin-left:0">${state.picked.size}</b>개 선택됨 <button class="lk" data-unpick>선택 해제</button></span>` : ''}<span class="grow"></span><span>전체 ${CASES.length}명 불러옴</span>`;

  const nf = nFilters();
  document.getElementById('fbar').innerHTML = FDEFS.map((d, i) => fselHtml(d) + (i === 0 || i === 4 ? '<span class="vsep"></span>' : '')).join('') + (nf || state.q || state.mode !== 'all' ? `<button class="btn quiet sm" data-clear>${icon('refresh')}초기화</button>` : '');
  const sb = document.getElementById('sortBtn');
  const sl = state.sort ? (SORTS.find((s) => s[0] === state.sort.key) || [])[1] : '';
  sb.innerHTML = `${icon('sort')}정렬${sl ? `: ${sl} ${state.sort.dir > 0 ? '↑' : '↓'}` : ''}`;
  const gb = document.getElementById('groupBtn');
  gb.classList.toggle('active', state.group !== 'none');
  gb.innerHTML = `${icon('board')}묶음${state.group === 'next' ? ': 다음 연락' : state.group === 'agent' ? ': 담당' : ''}`;
  const cb = document.getElementById('colBtn');
  cb.classList.toggle('active', state.hidden.size > 0);
  cb.innerHTML = `${icon('sliders')}컬럼${state.hidden.size ? `<span class="cnt">${COL_GROUPS.length - state.hidden.size}</span>` : ''}`;
  renderPeek();
  scroll.style.setProperty('--sw', `${scroll.clientWidth}px`);
  cue();
  const inp = tbl.querySelector('[data-cin]');
  if (inp) { inp.focus(); inp.select(); }
  state.justOpened = null;
}

// ── 옆 상세: 구함 상세 ──
function renderPeek() {
  const peek = document.getElementById('peek');
  const hit = state.peek && CASES.flatMap((c) => c.demands.map((d) => [c, d])).find(([, d]) => d.rid === state.peek);
  peek.hidden = !hit;
  if (!hit) return;
  const [c, d] = hit;
  const ms = matchesOf(d);
  const budget = (lo, hi, f) => (lo == null && hi == null ? '협의' : lo == null ? `${f(hi)} 이하` : hi == null ? `${f(lo)} 이상` : lo === hi ? f(lo) : `${f(lo)} ~ ${f(hi)}`);
  const keep = peek.querySelector('.composer input');
  const draft = keep && peek.dataset.rid === String(d.rid) ? keep.value : '';
  peek.dataset.rid = d.rid;
  peek.innerHTML = `
    <div class="peek-bar">
      <button class="ib" data-pclose aria-label="닫기">${icon('chevsRight')}</button>
      <button class="ib" data-open="구함 상세 전체 화면" aria-label="전체 화면으로">${icon('expand')}</button>
      <span class="crumb">고객 원장 › 구함 ${d.rank}</span>
      <span style="margin-left:auto"></span>
      <button class="ib" data-open="${esc(c.name)} 전화" aria-label="전화">${icon('phone')}</button>
      <button class="ib" data-more aria-label="${esc(c.name)} 작업 메뉴" data-cid="${c.id}">${icon('more')}</button>
    </div>

// 되돌리기는 그 뒤로 같은 값이 다시 바뀌지 않았을 때만 한다(변경 횟수로 판단)
const bump = (x, f) => ((x._rev = x._rev || {})[f] = (x._rev[f] || 0) + 1);
const fresh = (x, f, v) => { if (x._rev && x._rev[f] === v) return true; UI.toast('그 뒤에 다시 바뀌어서 되돌리지 않았습니다'); return false; };
function change(x, f, val, msg) {
  const prev = x[f];
  if (prev === val) return;
  x[f] = val;
  const v = bump(x, f);
  render();
  UI.toast(msg, () => { if (!fresh(x, f, v)) return; x[f] = prev; bump(x, f); render(); });
}
function resolve(o) {
  const [t, a, b] = o.split(':');
  if (t === 'c') return { x: CASES[+a], c: CASES[+a], who: CASES[+a].name };
  for (const c of CASES) {
    if (t === 'd') { const d = c.demands.find((y) => y.rid === +a); if (d) return { x: d, c, d, who: `${c.name} 구함 ${d.rank}` }; }
    else { const g = c.listings.find((y) => y.gid === +a); if (g) return t === 'g' ? { x: g, c, g, who: g.label } : { x: g.lines[+b], c, g, who: g.label }; }
  }
  return null;
}
const LABEL = { bMin: '최소예산', bMax: '최대예산', rMin: '최소월세', rMax: '최대월세', aMin: '최소평형', aMax: '최대평형', price: '금액', rent: '월세', memo: '의뢰 메모', name: '고객명' };
const PAIR = { bMin: ['bMin', 'bMax'], bMax: ['bMin', 'bMax'], rMin: ['rMin', 'rMax'], rMax: ['rMin', 'rMax'], aMin: ['aMin', 'aMax'], aMax: ['aMin', 'aMax'] };
// "15억", "15억 8000", "158000", "15.8억" → 만원
function parseMoney(raw) {
  const s = raw.replace(/[,\s만원]/g, '');
  if (s === '') return null;
  const m = s.match(/^(\d+(?:\.\d+)?)억(\d+)?$/);
  const v = m ? Math.round(parseFloat(m[1]) * 10000) + (m[2] ? +m[2] : 0) : /^\d+$/.test(s) ? +s : NaN;
  return v;
}
function parseNum(raw) { const s = raw.replace(/[,\s평만원]/g, ''); return s === '' ? null : /^\d+(\.\d+)?$/.test(s) ? +s : NaN; }
function commit(input, cancel) {
  const e = state.edit;
  if (!e) return;
  state.edit = null;
  if (cancel) { render(); return; }
  const r = resolve(e.o);
  const f = e.f;
  const raw = input.value.trim();
  if (f === 'name') {
    if (!raw) { UI.toast('고객명은 비워둘 수 없습니다.'); render(); return; }
    return raw === r.x.name ? render() : change(r.x, 'name', raw, `고객명을 '${esc(raw)}'(으)로 바꿨습니다`);
  }
  if (f === 'memo') return raw === (r.x.memo || '') ? render() : change(r.x, 'memo', raw, `${esc(r.who)} 의뢰 메모를 저장했습니다`);
  const money = f === 'bMin' || f === 'bMax' || f === 'price';
  const v = money ? parseMoney(raw) : parseNum(raw);
  if (Number.isNaN(v) || (v != null && v < 0) || (v != null && (money || f.startsWith('r')) && !Number.isInteger(v))) { UI.toast(`${LABEL[f]}은(는) 0 이상의 ${f.startsWith('a') ? '숫자' : '정수'}로 입력해 주세요.`); render(); return; }
  if (PAIR[f]) {
    const lo = f === PAIR[f][0] ? v : r.x[PAIR[f][0]];
    const hi = f === PAIR[f][1] ? v : r.x[PAIR[f][1]];
    if (lo != null && hi != null && lo > hi) { UI.toast('최소값은 최대값보다 클 수 없습니다.'); render(); return; }
  }
  if (v === r.x[f]) return render();
  change(r.x, f, v, `${esc(r.who)} ${LABEL[f]}을(를) ${v == null ? '비웠습니다' : `${f.startsWith('a') ? `${v}평` : money ? man(v) : `${v}만`}(으)로 바꿨습니다`}`);
}

  if (el.matches('.composer input')) {
    if (e.key !== 'Enter') return;
    const text = el.value.trim();
    if (!text) return;
    const hit = CASES.find((c) => c.demands.some((d) => d.rid === state.peek));
    const entry = { off: 0, type: '전화', text, ai: false };
    const prev = hit.consult;
    hit.log.unshift(entry); hit.consult = entry; hit.consultOpen = true;
    el.value = '';
    const v = bump(hit, 'consult');
    render();
    UI.toast(`${esc(hit.name)} 상담 메모를 저장했습니다`, () => { if (!fresh(hit, 'consult', v)) return; hit.log = hit.log.filter((x) => x !== entry); hit.consult = prev; bump(hit, 'consult'); render(); });
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && el.matches('[data-ed], [data-peek], .ck, [data-consline], [data-open]') && el.tagName !== 'BUTTON') { e.preventDefault(); el.click(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); document.getElementById('q').focus(); return; }
  if (e.key === 'Escape') { if (state.peek) { state.peek = null; render(); } else if (state.picked.size) { state.picked.clear(); render(); } }
});
// 표가 화면보다 넓으면 오른쪽 끝에 그림자를 둔다 (원본의 좌우 스크롤 안내와 같은 역할)
function cue() {
  const sc = document.getElementById('scroll'), el = document.getElementById('cue');
  el.classList.toggle('show', sc.scrollLeft + sc.clientWidth < sc.scrollWidth - 4);
  el.style.left = `${sc.clientWidth - 28}px`;
}
document.getElementById('scroll').addEventListener('scroll', cue, { passive: true });
window.addEventListener('resize', () => { const sc = document.getElementById('scroll'); sc.style.setProperty('--sw', `${sc.clientWidth}px`); cue(); });

render();
