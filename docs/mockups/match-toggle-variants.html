<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>매칭 펼침 버튼 · A/B/C</title>
<style>
:root{
  --text:#37352f; --sub:#787774; --faint:#a5a4a0; --line:#ededeb; --line-strong:#e3e2e0;
  --hover:rgba(55,53,47,.06); --bg:#fff; --side:#f7f7f5;
  --match:#5b97bd; --match-soft:#e7f0f6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:13px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:28px 28px 60px}
h1{font-size:19px;font-weight:650;margin:0 0 4px}
.lede{color:var(--sub);margin:0 0 22px;font-size:13px}
.switch{display:inline-flex;gap:2px;padding:3px;border-radius:9px;background:var(--side);margin-bottom:24px}
.switch button{height:30px;padding:0 14px;border-radius:6px;font-size:12.5px;font-weight:550;color:var(--sub)}
.switch button[aria-pressed=true]{background:#fff;color:var(--text);box-shadow:0 0 0 1px var(--line-strong),0 1px 2px rgba(15,15,15,.06)}

.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px}
.cardhead{display:flex;align-items:baseline;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);background:#fcfcfb}
.cardhead b{font-size:13.5px;font-weight:650}
.cardhead span{font-size:12px;color:var(--sub)}
.tag{margin-left:auto;font-size:11px;color:#2b7a4b;background:#e6f2e9;padding:2px 8px;border-radius:10px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;font-weight:500;color:var(--sub);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:0 10px;height:46px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.row:hover{background:var(--hover)}
.tx{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:5px;font-size:11.5px}
.tx.sale{background:#faecec;color:#b5423a}.tx.jeonse{background:#eaf1f6;color:#2b6485}.tx.monthly{background:#fbf3df;color:#8a5a13}
.num{font-variant-numeric:tabular-nums}
.c-mid{text-align:center}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.state i{width:7px;height:7px;border-radius:50%}
.state.on i{background:#4f9768}.state.deal i{background:#5b97bd}.state.done i{background:#c7c6c3}

/* ── 토글 변형 ── */
.cell{display:flex;align-items:center;justify-content:center}
.cell:empty::after{content:"";color:var(--faint)}

/* A: 숫자 알약 */
[data-variant=A] .tg{display:inline-flex;align-items:center;justify-content:center;height:24px;min-width:24px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;color:var(--sub);font-variant-numeric:tabular-nums;transition:background .12s,color .12s}
[data-variant=A] .tg:hover{background:rgba(55,53,47,.07);color:var(--text)}
[data-variant=A] .tg[aria-expanded=true]{background:rgba(55,53,47,.1);color:var(--text)}

/* B: 숫자 + 호버 화살표 */
[data-variant=B] .tg{display:inline-flex;align-items:center;gap:2px;height:24px;padding:0 6px;border-radius:5px;font-size:12px;font-weight:500;color:var(--sub);font-variant-numeric:tabular-nums;transition:background .12s,color .12s}
[data-variant=B] .tg:hover{background:rgba(55,53,47,.06);color:var(--text)}
[data-variant=B] .tg[aria-expanded=true]{color:var(--text)}
[data-variant=B] .tg .car{width:12px;height:12px;color:var(--faint);opacity:0;transition:opacity .12s,transform .15s}
[data-variant=B] tr.row:hover .tg .car,[data-variant=B] .tg:focus-visible .car{opacity:1}
[data-variant=B] .tg[aria-expanded=true] .car{opacity:1;transform:rotate(180deg)}

/* C: 아이콘 + 숫자 (테두리 없음) */
[data-variant=C] .tg{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 6px;border-radius:5px;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;transition:background .12s,color .12s}
[data-variant=C] .tg:hover{background:rgba(55,53,47,.06);color:var(--text)}
[data-variant=C] .tg[aria-expanded=true]{color:var(--text)}
[data-variant=C] .tg .ic{width:13px;height:13px;color:var(--faint)}
[data-variant=C] .tg .car{width:12px;height:12px;color:var(--faint);transition:transform .15s}
[data-variant=C] .tg[aria-expanded=true] .car{transform:rotate(180deg)}

/* 참고: 현재(기존) 버튼 */
[data-variant=now] .tg{display:inline-flex;align-items:center;gap:3px;height:24px;min-width:44px;justify-content:center;padding:0 6px;border:1px solid var(--line-strong);border-radius:6px;background:#fff;font-size:11px;color:var(--text);font-variant-numeric:tabular-nums}
[data-variant=now] .tg[aria-expanded=true]{background:#f1f1ef;border-color:var(--line-strong)}
[data-variant=now] .tg .ic{width:12px;height:12px;color:var(--sub)}
[data-variant=now] .tg .car{width:12px;height:12px;color:var(--sub);transition:transform .15s}
[data-variant=now] .tg[aria-expanded=true] .car{transform:rotate(180deg)}

/* 펼침 패널 (간단 표시) */
.panel{background:#fbfbfa;border-bottom:1px solid var(--line);padding:12px 18px 12px 54px;font-size:12.5px;color:var(--sub)}
.panel b{color:var(--text);font-weight:600}
.note{margin-top:6px;font-size:12px;color:var(--sub);line-height:1.6}
.note b{color:var(--text)}
.hint{font-size:11.5px;color:var(--faint);padding:10px 18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>매칭·광고 펼침 버튼 시안</h1>
  <p class="lede">표 안의 매칭/광고 열을 노션식으로. 버튼을 눌러 펼쳐 보고, 행에 마우스를 올려 호버 상태도 확인하세요.</p>

  <div class="switch" role="tablist" aria-label="시안 선택">
    <button role="tab" data-pick="now">현재</button>
    <button role="tab" data-pick="A" aria-pressed="true">A · 숫자 알약</button>
    <button role="tab" data-pick="B">B · 숫자+호버 화살표</button>
    <button role="tab" data-pick="C">C · 아이콘+숫자</button>
  </div>

  <div class="card" id="card" data-variant="A">
    <div class="cardhead">
      <b id="vname">A · 숫자 알약</b>
      <span id="vdesc">테두리 없는 숫자만. 호버·열림에만 옅은 배경.</span>
      <span class="tag" id="vrec" hidden>추천</span>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:70px">거래</th>
          <th>단지</th>
          <th style="width:70px">동/호</th>
          <th style="width:64px">공급</th>
          <th style="width:74px" class="c-mid">매칭</th>
          <th style="width:74px" class="c-mid">광고</th>
          <th style="width:120px">매물상태</th>
          <th style="width:130px">가격</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="hint">숫자가 없는 칸은 매칭·광고가 0건이라 버튼을 숨긴 상태입니다.</div>
  </div>

  <p class="note" id="takeaway"></p>
</div>

<script>
"use strict";
const ICON={
  branch:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M8.3 7.2A6 6 0 0 0 15.5 9"/></svg>',
  mega:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 15-5v12L3 13v-2z"/><path d="M11.6 16.8a3 3 0 0 1-5.8-1.6"/></svg>',
  car:'<svg class="car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
};
const ROWS=[
  {tx:'sale',dong:'102',ho:'3401',area:'74평',match:2,ad:1,state:['on','활성'],price:'31억 9,000만'},
  {tx:'jeonse',dong:'101',ho:'3404',area:'47평',match:0,ad:1,state:['deal','거래중'],price:'10억 8,000만'},
  {tx:'monthly',dong:'101',ho:'3403',area:'47평',match:0,ad:1,state:['deal','거래중'],price:'5,000만'},
  {tx:'jeonse',dong:'101',ho:'3402',area:'52평',match:1,ad:0,state:['done','종료'],price:'9억 5,000만'},
  {tx:'sale',dong:'101',ho:'3501',area:'74평',match:2,ad:2,state:['deal','거래중'],price:'26억 8,000만'},
  {tx:'sale',dong:'101',ho:'3503',area:'74평',match:1,ad:1,state:['done','종료'],price:'24억 2,000만'},
  {tx:'sale',dong:'102',ho:'3401',area:'74평',match:0,ad:1,state:['done','종료'],price:'31억 5,000만'},
];
const TXLABEL={sale:'매매',jeonse:'전세',monthly:'월세'};
const META={
  now:{name:'현재 (기존)',desc:'테두리 있는 네모 버튼 안에 아이콘·숫자·화살표.',rec:false},
  A:{name:'A · 숫자 알약',desc:'테두리 없는 숫자만. 호버·열림에만 옅은 원형 배경.',rec:true},
  B:{name:'B · 숫자+호버 화살표',desc:'평소 숫자만. 행에 마우스를 올리면 뒤에 작은 화살표.',rec:true},
  C:{name:'C · 아이콘+숫자',desc:'아이콘·숫자·화살표를 테두리 없이 글자처럼.',rec:false},
};
const TAKE={
  now:'<b>현재:</b> 네모 버튼이 셀 안에 들어가 표의 선·상자를 늘린다. 노션은 셀 안에 버튼 상자를 두지 않는다.',
  A:'<b>A 추천:</b> 가장 조용하고 노션의 상태 셀과 가장 가깝다. 다만 "펼칠 수 있다"는 힌트가 약해, 처음 쓰는 사람은 눌러봐야 안다.',
  B:'<b>B 추천:</b> 평소엔 A처럼 조용하다가 행 호버 시 화살표가 나와 펼침을 알린다. 발견성과 깔끔함의 균형.',
  C:'<b>C:</b> 매칭/광고를 아이콘으로 구분해 알아보기 쉽지만, 좁은 셀에서 다시 빽빽해져 노션 느낌과 멀어진다.',
};

let openKey=null; // "ri-col"
function toggleBtn(r,col){
  const count=r[col];
  if(count===0) return '';
  const icon=col==='match'?ICON.branch:ICON.mega;
  const id=`${ROWS.indexOf(r)}-${col}`;
  const open=openKey===id;
  const label=(col==='match'?'연결 구매고객':'광고 현황');
  return `<button class="tg" data-tg="${id}" aria-expanded="${open}" aria-label="${count}건의 ${label} ${open?'접기':'펼치기'}"><span class="ic-slot">${icon}</span>${count}${ICON.car}</button>`;
}
function panelRow(r,col,span){
  const label=col==='match'?'연결 구매고객':'광고 현황';
  const body=col==='match'
    ? `<b>${r.match}명</b>의 구매고객 — 김민준 · 박서연${r.match>1?' 등':''} · 단계·다음 할 일·메모가 여기에 펼쳐집니다.`
    : `<b>${r.ad}건</b>의 광고 — 이실장 · 부동산뱅크 등 CP별 게재 현황이 여기에 펼쳐집니다.`;
  return `<tr><td colspan="${span}" class="panel">${body}</td></tr>`;
}
function render(){
  const v=document.getElementById('card').dataset.variant;
  const tb=document.getElementById('tbody');
  let html='';
  ROWS.forEach((r,ri)=>{
    // C 변형은 아이콘 표시, 그 외는 ic-slot 비움은 CSS가 아니라 여기서 제어
    html+=`<tr class="row">
      <td><span class="tx ${r.tx}">${TXLABEL[r.tx]}</span></td>
      <td>고덕그라시움</td>
      <td class="num">${r.dong} · ${r.ho}</td>
      <td class="num">${r.area}</td>
      <td><div class="cell">${toggleBtn(r,'match')}</div></td>
      <td><div class="cell">${toggleBtn(r,'ad')}</div></td>
      <td><span class="state ${r.state[0]}"><i></i>${r.state[1]}</span></td>
      <td class="num">${r.price}</td>
    </tr>`;
    if(openKey && openKey.startsWith(ri+'-')){
      const col=openKey.endsWith('match')?'match':'ad';
      html+=panelRow(r,col,8);
    }
  });
  tb.innerHTML=html;
  // C/현재가 아니면 아이콘 숨김 (A·B는 아이콘 없음)
  const showIcon=(v==='C'||v==='now');
  tb.querySelectorAll('.ic-slot').forEach(s=>{ if(!showIcon) s.innerHTML=''; });
}
function pick(v){
  document.getElementById('card').dataset.variant=v;
  document.querySelectorAll('[data-pick]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.pick===v));
  document.getElementById('vname').textContent=META[v].name;
  document.getElementById('vdesc').textContent=META[v].desc;
  document.getElementById('vrec').hidden=!META[v].rec;
  document.getElementById('takeaway').innerHTML=TAKE[v];
  openKey=null;
  render();
}
document.addEventListener('click',e=>{
  const pickBtn=e.target.closest('[data-pick]');
  if(pickBtn){pick(pickBtn.dataset.pick);return;}
  const tg=e.target.closest('[data-tg]');
  if(tg){openKey=openKey===tg.dataset.tg?null:tg.dataset.tg;render();}
});
pick('A');
</script>
</body>
</html>
