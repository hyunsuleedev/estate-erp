<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>고객 원장 표 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 값은 매물관리 표(property-listings-table.tsx, property-toolbar.tsx)에서 그대로 옮겼다. */
:root {
  color-scheme: light;
  --fg: #37352f; --muted: #787774; --muted-2: #6f6d6a; --faint: #b4b4b1;
  --line: #eeeeec; --line-head: #d8d6d0; --line-pin: #d9d9d6; --line-case: #e3e2de;
  --head: #f7f7f5; --head-pin: #f5f4f1; --head-detail: #f2f6f4;
  --surface: #f7f6f3; --tool: #f1f0ec; --border: #e9e9e7;
  --shadow: 0 1px 2px rgba(55, 53, 47, .06), 0 12px 32px rgba(55, 53, 47, .14);
  --row: 33px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #fff; color: var(--fg); font: 13px/1.5 "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; word-break: keep-all; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid #2383e2; outline-offset: 1px; }
[hidden] { display: none !important; }
.i { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* 앱 셸 */
.app { height: 100vh; display: grid; grid-template-columns: 256px minmax(0, 1fr); }
.app.mini { grid-template-columns: 48px minmax(0, 1fr); }
.side { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.side-top { height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 16px; flex-shrink: 0; }
.brand { font-weight: 700; font-size: 14px; letter-spacing: -.2px; }
.nav { flex: 1; overflow: auto; padding: 4px 8px; }
.nav-g { font-size: 11.5px; color: var(--muted); margin: 14px 8px 5px; white-space: nowrap; }
.nav-g:first-child { margin-top: 4px; }
.nav-i { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 6px; color: #4d4b45; white-space: nowrap; }
.nav-i.on { background: #ebebea; color: var(--fg); font-weight: 600; }
.me { display: flex; align-items: center; gap: 9px; padding: 10px 12px 12px; flex-shrink: 0; white-space: nowrap; }
.av { width: 24px; height: 24px; display: grid; place-items: center; font-size: 11px; color: var(--muted); flex-shrink: 0; }
.mini .brand, .mini .nav-g, .mini .nav-i span, .mini .me div { display: none; }
.mini .side-top { justify-content: center; padding: 0; }
.mini .nav-i { justify-content: center; padding: 7px 0; }
.mini .me { justify-content: center; padding: 10px 0 12px; }
.icon-btn { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 5px; color: var(--muted-2); flex-shrink: 0; }
.icon-btn:hover { background: rgba(55, 53, 47, .08); }
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.tabbar { height: 40px; flex-shrink: 0; display: flex; align-items: flex-end; gap: 8px; padding: 0 6px; background: var(--surface); border-bottom: 1px solid var(--border); }
.tab { height: 35px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #fff; border: 1px solid var(--border); border-bottom-color: #fff; border-radius: 6px 6px 0 0; margin-bottom: -1px; }
.tab-add { color: var(--muted); padding-bottom: 8px; }

/* 1행: 보기 · 검색 · 주요 동작 */
.row1 { display: flex; align-items: center; gap: 8px; padding: 9px 12px; flex-shrink: 0; }
.seg { display: flex; align-items: center; gap: 1px; height: 30px; padding: 2px; border-radius: 15px; background: var(--tool); flex-shrink: 0; }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 12px; border-radius: 13px; color: var(--muted); white-space: nowrap; }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--fg); color: #fff; font-weight: 500; }
.seg .n { font-size: 11.5px; opacity: .65; font-variant-numeric: tabular-nums; }
.seg.light button { padding: 0 10px; font-size: 12px; }
.seg.light button[aria-pressed="true"] { background: #fff; color: var(--fg); }
.seg.light .i { width: 13px; height: 13px; }
.searchbox { display: flex; align-items: center; height: 30px; flex: 1 1 auto; min-width: 280px; max-width: 720px; border-radius: 15px; background: var(--tool); }
.searchbox .area { display: flex; align-items: center; gap: 6px; flex: 0 1 170px; min-width: 110px; height: 100%; padding: 0 10px 0 14px; border-radius: 15px 0 0 15px; color: var(--fg); white-space: nowrap; }
.searchbox .area:hover { background: rgba(55, 53, 47, .05); }
.searchbox .area span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.searchbox .area .i { width: 14px; height: 14px; color: var(--muted); }
.searchbox .bar { width: 1px; height: 14px; background: #d9d8d3; flex-shrink: 0; }
.searchbox .q { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; padding: 0 12px; }
.searchbox .q .i { width: 14px; height: 14px; color: var(--muted); }
.searchbox input { flex: 1; min-width: 0; border: 0; background: transparent; outline: 0; }
.searchbox input::placeholder { color: var(--muted); }
.spacer { flex: 1; }
.primary { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 14px; border-radius: 15px; background: var(--fg); color: #fff; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
.primary:hover { background: #2c2a25; }
.primary .i { width: 14px; height: 14px; }

/* 2행: 좁히기 */
.row2 { display: flex; align-items: center; gap: 6px; padding: 0 12px 9px; flex-shrink: 0; border-bottom: 1px solid var(--border); }
.fchip { display: inline-flex; align-items: center; height: 28px; max-width: 260px; border: 1px solid #e3e2de; border-radius: 14px; background: #fff; color: var(--muted); font-size: 12.5px; flex-shrink: 0; }
.fchip:hover { border-color: #d6d5d0; background: rgba(55, 53, 47, .04); color: var(--fg); }
.fchip > button:first-child { display: inline-flex; align-items: center; gap: 6px; height: 100%; padding: 0 10px 0 12px; border-radius: 14px; white-space: nowrap; }
.fchip .i { width: 12px; height: 12px; color: #a5a39f; }
.fchip.on { border-color: transparent; background: #ebeae6; color: var(--fg); }
.fchip.on > button:first-child { padding-right: 4px; }
.fchip.on .lbl { color: var(--muted); }
.fchip.on b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.fchip .clear { width: 22px; height: 22px; margin-right: 2px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
.fchip .clear:hover { background: rgba(55, 53, 47, .1); color: var(--fg); }
.ghost { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
.ghost:hover { background: rgba(55, 53, 47, .08); color: var(--fg); }
.ghost .i { width: 14px; height: 14px; }

/* 표 */
.scroll { flex: 1; min-height: 0; overflow: auto; position: relative; background: #fff; container-type: inline-size; }
.guide { position: sticky; top: 0; z-index: 9; height: 36px; background: var(--head); border-bottom: 1px solid var(--border); }
.guide-in { position: relative; height: 100%; }
.guide-toggle { position: absolute; top: 8px; display: inline-grid; place-items: center; width: 20px; height: 20px; border: 1px solid #9ba7a3; border-radius: 3px; background: #fff; color: #536b64; box-shadow: 0 1px 1px rgba(42, 51, 47, .05); }
.guide-toggle:hover { border-color: #738b83; background: #f4f8f6; color: #315d50; }
.guide-toggle .i { width: 12px; height: 12px; }
.guide-line { position: absolute; top: 18px; height: 1px; background: #94a3b8; pointer-events: none; }
.guide-cap { position: absolute; top: 18px; width: 1px; height: 8px; background: #94a3b8; pointer-events: none; }
.t { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; }
.t thead { position: sticky; top: 36px; z-index: 6; }
.t th, .t td { font-weight: 400; text-align: left; padding: 0 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.t thead th { height: 36px; background: var(--head); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line-head); }
.t thead th:last-child { border-right: 0; }
.t thead th.detail { background: var(--head-detail); }
.t thead th.detail .h-label { color: #52645e; }
.t thead th.pin { background: var(--head-pin); }
.h-label { display: inline-flex; align-items: center; gap: 4px; min-width: 0; max-width: 100%; font-size: 12px; color: var(--muted); }
.h-label .i { width: 12px; height: 12px; color: rgba(120, 119, 116, .7); }
.h-sort { display: flex; align-items: center; gap: 3px; width: 100%; height: 36px; }
.h-sort:hover .h-label { color: var(--fg); }
.h-sort .arrow { width: 12px; height: 12px; color: var(--muted); }
.pin { position: sticky; z-index: 3; }
.t thead .pin { z-index: 7; }
.pin-end { box-shadow: 1px 0 0 0 var(--line-pin); }
.t tbody td { height: var(--row); font-size: 13px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #fff; vertical-align: middle; }
.t tbody td:last-child { border-right: 0; }
.t tr.row:hover > td { background: #f8fafc; }
.t tr.row.sel > td { background: rgba(55, 53, 47, .05); }
.t tr.row > td.span { vertical-align: top; line-height: 32px; }
.t tr.row > td.pin { background: #fff; }
.t tr.row:hover > td.pin:not(.span) { background: #f8fafc; }
.t tr.row.sel > td.pin { background: #f4f4f3; }
.t tr.case-end > td, .t td.case-end { border-bottom-color: var(--line-case); }
.c-sel { text-align: center !important; padding: 0 !important; }
.c-sel input { margin: 0; width: 14px; height: 14px; accent-color: var(--fg); cursor: pointer; vertical-align: middle; }
.cust { font-size: 14px; font-weight: 600; color: #0f172a; text-align: left; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: top; }
.cust:hover { text-decoration: underline; text-underline-offset: 2px; }
.phone { font-size: 13px; color: #334155; font-variant-numeric: tabular-nums; }
.more { margin-left: 5px; font-size: 11px; color: var(--muted); font-weight: 400; }
.c-act { padding: 0 !important; text-align: center !important; }
.kebab { width: 26px; height: 26px; display: inline-grid; place-items: center; border-radius: 5px; color: #475569; vertical-align: middle; }
.kebab:hover { background: var(--surface); }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; border-radius: 4px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill .d { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.k-demand { background: #d3e5ef; color: #1b64b1; }
.k-listing { background: #dbeddb; color: #0f7b6c; }
.x-sale { background: #fdebec; color: #8f4b46; }
.x-jeonse { background: #e7f3f8; color: #337ea9; }
.x-monthly { background: #fbf3db; color: #8f6b1f; }
.s-open { background: #eef3ed; color: #44745a; }
.s-open .d { background: #6c9b7a; }
.s-hold { background: #fbf3db; color: #9f6b00; }
.s-hold .d { background: #dfab01; }
.n-over { background: #ffe2dd; color: #bb3430; }
.n-today { background: #fdecc8; color: #8a5a13; }
.n-plan { background: #f1f1ef; color: #5f5e5a; }
.tag-urgent { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; margin-left: 6px; border-radius: 4px; background: #ffe2dd; color: #bb3430; font-size: 11px; font-weight: 500; vertical-align: 1px; }
.intake { font-size: 13px; font-weight: 500; color: #0f172a; text-align: left; }
.intake:hover { text-decoration: underline; text-underline-offset: 2px; }
.money { font-weight: 500; font-variant-numeric: tabular-nums; color: #0f172a; }
.dash { color: var(--muted); }
.ln { display: flex; align-items: center; height: 33px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.lines .ln + .ln { box-shadow: 0 -1px 0 0 var(--line); }
.lines-cell { padding-top: 0 !important; padding-bottom: 0 !important; }
.money.off { color: var(--faint); font-weight: 400; }
.stop { font-size: 11px; margin-left: 4px; color: var(--muted); font-weight: 400; }
.cell-btn { display: block; width: 100%; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who { color: #334155; }
.who.none { color: var(--muted); }
.next-add { color: transparent; }
tr.row:hover .next-add, .next-btn:focus-visible .next-add { color: var(--muted); }
.next-dash { color: var(--muted); }
tr.row:hover .next-dash { display: none; }
.next-add-wrap { display: none; }
tr.row:hover .next-add-wrap, .next-btn:focus-visible .next-add-wrap { display: inline; color: var(--muted); }
.match-btn { display: inline-flex; align-items: center; justify-content: center; gap: 3px; min-width: 44px; height: 24px; padding: 0 6px; border: 1px solid var(--border); border-radius: 6px; background: #fff; font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; vertical-align: middle; }
.match-btn:hover { background: var(--surface); }
.match-btn[aria-expanded="true"] { background: #f1f1ef; }
.match-btn .i { width: 12px; height: 12px; }
.consult { display: block; width: 100%; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: #334155; }
.consult:hover { text-decoration: underline; text-underline-offset: 2px; }
.consult .when { color: var(--muted); margin-right: 6px; font-variant-numeric: tabular-nums; }
.memo { display: block; width: 100%; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #334155; min-height: 20px; }
.memo-add { color: transparent; font-size: 12px; }
tr.row:hover .memo-add { color: var(--muted); }
.created { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.edit-input { width: 100%; height: 26px; border: 1px solid #2383e2; border-radius: 4px; padding: 0 6px; background: #fff; font-size: 13px; outline: 0; }
.panel-row td { padding: 0 !important; height: auto !important; background: #fbfbfa !important; border-right: 0 !important; white-space: normal; }
.panel { position: sticky; left: 0; width: min(100%, 100cqw); padding: 12px 14px 14px; }
.panel b { font-weight: 600; }
.panel p { margin: 3px 0 0; font-size: 12px; color: var(--muted-2); }
.empty-row td { height: 200px !important; text-align: center; color: var(--muted); }
.foot { display: flex; align-items: center; gap: 12px; min-height: 28px; padding: 0 12px; border-top: 1px solid var(--border); background: #faf9f6; font-size: 11.5px; color: var(--muted); flex-shrink: 0; }
.foot .link { text-decoration: underline; text-underline-offset: 2px; font-size: 11.5px; color: var(--muted-2); }

/* 팝오버 */
.pop { position: fixed; z-index: 40; min-width: 170px; background: #fff; border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; animation: pop .12s cubic-bezier(.2, .8, .2, 1); }
@keyframes pop { from { transform: translateY(-3px); opacity: 0; } }
.pop-title { padding: 6px 8px 4px; font-size: 11.5px; font-weight: 500; color: var(--muted); }
.pop-item { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; padding: 5px 8px; border-radius: 5px; text-align: left; white-space: nowrap; }
.pop-item:hover, .pop-item:focus-visible { background: var(--surface); }
.pop-item .mark { font-size: 11px; color: var(--muted); }
.pop-item .i { width: 13px; height: 13px; }
.pop-date { padding: 6px 8px 7px; border-top: 1px solid var(--line); margin-top: 3px; }
.pop-date input { width: 100%; height: 28px; border: 1px solid var(--border); border-radius: 5px; padding: 0 6px; }
.pop-check { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
.pop-check:hover { background: var(--surface); }
.pop-check input { margin: 0; accent-color: var(--fg); }
#toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: var(--fg); color: #fff; border-radius: 7px; box-shadow: var(--shadow); font-size: 12.5px; max-width: min(560px, calc(100vw - 32px)); }
#toast button { color: #fff; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; } }
</style>
</head>

  /* 데이터와 상태 */

    });
    if (!gs.length) body = `<tr class="empty-row"><td colspan="${cols.length}">조건에 맞는 의뢰가 없습니다.</td></tr>`;
    scroll.innerHTML = `${guideHTML(cols, min)}<table class="t" id="t" aria-label="고객 원장" style="min-width:${min}px"><colgroup>${cols.map((c) => `<col${c.w ? ` style="width:${c.w}px"` : ""}>`).join("")}</colgroup>${headHTML(cols)}<tbody>${body}</tbody></table>`;
    scroll.scrollTop = top;
    scroll.scrollLeft = left;
    const input = scroll.querySelector("[data-edit-input]");
    if (input) { input.focus(); input.select(); }
  }

  function countMode(m) { return new Set(items().filter((i) => m === "all" || i.kind === m).map((i) => i.primary)).size; }
  function renderBars() {
    document.getElementById("modes").innerHTML = [["all", "전체"], ["demand", "구함"], ["listing", "내놓음"]].map(([k, l]) => `<button type="button" data-act="mode" data-mode="${k}" aria-pressed="${S.mode === k}">${l}<span class="n">${countMode(k)}</span></button>`).join("");
    const chips = Object.entries(FILTERS).map(([sec, f]) => {
      const set = S.filters[sec];
      if (!set.size) return `<div class="fchip"><button type="button" data-act="pop-filter" data-sec="${sec}" aria-label="${f.label} 필터">${f.label}${icon("down")}</button></div>`;
      const names = f.opts().filter(([v]) => set.has(v)).map(([, l]) => l);
      const summary = names.length > 1 ? `${names[0]} 외 ${names.length - 1}` : names[0];
      return `<div class="fchip on"><button type="button" data-act="pop-filter" data-sec="${sec}" aria-label="${f.label} 필터: ${esc(summary)}"><span class="lbl">${f.label}</span><b>${esc(summary)}</b>${icon("down")}</button><button type="button" class="clear" data-act="filter-clear" data-sec="${sec}" aria-label="${f.label} 필터 지우기">${icon("x")}</button></div>`;
    }).join("");
    const any = Object.values(S.filters).some((s) => s.size) || S.q;
    document.getElementById("chips").innerHTML = `${chips}<button type="button" class="ghost" data-act="fake" data-msg="나머지 필터는 지금 앱과 같습니다 (시안에서는 생략했습니다)">${icon("plus")}필터</button>`;
    document.getElementById("rowRight").innerHTML = `${any ? `<button type="button" class="ghost" data-act="reset-filters">초기화</button>` : ""}<button type="button" class="ghost" data-act="pop-cols">${icon("columns")}컬럼</button>`;
    const gs = groups();
    const n = gs.reduce((a, g) => a + g.items.length, 0);
    document.getElementById("foot").innerHTML = `<span>고객 ${gs.length}명 · 의뢰 ${n}건 표시${S.selected.size ? ` · ${S.selected.size}명 선택` : ""}</span>${S.selected.size ? `<button type="button" class="link" data-act="select-clear">선택 해제</button>` : ""}<span style="margin-left:auto"><button type="button" class="link" data-act="reset-data">시안 데이터 초기화</button></span>`;
  }
  function renderAll() {
    document.getElementById("app").className = `app${S.sideMini ? " mini" : ""}`;
    renderBars();
    renderTable();
  }

  const NAV = [
    ["시작", [["grid", "대시보드"]]],
    ["매물·공간", [["home", "매물관리"], ["grid", "관리단지"], ["file", "광고관리"]]],
    ["고객·상담", [["users", "고객 원장", true], ["user", "연락처"], ["msg", "상담기록"]]],
    ["거래·계약", [["branch", "매칭"], ["file", "거래관리"], ["file", "계약서 관리"], ["won", "수수료/정산"]]],
    ["업무·운영", [["check", "업무"], ["cal", "캘린더"], ["users", "직원관리"], ["grid", "설정"]]],
  ];
  document.getElementById("app").innerHTML = `
    <aside class="side">
      <div class="side-top"><span class="brand">Estaitt</span><button type="button" class="icon-btn" data-act="side" aria-label="사이드바 접기">${icon("panel")}</button></div>
      <nav class="nav" aria-label="앱 메뉴">${NAV.map(([g, list]) => `<div class="nav-g">${g}</div>${list.map(([ic, l, on]) => `<div class="nav-i${on ? " on" : ""}">${icon(ic)}<span>${l}</span></div>`).join("")}`).join("")}</nav>
      <div class="me"><span class="av">서</span><div>서지현</div></div>
    </aside>
    <div class="main">
      <div class="tabbar"><div class="tab">${icon("users")}고객 원장</div><div class="tab-add">${icon("plus")}</div></div>
      <section class="row1" aria-label="고객 원장 보기와 검색">
        <div class="seg" id="modes" role="group" aria-label="구함 내놓음 보기"></div>
        <div class="searchbox">
          <button type="button" class="area" data-act="fake" data-msg="지역·단지 선택은 지금 앱과 같습니다 (시안에서는 생략했습니다)">${icon("pin")}<span>지역·단지 전체</span>${icon("down")}</button>
          <span class="bar"></span>
          <label class="q">${icon("search")}<input id="q" placeholder="고객, 전화번호, 매물, 메모" aria-label="고객 원장 검색"></label>
        </div>
        <div class="spacer"></div>
        <div class="seg light" role="group" aria-label="화면 전환">
          <button type="button" aria-pressed="true">${icon("list")}표</button>
          <button type="button" aria-pressed="false" data-act="fake" data-msg="고객 중심 보기로 이동합니다 (시안에서는 이동하지 않습니다)">${icon("users")}고객 중심</button>
        </div>
        <button type="button" class="primary" data-act="fake" data-msg="의뢰 추가는 시안에 포함하지 않았습니다">${icon("plus")}의뢰 추가</button>
      </section>
      <section class="row2" aria-label="좁히기">
        <div id="chips" style="display:flex;align-items:center;gap:6px;min-width:0;overflow-x:auto"></div>
        <div class="spacer"></div>
        <div id="rowRight" style="display:flex;align-items:center;gap:2px"></div>
      </section>
      <div class="scroll" id="scroll"></div>
      <footer class="foot" id="foot"></footer>
    </div>`;

  /* 변경과 알림 */
  let toastTimer = null;
  function toast(msg, undo) {
    let el = document.getElementById("toast");
    if (el) el.remove();
    el = document.createElement("div");
    el.id = "toast";
    el.setAttribute("role", "status");
    el.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button type="button">되돌리기</button>` : ""}`;
    document.body.appendChild(el);
    if (undo) el.querySelector("button").addEventListener("click", () => { undo(); el.remove(); });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 4500);
  }
  function commit(msg, fn) {
    const snap = clone(data);
    fn();
    persist();
    renderAll();
    toast(msg, () => { data = snap; persist(); renderAll(); });
  }

  /* 팝오버 */
  let popAnchor = null;
  function closePop(refocus) {
    document.getElementById("popRoot").innerHTML = "";
    if (refocus && popAnchor && document.contains(popAnchor)) popAnchor.focus();
    popAnchor = null;
  }
  function openPop(anchor, html) {
    closePop();
    popAnchor = anchor;
    const root = document.getElementById("popRoot");
    root.innerHTML = `<div class="pop" role="dialog">${html}</div>`;
    const pop = root.firstChild;
    const a = anchor.getBoundingClientRect();
    pop.style.left = `${Math.max(8, Math.min(a.left, innerWidth - pop.offsetWidth - 8))}px`;
    const below = a.bottom + 4;
    pop.style.top = `${below + pop.offsetHeight > innerHeight - 8 ? Math.max(8, a.top - pop.offsetHeight - 4) : below}px`;
    const first = pop.querySelector("button,input");
    if (first) first.focus();
  }
  function filterPop(sec) {
    const f = FILTERS[sec];
    return `<div class="pop-title">${f.label}</div>${f.opts().map(([v, l]) => `<button type="button" class="pop-item" data-act="filter" data-sec="${sec}" data-val="${v}" aria-pressed="${S.filters[sec].has(v)}">${esc(l)}${S.filters[sec].has(v) ? icon("check") : ""}</button>`).join("")}`;
  }

  /* 편집 */
  function finishEdit(save, input) {
    if (!S.edit) return;
    const { id, field } = S.edit;
    S.edit = null;
    const it = item(id);
    if (!save) { renderTable(); return; }
    const raw = input.value.trim();
    if (field === "memo") {
      if (raw === (it.memo || "")) { renderTable(); return; }
      commit(`노트 저장: ${it.title}`, () => { it.memo = raw; });
      return;
    }
    const num = raw === "" ? null : Number(raw.replace(/,/g, ""));
    if (num !== null && (!Number.isInteger(num) || num < 0)) { toast("금액은 0 이상의 정수로 입력해 주세요 (만원 단위)"); renderTable(); return; }
    if (field === "opt0") {
      if (num === it.options[0].price) { renderTable(); return; }
      commit(`금액 저장: ${it.title}`, () => { it.options[0].price = num; });
      return;
    }
    const other = field === "priceMin" ? it.priceMax : it.priceMin;
    if (num !== null && other != null && (field === "priceMin" ? num > other : num < other)) { toast("최소값은 최대값보다 클 수 없습니다"); renderTable(); return; }
    if (num === it[field]) { renderTable(); return; }
    commit(`금액 저장: ${it.title}`, () => { it[field] = num; });
  }

  /* 이벤트 */
  function setSort(key) {
    /* 고객명은 오름차순부터, 숫자는 내림차순부터. 세 번째 누르면 기본 정렬로 돌아간다 (지금 앱과 같음) */
    const first = key === "customer" ? "asc" : "desc";
    const second = first === "asc" ? "desc" : "asc";
    const s = S.sort;
    if (!s || s.key !== key) S.sort = { key, dir: first };
    else if (s.dir === first) S.sort = { key, dir: second };
    else S.sort = null;
  }
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-act]");
    if (!e.target.closest(".pop") && !(t && /^pop-/.test(t.dataset.act))) closePop();
    if (!t) return;
    const { act } = t.dataset;
    switch (act) {
      case "side": S.sideMini = !S.sideMini; renderAll(); break;
      case "mode": S.mode = t.dataset.mode; renderAll(); document.getElementById("scroll").scrollTop = 0; break;
      case "sort": setSort(t.dataset.key); renderAll(); break;
      case "rent": S.rentOpen = !S.rentOpen; S.expanded = null; if (!S.rentOpen && /^rent/.test(curSort().key)) S.sort = null; renderAll(); break;
      case "pop-filter": openPop(t, filterPop(t.dataset.sec)); break;
      case "filter": {
        const set = S.filters[t.dataset.sec];
        if (set.has(t.dataset.val)) set.delete(t.dataset.val); else set.add(t.dataset.val);
        const sec = t.dataset.sec;
        renderAll();
        const anchor = document.querySelector(`[data-act="pop-filter"][data-sec="${sec}"]`);
        openPop(anchor, filterPop(sec));
        break;
      }
      case "filter-clear": S.filters[t.dataset.sec].clear(); renderAll(); break;
      case "reset-filters": Object.values(S.filters).forEach((s) => s.clear()); S.q = ""; document.getElementById("q").value = ""; renderAll(); break;
      case "pop-cols":
        openPop(t, `<div class="pop-title">컬럼</div>${COLUMN_OPTIONS.map(([k, l]) => `<label class="pop-check"><input type="checkbox" data-col="${k}"${S.hidden.has(k) ? "" : " checked"}>${l}</label>`).join("")}`);
        break;
      case "select": if (e.target.checked) S.selected.add(t.dataset.id); else S.selected.delete(t.dataset.id); renderAll(); break;
      case "select-all": { const ids = groups().map((g) => g.id); if (e.target.checked) ids.forEach((id) => S.selected.add(id)); else ids.forEach((id) => S.selected.delete(id)); renderAll(); break; }
      case "select-clear": S.selected.clear(); renderAll(); break;
      case "match": S.expanded = S.expanded === t.dataset.id ? null : t.dataset.id; renderTable(); break;
      case "pop-status": {
        const it = item(t.dataset.id);
        openPop(t, `<div class="pop-title">상태</div>${[["open", "진행중"], ["hold", "보류"]].map(([v, l]) => `<button type="button" class="pop-item" data-act="set-status" data-id="${it.id}" data-val="${v}"><span class="pill s-${v}"><span class="d"></span>${l}</span>${it.status === v ? `<span class="mark">선택됨</span>` : ""}</button>`).join("")}`);
        break;
      }
      case "set-status": {
        const it = item(t.dataset.id), v = t.dataset.val;
        closePop();
        if (it.status !== v) commit(`상태 변경: ${it.title}`, () => { it.status = v; });
        break;
      }
      case "pop-who": {
        const it = item(t.dataset.id);
        openPop(t, `<div class="pop-title">담당</div>${seed.users.map((u) => `<button type="button" class="pop-item" data-act="set-who" data-id="${it.id}" data-user="${u.id}">${esc(u.name)}${it.assignee === u.id ? `<span class="mark">선택됨</span>` : ""}</button>`).join("")}`);
        break;
      }
      case "set-who": {
        const it = item(t.dataset.id), u = user(t.dataset.user);
        closePop();
        if (it.assignee !== u.id) commit(`담당 변경: ${it.title} · ${u.name}`, () => { it.assignee = u.id; });
        break;
      }
      case "pop-next": {
        const it = item(t.dataset.id);
        const presets = [["오늘", 0], ["내일", 1], ["3일 뒤", 3], ["다음 주", 7]];
        openPop(t, `<div class="pop-title">다음 연락</div>${presets.map(([l, n]) => `<button type="button" class="pop-item" data-act="set-next" data-id="${it.id}" data-at="${addDays(n)}">${l}<span class="mark">${mmdd(addDays(n))}</span></button>`).join("")}<div class="pop-date"><input type="date" data-next-date="${it.id}" value="${it.next ? it.next.at.split("T")[0] : ""}" aria-label="날짜 선택"></div>`);
        break;
      }
      case "set-next": {
        const it = item(t.dataset.id);
        closePop();
        commit(`일정 변경: ${it.title} · ${mmdd(t.dataset.at)}`, () => { it.next = { at: t.dataset.at, note: it.next ? it.next.note : "" }; });
        break;
      }
      case "reset-data": {
        data = { v: seed.v, items: clone(seed.items) };
        try { localStorage.removeItem(KEY); } catch (err) { /* 무시 */ }
        S.selected.clear();
        renderAll();
        toast("시안 데이터를 처음 상태로 되돌렸습니다");
        break;
      }
      case "fake": e.preventDefault(); toast(t.dataset.msg); break;
      default: break;
    }
  });
  document.addEventListener("dblclick", (e) => {
    const t = e.target.closest("[data-dbl]");
    if (t) { S.edit = { id: t.dataset.id, field: t.dataset.field }; renderTable(); }
  });
  document.addEventListener("change", (e) => {
    if (e.target.matches("[data-col]")) {
      const k = e.target.dataset.col;
      if (e.target.checked) S.hidden.delete(k); else S.hidden.add(k);
      renderTable();
      return;
    }
    if (e.target.matches("[data-next-date]") && e.target.value) {
      const v = e.target.value, it = item(e.target.dataset.nextDate);
      closePop();
      commit(`일정 변경: ${it.title} · ${mmdd(v)}`, () => { it.next = { at: v, note: it.next ? it.next.note : "" }; });
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("[data-edit-input]")) {
      if (e.key === "Enter") { e.preventDefault(); finishEdit(true, e.target); }
      else if (e.key === "Escape") { e.preventDefault(); finishEdit(false, e.target); }
      return;
    }
    if (e.key === "Escape") { closePop(true); return; }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") { e.preventDefault(); document.getElementById("q").focus(); }
  });
  document.addEventListener("focusout", (e) => {
    if (e.target.matches("[data-edit-input]") && S.edit) finishEdit(true, e.target);
  });
  document.getElementById("q").addEventListener("input", (e) => { S.q = e.target.value.trim(); renderBars(); renderTable(); });
  renderAll();
})();
</script>
</body>
</html>
