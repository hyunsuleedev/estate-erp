<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연락처 연결 지도</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 28px;
    background: var(--background, #fff); color: var(--foreground, #171717);
    font-family: var(--font-sans, -apple-system, "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif);
    font-size: 13px; line-height: 1.55;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  .lede { color: var(--muted-foreground, #6b6b6b); margin: 0 0 12px; max-width: 70ch; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 10px; color: var(--muted-foreground, #6b6b6b); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid; background: var(--card, #fff); }
  .ln { width: 22px; height: 0; border-top: 1.5px solid var(--muted-foreground, #6b6b6b); }
  .ln.dash { border-top-style: dashed; }
  .ln.dot { border-top-style: dotted; }

  .scroll { overflow-x: auto; border-top: 1px solid var(--border, #e5e5e5); border-bottom: 1px solid var(--border, #e5e5e5); }
  svg { display: block; width: 100%; min-width: 820px; height: auto; }
  svg text { font-family: inherit; fill: var(--foreground, #171717); }
  .halo { paint-order: stroke; stroke: var(--background, #fff); stroke-width: 5px; stroke-linejoin: round; }

  .node { cursor: pointer; outline: none; }
  .node:focus-visible rect { stroke-width: 2.4; }
  .node rect { fill: var(--card, #fff); stroke: var(--border, #d4d4d4); stroke-width: 1.2; }
  .node .t { font-size: 13px; font-weight: 600; }
  .node .s { font-size: 11px; fill: var(--muted-foreground, #6b6b6b); }
  .node.person rect { stroke: var(--chart-1, #2563eb); stroke-width: 1.8; }
  .node.self rect   { stroke: var(--chart-1, #2563eb); }
  .node.link rect   { stroke: var(--chart-2, #16a34a); stroke-width: 1.6; }
  .node.link .s     { fill: var(--chart-2, #16a34a); }
  .node.target rect { stroke: var(--foreground, #171717); }
  .node.record rect { stroke: var(--chart-3, #d97706); }
  .node.mini rect   { stroke-dasharray: 3 3; }
  .node.mini .t     { font-size: 11.5px; font-weight: 500; }
  .node.sel rect    { fill: var(--muted, #f5f5f4); stroke-width: 2.4; }

  .edge { fill: none; stroke: var(--muted-foreground, #8a8a8a); stroke-width: 1.4; }
  .edge.dash { stroke-dasharray: 5 4; }
  .edge.flow { stroke-dasharray: 2 4; stroke-width: 1.2; }
  .elabel { font-size: 11px; fill: var(--muted-foreground, #6b6b6b); }
  .zone-label { font-size: 11px; font-weight: 600; fill: var(--muted-foreground, #6b6b6b); letter-spacing: .02em; }
  .flagc { fill: var(--foreground, #171717); }
  .flagt { fill: var(--background, #fff); font-size: 10px; font-weight: 700; }

  svg.focus .edge, svg.focus .elabel, svg.focus .node { opacity: .2; transition: opacity .12s; }
  svg.focus .edge.on, svg.focus .elabel.on, svg.focus .node.on { opacity: 1; }
  svg.focus .edge.on { stroke: var(--foreground, #171717); stroke-width: 2; }
  @media (prefers-reduced-motion: reduce) { svg.focus .edge, svg.focus .elabel, svg.focus .node { transition: none; } }

  .detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 4px 28px; padding: 14px 0 4px; }
  .detail h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .mono { font-family: var(--font-mono, ui-monospace, Menlo, monospace); font-size: 11px; color: var(--muted-foreground, #6b6b6b); }
  .detail p { margin: 6px 0 0; }
  .detail ul { margin: 0; padding: 0; list-style: none; }
  .detail li { padding: 3px 0; border-bottom: 1px solid var(--border, #eee); display: grid; grid-template-columns: 110px 1fr; gap: 10px; }
  .detail li:last-child { border-bottom: 0; }
  .detail li b { font-weight: 500; }
  .detail li span { color: var(--muted-foreground, #6b6b6b); }
  .warn { margin-top: 8px; padding-left: 10px; border-left: 2px solid var(--foreground, #171717); }
  .hint { color: var(--muted-foreground, #6b6b6b); font-size: 12px; margin: 8px 0 0; }
  @media (max-width: 640px) { .detail { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>연락처 연결 지도</h1>
  <p class="lede">가운데 <b>연락처</b>에서 뻗은 선을 따라가면 됩니다. 왼쪽은 사람 자체에 붙는 것, 오른쪽은 매물·의뢰·거래로 가는 길, 아래는 기록입니다. 상자를 누르면 그 상자와 이어진 선만 남고 아래에 설명이 나옵니다.</p>
  <div class="legend">
    <span><i class="sw" style="border-color:var(--chart-1,#2563eb)"></i>사람</span>
    <span><i class="sw" style="border-color:var(--chart-2,#16a34a)"></i>연결 표 (역할이 적히는 곳)</span>
    <span><i class="sw" style="border-color:var(--foreground,#171717)"></i>업무 대상</span>
    <span><i class="sw" style="border-color:var(--chart-3,#d97706)"></i>기록</span>
    <span><i class="ln"></i>DB에서 이어짐</span>
    <span><i class="ln dash"></i>비워 둘 수 있거나 글자로만 맞춤</span>
    <span><i class="ln dot"></i>업무 흐름</span>
  </div>
  <div class="scroll"><svg id="map" viewBox="0 0 970 715" role="img" aria-label="연락처와 다른 표의 연결 지도"></svg></div>
  <p class="hint">검은 번호는 구조상 애매한 곳입니다. 번호가 붙은 상자를 누르면 이유가 나옵니다. 빈 곳을 누르면 전체가 다시 보입니다.</p>
  <div class="detail" id="detail" aria-live="polite"></div>
</div>

const curve = (x1,y1,x2,y2) => { const m=(x1+x2)/2; return `M${x1} ${y1} C${m} ${y1} ${m} ${y2} ${x2} ${y2}`; };

const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('map');
const el = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };

[['사람 자체', 20, 100], ['역할이 적히는 연결', 610, 36], ['업무 대상', 815, 82], ['기록', 150, 628]].forEach(([t, x, y]) =>
  svg.appendChild(el('text', { class: 'zone-label', x, y }, t)));

EDGES.forEach((e, i) => {
  e.path = el('path', { class: 'edge' + (e.dash ? ' dash' : '') + (e.flow ? ' flow' : ''), d: e.d });
  svg.appendChild(e.path);
});
EDGES.forEach((e) => {
  if (!e.label) return;
  e.text = el('text', { class: 'elabel halo', x: e.lx, y: e.ly, 'text-anchor': e.anchor || 'middle' }, e.label);
  svg.appendChild(e.text);
});

NODES.forEach((n) => {
  const g = el('g', { class: 'node ' + n.kind, tabindex: 0, role: 'button', 'aria-label': n.title });
  g.appendChild(el('rect', { x: n.x, y: n.y, width: n.w, height: n.h, rx: n.kind === 'link' ? 14 : 7 }));
  const cx = n.x + n.w / 2;
  if (n.sub) {
    g.appendChild(el('text', { class: 't', x: cx, y: n.y + n.h / 2 - 3, 'text-anchor': 'middle' }, n.title));
    g.appendChild(el('text', { class: 's', x: cx, y: n.y + n.h / 2 + 14, 'text-anchor': 'middle' }, n.sub));
  } else {
    g.appendChild(el('text', { class: 't', x: cx, y: n.y + n.h / 2 + 4, 'text-anchor': 'middle' }, n.title));
  }
  if (n.flag) {
    g.appendChild(el('circle', { class: 'flagc', cx: n.x + n.w - 2, cy: n.y + 2, r: 8 }));
    g.appendChild(el('text', { class: 'flagt', x: n.x + n.w - 2, y: n.y + 5.5, 'text-anchor': 'middle' }, n.flag));
  }
  g.addEventListener('click', (ev) => { ev.stopPropagation(); select(n.id); });
  g.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(n.id); } });
  n.g = g; svg.appendChild(g);
});
svg.addEventListener('click', () => select(null));

const byId = Object.fromEntries(NODES.map((n) => [n.id, n]));
const detail = document.getElementById('detail');
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function select(id) {
  svg.classList.toggle('focus', !!id);
  NODES.forEach((n) => n.g.classList.remove('on', 'sel'));
  EDGES.forEach((e) => { e.path.classList.remove('on'); if (e.text) e.text.classList.remove('on'); });
  const n = byId[id || 'contact'];
  if (id) {
    n.g.classList.add('on', 'sel');
    EDGES.forEach((e) => {
      if (e.a !== id && e.b !== id) return;
      e.path.classList.add('on'); if (e.text) e.text.classList.add('on');
      byId[e.a].g.classList.add('on'); byId[e.b].g.classList.add('on');
    });
  }
  const linked = EDGES.filter((e) => e.a === n.id || e.b === n.id).map((e) => byId[e.a === n.id ? e.b : e.a].title);
  detail.innerHTML =
    `<div><h2>${esc(n.title)}</h2><div class="mono">${esc(n.model)}</div><p>${esc(n.desc)}</p>` +
    (n.warn ? `<p class="warn"><b>애매한 곳 ${n.flag}.</b> ${esc(n.warn)}</p>` : '') + `</div>` +
    `<ul>` + n.fields.map(([k, v]) => `<li><b>${esc(k)}</b><span>${esc(v)}</span></li>`).join('') +
    `<li><b>이어진 곳</b><span>${esc([...new Set(linked)].join(' · '))}</span></li></ul>`;
}
select(null);
</script>
</body>
</html>
