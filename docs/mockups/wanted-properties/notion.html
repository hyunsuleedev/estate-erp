<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>희망매물 — Notion형 시안</title>
<!--
  희망매물(/wanted-properties) Notion형 시안. 2026-11-16.
  - 위쪽: 문서관리와 같은 보기 탭 + 도구 줄(필터 줄 접기 · 검색 · 표시 설정 · 보기 전환 · 매칭 생성), 아이콘 칩 필터 줄.
    필터 종류와 규칙(단계 · 지역·단지 · 매물 유형 · 예산 · 월세 · 희망 평형 · 상태 · 담당자 · 긴급도 · 입주 희망일)은 지금과 같다.
  - 고객별: 고객(희망 조건) 줄을 펼치면 그 아래에 "표 안의 표"가 나온다. 매물관리에서 매물 줄을 펼쳤을 때의
    "연결 구매고객" 패널을 뒤집은 구조다: 들여 쓴 흰 바탕, 자체 머리글과 칸 세로선, 거래 전환된 매물이 맨 위,
    맨 아래 "매물 연결" 줄, 접혀 있는 "종료 n건" (사용자 의견 2026-11-16).
    그 패널의 머리 탭(연결 구매고객 ↔ 광고)은 패널이 둘이라 있는 것이어서 여기에는 두지 않았다. 정렬 · 열 너비 조절 · 줄 선택도
    지금 희망매물에 없던 기능이라 옮기지 않았다.
  - 메모는 칸에 넣지 않고 줄 아래 한 줄 전체로 둔다 (사용자 의견 2026-11-16): 고객 메모는 펼친 자리의 첫 줄,
    매칭 메모는 매물 줄 바로 아래. 매칭 메모는 그 자리에서 눌러 고치고, 메모가 없는 줄은 올리면 나오는 "메모"로 추가한다.
  - 단계는 매물관리 연결 구매고객 표와 같은 알약 + 선택 메뉴(막힌 단계는 이유를 알려 준다).
    알약 옆 자리에는 지금 가장 필요한 것 하나만 둔다: 방문 일정 › 거래 단계 › 종료 사유 › n/6.
  - 매칭 상세는 가운데 창 대신 옆 패널. 진행 경로 · 다음 작업 · 방문 일정 · 메모 · 상담 기록 · 후속 태스크.
  - 단계별: 상자 없이 한 표 안의 묶음.
  치수는 매물관리 표 · 문서관리 목록에서 쓰는 Notion 실측값, 색은 app.css 토큰 값이다. 데이터는 모두 가상이다.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --fg: #2c2c2b;
    --fg-sub: #5f5e59;
    --muted: #79766f;
    --icon: #8e8b86;
    --faint: #a3a09a;
    --line: #f0efed;
    --line-strong: #e6e5e3;
    --side: #f9f8f7;
    --hover: rgba(33, 27, 23, 0.05);
    --hover-soft: rgba(33, 27, 23, 0.03);
    --row-hover: #f9f8f7;
    --row-on: #f2f7fd;
    --ring: #2383e2;
    --success: #0f7b6c; --success-soft: #dbeddb;
    --warning: #cb912f; --warning-strong: #8a5a13; --warning-soft: #fdecc8;
    --info: #2383e2; --info-strong: #1b64b1; --info-soft: #d3e5ef;
    --violet: #6940a5; --violet-soft: #e8deee;
    --orange: #d9730d; --orange-strong: #9c4f09; --orange-soft: #fadec9; /* orange-strong은 토큰에 없는 진한 글자색 */
    --red: #e03e3e; --red-strong: #bb3430; --red-soft: #ffe2dd;
    --neutral-soft: #f1f1ef;
    --pop: 0 20px 24px rgba(25, 25, 25, 0.05), 0 5px 8px rgba(25, 25, 25, 0.027), 0 0 0 1px rgba(42, 28, 0, 0.07);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
      "Apple SD Gothic Neo", "Segoe UI", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--fg); background: #fff;
    font-size: 14px; line-height: 21px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
  button:disabled { cursor: not-allowed; }
  input, textarea, select { font: inherit; color: inherit; }
  dl, dd, dt, h2, h3, h4, p { margin: 0; }
  :focus-visible { outline: 2px solid rgba(35, 131, 226, 0.55); outline-offset: -2px; }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
  .tr { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .faint { color: var(--faint); }
  .sub { color: var(--fg-sub); }
  .grow { flex: 1; }

  /* ── 시안 조작 띠 (앱 화면이 아님) ── */
  .demo-bar { display: flex; align-items: center; gap: 18px; flex: none; padding: 8px 16px; background: #2c2c2b; color: #d9d7d2; font-size: 12.5px; white-space: nowrap; }
  .demo-bar b { color: #fff; font-weight: 600; }
  .demo-seg { display: inline-flex; gap: 2px; background: rgba(255,255,255,.1); border-radius: 6px; padding: 2px; }
  .demo-seg button { padding: 3px 10px; border-radius: 4px; color: #d9d7d2; }
  .demo-seg button[aria-pressed="true"] { background: #fff; color: #2c2c2b; font-weight: 600; }
  .demo-note { margin-left: auto; color: #a3a09a; overflow: hidden; text-overflow: ellipsis; }

  /* ── 앱 틀 (고정 그림) ── */
  .app { flex: 1; min-height: 0; display: flex; }
  .side { width: 256px; flex: none; background: var(--side); border-right: 1px solid var(--line); padding: 10px 8px; overflow: hidden; }
  .side .office { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; margin-bottom: 4px; font-weight: 600; }
  .side .office i { width: 22px; height: 22px; border-radius: 5px; background: var(--fg); color: #fff; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; }
  .side .grp { margin: 14px 8px 4px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .side .nav { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 6px; color: var(--fg-sub); }
  .side .nav svg { color: var(--icon); }
  .side .nav.on { background: #eeedec; color: var(--fg); font-weight: 500; }
  .side .nav.on svg { color: var(--fg-sub); }
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .tabstrip { height: 36px; flex: none; display: flex; align-items: flex-end; gap: 2px; padding: 0 8px; background: var(--side); border-bottom: 1px solid var(--line); }
  .tabstrip .t { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px 8px 0 0; font-size: 13px; color: var(--muted); }
  .tabstrip .t svg { width: 14px; height: 14px; }
  .tabstrip .t.on { height: 31px; margin-bottom: -1px; background: #fff; color: var(--fg); font-weight: 500; border: 1px solid var(--line); border-bottom-color: #fff; }
  .page { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; background: #fff; overflow: hidden; }

  /* ── 보기 탭 + 도구 줄 ── */
  .viewbar { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 4px 16px 0; }
  .tabs { display: flex; align-items: center; gap: 2px; margin-left: -4px; flex: none; }
  .vtab { height: 32px; padding: 0 12px; border-radius: 20px; font-size: 14px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; transition: background-color .12s, color .12s; }
  .vtab:hover, .vtab[aria-selected="true"] { background: var(--hover); color: var(--fg); }
  .tools { margin-left: auto; display: flex; align-items: center; gap: 2px; min-width: 0; }
  .tool { width: 28px; height: 28px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; color: var(--muted); flex: none; transition: background-color .12s, color .12s; }
  .tool:hover, .tool[aria-expanded="true"] { background: var(--hover); color: var(--fg); }
  .tool.count { width: auto; padding: 0 6px; color: var(--info); font-size: 13px; font-weight: 500; }
  .tool.count:hover { color: var(--info); }
  .sep { width: 1px; height: 16px; margin: 0 6px; background: var(--line-strong); flex: none; }
  .search { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 6px; border-radius: 6px; min-width: 0; }
  .search:focus-within { background: rgba(33, 27, 23, 0.04); }
  .search > svg { color: var(--muted); }
  .search input { width: 216px; min-width: 60px; height: 28px; border: 0; outline: 0; background: transparent; font-size: 14px; }
  .search input::placeholder { color: var(--muted); }
  .search .clr { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; visibility: hidden; }
  .search.has .clr { visibility: visible; }
  .search .clr:hover { background: rgba(33, 27, 23, 0.08); color: var(--fg); }
  .search .clr svg { width: 12px; height: 12px; }
  .seg { display: flex; height: 30px; padding: 2px; gap: 1px; border-radius: 15px; background: rgba(55, 53, 47, 0.08); flex: none; }
  .seg button { height: 26px; padding: 0 12px; border-radius: 13px; font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .seg button svg { width: 14px; height: 14px; }
  .seg button:hover { color: var(--fg); }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--fg); font-weight: 500; box-shadow: 0 1px 2px rgba(40, 35, 25, 0.12); }
  .btn-primary { height: 30px; margin-left: 8px; padding: 0 12px 0 10px; border-radius: 8px; background: var(--fg); color: #fff; font-size: 13.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; flex: none; white-space: nowrap; }
  .btn-primary:hover { background: #000; }
  .btn-primary svg { width: 14px; height: 14px; }

  /* ── 필터 줄 ── */
  .filters { flex: none; display: flex; align-items: flex-start; gap: 8px; padding: 0 16px 6px; }
  .chips { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-left: -2px; }
  .chip { display: inline-flex; align-items: center; height: 28px; max-width: 280px; border-radius: 14px; font-size: 13px; color: #6f6c66; transition: background-color .12s, color .12s; }
  .chip:hover, .chip.open { background: rgba(60, 52, 40, 0.06); color: var(--fg); }
  .chip .main { display: inline-flex; align-items: center; gap: 6px; height: 100%; min-width: 0; padding: 0 10px; border-radius: 14px; white-space: nowrap; }
  .chip svg.i { width: 14px; height: 14px; color: var(--faint); }
  .chip svg.cv { width: 12px; height: 12px; color: #a5a39f; }
  .chip.on { background: rgba(35, 131, 226, 0.1); color: #2383e2; }
  .chip.on:hover { background: rgba(35, 131, 226, 0.15); color: #2383e2; }
  .chip.on .main { padding: 0 4px 0 10px; }
  .chip.on svg.i { color: currentColor; }
  .chip.on b { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .chip .x { width: 22px; height: 22px; margin-right: 3px; border-radius: 50%; display: grid; place-items: center; color: #2383e2; flex: none; }
  .chip .x:hover { background: rgba(35, 131, 226, 0.18); }
  .chip .x svg { width: 12px; height: 12px; color: currentColor; }
  .ghost { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; font-size: 12.5px; color: var(--muted); flex: none; white-space: nowrap; }
  .ghost:hover { background: rgba(55, 53, 47, 0.08); color: var(--fg); }
  .ghost svg { width: 14px; height: 14px; }

  /* ── 표 ── */
  .scroller { flex: 1; min-height: 0; overflow: auto; }
  .scroller::-webkit-scrollbar { width: 10px; height: 10px; }
  .scroller::-webkit-scrollbar-thumb { background: rgba(55, 53, 47, 0.16); border-radius: 5px; border: 2px solid #fff; }
  .row { display: grid; grid-template-columns: var(--cols); outline: 0; }
  .cell { min-width: 0; min-height: 37px; padding: 7.5px 8px; display: flex; align-items: flex-start; gap: 6px; white-space: nowrap; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); background: #fff; font-size: 14px; font-weight: 450; line-height: 21px; }
  .row > .cell:last-child { border-right: 0; }
  .cell.wrap { display: block; white-space: normal; word-break: keep-all; overflow-wrap: anywhere; }
  .cell.strong { font-weight: 500; }
  .pinA, .pinB, .pinC { position: sticky; z-index: 2; }
  .pinA { left: 0; } .pinB { left: 28px; } .pinC { left: 64px; }
  .pinP { position: sticky; left: calc(28px + var(--name-w)); z-index: 2; }
  .hd { position: sticky; top: 0; z-index: 5; }
  .hd .cell { height: 37px; min-height: 0; padding: 0 8px; align-items: center; border-top: 1px solid var(--line); font-size: 13px; font-weight: 400; color: var(--muted); white-space: nowrap; }
  .hd .cell > svg.i { color: var(--icon); }
  .hd .cell.sel { padding: 0; }
  .row:not(.hd):hover > .cell { background: var(--row-hover); }
  .row.selected > .cell, .row.current > .cell { background: var(--row-on); }
  .row:focus-visible > .cell { background: var(--row-hover); box-shadow: inset 0 1px 0 rgba(35,131,226,.5), inset 0 -1px 0 rgba(35,131,226,.5); }
  .row.child, .row.srow { cursor: default; }
  .row.flash > .cell { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: #fff6dd; } to { background: #fff; } }

  .cell.sel { padding: 7px 0 0; justify-content: center; border-right: 0; }
  .cbx { width: 28px; height: 22px; display: grid; place-items: center; border-radius: 4px; }
  .sel .cbx, .ghead .cbx { opacity: 0; transition: opacity .1s; }
  .row:hover .sel .cbx, .ghead:hover .cbx, .cbx:focus-visible, .cbx[aria-checked="true"], .cbx[aria-checked="mixed"], .any-sel .cbx { opacity: 1; }
  .cb { width: 14px; height: 14px; border-radius: 3px; box-shadow: inset 0 0 0 1.5px #c5c3bd; background: #fff; display: inline-grid; place-items: center; flex: none; }
  .cb svg { grid-area: 1 / 1; width: 10px; height: 10px; fill: none; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
  .cb.on, .cb.mixed { background: var(--ring); box-shadow: none; }
  .cb.on svg { opacity: 1; }
  .cb.mixed::after { content: ''; grid-area: 1 / 1; width: 8px; height: 2px; border-radius: 1px; background: #fff; }

  .cell.name { gap: 4px; padding: 6px 8px 6px 4px; overflow: hidden; }
  .hd .cell.name { padding: 0 8px 0 4px; }
  .tw { width: 22px; height: 22px; margin-top: 1px; border-radius: 4px; display: grid; place-items: center; color: var(--icon); flex: none; }
  .hd .tw { margin-top: 0; }
  button.tw:hover { background: var(--hover); color: var(--fg); }
  .tw svg { width: 14px; height: 14px; transition: transform .12s; }
  .tw[aria-expanded="true"] svg { transform: rotate(90deg); }
  .who { display: inline-flex; align-items: center; gap: 6px; min-width: 0; height: 24px; padding: 0 8px 0 2px; border-radius: 12px; font-weight: 500; transition: background-color .12s; }
  .who:hover { background: rgba(35, 131, 226, 0.09); }
  .who .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .av { width: 20px; height: 20px; border-radius: 50%; background: var(--info-soft); color: var(--info-strong); font-size: 11px; font-weight: 500; font-style: normal; line-height: 1; display: grid; place-items: center; flex: none; }
  .urgent { margin-top: 1.5px; font-size: 11px; font-weight: 500; color: var(--red); flex: none; }
  .tag { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 4px; font-size: 13px; line-height: 20px; white-space: nowrap; flex: none; }
  .tag.hold { margin-top: 2px; background: var(--neutral-soft); color: var(--muted); font-size: 12px; }
  .tag.success { background: var(--success-soft); color: var(--success); }
  .tag.warning { background: var(--warning-soft); color: var(--warning-strong); }
  .tag.gray { background: var(--neutral-soft); color: var(--fg-sub); }
  .tag.info { background: var(--info-soft); color: var(--info-strong); }
  .tag.violet { background: var(--violet-soft); color: var(--violet); }

  /* 고객 줄 아래 펼침: 표 안의 표. 매물관리에서 매물 줄을 펼쳤을 때의 "연결 구매고객" 패널과 같은 구조다
     (들여 쓴 흰 바탕 · 자체 머리글 · 칸 세로선 · 맨 아래 연결 줄 · 접힌 종료 묶음). 가로로 굴려도 보이는 폭 안에 머문다. */
  .nest { border-bottom: 1px solid var(--line); background: #fff; }
  .nest-in { position: sticky; left: 60px; width: calc(var(--view-w, 100vw) - 76px); margin-left: 60px; padding: 4px 0 12px; }
  .cmemo { display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 0 8px; padding: 4px 8px 6px; }
  .cmemo dt { font-size: 13px; color: var(--muted); }
  .cmemo dd { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg-sub); }
  .mtwrap { overflow-x: auto; }
  .mt .row.mhd > .cell { height: 36px; min-height: 0; padding: 0 8px; align-items: center; border-right: 0; background: #fff; font-size: 13px; font-weight: 400; color: var(--muted); }
  .mt .row.mhd > .cell > svg.i { color: var(--icon); }
  .madd { display: flex; align-items: center; gap: 6px; width: 100%; height: 34px; padding: 0 8px; border-radius: 4px; color: #a19e99; font-size: 14px; }
  .madd:hover, .madd:focus-visible { background: rgba(33, 27, 23, 0.03); color: var(--muted); }
  .madd svg { width: 14px; height: 14px; }
  .mclosed { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 8px 0 5px; border-radius: 4px; font-size: 13px; color: var(--muted); }
  .mclosed:hover { color: var(--fg); }
  .mclosed svg { width: 12px; height: 12px; transition: transform .12s; }
  .mclosed[aria-expanded="true"] svg { transform: rotate(90deg); }
  .mdiv { display: flex; align-items: flex-end; height: 30px; padding: 0 8px 6px; border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--faint); }
  /* 매물 한 줄 + 그 아래 메모 한 줄이 한 항목이다: 함께 밝아지고, 둘 사이에는 선을 긋지 않는다 */
  .mgrp:hover > .row > .cell { background: var(--row-hover); }
  .mgrp.has-memo > .row > .cell { border-bottom-color: transparent; }
  .ttl { display: flex; align-items: baseline; gap: 5px; min-width: 0; flex: 0 1 auto; }
  .ttl .site { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ttl .du { flex: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .plain { color: var(--muted); }
  .dim > .cell, .dim .ttl, .dim .plain { color: var(--muted); }
  .fit { flex: 0 999 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted); }
  .fit.over { color: var(--red-strong); }
  .addr { flex: 1 1 0; font-size: 13px; }
  .hasacts { position: relative; overflow: hidden; }

  /* 행에 올리면 뜨는 열기 · 작업 버튼 (Notion 표의 "열기") */
  .acts { position: absolute; right: 4px; top: 7px; z-index: 3; display: none; align-items: center; gap: 1px; padding: 2px; border-radius: 6px; background: #fff; box-shadow: 0 8px 12px rgba(25,25,25,.027), 0 2px 6px rgba(25,25,25,.027), 0 0 0 1px rgba(42,28,0,.07); }
  .row:hover .acts, .row:focus-within .acts, .mgrp:hover .acts, .acts.keep { display: flex; }
  .acts button { height: 20px; padding: 0 4px; border-radius: 4px; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; letter-spacing: .5px; color: #7d7a75; white-space: nowrap; }
  .acts button:hover { background: rgba(33, 27, 23, 0.051); }
  .acts svg.i { width: 14px; height: 14px; }
  .acts svg.pki { width: 15.25px; height: 20px; color: var(--icon); flex: none; }

  .trade { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 4px; font-size: 14px; font-weight: 450; line-height: 20px; white-space: nowrap; flex: none; }
  .trade.sale { background: #fdebec; color: #8f4b46; }
  .trade.jeonse { background: #e7f3f8; color: #337ea9; }
  .trade.monthly { background: #fbf3db; color: #8f6b1f; }
  .cell > .trade, .cell > .pill { margin-top: .5px; }

  /* 단계 색: 바탕(--tb) · 글자(--tf) · 점(--dot). 알약과 옆 패널의 진행 경로가 함께 쓴다 */
  .gray { --tb: #f1f1ef; --tf: #5f5e59; --dot: #a3a09a; }
  .info { --tb: var(--info-soft); --tf: var(--info-strong); --dot: var(--info); }
  .orange { --tb: var(--orange-soft); --tf: var(--orange-strong); --dot: var(--orange); }
  .violet { --tb: var(--violet-soft); --tf: var(--violet); --dot: var(--violet); }
  .warning { --tb: var(--warning-soft); --tf: var(--warning-strong); --dot: var(--warning); }
  .success { --tb: var(--success-soft); --tf: var(--success); --dot: var(--success); }
  .destructive { --tb: var(--red-soft); --tf: var(--red-strong); --dot: var(--red); }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 9px 0 7px; border-radius: 10px; background: var(--tb); color: var(--tf); font-size: 14px; font-weight: 450; line-height: 20px; white-space: nowrap; flex: none; }
  .pill::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); flex: none; }
  .pill.dim { --tb: #f1f1ef; --tf: var(--muted); --dot: #b9b6b0; }

  .cell.stage { padding: 0; }
  .stagebtn { display: flex; align-items: center; gap: 6px; width: 100%; min-width: 0; min-height: 36px; padding: 0 8px; overflow: hidden; }
  .stagebtn:hover { background: rgba(44, 44, 43, 0.035); }
  .stagebtn[aria-expanded="true"], .stagebtn:focus-visible { outline: 0; box-shadow: inset 0 0 0 2px #2383e2; }
  .stagebtn.as-prop { width: auto; min-height: 28px; margin-left: -6px; padding: 0 6px; border-radius: 6px; }
  .aux { flex: none; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .aux.visit { display: inline-flex; align-items: center; gap: 3px; color: var(--info-strong); }
  .aux.visit svg { width: 12px; height: 12px; }
  .aux.deal { color: var(--success); }
  .aux.reason { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  .sum { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: var(--fg-sub); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .sum span { display: inline-flex; align-items: center; gap: 5px; }
  .sum i { width: 6px; height: 6px; border-radius: 50%; background: var(--dot); }
  .none { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .linkbtn { display: inline-flex; align-items: center; gap: 3px; height: 22px; margin-top: -.5px; padding: 0 6px 0 4px; border-radius: 4px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .linkbtn:hover { background: var(--hover); color: var(--fg); }
  .linkbtn svg { width: 13px; height: 13px; }
  .cell.match { position: relative; }
  .addbtn { position: absolute; right: 6px; top: 7px; width: 22px; height: 22px; border-radius: 4px; display: none; place-items: center; background: #fff; color: var(--muted); box-shadow: 0 2px 6px rgba(25,25,25,.03), 0 0 0 1px rgba(42,28,0,.07); }
  .row:hover .addbtn, .row:focus-within .addbtn { display: grid; }
  .addbtn:hover { background: #f6f5f4; color: var(--fg); }
  .addbtn svg { width: 14px; height: 14px; }

  /* 메모는 칸에 넣지 않는다. 줄 바로 아래에 한 줄 전체를 차지하고(끝까지 읽힌다), 눌러서 그 자리에서 고친다. */
  .mmemo { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 8px; padding: 0 12px 7px 8px; border-bottom: 1px solid var(--line); background: #fff; cursor: text; }
  .mmemo.flat { position: sticky; left: 0; width: var(--view-w, 100%); padding-left: 72px; }
  .mmemo .lbl { font-size: 13px; line-height: 21px; color: var(--muted); }
  .row.current + .mmemo, .row.selected + .mmemo { background: var(--row-on); }
  .mgrp:hover > .mmemo { background: var(--row-hover); }
  .memobtn { display: block; width: calc(100% + 8px); min-height: 21px; margin: 0 -4px; padding: 0 4px; border-radius: 3px; cursor: text; text-align: left; }
  .memobtn:hover { background: rgba(44, 44, 43, 0.045); }
  .clamp { display: block; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg-sub); }
  .row.dim + .mmemo .clamp { color: var(--muted); }
  .clamp.ph { color: var(--faint); }
  /* 고치는 칸은 떠 있지 않고 메모가 있던 자리에 그대로 놓인다. 쓰는 만큼 아래로 늘어난다. */
  .memoedit { display: block; width: calc(100% + 8px); min-height: 21px; margin: 0 -4px; padding: 0 4px; border: 0; outline: 0; resize: none; overflow: hidden; border-radius: 3px; background: #fff; font-size: 14px; font-weight: 450; line-height: 21px; box-shadow: 0 0 0 2px rgba(35, 131, 226, 0.57); }

  /* 단계별 묶음 머리 */
  .ghead { border-bottom: 1px solid var(--line); background: #fff; }
  .ghead .in { position: sticky; left: 0; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 4px 8px 0 0; }
  .ghead .cnt { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ghead + .ghead, .mgrp + .ghead { margin-top: 6px; }

  .addrow { position: sticky; left: 0; display: flex; align-items: center; gap: 8px; width: 100%; height: 36px; padding: 0 8px 0 32px; color: #a19e99; font-size: 14px; }
  .addrow:hover, .addrow:focus-visible { background: rgba(33, 27, 23, 0.03); color: var(--muted); }
  .addwrap { border-bottom: 1px solid var(--line); }
  .empty { position: sticky; left: 0; width: min(100%, 100vw - 256px); padding: 56px 16px; text-align: center; color: var(--muted); }
  .empty .btn { margin-top: 12px; }

  .selbar { flex: none; display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 16px; border-top: 1px solid var(--line); font-size: 12.5px; }
  .selbar b { font-weight: 500; }
  .selbar button { margin-left: auto; font-size: 12px; color: var(--muted); }
  .selbar button:hover { text-decoration: underline; text-underline-offset: 2px; }
  .foot { flex: none; display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ── 버튼 · 입력 ── */
  .btn { height: 30px; padding: 0 12px; border-radius: 6px; font-size: 13.5px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; flex: none; }
  .btn svg { width: 14px; height: 14px; }
  .btn.dark { background: var(--fg); color: #fff; }
  .btn.dark:hover { background: #000; }
  .btn.dark:disabled { opacity: .38; }
  .btn.line { box-shadow: inset 0 0 0 1px var(--line-strong); }
  .btn.line:hover { background: var(--hover-soft); }
  .btn.quiet { padding: 0 8px; font-weight: 400; color: var(--muted); }
  .btn.quiet:hover { background: var(--red-soft); color: var(--red-strong); }
  .btn.danger { background: var(--red); color: #fff; }
  .btn.danger:hover { background: #cf3636; }
  .field { height: 32px; padding: 0 10px; border: 0; outline: 0; border-radius: 6px; background: #fff; font-size: 14px; box-shadow: inset 0 0 0 1px var(--line-strong); }
  .field:focus { box-shadow: inset 0 0 0 2px rgba(35, 131, 226, 0.6); }
  textarea.field { height: auto; padding: 7px 10px; line-height: 21px; resize: vertical; }
  .field.bad { box-shadow: inset 0 0 0 2px rgba(224, 62, 62, 0.55); }
  .err { margin-top: 8px; font-size: 12.5px; line-height: 19px; color: var(--red-strong); }

  /* ── 옆 상세 패널 ── */
  .peek { position: absolute; top: 0; right: 0; bottom: 0; z-index: 20; width: 560px; max-width: calc(100% - 72px); display: flex; flex-direction: column; background: #fff; border-left: 1px solid var(--line-strong); box-shadow: -2px 0 8px rgba(0, 0, 0, 0.03); }
  .peek:focus { outline: 0; }
  .peek.in { animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .peek.in, .toast, .row.flash > .cell { animation: none; } }
  .peek-bar { height: 44px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 12px; }
  .peek-bar .tool svg { width: 18px; height: 18px; stroke-width: 1.6; }
  .peek-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 24px 48px; }
  .peek h2 { font-size: 22px; font-weight: 700; line-height: 1.3; letter-spacing: -.01em; word-break: keep-all; }
  .peek .where { margin-top: 2px; font-size: 13px; color: var(--muted); }
  .props { margin-top: 14px; }
  .prop { display: grid; grid-template-columns: 104px minmax(0, 1fr); align-items: center; gap: 8px; min-height: 34px; }
  .prop dt { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
  .prop dt svg { color: var(--icon); }
  .prop dd { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; min-width: 0; }
  .prop.top { align-items: start; } .prop.top dt, .prop.top dd { padding-top: 6.5px; }
  .sec { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
  .sec h3 { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
  .sec h3 .n { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sec h3 .linkbtn { margin: 0 -6px 0 auto; font-weight: 400; }
  .sec .props { margin-top: 6px; }
  .hint { font-size: 12.5px; line-height: 19px; color: var(--muted); }
  .path { display: flex; gap: 2px; margin-top: 12px; }
  .step { flex: 1 1 0; min-width: 0; height: 44px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 1px; padding: 0 8px 0 18px; font-size: 12px; line-height: 15px; background: rgba(44, 44, 43, 0.035); color: rgba(121, 118, 111, 0.72); clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%, 10px 50%); }
  .step:first-child { padding-left: 10px; border-radius: 5px 0 0 5px; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%); }
  .step:last-child { border-radius: 0 5px 5px 0; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 10px 50%); }
  .step b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: inherit; }
  .step small { min-height: 13px; font-size: 11px; line-height: 13px; opacity: .8; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .step.done { background: rgba(44, 44, 43, 0.07); color: var(--muted); }
  .step.cur { flex-grow: 1.5; background: var(--tb); color: var(--tf); font-weight: 600; }
  .step.fail { background: var(--red-soft); color: var(--red-strong); font-weight: 600; }
  .step.blocked { opacity: .55; cursor: not-allowed; }
  button.step:hover { filter: brightness(.96); }
  .guide { margin-top: 14px; font-size: 14px; font-weight: 600; }
  .alert { display: flex; gap: 8px; margin-top: 10px; padding: 8px 12px; border-radius: 6px; background: var(--warning-soft); color: var(--warning-strong); font-size: 12.5px; line-height: 19px; }
  .alert svg { width: 14px; height: 14px; margin-top: 2.5px; }
  .sublabel { margin: 14px 0 6px; font-size: 12px; color: var(--muted); }
  .inline { display: flex; align-items: center; gap: 8px; }
  .actrow { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .pmemo { display: block; width: calc(100% + 16px); min-height: 34px; margin: 6px -8px 0; padding: 6.5px 8px; border-radius: 6px; white-space: pre-wrap; cursor: text; }
  .pmemo:hover { background: var(--hover-soft); }
  .pmemo.ph { color: var(--faint); }
  .pmemo-edit { display: block; width: calc(100% + 16px); margin: 6px -8px 0; }
  .log { margin-top: 8px; }
  .log li { list-style: none; padding: 7px 0; }
  .log ul, ul.log { margin: 8px 0 0; padding: 0; }
  .log .meta { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .log .meta .tag { height: 18px; font-size: 12px; line-height: 18px; }
  .form { display: grid; gap: 8px; margin-top: 10px; padding: 12px; border-radius: 8px; background: var(--side); }
  .form .inline { justify-content: flex-end; }
  .form select.field { padding: 0 8px; }

  /* ── 떠 있는 판 · 메뉴 ── */
  /* 판은 알림(#toasts, 90)보다 위에 둔다. 방금 연 메뉴의 아래쪽이 남아 있던 알림에 가려지면 안 보이는 항목을 누르게 된다. 창(.scrim)이 열릴 때는 판을 먼저 닫으므로 서로 겹치지 않는다. */
  .pop { position: fixed; z-index: 95; max-height: calc(100vh - 16px); overflow: auto; border-radius: 8px; background: #fff; box-shadow: var(--pop); }
  .menu { width: 240px; padding: 0; }
  .menu .grp { padding: 4px; }
  .menu .grp + .grp { border-top: 1px solid var(--line); }
  .menu .lbl { padding: 4px 8px; font-size: 12px; font-weight: 500; line-height: 18px; color: var(--muted); }
  .mi { display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 8px; border-radius: 6px; font-size: 14px; font-weight: 450; white-space: nowrap; }
  .mi:hover, .mi:focus-visible { outline: 0; background: rgba(33, 27, 23, 0.055); }
  .mi > svg.i { width: 14px; height: 14px; color: var(--muted); }
  .mi > svg.pki { width: 13px; height: 17px; color: var(--icon); flex: none; }
  .mi .end { margin-left: auto; display: inline-flex; color: var(--muted); }
  .mi .end svg { width: 14px; height: 14px; }
  .mi.red { color: var(--red-strong); }
  .mi.red > svg.i { color: currentColor; }
  .mi[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
  .mi.blocked .pill { opacity: .45; }
  .why { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12px; line-height: 18px; color: var(--muted); }
  .panel { padding: 4px; }
  .find { display: flex; align-items: center; gap: 6px; height: 34px; margin: -4px -4px 4px; padding: 0 12px; border-bottom: 1px solid var(--line); color: var(--muted); }
  .find svg { width: 14px; height: 14px; }
  .find input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 13.5px; }
  .find input::placeholder { color: var(--muted); }
  .opts { max-height: 288px; overflow: auto; }
  .opt { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 30px; padding: 4px 8px; border-radius: 6px; font-size: 13.5px; }
  .opt:hover, .opt:focus-visible { outline: 0; background: rgba(33, 27, 23, 0.055); }
  .opt .kind { margin-left: auto; font-size: 12px; color: var(--faint); }
  .opt .pill { font-size: 13.5px; }
  .nomatch { padding: 14px 8px; text-align: center; font-size: 13px; color: var(--muted); }
  .pft { display: flex; align-items: center; justify-content: space-between; margin: 4px -4px -4px; padding: 6px 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .pft button:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 2px; }
  .range { width: 316px; padding: 14px; }
  .range h4 { font-size: 14px; font-weight: 600; }
  .range .hint { margin: 2px 0 12px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .presets button { height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12.5px; color: var(--fg-sub); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .presets button:hover { background: var(--hover-soft); }
  .presets button[aria-pressed="true"] { background: rgba(35, 131, 226, 0.1); color: #2383e2; font-weight: 500; box-shadow: none; }
  .minmax { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .minmax .field { flex: 1; width: 0; }
  .range .ft { display: flex; justify-content: flex-end; gap: 6px; margin-top: 14px; }

  /* ── 창 ── */
  .scrim { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 24px; background: rgba(15, 15, 15, 0.4); }
  .dlg { width: min(780px, 100%); max-height: calc(100vh - 48px); display: flex; flex-direction: column; border-radius: 12px; background: #fff; box-shadow: 0 24px 48px rgba(15, 15, 15, 0.18), 0 0 0 1px rgba(42, 28, 0, 0.07); }
  .dlg.sm { width: min(460px, 100%); }
  .dlg header { padding: 18px 20px 0; }
  .dlg h2 { font-size: 16px; font-weight: 600; }
  .dlg header p { margin-top: 4px; font-size: 13px; line-height: 20px; color: var(--muted); }
  .dlg .body { min-height: 0; overflow: auto; padding: 16px 20px 4px; }
  .dlg footer { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 14px 20px 16px; }
  .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .lab { display: block; font-size: 13px; font-weight: 500; color: var(--fg-sub); }
  .lab em { font-style: normal; color: var(--red); }
  .lab + .box, .lab > .field { margin-top: 6px; }
  .lab > .field { display: block; width: 100%; font-weight: 400; color: var(--fg); }
  .box { border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line-strong); overflow: hidden; }
  .box .find { margin: 0; }
  .box .list { height: 244px; overflow: auto; padding: 4px; }
  .pk { display: grid; gap: 1px; width: 100%; padding: 6px 8px; border-radius: 6px; }
  .pk:hover { background: var(--hover-soft); }
  .pk[aria-selected="true"] { background: rgba(35, 131, 226, 0.1); }
  .pk[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
  .pk .l1 { display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 500; }
  .pk .l1 .trade { height: 18px; font-size: 12.5px; line-height: 18px; }
  .pk .l2 { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12.5px; line-height: 18px; color: var(--muted); }
  .fixed { padding: 10px 12px; }
  .kv { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px 8px; align-items: center; }
  .kv dt { color: var(--muted); }
  .dlg .alert { margin: 12px 0 0; }
  .dlg .hint { margin-top: 12px; }
  .amount { display: grid; gap: 10px; margin-top: 16px; }
  .amount .eq { margin-top: 4px; font-size: 12.5px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ── 알림 ── */
  #toasts { position: fixed; right: 20px; bottom: 20px; z-index: 90; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none; }
  .toast { display: flex; align-items: flex-start; gap: 10px; max-width: 400px; padding: 10px 12px 10px 14px; border-radius: 8px; background: #fff; font-size: 13.5px; box-shadow: 0 8px 24px rgba(15, 15, 15, 0.12), 0 0 0 1px rgba(42, 28, 0, 0.07); animation: rise .16s ease-out; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  .toast .ti { margin-top: 2.5px; color: var(--success); }
  .toast.warn .ti { color: var(--warning); }
  .toast small { display: block; font-size: 12.5px; line-height: 19px; color: var(--muted); }
  .toast { pointer-events: auto; }   /* 알림 밑의 안 보이는 것이 눌리지 않게. 알림 사이 빈틈(#toasts)만 통과시킨다 */
  .toast button { margin: -2px 0; padding: 2px 8px; border-radius: 4px; font-size: 13px; font-weight: 500; color: var(--info-strong); white-space: nowrap; }
  .toast button:hover { background: rgba(35, 131, 226, 0.1); }

      }).join('')}
    </div></div>
    <div class="nstatus num">희망 조건 ${groups.length}건 · 매칭 ${matches().length}건</div>
  </div>`;
}

/* ── 앱 틀 ── */
function renderShell() {
  const nav = (icon, label, on) => `<div class="nav${on ? ' on' : ''}">${ic(icon)}${label}</div>`;
  $('#side').innerHTML = `<div class="office"><i>고</i>고덕 에스테잇 공인중개사</div>
    <div class="grp">시작</div>${nav('dashboard', '대시보드')}
    <div class="grp">매물·공간</div>${nav('building', '매물관리')}${nav('map', '관리단지')}${nav('megaphone', '광고관리')}
    <div class="grp">고객·상담</div>${nav('users', '고객 원장')}${nav('user', '연락처')}${nav('message', '상담분석')}
    <div class="grp">거래·계약</div>${nav('userSearch', '희망매물', true)}${nav('swap', '거래관리')}${nav('file', '계약서 관리')}${nav('wallet', '수수료/정산')}
    <div class="grp">업무·운영</div>${nav('checkSquare', '업무')}${nav('calendar', '캘린더')}`;
  $('#tabstrip').innerHTML = `<div class="t">${ic('building')}매물관리</div><div class="t on">${ic('userSearch')}희망매물</div>`;
}
for (const seg of document.querySelectorAll('.demo-seg')) {
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b || S[seg.id] === b.dataset.v) return;
    S[seg.id] = b.dataset.v;
    for (const x of seg.querySelectorAll('button')) x.setAttribute('aria-pressed', x === b);
    // 보이는 고객 수만 바꾼다. 시안에서 고친 내용(단계 · 메모 · 새 매칭 · 쓰던 글)은 그대로 남는다.
    if (seg.id === 'size') { S.sel.clear(); const open = S.peek && M(S.peek); if (open && open.extra && S.size !== 'many') S.peek = null; }
    render();
  });
}

loadData();
renderShell();
render();
})();
</script>
