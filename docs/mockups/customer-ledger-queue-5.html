<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고객 원장 — 앱 목록 화면 규격</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /*
   * 고객 원장 시안 5 (2026-11-19) — 4판의 내용은 그대로 두고, 모양을 앱의 목록 화면(연락처·매물관리) 규격에 맞췄다.
   * 치수는 앱 코드에서 읽은 값이다:
   *  - 도구 줄 두 줄 (contacts/index.tsx): 첫 줄 51px = 보기 탭(8px 트랙 + 흰 조각) + 알약 검색 + 추가 단추(30px, 모서리 8),
   *    둘째 줄 44px = 테두리 없는 거르기 칩("아이콘 이름 ⌄", 고르면 파란 알약) + 오른쪽 정렬·초기화.
   *  - 표 (data-table propertyListTone): 머리 36px · 13px/400 · 16px 아이콘(#8e8b86), 줄 37px, 본문 14px/21px 굵기 450,
   *    칸 사이 옅은 세로선(#eeeeec), 줄에 올리면 뜨는 "열기" 단추(RowOpenButton),
   *    맨 앞 36px 체크박스 칸(머리에서 모두 고르기)과, 고르면 표 위에 뜨는 36px 선택 줄("N명 선택됨 · 일괄 작업 · 선택 해제").
   *  - 상세 패널 (contacts/-quick-sheet.tsx): 584px, 위 막대 44px, 머리(이름 23px · 연락 수단 · 꼬리표) 아래 선,
   *    본문 구역 제목 13px/600 + 건수 + 오른쪽 글자 단추, 목록은 옅은 가로선, 아래 막대(둥근 단추 + 검은 "상담 기록").
   *  - 꼬리표·상태: 모서리 4px, 12px/500, 높이 20px, 상태는 앞에 점.
   * 내용(4판과 같음): 최근 상담 순, 의뢰는 구함·내놓음 두 표시만, 상태는 파악 중 / 진행 중 / 종료, 다음 연락 기능 없음.
   * 바뀐 것: 연락처를 따로 칸으로 뺐다("열기" 단추가 전화번호를 가리지 않게). 상담 적기는 패널 아래 막대의 "상담 기록"으로 옮겼다.
   */
  :root {
    --bg: #fff; --fg: #2c2c2b; --ink: #2f2e2a; --fg2: #5f5e5b; --muted: #79766f; --soft: #6f6c66; --faint: #a9a7a1; --icon: #8e8b86;
    --border: rgba(42, 28, 0, 0.09); --vline: #eeeeec; --div: #f1f0ec; --head-line: #ecebe8; --side: #f9f8f7;
    --hover: rgba(60, 52, 40, 0.06); --row-hover: #f8f7f6; --row-open: #f3f2f0;
    --blue: #2383e2; --green: #44745a; --green-soft: #eef3ed; --amber: #8f6b1f; --amber-soft: #fbf3db;
    --pop: 0 14px 28px rgba(25, 25, 25, 0.08), 0 4px 8px rgba(25, 25, 25, 0.04), 0 0 0 1px rgba(42, 28, 0, 0.08);
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { overflow: hidden; background: var(--bg); color: var(--fg); font: 14px/21px "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { padding: 0; border: 0; background: none; cursor: pointer; text-align: inherit; }
  h1, h2, h3, h4, p, ul, ol { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  svg { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 2px solid rgba(35, 131, 226, 0.6); outline-offset: 1px; border-radius: 6px; }
  body[data-mouse] :focus-visible:not(input):not(textarea) { outline: none; }
  .num { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* 앱 틀 (시안용 흉내) */
  .win { display: grid; grid-template-rows: 36px minmax(0, 1fr); height: 100vh; }
  .titlebar { display: flex; align-items: stretch; border-bottom: 1px solid var(--border); background: var(--side); }
  .titlebar b { display: flex; align-items: center; width: 232px; padding-left: 16px; font-weight: 600; letter-spacing: -0.02em; }
  .titlebar span { display: flex; align-items: center; gap: 8px; width: 180px; padding: 0 12px; background: var(--bg); border: 1px solid var(--border); border-bottom: 0; margin-top: 3px; border-radius: 6px 6px 0 0; font-size: 13px; }
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 0; }
  .nav { background: var(--side); border-right: 1px solid var(--border); padding: 8px; overflow: auto; }
  .nav p { padding: 10px 8px 4px; font-size: 12px; color: var(--muted); }
  .nav a { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 6px; color: var(--fg2); text-decoration: none; }
  .nav a svg { color: var(--icon); width: 16px; height: 16px; }
  .nav a[aria-current] { background: rgba(33, 27, 23, 0.07); color: var(--fg); font-weight: 500; }
  .main { position: relative; display: flex; min-width: 0; min-height: 0; overflow: hidden; }
  .list { display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; }

  /* 도구 줄 첫 줄: 보기 탭 + 검색 + 추가 */
  .tb1 { display: flex; flex: none; align-items: center; gap: 8px; height: 51px; padding: 0 12px; border-bottom: 1px solid var(--border); }
  .tabs { display: flex; flex: none; align-items: center; gap: 2px; height: 30px; padding: 2px; border-radius: 8px; background: #f6f5f3; box-shadow: inset 0 0 0 1px #f0efec; }
  .tab { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 12px; border-radius: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; transition: color 120ms; }
  .tab:hover { color: var(--fg); }
  .tab[aria-selected="true"] { background: #fff; color: var(--fg); font-weight: 500; box-shadow: 0 1px 2px rgba(40, 35, 25, 0.1); }
  .tab i { font-style: normal; font-weight: 400; font-size: 12px; color: var(--faint); }
  .search { display: flex; flex: 1; align-items: center; gap: 8px; min-width: 160px; max-width: 360px; height: 30px; padding: 0 14px; border-radius: 15px; background: #f1f0ec; cursor: text; transition: background-color 120ms; }
  .search:hover { background: #ebeae6; }
  .search:focus-within { background: #fff; box-shadow: inset 0 0 0 1px rgba(55, 53, 47, 0.3); }
  .search svg { color: var(--muted); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 13px; }
  .search input::placeholder { color: var(--muted); }
  .primary { display: inline-flex; flex: none; align-items: center; gap: 6px; height: 30px; margin-left: auto; padding: 0 12px; border-radius: 8px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 500; white-space: nowrap; transition: background-color 120ms, transform 160ms var(--ease); }
  .primary:hover { background: #1f1e1b; }
  .primary:active { transform: scale(0.97); }

  /* 둘째 줄: 거르기 칩 + 정렬 */
  .tb2 { display: flex; flex: none; align-items: center; gap: 8px; min-height: 44px; padding: 6px 12px; border-bottom: 1px solid var(--border); }
  .chips { display: flex; flex: 1; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
  .chip { display: inline-flex; align-items: center; height: 28px; border-radius: 14px; font-size: 13px; color: var(--soft); transition: background-color 120ms, color 120ms; }
  .chip:hover, .chip.open { background: var(--hover); color: var(--fg); }
  .chip > button:first-child { display: inline-flex; align-items: center; gap: 6px; height: 100%; padding: 0 10px; border-radius: 14px; }
  .chip svg { color: #a3a09a; }
  .chip .caret { width: 12px; height: 12px; }
  .chip.on { background: rgba(35, 131, 226, 0.1); color: var(--blue); }
  .chip.on:hover { background: rgba(35, 131, 226, 0.15); color: var(--blue); }
  .chip.on svg { color: currentColor; }
  .chip.on > button:first-child { padding-right: 4px; }
  .chip.on b { font-weight: 600; }
  .chip .x { display: grid; place-items: center; width: 20px; height: 20px; margin-right: 4px; border-radius: 50%; }
  .chip .x:hover { background: rgba(35, 131, 226, 0.18); }
  .chip .x svg { width: 12px; height: 12px; }
  .ghost { display: inline-flex; flex: none; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; font-size: 13px; color: var(--soft); white-space: nowrap; transition: background-color 120ms, color 120ms; }
  .ghost:hover { background: var(--hover); color: var(--fg); }
  .ghost svg { width: 13px; height: 13px; }

  /* 표: 매물관리 표 규격 */
  .scroll { position: relative; flex: 1; min-height: 0; overflow: auto; }
  .tbl { display: grid; grid-template-columns: 36px 172px 132px minmax(220px, 1fr) 124px 100px 116px; min-width: 900px; }
  .tr { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; }
  .tr.head { position: sticky; top: 0; z-index: 3; background: var(--bg); }
  .th, .td { display: flex; align-items: center; min-width: 0; padding: 0 10px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--vline); white-space: nowrap; overflow: hidden; }
  .th:last-child, .td:last-child { border-right: 0; }
  .th { gap: 6px; height: 36px; font-size: 13px; color: var(--muted); }
  .th svg { width: 16px; height: 16px; color: var(--icon); stroke-width: 1.5; }
  .td { height: 37px; font-weight: 450; }
  .row { cursor: pointer; }
  .row:hover .td, .row:focus-within .td { background: var(--row-hover); }
  .row.picked .td { background: rgba(47, 46, 42, 0.04); }
  .row.sel .td { background: var(--row-open); }
  /* 체크박스 칸: 앱의 표와 같은 14px · 모서리 4px, 고르면 먹색으로 찬다 */
  .c-pick { justify-content: center; padding: 0; }
  .cb { position: relative; display: grid; place-items: center; width: 14px; height: 14px; border-radius: 4px; background: var(--bg); box-shadow: inset 0 0 0 1px #cfcdc8, 0 1px 2px rgba(0, 0, 0, 0.05); color: #fff; transition: box-shadow 120ms, background-color 120ms; }
  .cb::after { content: ""; position: absolute; inset: -10px; } /* 누르는 자리를 넓힌다 */
  .cb:hover { box-shadow: inset 0 0 0 1px #a3a09a, 0 1px 2px rgba(0, 0, 0, 0.05); }
  .cb svg { width: 11px; height: 11px; stroke-width: 3; display: none; }
  .cb[aria-checked="true"], .cb[aria-checked="mixed"] { background: var(--ink); box-shadow: none; }
  .cb[aria-checked="true"] .ck, .cb[aria-checked="mixed"] .mn { display: block; }
  /* 선택 줄: 고른 줄이 있을 때만 표 위에 뜬다 */
  .selbar { display: flex; flex: none; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-bottom: 1px solid var(--border); background: #faf9f8; font-size: 12px; }
  .selbar[hidden] { display: none; }
  .selbar b { font-weight: 500; }
  .selbar .sep { width: 1px; height: 12px; background: rgba(42, 28, 0, 0.14); }
  .selbar .act { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 6px; color: var(--fg2); transition: background-color 120ms, color 120ms; }
  .selbar .act:hover { background: var(--hover); color: var(--fg); }
  .selbar .act svg { width: 12px; height: 12px; }
  .selbar .clear { margin-left: auto; color: var(--muted); border-radius: 4px; }
  .selbar .clear:hover { color: var(--fg); }
  .row.flash .td { animation: flash 1.4s ease-out; }
  @keyframes flash { from { background: #fdf3dc; } }
  @media (prefers-reduced-motion: reduce) { .row.flash .td { animation: none; } }
  .c-who { position: relative; }
  .who { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; border-radius: 4px; font-weight: 500; }
  /* 앱의 RowOpenButton 과 같은 모양·자리 */
  .ro { position: absolute; right: 4px; top: 50%; z-index: 2; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px 0 4px; transform: translateY(-50%); border-radius: 6px; background: var(--bg); box-shadow: 0 8px 12px rgba(25, 25, 25, 0.027), 0 2px 6px rgba(25, 25, 25, 0.027), 0 0 0 1px rgba(42, 28, 0, 0.07); font-size: 12px; font-weight: 500; letter-spacing: 0.5px; color: #7d7a75; white-space: nowrap; opacity: 0; pointer-events: none; }
  .ro svg { width: 15px; height: 20px; stroke-width: 1.25; color: var(--icon); }
  .ro:hover { background: #f6f5f4; }
  .row:hover .ro, .row:focus-within .ro { opacity: 1; pointer-events: auto; }
  @media (hover: none) { .ro { opacity: 1; pointer-events: auto; } }
  .tel { color: var(--fg2); }
  .log { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .log time { flex: none; color: var(--muted); }
  .log span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .none { color: var(--faint); }
  .owner { color: var(--fg2); overflow: hidden; text-overflow: ellipsis; }
  .row.is-closed .who, .row.is-closed .log span, .row.is-closed .tel, .row.is-closed .owner { color: var(--muted); }
  .empty { grid-column: 1 / -1; padding: 64px 16px; text-align: center; font-size: 13px; color: var(--muted); }
  .empty button { display: inline-flex; margin-top: 10px; }

  /* 꼬리표와 상태: 모서리 4px, 12px/500, 높이 20px */
  .tags { display: inline-flex; align-items: center; gap: 4px; }
  .tag, .st { display: inline-flex; flex: none; align-items: center; height: 20px; padding: 0 6px; border-radius: 4px; font-size: 12px; font-weight: 500; line-height: 20px; white-space: nowrap; }
  .tag { color: var(--fg2); }
  .tag.buy { box-shadow: inset 0 0 0 1px var(--border); }
  .tag.sell, .tag.plain { background: #f1f1ef; }
  .st { gap: 5px; }
  .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .st.ask { background: #f1f1ef; color: var(--fg2); }
  .st.ask::before { background: #9b9a97; }
  .st.go { background: var(--green-soft); color: var(--green); }
  .st.hold { background: var(--amber-soft); color: var(--amber); }
  .st.closed { box-shadow: inset 0 0 0 1px var(--border); color: var(--muted); }
  .st.closed::before { background: none; box-shadow: inset 0 0 0 1.5px #b9b6b0; }

  /* 아래 줄: 건수와 알림 (알림이 줄을 가리지 않게 여기에 띄운다) */
  .foot { display: flex; flex: none; align-items: center; gap: 12px; height: 32px; padding: 0 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .foot .msg { display: inline-flex; align-items: center; gap: 8px; color: var(--fg); }
  .foot .msg button { height: 22px; padding: 0 8px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--border); font-weight: 500; }
  .foot .msg button:hover { background: var(--hover); }
  .foot .right { margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 상세 패널: 연락처 패널과 같은 틀 */
  .peek { position: absolute; top: 0; right: 0; bottom: 0; z-index: 20; display: none; flex-direction: column; width: 584px; max-width: 100%; border-left: 1px solid var(--border); background: var(--bg); box-shadow: -2px 0 8px rgba(0, 0, 0, 0.03); outline: none; }
  .peek-open .peek { display: flex; }
  .peek.slide { animation: slide 240ms var(--ease); }
  @keyframes slide { from { transform: translateX(24px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .peek.slide { animation: none; } }
  .pk-bar { display: flex; flex: none; align-items: center; gap: 2px; height: 44px; padding: 0 12px; }
  .ib { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 4px; color: var(--muted); transition: background-color 120ms, color 120ms; }
  .ib svg { width: 20px; height: 20px; stroke-width: 1.5; }
  .ib.sm svg { width: 16px; height: 16px; }
  .ib:hover { background: var(--hover); color: var(--fg); }
  .pk-head { flex: none; padding: 0 24px 16px; border-bottom: 1px solid var(--head-line); }
  .pk-head h2 { font-size: 23px; line-height: 1.25; font-weight: 700; letter-spacing: -0.025em; color: var(--ink); overflow-wrap: anywhere; }
  .pk-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin-top: 8px; font-size: 13px; }
  .pk-meta span { display: inline-flex; align-items: center; gap: 6px; }
  .pk-meta svg { color: var(--faint); }
  .pk-meta .dim { color: var(--muted); }
  .pk-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 14px; }
  .pk-body { flex: 1; min-height: 0; overflow: auto; padding: 20px 24px 40px; }
  .sec + .sec { margin-top: 28px; }
  .sec h3 { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; line-height: 21px; font-weight: 600; color: var(--ink); }
  .sec h3 i { font-style: normal; font-weight: 500; color: var(--faint); }
  .sec h3 .acts { display: flex; gap: 12px; margin-left: auto; }
  .ta { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; color: var(--muted); border-radius: 4px; }
  .ta:hover { color: var(--fg); }
  .ta svg { width: 12px; height: 12px; }
  .rows > * { border-top: 1px solid var(--div); }
  .rows > *:first-child { border-top: 0; }
  .emptytext { padding: 12px; border-radius: 8px; background: #fbfaf8; font-size: 12px; color: var(--muted); }
  /* 의뢰 한 건 */
  .it { padding: 10px 0; }
  .it-1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .it-1 .tag { min-width: 46px; justify-content: center; } /* 구함·내놓음 너비를 맞춰 뒤 글자의 시작을 가지런히 한다 */
  .it-1 .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; color: var(--ink); }
  .it-1 .t em { margin-right: 6px; font-style: normal; font-weight: 400; color: var(--muted); }
  .it-2 { margin-top: 3px; font-size: 12px; line-height: 18px; color: var(--muted); }
  .it.over .t { color: var(--muted); font-weight: 400; }
  /* 중개 건: 사람이 정한 순서를 왼쪽 번호와 선으로 잇는다 */
  .case { padding: 10px 0 2px; }
  .case-h { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--ink); }
  .case-h svg { color: var(--icon); }
  .case-h small { font-size: 12px; font-weight: 400; color: var(--faint); }
  .steps { position: relative; margin-top: 4px; }
  .steps::before { content: ""; position: absolute; left: 8px; top: 22px; bottom: 22px; border-left: 1px solid var(--head-line); }
  .step { position: relative; padding: 8px 0 8px 28px; }
  .step::before { content: attr(data-n); position: absolute; left: 0; top: 10px; display: grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 1px #dcdad6; font-size: 10px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--muted); }
  .step.plain .it-1 .t { font-weight: 400; color: var(--fg2); }
  .sub-h { margin: 10px 0 0; padding-top: 12px; border-top: 1px solid var(--div); font-size: 12px; color: var(--faint); }
  /* 상담 한 건 */
  .lg { padding: 10px 0; }
  .lg-1 { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .lg p { margin-top: 6px; line-height: 22px; color: var(--ink); overflow-wrap: anywhere; white-space: pre-wrap; }
  .more { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 12px; color: var(--muted); border-radius: 4px; }
  .more:hover { color: var(--fg); }
  .memo { font-size: 13px; line-height: 1.6; color: var(--ink); overflow-wrap: anywhere; }
  /* 아래 막대 */
  .pk-foot { flex: none; border-top: 1px solid var(--head-line); padding: 12px 24px; }
  .bar { display: flex; align-items: center; gap: 4px; }

    const sel = !focusFid && fid && active?.selectionStart != null ? [active.selectionStart, active.selectionEnd] : null;
    const scrollTop = $('scroll').scrollTop;
    if (S.openId && !visible().some((c) => c.id === S.openId)) S.openId = null; // 거르기로 목록에서 사라진 손님의 패널은 닫는다 (적던 글은 손님별로 남아 있다)
    if (S.composeId && S.composeId !== S.openId) S.composeId = null;            // 적는 칸은 그 손님의 패널이 열려 있을 때만 열려 있다
    if (S.picked.size) { const shown = new Set(visible().map((c) => c.id)); for (const id of [...S.picked]) if (!shown.has(id)) S.picked.delete(id); } // 목록에서 빠진 손님은 고른 것에서도 뺀다
    drawToolbar(); drawSelbar(); drawTable(); drawStatus(); drawPeek(); drawPop();
    $('scroll').scrollTop = scrollTop;
    if (fid) { const el = document.querySelector(`[data-fid="${CSS.escape(fid)}"]`); if (el && !el.disabled) { el.focus({ preventScroll: !focusFid }); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch {} else if (focusFid === 'write') el.setSelectionRange(el.value.length, el.value.length); } }
    S.flash = null;
  }
  /** 그 손님의 줄이 표 안에 보이게 한다 (붙어 있는 머리글 아래로) */
  function reveal(id) {
    const sc = $('scroll'), row = document.querySelector(`[data-row="${id}"]`);
    if (!row) return;
    const top = row.offsetTop - HEAD, bottom = row.offsetTop + row.offsetHeight;
    if (top < sc.scrollTop) sc.scrollTop = top;
    else if (bottom > sc.scrollTop + sc.clientHeight) sc.scrollTop = bottom - sc.clientHeight;
  }

  /* ───────── 바꾸기 ───────── */
  function change(id, text, fn) { // 직전 변경 하나만 되돌릴 수 있다
    const c = byId(id); S.undo = { id, before: JSON.parse(JSON.stringify(c)) }; fn(c); S.msg = text; S.flash = id;
  }
  const ACT = {
    tab: (k) => { S.tab = k; },
    pick: (k) => { S.picked.has(k) ? S.picked.delete(k) : S.picked.add(k); },
    pickall: () => { const rows = visible(); const all = rows.every((c) => S.picked.has(c.id)); rows.forEach((c) => (all ? S.picked.delete(c.id) : S.picked.add(c.id))); },
    unpick: () => { S.picked.clear(); return 'pickall'; },
    sort: () => { S.sort = S.sort === 'name' ? 'recent' : 'name'; return 'sort'; },
    reset: () => { S.tab = 'all'; S.q = ''; S.owner = ''; S.status = ''; S.pop = null; return 'q'; },
    clear: (k) => { S[k] = ''; S.pop = null; return k; },
    say: (k) => { S.msg = k; S.undo = null; },
    pop: (k) => { S.pop = S.pop?.type === k ? null : { type: k, anchorFid: k }; return S.pop ? (k === 'owner' ? `own:${S.owner}` : `st:${S.status}`) : k; },
    setowner: (k) => { S.owner = k; S.pop = null; return 'owner'; },
    setstatus: (k) => { S.status = k; S.pop = null; return 'status'; },
    open: (k) => { S.slide = !S.openId; S.openId = S.openId === k ? null : k; return `reveal:${k}`; },
    close: () => { const id = S.openId; S.openId = null; return `reveal:${id}`; },
    morelogs: () => { const id = S.openId; S.moreLogs.has(id) ? S.moreLogs.delete(id) : S.moreLogs.add(id); return 'morelogs'; },
    compose: () => { const opening = S.composeId !== S.openId; S.composeId = opening ? S.openId : null; return opening ? 'write' : 'b-write'; },
    wkind: (k) => { const id = S.openId; S.writeDraft[id] = { ...writeOf(id), kind: k }; },
    wsave: () => { const id = S.openId; const w = writeOf(id); if (!w.text.trim()) return;
      change(id, `${byId(id).name} 님 상담을 적었습니다`, (c) => { c.logs.unshift({ date: TODAY, kind: w.kind, by: ME, text: w.text.trim(), seq: ++seq }); });
      delete S.writeDraft[id]; S.composeId = null; return `wrote:${id}`; },
    undo: () => { const u = S.undo; if (!u) return; customers = customers.map((c) => (c.id === u.id ? u.before : c)); S.msg = '되돌렸습니다'; S.undo = null; S.flash = u.id; return `reveal:${u.id}`; },
  };
  /** 누른 뒤 포커스 처리. reveal: 은 그 줄로, wrote: 는 줄이 맨 위로 옮겨 가도 패널의 "상담 기록" 단추에 머문다. */
  function finish(focus) {
    const m = typeof focus === 'string' && focus.match(/^(reveal|wrote):(.+)$/);
    render(m ? undefined : focus);
    if (!m) return;
    const el = (m[1] === 'wrote' && document.querySelector('[data-fid="b-write"]')) || document.querySelector(`[data-fid="row:${m[2]}"]`);
    el?.focus({ preventScroll: true }); reveal(m[2]);
    if (m[1] === 'wrote') { const body = document.querySelector('.pk-body'), sec = document.querySelector('.sec[aria-label="상담"]'); if (body && sec) body.scrollTop = Math.max(0, sec.offsetTop - body.offsetTop - 12); } // 방금 적은 상담이 보이게
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-a]');
    if (b && !b.disabled && ACT[b.dataset.a]) { finish(ACT[b.dataset.a](b.dataset.k, b)); return; }
    if (S.pop && !e.target.closest('.pop')) { S.pop = null; render(); return; }
    const row = e.target.closest('[data-row]');
    if (row && !e.target.closest('button, a, input, textarea')) finish(ACT.open(row.dataset.row));
  });
  document.addEventListener('input', (e) => {
    const v = e.target.value;
    if (e.target.id === 'q') { S.q = v; render(); return; }
    // 다시 그리지 않는다 (한글 조합이 끊기지 않게)
    if (e.target.dataset?.in === 'write') { const id = S.openId; S.writeDraft[id] = { ...writeOf(id), text: v }; document.querySelector('[data-a="wsave"]').disabled = !v.trim(); grow(); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.isComposing) return;
    if (e.key === 'Escape') { // 안쪽부터 닫는다: 떠 있는 판 → 상담 적는 칸 → 패널
      if (S.pop) { e.preventDefault(); const fid = S.pop.anchorFid; S.pop = null; render(fid); return; }
      if (e.target.id === 'q' && S.q) { e.preventDefault(); S.q = ''; render('q'); return; }
      if (S.composeId) { e.preventDefault(); S.composeId = null; render('b-write'); return; }
      if (S.openId) { e.preventDefault(); const id = S.openId; S.openId = null; render(`row:${id}`); }
      return;
    }
    if (e.key === 'Enter' && !e.shiftKey && e.target.dataset?.in === 'write') { e.preventDefault(); document.querySelector('[data-a="wsave"]').click(); return; } // Shift+Enter 는 줄바꿈
    // 판 안에서는 Tab 과 ↑↓ 가 판을 벗어나지 않는다
    if (S.pop && ['Tab', 'ArrowDown', 'ArrowUp'].includes(e.key)) { const items = [...document.querySelectorAll('.pop button')]; const at = items.indexOf(document.activeElement); const back = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      e.preventDefault(); items[(at + (back ? -1 : 1) + items.length) % items.length].focus(); return; }
    // 줄 사이를 ↑↓ 로 옮긴다. 패널이 열려 있으면 내용도 따라간다.
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.closest?.('[data-row]') && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) {
      const order = visible(); const at = order.findIndex((c) => c.id === e.target.closest('[data-row]').dataset.row); const next = order[at + (e.key === 'ArrowDown' ? 1 : -1)];
      if (next) { e.preventDefault(); const onPick = e.target.dataset.a === 'pick'; if (S.openId) S.openId = next.id; finish(`reveal:${next.id}`); if (onPick) document.querySelector(`[data-fid="pick:${next.id}"]`)?.focus({ preventScroll: true }); }
    }
  });
  addEventListener('pointerdown', () => { document.body.dataset.mouse = '1'; }, true);
  addEventListener('keydown', (e) => { if (!['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) delete document.body.dataset.mouse; }, true);
  addEventListener('resize', place);
  render();
  window.__S = S; window.__customers = () => customers; window.__statusOf = statusOf;
})();
</script>
</body>
</html>
