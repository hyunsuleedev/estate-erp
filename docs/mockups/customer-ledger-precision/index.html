let current='clean',compare=false,mode='all',query='',agent='',sort='created:desc',collapsed=new Set(),activeCustomer=1,timer;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],icon=id=>`<svg aria-hidden="true"><use href="#${id}"/></svg>`,esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='estate-ledger-precision-clean-v1';try{const prefs=JSON.parse(localStorage.getItem(KEY));if(prefs&&['default','created:desc','name:asc','min:desc','min:asc','max:desc','max:asc'].includes(prefs.sort))sort=prefs.sort;const notes=JSON.parse(localStorage.getItem(KEY+'-notes'));if(notes)customers.forEach(c=>{if(typeof notes[c.id]==='string')c.note=notes[c.id]})}catch{}
function money(n){return Math.floor(n/10000)+'억'+(n%10000?' '+(n%10000).toLocaleString():'')}
function visible(){let list=customers.filter(c=>(!agent||c.agent===agent)&&(!query||[c.name,c.phone,c.note,...c.intents.map(i=>i.site)].join(' ').includes(query))&&(mode==='all'||c.intents.some(i=>i.kind===mode)));let [field,dir]=sort.split(':');if(field==='default'){field='created';dir='desc'}return list.sort((a,b)=>{const val=c=>['min','max'].includes(field)?(field==='min'?Math.min(...c.intents.map(i=>i.min)):Math.max(...c.intents.map(i=>i.max))):c[field];const x=val(a),y=val(b);return (typeof x==='string'?x.localeCompare(y,'ko'):x-y)*(dir==='asc'?1:-1)||a.id-b.id})}
function storeSort(){try{localStorage.setItem(KEY,JSON.stringify({sort}))}catch{notify('저장이 제한되어 이번 화면에서만 정렬을 유지합니다.')}}
function nav(){return `<aside class="side"><div class="logo">${icon('logo')}estait</div><div class="side-label first">워크스페이스</div><span class="nav-item">${icon('grid')}대시보드</span><span class="nav-item">${icon('building')}매물관리</span><span class="nav-item">${icon('building')}관리단지</span><div class="side-label">고객·상담</div><span class="nav-item active" aria-current="page">${icon('users')}고객원장</span><span class="nav-item">${icon('users')}연락처</span><span class="nav-item">${icon('note')}상담기록</span><div class="side-label">거래·업무</div><span class="nav-item">${icon('note')}거래관리</span><span class="nav-item">${icon('calendar')}일정</span><div class="side-profile">서지현<small>고덕 부동산</small></div></aside>`}
function customer(c){const open=!collapsed.has(c.id);return `<section class="customer" aria-label="${esc(c.name)} 고객"><header class="customer-header"><button class="collapse" data-collapse="${c.id}" aria-expanded="${open}" aria-label="${esc(c.name)} 의뢰 ${open?'접기':'펼치기'}">${icon('down')}</button><span class="monogram" aria-hidden="true">${c.name[0]}</span><span class="customer-identity"><button class="customer-name" data-note="${c.id}">${esc(c.name)}</button><span class="customer-phone">${c.phone}</span></span><button class="customer-note" data-note="${c.id}" title="${esc(c.note)}" aria-label="${esc(c.name)} 상담 기록">${esc(c.note)}</button><span class="contact-date ${c.today?'today':''}">${c.contact}</span><span class="customer-agent">${c.agent}</span></header>${open?c.intents.filter(i=>mode==='all'||i.kind===mode).map((i,k)=>`<div class="intent"><div><span class="type ${i.kind}">${i.kind==='buy'?'구함':'내놓음'}</span><span class="property" title="${i.site}">${i.site}</span></div><div><span class="transaction">${i.tx}</span></div><div class="money">${money(i.min)}</div><div class="money">${money(i.max)}</div><div>${i.area}</div><div><button class="match" data-match="${c.id}" data-match-title="${i.site}" data-count="${i.matches}" aria-label="${c.name} ${i.site} 매칭 보기">${i.matches}건</button></div></div><div class="context"><span class="details">${i.desc}</span><span class="stage">${i.stage}</span></div>`).join(''):''}</section>`}
function view(d){const list=visible();const arrow=field=>sort.startsWith(field+':')?(sort.endsWith('desc')?' ↓':' ↑'):'';return `${nav()}<div class="work"><header class="page-top"><div><span class="chapter">${d.id==='clean'?'고객·상담':'CLIENT REGISTER'}</span><h1>고객원장</h1><p class="page-description">고객의 의뢰와 상담을 한곳에서 관리하세요.</p></div><div class="page-actions"><button class="primary" data-write>${icon('plus')}상담 기록</button></div></header><div class="toolbar"><div class="view-tabs" aria-label="거래 보기">${[['all','전체'],['buy','구함'],['sell','내놓음']].map(([id,label])=>`<button data-mode="${id}" aria-pressed="${mode===id}">${label}<small>${customers.filter(c=>id==='all'||c.intents.some(i=>i.kind===id)).length}</small></button>`).join('')}</div><label class="search">${icon('search')}<input data-search aria-label="${d.name} 고객 검색" value="${esc(query)}" placeholder="고객, 전화번호, 매물"></label><select class="sort" data-sort aria-label="${d.name} 정렬">${[['created:desc','최근 등록순'],['name:asc','이름순'],['min:desc','최소예산 높은 순'],['min:asc','최소예산 낮은 순'],['max:desc','최대예산 높은 순'],['max:asc','최대예산 낮은 순'],['default','정렬 해제 · 기본 순서']].map(([value,label])=>`<option value="${value}" ${sort===value?'selected':''}>${label}</option>`).join('')}</select></div><div class="filterbar"><select data-agent aria-label="${d.name} 담당자"><option value="">담당자 전체</option>${['서지현','이민호'].map(a=>`<option ${agent===a?'selected':''}>${a}</option>`).join('')}</select><button data-reset ${!query&&!agent&&mode==='all'?'hidden':''}>필터 초기화</button><span class="count">고객 ${list.length}명</span><button data-collapse-all>${list.length&&list.every(c=>collapsed.has(c.id))?'모두 펼치기':'모두 접기'}</button></div><div class="list-scroll" tabindex="0" role="region" aria-label="${d.name} 고객 목록"><div class="column-head"><span>의뢰 · 지역 / 매물</span><span>거래</span><button data-header-sort="min" class="${arrow('min')?'active-sort':''}" aria-label="최소예산 정렬">최소예산${arrow('min')}</button><button data-header-sort="max" class="${arrow('max')?'active-sort':''}" aria-label="최대예산 정렬">최대예산${arrow('max')}</button><span>평형</span><span>매칭</span></div>${list.length?list.map(customer).join(''):'<div class="empty">검색 결과가 없습니다.<button data-reset>검색·필터 초기화</button></div>'}</div><footer class="work-footer"><span>가상 데이터 · 스타일 검토용</span><span>금액: 만원 · 면적: 평</span></footer></div>`}
function render(focus){const scrolls={};$$('.direction').forEach(v=>{const s=v.querySelector('.list-scroll');scrolls[v.dataset.style]=s?{top:s.scrollTop,left:s.scrollLeft}:null});$('#canvas').innerHTML=directions.map(d=>`<div class="view-caption" ${compare?'':'hidden'}><strong>${d.name} — ${d.axis}</strong><button data-pick="${d.id}">이 안 크게 보기</button></div><article class="direction ${d.id}" data-style="${d.id}" ${!compare&&d.id!==current?'hidden':''}>${view(d)}</article>`).join('')+(compare?'<div class="compare-footer">각 안은 같은 너비로 표시됩니다. 축소 이미지 대신 위아래로 스크롤하며 비교하세요.</div>':'');$$('.direction').forEach(v=>{const s=v.querySelector('.list-scroll'),pos=scrolls[v.dataset.style];if(pos){s.scrollTop=pos.top;s.scrollLeft=pos.left}});document.body.classList.toggle('compare-mode',compare);$$('.picker [data-pick]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.pick===current&&!compare));$('#compare').setAttribute('aria-pressed',compare);$('#compare').textContent=compare?'한 안씩 보기':'두 안 함께 보기';const d=directions.find(d=>d.id===current);$('#direction-note').innerHTML=`<strong>${d.name}</strong><span>${d.axis}</span><span class="cost">${d.cost}</span>`;if(focus){const el=$(`[data-style="${focus.style}"] ${focus.selector}`);el?.focus();if(focus.pos!=null)el?.setSelectionRange(focus.pos,focus.pos)}}
function choose(id){current=id;compare=false;render();window.scrollTo(0,0)}
function reset(){query='';agent='';mode='all';render()}
function notify(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,2400)}
function openNote(id){activeCustomer=id;const c=customers.find(c=>c.id===id);$('#note-title').textContent=c.name+' · 상담 기록';$('#previous-note').textContent=c.note;$('#note-input').value='';$('#note-dialog').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const v=b.closest('[data-style]')?.dataset.style;if(b.dataset.pick){choose(b.dataset.pick);return}if(b.id==='compare'){compare=!compare;render();window.scrollTo(0,0)}if(b.dataset.mode){mode=b.dataset.mode;render({style:v,selector:`[data-mode="${mode}"]`})}if(b.hasAttribute('data-reset'))reset();if(b.dataset.collapse){const id=Number(b.dataset.collapse);collapsed.has(id)?collapsed.delete(id):collapsed.add(id);render({style:v,selector:`[data-collapse="${id}"]`})}if(b.hasAttribute('data-collapse-all')){const list=visible(),expand=list.every(c=>collapsed.has(c.id));list.forEach(c=>expand?collapsed.delete(c.id):collapsed.add(c.id));render({style:v,selector:'[data-collapse-all]'})}if(b.dataset.headerSort){const f=b.dataset.headerSort;sort=sort===f+':desc'?f+':asc':sort===f+':asc'?'default':f+':desc';storeSort();render({style:v,selector:`[data-header-sort="${f}"]`})}if(b.dataset.note)openNote(Number(b.dataset.note));if(b.hasAttribute('data-write')){const c=visible()[0];if(c)openNote(c.id);else notify('검색·필터를 초기화한 뒤 고객을 선택하세요.')}if(b.dataset.match){$('#match-title').textContent=b.dataset.matchTitle;$('#match-body').innerHTML=`<p>연결된 매칭 <strong>${b.dataset.count}건</strong></p><p style="margin-top:12px">스타일 비교를 위한 가상 데이터입니다. 실제 후보 정보는 연결하지 않았습니다.</p>`;$('#match-dialog').showModal()}if(b.dataset.close)$('#'+b.dataset.close).close()});
function updateResults(){const list=visible();$$('.direction').forEach(v=>{const scroll=v.querySelector('.list-scroll');scroll.querySelectorAll('.customer,.empty').forEach(el=>el.remove());scroll.insertAdjacentHTML('beforeend',list.length?list.map(customer).join(''):'<div class="empty">검색 결과가 없습니다.<button data-reset>검색·필터 초기화</button></div>');v.querySelector('.count').textContent='고객 '+list.length+'명';v.querySelector('[data-reset]').hidden=!query&&!agent&&mode==='all';const input=v.querySelector('[data-search]');if(input!==document.activeElement)input.value=query;v.querySelector('[data-collapse-all]').textContent=list.length&&list.every(c=>collapsed.has(c.id))?'모두 펼치기':'모두 접기'})}
document.addEventListener('input',e=>{if(e.target.hasAttribute('data-search')){query=e.target.value;updateResults()}});
document.addEventListener('change',e=>{const v=e.target.closest('[data-style]')?.dataset.style;if(e.target.hasAttribute('data-sort')){sort=e.target.value;storeSort();render({style:v,selector:'[data-sort]'})}if(e.target.hasAttribute('data-agent')){agent=e.target.value;render({style:v,selector:'[data-agent]'})}});
$('#note-form').onsubmit=e=>{e.preventDefault();const val=$('#note-input').value.trim();if(!val)return;customers.find(c=>c.id===activeCustomer).note=val;let saved=true;try{localStorage.setItem(KEY+'-notes',JSON.stringify(Object.fromEntries(customers.map(c=>[c.id,c.note]))))}catch{saved=false}$('#note-dialog').close();render();notify(saved?'상담 메모를 저장했습니다.':'이번 화면에 상담 메모를 반영했습니다.')};
document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(['1','2'].includes(e.key)){e.preventDefault();choose(directions[Number(e.key)-1].id)}if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const i=directions.findIndex(d=>d.id===current);choose(directions[(i+(e.key==='ArrowRight'?1:directions.length-1))%directions.length].id)}});
const hash=location.hash.slice(1);if(directions.some(d=>d.id===hash))current=hash;render();
</script></body></html>
